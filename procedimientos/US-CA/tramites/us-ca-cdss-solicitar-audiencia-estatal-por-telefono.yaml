notes: La página de solicitudes de CDSS lista Medi-Cal Dental entre los programas que se pueden apelar («Medi-Cal
  Benefits (Medical, Dental, ...)»). Las direcciones postales no coinciden entre documentos de CDSS (MS 21-37 en la
  página de la División, NA Back 9 y PUB 13; Mail Station 9-17-442 en la página de solicitudes; M.S. 9-17-37 en el DPA
  19); aquí se usa la de la hoja NA Back 9. No se encontró en fuentes oficiales abiertas el horario de la línea. Las
  páginas de DHCS y del Código de Bienestar e Instituciones no se pudieron abrir para esta versión.
