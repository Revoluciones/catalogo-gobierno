notes: No hay reportes de llamadas al EDD; todo lo de esta ficha viene de páginas del EDD. La guía DE 2321 dice que el
  reclamo empieza el domingo de la semana en que lo pides; ninguna página abierta pone otro plazo para pedirlo. La
  apelación se manda por escrito a la dirección que trae tu aviso; si el EDD no cambia su decisión, la pasa a la Oficina
  de Apelaciones de la Junta de Apelaciones del Seguro de Desempleo de California (CUIAB), según la página de apelaciones
  del EDD.
