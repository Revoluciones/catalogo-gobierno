notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Tipo
  en el registro: programa de apoyo. Criterio para resolver: Presentada la solicitud y los documentos que acrediten
  el parentesco con el policía caído, se entregará el apoyo mensual alimentario y educacional equivalente a 50 UMAS,
  a cada uno de los hijos menores de edad y máximo de 23 años que se encuentren estudiando ininterrumpidamente y
  que no hayan contraído matrimonio.'
