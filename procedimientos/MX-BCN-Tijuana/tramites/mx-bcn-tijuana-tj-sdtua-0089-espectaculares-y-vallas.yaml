  text: 'Licencia nueva con vigencia de hasta un año: Anuncio (autosoportado, autoportante o de cualquier otro tipo)
    de propaganda comercial tipo espectacular, por anuncio: 260 UMA ($30,500.60) · Licencia nueva con vigencia de
    hasta un año: Anuncio tipo espectacular de pantalla electrónica y/o electromecánico o digital, incluye torre
    directorio de pantalla electrónica, pantalla en vehículos, con o sin movimiento, por cara de pantalla, por cartelera
    y/o estructura: 520 UMA ($61,001.20) · Licencia nueva con vigencia de hasta un año: Valla publicitaria de hasta
    12.50 M², por cada unidad: 52 UMA ($6,100.12) · Licencia nueva con vigencia de hasta un año: Valla publicitaria
    por cada M² excedente: 10.4 UMA ($1,220.02) · Licencia nueva con vigencia de hasta un año: Publicidad móvil
    remolcada: Con vehículo de tracción motriz de cuatro ruedas o más, en cualquier modalidad, sea en valla, cartelera
    giratoria, digital, etc., por 360 días, por unidad publicitaria (excepto pantalla electrónica): 97.5 UMA ($11,437.73)
    · Licencia nueva con vigencia de hasta un año: Publicidad móvil remolcada: Con vehículo de tracción motriz o
    no motriz menor de cuatro ruedas, en cualquier modalidad, sea en valla, cartelera giratoria, digital, etc.,
    por cara publicitada, por 180 días, de unidad publicitaria (excepto pantalla electrónica): 26 UMA ($3,050.06)
