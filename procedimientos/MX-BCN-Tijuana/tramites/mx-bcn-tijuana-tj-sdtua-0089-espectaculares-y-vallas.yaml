id: mx-bcn-tijuana-tj-sdtua-0089-espectaculares-y-vallas
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Negocios y trabajo, Emprendimiento
title: Espectaculares y Vallas
summary: Licencias de anuncios para publicidad variable, ya sea por espectaculares o vallas, para instalación de
  anuncios nuevos, regularización de ya instalados y/o revalidación de licencia anterior.
authority:
  name: Secretaría de Desarrollo Territorial y Urbano (Ayuntamiento de Tijuana)
  unit: Dirección de Administración Urbana
official_ids:
  homoclave: TJ-SDTUA-0089
who_can:
- Interesado
when: Para se requiera la licencia de las carteleras o espectaculares instaladas o con ánimo de instalar
result: Licencia
requirements:
- text: Llenar la solicitud y asegurarse de que la información sea precisa, deberá estar firmada por el perito responsable
    que firmo la memoria de cálculo
  cites:
  - source: remutys
  original_or_copy: original
- text: Recibo de pago de derechos
  cites:
  - source: remutys
  original_or_copy: original
- text: Recibo de impuesto predial vigente
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Documento que acredite la propiedad (Escrituras, título de propiedad, contrato de compra – venta, arrendamiento
    o comodato notariado y/o sentencia de juicio de prescripción, contrato de un empresa regularizadora)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Identificación oficial del propietario del predio, solicitante y/o arrendatario
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Domicilio y número del propietario del predio donde se encuentra ubicada la cartelera
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: 'Para personas morales: presentar copia de acta constitutiva y poderes legales'
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Croquis de localización detallado con referencia
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Memoria de cálculo firmada por el perito responsable, representantes legales, responsables y corresponsables.(mayor
    a 6m² y mayor a 3.00mts de altura)
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Póliza de responsabilidad civil y daños a terceros por cada estructura (Cobertura mínima de 18,250 salarios
    mínimos)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
