id: mx-bcn-tijuana-tj-sgm-0056-cambio-de-titular-giro-o-domicilio-envase-abierto
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Negocios y trabajo
title: Cambio de Titular, Giro o Domicilio Envase Abierto
summary: Este trámite es para actualizar o modificar el permiso de venta de bebidas alcohólicas en envase abierto.
  De acuerdo al Valor de 6.50 UMA se agregara el Porcentaje de Pago de Derechos Correspondiente a la Ley de Ingresos.
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Dirección de Bebidas Alcohólicas
official_ids:
  homoclave: TJ-SGM-0056
who_can:
- Interesado
when: Cuando se quiera cambiar de nombre del responsable o titular del permiso. · Cuando se quiera cambiar el giro
  del negocio. · Cuando se vaya a mover el negocio a una nueva dirección.
result: Licencia
requirements:
- text: Acudir personalmente con Identificación oficial con fotografía del interesado, representante o apoderado
    legal
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Presentar formato de solicitud expedido por la Dirección de Bebidas Alcohólicas, debiendo llenarlo bajo
    protesta de decir verdad
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Acta de nacimiento o acta constitutiva, según sea persona física o moral, y tratándose de persona moral,
    además acompañar poder notarial si el trámite se realiza mediante apoderado legal distinto al autorizado en
    el acta constitutiva de la sociedad
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Carta de no antecedentes penales y Constancia de residencia por 6 meses
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Presentar Cédula del Registro Federal de Contribuyentes
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Anexar original del permiso para operar la venta de bebidas alcohólicas
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Original del aviso de cierre temporal del establecimiento, en su caso
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Tratándose de cambio de titular con motivo de una cesión de derechos o una fusión, deberá presentar el documento
    público debidamente protocolizado por fedatario público respecto del permiso para la venta de bebidas alcohólicas
    que la contenga y haber cump
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Contar con certificado de no adeudo municipal, del cedente y cesionario
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Croquis o plano en que se indique, en forma clara y precisa, la ubicación del establecimiento y los nombres
    de las calles que corresponden a la manzana o área de ubicación del establecimiento
  cites:
  - source: remutys
  original_or_copy: original
- text: Original del Dictamen factible de uso de suelo, cuando proceda
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Presentar original del permiso de operación municipal definitivo expedido por la Dirección de Administración
    Urbana y la Tesorería Municipal, o en su caso, cuando proceda, Constancia de Actividades Mercantiles, acompañando
    la licencia de anuncios, rótulos
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Presentar Original del Certificado de Medidas de seguridad, emitido por la Dirección de Bomberos
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
cost:
  type: variable
  amount_mxn: null
  text: 'En los permisos que se solicite el cambio de giro, se cobrará la diferencia del valor del costo del permiso,
    y en los casos de disminución de la actividad, se cobrará 6.50 veces la Unidad de Medida y Actualización (UMA)
    vigente.: 6.5 UMA ($762.51) · Habiendo sido autorizado el cambio de titular o el cambio de domicilio, se pagará
    el 50% y el 15% respectivamente, sobre el valor de la expedición de un permiso nuevo del giro solicitado.: 0
    UMA ($0.00) · Habiendo sido autorizado el cambio de titular, cuando el nuevo titular adquiera los derechos por
    adjudicación hereditaria se pagará el 10%, sobre el valor de la expedición de un permiso nuevo del giro solicitado.:
    0 UMA ($0.00) · En caso de haber sido solicitados y autorizados el cambio de titular y el cambio de domicilio
    en el mismo trámite, se pagará el 55% sobre el valor de la expedición de un permiso nuevo del giro solicitado
    por ambos conceptos.: 0 UMA ($0.00). UMA 2026 = $117.31.'
  as_of: '2026-11-06'
  cites:
  - source: remutys
