notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Criterio
  para resolver: Identificación y clasificación de daños estructurales, verificación del cumplimiento de normativas
  vigentes, la emisión de recomendaciones para reparación o mitigación, y la documentación detallada del proceso
  en un informe técnico'
