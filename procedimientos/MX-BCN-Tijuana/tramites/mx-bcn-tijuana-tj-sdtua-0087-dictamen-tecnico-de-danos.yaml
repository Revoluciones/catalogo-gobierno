title: Dictamen Técnico de Daños
summary: Evaluación especializada que determina la presencia y el alcance de daños estructurales en edificaciones,
  tanto dentro del predio solicitante como en los colindantes afectados, cuyo objetivo principal es identificar
  cualquier deterioro que comprometa la seguridad y estabilidad de las estructuras, proporcionando recomendaciones
  técnicas para su reparación y la seguridad estructural del inmueble.
