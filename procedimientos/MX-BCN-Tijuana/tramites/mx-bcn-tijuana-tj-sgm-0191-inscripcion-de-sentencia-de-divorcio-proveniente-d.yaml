title: Inscripción de Sentencia de DIVORCIO proveniente de juzgado local
summary: Trámite que consiste en inscribir la sentencia de divorcio dictada por un juez, una vez que esta causa
  ejecutoria, y realizar las anotaciones correspondiente en el acta de matrimonio. Para realizarlo, es necesario
  acudir a la oficialía de registro civil en donde se celebró el matrimonio.
