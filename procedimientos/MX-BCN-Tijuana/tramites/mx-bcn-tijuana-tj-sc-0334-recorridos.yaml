summary: El Instituto Municipal de Arte y Cultura IMAC), a través de la coordinación de Vinculación Educativa, ofrecen
  recorridos guiados a las escuelas de la ciudad. Las visitas se realizan en las instalaciones del recinto, como
  las salas del Museo de Historia de Tijuana, Galería de la Ciudad, Espacio 5, Archivo Histórico y Casas de Cultura
  (Tijuana, Playas, San Antonio de los Buenos y El Pípila) con el objetivo de resaltar la importancia de preservar
  y proteger los bienes que integran el patrimonio cultural de la ciudad.
