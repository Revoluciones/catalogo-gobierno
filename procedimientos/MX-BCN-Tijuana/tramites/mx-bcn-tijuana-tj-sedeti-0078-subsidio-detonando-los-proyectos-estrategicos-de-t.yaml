id: mx-bcn-tijuana-tj-sedeti-0078-subsidio-detonando-los-proyectos-estrategicos-de-t
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Negocios y trabajo, Emprendimiento
title: Subsidio Detonando los Proyectos Estratégicos de Tijuana del Fideicomiso Fondos Tijuana
summary: Subsidio para organismos empresariales, clústeres, universidades, instituciones y asociaciones sin fines
  de lucro, legalmente constituidas, que necesiten apoyos para la realización de proyectos o eventos que promuevan
  la ciudad de Tijuana.
authority:
  name: Secretaría de Desarrollo Económico (Ayuntamiento de Tijuana)
  unit: Centro de Atención al Emprendedor
official_ids:
  homoclave: TJ-SEDETI-0078
who_can:
- Interesado
when: Cuando un organismo no gubernamental necesite el apoyo para realizar un evento o proyecto que detone el desarrollo
  económico del Municipio de Tijuana
result: Subsidio
requirements:
- text: Cédula del proyecto (Proforma Fondos Tijuana y aviso de privacidad)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Solicitud en hoja membretada en la que se describa el Evento o Proyecto a realizar, incluyendo el monto
    solicitado, así como el costo total, firmado por el Representante o Apoderado Legal del Organismo Ejecutor
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Acta Constitutiva con inscripción en el Registro Público de la Propiedad y Comercio
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Poder General para pleitos y Cobranza, Actos de Administración y para suscribir, endosar y firmar todo título
    de Crédito, así como identificación oficial vigente (INE, Pasaporte o Cédula Profesional), del Representante
    o Apoderado Legal del Organismo
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Constancia de Situación Fiscal del Organismo Ejecutor, no mayor a (2) meses
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Comprobante de domicilio (agua luz o teléfono), del domicilio fiscal del Organismo Ejecutor, no mayor a
    dos (2) meses
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Proyecto Ejecutivo del Evento o Proyecto firmado por el Representante Legal del Organismo Ejecutor en todas
    las hojas que lo integren
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Carta compromiso de que conoce las reglas de operación vigentes y lineamentos para su correcta aplicación
    y comprobación
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Presentar cotización de los conceptos para lo que solicita el subsidio y/o evento. En caso de aplicar para
    la elaboración del proyecto deberá presentar tres (3) cotizaciones no mayores a 30 días (en hoja membretada
    y con sello o firma del proveedor)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
