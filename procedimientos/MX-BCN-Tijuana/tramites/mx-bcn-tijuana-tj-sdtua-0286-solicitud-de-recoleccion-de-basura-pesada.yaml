notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Criterio
  para resolver: La solicitud será resuelta favorablemente si los residuos se encuentran en propiedad pública municipal
  (vialidades, predios públicos) y son clasificados como Residuos Sólidos Urbanos (RSU), es decir, no peligrosos
  ni de manejo especial, y no incluyen escombros, tierra o piedras. La recolección dependerá de la disponibilidad
  operativa y del equipo de la Dirección de Servicios Públicos Municipales o la Delegación Municipal correspondiente.'
