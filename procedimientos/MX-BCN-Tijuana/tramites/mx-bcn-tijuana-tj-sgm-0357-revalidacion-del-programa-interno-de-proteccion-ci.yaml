notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Criterio
  para resolver: Cuando se haya realizado el pago correspondiente y el contenido del Programa de Atención a Emergencias
  cumpla con la normativa vigente, se entregará una respuesta por escrito indicando la resolución. En caso de ser
  negativa, tendrá 30 días naturales para corregir las observaciones y volver a enviarlo para su aprobación.'
