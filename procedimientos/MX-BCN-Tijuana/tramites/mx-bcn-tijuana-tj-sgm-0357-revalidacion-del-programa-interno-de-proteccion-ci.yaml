title: Revalidación del Programa Interno de Protección Civil (PAE)
summary: Se revisa que las empresas cuenten con personal capacitado, así como con un plan de acción, de prevención,
  mitigación, auxilio y recuperación ante la presencia de desastres o emergencias, garantizando la preparación del
  personal. El objetivo es reducir riesgos, proteger a las personas, instalaciones y actividades.
