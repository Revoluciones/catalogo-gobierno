title: Permiso Nuevo para Venta y/o Consumo de Bebidas alcohólicas
summary: Este trámite se solicita para obtener el permiso para la venta y/o consumo de bebidas alcohólicas en un
  establecimiento
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Dirección de Bebidas Alcohólicas
official_ids:
  homoclave: TJ-SGM-0061
who_can:
- Interesado
when: Cuando se pretenda llevar acabo la venta de bebidas alcohólicas en un establecimiento
result: Licencia
requirements:
- text: Formato de solicitud expedido por la Dirección de Bebidas Alcohólicas, debidamente llenado, bajo protesta
    de decir verdad.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Ser mayor de edad y estar en pleno goce y ejercicio de sus derechos, y en caso de ser una persona moral,
    estar debidamente constituida conforme a las leyes de los Estados Unidos Mexicanos.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: En caso de que el solicitante sea persona física presentar identificación oficial, y si es representada
    por Apoderado Legal, deberá acreditar la personalidad con la que comparece conforme a los lineamientos establecidos
    por el derecho común para la
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: En caso de que el solicitante sea persona moral presentar Acta Constitutiva, además acompañar de Poder Notarial
    si el trámite se realiza mediante Apoderado Legal distinto al autorizado en el Acta Constitutiva de la Sociedad;
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Cédula de Registro Federal de Contribuyentes;
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Croquis o plano en que se indique, en forma clara y precisa, la ubicación del establecimiento y los nombres
    de las calles que corresponden a la manzana o área de ubicación del establecimiento;
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Identificación oficial con fotografía del interesado, representante o apoderado legal.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Dictamen factible de uso del suelo, cuando proceda;
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Fotografías, tanto del exterior como del interior del local, que muestren la totalidad del mismo, incluyendo
    sus instalaciones sanitarias;
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Presentar original y copia de la licencia o permiso definitivo de operación municipal, expedido por la Dirección
    de Administración Urbana y la Tesorería Municipal, en los giros que aplique, acompañando además en caso que
    corresponda la licencia de anu
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Certificado de Medidas de seguridad, emitido por la Dirección de Bomberos;
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Recibo del impuesto predial, u oficio expedido por la Dirección de Administración Urbana, donde se especifique
    la(s) causa(s) de la no asignación de la clave catastral, para su valoración;
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Certificado de no adeudo o libertad de gravámenes municipal vigente a nombre del solicitante expedido por
    la Tesorería Municipal;
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Carta de no antecedentes penales y constancia de residencia por 6 meses;
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Presentar el Aviso Público a que se hace referencia en el artículo 27 de este ordenamiento, cuando se trate
    de solicitud de permiso en envase abierto;
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: El pago de los derechos correspondientes de acuerdo a la ley de ingresos vigente para el municipio de Tijuana,
    y
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
