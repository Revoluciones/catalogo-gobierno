notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Criterio
  para resolver: El negocio debe estar a al menos 100 metros de otros negocios similares, excepto si se trata de
  restaurantes o zonas que el Ayuntamiento determine como como hoteleras, turísticas o comerciales. Si el giro principal
  es la venta de alcohol, debe estar a 150 metros de escuelas, hospitales, iglesias o centros deportivos. Asimismo
  se deberá cumplir con los requisitos marcados en el Reglamento.'
