title: Apoyo de salud
summary: El estudio socioeconómico es un procedimiento realizado por la Dirección Bienestar Social Municipal, cuyo
  propósito es evaluar la situación económica de las personas que solicitan apoyos para la atención de necesidades
  básicas en materia de salud, tales como adquisición de medicamentos, realización de cirugías, estudios médicos,
  aparatos auditivos y lentes.
