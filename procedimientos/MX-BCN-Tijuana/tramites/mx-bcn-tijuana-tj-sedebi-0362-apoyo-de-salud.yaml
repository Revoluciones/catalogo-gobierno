notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Tipo
  en el registro: programa de apoyo. Criterio para resolver: La procedencia del apoyo estará sujeta al resultado
  del estudio socioeconómico, mediante el cual se determinará que la persona solicitante y su núcleo familiar se
  encuentran en situación de vulnerabilidad o insuficiencia de recursos para cubrir los gastos derivados de medicamentos,
  cirugías, estudios médicos, aparatos auditivos, lentes y demás insumos de salud requeridos.'
