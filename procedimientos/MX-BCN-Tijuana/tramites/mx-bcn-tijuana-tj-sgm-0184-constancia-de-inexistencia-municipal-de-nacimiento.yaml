title: CONSTANCIA DE INEXISTENCIA MUNICIPAL de Nacimiento o Matrimonio
summary: Documento oficial que confirma que la persona solicitante no tiene un registro de nacimiento o matrimonio
  en el municipio de Tijuana
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Oficialia del Registro Civil
official_ids:
  homoclave: TJ-SGM-0184
who_can:
- Interesado
when: Cuando se necesita comprobar oficialmente que la persona solicitante no está registrada como nacida en la
  Oficialía de Registro Civil donde solicita su inexistencia. · Cuando se requiere demostrar que la persona solicitante
  no tiene un registro de matrimonio en la Oficialía de Registro Civil donde solicita su inexistencia.
result: Constancia
requirements:
- text: 'Para constancia de inexistencia de nacimiento:'
  cites:
  - source: remutys
- text: Certificado de nacimiento (documento expedido por la clínica donde nación el menor).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Acta de nacimiento de los padres.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Identificación oficial de los padres.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: En caso de robo o extravío, presentar reporte expedido por el Ministerio Público.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: 'Para constancia de inexistencia de matrimonio:'
  cites:
  - source: remutys
- text: Acta de nacimiento de la persona interesada.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Identificación oficial de la persona interesada.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: 'En caso de haber estado casado/a: acta de divorcio o defunción, según corresponda.'
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
