id: mx-bcn-tijuana-tj-sdtua-0096-licencia-de-operacion
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Negocios y trabajo, Emprendimiento
title: Licencia de Operación
summary: Trámite permanente que permite a personas físicas o morales solicitar la licencia de operación para realizar
  diversos procesos, como revisión, análisis, verificación, certificación y otorgamiento, así como cambios de domicilio,
  propietario, superficie, actividad, denominación u horario en giros comerciales, industriales y de servicios,
  sujetos al pago de derechos
authority:
  name: Secretaría de Desarrollo Territorial y Urbano (Ayuntamiento de Tijuana)
  unit: Dirección de Administración Urbana
official_ids:
  homoclave: TJ-SDTUA-0096
who_can:
- Interesado
when: En caso de que se le requiera por trámites de actividad mercantil.
result: Licencia
requirements:
- text: Llenar la solicitud de la dirección de administración urbana. (Verificar la información)
  cites:
  - source: remutys
  original_or_copy: original
- text: Copia de documento que acredite la propiedad. (Escrituras, Título de Propiedad, Contrato de Compra – Venta,
    Arrendamiento o Comodato; Notariado y/o Sentencia de Juicio de Prescripción, contrato de un empresa regularizadora)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Copia de identificación oficial del propietario del predio, solicitante y/o arrendatario.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: 'Para personas morales: presentar copia de acta constitutiva y poderes legales.'
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Copia del recibo Predial Vigente.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Copia del Dictamen de Uso de Suelo Factible para la Actividad Solicitada.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Licencia de construcción y terminación de obra si la construcción es menor a los 5 años. (En caso de ser
    mayor presentar comprobante de recibo de luz, agua o teléfono)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Croquis de localización detallado con referencias.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Fotografías del exterior e interior del local incluyendo fachada tomada a distancia, baño y estacionamiento.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Certificado de medidas de seguridad emitido por la Dirección de Bomberos.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Factibilidad de Servicios de Bomberos.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Programa interno autorizado por Protección Civil
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Certificado de Fumigación Vigente.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Proyecto de Integración Vial Autorizado
  cites:
  - source: remutys
  original_or_copy: original
- text: Autorización Municipal de la Dirección de Protección al Ambiente. (ECOLOGIA)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Autorización de la Dirección General de Ecología del Estado. (Industria ligera y mediana)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Anuencia de impacto ambiental emitida por la Dirección de Protección al Ambiente. (Talleres, servicio y
    mantenimiento)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Autorización de SAGARPA
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Autorización de SEMARNAT
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Copia y aviso de apertura de COFEPRIS.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Aviso de funcionamiento de la Comisión Federal para la Protección contra Riesgos Sanitarios. (Farmacias,
    clínicas, consultorios, laboratorios clínicos)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Aviso de médico responsable expedido por ISESALUD. (Clínicas, consultorios, laboratorios clínicos)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Copia del contrato de la Comisión Estatal de Servicio Públicos de Tijuana. (CESPT)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Certificado de la unidad Verificadora de instalación de GAS. (Tortillerías, restaurantes y fábricas)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Contrato de recolección de Basura
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Contrato de recolección o reciclaje de materiales peligrosos o infecciosos. (Llanteras, laboratorios y hospitales)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Contrato de recolección de aceites vegetales o animales y grasas. (Venta de alimentos preparados)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Presentar evidencia de área de estacionamiento para el local comercial.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Pago de Anuncios existentes y solicitud de licencias para anuncios nuevos.
  cites:
  - source: remutys
  original_or_copy: original
