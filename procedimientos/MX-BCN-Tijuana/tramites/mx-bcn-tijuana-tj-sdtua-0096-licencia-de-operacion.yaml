notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Para
  empezar: https://www.tijuana.gob.mx/dependencias/sdue/dau/mercantiles.aspx Criterio para resolver: Para el otorgamiento
  o revalidación de la Licencia de Operación para giros comerciales, industriales y/o servicios, el solicitante
  debe presentar el pago del impuesto predial correspondiente al domicilio del establecimiento, salvo que sea arrendatario,
  y cumplir con los requisitos establecidos y la normativa vigente'
