title: CONSTANCIA DE INEXISTENCIA ESTATAL de Nacimiento o Matrimonio
summary: Documento oficial que confirma que la persona solicitante no tiene un registro de nacimiento o matrimonio
  en ningún municipio del Estado de Baja California.
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Oficialia del Registro Civil
official_ids:
  homoclave: TJ-SGM-0183
who_can:
- Interesado
when: Cuando se necesita comprobar oficialmente que la persona solicitante no está registrada como nacida en ningún
  municipio del Estado de Baja California. · Cuando se requiere demostrar que la persona solicitante no tiene un
  registro de matrimonio en ningún municipio del Estado de Baja California, ya sea para trámites legales, administrativos
  o personales.
result: Constancia
requirements:
- text: 'Para constancia de inexistencia de nacimiento:'
  cites:
  - source: remutys
- text: Acta de nacimiento de los padres
  cites:
  - source: remutys
  original_or_copy: original, 2 copia(s)
- text: Identificación oficial vigente de los padres
  cites:
  - source: remutys
  original_or_copy: original, 2 copia(s)
- text: Certificado de alumbramiento (expedido por la clínica donde nacio el menor).
  cites:
  - source: remutys
  original_or_copy: original, 2 copia(s)
- text: 'Para constancia de inexistencia de matrimonio:'
  cites:
  - source: remutys
- text: Acta de nacimiento de la persona interesada.
  cites:
  - source: remutys
  original_or_copy: original, 2 copia(s)
- text: Identificación oficial vigente de la persona interesada.
  cites:
  - source: remutys
  original_or_copy: original, 2 copia(s)
- text: 'En caso de haber estado casado/a: acta de divorcio o defunción, según corresponda.'
  cites:
  - source: remutys
  original_or_copy: original, 2 copia(s)
