notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Tipo
  en el registro: programa de apoyo. Para empezar: https://sedeti.tijuana.gob.mx/fondostijuana Criterio para resolver:
  El recurso en ningún caso podrá destinarse para pago de pasivos o para la realización de obra civil de ningún
  tipo. No haber sido beneficiario de alguno de los programas del Fideicomiso Fondos Tijuana, con anterioridad.
  La autorización de los créditos está sujeta al cumplimiento de los términos y condiciones de las Reglas de Operación
  y Lineamientos vigentes de los Fondos Tijuana, así como a la disponibilidad de recursos'
