title: Crédito Impulso al Autoempleo del Fideicomiso Fondos Tijuana
summary: Crédito de hasta 30 mil pesos M.N. con la finalidad de Incentivar el autoempleo para la realización de
  actividades productivas que ayudan al sostenimiento personal o familiar de personas desempleadas en el Municipio
  de Tijuana Baja California.
