  homoclave: TJ-SEDETI-0075
who_can:
- Interesado
when: Cuando el solicitante necesite capital de trabajo para iniciar una actividad productiva
result: Crédito
requirements:
- text: Identificación oficial con fotografía (credencial de elector, pasaporte vigente, cédula profesional y/o
    cartilla del servicio militar)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: 'Comprobante de domicilio: agua, luz, teléfono del domicilio del solicitante, (no mayor a tres (3) meses,
    una vez recibida la solicitud). Además de lo anterior, firmar bajo protesta que el domicilio especificado en
    solicitud corresponde al actual,'
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Aviso de privacidad
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Croquis de localización del domicilio del solicitante, especificando calles colindantes
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Dos fotografías del domicilio del solicitante (1 de la fachada y 1 del interior del domicilio).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Constancia de acreditación de curso de capacitación financiera, impartida por institución autorizada por
    la Secretaría de Desarrollo Económico
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Estado de cuenta bancario a nombre del beneficiario, el cual deberá contener número de cuenta y clabe interbancaria,
    sin límite para recibir deposito (aplica todas las instituciones bancarias con excepción de tarjetas OXXO)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: No haber sido beneficiario de alguno de los programas del Fideicomiso Fondos Tijuana, con anterioridad
  cites:
  - source: remutys
