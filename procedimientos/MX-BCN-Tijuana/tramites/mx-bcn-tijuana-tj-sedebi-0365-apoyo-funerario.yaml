notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Criterio
  para resolver: La autorización del apoyo estará sujeta al resultado del estudio socioeconómico, mediante el cual
  se determinará que la persona solicitante y su núcleo familiar se encuentran en situación de vulnerabilidad o
  insuficiencia de recursos para cubrir los gastos funerarios.'
