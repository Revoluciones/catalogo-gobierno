  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Acta constitutiva y poder notarial vigente del representante en caso de ser persona moral.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Constancia de Situación Fiscal (SAT, estatus activo).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Comprobante de domicilio con vigencia no mayor a 3 meses.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Carta de anuencia y nombramiento de enlace (escrito libre firmado por el representante legal para autorizar
    el estudio de factibilidad).
  cites:
  - source: remutys
  original_or_copy: original
cost:
  type: variable
  amount_mxn: null
  text: 'Por agente de protección comercial, por turno de 8 horas: 13 UMA ($1,525.03) · Por vigilancia armada en
    zonas habitacionales (contratadas por asociaciones civiles) por cada elemento armado, por turno de 8 horas:
    13 UMA ($1,525.03) · Por vigilancia a instituciones gubernamentales, por cada elemento, por turno de 8 horas:
    11.38 UMA ($1,334.99). UMA 2026 = $117.31.'
