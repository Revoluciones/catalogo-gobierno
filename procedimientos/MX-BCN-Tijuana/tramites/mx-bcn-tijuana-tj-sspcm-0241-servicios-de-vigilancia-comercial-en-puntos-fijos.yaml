requirements:
- text: 'Carta petición en hoja membretada dirigida al Director de Servicios de Protección Comercial y Vigilancia
    Auxiliar, firmada por el representante legal o solicitante, indicando:'
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Solicitud de servicio dirigida al titular de la Direccion de Servicios de Proteccion Comercial y de Vigilancia
    Auxiliar
  cites:
  - source: remutys
- text: '- Tipo de servicio y número de elementos requeridos (agente armado, guardia desarmado o patrulla con elemento
    armado).'
  cites:
  - source: remutys
- text: '- Fecha de inicio (mínimo 5 días de anticipación).'
  cites:
  - source: remutys
- text: '- Días y horarios del servicio (diurno, nocturno o mixto).'
  cites:
  - source: remutys
- text: '- Datos de contacto del enlace autorizado (nombre, teléfono y correo).'
  cites:
  - source: remutys
