kind: tramite
category: Pagos
title: Solicitud de Prescripciones
summary: Procedimiento para impugnar el cobro de un crédito fiscal cuando han transcurrido más de cinco años sin
  gestión de cobro. Puede solicitarlo el propietario, un representante legal o un familiar directo del propietario.
authority:
  name: Secretaría de Finanzas / Tesorería (Ayuntamiento de Tijuana)
  unit: Predial
official_ids:
  homoclave: TJ-SF-0251
who_can:
- Interesado
when: Cuando el contribuyente adeuda más de cinco años de impuesto predial sin haber recibido gestión de cobro.
result: Recibo
requirements:
- text: Identificación oficial del titular de la clave catastral. (INE)
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Escrito libre dirigido a la autoridad fiscal, debidamente fundamentado, que contenga nombre del solicitante,
    años que solicita prescripción, domicilio, clave catastral, núm. de telefono, firma del titular,
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Acta constitutiva y poder notarial que acredite facultades de representación en caso de ser persona moral.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Documento judicial que acredite ser albacea de la sucesión en caso de fallecimiento del contribuyente.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Recibo de impuesto predial de misma fecha de presentación.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Escritura pública, sentencia y/o antecedente de Registro Público para acreditar propiedad, en caso de no
    estar a su nombre el predial
  cites:
  - source: remutys
  original_or_copy: original
