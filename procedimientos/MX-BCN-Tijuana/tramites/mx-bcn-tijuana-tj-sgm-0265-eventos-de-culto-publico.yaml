  original_or_copy: 1 copia(s)
- text: Escrito de solicitud de permiso y no inconveniencia a la Secretaría de Gobierno Municipal y Subdirección
    de Asuntos Religiosos
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Solicitud de rondines de vigilancia y no inconveniencia a la Secretaría de Seguridad y Protección Ciudadana
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Anuencia de la Dirección de Servicios Públicos Municipales
  cites:
