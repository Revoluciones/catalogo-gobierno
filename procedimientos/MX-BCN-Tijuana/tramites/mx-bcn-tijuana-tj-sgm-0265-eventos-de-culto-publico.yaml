title: Eventos de culto público
summary: Para realizar actos religiosos de culto público con carácter extraordinario fuera de los templos, los organizadores
  de los mismos deberán dar aviso previo a las autoridades federales, del Distrito Federal, estatales o municipales
  competentes, por lo menos quince días hábiles antes de la fecha en que pretendan celebrarlos, el aviso deberá
  indicar el lugar, fecha, hora del acto, así como el motivo por el que éste se pretende celebrar. (LARCP art. 22)
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Dirección de Asuntos Religiosos
