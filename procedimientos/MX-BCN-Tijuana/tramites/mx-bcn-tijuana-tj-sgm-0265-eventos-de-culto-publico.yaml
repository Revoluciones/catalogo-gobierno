  homoclave: TJ-SGM-0265
who_can:
- Interesado
when: Actos de Culto Público en General · Conciertos de alabanzas · Jornadas de Oración · Campañas Evangelísticas
  · Peregrinaciones, caminatas etc. · Todo aquel acto de culto religioso fuera de las instalaciones propias de las
  iglesias
result: PERMISO EVENTUAL
