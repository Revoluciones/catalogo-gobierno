  original_or_copy: 1 copia(s)
- text: Llenar formato de solicitud por evento ante la Subdirección de Asuntos Religiosos
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: A partir de 250 asistentes deberá solicitar Anuencia de Protección Civil
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: A partir de 300 asistentes deberá solicitar Anuencia de COEPRIS
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: A partir de 1000 asistentes deberán solicitar Dictamen de Bomberos
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: A partir de 500 en espacios cerrados y más de 1000 en espacios abiertos deberá solicitar Dictamen de Protección
    Civil del Estado
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Mencionar en el escrito dirigido a asuntos religiosos si pretende pasar por alguna ruta establecida del
    SITT
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Caminatas, peregrinaciones y eventos masivos deberá contratar el servicio de Ambulancia Particular
