id: mx-bcn-tijuana-tj-sdtua-0105-f3-proyecto-ejecutivo
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Negocios y trabajo, Infraestructura y vivienda
title: F3 Proyecto Ejecutivo
summary: El análisis de los proyectos ejecutivos de áreas verdes, alumbrado, pluviales, agua y drenaje, energía
  eléctrica, integración vial, donaciones municipales y cualquier otro que sea necesario para el proyecto.
authority:
  name: Secretaría de Desarrollo Territorial y Urbano (Ayuntamiento de Tijuana)
  unit: Dirección de Administración Urbana
official_ids:
  homoclave: TJ-SDTUA-0105
who_can:
- Interesado
when: Previo al inicio de la construcción o desarrollo de un proyecto urbano
result: OFICIO, ACUERDO DE AUTORIZACION Y PLANOS.
requirements:
- text: Llenar y firmar solicitud de la dirección de administración urbana (propietario o representante legal).
  cites:
  - source: remutys
  original_or_copy: original
- text: Recibo de pago de derechos.
  cites:
  - source: remutys
  original_or_copy: original
- text: Planos del proyecto ejecutivo, (firmado por el responsable del proyecto y corresponsables).
  cites:
  - source: remutys
  original_or_copy: original
- text: Proyectos aprobados de servicios (escurrimientos pluviales, alumbrado público, integración vial, áreas verdes,
    redes de agua potable y drenaje sanitario (CESPT), redes de electricidad (CFE), planta de tratamiento (en caso
    de que aplique).
  cites:
  - source: remutys
  original_or_copy: original
- text: Memorias técnico-descriptivas de lotificación.
  cites:
  - source: remutys
  original_or_copy: original
- text: Licencias de construcción y memorias de cálculo de muros de contención autorizados (firmados por el responsable
    director de proyecto y corresponsables).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Certificados de libertad de gravamen hipotecario (vigencia 3 meses) y libertad de gravamen fiscal (vigencia
    de 6 meses).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Acta constitutiva de la empresa y poder general protocolizado.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Título de la comisión nacional del agua para reusó de aguas residuales (en caso de que aplique)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Oficio de aceptación de las áreas de donación municipal y estatal.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Proyecto de integración vial, así como evaluación del estudio de impacto vial, por parte de implan (firmado
    por el responsable directo de proyecto y corresponsable en vialidades registrado ante el implan.
  cites:
  - source: remutys
  original_or_copy: original
- text: Presupuesto total de la obra de urbanización, (desglosado por conceptos y números generadores, de las calles
    y servicios públicos que son del dominio público, firmado por el responsable director de proyecto y corresponsable.
  cites:
  - source: remutys
  original_or_copy: original
- text: Planos digitalizados en archivo DWG de AUTOCAD.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
