id: mx-bcn-tijuana-tj-sgm-0065-permiso-de-ambulantaje
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Emprendimiento, Infraestructura y vivienda
title: Permiso de Ambulantaje
summary: Este trámite permite obtener la autorización para vender productos o servicios de manera ambulante en las
  calles, mercados sobre ruedas o espacios autorizados por el Ayuntamiento de Tijuana. Es obligatorio cumplir con
  los requisitos, medidas de seguridad e higiene, y seguir las normas establecidas en el reglamento correspondiente.
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Dirección de Inspección y Verificación
official_ids:
  homoclave: TJ-SGM-0065
who_can:
- Interesado
when: Cuando se pretenda ejercer el comercio ambulante en vía pública
result: Permiso Provisional
requirements:
- text: Identificación oficial vigente
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Comprobante de domicilio no mayor a 2 meses
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Acta de nacimiento o CURP
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Certificado médico con vigencia no mayor a 6 meses en caso que su actividad sea venta de alimentos.
  cites:
  - source: remutys
  original_or_copy: original
- text: Análisis clínicos hepatitis A y reacciones febriles con vigencia no mayor a 6 meses en caso que su actividad
    sea venta de alimentos.
  cites:
  - source: remutys
  original_or_copy: original
- text: Rol de plazas o constancia de registro emitida por la organización, gremio o agrupación de comerciantes
    en caso de ser mercado sobre ruedas.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Certificado de medidas de seguridad emitido por la Dirección de Bomberos en el caso que requiera del uso
    de gas LP para realizar la actividad.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: En caso de "Food Trucks" acreditar la legal estancia del vehículo
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Para solicitar el DESCUENTO de madres solteras debe presetar Carta de inexistencia de matrimonio estatal
    vigente
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Para EXENTAR PAGO en adultos mayores presentar copia de credencial de INAPAM y en personas con discapacidad
    presentar copia de credencial de discapacidad
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
