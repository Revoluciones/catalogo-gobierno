  homoclave: TJ-SDTUA-0104
who_can:
- Interesado
when: Cuando lo requiera.
result: CONSTANCIA Y PLANOS
requirements:
- text: Llenar y firmar solicitud de la dirección de administración urbana (propietario o representante legal).
  cites:
  - source: remutys
  original_or_copy: original
- text: Firma del director responsable de obra registrado ante esta dirección.
  cites:
  - source: remutys
  original_or_copy: original
- text: Recibo de pago de derechos (conforme a la ley de ingresos).
  cites:
  - source: remutys
  original_or_copy: original
- text: Copia del recibo de impuesto predial vigente.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Factibilidad de servicios de agua potable y alcantarillado expedido por la comisión estatal de servicios
    públicos de Tijuana.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Factibilidad de suministro de energía eléctrica expedida por la comisión federal de electricidad.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Copia del documento de propiedad (escritura pública o título de propiedad del terreno debidamente inscrito
    en el registro público de la propiedad y comercio).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Plano certificado del polígono desarrollar (vigencia de un año).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Planos del anteproyecto (polígono envolvente, manzanas y ejes viales, lotificación, usos del suelo, rasantes
    y terracerías, topografía natural, topografía de proyecto, sembrado de vivienda).
  cites:
  - source: remutys
  original_or_copy: original
- text: Estudio de mecánica de suelos y diseño e pavimentos (formato por el responsable director de proyecto y corresponsable
    especializado registrado ante esta dirección).
  cites:
  - source: remutys
  original_or_copy: original
- text: Archivo digital (de la documentación antes mencionada).
  cites:
  - source: remutys
  original_or_copy: original
- text: Dictamen de uso de suelo favorable.
  cites:
  - source: remutys
