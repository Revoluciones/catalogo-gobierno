title: F2 Anteproyecto Urbano
summary: Evaluación y revisión del anteproyecto geométrico para predios de 10,000 m² o más. Su objetivo es definir
  la traza del fraccionamiento, incluyendo la distribución de manzanas, lotes y vialidades, asegurando el cumplimiento
  de las normativas urbanas y de diseño aplicables.
authority:
  name: Secretaría de Desarrollo Territorial y Urbano (Ayuntamiento de Tijuana)
  unit: Dirección de Administración Urbana
