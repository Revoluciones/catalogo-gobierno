id: mx-bcn-tijuana-tj-sedeti-0300-fortalecimiento-a-la-micro-y-pequena-empresa
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Negocios y trabajo, Emprendimiento
title: Fortalecimiento a la micro y pequeña empresa
summary: Crédito de hasta 250 mil pesos M.N. a personas físicas con actividad empresarial y/o personas morales que
  requieran capital para el sostenimiento o crecimiento de su negocio y generen empleos nuevos.
authority:
  name: Secretaría de Desarrollo Económico (Ayuntamiento de Tijuana)
  unit: Centro de Atención al Emprendedor
official_ids:
  homoclave: TJ-SEDETI-0300
who_can:
- Interesado
when: Cuando personas físicas con actividad empresarial y/o personas morales que requieran capital para el sostenimiento
  o crecimiento de su negocio y generen empleos nuevos
result: Crédito
requirements:
- text: 'Persona física: Identificación oficial con fotografía. (Credencial de elector, pasaporte vigente y/o cédula
    profesional)'
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: 'Persona moral: Poder General para Pleitos y Cobranzas, Actos de Administración y para firma de títulos
    de crédito, así como identificación oficial vigente del Representante Legal, el Acta Constitutiva deberá contar
    con la inscripción en el RPPyC'
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Comprobante de domicilio para (personas físicas) o del domicilio fiscal (personas morales), agua, luz, teléfono
    no mayor a tres meses el cual deberá estar a nombre del solicitante
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Constancia de Situación Fiscal del solicitante con alta en actividad no mayor a tres meses
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Permiso de operación municipal, ambulantaje o sobre ruedas según aplique, vigente
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Presupuesto del proyecto desglosado por conceptos y aportaciones (formato de solicitud de Fondos Tijuana
    y aviso de privacidad)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Cotización(es) de los conceptos para los que se solicite el crédito, los cuales deberá(n) ser de proveedor(es)
    local(es) en el caso de contar con una mejor propuesta económica fuera de Tijuana, deberá acompañar cada cotización
    foránea de una local
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Declaración del SAT del último pago anual, o pagos provisionales o definitivos mensuales según aplique
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Opinión de cumplimiento positiva conforme al articulo 32-D del Código Fiscal de la Federación
  cites:
  - source: remutys
- text: No contar con adeudos a favor del Ayuntamiento de Tijuana, B.C.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Contar con Aval, presentando copia de identificación oficial con fotografía vigente. (INE, Pasaporte y/o
    Cedula Profesional), así como comprobante de domicilio (agua, luz o teléfono) no mayor a tres (3) meses, el
    cual firmará un pagaré por la cantidad
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
