title: Permiso para Ruptura de Cordón de Banqueta
summary: Trámite de visto bueno para ruptura de Banqueta para introducir los servicios de toma de agua potable y
  drenaje sanitario (Descarga), de uso doméstico. Para la adecuación, reparación, acceso vehicular como peatonal
  y/o de personas con discapacidad. Que pudiera no incidir en el rompimiento del pavimento.
