id: mx-bcn-tijuana-tj-sgm-0350-eventos-via-publica
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: trámite
title: Eventos Vía Pública
summary: Eventos Vía Pública
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Dirección de Gobierno / Correspondencia
official_ids:
  homoclave: TJ-SGM-0350
who_can:
- Interesado
result: Opinión técnica
requirements:
- text: Solicitud debidamente llenada, especificando cantidad de asistentes
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: 'Escrito por parte del interesado solicitando el permiso, el cual especifique los siguiente datos:'
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Escrito dirigido al Secretario de Gobierno
  cites:
  - source: remutys
- text: Especificar, día, hora, lugar, motivo y debidamente firmada por el solicitante
  cites:
  - source: remutys
- text: En caso de ser persona moral el solicitante, deberá acreditar la personalidad mediante un documento oficial
    o poder notarial
  cites:
  - source: remutys
- text: Copia de la identificación oficial vigente con fotografía del responsable del evento
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: En caso de desfile, caravanas, cierre de calles o eventos en la vía pública deberán solicitar factibilidad
    a la delegación que corresponde
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: En caso de colecta, encuesta y/o volanteo, deberán anexar copia de la identificación oficial de cada una
    de las personas encargadas del área que participen en dicha actividad
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Oficio de respuesta por parte de Seguridad Pública, en solicitud de apoyo para el evento en vía pública,
    apoyo vial y factibilidad
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Oficio de contratación de Servicios de Protección Comercial y Vigilancia Auxiliar
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Oficio de respuesta del SITT en caso de carrera, caminata, marcha, desfile, caravanas, paso ciclista, etc.
    que pase frente alguna estación del SITT
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: En caso de ser carrera pedestre profesional, solicitar anuencia y registro ante la Liga Municipal de Atletismo
    de Tijuana
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Contratación de servicios de ambulancia
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Deberá acudir a la Dirección de Servicios Públicos Municipales para el deposito de fianza en referencia
    a los residuos sólidos urbanos (limpieza del lugar) generados al final del evento, según lo estipula la ley
    de ingresos
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Anuencia de Protección Civil Municipal para el evento con asistencia de hasta 499 personas
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Anuencia de Protección Civil del Estado para el evento con asistencia de 500 o más personas
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Pago de derechos de permiso emitido según el monto que estipula la ley de ingresos
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
