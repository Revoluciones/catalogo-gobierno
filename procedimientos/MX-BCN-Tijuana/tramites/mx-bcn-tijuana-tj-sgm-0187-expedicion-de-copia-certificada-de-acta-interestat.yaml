  homoclave: TJ-SGM-0187
who_can:
- Interesado
when: Cuando se necesita una copia certificada para gestiones como pasaporte, inscripción escolar, trámites migratorios
  o legales. · Si el acta original se extravió, está dañada o es ilegible. · En casos donde se requiera comprobar
  datos personales o familiares, como matrimonio, divorcio, adopción o defunción.
