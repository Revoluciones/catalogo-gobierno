id: mx-bcn-tijuana-tj-sspcm-0243-servicios-extraordinarios
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Otros
title: Servicios Extraordinarios
summary: Solicitud de vigilancia y seguridad para eventos masivos ya sean públicos o privados, incluyendo patrullas
  con elementos de seguridad y motocicletas para auxilio vial.
authority:
  name: Secretaría de Seguridad y Protección Ciudadana Municipal (Ayuntamiento de Tijuana)
  unit: Dirección de Servicios de Protección Comercial y de Vigilancia Auxiliar
official_ids:
  homoclave: TJ-SSPCM-0243
who_can:
- Interesado
- Representante_legal
when: Conciertos · Eventos Masivos Deportivos (Baseball, Futbol, Maratones, BOX, Luchas libre, carreras, etc) ·
  Corridas de Toros · Eventos Públicos (Verbenas, Eventos gastronómicos, ferias, degustaciones, etc.) · Eventos
  Religiosos, Culturales y Sociales
result: Recibo
requirements:
- text: Si se ocupa el cierre de calles, avenidas y parque públicos solicitar a la delegación correspondiente la
    anuencia o factibilidad de no inconveniencia emitida por el delegado.
  cites:
  - source: remutys
  original_or_copy: original
- text: Poder Notarial vigente del Representante legal (Persona moral)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Acta Constitutiva de la empresa o sociedad de que se trate (Persona moral)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Croquis, mapa o plano de la ubicación y distribución del lugar donde se llevará acabo el evento.
  cites:
  - source: remutys
  original_or_copy: original
- text: Contrato de arrendamiento del lugar donde se llevará acabo el evento.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Constancia de Situación Fiscal actualizada, con estatus activo a nombre de la persona física solicitante
    del servicio.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Comprobante de domicilio (agua, luz, teléfono), con vigencia no mayor a tres meses.
  cites:
  - source: remutys
  original_or_copy: original
- text: Identificación oficial vigente (INE/PASAPORTE).
  cites:
  - source: remutys
  original_or_copy: original
- text: Escrito de petición dirigido al Maestro José Alejandro Avilés Amezcua, en su carácter de Secretario de Seguridad
    y Protección Ciudadana Municipal del H. XXV Ayuntamiento de Tijuana, Baja California en el que se precise motivo
    del trámite y todos los datos relacionados con el evento, nombre, tipo (social, cultural, deportivo, religioso,
    etc.), fecha, horario de inicio y termino, dirección completa, número aproximado de asistentes, especificar
    si habrá venta y consumo de bebidas alcoholica, especificar si se requiere apoyo con elementos, indicando el
    horario del servicio de vigilancia, nombre completo y datos de contacto (número telefónico y correo electrónico)
    del responsable o solicitante, si se cuenta con elementos de seguridad privada, especificar el número de elementos.
  cites:
  - source: remutys
  original_or_copy: original
cost:
  type: variable
  amount_mxn: null
  text: 'Servicios de protencción y vigilancia en puntos fijos por elemento operativo en zonas habitacioales e instituciones
    gubernamentales por turno de 8 horas: 6.5 UMA ($762.51) · Servicios de protección y seguridad a particulares
    por elemento operativo por turno de 8 horas: 9 UMA ($1,055.79) · Servicios de renta de unidad patrulla con un
    elemento operativo por turno de 6 horas: 31.25 UMA ($3,665.94) · Servicio de renta de unidad motocicleta Por
    servicios de vigilancia y control de tránsito en vía pública, para eventos culturales, sociales, deportivos,
    religiosos y/o artísticos por turno de 6 horas: 21.5 UMA ($2,522.16) · Servicios extraordinarios por elemento
    operativo para servicio de protección y vigilancia para eventos masivos o no masivos culturales, sociales, 154
    deportivos, religiosos y/o artísticos por turno de 6 horas: 9.32 UMA ($1,093.33). UMA 2026 = $117.31.'
  as_of: '2026-11-06'
