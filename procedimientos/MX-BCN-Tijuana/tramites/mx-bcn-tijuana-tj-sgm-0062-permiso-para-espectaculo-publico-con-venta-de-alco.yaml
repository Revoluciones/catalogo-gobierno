id: mx-bcn-tijuana-tj-sgm-0062-permiso-para-espectaculo-publico-con-venta-de-alco
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Negocios y trabajo
title: Permiso para Espectáculo Público con Venta de Alcohol
summary: Permiso para llevar a cabo un espectáculo público con consumo de bebidas alcohólicas.
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Dirección de Bebidas Alcohólicas
official_ids:
  homoclave: TJ-SGM-0062
who_can:
- Interesado
when: Cada vez que se prentenda realizar algún evento masivo en la ciudad, con venta y/o consumo de bebidas alcohólicas.
result: PERMISO EVENTUAL
requirements:
- text: Acudir personalmente con identificación oficial con fotografía del interesado, representante o apoderado
    legal.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Llenar formato que se entrega en la Dirección de Bebidas Alcohólicas.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Solicitud por escrito dirigida al Titular de la Dirección.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Presentar documento que acredite que el solicitante puede disponer del lugar en que se llevará a cabo el
    evento (contrato de arrendamiento e identificación del arrendador).
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Anuencia emitida por la Dirección de Servicios de Protección Comercial y Vigilancia Auxiliar.
  cites:
  - source: remutys
  original_or_copy: original
- text: Anuencia o dictamen de no inconveniencia emitido por la Dirección de Protección Civil Municipal y/o Estatal.
  cites:
  - source: remutys
  original_or_copy: original
- text: Anuencia o dictamen de no inconveniencia emitido por la Dirección de Bomberos
  cites:
  - source: remutys
  original_or_copy: original
- text: Unidades de emergencia médica “ambulancia” para prestación de primeros auxilios (de aquellas que cuenten
    con registro ante la Dirección de Protección Civil).
  cites:
  - source: remutys
  original_or_copy: original
- text: -En caso de presentación de artistas- copia de contrato de prestación de servicios entre el solicitante
    del permiso y el artista o promotor (copia de la identificación de quienes firman respectivo contrato).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Copia de contrato de prestación de servicios con la boletera (copia de la identificación de quienes firman
    respectivo contrato).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: En casos de función de box, lucha libre, rodeo, corrida de toros, se requiere oficio debidamente firmado
    por la comisión correspondiente.
  cites:
  - source: remutys
  original_or_copy: original
- text: Se deberá garantizar el crédito fiscal estimado por la Tesorería Municipal mediante una fianza mercantil,
    en el caso de eventos con cobro de admisión y/o cuota de recuperación.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: En caso de eventos con cierre de calle se requiere factibilidad de la Delegación correspondiente.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: En caso de eventos con cierre de calle se requiere oficio de Dirección de Obras Públicas, donde avala el
    cumplimiento de la limpieza de la vía pública después de realizado el evento.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: En caso de eventos con cierre de calle y que tengan instalación de puestos, escenario, etc. ,se requiere
    entregar un croquis del mismo.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Pago de derechos.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
cost:
  type: variable
  amount_mxn: null
  text: 'Recepción, análisis y evaluación de solicitudes de permisos eventuales para operar la venta y/o consumo
    público de bebidas alcohólicas: 13 UMA ($1,525.03) · Espectáculos públicos y masivos: Presentación de artistas,
    cantantes, funciones de box, lucha libre, obras de teatro, cine, eventos deportivos, eventos culturales, bailes,
    exposiciones, ferias, festivales, verbenas, congresos, exhibiciones de moda, con fines de lucro y asistencia
    de 1000 o más personas.: 78 UMA ($9,150.18) · Espectáculos públicos y masivos: Presentación de artistas, cantantes,
    funciones de box, lucha libre, obras de teatro, cine, eventos deportivos, eventos culturales, bailes, exposiciones,
    ferias, festivales, verbenas, congresos, exhibiciones de moda, con fines de lucro y asistencia de 999 o menos
    personas: 52 UMA ($6,100.12) · Espectáculos públicos y masivos: Presentación de artistas, cantantes, funciones
    de box, lucha libre, obras de teatro, cine, eventos deportivos, eventos culturales, bailes, exposiciones, ferias,
    festivales, verbenas, congresos, exhibiciones de moda, sin fines de lucro y asistencia de 1000 o más personas.:
    52 UMA ($6,100.12) · Espectáculos públicos y masivos: Presentación de artistas, cantantes, funciones de box,
    lucha libre, obras de teatro, cine, eventos deportivos, eventos culturales, bailes, exposiciones, ferias, festivales,
    verbenas, congresos, exhibiciones de moda, sin fines de lucro y asistencia de 999 o menos personas.: 35.1 UMA
    ($4,117.58) · Degustación por establecimiento comercial.: 39 UMA ($4,575.09) · Espectáculos públicos y masivos,
    solicitados por asociaciones civiles, escuelas, asociaciones religiosas y dependencias de gobierno.: 26 UMA
    ($3,050.06) · Espectáculos públicos y masivos con cierre parcial o total de calle: Presentación de artistas,
    cantantes, funciones de box, lucha libre, obras de teatro, cine, eventos deportivos, eventos culturales, bailes,
    exposiciones, feria, verbena, festivales, congresos, exhibiciones de moda, con fines de lucro y asistencia de
    1000 o más personas.: 130 UMA ($15,250.30) · Espectáculos públicos y masivos con cierre parcial o total de calle:
    Presentación de artistas, cantantes, funciones de box, lucha libre, obras de teatro, cine, eventos deportivos,
    eventos culturales, bailes, exposiciones, feria, verbena, festivales, congresos, exhibiciones de moda, con fines
    de lucro y asistencia de 999 o menos personas.: 78 UMA ($9,150.18) · Espectáculos públicos y masivos con cierre
    parcial o total de calle: Presentación de artistas, cantantes, funciones de box, lucha libre, obras de teatro,
    cine, eventos deportivos, eventos culturales, bailes, exposiciones, feria, verbena, festivales, congresos, exhibiciones
    de moda, sin fines de lucro y asistencia de 1000 o más personas.: 78 UMA ($9,150.18) · Espectáculos públicos
    y masivos con cierre parcial o total de calle: Presentación de artistas, cantantes, funciones de box, lucha
    libre, obras de teatro, cine, eventos deportivos, eventos culturales, bailes, exposiciones, feria, verbena,
    festivales, congresos, exhibiciones de moda, sin fines de lucro y asistencia de 999 o menos personas.: 52 UMA
    ($6,100.12) · Espectáculos públicos y masivos con cierre de calle, solicitados por asociaciones civiles y/o
    instituciones de gobierno: 39 UMA ($4,575.09). UMA 2026 = $117.31.'
