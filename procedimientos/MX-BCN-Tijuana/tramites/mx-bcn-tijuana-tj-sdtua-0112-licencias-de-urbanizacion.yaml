who_can:
- Interesado
when: Cuando se desee inciar acciones de urbanización en terrenos rústicos o urbanizados, para habilitarlos para
  actividades como habitación, educación, esparcimiento o producción, cumpliendo con las normativas y planes de
  desarrollo urbano vigentes
result: Licencia
