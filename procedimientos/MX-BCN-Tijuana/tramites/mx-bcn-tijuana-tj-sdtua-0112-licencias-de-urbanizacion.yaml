title: Licencias de Urbanización
summary: La Licencia de Urbanización autoriza la adecuación del suelo rústico o urbanizado para habilitarlo con
  fines de habitación, educación, esparcimiento o producción de bienes y servicios, en cumplimiento de la normativa
  urbana y los planes de desarrollo municipales
