    del lugar
  cites:
  - source: remutys
  original_or_copy: original
- text: 9. Documentos de acreditación legal de la unidad legible y vigente (Por cada vehículo anexar) (Licencia
    de conducir tipo chofer (A, B, C) del operador del vehículo, Tarjeta de circulación, Constancia de verificación
    vehicular y póliza de seguro vigente.
  cites:
  - source: remutys
  original_or_copy: original
- text: 10. Plan de contingencia ambiental
  cites:
  - source: remutys
  original_or_copy: original
- text: 11. Certificado de fumigación vigente
  cites:
  - source: remutys
  original_or_copy: original
- text: 12. Manifiestos de entrega recepción del mes anterior (Solo renovación de licencia)
  cites:
  - source: remutys
  original_or_copy: original
- text: 13. Constancia de capacitación del personal involucrado en el manejo del residuo.
  cites:
  - source: remutys
  original_or_copy: original
