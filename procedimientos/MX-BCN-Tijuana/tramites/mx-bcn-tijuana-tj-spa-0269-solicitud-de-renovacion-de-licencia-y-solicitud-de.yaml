- text: 2. Licencia ambiental previamente autorizada.
  cites:
  - source: remutys
  original_or_copy: original
- text: 3. Solicitud debidamente llenada y firmada por solicitante y el responsable del manifiesto impacto ambiental
  cites:
  - source: remutys
  original_or_copy: original
- text: 4. Identificación oficial personas físicas y/o Acta Constitutiva para personas morales
  cites:
  - source: remutys
  original_or_copy: original
- text: 5. Dictamen de uso de suelo y/o constancia de zonificación favorable vigente
  cites:
  - source: remutys
  original_or_copy: original
- text: 6. Documento oficial que acredite predio de resguardo para la unidad (Contrato de arrendamiento en caso
    de no ser el propietario (Estado de cuenta de servicio telefónico y /o recibo de servicio de luz o agua))
  cites:
  - source: remutys
  original_or_copy: original
- text: 7. Boleta del predial
  cites:
  - source: remutys
  original_or_copy: original
- text: 8. Informe fotográfico a color de cada unidad (Placa Vehicular, Características de dichas unidades de transporte,
