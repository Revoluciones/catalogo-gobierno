title: Inscripción de nulidad de MATRIMONIO proveniente de Juzgado local
summary: Este trámite permite anotar en el acta de matrimonio la resolución judicial que declara la nulidad del
  matrimonio, incluyendo la parte resolutiva de la sentencia, la fecha en que se dictó, el tribunal que la pronunció
  y el número de expediente.
