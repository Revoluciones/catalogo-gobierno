id: mx-bcn-tijuana-tj-sgm-0172-carta-de-residencia
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: trámite
title: Carta de Residencia
summary: Documento para comprobar la residencia en la ciudad de Tijuana.
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Dirección de Gobierno / Correspondencia
official_ids:
  homoclave: TJ-SGM-0172
who_can:
- Interesado
when: Se realiza para los trámites que expresamente soliciten carta de residencia o constancia de domicilio.
result: Documento
requirements:
- text: Identificación Oficial con fotografía vigente
  cites:
  - source: remutys
  original_or_copy: original
- text: (Credencial de Elector, Licencia de Conducir, Cartilla Militar, Credencial del INSEN, INAPAM, Pasaporte
    Mexicano, Cedula Profesional, ISSSTE, IMSS, ISSSTECALI)
  cites:
  - source: remutys
  original_or_copy: original
- text: Dos comprobantes de domicilio MÁS RECIENTE y Uno de seis meses atrás para el caso de Cartas de Residencia
    menores al año
  cites:
  - source: remutys
  original_or_copy: original
- text: (Recibo de agua, luz, teléfono, gas, predial, cable, internet o estado de cuenta bancaria)
  cites:
  - source: remutys
  original_or_copy: original
- text: (Dichos recibos deberán estar a nombre del solicitante, en caso de no contar con ningún comprobante a su
    nombre, deberá de presentar contrato de arrendamiento, comodato donde manifieste que el ciudadano vive en ese
    domicilio)
  cites:
  - source: remutys
  original_or_copy: original
- text: (además deberá agregar copia simple de la identificación oficial de los testigos y del propietario o cualquier
    documento que demuestre una relación contractual con el propietario)
  cites:
  - source: remutys
  original_or_copy: original
- text: (así sea un sujeto obligado (dependencia) o particular (contrato de servicio domiciliarios))
  cites:
  - source: remutys
  original_or_copy: original
- text: Si usted desea una Carta de Residencia por un año o más, deberá presentar los comprobantes de domicilio
    por un año consecutivo que desea comprobar (un documento por un año)
  cites:
  - source: remutys
  original_or_copy: original
- text: En caso de que los comprobantes de domicilio estén a nombre de los padres, presentar acta de nac del solicitante,
    en escrito libre donde especifique que vive en ese domicilio y copia del INE del padre o madre cuyo nombre aparezca
    en los comprobantes
  cites:
  - source: remutys
  original_or_copy: original
cost:
