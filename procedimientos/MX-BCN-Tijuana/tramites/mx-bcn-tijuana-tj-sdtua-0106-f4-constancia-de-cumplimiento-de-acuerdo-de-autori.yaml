when: Una vez que el urbanizador o promotor inmobiliario haya cumplido con todas las obligaciones establecidas en
  la Autorización de la Acción de Urbanización
result: Constancia
requirements:
- text: Llenar y firmar solicitud de la dirección de administración urbana (propietario o representante legal).
  cites:
  - source: remutys
  original_or_copy: original
- text: Recibo de pago de derechos (conforme a la ley de ingresos).
  cites:
  - source: remutys
  original_or_copy: original
- text: Certificado de inscripción ante el registro público de la propiedad y del comercio (del acuerdo de autorización
    y memorias técnico descriptivas de lotificación y sus modificaciones).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Acta de terminación de obra (firmada por las entidades responsables y/o presupuesto de las obras de urbanización
    faltantes, deberá desglosarse por conceptos y números generadores de obra, exhibiendo la garantía correspondiente).
  cites:
  - source: remutys
  original_or_copy: original
- text: Reporte fotográfico
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Plano de lotificación autorizado y sus modificaciones.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: 'Archivo digital de la siguiente información: acuerdo publicado, fianza vigente, donación municipal, donación
    escolar, donación CESPT, calentamiento líneas CFE, bitácora de CESPT'
  cites:
  - source: remutys
  original_or_copy: original
