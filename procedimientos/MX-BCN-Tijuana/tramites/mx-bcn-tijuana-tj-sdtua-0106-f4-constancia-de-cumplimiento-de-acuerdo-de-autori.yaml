title: F4 Constancia de Cumplimiento de Acuerdo de Autorización
summary: Certifica que el urbanizador o promotor inmobiliario ha cumplido con las obligaciones establecidas en la
  Autorización de la Acción de Urbanización. Una vez acreditado el cumplimiento, se otorga la autorización para
  realizar la venta, escrituración o traslación de dominio de los lotes o casas resultantes del proyecto. En el
  caso de parques industriales, permite la venta y/o escrituración de lotes específicos.
