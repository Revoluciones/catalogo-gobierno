cost:
  type: variable
  amount_mxn: null
  text: 'Licencia nueva con vigencia de hasta un año, cuando la instalación se efectúe después que sea emitida esta
    licencia: a).-Cartelera o anuncio autoportante para uso exclusivo de comercio establecido en el mismo predio
    a publicitar (excepto espectaculares): 1).-De 0.01 M² a 1.00 M² en área de rótulo, por cartelera o anuncio autoportante,
    2).-De 1.01 M² a 5.99 M² en área de rótulo, por cartelera o anuncio autoportante, 3).-De 6.00 M² a 45.00 M²
    en área de rótulo, por cartelera o anuncio autoportante y De 45.01 M² a 92.00 M² en área de rótulo, por cartelera
    o anuncio autoportante: 13 UMA ($1,525.03) · Anuncio (autosoportado, autoportante o de cualquier otro tipo)
    de propaganda comercial tipo espectacular, por anuncio: 260 UMA ($30,500.60) · Anuncio tipo espectacular de
    pantalla electrónica y/o electromecánico o digital, incluye torre directorio de pantalla electrónica, pantalla
    en vehículos, con o sin movimiento, por cara de pantalla, por cartelera y/o estructura: 520 UMA ($61,001.20)
    · Rótulo pintado, denominativo y/o rótulo con propaganda comercial de productos que se venden en el establecimiento,
    por fachada ... . . 1).- De 0.01 M² a 2.00 M² en área de rótulo, excepto denominativos, por fachada, 2).- De
    2.01 M² a 10.00 M² en área de rótulo, por fachada, 3).-De 10.01 M² a 15.00 M² en área de rótulo, por fachada
    y 4).- Mayor de 15.00 M² Por M² o fracción excedente: 3 UMA ($351.93) · Rótulos pintados o adosados, para yonkes,
    recicladoras y centros de acopio, por fachada o barda: 15.6 UMA ($1,830.04) · Rótulo adosado, toldo, marquesina,
    por anuncio: 1).-Denominativos de 2.01 M² hasta 3.99 M² y/o rótulos con propaganda comercial de productos que
    se venden en el establecimiento de 0.01 M² hasta 3.99 M², 2).-Mayor de 3.99 M² hasta 15.00 M² y Los mayores
    de 15.00 M² costo por metro cuadrado o fracción excedente: 5.85 UMA ($686.26) · Rótulo adosado de pantalla electrónica
    para publicitar exclusivamente al establecimiento en el que se encuentra, exceptuando espectaculares y/o carteleras
    autoportantes y pantallas en vehículos: 1).- De 0.01 M² a 1.00 M² en área de rótulo, por anuncio de pantalla
    electrónica, 2).- De 1.01 M² a 5.99 M² en área de rótulo, por anuncio de pantalla electrónica y 3).- De 6.00
    M² a 10.00 M²en área de rótulo, por anuncio de pantalla electrónica: 13 UMA ($1,525.03) · Rótulo electrónico
    y/o electromecánico, y de neón con o sin movimiento, exceptuando espectaculares y/o carteleras, autoportantes
    y pantalla en vehículos: 1).-De 0.01 M² y hasta 1.50 M², por cara de anuncio, 2).-Mayor de 1.50 M², por cara
    de anuncio y 3).-Los mayores de 10.00 M², costo por M² o fracción excedente: 7.8 UMA ($915.02) · Anuncio de
    evento (manta, cartel y pendones) con información laica, cultural, deportivo, económico, educativo, que beneficie
    a la comunidad en su desarrollo social, que no implique erogación económica alguna para los habitantes del municipio
    o con información gubernamental de la federación, estado o municipio. Excento de Pago.: $0.00 · Torre directorio,
    por unidad (excepto electrónicas): 39 UMA ($4,575.09) · Mini porta cartel direccional exclusivamente para desarrollos
    habitacionales e industriales nuevos, por pieza por doce meses: 14.3 UMA ($1,677.53) · Cobertizo publicitario
    y/o mobiliario urbano con publicidad, (banca publicitaria, bote de basura o buzón con publicidad, etc.), por
    unidad: 26 UMA ($3,050.06) · Carro de sonido por unidad, por 90 días: 15.6 UMA ($1,830.04) · Torreta en techo
    de camión o taxi, por unidad: 19.5 UMA ($2,287.55) · Rótulo en vehículo público o privado, por anuncio: 12.19
    UMA ($1,430.01) · Valla publicitaria de hasta 12.50 M², por cada unidad: 52 UMA ($6,100.12) · Valla publicitaria
    por cada M² excedente: 10.4 UMA ($1,220.02) · Publicidad móvil remolcada: 1).-Con vehículo de tracción motriz
    de cuatro ruedas o más, en cualquier modalidad, sea en valla, cartelera giratoria, digital, etc., por 360 días,
    por unidad publicitaria (excepto pantalla electrónica) y 2).-Con vehículo de tracción motriz o no motriz menor
    de cuatro ruedas, en cualquier modalidad, sea en valla, cartelera giratoria, digital, etc., por cara publicitada,
    por 180 días, de unidad publicitaria (excepto pantalla electrónica): 26 UMA ($3,050.06) · Anuncio adosado en
    plumas de acceso a estacionamientos, por cara de anuncio: 8.53 UMA ($1,000.65) · Publicidad en nomenclatura
    vial, por placa con anuncio: 32.5 UMA ($3,812.58) · Publicidad en banderas, banderolas o estandartes, pendón
    o gallardete en sitio público o privado, por pieza de anuncio por tres meses: 10.39 UMA ($1,218.85) · Anuncio
    ambulante conducido por personas, por anuncio por día: 3.25 UMA ($381.26) · Anuncio en tapial por cada 12.50
    M², por anuncio: 39 UMA ($4,575.09) · Anuncio de proyección óptica, por anuncio: 65 UMA ($7,625.15) · Anuncio
    tipo caballete con superficie máxima de 1.20 m x 0.60 m., por 6 meses, por pieza: 11.7 UMA ($1,372.53) · Desmonte
    de estructura con grúa y acarreo: 1300 UMA ($152,503.00) · Almacenaje por día de la estructura: 1.95 UMA ($228.75)
    · Revalidación anual de licencia de anuncios, al verificarse que aún se cumplen los requisitos de reglamento;
    con vigencia de hasta un año: 1.7 UMA ($199.43) · Licencia de regularización de Anuncios con vigencia de hasta
    un año, cuando se ha efectuado la instalación sin contar previamente con la licencia correspondiente y/o revalidación
    extemporánea de licencia, a partir del cuarto mes de vencimiento: 1 UMA ($117.31). UMA 2026 = $117.31.'
