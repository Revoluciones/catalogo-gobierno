category: Negocios y trabajo, Infraestructura y vivienda
title: Dictamen Técnico de Ocupación de Inmueble
summary: Proceso administrativo que permite la regularización de las construcciones que existen pero que no tienen
  la licencia de construcción pertinente. Es una certificación oficial, que dictamina si la construcción cumple
  con las normas urbanísticas vigentes, o en caso contrario, especifica qué adecuaciones se deben de realizar.
authority:
  name: Secretaría de Desarrollo Territorial y Urbano (Ayuntamiento de Tijuana)
  unit: Dirección de Administración Urbana
official_ids:
  homoclave: TJ-SDTUA-0088
who_can:
- Interesado
when: En situaciones donde una construcción carece de licencia, ya sea por edificación inicial sin permisos, por
  ampliaciones o modificaciones no autorizadas, o cuando se busca regularizar inmuebles existentes para transacciones
  legales o para cumplir con requisitos de otros trámites.
result: Dictamen
requirements:
- text: Documentos que acrediten propiedad (escrituras, título de propiedad, contrato de compra-venta notariado
