id: mx-bcn-tijuana-tj-sgm-0190-inscripcion-de-registro-de-nacimiento-ocurrido-en
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Oficialía civil
title: Inscripción de registro de NACIMIENTO ocurrido en el extranjero
summary: Trámite que permite registrar en México el nacimiento de una persona ocurrido en otro país, otorgándole
  validez oficial ante las autoridades mexicanas.
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Oficialia del Registro Civil
official_ids:
  homoclave: TJ-SGM-0190
who_can:
- Interesado
- Representante_legal
when: Cuando la persona solicitante haya nacido en el extranjero, sea descendiente de padres mexicanos y desee obtener
  la nacionalidad mexicana · Cuando al menos uno de los padres es mexicano y desea registrar el nacimiento de su
  hijo/a en México. · Para realizar trámites legales en México que requieran un acta de nacimiento nacional.
result: Certificado
requirements:
- text: Solicitud de inscripción
  cites:
  - source: remutys
  original_or_copy: original
- text: Constancia de inexistencia de registro de nacimiento, expedido por el Registro Civil del Estado de Baja
    California.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Acta de nacimiento de los padres mexicanos.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Identificación oficial vigente de los padres o de la persona interesada en caso de ser mayor de edad.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Acta de nacimiento extranjera, apostillada o legalizada según el país de origen.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Traducción oficial al español del acta de nacimiento, realizada por un perito autorizado por el Tribunal
    Superior de Justicia del Estado.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: En caso de ser mayor de edad y no pueda presentarse, podrá ser representado mediante carta poder otorgada
    ante Notario Público.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
cost:
  type: gratuito
