id: mx-bcn-tijuana-tj-semovis-0221-ocupacion-temporal-de-la-via-publica-como-sitio
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Movilidad y transporte
title: Ocupación Temporal de la Vía Pública como Sitio
summary: Este trámite permite que los vehículos de alquiler, como los taxis, se estacionen en un lugar autorizado
  para que los usuarios puedan contratarlos. Estos lugares pueden ser en la vía pública o en propiedades privadas,
  y están destinados a estacionar vehículos que no sigan un itinerario fijo.
authority:
  name: Secretaría de Movilidad Urbana Sustentable (Ayuntamiento de Tijuana)
  unit: Dirección de Transporte Público
official_ids:
  homoclave: TJ-SEMOVIS-0221
who_can:
- Interesado
when: Cuando la persona solicitante desea obtener un espacio autorizado para estacionar vehículos de alquiler en
  la vía pública o en una propiedad privada.
result: Permiso temporal de sitio
requirements:
- text: Formato de solicitud.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Identificación oficial de la persona solicitante.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Si es representante de una agrupación de taxis de sitio, presentar Acta Constitutiva.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Croquis de ubicación detallando las calles, colonia y puntos de referencia donde se solicita el espacio.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Fotografías del área donde se pretende establecer el sitio.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Carta de autorización o anuencia por escrito del propietario o encargado de centros comerciales, hoteles
    u otros lugares cercanos, si el sitio está frente a ellos.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Carta de autorización para el uso de servicios sanitarios de los comercios cercanos, si aplica.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Si el sitio está en propiedad privada, presentar una carta de autorización del propietario, administrador
    o encargado, especificando cuántos cajones de estacionamiento serán utilizados.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
