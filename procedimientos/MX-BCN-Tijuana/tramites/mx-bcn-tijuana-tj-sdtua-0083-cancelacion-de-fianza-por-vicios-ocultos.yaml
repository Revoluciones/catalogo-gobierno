title: Cancelación de Fianza por Vicios Ocultos
summary: Permite liberar la fianza otorgada para garantizar la calidad de una construcción, una vez transcurridos
  dos años desde la entrega del área afectada.La fianza cubre vicios ocultos o defectos en estructura, instalaciones
  y materiales.
