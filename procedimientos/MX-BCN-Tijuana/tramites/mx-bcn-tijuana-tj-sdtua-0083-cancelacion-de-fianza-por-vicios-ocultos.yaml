notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Criterio
  para resolver: Será resuelta favorablemente si, al concluir el plazo de 5 días hábiles otorgado a los condóminos
  para reportar daños, no se presentan reclamaciones sobre vicios ocultos en las viviendas, y se verifica que no
  existan reclamaciones pendientes por fallas en la construcción.'
