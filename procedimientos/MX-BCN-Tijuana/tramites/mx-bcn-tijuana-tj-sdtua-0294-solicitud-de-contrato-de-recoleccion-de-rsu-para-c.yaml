notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Para
  empezar: https://pagos.tijuana.gob.mx/PagosEnLinea/index.aspx Criterio para resolver: 1.Presentar los requisitos
  completos 2.La DSPM evaluará si la ubicación solicitada está dentro de una ruta de recolección disponible. 3.
  No se otorgará el servicio a establecimientos ubicados dentro de plazas comerciales que cuenten con su propio
  sistema de recolección'
