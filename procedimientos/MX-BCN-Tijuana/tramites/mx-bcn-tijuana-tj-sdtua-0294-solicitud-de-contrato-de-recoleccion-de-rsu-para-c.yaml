title: Solicitud de contrato de recolección de RSU para comercios
summary: permite a los establecimientos comerciales solicitar la formalización de un contrato para la recolección
  de residuos sólidos urbanos (RSU), con el fin de cumplir con las normativas locales y garantizar una disposición
  adecuada de los residuos generados en sus actividades comerciales.
