cost:
  type: variable
  amount_mxn: null
  text: 'Por servicio domiciliado en ruta, cuya periodicidad sea de una vez por semana, se pagará anualmente y de
    forma anticipada: 28 UMA ($3,284.68) · Por servicio domiciliado en ruta, cuya periodicidad sea mayor a una vez
    por semana, se pagará anualmente y de forma anticipada: 56 UMA ($6,569.36) · Por traslado de residuos sólidos
    urbanos al lugar de disposición final autorizado a partir de la recepción de dichos residuos en sitios dispuestos
    y autorizados por la Autoridad Municipal, se pagará por tonelada lo siguiente: 10 UMA ($1,173.10). UMA 2026
    = $117.31.'
