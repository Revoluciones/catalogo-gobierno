id: mx-bcn-tijuana-tj-semovis-0220-devolucion-de-vehiculo-incautado
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Movilidad y transporte
title: Devolucion de Vehiculo Incautado
summary: Este trámite permite recuperar un vehículo que fue remolcado por haber cometido una falta administrativa.
  Para ello, el propietario o persona autorizada debe acudir a la Dirección Municipal del Transporte Público.
authority:
  name: Secretaría de Movilidad Urbana Sustentable (Ayuntamiento de Tijuana)
  unit: Dirección de Transporte Público
official_ids:
  homoclave: TJ-SEMOVIS-0220
who_can:
- Interesado
when: Cuando un vehículo ha sido retenido y remolcado por infringir el reglamento de tránsito o transporte y su
  propietario desea recuperarlo.
result: Oficio
requirements:
- text: Pago de infracción y adeudos por maniobras, arrastre y almacenamiento.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Visto bueno emitido por la Secretaría de Gobierno o el Departamento de Arrastres y Almacenamiento de Vehículos
    (con sello, fecha, nombre y firma del titular).
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: 'Documento que acredite la propiedad del vehículo, puede ser:'
  cites:
  - source: remutys
- text: Tarjeta de circulación vigente o constancia de cotejo (si es vehículo fronterizo o nacional).
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Factura sellada y firmada por el lote o agencia de autos.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Factura electrónica válida ante el SAT.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Endoso o contrato de compraventa (con identificación oficial de ambas partes).
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: En caso de ser vehículo rentado, contrato de arrendamiento y copia de identificación oficial de las partes
    involucradas.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Hoja de inventario del vehículo y orden de liberación.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
