notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Criterio
  para resolver: La devolución del vehículo se autoriza una vez que se ha verificado la documentación, se ha comprobado
  el pago de las infracciones y servicios de remolque, y se ha obtenido la validación de las autoridades correspondientes.'
