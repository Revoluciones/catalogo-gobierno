cost:
  type: variable
  amount_mxn: null
  text: 'A) Contribuyentes de servicios médicos o que presten servicios asociados o de apoyo a clientes de servicio
    médicos: 3.58 UMA ($419.97) · B) Pase a cámaras, empresas y organismos empresariales no gubernamentales, instituciones
    públicas o asociaciones sin fines de lucro, prestador de servicios de turismo de negocios: 5.98 UMA ($701.51)
    · C) Pase mensual para estudiantes transfronterizos (incluye 24 pases, 20 pases de lunes a viernes y 4 exclusivos
    para sábado ): 53.6 UMA ($6,287.82) · D) Acompañante adicional (cada pasajero, solo en vehículos de traslado):
    0.89 UMA ($104.41) · E) Inscripción o renovación anual al programa de usuarios de servicio médicos, turismo
    de negocios y estudiantes transfronterizos: 38.55 UMA ($4,522.30) · F) Pase mensual para trabajadores transfronterizos
    con un cruce por día, por la garita de Otay, acceso mensual, horario sujeto a operación de caseta: 95 UMA ($11,144.45)
    · G) Pase mensual para trabajadores transfronterizos, con dos cruces por día, por garitas SY All Trafific, SY
    Ready Lane, Otay, acceso mensual, horario sujeto a operación de caseta: 140 UMA ($16,423.40) · H) Pase humanitario:
    4.5 UMA ($527.89) · I) Costo de reposición de tarjeta NFC para estudiantes transfronterizos: 5 UMA ($586.55).
    UMA 2026 = $117.31.'
