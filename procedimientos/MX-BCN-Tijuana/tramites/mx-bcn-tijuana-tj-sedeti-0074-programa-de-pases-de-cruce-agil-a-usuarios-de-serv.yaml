- Interesado
when: Cuando los usuarios del sector médico y turismo de negocios quieran inscribirse al programa para ofrecer la
  cortesía a sus clientes que residen en los Estados Unidos de América, de poder retornarse sin hacer largas filas
  de espera en el cruce de garita
result: Usuario y contraseña
