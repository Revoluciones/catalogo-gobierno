  amount_mxn: null
  text: 'Para evaluar solicitudes de permiso para tala o poda de árboles: 6.5 UMA ($762.51) · Poda con herramienta
    manual de pieza menor de 3.00 m. de altura (copa de 3.00 a 4.00 m.), incluye: herramienta menor, realización
    del trabajo, limpieza, retiro y traslado del producto de la poda: 15.6 UMA ($1,830.04) · Poda con maquinaria
    y equipo a pieza mayor a 3.00 m. y menor a 11.00 m. (copa de 8.00 a 11.00 m.), incluye: grúa, equipo especial
    y herramienta menor, mano de obra, limpieza y retiro del producto de la poda: 66.3 UMA ($7,777.65). UMA 2026
    = $117.31.'
