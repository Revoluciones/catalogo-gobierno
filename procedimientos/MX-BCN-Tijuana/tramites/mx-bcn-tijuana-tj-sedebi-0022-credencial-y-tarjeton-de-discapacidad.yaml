title: Credencial y Tarjetón de Discapacidad
summary: La credencial para personas con discapacidad es un documento oficial de identificación personal y un tarjetón
  vehicular que permite a sus titulares hacer uso exclusivo de los espacios de estacionamiento designados para personas
  con discapacidad, tanto en establecimientos públicos como privados.
authority:
  name: Secretaría del Bienestar (Ayuntamiento de Tijuana)
  unit: Desarrollo Integral de la Familia - SDIF
official_ids:
  homoclave: TJ-SEDEBI-0022
who_can:
- Interesado
when: Cuando una persona tiene una discapacidad, ya sea permanente o temporal, que le dificulta la movilidad o el
  acceso a espacios públicos
result: Credencial y Tarjetón
requirements:
- text: Certificado médico expedido por IMSS, ISSSTE, ISSSTECALI, INSABI
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Acta de nacimiento
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Credencial del INE
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: CURP
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Comprobante de domicilio no mayor a 3 meses de la ciudad de Tijuana ( Agua o Luz o Predial)
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Constancia ante Ministerio Público en caso de robo o extravió de la credencial, tarjetón o ambos
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: En caso de que el certificado médico sea expedido por un especialista, es necesario llevarlo a un Centro
    de Salud para una certificación o actualización de fecha
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
