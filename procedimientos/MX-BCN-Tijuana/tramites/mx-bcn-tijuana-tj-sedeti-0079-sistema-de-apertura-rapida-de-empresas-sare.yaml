notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Para
  empezar: https://pagos.tijuana.gob.mx/PagosEnLinea/index.aspx Criterio para resolver: Para ser elegible para el
  Sistema de Apertura Rápida de Empresas (SARE), el giro comercial debe estar incluido en el Catálogo de Giros SARE,
  operar en un inmueble completamente edificado y habilitado para tal fin sin exceder de 100 metros cuadrados, y
  no contemplar la venta ni el consumo de bebidas alcohólicas en ninguna de sus presentaciones.'
