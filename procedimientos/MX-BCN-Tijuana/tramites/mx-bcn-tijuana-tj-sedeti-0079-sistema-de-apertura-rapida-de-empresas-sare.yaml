title: Sistema de Apertura Rápida de Empresas (SARE)
summary: Sistema que simplifica el proceso para obtener la licencia de operación para negocios de bajo y mediano
  impacto ambiental de forma rápida y sencilla en solo 3 días hábiles. De acuerdo con el Artículo 10 del Reglamento
  del SARE, una vez transcurrido el plazo de resolución de 3 días hábiles, el solicitante contará con un término
  máximo de 90 días hábiles para finalizar su trámite en el Portal Electronico del SARE. En caso de no cumplirse
  este plazo, el trámite se dará por cancelado automáticamente.
