  homoclave: TJ-SEDETI-0079
who_can:
- Interesado
when: Cuando un emprendedor o empresario local desea obtener la licencia de operación de forma ágil y sencilla
result: Dictamen de Uso de Suelo, Certificado de Medidas de Seguridad, Registro de Residuos Sólidos Urbanos y Licencia
  de Operación
requirements:
- text: Licencia de construcción y terminación de obra del local, si éste tiene menos de 5 años de haber sido construido,
    de lo contrario, recibo de agua o luz.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Si usted no contratara el servicio de recolección de basura del Ayuntamiento, deberá anexar contrato, manifiesto
    o última factura del servicio de recolección con la empresa autorizada por la Dirección de Protección al Ambiente
    de su elección.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: 'Fotografías: 4 del exterior y fachada completa, y 4 del interior del local en diferentes ángulos, además
    de las que incluyan sanitario, extintor, señalamientos preventivos, fachada exterior completa y depósito de
    basura y/o contenedor'
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Carta poder simple, en caso de ser persona distinta la que realice el trámite (solicitada por la Dirección
    de Protección al Ambiente).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: De ser persona moral, acta constitutiva y poderes legales.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Identificaciones oficiales (propietario-solicitante, arrendador-arrendatario y/o comodante-comodatario,
    según sea el caso).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Documento que acredite la propiedad o posesión del inmueble (escrituras, título de propiedad, contrato de
    compraventa, contrato de arrendamiento y/o contrato de comodato, según sea el caso).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
