inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Negocios y trabajo, Infraestructura y vivienda
title: Evaluación de Estudio de Impacto Vial
summary: Trámite donde se evalúa el Estudio de Impacto Vial en lo que respecta a la forma en que la utilización
  del suelo afecta la estructura vial establecida en los Planes y Programas de desarrollo urbano y, en la mitigación
  y adecuación de espacios públicos viales para garantizar, evitar y/o minimizar los impactos generados en la movilidad
  de la zona, en beneficio de la población, y determinar la viabilidad del proyecto. Gestionado únicamente por peritos
  viales.
authority:
  name: Presidencia Municipal (Ayuntamiento de Tijuana)
  unit: Instituto Metropolitano de Planeación Tijuana (IMPLAN)
official_ids:
  homoclave: TJ-PM-0213
who_can:
- Interesado
when: En acciones de urbanización y/o edificación de centros comerciales de nivel distrital, central, regional e
  industriales · En acciones de urbanización y/o edificación centros de espectáculos públicos, como estadios y plazas
  de toros · En acciones de urbanización y/o edificación conjuntos universitarios y de educación superior · En acciones
  de urbanización y/o edificación centros educativos integrales · En acciones de urbanización y/o edificación conjuntos
  hospitalarios y centros médicos · En acciones de urbanización y/o edificación centros de exposiciones y ferias
  permanentes · En acciones de urbanización y/o edificación torres de oficinas, apartamentos y usos mixtos · En
  acciones de urbanización y/o edificación fraccionamientos, conjuntos habitacionales de media y alta densidad ·
  En aquellos que por las características propias de las actividades concentren una alta cantidad de usuarios que
  represente posibles impactos negativos a la infraestructura vial del contexto inmediato donde se pretenda desarrollar
  el uso de suelo correspondiente. · En acciones de urbanización y/o edificación conjuntos administrativos público
  o privado. · Otros que por su ubicación específica representen fuente de conflicto con la vialidad de la zona
  así como su nivel de servicio (NDS)
result: Dictamen
