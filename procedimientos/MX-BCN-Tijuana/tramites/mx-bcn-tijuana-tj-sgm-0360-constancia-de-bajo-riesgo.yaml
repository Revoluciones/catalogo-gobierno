title: Constancia de Bajo Riesgo
summary: Este trámite está enfocado a garantizar las medidas de seguridad de los negocios de bajo riesgo, siempre
  y cuando no excedan una superficie de construcción mayor a 200m² y no manejen ningún tipo de material peligroso,
  esto con el fin de agilizar este trámite a los ciudadanos. El costo varía en función del giro comercial de la
  microindustria o empresa.
