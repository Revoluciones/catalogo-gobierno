id: mx-bcn-tijuana-tj-sgm-0201-registro-de-nacimiento-ordinario
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Oficialía civil
title: Registro de NACIMIENTO Ordinario
summary: Este trámite permite registrar oficialmente el nacimiento de un infante menor de 5 años ante el Registro
  Civil de Tijuana.
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Oficialia del Registro Civil
official_ids:
  homoclave: TJ-SGM-0201
who_can:
- Interesado
when: Cuando se necesita obtener el acta de nacimiento de una persona menor de 5 años que aún no ha sido registrada.
result: Certificado
requirements:
- text: Certificado de nacimiento.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Cartilla de vacunación (en caso de contar con ella).
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Acta de nacimiento e identificación oficial de los padres.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Si los padres están casados, presentar el acta de matrimonio. Si no están casados, ambos deben presentarse
    para el registro.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Si alguno de los padres es menor de edad, se requiere el consentimiento de sus propios padres o tutores,
    acompañados de sus actas de nacimiento, acta de matrimonio (si aplica) e identificaciones oficiales.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Dos testigos mayores de edad con identificaciones oficiales vigentes.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Es necesario llevar al menor al momento del registro.
  cites:
  - source: remutys
- text: Si el menor nació en otro estado, se debe presentar una constancia de inexistencia de registro de nacimiento
    emitida por el estado correspondiente.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Constancia de inexistencia de registro de nacimiento, expedido por el Registro Civil del Estado de Baja
    California.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
cost:
  type: gratuito
  amount_mxn: 0
  text: Gratuito según la ficha oficial.
