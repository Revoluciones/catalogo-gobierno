title: Constancia (Estancias infantiles y preescolares del SDIF)
summary: Servicios de atención integral a niños y niñas de padres trabajadores en situación de vulnerabilidad a
  través de Centros Asistenciales de Desarrollo Infantil (CADI) para recibir el servicio de estancia infantil.
authority:
  name: Secretaría del Bienestar (Ayuntamiento de Tijuana)
  unit: Desarrollo Integral de la Familia - SDIF
official_ids:
  homoclave: TJ-SEDEBI-0025
who_can:
- Interesado
when: Si los padres trabajadores se encuentran en situación de vulnerabilidad y necesitan un lugar seguro y adecuado
  donde dejar a sus hijos durante sus jornadas laborales
result: Estancia
requirements:
- text: Acta de nacimiento del menor
  cites:
  - source: remutys
  original_or_copy: original, 2 copia(s)
- text: 2 Fotografías del menor tamaño infantil reciente, de preferencia a color, en papel mate, no instantáneas
    de frente con la cara descubierta, sin lentes, sombrero, cachucha, etc. En el caso de las niñas sin accesorios,
    cabello recogido y sin maquillaje
  cites:
  - source: remutys
  original_or_copy: original
- text: Cartilla de vacunación actualizada del menor
  cites:
  - source: remutys
  original_or_copy: original, 2 copia(s)
- text: CURP del menor (nuevo formato)
  cites:
  - source: remutys
  original_or_copy: original, 2 copia(s)
- text: Comprobante de domicilio no mayor a 3 meses de la ciudad de Tijuana (recibo de agua o luz o predial)
  cites:
  - source: remutys
  original_or_copy: original, 2 copia(s)
- text: Certificado Médico del menor (con peso y talla)
  cites:
  - source: remutys
  original_or_copy: original
- text: Identificación oficial de los padres y personas autorizadas
  cites:
  - source: remutys
  original_or_copy: original, 2 copia(s)
- text: RFC de los padres únicamente
  cites:
  - source: remutys
  original_or_copy: original
- text: Nombre de las calles que rodean su domicilio (se llenará un formato de croquis)
  cites:
  - source: remutys
  original_or_copy: original
- text: Carta de trabajo de cada uno de los padres (con sueldo mensual, dirección, teléfono, horario de trabajo,
    días de descanso y periodos vacacionales)
  cites:
  - source: remutys
  original_or_copy: original
- text: Teléfono y domicilio de la personas autorizadas
  cites:
  - source: remutys
  original_or_copy: original
