legal_basis:
  - source: rtt
    pinpoint: arts. 99 a 102
  - source: cpbc
    pinpoint: arts. 75, 115, 159, 227 y 231
  - source: cnpp
    pinpoint: arts. 187, 216, 225, 254 y 258
steps:
  - n: '1'
    actor: Tú
    action: >-
      En el lugar: no persigas al otro carro. Si alguien está herido, llama al 911 por una ambulancia y no lo muevas
      salvo que corra peligro. Avisa a tránsito aunque el daño sea leve: el reglamento obliga a todo conductor que
      sufra un choque a dar aviso inmediato.
    cites:
      - source: rtt
        pinpoint: arts. 99 y 100, fracción I
        quote: >-
          Es obligación de todo conductor de vehículo que sufra o cause un hecho vial dar aviso inmediato a la Dirección,
          aun cuando los daños sean leves
      - source: eluniversal-fuga
        quote: No persigas al conductor que se dio a la fuga
    next:
      - to: '2'
      - to: mx-bcn-denunciar-un-delito-ante-la-fiscalia
        when: 'Hay personas lesionadas: además ve a denunciar en persona'
  - n: '2'
    actor: Agente de tránsito municipal
    action: >-
      Toma los datos y hace el reporte: lugar, vehículos, conductores, la evidencia física, los daños y un croquis.
      Irse del lugar del accidente es una infracción grave para el otro conductor. Pide el número del reporte.
    cites:
      - source: rtt
        pinpoint: art. 102
      - source: rtt
        pinpoint: tabla de infracciones, art. 100 fracción I
        quote: Abandonar el lugar del accidente
  - n: '3'
    actor: Tú y tu aseguradora
    action: >-
      Llama a tu aseguradora desde el lugar para que mande al ajustador antes de mover el carro. Con cobertura amplia,
      la aseguradora repara tu carro y tú pagas el deducible. Si solo tienes responsabilidad civil, esa póliza cubre
      lo que tú le hagas a otros, no tu carro: entonces cobrar depende de que encuentren al otro conductor.
    cites:
      - source: eluniversal-fuga
        quote: llamar a tu aseguradora y esperar a que envíen al ajustador
      - source: unotv-condusef
        quote: el seguro de responsabilidad civil, el cual te ampara por los daños que puedas causar a terceros
    practice:
      - text: Es muy común que la aseguradora pida copia de tu denuncia ante el Ministerio Público para pagar.
        evidence_level: periodismo_o_investigacion
        observed: Nota de prensa nacional con información de una aseguradora
        cites:
          - source: eluniversal-fuga
            quote: >-
              es muy probable que las aseguradoras piden como requisito indispensable para proceder con los trámites
              tu denuncia
  - n: '4'
    actor: Tú
    action: >-
      Presenta la querella por daño en propiedad ajena ante la Fiscalía: por videollamada en CDTEC, por teléfono
      o en persona. Este delito solo se investiga si tú lo pides. En la misma querella pide por escrito que el Ministerio
      Público solicite los videos de cámaras públicas y privadas de la zona, que consulte la placa y que un perito
      valúe el daño.
    cites:
      - source: cpbc
        pinpoint: art. 231
        quote: Los daños en propiedad ajena se perseguirán por querella de parte ofendida
      - source: cnpp
        pinpoint: arts. 216 y 225
      - source: zeta-telefono
        quote: >-
          Por teléfono se pueden denunciar robo de vehículos, robo o extravío de documentos, abuso de confianza,
          fraude y daños
    next:
      - to: '5'
      - to: mx-bcn-denunciar-un-delito-ante-la-fiscalia
        when: Para el paso a paso de la denuncia y tus derechos de víctima
  - n: 4b
    actor: Ministerio Público
    action: >-
      Casos que la Fiscalía investiga aunque no presentes querella: si el conductor iba ebrio o drogado. Si atropelló
      a alguien y no lo ayudó ni pidió ayuda, eso es otro delito, además de las lesiones.
    cites:
      - source: cpbc
        pinpoint: arts. 231 y 255
        quote: cuya persecución será de manera oficiosa
      - source: cpbc
        pinpoint: art. 159
        quote: Al que habiendo atropellado a una persona, no le preste auxilio
  - n: '5'
    actor: Ministerio Público
    action: >-
      Investiga: busca al dueño por la placa, pide videos y cita a la persona. Por el puro daño a un carro, sin
      intención y sin alcohol, el castigo es solo una multa, así que lo que en realidad se busca es que te paguen.
    cites:
      - source: cnpp
        pinpoint: art. 131, fracciones V y IX
      - source: cpbc
        pinpoint: art. 75
        quote: se cause únicamente daño en propiedad ajena, se sancionará hasta con cuarenta días multa
    next:
      - to: 5a
        when: Identifican al conductor
      - to: 5b
        when: No hay placa, video ni testigos
  - n: 5a
    actor: Tú y la persona responsable
    action: >-
      Acuerdo reparatorio: acuerdan cómo te paga o repara (o su aseguradora, si tiene) y, cuando cumple, el caso
      se cierra. Si no cumple, el caso sigue.
    cites:
      - source: cnpp
        pinpoint: arts. 186 y 187, fracciones I y II
      - source: unotv-condusef
    next:
      - to: fin
  - n: 5b
    actor: Ministerio Público
    action: 'Archivo temporal: guarda el caso hasta que aparezcan datos nuevos. Te lo deben notificar.'
    cites:
      - source: cnpp
        pinpoint: arts. 254 y 258
    next:
      - to: '6'
    practice:
      - text: >-
          A nivel nacional, de cada 10 denuncias que sí se investigan, menos de 2 terminan bien para quien denunció.
          Por eso, en un choque y fuga sin placa ni video, lo más seguro para recuperar el dinero suele ser tu propio
          seguro.
        evidence_level: documento_oficial
        observed: Encuesta nacional del INEGI sobre delitos del año anterior
        cites:
          - source: envipe2026
            pinpoint: III. Denuncia y cifra oculta
  - n: '6'
    actor: Tú
    action: >-
      Si consigues datos nuevos (un video, la placa, un testigo), llévalos para que reabran el caso. Si no estás
      de acuerdo con el archivo, pide a un juez de control que lo revise dentro de los 10 días siguientes a que
      te avisen.
    deadline: 10 días después de la notificación
    cites:
      - source: cnpp
        pinpoint: arts. 254 y 258
    next:
      - to: fin
