id: mx-bcn-tijuana-choque-y-fuga-danos-a-tu-vehiculo
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: varios
kind: tramite
category: denuncias y quejas
title: 'Te chocaron el carro y el otro conductor se fue: a quién avisar y cómo cobrar los daños'
summary: >-
  Se hace en tres frentes al mismo tiempo. Tránsito municipal toma el reporte en el lugar. Tu aseguradora manda
  un ajustador y, si tienes cobertura amplia, paga tu carro menos el deducible. Y la Fiscalía, con tu querella,
  puede buscar al responsable para que te pague. Si no hay placa ni video, lo más probable es que la Fiscalía archive
  el caso, así que junta pruebas desde el primer minuto.
authority:
  name: Fiscalía General del Estado de Baja California
  unit: Fiscalía Regional de Tijuana
  url: https://www.fgebc.gob.mx
other_authorities:
  - name: Policía y Tránsito Municipal de Tijuana (toma el reporte del accidente)
    url: https://policia.tijuana.gob.mx
  - name: Tu aseguradora (manda al ajustador y paga según tu póliza)
  - name: Juez de control (revisa si la Fiscalía archiva el caso)
who_can:
  - La persona dueña del vehículo dañado o quien la represente legalmente.
when: >-
  Avisa a tránsito y a tu aseguradora en el momento, desde el lugar. La querella ante la Fiscalía puede presentarse
  hasta 1 año después, pero mientras antes, más pruebas hay.
result: >-
  Un reporte del accidente, un número de siniestro con tu aseguradora y una carpeta de investigación. Si identifican
  al conductor, un acuerdo para que te pague.
cost:
  type: variable
  text: >-
    Las denuncias son gratis. Si usas tu seguro de cobertura amplia, pagas el deducible de tu póliza, salvo que
    tu póliza no lo cobre cuando se identifica al responsable.
  cites:
    - source: cnpp
      pinpoint: art. 109, fracción IX
    - source: unotv-condusef
      quote: cobertura deducible 0 con tercero responsable
channels:
  - presencial
  - en_linea
  - telefono
requirements:
  - text: >-
      Fotos del daño, de la posición de tu carro y del lugar, y de cualquier pedazo, pintura o pieza que dejó el
      otro vehículo. Es la evidencia física que el reporte de tránsito debe registrar.
    cites:
      - source: rtt
        pinpoint: art. 102, fracción VII
        quote: Identificación, conservación y registro de toda evidencia física
      - source: eluniversal-fuga
        quote: tomar fotografías al daño
  - text: >-
      Lo que recuerdes del otro vehículo: placa (aunque sea incompleta), marca, color, daños visibles y hacia dónde
      se fue.
    cites:
      - source: cnpp
        pinpoint: art. 223
        quote: la indicación de quién o quiénes lo habrían cometido
  - text: Nombre y teléfono de testigos.
    cites:
      - source: cnpp
        pinpoint: art. 223
        quote: las personas que lo hayan presenciado
      - source: eluniversal-fuga
        quote: Busca a distintos testigos
  - text: >-
      Videos: de tu cámara de tablero, y de negocios o casas cercanas (pídelos el mismo día). Los videos de las
      cámaras del gobierno pídeselos por escrito al Ministerio Público en tu querella: él puede requerirlos a otras
      autoridades.
    cites:
      - source: cnpp
        pinpoint: art. 131, fracción IX
        quote: Requerir informes o documentación a otras autoridades y a particulares
      - source: cnpp
        pinpoint: art. 216
  - text: El número del reporte de tránsito y el número de siniestro de tu aseguradora.
    cites:
      - source: rtt
        pinpoint: art. 102
      - source: eluniversal-fuga
  - text: Tu identificación, tarjeta de circulación y póliza de seguro.
    cites:
      - source: rtt
        pinpoint: art. 26
        quote: También deberá contar con seguro de responsabilidad civil
      - source: cdtec-registro
        pinpoint: Tipo identificación
  - text: Presupuesto o factura de la reparación, para que se cuantifique el daño que te deben pagar.
    cites:
      - source: cnpp
        pinpoint: art. 131, fracción V
        quote: >-
          recabar los elementos necesarios que determinen el daño causado por el delito y la cuantificación del
          mismo
deadlines:
  - what: para_presentar
    text: 'Querella por daños: 1 año desde que supiste del delito (3 años como máximo).'
    cites:
      - source: cpbc
        pinpoint: arts. 115 y 231
  - what: otro
    text: >-
      Si la Fiscalía archiva el caso, tienes 10 días después de que te avisan para pedir que un juez lo revise.
    cites:
      - source: cnpp
        pinpoint: art. 258
