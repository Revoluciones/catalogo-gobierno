notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Criterio
  para resolver: La construcción de la integración vial y las vialidades de acceso al desarrollo, ubicadas fuera
  del perímetro del mismo, deberá realizarse conforme a los proyectos aprobados, contando con la opinión favorable
  del IMPLAN y la DOIUM. Asimismo, será indispensable obtener la licencia correspondiente emitida por la Dirección
  competente para llevar a cabo dichas obras'
