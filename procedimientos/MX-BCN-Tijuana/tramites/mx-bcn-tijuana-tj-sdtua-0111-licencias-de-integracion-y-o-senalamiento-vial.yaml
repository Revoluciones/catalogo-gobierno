title: Licencias de Integración y/o Señalamiento Vial
summary: Análisis y emisión de la factibilidad técnica para la integración vial de desarrollos habitacionales, turísticos,
  comerciales, industriales, entre otros. Incluye la definición de la ruta, origen y destino de la vialidad, así
  como las normativas de diseño y planeación a seguir.
