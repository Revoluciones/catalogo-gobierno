title: Constancia Notorio Arraigo
summary: Los solicitantes del registro constitutivo de una asociación religiosa deberán acreditar que la iglesia
  o la agrupación religiosa ha realizado actividades religiosas en la República Mexicana por un mínimo de 5 años
  y cuenta con notorio arraigo entre la población, además de haber establecido su domicilio en la República (LARCP
  ART 7 FRACC.II)
