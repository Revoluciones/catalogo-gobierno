title: Anotación de cambio de régimen MATRIMONIAL o registro o modificación a las capitulaciones matrimoniales
summary: Este trámite permite cambiar el régimen matrimonial pactado al contraer matrimonio. Puede realizarse a
  través de un proceso judicial o mediante un notario público, y se registra el cambio en el acta de matrimonio.
