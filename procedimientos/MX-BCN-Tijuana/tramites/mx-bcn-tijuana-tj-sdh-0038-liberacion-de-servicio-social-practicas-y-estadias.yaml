summary: Estudiantes universitarios que buscan la oportunidad de realizar y liberar su servicio social, prácticas
  o estadías en áreas del municipio de Tijuana, aplicando sus conocimientos y adquiriendo experiencia laboral. A
  través del IMJUV y convenios con universidades, los jóvenes pueden contribuir a la comunidad y cumplir con requisitos
  académicos, fortaleciendo habilidades y conociendo el sector público.
