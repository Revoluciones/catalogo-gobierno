notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Criterio
  para resolver: La resolución de la solicitud estará sujeta al cumplimiento de los requisitos establecidos en la
  normatividad municipal aplicable, la revisión de la documentación presentada y la valoración de la factibilidad
  de la actividad y del espacio solicitado, considerando que no se afecten el interés público, la seguridad, la
  salubridad, la movilidad ni el uso adecuado de la vía pública. La autorización o negativa deberá estar debidamente
  fundada y motivada por la autoridad competente.'
