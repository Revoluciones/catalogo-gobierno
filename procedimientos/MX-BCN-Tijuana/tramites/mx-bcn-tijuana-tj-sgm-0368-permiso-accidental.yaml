title: Permiso Accidental
summary: Trámite mediante el cual las personas físicas o morales solicitan autorización temporal para realizar actividades
  comerciales en la vía pública o en espacios determinados, con motivo de eventos, festividades u otras actividades
  de carácter extraordinario, sujeto al cumplimiento de los requisitos establecidos por la autoridad municipal competente
  y a la disponibilidad y autorización del espacio solicitado.
