when: Cuando la persona interesada requiera obtener autorización municipal para realizar una actividad de comercio
  accidental en la vía pública, deberá presentar su solicitud antes de iniciar dicha actividad, con anticipación
  suficiente para su revisión y autorización por parte de la autoridad competente.
