category: Oficialía civil
title: Expedición de COPIA CERTIFICADA DE ACTA LOCAL de Nacimiento, Matrimonio, Defunción, Divorcio, Adopción
summary: Permite obtener una copia oficial y certificada de un acta de nacimiento, matrimonio, defunción, divorcio
  o adopción, registrada en el municipio. Esta copia tiene validez legal y se puede usar para diversos trámites
  oficiales, como la obtención de documentos, identificación o para trámites legales.
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Oficialia del Registro Civil
official_ids:
  homoclave: TJ-SGM-0188
who_can:
- Interesado
when: Cuando se necesita una copia certificada para gestiones como pasaporte, inscripción escolar, trámites migratorios
  o legales. · Si el acta original se extravió, está dañada o es ilegible. · En casos donde se requiera comprobar
  datos personales o familiares, como matrimonio, divorcio, adopción o defunción.
result: Certificado
requirements:
- text: Copia del Acta o CURP
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
