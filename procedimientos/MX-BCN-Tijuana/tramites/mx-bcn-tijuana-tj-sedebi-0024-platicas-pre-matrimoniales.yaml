notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Tipo
  en el registro: servicio. Criterio para resolver: Para la expedición de la constancia ambos contrayentes deben
  solicitar una cita (35 diarias) de lunes a viernes de 8:30 a 15:30 horas en las instalaciones del SDIF Municipal
  o al teléfono 608-82-00 ext. 8083, 8066, 8095, 8096 o 8077. El día y hora acordados, deberán presentarse con folio
  e identificación oficial, llenar formatos, indicar fecha y delegación de matrimonio, realizar el pago y asistir
  a la plática. La constancia se entrega posterior a la plática'
