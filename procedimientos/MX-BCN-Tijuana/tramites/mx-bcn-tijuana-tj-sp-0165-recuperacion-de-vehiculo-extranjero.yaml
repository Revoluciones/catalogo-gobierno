kind: tramite
category: Movilidad y transporte
title: Recuperación de Vehículo Extranjero
summary: Autorización para recuperar un vehículo extranjero que haya sido remolcado y almacenado en un depósito
  autorizado por el Ayuntamiento de Tijuana.
authority:
  name: Sindicatura Procuradora (Ayuntamiento de Tijuana)
  unit: Sindicatura Procuradora
official_ids:
  homoclave: TJ-SP-0165
who_can:
- Interesado
when: Cuando un vehículo extranjero ha sido remolcado y almacenado en un depósito autorizado.
result: Oficio
requirements:
- text: 'Documento que acredite la propiedad: Título de propiedad, Registro vigente expedido por DMV'
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Identificación vigente emitida por el país de procedencia (Licencia de Conducir, ID, Pasaporte)
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Hoja de inventario de arrastre
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Recibo de Infraccion pagada
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Si el vehículo es rentado, presentar contrato de arrendamiento.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Carta consular otorgada por la autoridad competente a nombre del solicitante, tratándose de vehículos con
    reporte de robo en el extranjero
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Para liberar un vehículo extranjero arrendado, financiado o con reporte de robo, se requiere el visto bueno
    de la autoridad correspondiente.
  cites:
  - source: remutys
cost:
  type: variable
  amount_mxn: null
  text: 'Por arrastre de automóvil, camioneta y pick-up: 8.45 UMA ($991.27) · Por arrastre de camiones de pasajeros:
    13 UMA ($1,525.03) · Por arrastre de camiones de servicio público o particular de carga: 13 UMA ($1,525.03)
    · Por arrastre de auto-tractores por cada maniobra de arrastre: 26 UMA ($3,050.06) · Por arrastre de auto-tractores
    por cada maniobra de arrastre por caja: 13 UMA ($1,525.03) · Semiremolque y/o doble remolque (tipo dolly): 13
    UMA ($1,525.03) · Pago adicional cuando el vehículo no puede rodar por falta de llantas o fallas mecánicas,
    requiriendo dolly, maniobras especiales, uso de equipo en más de una ocasión o rescate por volcadura o salida
    de carretera.: 2.6 UMA ($305.01) · Pago adicional por uso de grúa para vehículo con defensa adaptada a la original
    (spoiler): 2.6 UMA ($305.01) · Pago adicional por uso de maniobra por parte del operador para retirar vehículo
    de cajón de estacionamiento con alto grado de dificultad: 2.6 UMA ($305.01) · Pago adicional por uso de maniobras
    con alto grado de dificultad cuando sea necesario retirar el cambio en la transmisión, siendo éste de tracción
    trasera y/o conlleve un alto riesgo para el operador de la grúa: 2.6 UMA ($305.01) · Pago adicional por volcadura
    de vehículos ligeros, considerando la ubicación y el nivel de riesgo para el rescate.: 5.2 UMA ($610.01) · Pago
    adicional por volcadura de vehículos de carga y/o autobuses, según la ubicación y el nivel de riesgo del rescate.:
    29.25 UMA ($3,431.32) · Por arrastre de motocicletas: 10.4 UMA ($1,220.02) · Por arrastre de bicicletas: 1.3
    UMA ($152.50) · Cargo por presentación de grúa sin remolque, cuando no se complete el servicio por causas ajenas
    a la grúa: Automoviles, camionetas, pick-ups o Camiones de pasajeros (microbús): 3.9 UMA ($457.51) · Cargo por
    presentación de grúa sin remolque, cuando no se complete el servicio por causas ajenas a la grúa: Remolques
    (tráileres) y autobuses de pasaje: 6.5 UMA ($762.51) · Cargo por presentación de grúa sin remolque, cuando no
    se complete el servicio por causas ajenas a la grúa: Remolque de tractocamiones de tres o más ejes, con una
    o más cajas: 6.5 UMA ($762.51) · Cargo por presentación de grúa sin remolque, cuando no se complete el servicio
    por causas ajenas a la grúa: Motocicletas: 1.95 UMA ($228.75) · Cargo por presentación de grúa sin remolque,
    cuando no se complete el servicio por causas ajenas a la grúa: Bicicletas: 1.3 UMA ($152.50) · Por almacenaje
    de automóvil, camioneta y pick-up, por día: 0.98 UMA ($114.96) · Por almacenaje de camiones de pasajeros, por
    día: 1.3 UMA ($152.50) · Por almacenaje de camiones de servicio público o particular sin carga, por día: 1.3
    UMA ($152.50) · Por almacenaje de camiones de servicio público o particular con carga, por día: 1.63 UMA ($191.22)
    · Por almacenaje de auto-tractores o tractocamiones, por día: 1.3 UMA ($152.50) · Por almacenaje de remolques
    sin carga, por día: 0.98 UMA ($114.96) · Por almacenaje de remolques con carga, por día: 1.3 UMA ($152.50) ·
    Por almacenaje de semiremolque y/o doble remolque (tipo dolly), por día: 0.98 UMA ($114.96) · Por almacenaje
    de motocicletas y bicicletas, por día: 0.13 UMA ($15.25) · Cuando la motocicleta exceda las setenta y dos horas
    almacenado en la estación de transferencia, será trasladado a la estación definitiva, en donde se le efectuara
    cobro adicional por derechos de almacenamiento por día almacenado: 0.98 UMA ($114.96). UMA 2026 = $117.31.'
