title: Autorización de Modificación de Proyecto
summary: Para modificar un proyecto de construcción con licencia autorizada, se requiere presentar un escrito detallado
  ante la dirección de administración urbana, especificando las modificaciones propuestas y adjuntando planos actualizados
  que reflejen dichos cambios, permitiendo así la revisión y posible aprobación de la modificación solicitada.
