title: Anuencia de Impacto Ambiental a Través de la Manifestación de Impacto Ambiental (Modalidad General)
summary: Analizar y establecer las condiciones que deben cumplir las actividades comerciales (giros de mediano y
  alto impacto) que puedan afectar el medio ambiente, con el objetivo de evitar o minimizar impactos negativos y
  proteger los ecosistemas. Se analizan opciones del proyecto para elegir la de menor impacto ambiental.
