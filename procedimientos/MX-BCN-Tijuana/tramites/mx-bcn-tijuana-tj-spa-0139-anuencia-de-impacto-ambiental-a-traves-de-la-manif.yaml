cost:
  type: variable
  amount_mxn: null
  text: 'Por la recepción, evaluación y resolución de la manifestación de impacto ambiental municipal, modalidad
    general, para actividades con impacto significativo en comercio y servicios hasta 150 .00 m²: 56 UMA ($6,569.36)
    · Por la recepción, evaluación y resolución de la manifestación de impacto ambiental municipal, modalidad general,
    para actividades con impacto significativo en comercio y servicios mayor de 150.01 m² y hasta 500.00 m²: 72
    UMA ($8,446.32) · Por la recepción, evaluación y resolución de la manifestación de impacto ambiental municipal,
    modalidad general, para actividades con impacto significativo en comercio y servicios mayor a 500.01 m² y hasta
    1000.00 m²: 85 UMA ($9,971.35) · Por la recepción, evaluación y resolución de la manifestación de impacto ambiental
    municipal, modalidad general, para actividades con impacto significativo en comercio y servicios mayor a 1000.01
    m²: 130 UMA ($15,250.30). UMA 2026 = $117.31.'
