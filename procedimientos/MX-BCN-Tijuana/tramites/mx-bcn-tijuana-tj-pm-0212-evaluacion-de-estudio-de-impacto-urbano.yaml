category: Negocios y trabajo, Infraestructura y vivienda
title: Evaluación de Estudio de Impacto Urbano
summary: 'Trámite para particulares y desarrolladores que solicitan evaluación de estudio de impacto urbano, gestionado
  únicamente por peritos en desarrollo urbano . Nota: Los precios varían según las características del uso del suelo
  actual propuesto.'
authority:
  name: Presidencia Municipal (Ayuntamiento de Tijuana)
  unit: Instituto Metropolitano de Planeación Tijuana (IMPLAN)
official_ids:
  homoclave: TJ-PM-0212
who_can:
- Interesado
when: En usos habitacionales que impliquen la densificación o el cambio de uso del suelo respecto a lo que determina
  el reglamento, la carta urbana y los planos de zonificación que se hagan acompañar de los Programas de Desarrollo
  Urbano · Acciones de urbanización y/o edificación para uso Industrial considerado de Alto Riesgo · Acciones de
  urbanización y/o edificación para fraccionamientos Industriales · Acciones de urbanización y/o edificación para
  fraccionamientos y/o conjuntos habitacionales de media y alta densidad · Acciones de urbanización y/o edificación
  para centros comerciales y turísticos de nivel central y regional · Acciones de urbanización y/o edificación para
  centros de espectáculos deportivos, central y regional · Acciones de urbanización y/o edificación para área de
  ferias y exposiciones permanentes a nivel distrital · Acciones de urbanización y/o edificación para instituciones
  de educación superior de nivel central y regional · Acciones de urbanización y/o edificación para centro de convenciones
  de nivel central y regional · Acciones de urbanización y/o edificación para conjuntos hospitalarios de nivel distrital,
  central y regional · Acciones de urbanización y/o edificación para conjuntos administrativos públicos y privados
  de nivel, distrital, central y regional · Acciones de urbanización y/o edificación para usos especiales (plantas
  y/o almacén de hidrocarburos y centros de distribución de gas, y planta de tratamiento de aguas negras) · Acciones
  de urbanización y/o edificación para relleno sanitario, inmuebles de Readaptación Social, Instalaciones Militares
  y Cuarteles, Estaciones de Transferencia, Deshuesadero (Yonkes) · Acciones de urbanización y/o edificación para
  antenas, Almacenamiento de Gas, Plantas Termoeléctricas · Acciones de urbanización y/o edificación para casino
  (casa de juegos con apuestas) o de cualquier establecimiento en los que medien apuestas de cualquier clase, así
  como de los denominados como Libros Foráneos o Centros de Apuestas Remotas, Salas de Bingo y de Juego o Sorteo
  de Números con Apuesta, Galgódromos e Hipódromos · Aquellos que por las características propias de las actividades
  concentren una alta cantidad de usuarios que representen posibles impactos negativos al contexto inmediato donde
  se pretende desarrollar el uso de suelo correspondiente · Aquellos que la autoridad considere necesario
result: Evaluación de Estudios de Impacto Urbano
