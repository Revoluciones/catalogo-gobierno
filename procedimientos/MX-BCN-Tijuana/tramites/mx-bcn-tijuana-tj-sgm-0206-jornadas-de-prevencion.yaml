title: Jornadas de Prevención
summary: Las jornadas están diseñadas para informar y enseñar a la población cómo protegerse en caso de emergencias.
  Durante los eventos se abordan temas como el Plan Familiar de Protección Civil, la Mochila de Emergencia o Bolsa
  de la Vida, el manejo de riesgos sísmicos y la prevención ante inestabilidad de laderas, ayudando a que las familias
  estén mejor preparadas para cualquier situación.
