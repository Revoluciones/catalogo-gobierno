title: Revisión y Aprobación del Programa Interno de Protección Civil (PIPC)
summary: 'El objetivo de este trámite es validar que cualquier dependencia, entidad, institución u organismo del
  sector público, privado o social cuenten con personal capacitado, así como con sus Subprogramas: de Prevención,
  de Auxilio y de Recuperación y de los cuales se desprenden: El plan operativo para la Unidad Interna de Protección
  Civil, el plan para la continuidad de operaciones y el plan de contingencias, y tiene como propósito mitigar los
  riesgos previamente identificados y definir acciones preventivas y de respuesta para estar en condiciones de atender
  la eventualidad de alguna emergencia o desastre, esto con la visión de salvaguardar la vida de las personas, así
  como proteger los bienes, la infraestructura y el medio ambiente.'
