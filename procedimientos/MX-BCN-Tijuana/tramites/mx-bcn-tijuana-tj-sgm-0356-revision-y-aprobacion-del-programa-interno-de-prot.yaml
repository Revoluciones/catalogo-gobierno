who_can:
- Interesado
when: Este trámite se realiza cuando el solicitante desea obtener la aprobación de su Programa Interno de Protección
  Civil (PIPC) por esta Dirección, el cual consiste en realizar una inspección documental de la carpeta, así como
  una inspección física en las instalaciones del solicitante, para validar que lo plasmado en su PIPC coincida con
  lo inspeccionado en las instalaciones.
