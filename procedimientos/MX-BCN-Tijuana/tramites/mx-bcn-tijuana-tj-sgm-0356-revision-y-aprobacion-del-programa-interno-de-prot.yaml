notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Criterio
  para resolver: Cuando se haya realizado el pago correspondiente y el contenido del programa interno cumpla con
  la normativa vigente de acuerdo con el Manual de apoyo Municipal parala elaboración y actualización del programa
  interno de Protección Civil (PIPC), se entregará una respuesta por escrito indicando la resolución. En caso de
  ser negativa, tendrá 30 días naturales para corregir las no conformidades e ingresarlo nuevamente para su inspección
  y aprobación.'
