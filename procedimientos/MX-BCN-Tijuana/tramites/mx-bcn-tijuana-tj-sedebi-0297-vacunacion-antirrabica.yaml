notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Tipo
  en el registro: servicio. Criterio para resolver: "Todo perro o gato debe recibir la vacuna antirrábica al cumplir
  3 meses de edad, y luego un refuerzo anual, sin importar su historial de vacunación. Si la mascota es mordida
  o arañada por un animal con sospecha de rabia, debe ser llevada inmediatamente al Centro de Control Animal Municipal
  para evaluación y posible refuerzo, incluso si ya está vacunada."'
