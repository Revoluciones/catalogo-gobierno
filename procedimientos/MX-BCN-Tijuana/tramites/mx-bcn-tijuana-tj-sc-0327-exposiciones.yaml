summary: Ofrecer a la comunidad artística un espacio de exposiciones en las galerías del Antiguo Palacio Municipal
  y Casas de Cultura para exhibiciones de arte (plásticas y visuales) de artistas nacionales e internacionales para
  promover la cultura y la apreciación artística, permitiendo a los artistas mostrar sus obras y generar un impacto
