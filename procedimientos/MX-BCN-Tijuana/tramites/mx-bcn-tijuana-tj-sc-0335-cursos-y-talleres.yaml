summary: El Instituto Municipal de Arte y Cultura (IMAC), a través de las cuatro Casas de Cultura, imparte cursos
  y talleres de acuerdo a la demanda de las diferentes disciplinas artístico-culturales. Esto con la finalidad de
  despertar el interés en niños, jóvenes y adultos en las expresiones humanas y mejorar su calidad de vida
