category: Programas y apoyos sociales
title: Ayuda en Especie
summary: Apoyo integral a personas en situación de vulnerabilidad, proveyéndoles tanto artículos de primera necesidad
  como ropa, cobijas y pañales, así como aparatos ortopédicos esenciales para mejorar la calidad de vida de personas
  con discapacidad, incluyendo muletas, bastones, andadores y sillas de ruedas.
