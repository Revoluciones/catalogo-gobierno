id: mx-bcn-tijuana-tj-sgm-0199-registro-de-matrimonio
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Oficialía civil
title: Registro de MATRIMONIO
summary: Es el trámite mediante el cual dos personas formalizan legalmente su unión ante el Registro Civil, cumpliendo
  con los requisitos establecidos por la ley.
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Oficialia del Registro Civil
official_ids:
  homoclave: TJ-SGM-0199
who_can:
- Interesado
when: Cuando dos personas desean casarse de manera legal.
result: Certificado
requirements:
- text: 'Certificado de Platicas Prematrimoniales (agendar en SDIF al teléfono: 664 382 6262).'
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Acta de nacimiento de ambas personas. (Si son extranjeras, debe estar apostillada, legalizada y traducida
    al español por un perito autorizado).
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Identificación oficial vigente de ambas personas. (Si son extranjeras, toda la documentación debe estar
    traducida por perito autorizado, excepto el pasaporte estadounidense).
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: CURP (solo para personas con ciudadanía mexicana).
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: 'Personas divorciadas o viudas: presentar acta de divorcio o de defunción, según el caso. (Si son extranjeras,
    deben estar apostilladas, legalizadas y traducidas al español por perito autorizado).'
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Solicitud de matrimonio, que se obtiene en el Registro Civil al presentar la documentación requerida.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Convenio sobre el régimen patrimonial (separación de bienes o sociedad conyugal), incluido en la solicitud.
  cites:
  - source: remutys
  original_or_copy: original
- text: Análisis prenupciales (HIV y VDRL) y certificados médicos con vigencia no mayor a 15 días.
  cites:
  - source: remutys
  original_or_copy: original
- text: Certificados médicos, incluidos en la solicitud. Deben ser firmados y sellados por un laboratorio y médico
    autorizado.
  cites:
  - source: remutys
  original_or_copy: original
- text: Cuatro testigos con identificación oficial vigente.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
