    urgente dentro de la oficina en horas inhábiles: 40 UMA ($4,692.40) · Celebración en Instituciones de Salud
    Pública o Privada: $0.00 · Honorarios por servicio a domicilio en horas hábiles.: 8 UMA ($938.48) · Honorarios
