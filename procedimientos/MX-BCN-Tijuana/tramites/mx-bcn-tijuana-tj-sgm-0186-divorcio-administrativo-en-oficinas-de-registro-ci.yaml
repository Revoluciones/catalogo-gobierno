notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Criterio
  para resolver: El trámite se resuelve cuando ambas personas cumplen con los requisitos legales establecidos, realizan
  el pago correspondiente y manifiestan su consentimiento mutuo de manera libre y voluntaria ante el Registro Civil.'
