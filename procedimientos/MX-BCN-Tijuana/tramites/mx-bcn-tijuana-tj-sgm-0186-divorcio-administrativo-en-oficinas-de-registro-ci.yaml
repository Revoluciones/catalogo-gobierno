id: mx-bcn-tijuana-tj-sgm-0186-divorcio-administrativo-en-oficinas-de-registro-ci
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Oficialía civil
title: DIVORCIO Administrativo en Oficinas de Registro Civil
summary: Trámite para disolver legalmente el matrimonio, permitiendo que ambas personas puedan volver a casarse
  si así lo desean.
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Oficialia del Registro Civil
official_ids:
  homoclave: TJ-SGM-0186
who_can:
- Interesado
when: Cuando ambos consortes convengan en divorciarse, no tengan hijos en común o si los hubiere sean mayores de
  edad y estos no requieran alimentos y de común acuerdo hubieren liquidado la sociedad conyugal, si bajo ese régimen
  se casaron.
result: Constancia
requirements:
- text: Acta de matrimonio
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Acta de nacimiento de las personas solicitantes.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Identificación oficial vigente de las personas solicitantes (INE con domicilio de ésta ciudad).
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: En caso de matrimonio bajo Sociedad Conyugal, presentar la escritura pública que incluya la liquidación
    de bienes y el Certificado de No Propiedad emitido por el Registro Público.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: CURP de las personas solicitantes
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Presentar análisis de no embarazo sellados y firmados por el laboratorio que lo expida, con vigencia no
    mayor a 15 días.
  cites:
  - source: remutys
- text: Presentar un testigo por cada solicitante con identificación oficial vigente. Los testigos deben presentarse
    en ambas etapas del trámite.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: En caso de tener hijos mayores de edad, presentar sus actas de nacimiento.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Ambas personas deben presentarse en la Oficialía del Registro Civil donde se celebró el matrimonio.
  cites:
  - source: remutys
