- Interesado
- Representante_legal
when: 'Se realiza cuando se cuenta con una sentencia de adopción dictada por un juez extranjero y se requiere inscribirla
  oficialmente en México para que tenga validez legal. (una vez homologada dicha sentencia ante las autoridades
  judiciales competentes) . · Nota: El registro de adopción queda asentado como un registro de nacimiento.'
