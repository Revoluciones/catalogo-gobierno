title: Inscripción de ADOPCIÓN dictada fuera de la República proveniente de Juzgado local
summary: Este trámite consiste en registrar oficialmente en el Registro Civil la sentencia de adopción emitida por
  un juez de otro país (una vez homologada dicha sentencia por las autoridades competentes en esta ciudad) y expedir
  el acta de adopción correspondiente.
