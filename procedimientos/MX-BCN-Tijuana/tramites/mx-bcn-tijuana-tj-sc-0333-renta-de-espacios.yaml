title: Renta De Espacios
summary: El instituto Municipal de Arte y Cultura (IMAC) cuenta con diferentes espacios como teatro, salones y jardines
  en los diferentes edificios (Casas de Cultura), disponibles para rentar para diferentes eventos. El costo de las
  clases de equitación y escaramuza se calcula con base en el valor vigente de la UMA, conforme a lo establecido
  en el artículo 52, inciso "D) Casa de Cultura Playas", subinciso "f) Lienzo Charro", numeral "7) Curso por convenio
  70% Maestro - 30% IMAC", de la Ley de Ingresos del Municipio de Tijuana, Baja California, para el Ejercicio Fiscal
  de 2026. Del importe a pagar, el 70% del costo corresponde al maestro y el 30% del costo al Instituto Municipal
  de Arte y Cultura (IMAC).
