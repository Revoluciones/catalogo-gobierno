who_can:
- Interesado
when: Cuando la Organización de la Sociedad Civil cumpla con los requisitos establecidos en la convocatoria y desee
  acceder al apoyo financiero del programa PAFOSC (Programa de Apoyo Financiero a los Organismos de la Sociedad
  Civil)
result: Apoyo
requirements:
- text: Estar registrada en el Catálogo Municipal de Organismos de la Sociedad Civil de la Dirección de Desarrollo
    Social Municipal de Tijuana
  cites:
  - source: remutys
- text: No haber recibido apoyo de ninguna dependencia de gobierno federal, estatal o municipal durante el año de
    la convocatoria del proyecto a presentar
  cites:
  - source: remutys
- text: Contar con al menos dos años de constitución legal a la fecha de la convocatoria
  cites:
  - source: remutys
- text: Contar con cuenta bancaria a nombre de la Asociación Civil
  cites:
  - source: remutys
- text: Haber cumplido en tiempo y forma con la comprobación de los recursos otorgados de ejercicios fiscales anteriores
  cites:
  - source: remutys
