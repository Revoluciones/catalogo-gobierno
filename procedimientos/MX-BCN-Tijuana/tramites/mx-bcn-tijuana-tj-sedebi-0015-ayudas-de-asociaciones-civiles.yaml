title: Ayudas de Asociaciones Civiles
summary: El programa PAFOSC (Programa de Apoyo Financiero para Organismos de la Sociedad Civil), otorga apoyo financiero
  sin costo a las Asociaciones Civiles registradas en el Catálogo Municipal de OSC (Organizaciones de la Sociedad
  Civil), impulsando sus actividades en beneficio de la comunidad.
