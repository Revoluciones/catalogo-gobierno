notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Criterio
  para resolver: Cuando se haya realizado el pago correspondiente y el contenido del programa cumpla con la normativa
  vigente de acuerdo con el Manual de apoyo Municipal para la elaboración y actualización del Programa de Atención
  a Emergencias (PAE), se entregará una resolución por escrito la cual podría ser aprobatoria o no aprobatoria.
  En caso de que la resolución sea negativa, el solicitante tendrá 30 días naturales para corregir las no conformidades
  e ingresarlo nuevamente para su inspección y aprobación.'
