title: Revisión y Aprobación del Programa de Atención a Emergencias (PAE)
summary: 'Este trámite se realiza cuando el solicitante desea obtener la aprobación de su Programa de Atención a
  Emergencias (PAE) por esta Dirección. Este trámite consiste en realizar una inspección documental de la carpeta,
  así como una inspección física en las instalaciones del solicitante, para validar que lo plasmado en su PAE coincida
  con lo inspeccionado en las instalaciones. El objetivo de este trámite es validar que las empresas cuenten con
  personal capacitado, así como con sus Subprogramas: de Prevención, de Auxilio y de Recuperación. Esto con la visión
  de salvaguardar la vida de las personas, así como proteger los bienes, la infraestructura y el medio ambiente.'
