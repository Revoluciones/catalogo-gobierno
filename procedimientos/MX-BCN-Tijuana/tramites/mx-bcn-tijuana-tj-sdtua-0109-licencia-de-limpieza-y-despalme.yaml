title: Licencia de Limpieza y Despalme
summary: Autoriza la ejecución de trabajos de nivelación, limpieza o despalme de terrenos con el objetivo de mejorar
  y desarrollar predios. (corte de la capa vegetal del terreno, con una profundidad máxima de 30 centímetros)
authority:
  name: Secretaría de Desarrollo Territorial y Urbano (Ayuntamiento de Tijuana)
  unit: Dirección de Administración Urbana
official_ids:
  homoclave: TJ-SDTUA-0109
who_can:
- Interesado
when: Cuando se requiera limpiar un predio con un espesor de 30 cm o menos.
result: Licencia
requirements:
- text: Llenar y firmar solicitud de la dirección de administración urbana (propietario o representante legal).
  cites:
  - source: remutys
  original_or_copy: original
- text: Recibo de pago de derechos (conforme a la ley de ingresos).
  cites:
  - source: remutys
  original_or_copy: original
- text: Dictamen de uso de suelo favorable.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Acta de deslinde catastral y/o plano certificado (vigencia de 1 año).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Copia del documento de propiedad (escritura pública o título de propiedad del terreno debidamente inscrito
    en el registro público de la propiedad y comercio).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Estudio de mecánica de suelos.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Carta responsiva del perito adscrito a esta dirección.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Programa de obra (firmados por el responsable del proyecto).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Banco de Tiro.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Proyecto ejecutivo de muros de contención, con licencia correspondiente y plano autorizado (firmados por
    el responsable del proyecto).
  cites:
  - source: remutys
  original_or_copy: original
- text: Proyecto de movimiento de tierras (plano de topografía natural, topografía de proyecto, perfiles y secciones
    (deberá incluir el cálculo de volúmenes) curva masa, rasantes del proyecto y solución de escurrimientos pluviales,
    debidamente firmados por el dir
  cites:
  - source: remutys
  original_or_copy: original
