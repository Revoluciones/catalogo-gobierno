cost:
  type: variable
  amount_mxn: null
  text: 'Por la recepción, evaluación y resolución del Informe Preventivo Municipal para actividades comerciales
    o de servicios, públicas o privadas: 32 UMA ($3,753.92) · Establecimientos que no utilicen combustibles ni tanques
    a presión, tengan un consumo de agua menor a 100.00 M³, no requieran dispositivos de control de emisiones o
    aguas residuales, no representen riesgo de contaminación del suelo, no usen materiales ni generen residuos peligrosos,
    y cuya superficie sea Menor a 35.00 M²: 17.55 UMA ($2,058.79) · Establecimientos que no utilicen combustibles
    ni tanques a presión, tengan un consumo de agua menor a 100.00 M³, no requieran dispositivos de control de emisiones
    o aguas residuales, no representen riesgo de contaminación del suelo, no usen materiales ni generen residuos
    peligrosos, y cuya superficie sea de 35.00 M² a 70.00 M²: 21.84 UMA ($2,562.05) · Establecimientos que no utilicen
    combustibles ni tanques a presión, tengan un consumo de agua menor a 100.00 M³, no requieran dispositivos de
    control de emisiones o aguas residuales, no representen riesgo de contaminación del suelo, no usen materiales
    ni generen residuos peligrosos, y cuya superficie sea de 70.00 M² a 100.00 M²: 26.2 UMA ($3,073.52). UMA 2026
    = $117.31.'
