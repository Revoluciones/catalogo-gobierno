summary: Análisis de actividades clasificadas como de bajo y mediano impacto ambiental, según la normativa municipal.
  Este informe tiene como objetivo garantizar que los proyectos se desarrollen de manera sostenible, minimizando
  su impacto en el entorno y cumpliendo con los requisitos ambientales establecidos.
