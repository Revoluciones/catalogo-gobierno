id: mx-bcn-tijuana-tj-sgm-0200-registro-de-nacimiento-extemporaneo-mayor-de-5-ano
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Oficialía civil
title: Registro de NACIMIENTO Extemporáneo (Mayor de 5 años y Menor de 18 años)
summary: Registrar el nacimiento de una persona mayor de 5 años y menor de 18 ante las oficinas del Registro Civil.
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Oficialia del Registro Civil
official_ids:
  homoclave: TJ-SGM-0200
who_can:
- Interesado
when: Cuando una persona no fue registrada al nacer y necesita su acta de nacimiento.
result: Certificado
requirements:
- text: Solicitud (se entrega en las oficinas del Registro Civil).
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: 'Certificado de nacimiento (expedido, firmado y sellado por el hospital en que ocurrió el parto). En caso
    de no contar con certificado original, debe presentar: Reporte de robo o extravio del Ministerio Público, Copia
    certificada del certificado de nacimiento expedida por el hospital .'
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: 'Presentarse los padres y el menor a registrar con la siguiente información del menor:'
  cites:
  - source: remutys
- text: A).-Cartilla de vacunación o constancia de vacunas (si se tiene).
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: B).- Fotografía reciente tamaño credencial.
  cites:
  - source: remutys
  original_or_copy: original
- text: C).- Fotografías del menor desde su nacimiento hasta la fecha de su registro, con su familia.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: D).-Boletas escolares o constancia de estudios.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Actas de nacimiento e identificación de los padres.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Acta de matrimonio de los padres (si están casados).
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Dos testigos con identificación oficial vigente.
  cites:
  - source: remutys
  original_or_copy: original
- text: Si los padres son menores de edad, deberán contar con el consentimiento de la madre, padre o sus tutores
    y presentarse con su acta de nacimiento, e identificación oficial.
  cites:
  - source: remutys
- text: Si la persona a registrar nació en otro Estado deberá presentar certificado de inexistencia de nacimiento
    del Estado en donde nació, asi como inexistencia del Estado de Baja California
  cites:
  - source: remutys
- text: Todo documento proveniente del extranjero debera ser apostillado o legalizado según el pais de origen, asi
    como traducido al español por un perito autorizado por el Tribunal Superior de Justicia del Estado de Baja California
  cites:
  - source: remutys
- text: Si el menor nació en otro estado, se debe presentar una constancia de inexistencia de registro de nacimiento
    emitida por el estado correspondiente.
  cites:
  - source: remutys
  original_or_copy: original
- text: Constancia de inexistencia de registro de nacimiento, expedido por el Registro Civil del Estado de Baja
    California.
  cites:
  - source: remutys
  original_or_copy: original
