  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Acta de matrimonio.
  cites:
  - source: remutys
  original_or_copy: original, 1 copia(s)
- text: Identificación oficial vigente de ambos ex cónyuges y de la persona que realiza el trámite.
