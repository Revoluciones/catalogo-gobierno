title: Inscripción de Sentencia de DIVORCIO proveniente Fuera de la República
summary: Este trámite permite realizar las anotaciones correspondientes en el acta de matrimonio y registrar legalmente
  el divorcio en México, cuando la sentencia ha sido emitida en otro país. (Una vez homologada dicha sentencia por
  las autoridades judiciales competentes de esta ciudad)
authority:
  name: Secretaría de Gobierno (Ayuntamiento de Tijuana)
  unit: Oficialia del Registro Civil
official_ids:
  homoclave: TJ-SGM-0273
who_can:
- Interesado
when: Cuando una persona que contrajo matrimonio en México obtiene una sentencia de divorcio en el extranjero y
  necesita que este cambio se refleje en los registros oficiales del lugar donde se celebró el matrimonio.
result: Constancia
