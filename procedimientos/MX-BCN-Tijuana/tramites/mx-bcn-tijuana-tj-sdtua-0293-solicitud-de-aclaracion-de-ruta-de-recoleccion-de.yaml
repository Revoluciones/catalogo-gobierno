title: Solicitud de aclaración de ruta de recolección de Residuos Sólidos Urbanos (RSU)
summary: El ciudadano puede presentar una solicitud de aclaración de ruta de recolección cuando se presenten inconsistencias
  en las rutas establecidas por la Dirección de Servicios Públicos Municipales (DSPM) en las colonias a quienes
  se presta el servicio por parte del Ayuntamiento de Tijuana, ya sea por falta o atraso del servicio; siempre y
  cuando la basura se encuentre dentro de la categoría de Residuos Sólidos Urbanos (RSU).
