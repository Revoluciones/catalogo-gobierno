notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Criterio
  para resolver: • Se verifica que la ruta de la cual se solicita aclaración esté dentro del calendario de rutas
  de la Dirección de Servicios Públicos Municipales. • Se realiza revisión por parte de la Dirección, de que el
  servicio se encuentre pendiente de brindarse.'
