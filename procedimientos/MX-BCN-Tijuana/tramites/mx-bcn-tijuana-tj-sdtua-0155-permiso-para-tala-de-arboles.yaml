title: Permiso para Tala de Árboles
summary: Permite solicitar la autorización para la tala de un árbol en la vía pública o en propiedad privada, cuando
  este presenta riesgos derivados de plagas, enfermedades, vandalismo o daño estructural.
authority:
  name: Secretaría de Desarrollo Territorial y Urbano (Ayuntamiento de Tijuana)
  unit: Dirección de Servicios Públicos Municipales
