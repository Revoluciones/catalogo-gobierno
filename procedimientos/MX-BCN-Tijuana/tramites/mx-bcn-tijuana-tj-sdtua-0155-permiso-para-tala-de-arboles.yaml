cost:
  type: variable
  amount_mxn: null
  text: 'Tala con herramienta manual de pieza menor de 3.00 m de altura (copa de 3.00 a 4.00 m.), incluye: herramienta
    menor, realización del trabajo, limpieza, retiro y traslado del producto de la tala: 23.4 UMA ($2,745.05) ·
    Tala con maquinaria y equipo a pieza mayor a 3.00 metros y menor a 6.00 metros (copa de 4.00 a 8.00 metros),
    incluye: grúa, equipo especial y herramienta menor, mano de obra, limpieza y retiro del producto de la tala:
    66.3 UMA ($7,777.65) · Tala con maquinaria y equipo a pieza mayor a 6.00 metros y menor a 9.00 metros (copa
    de 8.00 a 11.00 metros), incluye: grúa, equipo especial y herramienta menor, mano de obra, limpieza y retiro
    del producto de la tala: 163.77 UMA ($19,211.86) · Tala con maquinaria y equipo a pieza de 9.00 metros o mayor
    (copa de 11.00 metros o más), incluye: grúa, equipo especial y herramienta menor, mano de obra, limpieza y retiro
    del producto de la tala: 369.11 UMA ($43,300.29) · Tala urgente con herramienta manual de pieza menor de 3.00
    m de altura (copa de 3.00 a 4.00 m.), incluye: herramienta menor, realización del trabajo, limpieza, retiro
    y traslado del producto de la tala: 123.5 UMA ($14,487.78) · Tala urgente con maquinaria y equipo a pieza mayor
    a 3.00 metros y menor a 6.00 metros (copa de 4.00 a 8.00 metros), incluye: grúa, equipo especial y herramienta
    menor, mano de obra, limpieza y retiro del producto de la tala: 239.2 UMA ($28,060.55) · Tala urgente con maquinaria
    y equipo a pieza mayor a 6.00 metros y menor a 9.00 metros (copa de 8.00 a 11.00 metros), incluye: grúa, equipo
    especial y herramienta menor, mano de obra, limpieza y retiro del producto de la tala: 478.4 UMA ($56,121.10)
    · Tala urgente con maquinaria y equipo a pieza de 9.00 metros o más (copa de 11.00 metros o más), incluye: grúa,
    equipo especial y herramienta menor, mano de obra, limpieza y retiro del producto de la tala: 956 UMA ($112,148.36).
    UMA 2026 = $117.31.'
