notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Tipo
  en el registro: programa de apoyo. Criterio para resolver: La procedencia del apoyo estará condicionada al resultado
  del estudio socioeconómico realizado por la Dirección de Bienestar Social Municipal, mediante el cual se acredite
  que la persona solicitante se encuentra en situación de vulnerabilidad económica y manifiesta intención genuina
  de retornar a su lugar de origen, careciendo de recursos para solventar los gastos de traslado.'
