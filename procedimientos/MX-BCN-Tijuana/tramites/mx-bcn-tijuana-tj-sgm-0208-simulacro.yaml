title: Simulacro
summary: Solicitud para la evaluación de simulacros de emergencia en el centro de trabajo o institución solicitante.
  El objetivo es evaluar el desempeño, la coordinación, la comunicación y la efectividad de la Unidad Interna de
  Protección Civil (UIPC) ante una situación de emergencia o desastre, garantizando que todos estén preparados y
  que las acciones sean efectivas. La evaluación puede ser solicitada para Simulacro de Gabinete o bien, Simulacro
  de Evacuación.
