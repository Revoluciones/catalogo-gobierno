notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Tipo
  en el registro: servicio. Criterio para resolver: El simulacro debe cumplir con las normativas y directrices vigentes
  en materia de protección civil, esto con el objetivo de garantizar que la empresa o institución esté preparada
  para enfrentar alguna emergencia o desastre. La evaluación será realizada de manera presencial por un Verificador
  Técnico de esta dirección, quien usará como método evaluador la Cédula Interna Para Evaluación de Simulacros.
  La empresa o institución debe cumplir con un mínimo de 70 puntos de los 100 posibles que marca la Cédula para
  acreditar la evaluación de su simulacro. En caso de contar con una evaluación de simulacro no aprobatoria, el
  solicitante puede pedir una segunda evaluación sin costo adicional. En caso de que la segunda evaluación de simulacro
  nuevamente resulte no aprobatoria, el solicitante debe pagar una nueva la solicitud de evaluación.'
