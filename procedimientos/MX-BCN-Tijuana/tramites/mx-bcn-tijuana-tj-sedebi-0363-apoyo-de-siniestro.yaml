summary: El estudio socioeconómico es un procedimiento elaborado por la Dirección de Bienestar Social Municipal,
  destinado a evaluar la situación económica de las personas que solicitan apoyos para atender necesidades básicas
  derivadas exclusivamente de casos de incendios o pérdida total de vivienda.
