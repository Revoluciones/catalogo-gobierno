branch: ejecutivo
kind: tramite
category: Negocios y trabajo, Emprendimiento
title: Crédito Emprende tu Futuro del Fideicomiso Fondos Tijuana
summary: Crédito de hasta $75,000.00 pesos, Personas físicas que requieran de capital semilla para iniciar actividades
  o complementar esfuerzos de iniciación de una empresa, que sean estudiantes universitarios o carreras técnicas,
  o que cuenten con un periodo máximo de 5 años de haber culminado una carrera universitaria y/o técnica.
authority:
  name: Secretaría de Desarrollo Económico (Ayuntamiento de Tijuana)
  unit: Centro de Atención al Emprendedor
official_ids:
  homoclave: TJ-SEDETI-0077
who_can:
- Interesado
when: Cuando el solicitante necesite capital semilla para llevar a cabo algún proyecto productivo
result: Crédito
requirements:
- text: Contar con Aval, presentando copia de identificación oficial con fotografía vigente, (INE, Pasaporte, Cedula
    Profesional o cartilla del servicio militar), así como comprobante de domicilio (agua, luz o teléfono) no mayor
    a tres (3) meses
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Estado de cuenta bancario a nombre del beneficiario, el cual deberá contener número de cuenta y clabe interbancaria,
    (aplica todas las instituciones institución con excepción de tarjetas OXXO)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Fotografías del sitio donde realizará la actividad productiva, así como del domicilio personal del solicitante,
    fachada e interior
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Cotización(es) de los conceptos para los que se solicite el crédito, los cuales deberá(n) ser de proveedor(es)
    loca(es) y en el caso de contar con una mejor propuesta económica fuera de Tijuana, deberá acompañar cada cotización
    foránea de una local
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Constancia de acreditación de curso de capacitación financiera, impartida por institución autorizada por
    la Secretaría de Desarrollo Económico
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: El destino del recurso debe ser para capital semilla o iniciar un proyecto de acuerdo con la carrera universitaria
    y/o técnica del solicitante
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Presupuesto del proyecto desglosado por conceptos y aportaciones (Formato de solicitud de Fondos Tijuana)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Título profesional, carta de pasante y/o Kardex universitario o carrera técnica (firmado y sellado por la
    institución universitaria y/o institución educativa)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: 'Comprobante de domicilio: agua, luz o teléfono del domicilio personal del solicitante (no mayor a tres
    meses una vez recibida la solicitud)'
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Identificación oficial con fotografía vigente (credencial de elector, pasaporte vigente, cédula profesional
    y cartilla del servicio militar)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
