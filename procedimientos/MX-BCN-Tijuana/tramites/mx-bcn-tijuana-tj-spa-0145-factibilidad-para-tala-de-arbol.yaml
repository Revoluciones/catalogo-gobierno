notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Criterio
  para resolver: La poda. • Saneamiento y Salud: Eliminación de ramas secas, dañadas o enfermas (madera muerta,
  dañada y enferma). • Seguridad: Reducción de ramas que interfieren con líneas de alta tensión, luminarias, señales
  de tráfico o que obstruyen el paso de peatones y vehículos. • Estructura y Estética: Mejora de la forma del árbol
  y equilibrio de la copa. • Despeje de Infraestructura: Evitar que ramas toquen fachadas, techos o canaletas, drenaje.
  La tala. • Riesgo de Caída: Árboles con inclinación peligrosa, grietas estructurales graves en el tronco o daño
  significativo tras una tormenta. • Enfermedad Irreversible: Presencia de hongos o pudrición severa en la base
  o raíces que compromete la estabilidad (pudrición de raíces). • Daño a Infraestructura: Raíces que destruyen cimentaciones,
  tuberías o estructuras de manera irreparable. • Árbol Muerto o en Decadencia: Cuando la mayor parte del árbol
  ha dejado de crecer o ha muerto. • Especies Invasoras o Inadecuadas: Especies que generan alergias graves, son
  tóxicas o que no son adecuadas para el espacio urbano disponible.'
