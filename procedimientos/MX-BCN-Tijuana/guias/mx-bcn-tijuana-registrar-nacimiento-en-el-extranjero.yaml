notes: Ruta completa que junta tres trámites oficiales (las fichas TJ-SGM-0190 de Tijuana y BC-SGG-010 del Estado,
  más la apostilla y la traducción). La ruta y las notas de práctica salen de un caso real de julio de 2025 que
  se hizo de principio a fin. Una captura de la ficha de Tijuana de 2025 marcaba el original obligatorio solo para
  la solicitud y la constancia; la ficha vigente lo pide para todo menos la carta poder.
