notes: >-
  El reglamento de animales todavía nombra a la «Dirección de Salud Municipal y Departamento de Control Animal».
  Desde el 13 de febrero de 2026 esas funciones están en la Dirección de Derecho y Bienestar Animal de la
  Secretaría de Protección al Medio Ambiente: el Reglamento Interior de Salud Municipal derogó el capítulo de
  Control Animal (arts. 31 a 34) y el transitorio TERCERO del Reglamento Interior de la Secretaría dice que las
  atribuciones con otro nombre se entienden dadas a ella. El portal oficial no publica la dirección, el teléfono
  ni el horario de la oficina de Bienestar Animal (las páginas de sus trámites dan error 404), así que la ficha no
  los incluye; tampoco publica una dirección ni un horario propios de la Sindicatura, solo la dirección general
  del Ayuntamiento. El nombre «Formato de Denuncia Ciudadana» viene del reporte, no de una fuente oficial.
  El reglamento municipal no fija un periodo de observación antirrábica para un perro que mordió a alguien; solo
  las 72 horas hábiles para cualquier animal capturado (art. 5 fr. V). El art. 26 fr. XI da 10 días hábiles para
  animales que lesionaron a personas, pero excluye expresamente a perros y gatos.
  Esta ficha no describe con fuentes la denuncia penal por lesiones ante el Ministerio Público, la queja ante la
  Comisión Estatal de los Derechos Humanos de Baja California, la petición a una regiduría o comisión del Cabildo,
  ni el amparo cuando no contestan una petición; son vías que existen y que faltan por documentar. Si la casa es
  rentada, las reglas sobre mascotas del contrato de arrendamiento son un asunto entre particulares y no las cubre
  esta ficha.
