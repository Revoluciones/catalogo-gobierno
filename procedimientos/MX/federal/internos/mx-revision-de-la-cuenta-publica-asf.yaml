notes: >-
  Pendiente: los pasos detallados de la Ley de Fiscalización y Rendición de Cuentas de la Federación, el manual
  de procedimientos de la ASF, y una cifra más reciente de recuperaciones tomada directamente del Sistema
  Público de Consulta de Auditorías (fuente oficial) para reemplazar la nota periodística. En Baja California
  el equivalente es la Auditoría Superior del Estado (ASEBC) revisando al estado y a los municipios.
