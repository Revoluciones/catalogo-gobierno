notes: >-
  En Baja California la denuncia se presenta ante la Secretaría Anticorrupción y Buen Gobierno (ficha RETyS 1377,
  importada). Pendiente: nota de práctica con fuente oficial (cuántas denuncias terminan en sanción), por ejemplo
  con una solicitud de transparencia a esa Secretaría.
