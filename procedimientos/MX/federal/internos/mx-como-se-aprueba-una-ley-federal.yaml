notes: >-
  Falta el trámite en el Senado (su propio reglamento) y las reformas a la Constitución, que siguen otro camino
  (art. 135: 2 de cada 3 votos en el Congreso y aprobación de la mayoría de los congresos estatales). El conteo
  oficial de iniciativas puede pedirse al Sistema de Información Legislativa para reemplazar la cifra
  periodística por la fuente primaria.
