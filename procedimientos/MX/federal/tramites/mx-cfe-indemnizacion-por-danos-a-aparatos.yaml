last_checked: '2026-11-22'
checked_by: Claude (Compartido)
notes: >-
  Comida echada a perder: la cláusula de indemnización habla de «instalaciones, equipos o aparatos eléctricos»
  y no menciona alimentos. Ninguna fuente oficial revisada dice que CFE pague comida; la vía que queda es una
  queja ante CFE y luego ante Profeco (cláusula Vigésima Cuarta), sin garantía de resultado. No encontramos
  casos documentados de pagos ni tasas de éxito; las notas de prensa de Baja California (2025 y 2026) solo
  cuentan pérdidas de comida y aparatos sin reclamación (por ejemplo Zeta Tijuana, septiembre de 2026). El
  contrato es de 2021, aprobado con la Ley de la Industria Eléctrica; la Ley del Sector Eléctrico de 2025 le da
  las quejas a la CNE junto con Profeco (art. 11, fracción XLVI). No pudimos leer los transitorios de esa ley
  para confirmar que el contrato de 2021 sigue vigente hasta que la CNE apruebe uno nuevo.
  El nombre exacto del formato de CFE no aparece en la página oficial; la prensa lo llama «Solicitud de
  reclamación por daños en aparatos eléctricos u otros bienes».
