notes: Falta la sentencia de la Suprema Corte como fuente primaria (la ficha en transparencia-ciudadana.scjn.gob.mx
  bloqueó la descarga automática). En Tijuana el registro se hace en las 11 oficialías del Registro Civil que están
  en las oficinas del Ayuntamiento; según el sitio del Ayuntamiento, la coordinación es del Gobierno del Estado
  y las oficialías dependen administrativamente del Registro Civil del Estado. El trámite aparece en el registro
  municipal (REMUTyS) como TJ-SGM-0201 (menores de 5 años), TJ-SGM-0200 (5 a 17) y TJ-SGM-0270 (18 o más), los tres
  gratuitos.
