notes: Escrito a partir de la convocatoria del 5 de noviembre de 2026 y sus anexos, para el cargo de munícipes. Los
  apoyos en papel solo se permiten donde la autoridad declare una emergencia por desastre que impida usar la aplicación
  (Lineamientos, Título V, punto 96). El listado de documentos dice que el archivo del emblema pesa hasta 500 kilobytes;
  la convocatoria dice hasta 5 megabytes. La clave de acceso a la liga pública del SNR viene en el listado de documentos
  del IEEBC y no se copia aquí.
