id: mx-bcn-candidatura-independiente-municipes-2027
country: MX
jurisdiction: MX-BCN
level: estatal
branch: autonomo
kind: tramite
category: elecciones
title: Postularte sin partido a un Ayuntamiento de Baja California, para la elección de 2027
summary: Para competir sin partido por la presidencia municipal y el resto del Ayuntamiento, primero avisas al
  Instituto Estatal Electoral que quieres hacerlo, con una asociación civil ya formada. Luego juntas el apoyo de
  la ciudadanía con la aplicación del INE y, si alcanzas el mínimo, pides tu registro. En Tijuana el mínimo es de
  44,262 apoyos.
authority:
  name: Instituto Estatal Electoral de Baja California (IEEBC)
  unit: Secretaría Ejecutiva y Consejo General
  url: https://ieebc.mx/candidaturas-independientes-2026-2027/
other_authorities:
- name: Instituto Nacional Electoral (aplicación para el apoyo de la ciudadanía y Sistema Nacional de Registro)
- name: Un notario público (para formar la asociación civil)
- name: Servicio de Administración Tributaria (RFC de la asociación civil)
who_can:
- Una planilla completa de personas propietarias y suplentes, con paridad de género. En Tijuana y Mexicali son
  presidencia municipal, sindicatura procuradora y 8 regidurías; en Ensenada, 7 regidurías; en Tecate, Playas de
  Rosarito, San Quintín y San Felipe, 5.
- Para la presidencia municipal, una persona mexicana por nacimiento, hija de madre o padre mexicanos, con 25
  años cumplidos el día de la elección.
- Con al menos 5 años viviendo en el municipio antes de la elección.
- Que en los últimos 3 años no haya dirigido un partido ni ocupado un cargo de elección popular.
when: Quieres que tu planilla aparezca en la boleta del Ayuntamiento sin que la postule un partido.
result: El registro de tu planilla como candidatura independiente, si alcanzas el apoyo mínimo y cumples los requisitos.
requirements:
- text: Manifestación de intención, formato IEEBC-CIM-01, con firma autógrafa.
  original_or_copy: original
  form_url: https://www.ieebc.mx/archivos/partidos/candidatosindep/2026/IEEBC%20CIM%2001.docx
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, incisos a) y b), fracción II
- text: Acta constitutiva de la asociación civil, con los estatutos del modelo único del IEEBC (Anexo 1). La asociación
    la forman al menos quien aspira, su representante legal y quien administra el dinero.
  original_or_copy: copia certificada
  form_url: https://www.ieebc.mx/archivos/partidos/candidatosindep/2026/1.1%20ANEXO%201%20CONV%20MODELO%20ESTATUTOS%20%28SP%29.docx
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, inciso d), fracciones I y II
- text: Documento del SAT con el RFC de la asociación civil.
  original_or_copy: copia simple
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, inciso d), fracción III
- text: Contrato de la cuenta bancaria a nombre de la asociación civil.
  original_or_copy: copia simple
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, inciso d), fracción IV
- text: Credencial para votar vigente, por los dos lados, de quien aspira, de su representante legal y de quien
    administra el dinero.
  original_or_copy: copia simple
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, inciso d), fracción VI
- text: Carta en la que aceptas recibir avisos por correo electrónico sobre la aplicación del INE, formato IEEBC-CIM-05.
  original_or_copy: original
  form_url: https://www.ieebc.mx/archivos/partidos/candidatosindep/2026/IEEBC%20CIM%2005.docx
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, inciso d), fracción VII
- text: Formulario del Sistema Nacional de Registro del INE, con el informe de capacidad económica, firmado a mano.
  original_or_copy: original
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, inciso d), fracción VIII
  - source: ieebc-listado-documentos
    pinpoint: Documento 7
- text: Tu emblema o logotipo, impreso y en archivo PNG o JPG de alta resolución, con sus colores. No puede parecerse
    al de un partido ni al de otra persona aspirante.
  original_or_copy: impreso y digital
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, inciso d), fracción IX
- text: Un domicilio en Mexicali para recibir avisos. Si no lo das, los avisos se publican en los estrados del IEEBC.
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, inciso d), fracción V
- text: Un correo con cuenta de Google, Facebook o X, para entrar a la aplicación del INE.
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, inciso d), después de la fracción IX
cost:
  type: desconocido
  text: La convocatoria no fija ningún pago al IEEBC. Formar la asociación civil ante notario sí cuesta, y el precio
    depende de la notaría. Lo que gastes para juntar apoyos sale de dinero privado de origen lícito y tiene un
    tope; en Tijuana es de $3,174,282.72.
  as_of: '2026-11-17'
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Séptima
  - source: ieebc-topes
    pinpoint: Tabla de topes para munícipes, Tijuana
    quote: TIJUANA $3´174,282.72 M.N.
deadlines:
- what: para_presentar
  text: La manifestación de intención se entrega a más tardar el 29 de diciembre de 2026. Ese último día reciben
    de 8:00 a 23:59.
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, incisos a), fracción II, y c)
- what: para_corregir
  text: Si a tu manifestación le falta algo, tienes 48 horas desde que te avisan para corregirlo. Si no, se tiene
    por no presentada.
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, inciso d), últimos párrafos
- what: otro
  text: Los apoyos para Ayuntamientos se juntan del 30 de diciembre de 2026 al 12 de febrero de 2027.
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Quinta, inciso a), fracción II
- what: otro
  text: 'Apoyos mínimos por municipio, el 2.5% de la lista nominal: Tijuana 44,262; Mexicali 22,790; Ensenada 9,589;
    Playas de Rosarito 3,439; Tecate 2,672; San Quintín 2,385; San Felipe 396. Deben venir de al menos 1 de cada
    3 secciones electorales del municipio.'
  cites:
  - source: ieebc-tablas
    pinpoint: Munícipes
  - source: ieebc-convocatoria
    pinpoint: Base Sexta
- what: para_presentar
  text: La solicitud de registro como candidatura se entrega del 31 de marzo al 11 de abril de 2027.
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Novena, inciso a), fracción II
