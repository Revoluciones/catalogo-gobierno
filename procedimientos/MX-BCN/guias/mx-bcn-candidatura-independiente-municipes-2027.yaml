steps:
- n: '1'
  actor: Tú y tu equipo
  action: Arma tu planilla completa, con personas propietarias y suplentes para la presidencia municipal, la sindicatura
    y las regidurías, mitad mujeres y mitad hombres. Si falta la persona de la presidencia, o la sindicatura, o más
    de la mitad de las regidurías o de las suplencias, el registro se cancela.
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, inciso b), fracción II, y Base Décima Segunda
- n: '2'
  actor: Tú, ante un notario
  action: Forma una asociación civil con los estatutos del modelo único del IEEBC. Deben estar al menos tú, tu representante
    legal y quien va a administrar el dinero.
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, inciso d), fracciones I y II
- n: '3'
  actor: Tu asociación civil
  action: Dala de alta en el SAT para tener su RFC y abre una cuenta de banco a su nombre. Ahí se recibe el dinero
    de la campaña.
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, inciso d), fracciones III y IV
- n: '4'
  actor: Tú, en el sitio del INE
  action: Regístrate en el Sistema Nacional de Registro del INE, llena el informe de capacidad económica, imprime
    el formulario y fírmalo a mano.
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, inciso d), fracción VIII
  - source: ine-snr
    pinpoint: Liga pública que da el listado de documentos del IEEBC
  link:
    label: Abrir el registro del INE
    url: https://registrocandidaturas.ine.mx/snr/app/login
- n: '5'
  actor: Tú, en el IEEBC en Mexicali
  action: Entrega la manifestación de intención (formato IEEBC-CIM-01) con todos los documentos de la lista. Se entrega
    en Mexicali, también si tu municipio es otro.
  deadline: A más tardar el 29 de diciembre de 2026
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, incisos a), b) y d)
  offices:
  - ieebc
- n: '6'
  actor: Secretaría Ejecutiva del IEEBC
  action: Revisa tus papeles. Si falta algo, te da 48 horas para corregir. Si todo está bien, te entrega tu constancia
    de persona aspirante.
  deadline: A más tardar el 1 de enero de 2027, si entregaste el último día
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Cuarta, incisos d) y e), fracción II
- n: '7'
  actor: Tú y tus personas auxiliares
  action: Junta el apoyo de la ciudadanía con la aplicación móvil del INE. Cada apoyo lleva una foto de la persona
    tomada en ese momento, por ella misma o por una persona auxiliar. No puedes usar radio ni televisión, ni hacer
    campaña todavía.
  deadline: Del 30 de diciembre de 2026 al 12 de febrero de 2027
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Quinta y Base Sexta
  - source: ieebc-lineamientos
    pinpoint: Glosario, incisos d) y l)
    quote: tomada a través de la Aplicación Móvil, ya sea por sí misma o en el momento en que se encuentra presente
      ante una Persona Auxiliar
- n: '8'
  actor: Consejo General del IEEBC
  action: Al terminar la revisión de los apoyos, sesiona y entrega la constancia de porcentaje a favor a quien alcanzó
    el mínimo. Sin ella no puedes pedir el registro.
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Octava y Base Novena, primer párrafo
- n: '9'
  actor: Tú, en el IEEBC
  action: Pide el registro con el formato IEEBC-CIM-02 y sus anexos, entre ellos tu acta de nacimiento certificada,
    tu plataforma, la constancia de residencia, los informes de lo que gastaste en juntar apoyos y el certificado
    de no estar en el Registro Nacional de Obligaciones Alimentarias.
  deadline: Del 31 de marzo al 11 de abril de 2027
  cites:
  - source: ieebc-convocatoria
    pinpoint: Base Novena, incisos a), b) y c)
  next:
  - to: fin
