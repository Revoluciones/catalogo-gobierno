    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/6127
  modes:
  - name: En línea
    steps:
    - Entrar a la pagina del SIAAX haciendo clic en el botón "iniciar trámite" ubicado en la parte inferior derecha
    - Seleccionar el estudiante prorroga de reinscripcion, del cual el sistema proporcionará un primer recibo el
      cual debe descargar y realizar su pago en línea o en ventanilla bancaria
    - Una vez que realiza el primer pago de la reinscripción, el estudiante deberá en un plazo de 40 días volver
      a descargar el segundo recibo de pago
    - Transcurrido los 40 días deberá pagar el segundo recibo para que le sea validada su reinscripción
  notes: El estudiante puede solicitar a través de pagos diferidos su reinscripción
