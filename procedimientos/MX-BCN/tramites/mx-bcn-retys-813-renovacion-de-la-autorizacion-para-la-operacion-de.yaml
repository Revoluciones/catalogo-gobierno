scenarios:
- name: Empresas con autorización de entrega de alimentos por medio de aplicaciones digitales
  requirements:
  - text: Documento que acredite que es titular de los derechos de propiedad intelectual (licencia para su uso,
      contrato de franquicia, o bien, acreditar que es subsidiaria o filial del titular o que se encuentre afiliada
      a alguno de los anteriores de tal forma que tenga derechos para el aprovechamiento o administración de la
      aplicación móvil, plataforma tecnológica y/o programa de cómputo)
    cites:
    - source: retys
  - text: Comprobante de domicilio fiscal o sucursal dentro del estado de baja california a nombre de la persona
      jurídica solicitante; con una antigüedad máxima de noventa días naturales
    cites:
    - source: retys
  - text: Constancia de situación fiscal (RFC)
    cites:
    - source: retys
  - text: Opinión de cumplimiento de obligaciones fiscales en sentido positivo
    cites:
    - source: retys
  - text: Acta constitutiva de la sociedad mercantil constituida conforme a las leyes mexicanas, cuyo objeto social
      sea el de operar como empresa de redes de transporte o gestionar servicios de transporte mediante una aplicación
      móvil o plataforma tecnológica, así como las modificaciones estructurales a la misma y la constancia de inscripción
      en el registro público de la propiedad y de comercio
    cites:
    - source: retys
  - text: Poder otorgado ante fedatario público a favor del representante legal
    cites:
    - source: retys
  - text: Identificación oficial vigente del representante legal
    cites:
    - source: retys
  - text: Póliza, constancia o carta cobertura de seguro de responsabilidad solidaria respecto de la totalidad de
      los vehículos que gestionen sus servicios de transporte a través de la plataforma que administren
    cites:
    - source: retys
  - text: El modelo del contrato de adhesión o del instrumento que contenga los términos y condiciones aplicables
      a los prestadores del servicio de transporte de pasajeros bajo demanda mediante aplicaciones móviles
    cites:
    - source: retys
  - text: Bases de datos y padrón actualizados; que contenga la información de los vehículos afiliados, sus propietarios
      y conductores que presten el servicio de transporte de pasajeros bajo demanda mediante aplicaciones móviles
    cites:
    - source: retys
  - text: Pago de derechos correspondientes
    cites:
    - source: retys
  modes:
