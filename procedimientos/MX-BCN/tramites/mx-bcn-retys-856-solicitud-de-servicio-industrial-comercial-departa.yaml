  - text: Carta poder (en caso necesario)
    cites:
    - source: retys
  - text: Copia de documento de propiedad
    cites:
    - source: retys
  - text: En caso de ser persona moral (copia del acta constitutiva)
    cites:
    - source: retys
  - text: Copia de recibo de pago de factibilidad
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Presentar oficio solicitud con copias de documentación en las oficinas de la cespe en avenida gastélum no.
      750, con el guardia de recepción
    - Si entregó la documentación completa, en un período de 10 a 15 días hábiles. Podrá comunicarse vía telefónica
      con la asistente del sub director técnico, al teléfono 646 175 19 51 quien le dará fecha y hora en la que
      podrá recoger la respuesta de su factibilidad
  notes: El propietario deberá acreditar su personalidad con identificación oficial
