scenarios:
- name: Propietario del predio
  requirements:
  - text: 'Oficio de solicitud de factibilidad, dirigido al director general, anexando correo electrónico y número
      de teléfono que le dará seguimiento al trámite. Debe indicar: nombre del propietario y/o razón social, rfc,
      dirección, giro, necesidad de abasto, número de empleados, numero de locales comerciales y/o departamentos
      además de indicar si ya tiene medidores instalados, cuántos tiene y si son domésc'
    cites:
    - source: retys
  - text: Deslinde
    cites:
    - source: retys
  - text: Plano de localización respecto a la ciudad referenciado con distancia a calles
    cites:
