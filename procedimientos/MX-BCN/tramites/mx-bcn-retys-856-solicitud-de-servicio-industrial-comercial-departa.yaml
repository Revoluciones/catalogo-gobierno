  - text: Superficie del predio y superficie de construcción
    cites:
    - source: retys
  - text: Plano de planta de redes hidrosanitarias de la obra con dimensiones
    cites:
    - source: retys
  - text: Factibilidad de uso de suelo positiva y autorizada
    cites:
    - source: retys
  - text: Copia de número oficial
    cites:
