- what: respuesta_autoridad
  text: 'Tiempo que tiene el organismo para resolver: 30 Días Hábiles'
  cites:
  - source: retys
- what: vigencia
  text: Único
  cites:
  - source: retys
positive_silence: true
requires_inspection: false
channels:
- presencial
offices:
- municipality: Mexicali
  name: Secretaría Académica
  address: 'Av. Claridad #S/N, Plutarco Elias Calles, Mexicali, 21376'
scenarios:
- name: Apoyar a estudiantes de la Universidad a que continúen su carrera
  requirements:
  - text: Haber cursado carrera en otra institución educativa o en la UPBC
    cites:
    - source: retys
  - text: 'Presentar documentos que solicita la revalidación de materias: programa de estudios de la materia y boletas
      que certifique su aprobación en ellas'
    cites:
    - source: retys
  - text: Realizar pago para la revalidación de materias
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/6116
  - text: Realizar petición por escrito (documento libre)
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - El alumno solicitará su revalidación por medio de escrito, indicando la carrera donde requiere se revalida
      las materias
    - Deberá adjuntar a la petición el programa educativo de las materias a revalidar y recibo de pago
    - Toda la información se presenta al área de gestión escolar, la cual revisará para poder enviar al sistema
      educativo para su validación
    - Gestión escolar una vez que revisa la documentación presentada por estudiante, procede a enviar por escrito
      la petición del alumno a la Secretaria de Educación, para que a su vez revise y valide la petición del alumno
    - Gestión escolar una vez que recibe la respuesta de la petición de la revalidación de las materias, informa
      al alumno
    - El estudiante recibe respuesta de la revalidación de materias
    - En el caso de que sea afirmativa la petición de revalidación, la Secretaria Académica da las indicaciones
      a Gestión Escolar y a Director de carrera para que se proceda el seguimiento de revalidación
  notes: Ubicar a los estudiantes en los cuatrimestres indicado de acuerdo a la revalidación de las materias
legal_basis:
