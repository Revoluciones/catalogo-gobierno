- Interesado
when: Cuando el solicitante requiera la información
result: Revalidación, equivalencia y acreditación de planes de estudios
cost:
  type: fijo
  amount_mxn: null
  text: 'COSTO: $1,200.00 M.N. es costo fijo para inicio del trámite, más el costo de $150.00 M.N. por cada materia
    por carta descriptiva'
  as_of: '2026-11-06'
  cites:
  - source: retys
