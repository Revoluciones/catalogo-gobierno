title: Proceso de Revalidación, Equivalencia y Acreditación
summary: Realizar proceso de revalidación, equivalencia, así como la acreditación de estudios, el cual se otorga
  validez oficial a estudios realizados en Instituciones que no forman parte del Sistema Educativo Nacional.
authority:
  name: Universidad Politécnica de Baja California
