scenarios:
- name: Asesoría especializada
  requirements:
  - text: Identificación oficial
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a oficina.
    - Exponer su queja a Médico Conciliador.
    - El Médico Conciliador evalúa y decide si la queja procede.
    - Si la queja es válida, el Médico Conciliador le informa sobre los requisitos para seguir adelante con el proceso
      de la queja.
    - Si la queja no es válida, el Médico Conciliador le orientará sobre a que entidad se debe de acudir.
  notes: Este servicio le ayuda a conocer sobre dónde, cuándo, cómo, por qué y para qué presentar una queja por
    atención médica recibida, también se le informa sobre los derechos y obligaciones, tanto de la persona paciente
    como de la persona prestadora del servicio de salud.
