summary: En este servicio se le ayuda a conocer dónde, cuándo, cómo, para qué y por qué presentar una queja por
  la atención médica recibida, también se le informa sobre los derechos y obligaciones tanto de su persona como
  de la persona prestadora del servicio de salud.
