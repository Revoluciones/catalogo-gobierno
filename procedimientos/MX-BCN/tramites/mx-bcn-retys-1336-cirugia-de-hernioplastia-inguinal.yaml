    - Contactar al ciudadano, indicando fecha, hora y cuidados necesarios previos a la cirugía
    - Acudir a la UNEME con una persona acompañante, presentar los requisitos solicitados e identificarse.
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la intervención (incluyendo vendaje y suero), trasladar al quirófano y, después
