id: mx-bcn-retys-1336-cirugia-de-hernioplastia-inguinal
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Cirugía de Hernioplastia Inguinal
summary: Procedimiento quirúrgico utilizado para reparar una hernia en la ingle. Comúnmente se utiliza una malla
  especial.
authority:
  name: Unidad de Especialidades Médicas de Baja California
official_ids:
  retys_id: 1336
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/1336
  homoclave: BC-UNEME-009
who_can:
- Interesado
when: Cuando el médico lo recomiende al localizar un tejido que sobresale por un punto débil en la pared abdominal
result: Atención médica especializada en cirugía general
cost:
  type: gratuito
  amount_mxn: null
  text: SIN COSTO
  as_of: '2026-11-06'
  cites:
  - source: retys
deadlines:
- what: para_prevenir
  text: 'Tiempo que tiene el organismo para prevenir: 5 Días Hábiles'
  cites:
  - source: retys
positive_silence: false
requires_inspection: false
channels:
- presencial
offices:
- municipality: Mexicali
  name: Dirección de Unidad Quirúrgica
  address: 'Avenida Olimpus #S/N, Plutarco Elías Calles, Mexicali, 21376'
- municipality: Ensenada
  name: Dirección de Unidad Quirúrgica
  address: 'Avenida Gastelum #1340, Zona Centro, Ensenada, 22800'
scenarios:
- name: Derechohabientes del IMSS-BIENESTAR
  requirements:
  - text: Hoja de derivación debidamente llenada y sellada, que le proporciona el centro de salud y/u Hospital General.
    cites:
    - source: retys
  - text: Identificación oficial (credencial INE, pasaporte mexicano, licencia de conducir)
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Historia clínica, exámenes de laboratorio, reporte de la valoración cardiopulmonar cuando proceda y demás
      estudios de gabinete que procedan de acuerdo a la intervención quirúrgica, que le proporcionan en el centro
      de salud y/u Hospital General
    cites:
    - source: retys
  - text: Carta de consentimiento informado, que se le entrega en UNEME antes de la cirugía.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la consulta médica del establecimiento que le corresponda.
    - Se le miden los signos vitales, se realiza una entrevista médica y exploración física. De ser necesario se
      deriva a la UNEME
    - Contactar al ciudadano, indicando fecha, hora y cuidados necesarios previos a la cirugía
    - Acudir a la UNEME con una persona acompañante, presentar los requisitos solicitados e identificarse.
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la intervención (incluyendo vendaje y suero), trasladar al quirófano y, después
      del procedimiento, dar instrucciones para el cuidado y alta.
  notes: Derechohabientes de los Servicios de Salud del Instituto Mexicano del Seguro Social para el Bienestar
- name: Derechohabientes IMSS, ISSSTE E ISSSTECALI
  requirements:
  - text: Hoja de derivación debidamente llenada y sellada, que le proporciona el IMSS, ISSSTE o ISSSTECALI, según
      corresponda.
    cites:
    - source: retys
  - text: Nota médica de referencia de la unidad de origen que incluya resultados de laboratorio o los exámenes
      de laboratorio de respaldo
    cites:
    - source: retys
  - text: Carta de consentimiento informado, que se le entrega en UNEME antes de la cirugía
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial (INE, pasaporte, licencia de conducir).
    cites:
    - source: retys
  modes:
