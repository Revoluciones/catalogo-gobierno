scenarios:
- name: GENERAL
  requirements:
  - text: Original y copia del Formulario de Solicitud de revalidación o exención de constancia de cumplimiento
      al Programa Atrapa la Grasa y Sólidos (FRM-015), debidamente llenado y firmado.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11987
  - text: Copia de Manifiesto de entrega, transporte y recepción de residuos de manejo especial
    cites:
    - source: retys
  - text: 3. Hacer el pago correspondiente
    cites:
    - source: retys
  - text: Las copias deben ser LEGIBLES y contener el DOCUMENTO COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la coordinación de control de calidad, ubicada en el edificio posterior izquierdo de CESPT, y presentar
      todos los requisitos necesarios.
    - La persona de la Coordinación de Control de Calidad revisa que se cumpla con todos los requisitos, si no están
      completos, informa a la persona solicitante que no es posible realizar el trámite hasta que éstos se completen,
      indicándole que es lo que falta.
    - Con los requisitos completos, la persona de la Coordinación de Control de Calidad, le entrega una Ficha de
      pago.
    - Acudir al área de Cajas con la Ficha de Pago y realizar el pago de derechos correspondiente, la persona de
      Cajas le entregará un Recibo de Pago.
    - Pasar al área de Archivo, presentar el Recibo de Pago y entregar el original y copia del Formulario de Solicitud
      de Revalidación o Exención de constancia de cumplimiento o al Programa Atrapa la Grasa y Sólidos.
    - La persona del área de Archivo imprime certificación de recibido al original y copia Formulario de Solicitud
      de Revalidación o Exención de constancia de cumplimiento o al Programa Atrapa la Grasa y Sólidos, en donde
      se indica la fecha de respuesta, y entrega la copia a la persona solicitante.
    - 'Una persona Analista de la Coordinación de Control de Calidad acudirá a la empresa o establecimiento a realizar
      una visita de verificación para revalidación, para revisar si existen cambios en las instalaciones o en la
      cantidad de desechos de grasa o sólidos que produce la empresa o establecimiento, NO DETECTAN CAMBIOS: Ir
      al siguiente paso. SE DETECTAN CAMBIOS: Personal de la Coordinación de Control de Calidad elabora oficio de
      Dimensionamiento de dispositivo(s), en el que se indicarán las adecuaciones y sistemas de pretratamiento que
      debe realizar y el plazo para realizarlas, y se comunica con el usuario para que pase a recoger el documento.'
    - CESPT emite la Oficio de revalidación de Constancia de Cumplimiento al Programa Atrapa la Grasa y Sólidos,
      y contacta a la persona solicitante para que pase a recoger el documento.
    - Acudir a CESPT por la Oficio de revalidación de Constancia de Cumplimiento al Programa Atrapa la Grasa y Sólidos.
  notes: GENERAL
