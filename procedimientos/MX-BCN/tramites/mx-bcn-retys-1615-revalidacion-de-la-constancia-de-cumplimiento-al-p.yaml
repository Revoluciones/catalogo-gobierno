title: Revalidación de la Constancia de Cumplimiento al Programa Atrapa la Grasa y Sólidos
summary: Obtener la revalidación de la constancia de cumplimiento al programa atrapa la grasa y sólidos, para usuarios
  no domésticos con procesos productivos que generen desecho de grasas y sólidos.
