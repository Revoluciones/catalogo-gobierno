  - text: Original y 2 copias de Acta de Nacimiento.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la dependencia a solicitar el servicio.
    - Presentar la solicitud por el médico psiquiatra tratante, institución de servicios de salud, judicial o educativa.
    - Acudir en la fecha programada para aplicación de prueba psicológica.
    - Realiza prueba psicológica e informa del tiempo de entrega de resultados. Entrega de resultados aproximadamente
      10 días siguientes hábiles.
    - En caso de que el solicitante utilice lentes oftálmicos es necesario llevarlos el día de la prueba.
  notes: Cualquier derechohabiente del IMSS, ISSSTE, ISSSTECALI, ISESALUD
- name: Público en General
  requirements:
  - text: Original y 2 copias de Identificación oficial vigente (INE, pasaporte mexicano, licencia de conducir,
      cartilla militar)
    cites:
    - source: retys
  - text: Original y 2 copias de Acta de Nacimiento.
    cites:
    - source: retys
  - text: Original y 2 copias de Comprobante de domicilio.
    cites:
    - source: retys
  - text: 2 copias de Clave Única de Registro de Población (CURP).
    cites:
    - source: retys
  - text: Recibo de pago.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Contar con documento de solicitud por el médico psiquiatra tratante, institución de servicios de salud, judicial
      o educativa.
    - Realizar pago correspondiente
    - Acudir en la fecha programada para aplicación de prueba psicológica.
    - Realiza prueba psicológica e informa del tiempo de entrega de resultados.
    - En caso de que el solicitante utilice lentes oftálmicos es necesario llevarlos el día de la prueba.
  notes: Público en General
