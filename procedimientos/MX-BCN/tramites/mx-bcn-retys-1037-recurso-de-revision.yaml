title: Recurso de revisión
summary: La persona solicitante podrá interponer, por sí mismo o a través de su representante, de manera directa
  o por medios electrónicos, recurso de revisión ante el instituto o ante la unidad de transparencia que haya conocido
  de la solicitud de transparencia dentro de los quince días siguientes a la fecha de la notificación de la respuesta,
  o del vencimiento del plazo para su notificación.
