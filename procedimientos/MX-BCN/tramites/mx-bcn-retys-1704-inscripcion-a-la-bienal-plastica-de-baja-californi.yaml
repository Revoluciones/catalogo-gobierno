title: Inscripción a la Bienal Plástica de Baja California
summary: Que las personas artistas plásticas concursen en la bienal plástica de Baja California y sus obras sean
  promocionadas y difundidas, con la intención de obtener la oportunidad de ser acreedores a premios económicos
  de adquisición de obra por el primer lugar en las categorías estipuladas en la convocatoria.
