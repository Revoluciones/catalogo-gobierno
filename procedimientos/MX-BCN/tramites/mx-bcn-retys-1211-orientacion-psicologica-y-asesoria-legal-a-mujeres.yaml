scenarios:
- name: MUJERES
  requirements:
  - text: Ser mujer
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Haga clic en el botón “Iniciar trámite”
    - Proporcione sus datos personales y de contacto, como nombre, apellidos y correo electrónico, para recibir
      las notificaciones relacionadas con su solicitud.
    - Seleccione el tipo de atención que requiere, ya sea atención psicológica o atención jurídica.
    - Reciba la notificación de su solicitud. Una vez que su solicitud sea atendida, recibirá un correo electrónico
      con un enlace para consultar la información de su caso.
    - Consulte la fecha y hora de su cita. Ingrese al enlace “Ver mi caso” que recibirá en el correo electrónico.
      Para consultar la información de su cita, deberá ingresar el número de folio de su solicitud y el correo electrónico
      que registró. Una vez que haya ingresado estos datos, podrá visualizar la fecha y hora asignadas para su cita.
  - name: Presencial
    steps:
    - Asistir a la secretaria del estado de baja california
    - Solicitar el servicio que se requiera
    - Se le brinda el servicio
  notes: MUJERES
