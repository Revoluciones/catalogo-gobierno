scenarios:
- name: Personas Fisicas
  requirements:
  - text: Se debe presentar el propietario del vehículo, con original y copia de identificación oficial vigente
      (INE, pasaporte mexicano, cartilla del servicio militar nacional o matrícula consular)
    cites:
    - source: retys
  - text: Solicitar su baja definitiva o temporal, en caso de ser baja definitiva llenar formato
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14096
  - text: Entregar placas y tarjeta de circulación original, en caso de que alguno de dichos elementos de identificación
      vehicular haya sido robado o extraviado, deberá presentarse la constancia de extravío expedida por el ministerio
      público que corresponda o formato de extravío de la Recaudación de Rentas.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14097
  - text: Realizar el pago por la baja respectiva de los derechos correspondientes.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la Recaudación de Rentas más cercana a su domicilio
    - El contribuyente entrega láminas o en su caso formato de extravío
    - Se le sella su tarjeta de circulación
    - Pasa a la caja y entrega la tarjeta original, efectúa el pago correspondiente
    - Entrega tarjeta de baja al ciudadano
    - Finaliza el trámite y puede retirarse
  notes: Trámite a través del cual se cancela el alta en el Registro Estatal Vehicular, cumpliendo con los requisitos
    establecidos en Ley.
- name: Personas Morales
  requirements:
  - text: Se debe presentar representante con original y copia de identificación oficial vigente (INE, pasaporte
      mexicano, cartilla del servicio militar nacional o matrícula consular) y documentación en la que conste la
      personalidad de quien comparece (acta constitutiva)
    cites:
    - source: retys
  - text: Solicitar su baja definitiva o temporal, en caso de ser baja definitiva llenar formato
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14098
  - text: Entregar placas y tarjeta de circulación original, en caso de que alguno de dichos elementos de identificación
      vehicular haya sido robado o extraviado, deberá presentarse la constancia de extravío expedida por el ministerio
      público que corresponda o formato de extravío de la Recaudación de Rentas.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14099
  modes:
  - name: Presencial
    steps:
    - Acudir a la Recaudación de Rentas más cercana a su domicilio
    - El contribuyente entrega láminas o en su caso formato de extravío
    - Se le sella su tarjeta de circulación
    - Pasa a la caja y entrega la tarjeta original, efectúa el pago correspondiente
    - Entrega tarjeta de baja al ciudadano
    - Finaliza el trámite y puede retirarse
  notes: Trámite a través del cual se cancela el alta en el Registro Estatal Vehicular, cumpliendo con los requisitos
    establecidos en Ley.
