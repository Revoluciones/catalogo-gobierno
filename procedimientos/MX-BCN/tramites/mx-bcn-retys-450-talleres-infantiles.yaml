scenarios:
- name: Ciudadanía en general
  requirements:
  - text: Llenar lista de asistencia (cuando se reciba el servicio)
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Difusión del servicio en planteles educativos, organizaciones de la sociedad civil y centros comunitarios.
    - Identifica los espacios interesados
    - Muestra el catálogo de Talleres infantiles.
    - En caso de estar interesado, se sugiere fecha y hora probable para recibir el servicio.
    - Verifica disponibilidad en la agenda y se confirma fecha y hora de inicio, se establece cronograma de atención
      de acuerdo con la cantidad de sesiones y asistentes.
    - Se acuerda el espacio donde se brindara el servicio, el cual debe contar con luz eléctrica y mobiliario.
    - Brinda el servicio en la fecha y hora acordada.
    - Terminada la plática lleva a cabo la firma y sello de documentos probatorios de haber recibido el servicio.
  notes: Recopilación de documentos
