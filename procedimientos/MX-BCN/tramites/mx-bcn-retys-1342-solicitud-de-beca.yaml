scenarios:
- name: Estimular a estudiantes que obtengan buen promedio en el cuatrimestre
  requirements:
  - text: Matricula de UPBC
    cites:
    - source: retys
  - text: Promedio minímo de 9.0/10
    cites:
    - source: retys
  - text: Solicitud de beca en el sistema de SIAAX de la UPBC
    cites:
    - source: retys
  - text: Solicitud de beca ante el Consejo de Calidad
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - El estudiante obtendrá su promedio cuatrimestral como mínimo 9.0
    - El estudiante deberá presentar ante el Director de carrera la solicitud de beca
    - El Director de carrera revisará la factibilidad de la solicitud de la beca, para presentar ante el Consejo
      de Calidad
    - El Consejo de Calidad recibe y revisa solicitud de beca del estudiante para seleccionar
    - El Consejo de Calidad revisa solicitudes interpuestas por parte de estudiantes y se selecciona de acuerdo
      a la cantidad de becas autorizadas a entregar por parte de la UPBC
    - Una vez seleccionado el estudiante el cual obtuvo la beca, se le notifica que fue autorizada
  notes: Incentivar a los alumnos a obtener buen promedio en el cuatrimestre que cursan, con la finalidad de estar
    en posición de solicitar una beca
