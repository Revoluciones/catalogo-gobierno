  para exportación modalidad B.- Solicitud de certificado para exportación
summary: Cuando se requiera realizar una exportación de alimentos y suplementos alimenticios, bebidas no alcohólicas,
  bebidas alcohólicas, productos cosméticos, artículos de aseo y limpieza, así como de las materias primas y, en
  su caso, aditivos que intervengan en su elaboración, que se encuentren domiciliados en territorio nacional y los
  productos a exportar se elaboren en méxico exclusivamente para exportación, es decir que no se comercializan en
  territorio nacional.
