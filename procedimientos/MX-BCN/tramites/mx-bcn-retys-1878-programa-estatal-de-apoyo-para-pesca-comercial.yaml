scenarios:
- name: Subcomponente para Modernización de Flota Menor
  requirements:
  - text: Solicitud de Apoyo con datos técnicos y socioeconómicos del SOLICITANTE debidamente llenada y firmada.
    cites:
    - source: retys
  - text: Identificación oficial vigente (INE, Pasaporte, Cartilla Militar).
    cites:
    - source: retys
  - text: Comprobante de domicilio (persona física, apoderado o representante legal) con una vigencia no mayor a
      3 meses.
    cites:
    - source: retys
  - text: Acta Constitutiva. (aplica solo para las personas morales)
    cites:
    - source: retys
  - text: Última Acta de Asamblea donde se establece quienes ostentan actualmente los poderes y representación de
      la persona moral. (aplica solo para las personas morales)
    cites:
    - source: retys
  - text: Escrito libre con fecha y firma, mediante el cual se manifieste bajo protesta de decir verdad que quien
      llevará a cabo los trámites y procesos del Programa ante la Dependencia, cuenta actualmente con los poderes
      necesarios. (Consultar y descargar en la página electrónica).
    cites:
    - source: retys
  - text: Constancia de Situación Fiscal (Actualizada, no mayor a tres meses de antigüedad).
    cites:
    - source: retys
  - text: Permiso o concesión vigente o en trámite de renovación (SAP CONAPESCA) o Permiso de aprovechamiento extractivo
      (SEMARNAT)
    cites:
    - source: retys
  - text: Comprobante con Datos bancarios de la PERSONA BENEFICIARIA o del proveedor (Estado de cuenta emitido por
      el banco).
    cites:
    - source: retys
  - text: De 1 a 3 Avisos de arribo de 2023, 2024 y/o de 2025 de alguna de las especies autorizadas en los permisos
      de pesca de los cuales sean titulares.
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Registro de Solicitud en Línea
    - Carga de Documentos de Requisitos
    - Validación de Expediente para Asignación de Folio Estatal del Programa
    - Dictaminación de Expediente
    - Integración de Comprobación de aplicación del Recurso de Apoyo y Finiquito de Expediente
  notes: 'Modernización de Flota Menor El Apoyo podrá utilizarse para destinarse a artes de pesca, equipo auxiliar
    al arte de pesca, reparación de motores o embarcaciones, materiales y/o refacciones para reparar embarcaciones
    o motores, equipo de seguridad, navegación, buceo, protección, conservación, motobombas, cobrador de líneas
    hidráulico, entre otros necesarios o específicos para la Pesca Comercial. *No se aceptarán consumibles tales
    como: combustibles, gases, entre otros.'
