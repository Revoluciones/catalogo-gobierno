  modes:
  - name: En línea
    steps:
    - Registro de Solicitud en Línea
    - Carga de Documentos de Requisitos
    - Validación de Expediente para Asignación de Folio Estatal del Programa
    - Dictaminación de Expediente
    - Integración de Comprobación de aplicación del Recurso de Apoyo y Finiquito de Expediente
  notes: 'El Apoyo podrá utilizarse para promover la Pesca Comercial mediante un apoyo económico en los siguientes
    aspectos: a) Mantenimiento en dique (subida y bajada del barco, pintura para el casco, reemplazo de placas de
    acero, ánodos de zinc, calibraciones del casco, chumaceras de la flecha principal y pistones de timonería) entre
    otros. b) Pagos de derecho para la obtención de certificado de seguridad (plano de zafarrancho, cuadro de obligaciones);
    cuadernillo de estabilidad (Planos de arreglo general y capacidades del tanque), entre otros. c) Adquisición
    de equipamiento como: equipos electrónicos (radares, radio boyas, radios de banda lateral, radios de 2 m, plotter,
    computadoras, pilotos automáticos entre otros); equipos hidráulicos (motores hidráulicos para los carretes de
    pesca, bombas, pilotos automáticos); motores generadores. maquinas principales, equipos de refrigeración (compresores,
    placas, difusores, marcadores), Compra de equipos de pesca (anzuelos, línea e monofilamento, ganchos snaps,
    destorcedores, grapas, boyas y patescas).'
