title: Programa Estatal de Apoyo para PESCA COMERCIAL
summary: Trámite para la Recepción de Solicitudes para aplicar a los beneficios del Programa Estatal de Apoyo para
  el Sector de Pesca y Acuacultura, enfocado en la PESCA COMERCIAL a través del apoyo subsidiario a la inversión
  en bienes de capital estratégico para equipamiento, mantenimiento, ordenamiento, sanidad y particularmente para
  eficientizar la operación con énfasis en el incremento o mejora de la producción, servicios y/o su comercialización.
