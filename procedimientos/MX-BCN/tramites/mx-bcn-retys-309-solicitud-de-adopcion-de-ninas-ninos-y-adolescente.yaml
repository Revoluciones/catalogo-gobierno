  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas de las Subprocuradurías para la Defensa de los Menores y la Familia, en cualquiera de
      los municipios del estado, a solicitar el servicio y/o trámite.
    - Se realiza la Entrevista Inicial entre los Solicitantes y el Área Jurídica de Adopciones
    - Los Solicitantes recaban y entregan la documentación que solicita el Área Jurídica de Adopciones
    - El Área Jurídica de Adopciones recibe la documentacion solicitada
    - El Área Jurídica de Adopciones genera el expediente, y solicita a las áreas de Psicología y Trabajo Social,
      la realización de Valoración Psicológica y Estudio Socieconómico
    - Los Solicitantes acuden a Terapia Psicológica para reforzar sus habilidades parentales y emocionales
    - Los Solicitantes atenderán las Observaciones que se detecten del Estudio Socieconómico
    - Los Solicitantes Inician y Concluyen el Curso de Escuela para la Familia
    - Se realiza la Mesa Técnica, donde se analizan los perfiles de los NNA´s y de los Solicitantes para generar
      propuestas al Consejo de Adopciones
    - Se realiza el Consejo de Adopciones, donde se aprueba la asignación de los NNA´s con las familias solicitantes
    - Se realiza la Entrega de los NNA´s con la Familia asignada
    - Se llevarán a cabo Seguimientos a las Familias que han sido beneficiadas con un NNA
  notes: Recopilación de documentos para solicitud de adopción
legal_basis:
