title: Autorización y/o Revalidación de Empresa de Seguridad Privada
summary: Trámite en el cual se solicitan los requisitos necesarios para la validación de la prestación del servicio
  de seguridad privada por parte de las empresas que brindan el servicio de seguridad privada en general y su revalidación.
