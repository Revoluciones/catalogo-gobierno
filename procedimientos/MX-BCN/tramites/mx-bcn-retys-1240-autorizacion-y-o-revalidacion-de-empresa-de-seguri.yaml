    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14248
  - text: 'Documento que acredite la personalidad, mismo que puede ser: Acta Constitutiva, Poder Notarial o Identificación
      Oficial Vigente'
    cites:
    - source: retys
  - text: Relación detallada de socios, propietarios y representantes o apoderados legales, con nombre, domicilio,
      lugar y fecha de nacimiento, asi como nombres de sus padres, agregando copia de actas de nacimiento o carta
      de naturalizacion e indentificacion oficial vigente
    cites:
    - source: retys
  - text: Documentación que acredite que los socios, propietarios y representantes o apoderados legales que pretendan
      prestar servicios de seguridad privada, que no esten sujetos a proceso penal y/o condenados por delito doloso
    cites:
    - source: retys
  - text: Plan detallado de capacitación continua para todo el personal operativo, incluyendo al jefe de operaciones,
      en el que se especifique las materias, duración, calendario y entidades responsables de cada curso
    cites:
    - source: retys
  - text: Imagenes a color del uniforme y sus accesorios a utilizar, desde la perspectiva frontal, trasera, lateral
      izquierda, lateral derecha y de cuerpo entero
    cites:
    - source: retys
  - text: Imagenes a color de insignias y aditamentos de seguridad a utilizar
    cites:
    - source: retys
  - text: Documentación que acredite la legal portación y registro de las armas de fuego utilizadas para la prestación
