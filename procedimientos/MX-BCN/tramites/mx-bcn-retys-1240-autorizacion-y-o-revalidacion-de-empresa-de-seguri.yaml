scenarios:
- name: Autorización
  requirements:
  - text: Solicitud escrita
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14241
  - text: 'Documento que acredite la personalidad, mismo que puede ser: Acta Constitutiva, Poder Notarial, Carta
      Poder Simple, o Identificación Oficial Vigente'
    cites:
    - source: retys
  - text: Relación detallada de socios, propietarios y representantes o apoderados legales, con nombre, domicilio,
      lugar y fecha de nacimiento, así como nombre de sus padres, agregando copia de actas de nacimiento o carta
      de naturalización e identificación oficial vigente
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14242
  - text: Documentación que acredite que los socios, propietarios o representantes o apoderados legales que pretendan
      prestar servicios de seguridad privada, no esten sujetos a proceso penal y/o condenados por delito doloso
    cites:
    - source: retys
  - text: Permiso de uso de suelo para local comercial respecto a los lugares donde se encuentren ubicados sus establecimientos,
      expedido por la autoridad competente
    cites:
    - source: retys
  - text: Documentación que acredite el domicilio legal para oir y recibir notificaciones y, en su caso, el de las
      sucursales que se encuentren ubicadas en el Estado
    cites:
    - source: retys
  - text: Plan detallado de capacitación continua para todo el personal operativo, incluyendo al jefe de operaciones,
      en el que se especifique las materias, duración, calendario y entidades responsables de cada curso
    cites:
    - source: retys
  - text: Imagenes a color del uniforme y sus accesorios a utilizar, desde la perspectiva frontal, trasera, lateral
      izquierda, lateral derecha y de cuerpo entero
    cites:
    - source: retys
  - text: Imagenes a color de insignias y aditamentos de seguridad a utilizar
    cites:
    - source: retys
  - text: Documentación que acredite la legal portación y registro de las armas de fuego utilizadas para la prestación
      del servicio de seguridad privada
    cites:
    - source: retys
  - text: Descripción de la flota vehicular, especificando marca, modelo, serie, emblemas, logotipos, colores o
      imagenes de sus insignias, asi como la documentación que acredite la vigencia de las placas, tarjeta de circulacion
      y poliza contra daños a terceros
    cites:
    - source: retys
  - text: Relación del equipo de protección personal, en el que se describa la marca, tipo, modelo y número de serie
    cites:
    - source: retys
  - text: Manuales de operación específicos para cada modalidad prevista en el artículo 4 del Reglamento de Seguridad
      Privada para el Estado de Baja California
    cites:
    - source: retys
  - text: Listado detallado del equipo de radio comunicación
    cites:
    - source: retys
  - text: Constancia de empadronamiento o inscripción del Registro Federal de Contribuyentes ante la Secretaría
      de Hacienda Baja California
    cites:
    - source: retys
  - text: Modelo de gafete o credencial de identificación para el personal operativo
    cites:
    - source: retys
  - text: Autorización para operar equipo de radiocomunicación, expedida por la autoridad reguladora o por una empresa
      de telecomunicaciones autorizada
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14243
  - text: En caso de contar con personal operativo, comprobante de cumplimiento de cada uno de los requisitos del
      artículo 74 del Reglamento de Seguridad Privada para el Estado de Baja California
    cites:
    - source: retys
  - text: En caso de contar con personal operativo, comprobante de cumplimiento de cada uno de los requisitos del
      artículo 74 del Reglamento de Seguridad Privada para el Estado de Baja California
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14244
  modes:
  - name: Presencial
    steps:
    - El ciudadano acreditará los requisitos para su modalidad
    - El ciudadano presentará una carpeta con los requisitos en la Dirección de Seguridad Privada
    - El servidor públic revisará que cumpla con la totalidad de requisitos
    - El servidor púbico informará al ciudadano si su carpeta cumple o no con los requisitos y que es necesario
      solventar
    - Caundo la carpeta este completa se realizará una visita al ciudadano, para verificar que cumpla con los requisitos
      del establecimiento
    - Una vez realizada la visita y cumplidos todos los requisitos se realizará un oficio de pago por la autorización
    - El ciudadano realizará el pago de la autorización y entregará su comprobante en la Dirección de Seguridad
      Privada
    - El servidor público realizará la entrega del permiso al ciudadano y explicará las obligaciones con las que
      debe cumplir
  notes: Autorización para la prestación de servicios de seguridad privada
- name: Revalidación
  requirements:
  - text: Solicitud de revalidación por escrito para continuar prestando los servicios de seguridad privada en el
      Estado
    cites:
