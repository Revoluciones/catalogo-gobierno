title: Anuencia de Impacto a la Movilidad de Zonas de Transporte
summary: 'Consiste en solicitar el permiso o autorización con respecto de las zonas de transporte que se utilizarán:
  cierres de circuito, lanzaderas, bases, encierros, terminales, zonas de ascenso y descenso y zonas de carga y
  descarga para empresas o agrupaciones.'
