scenarios:
- name: Permisionarios, representantes legales de concesionarias, gremios, asociaciones, etc
  requirements:
  - text: Presentar formato de solicitud en original y copia debidamente firmada completando todos los campos que
      sean requeridos.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14733
  - text: Copia de Identificación oficial vigente del solcitante.
    cites:
    - source: retys
  - text: Autorización vigente emitida por parte de la autoridad competente para la operación de la zona de transporte.
    cites:
    - source: retys
  - text: Copia del recibo de pago de derechos municipales vigente por concepto de ocupación de la vía pública.
    cites:
    - source: retys
  - text: Croquis de localización legible, (Si se ubica en vía pública, indicar la direccion completa y calles colindantes,
      si se ubica en propiedad privada, indicar ubicación de cajones asignados)
    cites:
    - source: retys
  - text: Fotografías del espacio tomadas a distancia, en las que se observe la operación del servicio de transporte.
    cites:
    - source: retys
  - text: 'Padrón vehicular que va a operar en el espacio solicitado (Debe contener: número de permiso municipal,
      número de permiso estatal, nombre del permisionario, modalidad en permiso)'
    cites:
    - source: retys
  - text: Anuencia por escrito donde se manifieste la autorización para el uso de servicios sanitarios. (Antigüedad
      no mayor a 90 días)
    cites:
    - source: retys
