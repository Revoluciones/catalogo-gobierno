- municipality: Ensenada
  name: Dirección de Unidad Quirúrgica
  address: 'Avenida Gastelum #1340, Zona Centro, Ensenada, 22800'
scenarios:
- name: Derechohabientes del IMSS-BIENESTAR
  requirements:
  - text: Hoja de derivación debidamente requisitada y sellada, que le proporciona el centro de salud y/u Hospital
      General.
    cites:
    - source: retys
  - text: Identificación oficial (Credencial de elector, pasaporte, licencia de manejo).
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Historia clínica, exámenes de laboratorio, reporte de la valoración cardiopulmonar cuando proceda y demás
      estudios de gabinete que procedan de acuerdo a la intervención quirúrgica, que le proporciona el centro de
      salud.
    cites:
    - source: retys
  - text: Carta de consentimiento informado para cirugía y anestesia, que le entregan en la UNEME previo a la cirugía
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la consulta médica del establecimiento que le corresponda.
    - Se le miden los signos vitales, se realiza una entrevista médica y exploración física. De ser necesario, se
      deriva con un especialista
    - Acudir a la consulta de especialidad
    - El especialista realizará una entrevista, exploración física y solicitará estudios de imagen, según lo considere.
      Se deriva a la UNEME, de ser necesario
    - Contactar al ciudadano indicando fecha, hora y cuidados necesarios previos a la cirugía
    - Acudir a la UNEME, con un acompañante. Identificarse y entregar los requisitos
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la cirugía (incluyendo vendaje y suero), trasladar al quirófano y, después del procedimiento,
      dar instrucciones para el cuidado y alta.
  notes: Derechohabientes de los Servicios de Salud del Instituto Mexicano del Seguro Social para el Bienestar
- name: Derechohabientes IMSS, ISSSTE e ISSSTECALI
  requirements:
  - text: Hoja de derivación debidamente requisitada y sellada, que le proporciona el IMSS, ISSSTE o ISSSTECALI
      en su caso
    cites:
    - source: retys
  - text: Nota médica de referencia de la unidad de origen que incluya resultados de laboratorio o los exámenes
      de laboratorio de respaldo
    cites:
    - source: retys
  - text: Carta de consentimiento informado, que se le entrega en UNEME antes de la cirugía
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial (INE, pasaporte, licencia de conducir).
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la consulta médica del establecimiento que le corresponda.
    - Se le miden los signos vitales, se realiza una entrevista médica y exploración física. De ser necesario, se
      deriva con un especialista
    - Acudir a la consulta de especialidad
    - El especialista realizará una entrevista, exploración física y solicitará estudios de imagen, según lo considere.
      Se deriva a la UNEME, de ser necesario
    - Contactar al ciudadano indicando fecha, hora y cuidados necesarios previos a la cirugía
    - Acudir a la UNEME, con un acompañante. Identificarse y entregar los requisitos
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la cirugía (incluyendo vendaje y suero), trasladar al quirófano y, después del procedimiento,
