title: Subsidio Descuento a Adultos Mayores, Viudez y Personas con Discapacidad
summary: Los usuarios en situación de pobreza, adultos mayores de 60 años que sean viudas o viudos y personas con
  discapacidad, tienen derecho a descuentos según su consumo de agua, y este descuento se otorgará a quién cada
  año presente su acreditación cumpliendo con los requisitos en nuestras oficinas. El subsidio solo se otorgará
  a personas en situación de pobreza, mediante estudio socio-económico.
