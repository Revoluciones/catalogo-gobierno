scenarios:
- name: Ciudadanía en general
  requirements:
  - text: Contar con cita (solo aplica si el trámite es en Recaudación de Rentas del Estado en Tijuana Vía Rápida,IMOS,Cerro
      Colorado y Mexicali)
    cites:
    - source: retys
  - text: Presentar el vehículo de que se trate para su verificación (este trámite se realiza hasta las 16:00 hrs.)
    cites:
    - source: retys
  - text: Factura de origen expedida por el fabricante, ensamblador, distribuidor autorizado o empresas comerciales
      dedicadas a la compra y venta de vehículos usados; salvo en el caso en que haya sido importado directamente
      por un particular, en los términos de las disposiciones legales vigentes.
    cites:
    - source: retys
  - text: Presentar pedimento de legal importación en caso de ser vehículo extranjero
    cites:
    - source: retys
  - text: Formato electrónico de registro de comerciantes de autos, excepto en los vehículos importados directamente
      por el interesado, así como los adquiridos fuera del Estado
    cites:
    - source: retys
  - text: 'Tratándose de personas físicas: presentar en original y copia licencia de conducir vigente del Estado
      de Baja California, en caso de que se cuente con alguna discapacidad o impedimento para conducir, presentar
      la licencia de conducir vigente del Estado de Baja California de la persona que autorice para conducir'
    cites:
    - source: retys
  - text: Tratándose de personas morales, presentar en original y copia comprobante de domicilio no mayor a tres
      meses de antigüedad, escritura constitutiva, cédula de identificación fiscal del registro federal de contribuyentes,
      identificación oficial con fotografía vigente del representanten legal y documentación en la que conste la
      personalidad de quién comparece
    cites:
    - source: retys
  - text: Tratándose de vehículos foráneos deberá presentar registro y pagos de la Entidad Federativa de Origen.
    cites:
    - source: retys
  - text: Presentar en original y copia el seguro de responsabilidad civil vigente que ampare los conceptos y el
      monto señalado en el artículo 18 bis de este ordenamiento (el seguro de responsabilidad civil al que se refiere
      este ordenamiento, debe amparar por lo menos, en concepto de daños a terceros en su persona y en sus bienes,
      el monto de cuatro mil trescientos cincuenta veces el valor diario de la unidad de medida y actualización
      vigente)
    cites:
    - source: retys
  - text: 'Efectuar el pago de derechos correspondiente, opciones de pago: efectivo,cheque certificado, tarjeta
      debito/crédito (excepto tarjetas American Express )'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Presentarse en la oficina de recaudación correspondiente con el vehículo para verificación de número de serie
    - Se revisa el vehículo, si el dictamen es favorable, se procede con la toma de fotografías o se le entrega
      formato
    - Tratándose de vehículo foráneo al ciudadano se le entregará solicitud de su trámite para lo que deberá esperar
      la validación de su factura o pedimento que acredita la legal estancia y el registro del vehículo de la Entidad
      Federativa de origen. (El tiempo de validación puede ser hasta 10 días hábiles) una vez validado, se le notificará
      vía correo electrónico al correo que señale el ciudadano en su solicitud. Una vez que se le notifique por
      correo deberá regresar para continuar con el trámite.
    - Acudir al módulo de revisión de requisitos y entrega de documentación
    - Revisa la documentación; en caso de que no proceda el trámite, el ciudadano podrá regresar una vez que cumpla
      con la obtención total de los requisitos
    - Si procede el trámite, el ciudadano deberá realizar el pago de derechos e impuestos correspondientes
    - Realiza el cobro correspondiente y entrega la tarjeta de circulación
    - Pasa a la ventanilla de entrega de placas a recoger sus láminas correspondientes
  notes: Registrar en el padrón vehicular del Estado de Baja California, toda clase de vehículos con domicilio en
    la entidad
