scenarios:
- name: Persona Física con Actividad Empresarial
  requirements:
  - text: Solicitud de Apoyo Certifica tu Competitividad 2026
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14769
  - text: Copia de la constancia o certificado obtenido, en el que se indique la norma bajo la cual se acredita.
    cites:
    - source: retys
  - text: Copia de identificación oficial vigente (credencial para votar, pasaporte o cédula profesional vigente;
      en caso de ser extranjero, documento migratorio o visa permanente).
    cites:
    - source: retys
  - text: Constancia de Situación Fiscal vigente.
    cites:
    - source: retys
  - text: Copia del comprobante de domicilio en el Estado de Baja California, con una antigüedad no mayor a 2 meses
      (recibo de luz o agua).
    cites:
    - source: retys
  - text: Escrito libre en hoja membretada de la empresa, dirigido a la Dirección de Sectores y Cadenas Productivas
      (DSCP), indicando el monto del apoyo solicitado, la actividad económica de la empresa, el proceso de certificación
      y el número de empleados.
    cites:
    - source: retys
  - text: Comprobante Fiscal Digital por Internet (CFDI) que ampare el pago de los servicios de certificación, emitido
      por el organismo certificador correspondiente.
    cites:
    - source: retys
  - text: Manifestación, bajo protesta de decir verdad, de no ser familiar directo de personas servidoras o funcionarias
      de los tres niveles de gobierno, ni ocupar cargo público ni tener interés personal, familiar o de negocios
      en dichas instituciones.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El interesado llena la solicitud y entrega la documentación en la ventanilla de las oficinas de atención de
      la SEI.
    - El Comité Evaluador realiza la revisión y, en su caso, aprueba la solicitud.
    - El beneficiario realiza la emisión de la factura.
    - La Dirección de Sectores y Cadenas Productivas entrega el cheque al beneficiario, a su nombre con la leyenda
      “no negociable”.
  notes: Certificación Básica (ISO 9001, 14001, 18001, 17025 o equivalentes) y Certificación Especializada (ISO
    16949, IATF 16949, AS900, AS9100, ISO 13485, 27001 o equivalentes).
