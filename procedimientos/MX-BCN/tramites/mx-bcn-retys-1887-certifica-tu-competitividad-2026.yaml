title: Certifica tu Competitividad 2026
summary: Programa dirigido a empresas y personas físicas con actividad empresarial establecidas en el Estado de
  Baja California, para solicitar apoyo en la obtención, recertificación o vigilancia de certificaciones que fortalezcan
  su competitividad y promuevan su integración a cadenas productivas.
authority:
  name: Secretaría de Economía e Innovación de Baja California
official_ids:
  retys_id: 1887
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/1887
  homoclave: BC-SEI-015
who_can:
- Representante Legal
- Interesado
when: Cuando la empresa haya obtenido una certificación, recertificación o vigilancia y desee solicitar el apoyo
  económico.
result: Reembolso de hasta $25,000 o $35,000, según la certificación.
