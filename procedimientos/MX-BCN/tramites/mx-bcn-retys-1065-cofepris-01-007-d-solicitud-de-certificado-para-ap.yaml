summary: Cuando el ciudadano requiera realizar una exportación que se encuentre domiciliada en territorio nacional,
  que solicite que esta autoridad sanitaria certifique los análisis realizados a los lotes de los productos a exportar
  por los laboratorios terceros autorizados.
