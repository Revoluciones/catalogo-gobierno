title: 'COFEPRIS-01-007-D Solicitud de certificado para apoyo a la exportación Modalidad D: Solicitud de certificado
  para exportación análisis de producto - [EXCEPTO SUPLEMENTOS ALIMENTICIOS, FÓRMULAS PARA LACTANTES, DE CONTINUACIÓN
  Y PARA NECESIDADES ESPECIALES DE NUTRICIÓN, BEBIDAS TONIFICANTES (AQUELLAS QUE CONTIENEN TAURINA Y/O GLUCURONOLACTONA
