summary: Documento oficial que certifica y describe los semestres y asignaturas (aprobadas y/o reprobadas) cursadas
  por un alumno inscrito en el Plan de Estudios de la Reforma Integral de la Educación Media Superior (RIEMS), a
  partir del periodo lectivo 2009-2, en el COBACH BC, el cual solicita su baja para inscribirse en otro Subsistema
  en el Estado, en otro estado o en el extranjero, para realizar su portabilidad de estudios.
