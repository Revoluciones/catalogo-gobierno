scenarios:
- name: Inscripción Persona Fisica
  requirements:
  - text: Solicitud de Inscripción al Registro Estatal de Agentes Profesionales Inmobiliarios, en línea.
    cites:
    - source: retys
  - text: Identificación oficial vigente del agente inmobiliario; en caso de ser extranjero, documento migratorio
      vigente que acredite residencia permanente.
    cites:
    - source: retys
  - text: Constancia de Situación Fiscal, no mayor a 3 meses.
    cites:
    - source: retys
  - text: Comprobante de domicilio fiscal registrado ante el SAT, no mayor a 3 meses.
    cites:
    - source: retys
  - text: Constancia y/o certificado de curso en operaciones inmobiliarias, que cuente con RVOE, con duración mínima
      de 40 horas y vigencia documental de 2 años.
    cites:
    - source: retys
  - text: Contrato de adhesión ¨Prestación de servicios de intermediación para la compraventa inmobiliaria¨ registrado
      ante PROFECO, de acuerdo a la NOM-247-SE-2021.
    cites:
    - source: retys
  - text: Constancia de antecedentes penales, no mayor a 3 meses.
    cites:
    - source: retys
  - text: Solicitud firmada y carta compromiso aceptando cumplir con los programas y actualizaciones en materia
      de operaciones inmobiliarias.
    cites:
    - source: retys
  - text: Fotografía reciente, con fondo blanco, vestimenta formal, mostrando hombros a partir de la clavícula,
      en formato PNG.
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - Llenar la solicitud en línea, haciendo clic en el botón “Iniciar trámite”, o bien, capturarla de manera impresa.
    - Subir documentación en línea o presentar expediente con documentación completa en la dependencia.
    - Revisión de documentación recibida.
    - Realizar el pago de derechos, en caso de ser aprobada la solicitud.
    - Asignación de folio por parte del servidor público.
    - E-firma del Secretario de Economía firma de resultado y emisión de constancia.
    - Notificación por correo electrónico al solicitante, indicando lugar, fecha y datos de contacto para la entrega
      de la constancia.
  notes: Regular las actividades de intermediación y las operaciones inmobiliarias realizadas por los Agentes Profesionales
    Inmobiliarios en el Estado de Baja California.
- name: Inscripción Persona Moral
  requirements:
  - text: Formulario en línea o formato de inscripción al Registro Estatal de Agentes Profesionales Inmobiliarios.
    cites:
    - source: retys
  - text: Acta constitutiva.
    cites:
    - source: retys
  - text: Hoja de inscripción en el Registro Público de la Propiedad y del Comercio.
    cites:
    - source: retys
  - text: Identificación oficial vigente del representante legal de la agencia; en caso de ser extranjero, documento
      migratorio vigente que acredite residencia permanente.
    cites:
    - source: retys
  - text: Constancia de situación fiscal, no mayor a 3 meses.
    cites:
    - source: retys
  - text: Comprobante de domicilio fiscal registrado ante el sat, no mayor a 3 meses.
    cites:
    - source: retys
  - text: Constancia y/o certificado de curso en operaciones inmobiliarias, que cuente con RVOE, con duración mínima
      de 40 horas y que tenga una vigencia documental de 2 años.
    cites:
    - source: retys
  - text: Constancia de antecedentes penales del representante legal, no mayor a 3 meses.
    cites:
    - source: retys
  - text: Contrato de adhesión ¨Prestación de servicios de intermediación para la compraventa inmobiliaria¨ registrado
      ante PROFECO, de acuerdo a la NOM-247-SE-2021.
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - Llenar la solicitud en línea, haciendo clic en el botón “Iniciar trámite”, o bien, capturarla de manera impresa.
    - Subir documentación en línea o presentar expediente con documentación completa en la dependencia.
    - Revisión de documentación recibida.
    - Realizar el pago de derechos, en caso de ser aprobada la solicitud.
    - Asignación de folio por parte del servidor público.
    - E-firma del Secretario de Economía firma de resultado y emisión de constancia.
    - Notificación por correo electrónico al solicitante, indicando lugar, fecha y datos de contacto para la entrega
      de la constancia.
  notes: Regular las actividades de intermediación y las operaciones inmobiliarias realizadas por los Agentes Profesionales
    Inmobiliarios en el Estado de Baja California.
