  - text: Formato de denuncia por maltrato animal
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/9678
  modes:
  - name: En línea
    steps:
    - Ingresar al enlace https://www.bajacalifornia.gob.mx/medio_ambiente/ y presentar denuncia por maltrato animal
    - Se recibe la denuncia, se analiza y se turna a vía oficio a la autoridad correspondiente
    - Se emite una resolución para atender el caso de maltrato animal
  - name: Presencial
    steps:
    - Presentar solicitud en instalaciones de la Secretaria de Medio Ambiente y Desarrollo Sustentable
    - Se analiza la denuncia y se turna a vía oficio a la autoridad correspondiente
    - Se emite una resolución para atender el caso de maltrato animal
  notes: Promover la denuncia ciudadana de cualquier acto de maltrato o crueldad injustificada que puedan afectar
    el bienestar de los animales domésticos
