    - source: retys
  - text: Cotización dirigida o emitida a nombre del Gobierno del Estado de Baja California
    cites:
    - source: retys
  - text: Copia de la constancia o cédula fiscal del prestador de servicio o proveedor.
    cites:
    - source: retys
