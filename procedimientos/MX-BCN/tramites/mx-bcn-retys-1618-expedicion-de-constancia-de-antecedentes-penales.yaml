summary: Documento donde se hace constar que el ciudadano cuenta o no, con antecedentes penales de carácter doloso
  del fuero común en el Estado de Baja California. La constancia expedida en el trámite en línea NO CUENTA FOTOGRAFÍA.
  Para mayor información comunicarse al teléfono (686) 837 3900 Ext. 15452/15451 o al correo antecedentespenales@seguridadbc.gob.mx
