scenarios:
- name: Ciudadanía en General
  requirements:
  - text: Identificación oficial vigente (credencial de elector, pasaporte mexicano, licencia de conducir del Estado
      de Baja California, cartilla del servicio militar nacional liberada, cédula profesional con foto, título profesional)
    cites:
    - source: retys
  - text: Pago de derechos
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Para trámite en línea ingresar a la página https://tramites.ebajacalifornia.gob.mx/ventanillaunica/tramites/antecedentespenales/constancia-antecedentes-penales
      o dar click en el botón "iniciar trámite" ubicado en la parte inferior derecha
    - Llenar los campos con los datos del solicitante, en caso de capturar incorrectamente el trámite será rechazado.
    - Subir fotografía del solicitante de cara completa, fondo blanco, cara descubierta, a color, sin retoque, sin
      lentes y no mayor a 6 meses, en caso contrario el trámite será rechazado.
    - Subir fotografía de la parte frontal de la identificación en fondo blanco, vigente para cotejo del trámite,
      en caso contrario el trámite será rechazado.
    - Pagar los derechos, en el caso de realizar el pago en ventanilla bancaria se verá reflejado en el sistema
      de CONSULTA DE PAGO DE DERECHOS 48 horas después de su pago
    - una vez realizado el pago la página va a proporcionar un número de folio de seguimiento, el cual deberá guardar
      el ciudadano para el seguimiento, y que este será directamente en la página http://tramites.ebajacalifornia.gob.mx/ventanillaunica/tramites/folioseguimiento,
      Seguimiento Tramite | Ventanilla BC, en la cual una vez capturado el folio, le mostrara el estatus en el que
      se encuentra su petición, podrá imprimir su recibo de pago y además de descargar su constancia una vez autorizada.
    - Los trámites realizados en fin de semana serán atendidos de lunes a viernes
  - name: Presencial
    steps:
    - Acudir a la dependencia o módulo
    - Presentar identificación oficial vigente
    - Realizar el pago correspondiente (recaudación rentas del estado, banco, internet)
    - Entrega de constancia de antecedentes penales
  notes: Requisitos para obtener la Constancia de no antecedentes penales
