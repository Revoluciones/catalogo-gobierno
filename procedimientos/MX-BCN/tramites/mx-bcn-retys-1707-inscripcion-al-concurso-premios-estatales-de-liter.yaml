    steps:
    - Llenar ficha de inscripción
    - Enviar por correo o entregar en oficinas el proyecto de literatura (4 ejemplares en original)
    - Jurado revisa, dictamina y entrega lista de ganadores a la Secretaría de Cultura
    - Se anuncian a los ganadores en redes sociales de la Secretaría
    - Realiza evento y se entregan premios de acuerdo a convocatoria
