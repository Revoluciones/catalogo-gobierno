- municipality: Tijuana
  name: CAP Oficinas Centrales
  address: 'Blvd. Federico Benítez #4057, Col. 20 de Noviembre, Tijuana, 22430'
scenarios:
- name: General
  requirements:
  - text: Original y copia del Formulario de Solicitud de Revalidación o Exención al Programa Atrapa la Grasa (FRM-015)
      debidamente llenado y firmado, lo proporciona CESPT o lo puede obtener en en la página de Internet
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11992
  - text: Hacer el pago correspondiente
    cites:
    - source: retys
  - text: Las copias deben ser LEGIBLES y contener el DOCUMENTO COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la Coordinación de Control de Calidad, ubicada en el edificio que se encuentra en la parte posterior
      izquierda de Oficinas Centrales de CESPT y presentar los requisitos.
    - La persona de la Coordinación de Control de Calidad revisa que se cumpla con todos los requisitos, si no están
      completos, informa a la persona solicitante que no es posible realizar el trámite hasta que éstos se completen,
      indicándole que es lo que falta.
    - Con los requisitos completos, la persona de la Coordinación de Control de Calidad le entrega una Ficha de
      pago.
    - Acudir al área de Cajas con la Ficha de Pago y realizar el pago de derechos correspondiente, la persona de
      Cajas le entregará un Recibo de Pago.
    - Pasar al área de Archivo, presentar el Recibo de Pago y entregar los requisitos.
    - La persona del área de Archivo certifica de recibido, el original y copia del Formulario de Solicitud de Revalidación
      o Exención de constancia de cumplimiento al Programa Atrapa la Grasa y Sólidos y entrega la copia a la persona
      solicitante.
    - 'Una persona Analista de la Coordinación de Control de Calidad acudirá a la empresa o establecimiento a realizar
      una visita de verificación, para revisar si se generan desechos de grasas y sólidos: NO GENERAN DESECHOS:
      Personal de la Coordinación de Control de Calidad elabora el Oficio de exención de Constancia de Cumplimiento
      al Programa Atrapa la Grasa y Sólidos, y contacta a la persona solicitante para que pase a recoger el documento.
      SI GENERAN DESECHOS: Personal de la Coordinación de Control de Calidad elabora oficio de Dimensionamiento
      de dispositivo(s), en el que se indicarán las adecuaciones y sistemas de pretratamiento que debe realizar
      y el plazo para realizarlas y contacta a la persona solicitante para que pase a recoger el documento.'
    - Acudir a CESPT por el Oficio de exención de Constancia de Cumplimiento al Programa Atrapa la Grasa y Sólidos
      o el oficio de Dimensionamiento de dispositivo(s), según sea el caso.
  notes: General
