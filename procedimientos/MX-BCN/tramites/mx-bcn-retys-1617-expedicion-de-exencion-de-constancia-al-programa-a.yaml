title: Expedición de Exención de Constancia al Programa Atrapa la Grasa y Sólidos
summary: Solicitar la inspección y evaluación para la exención de la constancia de cumplimiento al programa atrapa
  la grasa y sólidos, para usuarios no domésticos con procesos productivos que generen desecho de grasas y sólidos.
