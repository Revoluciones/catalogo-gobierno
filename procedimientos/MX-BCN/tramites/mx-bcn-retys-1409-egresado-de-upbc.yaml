  name: Secretaría Académica
  address: 'Av. Claridad #S/N, Plutarco Elias Calles, Mexicali, 21376'
scenarios:
- name: Obtención de Título egresados de la Universidad Politécnica de Baja California
  requirements:
  - text: Ser egresado de la UPBC y haber concluido satisfactoriamente la carrera
    cites:
    - source: retys
  - text: Presentacion de documnetacion de acuerdo "paquete Informativo" para iniciar la obtención de certificado
      y/o titulo
    cites:
    - source: retys
  - text: Generar a traves del "SIIAX", el recibo de pago de certificado y/o titulo
    cites:
    - source: retys
  - text: Efectuar el pago del recibo ya sea en linea o en ventanilla
    cites:
    - source: retys
  - text: debera imprimir formato de no adeudo para recabar sellos ante el depto. de finanzas y direccion de programa
      academico que le corresponde
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - Ingresar a la página web de la UPBC haciendo clic en el botón "iniciar trámite" ubicado en la parte inferior
      derecha
    - Una vez que ingresa seleccionar el tipo de pago a realizar si es certificado de estudio o titulación
    - Una vez que selecciona el tipo de trámite se genera el recibo de pago el cual deberá descargar
    - Una vez que descarga el recibo de pago el egresado, deberá proceder a su pago en línea bancaria o imprimir
      y acudir a ventanilla bancaria
    - egresado deberá a su vez descargar documento para recabar sello de no adeudos a la UPBC, los cuales corresponde
      al depto. de finanzas y la direccion de programa académico.
    - una vez que se realiza el pago y con formato con sellos de no adeudo, se presenta al área de gestión escolar
      para que inicie el trmite
    - gestion escolar inicia el tramite de certificado y titulo del egresado, al cual en su momento se le notificara
      para que asista a reoger.
  notes: Que el egresado pueda obtener su título o certificado de estudio
