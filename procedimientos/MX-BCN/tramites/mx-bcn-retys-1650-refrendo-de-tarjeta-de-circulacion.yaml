scenarios:
- name: Refrendo de la Tarjeta de Circulación
  requirements:
  - text: Licencia de conducir vigente del Estado de Baja California del propietario del vehículo
    cites:
    - source: retys
  - text: Número de la placa a refrendar
    cites:
    - source: retys
  - text: Póliza de seguro de responsabilidad civil
    cites:
    - source: retys
  - text: Realizar el pago
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Acceder al apartado de trámites y servicios haciendo clic en el botón "iniciar trámite" ubicado en la parte
      inferior derecha
    - Capturar número de placa
    - Generar presupuesto
    - Llenar apartado de datos adicionales
    - Una vez capturado la información, capturar el código de verificación que se enviará a su teléfono registrado
    - Capturar datos de póliza de seguro de responsabilidad civil
    - Realizar el pago ya sea en línea, pago spei o pago referenciado
    - Recibe correo de pago realizado
    - 'Se realiza validación del pago, una vez validado recibira correo electrónico con el recibo del pago del refrendo.
      Nota: si el pago de refrendo incluye años anteriores le llegará correo norificandole que deberá pasar a la
      Recaudación de Rentas, por su tarjeta de circulación.'
  notes: Requisitos para obtener el Refrendo de la Tarjeta de Circulación
