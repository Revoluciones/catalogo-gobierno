scenarios:
- name: Persona Física
  requirements:
  - text: Escrito libre, con firma autógrafa de la persona interesada o de su apoderado o representante legal, en
      el que se señale claramente el trámite solicitado, debiendo indicar los números de oficios y expedientes de
      todas y cada una de las autorizaciones que le fueron otorgadas y que desea unificar.
    cites:
    - source: retys
  - text: Copia simple de todos los oficios que contienen las autorizaciones que le fueron otorgadas y que desea
      unificar, completos y nítidos.
    cites:
    - source: retys
  - text: Formato para presentar la Manifestación de Impacto Ambiental, Modalidad General, debidamente requisitado,
      de conformidad con su Instructivo de llenado.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/13121
  - text: El Formato debe contener la firma autógrafa de la persona interesada o de su apoderado o representante
      legal y del técnico que lo elaboró.
    cites:
    - source: retys
  - text: Recibo de pago de derechos.
    cites:
    - source: retys
  - text: Dependiendo del tipo de actividad, si le aplica, deberá incorporar a su solicitud los Lineamientos, complementarios
      a la MIA, que le correspondan.
    cites:
    - source: retys
  - text: Copia simple de la identificación oficial de la persona interesada, legible y con vigencia activa.
    cites:
    - source: retys
  - text: En caso de que se actúe a través de apoderado o representante legal, presentar documental idónea, completa
      y nítida, mediante la cual se acredite como tal, vigente.
    cites:
    - source: retys
  - text: En caso de que se actúe a través de apoderado o representante legal, presentar copia simple de la identificación
      oficial de este, nítida y con vigencia activa.
    cites:
    - source: retys
  - text: Copia simple del Registro Federal de Contribuyentes de la persona interesada.
    cites:
    - source: retys
  - text: CD o USB que contenga la totalidad de la información presentada en la Manifestación de Impacto Ambiental,
      Modalidad General.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas de la Secretaría para presentar el trámite.
    - Recepción y evaluación de la solicitud.
    - Publicación de la resolución o solicitud de información adicional.
    - Recolectar el oficio y, en su caso, solventar los requerimientos de información adicional.
  notes: Persona titular de diversas autorizaciones, otorgadas para un mismo sitio, que desea se unifiquen.
