title: Reevaluación de la Manifestación de Impacto Ambiental
summary: Trámite para integrar las diversas autorizaciones otorgadas en materia de impacto ambiental que se habían
  estado acumulando, a fin de no perder los derechos adquiridos a lo largo del tiempo y simplificar el cumplimiento
  y seguimiento a las condicionantes establecidas.
