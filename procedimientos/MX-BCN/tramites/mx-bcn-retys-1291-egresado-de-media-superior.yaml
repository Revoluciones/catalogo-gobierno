  - text: Ficha de la página web de la UPBC
    cites:
    - source: retys
  - text: contar con un correo electronico personal
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Alumno egresado de media superior, deberá buscar en la página web de la UPBC, información de fechas para prefichas
      y fichas haciendo clic en el botón "iniciar trámite" ubicado en la parte inferior derecha
    - El alumno deberá conocer previamente la información relativa a los programas educativos que ofrece la UPBC,
      para seleccionar la carrera a cursar
    - Una vez que obtenga la preficha, deberá subir al sistema la información que se requiere; constancia de terminación
      de estudios de media superior, CURP, acta de nacimientos y número de afiliación de IMSS
    - Una vez que se dé la fecha para la obtención de la ficha, estará en posibilidad de realizar el examen para
      ingresar a la UPBC y realizará el examen de admisión según las indicaciones que se establecen en la ficha
      obtenida
  notes: Atender a los estudiantes egresados de media superior asi como a la población en general que solicite su
    ingreso para continuar con estudios superiores
