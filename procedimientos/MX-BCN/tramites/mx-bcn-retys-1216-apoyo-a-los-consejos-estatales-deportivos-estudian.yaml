title: Apoyo a los Consejos Estatales Deportivos Estudiantiles
summary: Apoyar a nivel estatal a los Consejos Nacionales del deporte estudiantil en el otorgamiento de asesoría,
  coordinación, recursos y materiales para la ejecución de sus programas, Consejo Nacional Para el Desarrollo del
  Deporte en la Educación Media Superior (CONADEMS). Consejo Nacional del Deporte de la Educación (CONDDE).
