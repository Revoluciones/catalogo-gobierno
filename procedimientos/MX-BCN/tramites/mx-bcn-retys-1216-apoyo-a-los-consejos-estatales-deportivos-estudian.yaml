scenarios:
- name: Representante Consejos Estatales Deportivos Estudiantiles
  requirements:
  - text: La representación del Consejo Deportivo Estudiantil (CONDEBA, CONADEMS Y CONDDE), deberá solicitar por
      escrito en hoja membretada, sellada y firmada por el titular del Consejo, debiendo ser dirigida al titular
      del Instituto del Deporte y Cultura Física de Baja California, solicitando asesoría, coordinación, recursos
      y materiales, entre otros para la ejecución de sus programas
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El solicitante de los Consejos Deportivos Estudiantiles debera de acudir a las oficinas administrativas del
      Instituto del Deporte y la Cultura Física de Baja California
    - Entregar la hoja membretada debidamente sellada y firmada por el titular del Consejo Deportivo Estudiantil
    - Solicitar la respuesta de la solicitud presentada
    - El Instituto del Deporte y la Cultura Física de Baja California proporciona la respuesta a la solicitud
  notes: Apoyar al Consejo Nacional para el desarrollo de la Educación Física y el Deporte en la Educación Básica
    (CONDEBA), al Consejo Nacional para el desarrollo del Deporte en la Educación Media Superior (CONADEMS) y el
    Consejo Nacional del Deporte de la Educación (CONDDE), en el otorgamiento de asesoría, coordinación, recursos
    y materiales para la realización de programas
