scenarios:
- name: Madres
  requirements:
  - text: Copia de identificación oficial vigente con fotografía del Instituto Nacional Electoral (INE) con domicilio
      en Baja California.
    cites:
    - source: retys
  - text: Copia de la Clave Única de Registro de Población (CURP).
    cites:
    - source: retys
  - text: Copia de comprobante de domicilio no mayor a 3 meses.
    cites:
    - source: retys
  - text: Copia de acta de nacimiento de los dependientes económicos menores de 21 años.
    cites:
    - source: retys
  - text: Copia de comprobante de ingreso menor a $15,000.00 mensuales (en caso de tener como comprobar ingresos).
    cites:
    - source: retys
  - text: Copia de comprobante de estudios de los dependientes económicos menores a 21 años.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a los espacios asignados para el registro con la documentación solicitada.
    - Realizar entrevista y llenado de formato único junto con personal de la Secretaría del Bienestar
    - Evaluación de la solicitud por parte del personal.
    - Notificación por teléfono a las solicitantes que se les brindará el apoyo para que acudan a recoger su tarjeta.
  notes: Requisitos para madres que quieran solicitar la Tarjeta Violeta
- name: Tutoras de menores
  requirements:
  - text: Copia de identificación oficial vigente con fotografía del Instituto Nacional Electoral (INE) con domicilio
      en Baja California.
    cites:
    - source: retys
  - text: Copia de la Clave Única de Registro de Población (CURP).
    cites:
    - source: retys
  - text: Copia de comprobante de domicilio no mayor a 3 meses.
    cites:
    - source: retys
  - text: Copia de acta de nacimiento de los dependientes económicos menores de 21 años.
    cites:
    - source: retys
  - text: Copia de comprobante de ingreso menor a $15,000.00 mensuales (en caso de tener como comprobar ingresos).
    cites:
    - source: retys
  - text: Copia de comprobante de estudios de los dependientes económicos menores a 21 años.
    cites:
    - source: retys
  - text: Copia de constancia expedida por autoridad competente como la Procuraduría de la Defensa del Menor del
      DIF, Juez de lo Familiar, Fiscalía para la Atención de Menores, en caso de que la responsable de los menores
      y/o jóvenes, no ostente el parentesco consanguíneo (abuela, hermana, tía).
    cites:
    - source: retys
  - text: Copia de constancia del Centro de Adicciones en caso de estar bajo tratamiento para la rehabilitación
      por adicciones, que contenga firma del encargado y sello de la institución correspondiente.
    cites:
    - source: retys
