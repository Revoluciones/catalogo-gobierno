offices:
- municipality: Tijuana
  name: CAP Oficinas Centrales
  address: 'Blvd. Federico Benítez #4057, Col. 20 de Noviembre, Tijuana, 22430'
- municipality: Playas de Rosarito
  name: CAP Rosarito Floresta del Mar
  address: 'Blvd. Benito Juárez #385, Fracc. Hacienda Floresta del Mar, Playas de Rosarito, 22703'
scenarios:
- name: Titular
  requirements:
  - text: Original y copia del Formulario para Trámites en Archivo, (lo proporciona CESPT o lo puede obtener en
      la página de Internet FRM-005), debidamente llenado y firmado por el titular de la cuenta
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11457
  - text: 'Documento de identificación oficial con fotografía VIGENTE del propietario, puede ser UNO de los siguientes:
      Copia de Credencial del INE, Copia de Pasaporte mexicano, Copia de Licencia de conducir, Copia de Matrícula
      consular'
    cites:
    - source: retys
  - text: 'Documentos para comprobar la propiedad: - Constancia de Inscripción en el Registro Público de la Propiedad.
      - Escrituras o título de propiedad. - Carta de Residencia si eres posesionario. - Recibo de impuesto predial
      reciente.'
    cites:
    - source: retys
  - text: 'Documento para comprobar propiedad, que puede ser UNO de los siguientes: Copia de Constancia de Inscripción
      del Registro Público de la Propiedad y de Comercio del predio en estudio, con fecha de registro no mayor a
      seis meses de antigüedad: Copia de Escrituras notariadas o título de propiedad del predio en estudio, inscritas
      en el Registro Público de la Propiedad y de Comercio, con fecha de expedición no mayor a seis meses de antigüedad;
      Copia de Carta de Residencia vigente expedida por el Ayuntamiento, si se trata de posesionarios; Copia de
      Recibo de impuesto predial vigente (con fecha de emisión no mayor a un año de antigüedad).'
    cites:
    - source: retys
  - text: Las copias deben ser legibles y contener el documento completo.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público (CAP) de Oficinas Centrales o al CAP Rosarito Floresta del Mar
    - Pasar al área de Archivo
    - Entregar documentación requerida en la ventanilla de Archivo
    - La persona de Archivo revisará que los requisitos estén completos, de no ser así, informa al ciudadano que
      no es posible realizar el trámite hasta que éstos se completen
    - Con los requisitos completos, la persona de Archivo imprime certificación de recibido en el formato (FRM-005)
      en la que se indica el plazo de atención
    - Transcurrido el plazo de atención, el solicitante deberá acudir nuevamente al área de Archivo General por
      la el documento de respuesta
  notes: Titular
- name: Representante legal
  requirements:
  - text: Original y copia del Formulario para Trámites en Archivo, (lo proporciona CESPT o lo puede obtener en
      la página de Internet FRM-005), debidamente llenado y firmado por el titular de la cuenta o por la persona
      a quien éste le haya otorgado el poder para realizar el trámite o por el fiduciario.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12574
  - text: 'Documento que acredite la personalidad del solicitante que puede ser uno de los siguientes documentos:
      o Copia de Carta poder notariada para actos de administración y de dominio otorgada por el propietario del
      predio, en caso de que sea otra persona quien gestione el servicio. o Copia de la constitución del Fideicomiso
      en la que se especifique que la persona que gestiona es el fiduciario, si es el caso.'
    cites:
    - source: retys
  - text: 'Documento de identificación oficial con fotografía VIGENTE, del propietario y del representante legal
      a quien se haya otorgado poder para actos de administración y dominio, en caso de que sea éste quien gestiona
      el servicio; o del fiduciario si se trata de un fideicomiso, que puede ser UNO de los siguientes: Copia de
      Credencial del INE, Copia de Pasaporte mexicano, Copia de Licencia de conducir, Copia de Matrícula consular,'
    cites:
    - source: retys
  - text: 'Documento para comprobar propiedad, que puede ser UNO de los siguientes: Copia de Constancia de Inscripción
      del Registro Público de la Propiedad y de Comercio del predio en estudio, con fecha de registro no mayor a
      seis meses de antigüedad: Copia de Escrituras notariadas o título de propiedad del predio en estudio, inscritas
      en el Registro Público de la Propiedad y de Comercio, con fecha de expedición no mayor a seis meses de antigüedad;
      Copia de Carta de Residencia vigente expedida por el Ayuntamiento, si se trata de posesionarios; Copia de
      Recibo de impuesto predial vigente (con fecha de emisión no mayor a un año de antigüedad).'
    cites:
    - source: retys
  - text: Las copias deben ser legibles y contener el documento completo.
    cites:
    - source: retys
