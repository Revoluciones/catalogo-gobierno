title: Constancia de No Adeudo para Desarrolladores
summary: Expedición del documento mediante el cual, desarrolladores de complejos habitacionales se amparan de haber
  cubierto los adeudos relacionados al predio en el cual se pretende realizar un desarrollo habitacional.
authority:
  name: Comisión Estatal de Servicios Públicos de Tijuana
