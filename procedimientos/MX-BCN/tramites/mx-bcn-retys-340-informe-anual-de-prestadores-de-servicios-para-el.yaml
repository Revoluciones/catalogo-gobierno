scenarios:
- name: Persona Física
  requirements:
  - text: Formato de solicitud debidamente requisitado, o escrito libre que proporcione la misma información requerida
      en el formato, que contenga la firma autógrafa de la persona interesada o de la persona apoderada o representante
      legal.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/13926
  - text: Pago de derechos correspondiente.
    cites:
    - source: retys
  - text: Copia simple de la identificación oficial de la persona interesada, legible y con vigencia activa.
    cites:
    - source: retys
  - text: Los documentos e información que le fueron establecidos en su Licencia de Prestador de Servicios, en los
      términos que le fueron solicitados.
    cites:
    - source: retys
  - text: En caso de que se actúe a través de persona apoderada o representante legal, y su personalidad no esté
      reconocida en el expediente en el que se actúa o el mandato hubiera fenecido, presentar copia simple de la
      documental idónea vigente, completa y nítida, mediante la cual se acredite como tal.
    cites:
    - source: retys
  - text: En caso de que se actúe a través de persona apoderada o representante legal, presentar copia simple de
      la identificación oficial de esta, nítida y con vigencia activa.
    cites:
    - source: retys
  - text: 'Entregar USB que contenga la totalidad de la información presentada en el informe. Las bases de datos
      deben ser presentadas en formato electrónico editable: Word o Excel.'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas de la Secretaría para presentar el trámite.
    - Recepción y evaluación de la solicitud.
    - Publicación de del Acuerdo Administrativo de titularidad o de requerimiento de información.
    - Recolectar el oficio.
  notes: Persona autorizada como Prestador de Servicios para el Manejo Integral de Residuos de Manejo Especial,
    con registro vigente.
- name: Persona Moral
  requirements:
  - text: Pago de derechos correspondiente.
    cites:
    - source: retys
  - text: Los documentos e información que le fueron establecidos en su Licencia de Prestador de Servicios, en los
      términos que le fueron solicitados.
    cites:
    - source: retys
  - text: Copia simple de la documental idónea vigente, completa y nítida, mediante la cual se acredite a la persona
      como apoderada o representante legal como tal, cuando no esté reconocida en expediente, o cuando su poder
      ya haya fenecido.
    cites:
    - source: retys
  - text: Copia simple de la identificación oficial de la persona apoderada o representante legal, legible y con
      vigencia activa.
    cites:
    - source: retys
  - text: 'Entregar USB que contenga la totalidad de la información presentada en el informe. Las bases de datos
      deben ser presentadas en formato electrónico editable: Word o Excel.'
    cites:
    - source: retys
  - text: Formato de solicitud debidamente requisitado, o escrito libre que proporcione la misma información requerida
      en el formato, que contenga la firma autógrafa de la persona apoderada o representante legal.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/13927
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas de la Secretaría para presentar el trámite.
    - Recepción y evaluación de la solicitud.
    - Publicación de del Acuerdo Administrativo de titularidad o de requerimiento de información.
    - Recolectar el oficio.
  notes: Sociedad civil o mercantil, organismo gubernamental, ejido y todo ente creado por el derecho, autorizada
    como Prestador de Servicios para el Manejo Integral de Residuos de Manejo Especial, con registro vigente.
