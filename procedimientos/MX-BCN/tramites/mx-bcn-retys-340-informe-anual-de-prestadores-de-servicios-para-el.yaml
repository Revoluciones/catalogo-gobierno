title: Informe Anual de Prestadores de Servicios para el Manejo Integral de Residuos de Manejo Especial
summary: Reporte de los volúmenes y tipos de residuos, el manejo que se les dio y demás elementos establecidos en
  las condicionantes de la Licencia de Prestador de Servicios, respecto a las actividades realizadas durante un
  año.
