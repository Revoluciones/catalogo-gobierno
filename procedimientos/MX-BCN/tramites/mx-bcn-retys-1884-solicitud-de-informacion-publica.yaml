scenarios:
- name: Entrega Total de Información
  requirements:
  - text: Solicitud de acceso a la Información
    cites:
    - source: retys
  modes:
  - name: En línea
    steps: []
  notes: El ciudadano pide información que es pública, la Unidad de Transparencia la localiza en los archivos de
    la institución y se le entrega completa dentro de los 10 días hábiles
- name: Prevención (Aclaración)
  requirements:
  - text: Solicitud de acceso a la Información
    cites:
    - source: retys
  modes: []
  notes: Ocurre cuando la solicitud es confusa, no se entiende qué archivo está pidiendo, o los datos son insuficientes
    para buscar el documento, por lo que se le notifican 5 días hábiles al ciudadano para que aclare su pregunta..
- name: Prórroga (Ampliación de Plazo)
  requirements: []
  modes: []
  notes: Se presenta cuando la información sí existe y es pública, pero el volumen de documentos es gigantesco o
    recopilarla requiere un esfuerzo extraordinario que satura al área encargada. El Comité de Transparencia aprueba
    extender el plazo hasta por 10 días hábiles más. Se le debe avisar formalmente al ciudadano antes de que venza
    el plazo original.
- name: Incompetencia
  requirements: []
  modes: []
  notes: La Unidad de Transparencia tiene 5 días hábiles para responderle al ciudadano que esa institución no es
    la encargada de esos datos y, de ser posible, orientarlo señalando qué autoridad sí los tiene.
- name: Inexistencia o Información Reservada/Confidencial
  requirements: []
  modes: []
  notes: 'Inexistencia: Tras buscar exhaustivamente en todas las áreas, el documento no se encuentra porque nunca
    se generó o no hay obligación legal de tenerlo. Reservada o Confidencialidad La información existe pero no se
    puede entregar porque contiene datos personales de terceros (confidencial) o pone en riesgo la seguridad, auditorías
    en curso o estrategias legales (reservada).Se le entrega al ciudadano una respuesta negativa justificada con
    el acta del Comité, o bien, una versión pública'
