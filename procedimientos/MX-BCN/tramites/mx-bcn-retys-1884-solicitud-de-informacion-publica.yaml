title: Solicitud de información pública
summary: 'Te permite solicitar, consultar y recibir información pública de esta institución. Puedes preguntar sobre
  el uso de los recursos del presupuesto y las actas de nuestras reuniones. Ejercer tu derecho a saber es muy sencillo:
  no es necesario que justifiques los motivos de tu solicitud ni el uso que le darás a los datos.'
