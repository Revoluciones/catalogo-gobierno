title: Programa Estatal de Apoyo para PESCA DEPORTIVA
summary: Trámite para la Recepción de Solicitudes para aplicar a los beneficios del Programa Estatal de Apoyo para
  el Sector de Pesca y Acuacultura, enfocado en la PESCA DEPORTIVA a través del apoyo subsidiario a la inversión
  en bienes de capital estratégico para equipamiento, mantenimiento y particularmente para eficientizar la operación
  con énfasis en el incremento o mejora de servicios.
