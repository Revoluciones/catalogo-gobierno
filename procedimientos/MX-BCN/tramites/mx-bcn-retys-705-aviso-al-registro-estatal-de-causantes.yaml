scenarios:
- name: Persona física
  requirements:
  - text: Llenar el formato de aviso al registro estatal de causantes RE-01 por duplicado, llenando solo los recuadros
      que correspondan al alta.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/10446
  - text: Presentar constancia de situación fiscal expedida por el SAT.
    cites:
    - source: retys
  - text: Presentar en original y copia identificacion oficial, como puede ser INE vigente, pasaporte mexicano vigente,
      cédula profesional o licencia de conducir vigente)
    cites:
    - source: retys
  - text: Croquis del domicilio fiscal.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/10450
  modes:
  - name: Presencial
    steps:
    - El contribuyente debe acudir a las oficinas de Recaudación de Rentas y dirigirse al área de cajas o ventanilla
      única.
    - El asesor de recaudación de rentas atenderá al contribuyente o interesado para realizar cualquier movimiento
      o actualización en el Registro Estatal de Causantes.
    - El asesor solicitará al contribuyente los documentos para iniciar el trámite solicitado, que será procesado
      mediante el sistema ventanilla única, donde realizará la actualización solicitada.
    - Una vez procesado el trámite, el asesor sellará y firmará el formato estatal para validar el trámite realizado,
      y entregará al contribuyente o interesado la hoja original del formato adjuntando en copia los documentos
      solicitados para el trámite.
    - Terminado lo anterior el contribuyente se retira de la Recaudación de Rentas.
  notes: Recibir de las personas físicas que cuenten con establecimientos comerciales, industriales, de servicios
    e inclusive los de arrendamiento y los de actividades agropecuarias, los avisos al registro estatal de causantes
    a efecto de incorporarlos al padrón estatal de contribuyentes.
- name: Persona Moral
  requirements:
  - text: Llenar el formato de aviso al registro estatal de causantes RE-01 por duplicado, llenando solo los recuadros
      que correspondan al alta.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/10451
  - text: Constancia de situación fiscal expedida por el SAT.
    cites:
    - source: retys
  - text: Presentar en original y copia del acta constitutiva, y/o acta de asamblea y/o poder notarial donde acredite
      el carácter de representante legal y/o apoderado legal.
    cites:
    - source: retys
  - text: Presentar comprobante de domicilio fiscal a nombre de la empresa.
    cites:
    - source: retys
  - text: Presentar en original y copia identificacion oficial, como puede ser INE vigente, pasaporte mexicano vigente,
      cédula profesional o licencia de conducir vigente)
    cites:
    - source: retys
  - text: Presentar croquis del domicilio fiscal.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/10456
  modes:
  - name: Presencial
    steps:
    - El contribuyente debe acudir a las oficinas de Recaudación de Rentas y dirigirse al área de cajas o ventanilla
      única.
    - Un asesor de recaudación de rentas atenderá al contribuyente o interesado para realizar cualquier movimiento
