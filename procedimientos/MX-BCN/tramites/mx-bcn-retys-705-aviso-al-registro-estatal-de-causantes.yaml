summary: Mantener el padrón de contribuyentes congruente y actualizado (altas, bajas, cambios) con la población
  que tenga como actividad preponderante la venta de bienes y/o prestación de servicios acorde con los diferentes
  movimientos que deban realizar ante la Recaudación de Rentas del Estado de Baja California.
