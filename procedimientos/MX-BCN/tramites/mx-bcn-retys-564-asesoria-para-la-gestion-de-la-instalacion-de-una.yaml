title: Asesoría para la Gestión de la Instalación de una Nueva Biblioteca
summary: Que la ciudadanía, ayuntamientos o instituciones gubernamentales reciban asesoría relacionada a los requerimientos
  y trámites necesarios para la instalación y/o incorporación de una nueva biblioteca a la red nacional de bibliotecas
  públicas, así como la dotación de acervo y mobiliarios para la misma, por parte de la Dirección General de Bibliotecas
  de la Secretaría de Cultura del Gobierno de México.
