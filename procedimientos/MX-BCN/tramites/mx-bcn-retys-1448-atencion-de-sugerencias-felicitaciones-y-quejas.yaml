scenarios:
- name: Queja, sugerencia o felicitación
  requirements:
  - text: Llenar el formato de quejas, sugerencias y felicitaciones
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a los módulos de atención del sistema unificado de gestión (SUG) en las unidades de salud
    - Solicitar y llenar el formato de quejas, sugerencias y felicitaciones (FUSA-Formato Único de Solicitud de
      Atención)
    - Depositar la hoja en el buzón y esperar a que la unidad de calidad se comunique vía telefónica con el usuario
      (a) para informar la solución al comentario que presentó
    - El gestor de calidad registra, clasifica y prioriza la severidad y urgencia de la solicitud. Gestiona, investiga,
      resuelve y notifica al usuario la resolución de cada solicitud.
  notes: Papeleta para escribir queja, sugerencia o felicitación/ formato FUSA (Formato Unificado de Solicitud de
    Atención)
