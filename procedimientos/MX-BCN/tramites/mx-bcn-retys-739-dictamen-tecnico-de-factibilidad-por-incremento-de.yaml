scenarios:
- name: Empresas concesionarias de transporte público
  requirements:
  - text: Escrito libre que contenga los motivos que generan la solicitud de incremento de parque vehicular, correo
      electrónico, número de celular del solicitante y el medio por el que estará disponible para recibir notificaciones
    cites:
    - source: retys
  - text: Copia del Título de concesión y adendas en caso de haberlas.
    cites:
    - source: retys
  - text: Acta constitutiva de la persona moral
    cites:
    - source: retys
  - text: Instrumento notarial de dónde se desprendan las facultades del representante legal
    cites:
    - source: retys
  - text: Copia de la identificación oficial del representante legal
    cites:
    - source: retys
  - text: Constancia de situación fiscal del SAT, con vigencia del año fiscal en curso
    cites:
    - source: retys
  - text: Opinión de cumplimiento de obligaciones fiscales, en sentido positivo, del año fiscal en curso
    cites:
    - source: retys
  - text: Acreditar mediante título, factura, pedimento, poliza de seguro u otro documento que avale la pertenencia
      de cada una de las unidades destinadas para la prestacion del servicio público
    cites:
    - source: retys
  - text: Archivo en formato KML, conteniendo información relativa a la (s) ruta (s)e itinerario (s) del recorrido
      pactado entre la empresa y el prestador del servicio (Aplica para la modalidad de transporte de personal)
    cites:
    - source: retys
  - text: Copia de los Contratos/convenios celebrados relacionados con la prestación de servicio público (transporte
      de personal)
    cites:
    - source: retys
  - text: Croquis de la localización impreso y digital, en el cual contenga eo domicilio del parque de encierro
      y vialidades colindantes.
    cites:
    - source: retys
  - text: Padron de operadores debidamente registrados, impreso firmado por el representante legal y el formato
      en archivo digital.
    cites:
    - source: retys
  - text: Original y copia del comprobante de pago de derechos por el trámite solicitado
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas del Instituto de Movilidad Sustentable y presentar la documentación requerida
  notes: Requisitos para solicitud de dictamen técnico de factibilidad por incremento de parque vehicular
