      de los siguientes: Acta constitutiva de la empresa que incluya otorgamiento de poder con facultad para realizar
      el trámite;'
    cites:
    - source: retys
  - text: 'Si es persona moral, identificación oficial con fotografía vigente del representante legal, puede ser
      UNO de los siguientes documentos: Credencial del INE; Pasaporte mexicano; Licencia de conducir; Matrícula
      consular.'
    cites:
    - source: retys
  - text: 'Documentos para acreditar la propiedad o titularidad del predio, puede ser UNA de las siguientes OPCIONES:'
    cites:
    - source: retys
  - text: 'OPCIÓN 1: Escritura Pública de compraventa, de donación, de permuta, de sucesión, de dación en pago,
      etc. y Constancia de su inscripción en el Registro Público de la Propiedad y Comercio, vigente, y Recibo de
      predial cuyo nombre y domicilio coincidan con los documentos anteriores.'
    cites:
    - source: retys
  - text: 'OPCIÓN 2: Título de propiedad, y Constancia de su inscripción en el Registro Público de la Propiedad
      y Comercio, vigente, y Recibo de impuesto predial cuyo nombre y domicilio coincidan con los documentos anteriores.'
    cites:
    - source: retys
  - text: 'OPCIÓN 3: Sentencia firme emitida por autoridad jurisdiccional en la cual se le otorgue la propiedad
      del inmueble por prescripción, por adjudicación, por remate, etc. y Constancia de su inscripción en el Registro
      Público de la Propiedad y Comercio, vigente y Recibo de impuesto predial cuyo nombre y domicilio coincidan
      con los documentos anteriores.'
    cites:
    - source: retys
  - text: 'OPCIÓN 4: Contrato Privado ratificado ante el Registro Público de la Propiedad y Comercio, y Constancia
      de su inscripción en el Registro Público de la Propiedad y Comercio, vigente, y Recibo de impuesto predial
      cuyo nombre y domicilio coincidan con los documentos anteriores.'
    cites:
    - source: retys
  - text: 'OPCIÓN 5: Contrato Privado de compraventa o de cesión de derechos o de donación o de dación en pago,
      etc., y Copias legibles de las identificaciones oficiales de las partes que intervinieron en el contrato y
      Recibo de pago de servicios, de energía eléctrica o de gas por tubería o de teléfono fijo, etc., con fecha
      de emisión no mayor a un año de antigüedad y cuyo domicilio coincida con el señalado en el contrato; Recibo
      del impuesto predial cuyo nombre y domicilio coincidan con los que indica en el contrato.'
    cites:
    - source: retys
  - text: 'OPCIÓN 6: Copia de Información Ad Perpetuam inscrita en el Registro Público de la Propiedad'
    cites:
    - source: retys
  - text: 'OPCIÓN 7: Tratándose de posesión de predios ejidales, uno de los siguientes documentos; Certificado Parcelario
      y/o de Derechos Comunes; Sentencia del Tribunal Agrario; Constancia de Posesión o Acta de Asamblea Ejidal;
      Cesión Legal de Derechos.'
    cites:
    - source: retys
  - text: Todos los documentos se deben entregar en copia, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO COMPLETO.
    cites:
    - source: retys
  - text: La cuenta deberá estar al corriente (no presentar saldos vencidos)
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a cualquier Centro de Atención al Público (CAP) de CESPT.
    - Pasar al Módulo de Atención Personalizada (MAP) y esperar su turno.
    - Al llegar su turno, la persona del MAP revisa que los requisitos estén completos, en caso de no ser así, informa
      al ciudadano que no es posible realizar el trámite hasta que se completen.
    - La persona del MAP realiza las modificaciones correspondientes.
  notes: Modificación del nombre del propietario
