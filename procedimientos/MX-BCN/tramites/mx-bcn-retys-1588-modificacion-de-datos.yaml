scenarios:
- name: Domicilio registrado
  requirements:
  - text: 'Si es Persona Física, documento que confiera poder y facultades para realizar el trámite, otorgado por
      el titular de la cuenta, si la persona que realiza el trámite no es el titular, puede ser UNO de los siguientes:
      Poder Notarial; Carta poder ante Notario Público, Corredor Público o Fedatario público; Carta Poder simple
      firmada por el titular de la cuenta y por dos testigos, que incluya copia de las identificaciones oficiales
      de los testigos, cuya antigüedad no exceda los seis meses.'
    cites:
    - source: retys
  - text: 'Si es persona física, identificación oficial con fotografía, VIGENTE, del propietario del predio, y de
      la persona a quien se le haya otorgado el poder para realizar el trámite, si es el caso, puede ser UNO de
      los siguientes documentos: Credencial del INE; Pasaporte mexicano; Licencia de conducir; Matrícula consular.'
    cites:
    - source: retys
  - text: 'Si es persona moral, documento que confiera poder y facultades para realizar el trámite, puede ser UNO
      de los siguientes: Acta constitutiva de la empresa que incluya otorgamiento de poder con facultad para realizar
      el trámite; Poder ante Notario Público o ante Corredor Público, que detalle las facultades de quien la represente
      para realizar el trámite, en caso de que el acta constitutiva de la empresa no lo establezca.'
    cites:
    - source: retys
  - text: 'Si es persona moral, identificación oficial con fotografía vigente del representante legal, puede ser
      UNO de los siguientes documentos: Credencial del INE; Pasaporte mexicano; Licencia de conducir; Matrícula
      consular.'
    cites:
    - source: retys
  - text: 'Presentar UNO de los siguientes documentos: Constancia del número oficial emitida por el Ayuntamiento
      correspondiente, que contenga la información que se desea modificar o registrar; Recibo del impuesto predial,
      con vigencia no mayor a un año de antigüedad y que contenga la información que se desea modificar o registrar.'
    cites:
    - source: retys
  - text: Todos los documentos se deben entregar en copia, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO COMPLETO.
    cites:
    - source: retys
  - text: La cuenta deberá estar al corriente (no presentar saldos vencidos)
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a cualquier Centro de Atención al Público (CAP) de CESPT.
    - Pasar al Módulo de Atención Personalizada (MAP) y esperar su turno.
    - La persona del MAP revisa que los requisitos estén completos, en caso de no ser así, informa al ciudadano
      que no es posible realizar el trámite hasta que se completen.
    - Pasar a cajas a realizar el pago correspondiente y regresar al MAP.
    - La persona del MAP realiza las modificaciones correspondientes e indica a la persona solicitante que estas
      se reflejarán en su próximo recibo.
  notes: Modificación de domicilio registrado
