summary: '- Proporcionar asesoría gratuita a los trabajadores respecto de sus derechos laborales, así como a los
  familiares de los trabajadores fallecidos - Auxiliar a los centros de conciliación, en otorgar información y orientación
  a los trabajadores que acudan a dichas instancias - A solicitud del trabajador, acompañarlo a las audiencias de
  conciliación'
