scenarios:
- name: Persona interesada
  requirements:
  - text: Carta de presentación de la institución
    cites:
    - source: retys
  - text: Reporte mensual
    cites:
    - source: retys
  - text: Convenio de prestación de servicio con estímulo
    cites:
