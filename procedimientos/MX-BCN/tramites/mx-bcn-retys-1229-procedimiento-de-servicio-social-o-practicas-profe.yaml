title: Procedimiento de Servicio Social o Prácticas Profesionales
summary: Canalizar a estudiantes interesados en prestar su servicio social y/o prácticas profesionales en los programas
  de las dependencias de la administración pública centralizada, a fin de garantizar la realización de actividades
  acorde a su formación académica
