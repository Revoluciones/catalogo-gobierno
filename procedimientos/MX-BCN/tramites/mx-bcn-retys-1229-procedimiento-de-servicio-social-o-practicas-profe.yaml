  - text: Informe final
    cites:
    - source: retys
  - text: Carta de liberación
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - La persona interesada acude al área de reclutamiento y selección y llena solicitud para ingresar a realizar
      su servicio social o prácticas profesionales
    - Acude a entrevista con el supervisor y en caso de ser aceptada se asigna al programa de servicio social
    - La persona interesada entrega la carta de presentación que expide la institución educativa
    - Se elabora convenio de colaboración con o sin estímulo económico entre la persona estudiante y el Gobierno
      del Estado y carta de aceptación
    - Mensualmente la persona prestadora de servicio social y/o prácticas profesionales, presentará un informe mensual
      de actividades a su supervisor
    - Una vez concluidas las horas de servicio y/o prácticas, elabora su informe final de actividades
    - Recibe su documento de liberación de servicio social y/o prácticas profesionales
  notes: Persona interesada
