scenarios:
- name: Permisionarios con autorización para la explotación del servicio de carga especializada
  requirements:
  - text: Formato de solicitud (original y copia) debidamente llenada y firmada.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14739
  - text: Copia del recibo de pago de derechos.
    cites:
    - source: retys
  - text: Acta constitutiva de la persona moral y poder notarial o nombramiento debidamente formalizado de los representantes
    cites:
    - source: retys
  - text: Identificación oficial vigente (persona física o representante legal según sea el caso)
    cites:
    - source: retys
  - text: Opinión de cumplimiento de obligaciones fiscales, en sentido Positivo
    cites:
    - source: retys
  - text: Permiso para la operación y explotación del servicio de carga especializada para materiales, residuos,
      remanentes y desechos peligrosos
    cites:
    - source: retys
  - text: 'Padron de unidades en archivo Excel que describa lo siguiente: número de serie, marca, modelo, tipo,
      placas, capacidad.'
    cites:
    - source: retys
  - text: Copia de tarjeta de circulación vigente de cada una de las unidades.
    cites:
    - source: retys
  - text: Copia de licencia de conducir tipo ¨D¨ y/o ¨E¨ de cada uno de los choferes asignados a las unidades.
    cites:
    - source: retys
  - text: Copia del dictamen de verificación de condiciones físico-mecánicas de la unidad, expedido por la Secretaría
      de comunicaciones.
    cites:
    - source: retys
  - text: Original para cotejo y copia de Póliza de seguro que ampare la responsabilidad civil y ecológica de cada
      una de las unidades.
    cites:
    - source: retys
  - text: Rutas en formato ¨kmz¨ y/o ¨Kml¨(se debería enviar el formato digital al correo electrónico movilidad@imos.gob.mx)
    cites:
    - source: retys
  - text: Original y copia de comprobante de pago de derechos
    cites:
    - source: retys
