title: Anuencia para el traslado de sustancias peligrosas
summary: Consiste en la expedición de anuencia para trasladar, dentro de los límites del estado, vehículos con residuos
  peligrosos, sustancias tóxicas, gasolina y/o explosivos, siempre que se cuente con autorización para el manejo
  de estos.
