title: COFEPRIS-07-003-A Solicitud de Certificado de Condición Sanitaria de Agua para Uso y Consumo Humano, Incluida
  la Certificación de la Calidad Sanitaria del Pozo de Agua para Consumo Humano o Para Uso
summary: Cuando el ciudadano destine el agua del pozo para uso y consumo humano, se deberá solicitar el certificado
  de condición sanitaria del pozo y el certificado de la calidad del agua para uso y consumo humano y cuando se
  destine el agua del pozo para uso industrial (para los procesos industriales u otros servicios sin que se destine
  para uso o consumo humano), se deberá solicitar el certificado de condición sanitaria del pozo.
