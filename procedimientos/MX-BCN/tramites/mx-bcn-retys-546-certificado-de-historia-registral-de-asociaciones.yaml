title: Certificado de Historia Registral de Asociaciones y Sociedades Civiles
summary: Documento mediante el cual se da publicidad respecto de los movimientos a actos que haya realizado alguna
  Asociación o Sociedad Civil (Constitución, fusión de sociedad, asambleas ordinarias y/o extraordinarias, disolución
  y liquidación, otorgamiento o revocación de poderes, adquisición de bienes inmuebles, daciones en pago, etcétera).
