scenarios:
- name: Representante legal
  requirements:
  - text: Presentar solicitud escrita y/o electrónica informando nombre, domicilio, RFC, giro o actividad de la
      empresa (copia de poder notarial, acreditando lo solicito como propietario y/o representante legal), y justificación
      que sustente la solicitud
    cites:
    - source: retys
  - text: Nombre de la persona o representante legal a quien saldrá la prorroga
    cites:
    - source: retys
  - text: No. de cuenta de agua potable.
    cites:
    - source: retys
  - text: Documentos originales que pretende modificar
    cites:
    - source: retys
  - text: Cantidad de producción diaria o mensual (anotar si es por temporadas)
    cites:
    - source: retys
  - text: Pago del servicio. La modificación.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El usuario por si propio o por un responsable técnico, debe recabar los datos para sustentar la solicitud
      de la prorroga
    - Realizar el pago y presentar copia a la hora de presentar la solicitud de la prorroga
    - Presentar la solicitud en onca agregando el sustento técnico suficiente para la prórroga
    - ONCA recibirá y revisara el documento en caso de ser necesario solicitará información adicional y/o en su
      caso programará una visita confirmativa de datos
    - Una vez que onca evalué la información y en su caso verifique los datos técnicos emitirá su dictamen y/o la
      prórroga
    - Se le comunicará al usuario para que pase por su modificación
  notes: Carta poder notariada
