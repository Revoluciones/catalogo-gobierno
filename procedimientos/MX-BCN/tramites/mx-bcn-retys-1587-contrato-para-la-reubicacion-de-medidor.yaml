scenarios:
- name: Propietario
  requirements:
  - text: Preparación lista según el Instructivo de Instalación de medidor adicional (INS-001) o el Instructivo
      para instalación de tres o más medidores (INS-002), disponible en la sección Documentos Informativos.
    cites:
    - source: retys
  - text: Inspección de factibilidad positiva emitida por CESPT, la puede tramitar llamando al teléfono 073.
    cites:
    - source: retys
  - text: La cuenta no debe presentar adeudos
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio, UNO de los siguientes: Credencial
      del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Hacer el pago correspondiente
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en original y copia, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a cualquier Centro de Atención al Público (CAP) de CESPT
    - Pasar al Módulo de Información e indicar a la persona del módulo que desea realizar una reubicación de medidor
    - Si no lo obtuvo de Internet, solicitar a la persona del Módulo de Información las especificaciones de las
      preparaciones que debe hacer el usuario para la reubicación del medidor, antes de pagar el trámite (INS-001
      o INS-002)
    - Contratar a un plomero para que realice las preparaciones necesarias para que sea posible realizar la reubicación
    - Una vez realizadas las preparaciones llamar al 073 para solicitar una Inspección de Factibilidad de Servicios
    - Ya que cuente con la inspección de factibilidad POSITIVA, acudir a cualquier Centro de Atención al Público
      de CESPT con los requisitos, tomar un número y esperar a ser atendido por personal de Módulo de Atención Personalizada
      (MAP)
    - Cuando llegue su turno, la persona del MAP revisará que los requisitos estén completos, en caso de no ser
      así, le informará que no es posible realizar el trámite hasta que éstos se completen, indicándole lo que falta
    - Con los requisitos completos, la persona del MAP elaborará el Presupuesto de Obra que corresponda al servicio
      solicitado
    - El usuario debe firmar de conformidad los documentos que le entrega la persona del MAP
    - 'Una vez firmados los documentos deberá pasar a cajas a realizar el pago correspondiente, en donde le entregarán
      dos documentos: 1) Comprobante de pago y 2) Convenio de liquidación de obra'
  notes: Propietario
- name: Representante
  requirements:
  - text: Preparación lista según el Instructivo de Instalación de medidor adicional (INS-001) o el Instructivo
      para instalación de tres o más medidores (INS-002), disponible en la sección Documentos Informativos.
    cites:
    - source: retys
  - text: Inspección de factibilidad positiva emitida por CESPT, la puede tramitar llamando al teléfono 073.
    cites:
    - source: retys
  - text: La cuenta no debe presentar adeudos
    cites:
    - source: retys
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el propietario del predio,
      puede ser UNO de los siguientes: Poder Notarial; Carta Poder ante notario público, corredor público o fedatario
      público; Carta Poder simple firmada por el propietario del predio y por dos testigos, que incluya copia de
      las identificaciones oficiales de los testigos, cuya antigüedad no exceda los seis meses, si la persona que
      gestiona no es el propietario'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial del INE,
      Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Hacer el pago correspondiente
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en original y copia, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a cualquier Centro de Atención al Público (CAP) de CESPT
    - Pasar al Módulo de Información e indicar a la persona del módulo que desea realizar una reubicación de medidor
    - Si no lo obtuvo de Internet, solicitar a la persona del Módulo de Información las especificaciones de las
      preparaciones que debe hacer el usuario para la reubicación del medidor, antes de pagar el trámite (INS-001
      o INS-002)
    - Contratar a un plomero para que realice las preparaciones necesarias para que sea posible realizar la reubicación
    - Una vez realizadas las preparaciones llamar al 073 para solicitar una Inspección de Factibilidad de Servicios
    - Ya que cuente con la inspección de factibilidad POSITIVA, acudir a cualquier Centro de Atención al Público
      de CESPT con los requisitos, tomar un número y esperar a ser atendido por personal de Módulo de Atención Personalizada
