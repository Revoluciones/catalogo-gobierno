scenarios:
- name: Certificado de Defunción
  requirements:
  - text: Documentación del familiar fallecido (INE o Acta de nacimiento).
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El familiar o representante debe acudir a la unidad hospitalaria en donde falleció su familiar
    - El familiar debe presentar la documentación del familiar fallecido
    - El servidor público tratante expide el certificado de defunción y hace entrega directa del certificado de
      defunción al familiar
  notes: Proceso para adquirir un certificado de defunción
