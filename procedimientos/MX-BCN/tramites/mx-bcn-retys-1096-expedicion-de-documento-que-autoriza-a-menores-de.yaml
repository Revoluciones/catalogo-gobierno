id: mx-bcn-retys-1096-expedicion-de-documento-que-autoriza-a-menores-de
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Expedición de Documento que Autoriza a Menores de Edad a Prestar sus Servicios en un Centro de Trabajo
summary: Solicitud de documento que autoriza a las y los menores en edad permisible, a prestar sus servicios en
  un centro de trabajo.
authority:
  name: Secretaría del Trabajo y Previsión Social del Estado de Baja California
official_ids:
  retys_id: 1096
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/1096
  homoclave: BC-STPS-004
who_can:
- Interesado
when: Cuando deseé laborar un menor de edad que tenga 15 años en adelante
result: Documento de autorización de trabajo
cost:
  type: gratuito
  amount_mxn: null
  text: SIN COSTO
  as_of: '2026-11-06'
  cites:
  - source: retys
deadlines:
- what: respuesta_autoridad
  text: 'Tiempo que tiene el organismo para resolver: 1 Horas'
  cites:
  - source: retys
- what: vigencia
  text: 60 DÍAS
  cites:
  - source: retys
positive_silence: false
requires_inspection: false
channels:
- en_linea
- presencial
offices:
- municipality: Mexicali
  name: Dirección de Inspección del Trabajo
  address: 'Rómulo O´Farril #938, Centro Cívico y Comercial, Mexicali, 21000'
- municipality: Tijuana
  name: Inspección del Trabajo Delegación Tijuana
  address: 'Bulevar Gustavo Diaz Ordaz #12649, El Paraiso, Tijuana, 22106'
- municipality: Ensenada
  name: Inspección del Trabajo Delegación Ensenada
  address: 'Carretera Transpeninsular #6500, Ex Ejido Chapultepec, Ensenada, 22785'
- municipality: San Quintín
  name: Inspección del Trabajo San Quintín
  address: 'Avenida A #s/n, Centro de Gobierno, San Quintín, 22930'
scenarios:
- name: Menores
  requirements:
  - text: Acta de nacimiento original y copia
    cites:
    - source: retys
  - text: CURP original y copia
    cites:
    - source: retys
  - text: Comprobante de estudios (constancia, boleta de fecha reciente o comprobante de haber terminado preparatoria
      original y copia. si el menor no estudia y tiene hijo(s), presentar el acta de nacimiento del hijo(s) en original
      y copia
    cites:
    - source: retys
  - text: Certificado médico expedido por institución de salud pública de gobierno, cruz roja o doctor particular
    cites:
    - source: retys
  - text: Escrito de la empresa donde prestará sus servicios indicando nombre y dirección de la empresa, nombre
      del menor, función a desempeñar, sueldo, horario y días que laborará (no deberá trabajar el domingo)
    cites:
    - source: retys
  - text: Dos fotografías tamaño infantil, de frente, actualizada
    cites:
    - source: retys
  - text: Identificación con fotografía reciente (credencial de la escuela, pasaporte mexicano, licencia de manejo
      de estudiante, tarjeta de afiliación al imss) original y copia
    cites:
    - source: retys
  - text: Jóvenes de 15 años deben venir acompañado (a) por su mamá o papá, los cuales deberán traer original y
      copia fotostática de su identificación oficial
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acceder a la liga haciendo clic en el botón "iniciar trámite" ubicado en la parte inferior derecha para realizar
      cita
    - Presentarse en el módulo y día de cita
    - Recepción de los documentos así como del menor
    - Revisar la documentación e información
    - Agregar los datos del menor (nombre del menor, nombre y domicilio de la empresa, sueldo, horario, puesto)
      y fotografía
    - Firma y sello del permiso
  notes: Trabajo menores
