- municipality: Tijuana
  name: CAP Oficinas Centrales
  address: 'Blvd. Federico Benítez #4057, Col. 20 de Noviembre, Tijuana, 22430'
scenarios:
- name: GENERAL
  requirements:
  - text: Solicitar la prórroga dentro del plazo otorgado, para realizar las adecuaciones y sistemas de pretratamiento
      en la empresa o establecimiento, en el Oficio de dimensionamiento de dispositivo(s).
    cites:
    - source: retys
  - text: NO TENER más de un Oficio de prórroga aprobada, otorgado anteriormente.
    cites:
    - source: retys
  - text: Original y copia del Solicitud de prórroga para las adecuaciones para el Programa Atrapa la Grasa (FRM-018),
      debidamente llenado y firmado.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/15374
  - text: Hacer el pago correspondiente
    cites:
    - source: retys
  - text: Las copias deben ser LEGIBLES y contener el DOCUMENTO COMPLETO
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la Coordinación de Control de Calidad, ubicada en el edificio que se encuentra en la parte posterior
      izquierda de Oficinas Centrales de CESPT y presentar los requisitos.
    - La persona de la Coordinación de Control de Calidad revisa que se cumpla con todos los requisitos, si no están
      completos, informa a la persona solicitante que no es posible realizar el trámite hasta que éstos se completen,
      indicándole que es lo que falta.
    - Con los requisitos completos, la persona de la Coordinación de Control de Calidad le entrega una Ficha de
      pago.
    - Acudir al área de Cajas con la Ficha de Pago y realizar el pago de derechos correspondiente, la persona de
      Cajas le entregará un Recibo de Pago.
    - Pasar al área de Archivo, presentar el Recibo de Pago y entregar el original y copia de la Solicitud de prórroga
      para las adecuaciones para el Programa Atrapa la Grasa.
    - La persona del área de Archivo certifica de recibido el original y copia de la Solicitud de prórroga para
      las adecuaciones para el Programa Atrapa la Grasa y entrega la copia al solicitante.
    - Personal de la Coordinación de Control de Calidad elabora el Oficio de prórroga aprobada y se comunica con
      la persona solicitante para que pase a recogerlo.
    - Acudir a CESPT y recoger el Oficio de prórroga aprobada.
  notes: GENERAL
