kind: tramite
title: Evaluación de Prórroga para el Programa Atrapa la Grasa y Sólidos
summary: Solicitar tiempo adicional, al plazo establecido en el oficio de dimensionamiento de dispositivo(s), para
  realizar las adecuaciones y sistemas de pretratamiento, necesarias para obtener la constancia de cumplimiento
  al programa atrapa la grasa y sólidos.
