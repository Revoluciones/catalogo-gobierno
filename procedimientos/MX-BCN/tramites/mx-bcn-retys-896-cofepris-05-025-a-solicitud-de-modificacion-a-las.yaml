title: COFEPRIS-05-025-A Solicitud de Modificación a las Condiciones de la Licencia Sanitaria para Establecimiento
  que utiliza Fuentes de Radiación para Fines Médicos o de Diagnóstico. Modalidad A.-Rayos X
summary: 'Cuando cambian las condiciones en que el ciudadano expidió la licencia como son: cambio de propietario
  del establecimiento; cambio de razón social; cambio de domicilio; cambio de aplicaciones (equipos); o suspensión
  de actividades.'
