  requirements:
  - text: Original de la licencia sujeta a modificación
    cites:
    - source: retys
  - text: Formato “Servicios de Salud”, debidamente requisitado
    cites:
    - source: retys
  - text: Original y una copia simple legible del comprobante del pago de derechos
    cites:
    - source: retys
  - text: Por cambio, aumento o disminución de equipos o servicios. » Memoria analítica actualizada y levantamiento
      de niveles de radiación después de la instalación del equipo avalados por un asesor especializado en seguridad
      radiológica (con croquis de distribución de áreas del establecimiento y ubicación de los equipos dentro del
      mismo). » Original de la Licencia sujeta a modificación » Cédula de información técnica actualizada
    cites:
    - source: retys
  - text: Por modificación administrativa. » Por cambio en la razón social del establecimiento. Copia simple del
      acta constitutiva del establecimiento o del alta ante la Secretaría de Hacienda y Crédito Público (presentando
      original para cotejo) » Copia legible del poder notarial del Representante Legal (presentando original para
      cotejo). » Actualización de la memoria analítica que contenga la nueva razón social. » Original de la Licencia
      sujeta a modificación » Cédula de información técnica actualizada
    cites:
    - source: retys
