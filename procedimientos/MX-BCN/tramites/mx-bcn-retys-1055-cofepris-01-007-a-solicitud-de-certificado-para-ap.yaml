summary: Cuando el ciudadano requiera realizar una exportación de alimentos y suplementos alimenticios, bebidas
  no alcohólicas, bebidas alcohólicas, productos de perfumería y belleza, artículos de aseo y limpieza, así como
  las materias primas y en su caso, aditivos que intervengan en su elaboración, que se encuentren domiciliados en
  territorio nacional y que cumplan con la legislación sanitaria vigente.
