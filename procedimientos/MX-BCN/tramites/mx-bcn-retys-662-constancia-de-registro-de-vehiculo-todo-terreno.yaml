scenarios:
- name: Personas Fisicas
  requirements:
  - text: Presentar el vehículo de que se trate para su verificación.
    cites:
    - source: retys
  - text: Factura de origen que hubiese expedido el fabricante, ensamblador, distribuidor autorizado o empresas
      del ramo dedicadas a la compra y venta de vehículos, en la que se identifique el vehículo en su individualidad.
    cites:
    - source: retys
  - text: Para vehículos importados presentar pedimento en el que conste la legal importación del vehículo en su
      caso.
    cites:
    - source: retys
  - text: Presentar original y copia de licencia de conducir vigente del Estado. En caso de que se cuente con alguna
      discapacidad o impedimento para conducir, presentar la licencia de conducir vigente del estado de la persona
      que autorice para conducir.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11038
  - text: 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito
      (excepto tarjetas American Express )'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Presentar el vehículo en las oficinas de recaudación de rentas del Estado, para la verificación de series.
    - Pasa al módulo de atención ciudadana para revisión de documentación.
    - 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito (excepto
      tarjetas American Express ).'
    - Obtiene constancia.
  notes: Expedir la constancia de registro de vehículos que circulan exclusivamente fuera de las vías públicas con
    domicilio en el Estado.
- name: Personas Morales
  requirements:
  - text: Presentar el vehículo de que se trate para su verificación.
    cites:
    - source: retys
  - text: Presentar en original y copia factura de origen que hubiese expedido el fabricante, ensamblador, distribuidor
      autorizado o empresas comerciales dedicadas a la compra y venta de vehículos usados en la que se identifique
      el vehículo en su individualidad.
    cites:
    - source: retys
  - text: Para vehículos importados presentar pedimento en el que conste la legal importación del vehículo en su
      caso.
    cites:
    - source: retys
  - text: Presentar original y copia de licencia de conducir vigente del Estado. En caso de que se cuente con alguna
      discapacidad o impedimento para conducir, presentar la licencia de conducir vigente del estado de la persona
      que autorice para conducir.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11043
  - text: Presentar original y copia de comprobante de domicilio no mayor de tres meses de antigüedad.
    cites:
    - source: retys
  - text: Presentar en original y copia de la cédula de identificación fiscal del registro federal de contribuyentes.
    cites:
    - source: retys
  - text: Presentar en original y copia de identificación oficial con fotografía vigente (INE, pasaporte mexicano,
      cartilla del servicio militar nacional o matrícula consular) del representante legal y documentación en la
      que conste la personalidad de quién comparece.
    cites:
    - source: retys
  - text: 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito
      (excepto tarjetas American Express ).'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Presentar el vehículo en recaudación y rentas del estado, para la verificación de series.
    - Pasa al módulo de atención ciudadana para revisión de documentación.
    - 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito (excepto
      tarjetas American Express ).'
    - Obtiene constancia.
  notes: Expedir la constancia de registro de vehículos que circulan exclusivamente fuera de las vías públicas con
    domicilio en el Estado.
