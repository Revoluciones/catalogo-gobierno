  text: 'COSTO VARIABLE: Mes de Noviembre de 2026. Por expedición por primera vez de Constancia anual de Registro
    en el Padrón vehicular estatal, de automotores todo terreno cuya circulación no este permitida en poblaciones
    y caminos del Estado de Baja California. Costo: $1,200.77 - Por la expedición anual de la Constancia de registro
    en el Padrón vehicular Estatal, de vehículos todo terreno. Costo: $817.99 *No incluye costos de contribuciones
