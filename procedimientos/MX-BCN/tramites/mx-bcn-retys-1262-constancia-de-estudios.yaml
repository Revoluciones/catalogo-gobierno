summary: Documento emitido por el titular del plantel CONALEP, en dicho documento se establece la formación académica
  recibida por un alumno y/o egresado de la institución educativa. El documento contiene la siguiente información,
  nombre del alumno, matrícula, carrera, semestre y turno. Se formula a solicitud del alumno y tiene validez sólo
  para el periodo semestral vigente.
