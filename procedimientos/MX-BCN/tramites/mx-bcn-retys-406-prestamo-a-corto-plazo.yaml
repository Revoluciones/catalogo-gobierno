  - text: Estar vigente en ISSSTECALI.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acude a las oficinas de atención. Solicita el préstamo y entrega toda la documentación requerida.
    - Al entregar sus documentos y la solicitud, recibirá una copia con un sello que confirma que hemos recibido
      todo. Se le informará cuánto tiempo tomará revisar su solicitud. Además, deberá comunicarse con nosotros en
      dos semanas para consultar el estado de su trámite.
    - Se revisará la documentación entregada, se verificará la relación laboral y se evaluará la situación financiera.
      La solicitud será ingresada en el sistema para continuar con el proceso.
    - Se le informará si su préstamo ha sido aprobado o el motivo del rechazo. Pago de prestación sujeto a flujo
      y disponibilidad presupuestal
    - Se registrará y autorizará el pago del préstamo, y se le notificará cuando esté listo.
    - Se revisarán y guardarán los documentos, se informará al organismo patronal sobre el descuento y se confirmará
      que se haya aplicado correctamente en la nómina.
    - Acudir a oficinas a recibir el cheque.
  notes: Asegurado(a) basificado(a)
