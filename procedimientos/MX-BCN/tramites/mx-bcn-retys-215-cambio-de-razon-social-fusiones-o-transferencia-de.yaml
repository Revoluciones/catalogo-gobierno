scenarios:
- name: Persona física cesionaria
  requirements:
  - text: Formato de solicitud debidamente requisitado, o escrito libre que proporcione la misma información requerida
      en el formato, que contenga la firma autógrafa de la persona interesada o de la persona apoderada o representante
      legal.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14829
  - text: Pago de derechos correspondiente, a nombre del promovente.
    cites:
    - source: retys
  - text: Copia simple de la identificación oficial de la persona cesionaria, legible y con vigencia activa.
    cites:
    - source: retys
  - text: Copia simple del contrato de cesión de derechos y obligaciones emanadas de las autorizaciones, permisos,
      licencias y/o registros que le fueron otorgadas al cedente, o que se encuentran en trámite, celebrado o ratificado
      ante fedatario público.
    cites:
    - source: retys
  - text: Registro Federal de Contribuyentes (RFC) de la persona cesionaria para la actividad pretendida.
    cites:
    - source: retys
  - text: En caso de que se actúe a través de persona apoderada o representante legal, presentar copia simple de
      la documental idónea, completa y nítida, mediante la cual se acredite como tal, vigente.
    cites:
    - source: retys
  - text: En caso de que se actúe a través de persona apoderada o representante legal, presentar copia simple de
      la identificación oficial de esta, nítida y con vigencia activa.
    cites:
    - source: retys
  - text: Copia simple del documento que acredite el legal uso del predio (contrato de arrendamiento, comodato,
      escrituras, etc.) a nombre de la persona cesionaria.
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Ingresar al portal, dando clic al botón "iniciar trámite", ubicado en la parte inferior derecha.
    - Capturar la información solicitada.
    - Realizar el pago de derechos correspondiente.
    - Subir los documentos solicitados vigentes.
    - Recepción y evaluación de la solicitud recibida por parte de la Secretaría.
    - Publicación de Resolución Administrativa en la página oficial de la Secretaría.
    - Acudir a las oficinas de la Secretaría de Medio Ambiente y Desarrollo Sustentable para la entrega y debida
      notificación de la Resolución Administrativa emitida por esta Autoridad. La notificación deberá ser recibida
      por el representante legal o apoderado legal quien deberá acreditar su personalidad jurídica conforme a la
      normatividad aplicable.
  - name: Presencial
    steps:
    - Consultar el trámite en RETyS, revisar los requisitos y costo aplicable.
    - Integrar la documentación requerida conforme a los requisitos establecidos para el trámite.
    - Realizar el pago de derechos y obtener el comprobante correspondiente.
    - Acudir a las oficinas de la Secretaría de Medio Ambiente y Desarrollo Sustentable, presentar en original y
      copia la solicitud del trámite, anexando la documentación y comprobante de pago correspondiente.
    - Recepción y evaluación de la solicitud recibida.
    - Publicación de Resolución Administrativa en la página oficial de la Secretaría.
    - Recoger la notificación de resolución administrativa, una vez que la razón social aparezca disponible en el
      listado. La notificación deberá ser recibida por el representante legal o apoderado legal quien deberá acreditar
      su personalidad jurídica conforme a la normatividad aplicable.
  notes: Persona que busca ceder los derechos y obligaciones registrados
- name: Persona moral cesionaria
  requirements:
  - text: Escrito libre en el que se señale el trámite solicitado, debiendo hacer mención a las autorizaciones,
      permisos, licencias y/o registros otorgados por la dependencia y/o de los trámites que se encuentren en proceso
      de evaluación, con firma autógrafa plasmada en el escrito de solicitud.
    cites:
    - source: retys
  - text: Copia simple del Acta Constitutiva de la empresa a la que se le cede los derechos y obligaciones.
    cites:
    - source: retys
  - text: Copia simple del Registro Federal de Contribuyentes (RFC) de la persona cesionaria para la actividad pretendida.
    cites:
    - source: retys
  - text: Copia simple del contrato de cesión de derechos y obligaciones emanadas de las autorizaciones, permisos,
      licencias y/o registros que le fueron otorgadas al cedente, o que se encuentran en trámite, celebrado o ratificado
      ante fedatario público.
    cites:
    - source: retys
  - text: Copia simple de la documental idónea vigente, completa y nítida, mediante la cual se acredite a la persona
      firmante como apoderada o representante legal de la cesionaria.
    cites:
    - source: retys
  - text: Copia simple de la identificación oficial de la persona apoderada o representante legal, legible y con
      vigencia activa.
    cites:
    - source: retys
  - text: Copia simple del documento que acredite el legal uso del predio (contrato de arrendamiento, comodato,
      escrituras, etc.) a nombre de la persona cesionaria.
    cites:
    - source: retys
  - text: Pago de derechos correspondiente, a nombre del promovente.
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Ingresar al portal, dando clic al botón "iniciar trámite", ubicado en la parte inferior derecha.
    - Capturar la información solicitada.
    - Realizar el pago de derechos correspondiente.
    - Subir los documentos solicitados vigentes.
    - Recepción y evaluación de la solicitud recibida por parte de la Secretaría.
    - Publicación de Resolución Administrativa en la página oficial de la Secretaría.
    - Acudir a las oficinas de la Secretaría de Medio Ambiente y Desarrollo Sustentable para la entrega y debida
      notificación de la Resolución Administrativa emitida por esta Autoridad.
  - name: Presencial
    steps:
    - Consultar el trámite en RETyS, revisar los requisitos y costo aplicable.
    - Integrar la documentación requerida conforme a los requisitos establecidos para el trámite.
    - Realizar el pago de derechos y obtener el comprobante correspondiente.
    - Acudir a las oficinas de la Secretaría de Medio Ambiente y Desarrollo Sustentable, presentar en original y
      copia la solicitud del trámite, anexando la documentación y comprobante de pago correspondiente.
    - Recepción y evaluación de la solicitud recibida.
    - Publicación de Resolución Administrativa en la página oficial de la Secretaría.
    - Recoger la notificación de resolución administrativa, una vez que la razón social aparezca disponible en el
      listado. La notificación deberá ser recibida por el representante legal o apoderado legal quien deberá acreditar
      su personalidad jurídica conforme a la normatividad aplicable.
  notes: Sociedad civil o mercantil, organismo gubernamental, ejido y todo ente creado por el derecho que busca
    ceder los derechos y obligaciones registrados
