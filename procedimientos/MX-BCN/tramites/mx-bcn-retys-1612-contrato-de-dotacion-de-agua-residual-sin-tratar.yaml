requires_inspection: true
channels:
- presencial
offices:
- municipality: Tijuana
  name: CAP Oficinas Centrales
  address: 'Blvd. Federico Benítez #4057, Col. 20 de Noviembre, Tijuana, 22430'
scenarios:
- name: Primera vez
  requirements:
  - text: Original y copia del Formulario para establecimiento de contrato para usuarios de agua residual tratada
      (FRM-008) debidamente llenado y firmado por el propietario o el representante legal
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12579
  - text: Copia del Acta constitutiva
    cites:
    - source: retys
  - text: Copia del poder notariado del Representante Legal, en caso de NO ESTAR ESTABLECIDO en el acta constitutiva
    cites:
    - source: retys
  - text: 'Copia de Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a
      quien éste le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial
      del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Copia de alta ante la Secretaría de Hacienda y Crédito Público
    cites:
    - source: retys
  - text: Croquis de localización con descripción de las colindancias hacia los cuatro puntos cardinales
    cites:
    - source: retys
  - text: Pago de derechos que correspondan
    cites:
    - source: retys
  - text: Las copias deben ser LEGIBLES y contener el DOCUMENTO COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la Coordinación de Servicios de Saneamiento, ubicada en el edificio en la parte posterior y a un
      costado de Oficinas Centrales de CESPT y presentar los requisitos.
    - La persona de la Coordinación de Servicios de Saneamiento revisará que todos los requisitos sean correctos
      y estén completos, de no ser así le informará lo que falta y que no se puede realizar el trámite hasta que
      se completen los requisitos.
    - Con los requisitos completos personal de la Coordinación de Servicios de Saneamiento sellará y firmará de
      validación el original y copia del Formulario para establecimiento de contrato para usuarios de agua residual
      tratada, la cual entregará al solicitante, así como todos los requisitos.
    - Personal de la Coordinación de Servicios de Saneamiento, elaborará la Ficha de pago, la cual entregará al
      solicitante para que realice el pago de derechos correspondiente en cajas.
    - Acudir al área de Cajas con la Ficha de pago que se le entregó y realizar el pago correspondiente.
    - Una vez realizado el pago, pasar al área de Archivo, presentar el Recibo de pago y entregar todos los requisitos.
    - La persona del área de Archivo entregará al solicitante la copia del Formulario para establecimiento de contrato
      para usuarios de agua residual tratada con la certificación de recibido.
    - Posteriormente, la persona de la Coordinación de Servicios de Saneamiento contactará a la persona solicitante
      para que acuda a las oficinas a firmar el contrato y hacerle entrega del mismo.
  notes: Primera vez
- name: Revalidación de contrato
  requirements:
