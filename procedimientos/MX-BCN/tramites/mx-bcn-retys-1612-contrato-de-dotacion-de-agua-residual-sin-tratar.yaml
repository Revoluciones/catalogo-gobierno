result: Ficha de cobro con certificación de pago y contrato de dotación de agua residual sin tratar.
cost:
  type: variable
  amount_mxn: null
  text: 'COSTO VARIABLE: Sin tratar, por cada m³ entregada en planta: $1.43 pesos Sin tratar, por cada m³ entregada
    en planta para uso agrícola: $1.43 pesos Noviembre 2026'
  as_of: '2026-11-06'
  cites:
  - source: retys
