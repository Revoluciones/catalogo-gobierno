scenarios:
- name: Propietario
  requirements:
  - text: 'Formulario para Trámites en Archivo, (lo proporciona CESPT o lo puede obtener en la página de Internet:
      (FRM-005), debidamente llenado y firmado por el titular de la cuenta o por la persona a quien éste le haya
      otorgado el poder para realizar el trámite.'
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12558
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio, puede ser UNO de los siguientes:
      Credencial del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: 'Documento para comprobar la propiedad del predio: Recibo de impuesto predial vigente (con fecha de emisión
      no mayor a un año de antigüedad).'
    cites:
    - source: retys
  - text: Hacer el pago correspondiente.
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en ORIGINAL Y COPIA, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  - text: Para que el trámite proceda, el saldo de la cuenta de la que se va a solicitar la Constancia de no adeudo,
      debe estar en ceros.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público (CAP) de Oficinas Centrales o al CAP Pavilion
    - Pasar a las cajas a realizar el pago por concepto de Expedición de Constancia de No Adeudo
    - Con el recibo de pago, ingresar a la ventanilla de certificados de libertad de gravamen los requisitos
    - La persona de ventanilla revisará que se cumpla con todos requisitos, si no están completos, le informará
      que no es posible realizar el trámite hasta que éstos se completen, indicándole que es lo que falta.
    - Con los requisitos completos la persona de ventanilla, imprime certificación de recibido a la copia del Formulario
      para Trámites en Archivo, en donde se indica la fecha de respuesta
    - En la fecha indicada, regrese a la ventanilla de certificados de libertad de gravamen a recoger la Constancia
      de No adeudo que solicitó..
  notes: Todos los documentos deben presentarse en original y copia, la cual debe ser legible y contener el documento
    completo
- name: Representante legal
  requirements:
  - text: 'Formulario para Trámites en Archivo, (lo proporciona CESPT o lo puede obtener en la página de Internet:
      (FRM-005), debidamente llenado y firmado por el titular de la cuenta o por la persona a quien éste le haya'
