summary: Permiso de traslado para aquellos vehículos que no estén dados de alta en el Registro Estatal Vehicular,
  con la finalidad de trasladarlos a otro Estado o de una ciudad a otra dentro del mismo Estado, el cual será otorgado
  por un plazo máximo de 15 días naturales.
