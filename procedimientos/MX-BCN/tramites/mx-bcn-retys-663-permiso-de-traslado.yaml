scenarios:
- name: Personas Fisicas
  requirements:
  - text: Presentar vehículo para revisión física
    cites:
    - source: retys
  - text: Presentar en original y copia factura de origen que hubiese expedido el fabricante, ensamblador, distribuidor
      autorizado o empresas comerciales dedicadas a la compra y venta de vehículos usados en la que se identifique
      el vehículo en su individualidad.
    cites:
    - source: retys
  - text: Presentar en original y copia de pedimento en el que conste la legal importación del vehículo cuando el
      mismo es de procedencia extranjera
    cites:
    - source: retys
  - text: Presentar en original y copia identificación oficial vigente del propietario.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11009
  - text: 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito
      (excepto tarjetas American Express )'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas de Recaudación de Rentas del Estado, prsentar el vehículo que requiere el permiso de
      traslado.
    - Pasar al área de revisión de número de serie
    - Pasar al módulo de altas y cambio de propietarios para revisión de documentos
    - Realizar el pago de los derechos e impuestos
    - Recoger el permiso de traslado
  notes: Requisitos para obtener el permiso de traslado.
- name: Personas Morales
  requirements:
  - text: Presentar vehículo para revisión física
    cites:
    - source: retys
  - text: Presentar en original y copia factura de origen que hubiese expedido el fabricante, ensamblador, distribuidor
      autorizado o empresas comerciales dedicadas a la compra y venta de vehículos usados en la que se identifique
      el vehículo en su individualidad.
    cites:
    - source: retys
  - text: Presentar en original y copia de pedimento en el que conste la legal importación del vehículo cuando el
      mismo es de procedencia extranjera
    cites:
    - source: retys
  - text: Presentar en original y copia licencia de conducir vigente del estado. En caso de que se cuente con alguna
      discapacidad o impedimento para conducir, presentar la licencia de conducir vigente del estado de la persona
      que autorice para conducir
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11032
  - text: Presentar en original y copia comprobante de domicilio no mayor a tres meses de antigüedad
    cites:
    - source: retys
  - text: Presentar en original y copia de la escritura constitutiva
    cites:
    - source: retys
  - text: Presentar original y copia de la Cédula de Identificación Fiscal del Registro federal de Contribuyentes
    cites:
    - source: retys
  - text: Presentar original y copia identificación oficial vigente (INE, pasaporte mexicano, cartilla del servicio
      militar nacional o matrícula consular) del representante y documentación en la que conste la personalidad
      de quien comparece.
    cites:
    - source: retys
  - text: 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito
      (excepto tarjetas American Express )'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas de Recaudación de Rentas del Estado, prsentar el vehículo que requiere el permiso de
      traslado.
    - Pasar al área de revisión de número de serie
    - Pasar al módulo de altas y cambio de propietarios para revisión de documentos
    - Realizar el pago de los derechos e impuestos
    - Recoger el permiso de traslado
  notes: Requisitos para obtener el permiso de traslado.
