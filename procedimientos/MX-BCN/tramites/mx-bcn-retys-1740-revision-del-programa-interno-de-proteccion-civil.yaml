id: mx-bcn-retys-1740-revision-del-programa-interno-de-proteccion-civil
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Revisión del Programa Interno de Protección Civil
summary: Verificar que las dependencias, entidades, instituciones y organismos del sector público, privado o social
  cuenten con un instrumento de planeación y operación para mitigar los riesgos identificados y definir acciones
  preventivas y de respuesta para estar en condiciones de atender la eventualidad de alguna emergencia o desastre.
