- Representante Legal
- Interesado
- Otro
when: Cuando se cuente con un inmueble en Baja California y que conforme a la legislación estatal en la materia
  tenga que presentarlo en el Estado.
result: Oficio de aprobación / aprobación condicionada / devolución / revisión de inmueble
