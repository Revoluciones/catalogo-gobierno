offices:
- municipality: Tijuana
  name: Coordinación Estatal de Protección Civil
  address: 'Panfilo Natera #6400,  Francisco Villa, Tijuana, 22615'
scenarios:
- name: Propietario/Representante Legal
  requirements:
  - text: Solicitud por escrito
    cites:
    - source: retys
  - text: Copia de recibo de pago de derechos.
    cites:
    - source: retys
  - text: 'Versión física y digital en USB del PIPC, elaborado conforme a la Guía de Elaboración y Actualización
      de Programas Internos de Protección Civil. Incluyen:'
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11907
  - text: '--- Acta constitutiva de la UIPC.'
    cites:
    - source: retys
  - text: '--- Dictamen de uso de suelo, emitido por el Municipio correspondiente.'
    cites:
    - source: retys
  - text: '--- Certificación de las medidas de seguridad contra incendios y siniestros, emitido por la Dirección
      de Bomberos del Municipio correspondiente.'
    cites:
    - source: retys
  - text: '--- Evaluación estructural, expedida por un ingeniero o arquitecto registrado en el Municipio correspondiente.'
    cites:
    - source: retys
  - text: '--- Dictamen/ Opinión técnica de instalación eléctrica, expedido por una unidad verificadora registrada
      ante la Secretaría de Energía.'
    cites:
    - source: retys
  - text: '--- Dictamen/ opinión técnica de instalación de gas (si aplica), expedido por una unidad verificadora
      registrada ante la Secretaría de Energía.'
    cites:
    - source: retys
  - text: '--- Dictamen de recipientes sujetos a presión (si aplica), avalado por la Secretaría del Trabajo y Previsión
      Social.'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las instalaciones de la Coordinación Estatal de Protección Civil.
    - Entregar carpeta con el contenido del Programa Interno conforme a la Guía y demás requisitos establecidos.
    - Realizar pago de derechos.
    - Solicita respuesta en los siguientes 10 días hábiles.
  notes: Verificar que las dependencias, entidades, instituciones y organismos del sector público, privado o social
    cuenten con un instrumento de planeación y operación para mitigar los riesgos identificados y definir acciones
    preventivas y de respuesta para estar en condiciones de atender la eventualidad de alguna emergencia o desastre.
- name: Casas Hogar
  requirements:
  - text: Llenar solicitud
    cites:
    - source: retys
  - text: Pago de derechos
    cites:
    - source: retys
  - text: Versión física y digital en USB del PIPC, elaborado conforme a la Guía de Elaboración y Actualización
      de Programas Internos de Protección Civil
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/13594
  modes:
  - name: En línea
    steps:
    - Clic en el botón "iniciar tramite"
    - Llenar formulario
    - Cargar requisitos en formato PDF
    - Personal de Protección civil revisará los requisitos y hará saber su respuesta a través del correo
    - Una vez aprobado el PIPC, acudir a las oficinas de Protección Civil con el ejemplar físico y digital en USB
      del documento previamente aprobado, debidamente firmado con firmas autógrafas.
  - name: Presencial
    steps:
    - Acudir a las instalaciones de la Coordinación Estatal de Protección Civil.
    - Entregar carpeta con el contenido del Programa Interno conforme a la Guía y demás requisitos establecidos.
    - Entregar constancia de bienestar para la excepción de pago, en lo contario realizar pago de derechos
    - Recoger respuesta en los siguientes 10 días hábiles.
  notes: Verificar que las dependencias, entidades, instituciones y organismos del sector público, privado o social
    cuenten con un instrumento de planeación y operación para mitigar los riesgos identificados y definir acciones
    preventivas y de respuesta para estar en condiciones de atender la eventualidad de alguna emergencia o desastre.
