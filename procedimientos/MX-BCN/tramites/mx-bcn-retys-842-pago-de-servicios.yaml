summary: 'Consiste en realizar el pago del servicio de agua corriente que se genera cada mes de acuerdo a la lectura
  que arroje aparato medidor de agua. En algunos casos los usuarios tienen pendientes cargos de meses anteriores,
  en ese caso se incluirán los conceptos: atraso, recargos y agua corriente.'
