title: Trámite Deducible de Impuestos para Patrocinadores
summary: Brindar a los deportistas el apoyo para realizar el trámite deducible de impuestos para los patrocinadores,
  cuando participen en determinados eventos,avalado por la asociación deportiva que pertenece.
