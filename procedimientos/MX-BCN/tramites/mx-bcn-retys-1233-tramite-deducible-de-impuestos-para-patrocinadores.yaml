  address: 'Calzada Aviación Ciudad Deportiva #s/n, Cuauhtémoc, Mexicali, 21230'
scenarios:
- name: Deportista
  requirements:
  - text: Presentar por escrito la solicitud de autorización para apoyo, dirigida al Director General del INDE
    cites:
    - source: retys
  - text: Presentar copia de la convocatoria del evento deportivo a asistir
    cites:
    - source: retys
  - text: Presentar el presupuesto que contenga la distribución de los recursos que se pretenden obtener
    cites:
    - source: retys
  - text: En caso de otorgar el recurso en cheque, este debe estar certificado a nombre de Gobierno del Estado de
      Baja California
    cites:
    - source: retys
  - text: Presentar copia de credencial del INDE y clabe interbancaria de 18 dígitos para la devolución del recurso
      mediante transferencia bancaria
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Presentar la solicitud de recibo deducible de impuesto en el Instituto
    - El titular del Instituto analizá la solicitud y da respuesta
    - Solicitar la respuesta a la solictud presentada
    - Realizar el depósito del recurso a nombre del Gobierno del Estado de Baja California
    - Solicitar al Instituto el recibo deducible de impuesto
  notes: Apoyo para realizar el trámite deducible de impuestos para los patrocinadores
