scenarios:
- name: CRI Mexicali, Tijuana y Ensenada
  requirements:
  - text: CURP (Copia)
    cites:
    - source: retys
  - text: Certificado médico (original)
    cites:
    - source: retys
  - text: Identificación oficial si es mayor de edad (original)
    cites:
    - source: retys
  - text: Si es menor de edad, cualquier identificación con fotografía e identificación oficial de los padres
    cites:
    - source: retys
  - text: Acta de nacimiento (original y copia)
    cites:
    - source: retys
  - text: Comprobante de domicilio (original y copia)
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Dar clic en "Iniciar trámite" e ingresar tu correo electrónico.
    - Dirigete a tu correo electrónico, recibiras una confirmación.
    - Completa el formulario.
    - Adjunta documentos en formato PDF.
    - Un analista cotejerá tus documentos y te hará saber el resultado vía correo electrónico.
    - Una vez validados los documentos, se indicará la programación de cita para valoración medica y toma de biométricos
      en Centro de Rehabilitación Integral.
    - Se genera una solicitud de Credencial.
    - Se notifica vía correo electrónico la fecha en que se debe presentar en el centro.
    - En valoración médica se verifica si el paciente cumple con los criterios de discapacidad.
    - Se emitirá la credencial.
  - name: Presencial
    steps:
    - Acudir al Centro de Rehabilitación Integral (CRI ) a solicitar la credencial.
    - Solicitar una cita para presentar documentación.
    - Presentar documentación requerida.
    - Veririfcar que la documentación este completa.
    - Llenar la cédula de credencial y se turnará al paciente a Valoración médica.
    - Se verificará si el paciente cumple con los criterios de discapacidad (valoración médica).
    - Se emitirá la credencial.
  notes: Recopilación de documentos para el servicio
- name: UBR San Felipe, San Quintin, Tecate y Playas de Rosarito
  requirements:
  - text: CURP (Copia)
    cites:
    - source: retys
  - text: Certificado médico (original)
    cites:
    - source: retys
  - text: Identificación oficial si es mayor de edad (original)
    cites:
    - source: retys
  - text: Si es menor de edad, cualquier identificación con fotografía e identificación oficial de los padres
    cites:
    - source: retys
  - text: Acta de nacimiento (original y copia)
    cites:
    - source: retys
  - text: Comprobante de domicilio (original y copia)
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Dar clic en "Iniciar trámite" e ingresar tu correo electrónico.
    - Dirigete a tu correo electrónico, recibiras una confirmación.
    - Completa el formulario.
    - Adjunta documentos en formato PDF.
    - Un analista cotejerá tus documentos y te hará saber el resultado vía correo electrónico.
    - Una vez validados los documentos, se indicará la programación de cita para valoración medica y toma de biométricos
      en Centro de Rehabilitación Integral.
    - Se genera una solicitud de Credencial.
    - Se notifica vía correo electrónico la fecha en que se debe presentar en la UBR.
    - En valoración médica se verifica si el paciente cumple con los criterios de discapacidad.
    - Se emitirá la credencial.
  - name: Presencial
    steps:
    - Acudir a la Unidad Básica de Rehabilitación (UBR ) a solicitar una cita para la credencial.
    - Se notificará vía telefónica el día que se debe presentar en la UBR.
    - Presentar documentación requerida.
    - Veririfcar que la documentación este completa.
    - Llenar la cédula de credencial y se turnará al paciente a Valoración médica.
    - Se verificará si el paciente cumple con los criterios de discapacidad (valoración médica).
    - Se emitirá la credencial.
  notes: Recopilación de documentos para el servicio.
