scenarios:
- name: Propietario
  requirements:
  - text: Inspección de suspensión temporal del servicio positiva emitida por CESPT, la cual se puede tramitar llamando
      al teléfono 073
    cites:
    - source: retys
  - text: Llenar formato proporcionado por el ejecutivo de servicio de CESPT
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio, UNO de los siguientes: Credencial
      del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Hacer el pago correspondiente
    cites:
    - source: retys
  - text: 'Cumplir con las siguientes condiciones: 1) La suspensión debe ser por un período NO MENOR a 30 días,
      2) El inmueble debe estar DESHABITADO, 3) El saldo de la cuenta debe estar en ceros, y 4) El medidor debe
      estar en un lugar accesible para el personal del Organismo.'
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en original y copia, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a cualquier Centro de Atención al Público (CAP) de CESPT
    - Pasar al área de Módulos de Atención Personalizada (MAP) y esperar su turno
    - Cuando llegue su turno, la persona del MAP revisará que se cumpla con todos los requisitos, si no están completos,
      le informará que no es posible realizar el trámite hasta que éstos se completen, indicándole que es lo que
      falta
    - Con los requisitos completos, la persona del MAP genera el documento de Liquidación de Obra para suspensión
      temporal del servicio, y le hará entrega de éste para que lo revise y lo firme
    - La persona solicitante debe firmar de conformidad el documento que le entrega la persona del MAP
    - 'Una vez firmado el documento deberá pasar a cajas a realizar el pago correspondiente, en donde le entregarán
      dos documentos: 1) Comprobante de pago y 2) Convenio de liquidación de obra'
  notes: Propietario
- name: Representante
  requirements:
  - text: Inspección de suspensión temporal del servicio positiva emitida por CESPT, la cual se puede tramitar llamando
      al teléfono 073
    cites:
    - source: retys
  - text: Llenar formato proporcionado por el ejecutivo de servicio de CESPT
    cites:
    - source: retys
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el propietario del predio,
      puede ser UNO de los siguientes: Poder Notarial; Carta poder ante notario público, corredor público o fedatario
      público; Carta Poder simple firmada por el propietario del predio y por dos testigos, que incluya copia de
      las identificaciones oficiales de los testigos, cuya antigüedad no exceda los seis meses.'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial del INE,
      Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Hacer el pago correspondiente
    cites:
    - source: retys
  - text: 'Cumplir con las siguientes condiciones: 1) La suspensión debe ser por un período NO MENOR a 30 días,
      2) El inmueble debe estar DESHABITADO, 3) El saldo de la cuenta debe estar en ceros, y 4) El medidor debe
      estar en un lugar accesible para el personal del Organismo.'
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en original y copia, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
