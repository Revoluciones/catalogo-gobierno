scenarios:
- name: Personas Fisicas
  requirements:
  - text: Identificación oficial vigente del contribuyente (INE, pasaporte mexicano vigente, cédula profesional,
      matrícula consular, cartilla militar y/o licencia de conducir).
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir físicamente a la oficina de Recaudación de Rentas del Estado más cercana a su domicilio fiscal
    - El asesor de la recaudación atenderá personalmente al contribuyente para obtener la clave electrónica estatal
      para realizar sus pagos vía internet.
    - El asesor requerirá al contribuyente los documentos para iniciar el trámite solicitado.
    - Una vez procesado el trámite, el asesor generará el acuse de clave electrónica estatal y lo entregá al contribuyente.
  notes: Proporcionar al contribuyente inscrito, medios alternos y confidenciales para la consulta de su situación
    fiscal, así como para el envío de las declaraciones de impuestos que les correspondan desde cualquier punto
    con conexión a internet.
- name: Persona Moral
  requirements:
  - text: Identificación oficial vigente del contribuyente (INE, pasaporte mexicano vigente, cédula profesional,
      matrícula consular, cartilla militar y/o licencia de conducir).
    cites:
    - source: retys
  - text: Acta constitutiva y/o poder notarial donde acredite el carácter de representante legal y/o apoderado legal.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir físicamente a la oficina de Recaudación de Rentas del Estado más cercana a su domicilio fiscal
    - El asesor de la recaudación atenderá personalmente al contribuyente para obtener la clave electrónica estatal
      para realizar sus pagos vía internet.
    - El asesor requerirá al contribuyente los documentos para iniciar el trámite solicitado.
    - Una vez procesado el trámite, el asesor generará el acuse de clave electrónica estatal y lo entregá al contribuyente.
  notes: Proporcionar al contribuyente inscrito, medios alternos y confidenciales para la consulta de su situación
    fiscal, así como para el envío de las declaraciones de impuestos que les correspondan desde cualquier punto
    con conexión a internet.
