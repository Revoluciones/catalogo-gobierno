title: Registro del Padrón de Proveedores
summary: Registro en el padrón de proveedores de personas físicas o morales interesadas en la convocatoria y contratación
  de la obra pública y de sus servicios relacionados con la misma, del Estado o municipios de Baja California y
  Nacionales con domicilio fiscal en el Estado de Baja California.
authority:
  name: Secretaría de Infraestructura, Desarrollo Urbano y Reordenación Territorial de Baja California
