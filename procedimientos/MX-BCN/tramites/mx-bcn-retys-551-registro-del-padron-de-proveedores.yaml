- Representante Legal
- Interesado
when: Al requerir registrarse como proveedor.
result: Registro
cost:
  type: variable
  amount_mxn: null
  text: 'COSTO VARIABLE: Capítulo VIII Artículo 19. VI.- Por El Alta En El Padrón De Contratistas Y Proveedores
    Con Vigencia Anual, A Quien Lo Solicite: a). - Por El Alta O Su Renovación Anual'
  as_of: '2026-11-06'
  cites:
  - source: retys
