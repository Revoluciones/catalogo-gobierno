kind: tramite
title: Autorización para prestar servicios de seguridad privada por medio de canes entrenados
summary: Trámite para la revisión de requisitos y en caso de estar completos, la validación de la prestación del
  servicio de seguridad privada por medio de canes (perros entrenados para vigilancia).
authority:
  name: Secretaría de Seguridad Ciudadana del Estado de Baja California
official_ids:
  retys_id: 1572
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/1572
