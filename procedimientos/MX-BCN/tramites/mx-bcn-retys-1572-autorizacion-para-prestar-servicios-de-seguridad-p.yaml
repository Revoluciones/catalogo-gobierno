scenarios:
- name: Seguridad privada por medio de canes Persona Moral
  requirements:
  - text: Solicitud de autorización
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12346
  - text: El acta constitutiva,que acredite la nacionalidad mexicana
    cites:
    - source: retys
  - text: La cédula del registro federal de contribuyentes expedida por la Secretaría de Hacienda y Crédito Público
    cites:
    - source: retys
  - text: La constancia de empadronamiento o inscripcion del Registro Federal de Contribuyentes ante la Secretaría
      de Hacienda del Estado de Baja California
    cites:
    - source: retys
  - text: Autorización para operar de equipo de radi, expedido por la autoridad reguladora, o por una empresa de
      telecomunicaciones autorizada.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/6885
  - text: Listado detallado del equipo de radiocomunicación.
    cites:
    - source: retys
  - text: El manual de operaciones especificos para cada modalidad prevista en el artículo 4 del reglamento de seguridad
    cites:
    - source: retys
  - text: El documento en el que señale la delimitación geográfica del servicio
    cites:
    - source: retys
  - text: Documentación que acredite domicilio legal de la matriz y sucursales para recibir notificaciones dentro
      del estado, asi como planos de ubicación de ambos
    cites:
    - source: retys
  - text: La relación de los socios y representante o apoderado legal de la negociación, que contenga su nombre,
      domicilio, lugar y fecha de nacimiento, así como el nombre de sus padres, agregando copia de las actas de
      nacimiento o cartas de naturalización e identificación oficial vigente con fotografía
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/6890
  - text: Comprobante de cumplimiento del artículo 74 para personal operativo
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/6891
  - text: La relación detallada del equipo de protección personal como la marca, modelo y número de serie.
    cites:
    - source: retys
  - text: Descripción de la flota vehicular, especificando marca, modelo y documentación vigente, póliza contra
      daños a terceros e imágenes a colores, logotipos o emblemas en las que se aprecien sus insignias
    cites:
    - source: retys
  - text: Documentación que acredite la legal posesión y portación de las armas de fuego utilizadas en el servicio
      de seguridad privada.
    cites:
    - source: retys
  - text: Imagenes a color de las insignias y aditamentos de seguridad a utilizar
    cites:
    - source: retys
  - text: imagen a color frontal, trasera lateral izquierda y lateral derecha, de cuerpo entero del uniforme y sus
      accesorios
    cites:
    - source: retys
  - text: Nombre del jefe de operaciones anexando los requisitos del artículo 74 del reglamento
    cites:
    - source: retys
  - text: Programa de capacitación para todo el personal operativo incluyendo al jefe de operaciones, que cumpla
      con lo establecido en el articulo 4 del reglamento y los lineamientos del Instituto. Este plan debe especificar
      las materias, duración, calendario y responsables de cada curso.
    cites:
    - source: retys
  - text: El permiso para uso de suelo para local comercial expedido por la autoridad competente donde se encuentre
      matriz y/o sucursales
    cites:
    - source: retys
  - text: Constancia de no antecedentes penales de los socios, representantes o apoderado, así como no estar sujetos
      a proceso penal alguno
    cites:
    - source: retys
  - text: Modelo de gafete o credencial de identificación para el personal operativo
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/6902
  - text: Asegurarse de que los canes sean manejados únicamente por personal operativo capacitado por institución
      o persona especializada y autorizada en la materia
    cites:
    - source: retys
  - text: Utilizar canes que hayan sido entrenados por institución o persona autorizada y especializada para la
      prestación de servicios de seguridad privada
    cites:
    - source: retys
  - text: Certificado de vacunación vigente para cada uno de los canes.
    cites:
    - source: retys
  - text: Asegurarse de que los canes porten una placa de identificación en el collar, en el que se indique el nombre,
      dirección y número telefónico de los prestadores
    cites:
    - source: retys
  - text: Utilizar en cualquier lugar público correas cuya extensión no exceda de dos metros de longitud y tengan
      bandola de bronce u otra cuya resistencia sea equivalente o superior, manejar bozal en caso de ser necesario
    cites:
    - source: retys
  - text: No manejar y/o utilizar a 2 o más canes en forma simultánea
    cites:
    - source: retys
  - text: Mantener a los canes en condiciones de seguridad, para evitar cualquier tipo de daño a terceros
    cites:
    - source: retys
  - text: Conservar a los canes en condiciones de higiene y salud.
    cites:
    - source: retys
  - text: Mantener permanentemente identificados a los canes de manera individual con una marca o seña distintiva
      y visible.
    cites:
    - source: retys
  - text: Proporcionar a la dirección, fotografías de los canes de cuerpo entero, de frente y de perfil
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El ciudadano acreditará los requisitos para su modalidad o modalidades
    - El ciudadano presentará una carpeta con los requisitos en la dirección de seguridad privada
    - El servidor público revisará que cumpla con la totalidad de los requisitos
    - El servidor público informará al ciudadano si su carpeta cumple o no con los requisitos y que es necesario
      solventar
    - Cuando la carpeta este completa, se realizará una visita al ciudadano, para verificar que cumpla con los requisitos
      del establecimiento
    - Una vez realizada la visita y cumplidos todos los requisitos, se realizará un oficio de pago por la autorización
    - El ciudadano realizará el pago de la autorización y entregará su comprobante en la dirección de seguridad
      privada
    - El servidor público hará entrega del permiso al ciudadano y explicará las obligaciones con las que debe cumplir
  notes: Tienen por objeto proteger y vigilar personas, bienes y/o detectar las sustancias u objetos que designen
    los prestatarios
