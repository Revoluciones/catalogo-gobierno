title: COFEPRIS-05-013 Aviso Temporal de Responsable Sanitario de Insumos para la Salud
summary: Cuando el responsable sanitario se ausente del establecimiento por más de 30 días, se debe nombrar a otra
  persona para que realice las actividades del responsable sanitario. El responsable sanitario continuará responsabilizándose
  del cumplimiento de las normas sanitarias por parte del establecimiento durante su ausencia.
