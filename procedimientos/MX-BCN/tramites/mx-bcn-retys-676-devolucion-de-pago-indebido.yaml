title: Devolución de Pago Indebido
summary: La Secretaría de Hacienda devolverá a los contribuyentes, las cantidades pagadas indebidamente al fisco
  estatal. Se puede tramitar en las 5 Oficinas de Recaudación de Rentas del Estado. La devolución del pago de lo
  indebido, se realiza dentro de los 2 meses siguientes a la fecha en que sea presentada la solicitud ante Recaudación
  de Rentas del Estado con todos los requisitos, datos, documentos e informes que justifiquen la procedencia de
  la devolución, conforme a las disposiciones fiscales.
