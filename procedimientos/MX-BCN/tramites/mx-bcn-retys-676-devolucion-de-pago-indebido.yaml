scenarios:
- name: Devolución de pago de lo indebido (mayor a 40 UMAS)
  requirements:
  - text: 'Presentar solicitud de devolución dirgido a la Recaudación de Rentas correspondiente, indicando: -concepto
      o impuesto referido.- Motivo del pago indebido.-Cantidad solicitada.-Nombre y firma del contribuyente (quien
      realiza y acredita el pago).'
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14094
  - text: Recibo a favor de la Secretaría de Hacienda del Estado, por la cantidad solicitada, debiendo mencionar
      el concepto del impuesto o derecho pagado indebidamente
    cites:
    - source: retys
  - text: Original del recibo de pago con el que se demuestra el pago indebido.
    cites:
    - source: retys
  - text: Copia de identificación oficial vigente del promovente. En caso de representación, el promovente debe
      presentar poder notarial o carta poder firmada ante dos testigos y ratificadas las firmas del otorgante y
      testigos ante el Recaudador de Rentas o el Procurador Fiscal del Estado.
    cites:
    - source: retys
  - text: Registro Federal de Contribuyentes (RFC) emitida por el Servicio de Administración Tributaria (SAT)
    cites:
    - source: retys
  - text: Estado de cuenta bancario del contribuyente que evidencíe el movimiento respectivo. (En caso de pago electrónico)
    cites:
    - source: retys
  - text: 'En caso de Persona Moral, adicionalmente se requiere: a) Solicitud de devolución y recibo a favor de
      la SHE en hoja membretada (con información de la Moral: logo,domicilio,rfc, nombre y firma de representante
      legal). b)Copia del Acta Constitutiva de la Empresa. c) RFC d) Copia de identificación oficial con fotografía
      vigente del promovente. e) El promovente debe acreditar su representación, en los términos del art. 87 del
      Código Fiscal del Estado.'
    cites:
    - source: retys
  - text: 'Tratándose de doble pago: a) Original de la declaración con la que se efectuó el doble pago. b) En caso
      de doble pago por INTERNET, copia del dispersado con el que se demuestre que el banco acreditó a la cuenta
      del Gobierno del Estado los pagos efecuados por el contribuyente. c) Estados de cuenta bancarios, en caso
      de que se solicite la devolución por depósito. d) Comprobantes fiscales que justifiquen el pago indebido.'
    cites:
    - source: retys
  - text: 'Tratandose de Impuestos Estatales: a) Copia de la Declración Ordinaria. b) Copia de la Declaración Complementaria.
      c) Papeles de trabajo utilizados para presenatción de la declaración ´´ordinaria´´ y de la declaración ´´complementaria´´.'
    cites:
    - source: retys
  - text: 'Tratandose del Impuesto sobre Remuneraciones: a) Concentrado de Nóminas.'
    cites:
    - source: retys
  - text: 'Tratandose de Impuestos Federales Coordinados: a) Solicitud de Devolución de Impuestos Federales ´´Formato
      32´´'
    cites:
    - source: retys
  - text: 'Tratándose de Derechos o Productos a una Dependencia: oficio del Titular de la Dependencia , en el que
      explique el motivo por el cual no se prestó el servicio o por el cual no se realizó la venta o arrendamiento
      del bien, así como su opinión sobre la procedencia de la devolución.'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la Recaudación de Rentas del Estado
    - Brinda información e instrucciones al solicitante
    - Presenta la solicitud y los documentos (con acuse para su sello de recibido)
    - Recibe la solicitud y revisa que estén completos los documentos del contribuyente, en caso de faltantes, otorga
      plazo de 5 días para que el contribuyente solvente
    - Si la documentación esta completa, le informa el tiempo establecido para la devolución
  notes: La Dirección de Ingresos devolverá a los contribuyentes, las cantidades pagadas indebidamente al Fisco
    Estatal.
