  modes:
  - name: Presencial
    steps:
    - Acurdir a la Recaudación de Rentas del Estado
    - Brinda información e instrucciones al solicitante
    - Presenta la solicitud y los documentos
    - Recibe la solicitud y revisa que estén completos los documentos del contribuyente, en caso de faltantes, otorga
      plazo para que el contribuyente solvente
    - Si la documentación esta completa, verifica la disponiblidad presupuestal, si hay fondos suficientes se procede
      al pago inmediato, de no ser así se informa al contribuyente y se agenda fecha para el pago.
  notes: La Dirección de Ingresos devolverá a los contribuyentes, las cantidades pagadas indebidamente al Fisco
    Estatal.
