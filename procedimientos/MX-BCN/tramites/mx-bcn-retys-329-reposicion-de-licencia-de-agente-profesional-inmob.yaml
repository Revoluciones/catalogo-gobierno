scenarios:
- name: Reposición por robo o extravío para persona física
  requirements:
  - text: Identificación oficial vigente del agente inmobiliario; en caso de ser extranjero, documento migratorio
      vigente que acredite residencia permanente.
    cites:
    - source: retys
  - text: Acta de robo o extravió ante la autoridad competente.
    cites:
    - source: retys
  - text: Pago de derechos.
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - Llenar la solicitud en línea, haciendo clic en el botón “Iniciar trámite”, o bien, capturarla de manera impresa.
    - Subir documentación en línea o presentar expediente con documentación completa en la dependencia.
    - Revisión de documentación recibida.
    - Realizar el pago de derechos, en caso de ser aprobada la solicitud.
    - Asignación de folio por parte del servidor público.
    - E-firma del Secretario de economía firma de resultado y emisión de constancia.
    - Notificación por correo electrónico al solicitante, indicando lugar, fecha y datos de contacto para la entrega
      de la constancia.
  notes: Proceso para solicitar la reposición del documento que acredite como Agente Profesional Inmobiliario en
    el Estado de Baja California.
