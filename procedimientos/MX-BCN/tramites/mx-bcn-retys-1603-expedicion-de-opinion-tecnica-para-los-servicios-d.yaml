scenarios:
- name: Expedición por Primera vez
  requirements:
  - text: Presentar el Formulario para la solicitud de Opinión Técnica (FRM-004 Rev 09 - Solicitud de Opinión Técnica)
      llenado y firmado, ya sea por el propietario del predio, el representante legal de la empresa propietaria
      o el gestor; en caso de ser este último deberá presentar carta poder simple otorgada por alguno de los dos
      primeros, anexando copia de identificaciones oficiales tanto del gestor como de quien otorga el poder.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11425
  - text: Constancia de No Adeudo para Desarrolladores vigente, expedida por CESPT
    cites:
    - source: retys
  - text: Recibo del pago total de Derechos de Conexión o Convenio de pago en parcialidades al corriente de Derechos
      de Conexión.
    cites:
    - source: retys
  - text: Recibo (s) predial(es) de los predios en estudio
    cites:
    - source: retys
  - text: Croquis de localización de la zona donde se ubica el predio a desarrollar
    cites:
    - source: retys
  - text: Recibo de pago por el servicio conforme a la Ley de Ingresos del Estado de Baja California vigente, cuya
      fecha de pago no exceda una antigüedad de 30 días naturales.
    cites:
    - source: retys
  - text: 'Documento para comprobar propiedad del predio en estudio, que puede ser UNO de los siguientes: • Escrituras
      notariadas o título de propiedad del predio en estudio, inscritas en el Registro Público de la Propiedad y
      de Comercio; • Título Agrario, para predios ejidales.'
    cites:
    - source: retys
  - text: En caso de que el propietario sea una persona moral, un fideicomiso o un ejidatario, además deberá presentar
      documento notariado (acta constitutiva, poder general, etc.) que otorgue al representante legal o fiduciario,
      poder para ejercer actos de administración.
    cites:
    - source: retys
  - text: 'Documento para verificar uso de suelo y densidad de población permitida, emitido por el Ayuntamiento
      correspondiente, que puede ser UNO de los siguientes: • Opinión Técnica de uso de suelo favorable vigente.
      • Constancia de zonificación de uso de suelo favorable vigente. • Dictamen de uso de suelo favorable vigente.'
    cites:
    - source: retys
  - text: 'Plano certificado o deslinde catastral del polígono con cuadro de construcción conforme a coordenadas
      de la ciudad: • En caso de utilización parcial del predio presentar plano de subdivisión, todos ellos autorizados
      por el Ayuntamiento correspondiente. • En caso de predios en régimen en condominio deberá presentar original
      de Certificación Cartográfica a nombre del propietario del predio, expedida por el Ayuntamiento correspondiente.'
    cites:
    - source: retys
  - text: Copia del proyecto de instalaciones hidrosanitarias para aquellos desarrollos comerciales e industriales
      que requieran un gasto de diseño mayor al establecido en la normatividad estatal vigente
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en copia, la cual debe ser legible y contener el documento completo.
    cites:
    - source: retys
  - text: Los planos deben presentarse en un tamaño que sea legible.
    cites:
    - source: retys
  - text: Las opiniones técnicas solo podrán ser solicitadas por el propietario del predio en estudio, por el representante
      legal del mismo, o por el representante legal del fiduciario en caso de un fideicomiso, debiéndose acreditar
      cualquiera de los supuestos en forma documental.
    cites:
    - source: retys
  - text: Si la documentación requerida no está completa, el trámite de opinión técnica se expedirá negativo.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público (CAP) de Oficinas Centrales
    - Pasar al área de cajas a realizar su pago para el trámite de Opinión Técnica, la persona de cajas le entregará
      su comprobante de pago
    - Pasar al área de Archivo y entregar todos los requisitos
    - La persona de Archivo revisa que los requisitos estén completos, en caso de no ser así, informa al ciudadano
      que no es posible realizar el trámite hasta que éstos se completen, indicando lo que falta
    - Con los requisitos completos, la persona de Archivo sella de recibido la copia del formulario FRM-004 Rev
      09 - Solicitud de Opinión Técnica, indicando la fecha de respuesta
    - Regresar al Área de Archivo por la respuesta a su trámite, en la fecha indicada
  notes: Primera vez
- name: Renovación
  requirements:
  - text: Presentar el Formulario para la solicitud de Opinión Técnica (FRM-004 Rev 09 - Solicitud de Opinión Técnica)
      llenado y firmado, ya sea por el propietario del predio, el representante legal de la empresa propietaria
      o el gestor; en caso de ser este último deberá presentar carta poder simple otorgada por alguno de los dos
      primeros, anexando copia de identificaciones oficiales tanto del gestor como de quien otorga el poder.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12749
  - text: Constancia de No Adeudo para Desarrolladores vigente, expedida por CESPT
    cites:
    - source: retys
  - text: Croquis de localización de la zona donde se ubica el predio a desarrollar
    cites:
    - source: retys
  - text: Si presentó Opinión Técnica de Uso de Suelo o Constancia de Zonificación de Uso de Suelo en la expedición
      por primera vez, anexar la renovación del documento
    cites:
    - source: retys
  - text: Opinión Técnica para los Servicios de Agua Potable y/o Alcantarillado Sanitario a renovar
    cites:
    - source: retys
  - text: Carta compromiso firmada por el propietario o representante legal, en donde bajo protesta de decir la
      verdad, haga constar que no ha habido modificación en la documentación que se proporcionó para obtener la
      Opinión Técnica que solicita renovar y que no es requerida para la renovación.
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en copia, la cual debe ser legible y contener el documento completo.
    cites:
    - source: retys
  - text: Si la documentación requerida no está completa, el trámite de opinión técnica se expedirá negativo.
    cites:
    - source: retys
