title: Expedición de Opinión Técnica para los Servicios de Agua Potable y/o Alcantarillado Sanitario
summary: Expedición de documento mediante el cual se indica si existe o no, la posibilidad de que la CESPT ofrezca
  el o los servicios a solicitud del interesado. Si es el caso, se establecen las condiciones a cumplir por parte
  del solicitante para que se le pueda otorgar el servicio.
