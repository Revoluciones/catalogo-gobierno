title: COFEPRIS-05-030 Aviso de Actualización de Datos del Establecimiento que Opera con Licencia Sanitaria para
  Servicios Urbanos de Fumigación, Desinfección y Control de Plagas, Establecimiento que Fabrica o Formula, Mezcla
  o Envasa Plaguicidas y/o Nutrientes Vegetales o Establecimiento que Fabrica Sustancias Tóxicos o Peligrosas
summary: Este trámite sirve para que el ciudadano informe a la autoridad sobre cambios administrativos que no afectan
  los datos de la licencia sanitaria, como por ejemplo personas autorizadas, domicilio fiscal etc., también te permite
  dar de baja las actividades del establecimiento entregando la licencia sanitaria emitida.
