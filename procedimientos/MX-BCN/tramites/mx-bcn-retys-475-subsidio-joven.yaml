title: Subsidio Joven
summary: Otorgar subsidios para los diferentes intereses y/o requerimientos a los jóvenes de 18 a 29 años que deseen
  realizar trámites para la Superación Profesional, así como viajes para competencias Nacionales, en el ámbito académico,
  del deporte, la Cultura y la Ciemcia.
