- name: Persona Física factibilidad
  requirements:
  - text: Escrito libre con firma autógrafa, en el que se señale el trámite solicitado, debiendo indicar domicilio,
      teléfono y correo electrónico para oír y recibir notificaciones.
    cites:
    - source: retys
  - text: 'Recibo de pago de derechos por el estudio y evaluación de factibilidad para prestar servicios ambientales:
      Prestador de servicios en materia de impacto ambiental.'
    cites:
    - source: retys
  - text: Copia simple de la identificación oficial de la persona interesada, legible y con vigencia activa.
    cites:
    - source: retys
  - text: Grado de licenciatura o estudios equivalentes, afines a la función por realizar, y currículo vitae.
    cites:
    - source: retys
  - text: Cédula profesional registrada ante el departamento de profesiones del Estado
    cites:
    - source: retys
  - text: Acreditar 80 horas de capacitación y entrenamiento en cursos, talleres, diplomados o posgrados en áreas
      relacionadas a la prevención y control de la contaminación al ambiente y riesgo ambiental
    cites:
    - source: retys
  - text: Acreditar capacitación y experiencia en el uso de herramientas para la evaluación del impacto ambiental
      y riesgo ambiental.
