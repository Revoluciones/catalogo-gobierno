    cites:
    - source: retys
  - text: En caso de que se actúe a través de apoderado o representante legal, presentar documental idónea, completa
      y nítida, mediante la cual se acredite como tal, vigente.
    cites:
    - source: retys
  - text: En caso de que se actúe a través de apoderado o representante legal, presentar copia simple de la identificación
      oficial de este, nítida y con vigencia activa.
    cites:
    - source: retys
