scenarios:
- name: Primera vez
  requirements:
  - text: Original y copia del formulario Solicitud de registro de camiones cisterna para transporte de agua residual
      tratada (FRM-021) debidamente llenado y firmado por el propietario o el representante legal, lo proporciona
      CESPT o lo puede obtener en la página de Internet de CESPT, las instrucciones para el llenado del formulario
      las puede obtener del documento INS-003, en la sección de Documentos Informativos
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11679
  - text: Copia del Acta Constitutiva.
    cites:
    - source: retys
  - text: Copia certificada del Poder legal para actos de administración, vigente, que acredite la personalidad
      del representante legal, en caso de NO ESTAR ESTABLECIDO en el Acta Constitutiva.
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial del INE,
      Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Copia de alta ante la Secretaría de Hacienda y Crédito Público.
    cites:
    - source: retys
  - text: Copia de Tarjeta de circulación vigente del camión-cisterna que se utilizará.
    cites:
    - source: retys
  - text: Copia de Póliza de aseguranza vigente del camión-cisterna que se utilizará.
    cites:
    - source: retys
  - text: Copia de Licencia de manejo vigente de chofer que operará el camión-cisterna.
    cites:
    - source: retys
  - text: Presentar el camión cisterna para reconocimiento.
    cites:
    - source: retys
  - text: Croquis de localización con descripción de las colindancias hacia los cuatro puntos cardinales.
    cites:
    - source: retys
  - text: Pagar los derechos correspondientes
    cites:
    - source: retys
  - text: Las copias deben ser LEGIBLES y contener el DOCUMENTO COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la Coordinación de Servicios de Saneamiento, ubicada en el edificio que se encuentra en la parte
      posterior izquierda de Oficinas Centrales de CESPT, presentar los requisitos y el camión-cisterna que se utilizará
    - El personal revisará si tienes todos los requisitos. Si falta algo, te dirán qué necesitas completar.
    - Inspeccionarán el camión cisterna para verificar su capacidad de almacenamiento.
    - Si todo está en orden, te entregarán el formulario de Solicitud de registro de camiones cisterna para transporte
      de agua residual tratada (FRM-021) sellado y firmado de validación.
    - Recibirás una Ficha de pago. Luego, dirígete al área de cajas, presenta la Ficha y efectúa el pago correspondiente.
      Al finalizar, te entregarán el Recibo de Pago.
    - Lleva el Recibo de Pago y los requisitos al área de Archivo.
    - Te darán una copia del formulario (FRM-021) con la certificación de recibido.
    - Posteriormente, el personal de la Coordinación de Servicios de Saneamiento se pondrá en contacto contigo para
      que acudas a firmar el contrato y te lo entreguen.
  notes: Primera vez
- name: Revalidación de contrato
  requirements:
