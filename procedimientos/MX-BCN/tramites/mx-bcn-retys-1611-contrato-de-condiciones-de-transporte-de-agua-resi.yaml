title: Contrato de Condiciones de Transporte de Agua Residual Tratada
summary: Documento en el que se establecen las condiciones bajo las cuales se realizará el transporte de agua residual
  tratada, del sitio de dotación al sitio de aprovechamiento, por medio de camiones-cisterna.
