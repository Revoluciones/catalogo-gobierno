  type: variable
  amount_mxn: null
  text: 'COSTO VARIABLE: Registro de transporte de agua residual tratada. incluye: cubicación de unidad y recepción,
    análisis de documentos: $2,361.09 pesos Revalidación anual del registro de transporte de agua residual tratada
    Incluye recepción de documentos y análisis de los mismos, verificación de cubicación de unidades: $2,418.94
