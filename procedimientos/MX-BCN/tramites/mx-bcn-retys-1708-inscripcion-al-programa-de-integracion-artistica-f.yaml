title: Inscripción al Programa de Integración Artística "Forjadores de Sueños"
summary: Que niñas, niños y jóvenes concursen anualmente por una beca de talleres, las cuales pueden ser música,
  danza, teatro y artes plásticas. Los jóvenes recibirán beca económica con monto fijo y asesoramiento en las mismas
  disciplinas con el propósito de desarrollar y potencializar su habilidad artística.
