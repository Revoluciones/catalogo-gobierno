scenarios:
- name: Derechohabientes IMSS, ISSSTE, ISSSTECALI, ISESALUD
  requirements:
  - text: Contar con expediente clínico vigente del IPEBC.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Una vez que termina su consulta ya sea en el área de psicología o psiquiatría (consulta externa o atención
      psiquiátrica continua), la persona podrá acudir al área de unirecepción ubicadas en consulta externa o atención
      psiquiátrica continua a solicitar su constancia de asistencia médica.
    - Se le solicita su carnet de citas, se revisa en el sistema electrónico del expediente clínico, hora de registro
      de ingreso y salida del servicio.
    - 'La persona de unirecepción realiza el llenado en el formato correspondiente con los siguientes datos: nombre
      completo, hora de registro inicial y hora de registro final; se imprime documento y solicita firma del médico
      en turno.'
  notes: PRESENCIAL
