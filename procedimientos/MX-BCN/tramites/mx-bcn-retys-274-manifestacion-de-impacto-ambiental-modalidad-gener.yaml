id: mx-bcn-retys-274-manifestacion-de-impacto-ambiental-modalidad-gener
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Manifestación de Impacto Ambiental Modalidad General
summary: 'Documento mediante el cual se evalúa la viabilidad ambiental de una obra o actividad, asegurando su cumplimiento
  con la normativa vigente. Por su complejidad, se dividieron en grupos: A) Obras o actividades señaladas en las
  fracciones II, IV, VIII, IX, X, XII y XIII del artículo 13 del Reglamento en la materia; B) Parques industriales;
  C) Sistemas de almacenamiento, confinamiento, recuperación, reciclaje, incineración, tratamiento o disposición
  de residuos de manejo especial (art. 13 fracc. V del regl.); D) Fraccionamientos habitacionales que se ubiquen
  fuera de los centros de población (art. 13 fracc. III del regl.); E) Pétreos (art. 13 fracc. VII del regl.); F)
  Obras o actividades ubicadas dentro de áreas naturales protegidas de competencia estatal y municipal (art. 13
  fracc. XI del regl.); G) Carreras fuera de carretera, Rally y paseos, utilizando vehículos automotores, y H) Tratamiento,
  confinamiento, o disposición de residuos sólidos urbanos.'
