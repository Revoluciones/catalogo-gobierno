      el escrito de solicitud.
    cites:
    - source: retys
  - text: Copia simple del Acta Constitutiva de la persona moral.
    cites:
    - source: retys
  - text: Copia simple del documento idoneo debidamente legalizado ante Notario Público en el cual se acredite a
      la nueva personalidad jurídica.
    cites:
    - source: retys
  - text: Copia simple de la identificación oficial de apoderado o representante legal de la persona moral, legible
      y con vigencia activa.
    cites:
