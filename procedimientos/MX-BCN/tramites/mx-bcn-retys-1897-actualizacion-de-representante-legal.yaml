title: Actualización de representante legal
summary: Revisión de las constancias que exhiba el interesado, a fin de determinar si son suficientes para reconocer
  la personalidad jurídica de aquel que estime pertinente para oír y recibir toda clase de notificaciones y documentos,
  así como para realizar los trámites y gestiones necesarias en su nombre y representación ante la Secretaría.
