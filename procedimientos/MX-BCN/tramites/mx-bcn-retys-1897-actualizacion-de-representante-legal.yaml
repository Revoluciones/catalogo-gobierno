scenarios:
- name: Persona Física
  requirements:
  - text: Escrito libre en el que señale claramente el trámite solicitado, debiendo indicar domicilio, teléfono
      y correo electrónico para oír y recibir notificaciones. Especificar las autorizaciones, permisos, licencias
      y/o registros otorgados por la dependencia y/o los trámites que se encuentren en proceso de evaluación, en
      los cuales solicita se le reconozca al apoderado y/o representante legal. Con firma autógrafa plasmada en
      el escrito de solicitud.
    cites:
    - source: retys
  - text: Copia simple del documento idoneo debidamente legalizado ante Notario Público en el cual se acredite a
      la nueva personalidad jurídica.
    cites:
    - source: retys
  - text: Copia simple de identificación oficial vigente del nuevo apoderado o representante legal.
    cites:
    - source: retys
  - text: Original y copia, la primera para la dependencia y la segunda para el ciudadano, como acuse de recibido.
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Ingresar al portal, dando clic al botón "iniciar trámite", ubicado en la parte inferior derecha.
    - Seleccionar el tipo de persona (física o moral) y capturar la información solicitada.
    - Subir los documentos solicitados vigentes.
    - Recepción y evaluación de la solicitud recibida por parte de la Secretaría.
    - Publicación de Resolución Administrativa en la página oficial de la Secretaría.
    - Acudir a las oficinas de la Secretaría de Medio Ambiente y Desarrollo Sustentable para la entrega y debida
      notificación de la Resolución Administrativa emitida por esta Autoridad. La notificación deberá ser recibida
      por el representante legal o apoderado legal quien deberá acreditar su personalidad jurídica conforme a la
      normatividad aplicable.
  - name: Presencial
    steps:
    - Consultar el trámite en RETyS y revisar los requisitos.
    - Integrar la documentación requerida conforme a los requisitos establecidos para el trámite.
    - Acudir a las oficinas de la Secretaría de Medio Ambiente y Desarrollo Sustentable, presentar en original y
      copia la solicitud del trámite, anexando la documentación correspondiente.
    - Recepción y evaluación de la solicitud recibida por parte de la Secretaría.
    - Publicación de Resolución Administrativa en la página oficial de la Secretaría.
    - Acudir a las oficinas de la Secretaría de Medio Ambiente y Desarrollo Sustentable para la entrega y debida
      notificación de la Resolución Administrativa emitida por esta Autoridad. La notificación deberá ser recibida
      por el representante legal o apoderado legal quien deberá acreditar su personalidad jurídica conforme a la
      normatividad aplicable.
  notes: Persona que requiere acreditar su personalidad jurídica.
