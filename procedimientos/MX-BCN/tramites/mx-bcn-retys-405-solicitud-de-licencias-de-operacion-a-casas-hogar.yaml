scenarios:
- name: Ciudadanía en general
  requirements:
  - text: 1. Llenar la solicitud oficial de licencia de operación proporcionada por la procuraduría de protección.
      Fundamento artículo 15 fracción i de la liaspnna.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/13630
  - text: 2. Presentar la documentación que acredite la personalidad jurídica, y legal constitución de la institución
      de asistencia social privada. Fundamento al artículo 15 fracción ii de la liaspnna.
    cites:
    - source: retys
  - text: 3. Autorización de constitución como institución de asistencia social privada emitido por la secretaría
      de bienestar de baja california. Fundamento artículo 15 fracción iii de la liaspnna.
    cites:
    - source: retys
  - text: 4. Copia de la licencia de uso de suelo de sus instalaciones. Fundamento artículo 15 fracción iv de la
      liaspnna.
    cites:
    - source: retys
  - text: 5. Presentar sus programas de promoción para la integración familiar, formación, educación, recreación,
      cultura y deporte de las niñas, niños y adolescentes. Fundamento artículo 15 fracción v de la liaspnna.
    cites:
    - source: retys
  - text: 6. Presentar esquema de financiamiento y programa de allegamiento de recursos que permitan una atención
      adecuada a las niñas, niños y adolescentes. Fundamento artículo 15 fracción vii de la liaspnna.
    cites:
    - source: retys
  - text: 7. Presentar el padrón y expediente personal de cada uno del personal directivo, administrativo y voluntario
      que prestara sus servicios en la institución de asistencia social privada. Fundamento artículo 15 fracción
      viii de la liaspnna.
    cites:
    - source: retys
  - text: 8. Acreditar satisfactoriamente la visita de supervisión que realice la procuraduría de protección. Fundamento
      artículo 15 fracción vi de la liaspnna.
    cites:
    - source: retys
  - text: 'Nota: se deberá presentar un dictamen o peritaje elaborado por autoridades de protección civil del estado,
      en el que se acredite que las instalaciones de la institución de asistencia social privada cubran las condiciones
      de seguridad necesaria para un adecuado funcionamiento. Fundamento artículo 20 de la liaspnna.'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Llenar la solicitud oficial de licencia de operación proporcionada por la procuraduría de protección. Fundamento
      artículo 15 fracción i de la liaspnna.
    - El usuario debe presentarse a las oficinas de la coordinación de asistencia privada de la procuraduría de
      protección, en mexicali, tijuana (tecate y rosarito serán atendidos en tijuana) según corresponda y ensenada
      (san quintín será atendido en ensenada) en donde podrán obtener el documento oficial “solicitud de licencia
      de operación para instituciones de asistencia social privada para niñas, niños y adolescentes” para su llenado.
    - Una vez que se presente la solicitud de la licencia debidamente requisitada, se revisará la documentación
      presentada y en su caso se entregará un tanto del formato de recepción de documentos por el usuario.
    - El usuario entregará original y copia simple de la “solicitud de licencia de operación para instituciones
      de asistencia social privada para niñas, niños y adolescentes” y los documentos que la acompañen.
    - Presentar la documentación que acredite la personalidad jurídica, y legal constitución de la institución de
      asistencia social privada. fundamento al artículo 15 fracción ii de la liaspnna.
    - 'Para la acreditación de la personalidad jurídica del representante legal cualquiera de estos documentos:
      acta constitutiva debidamente protocolizada ante notario público, con copia simple para su cotejo, e inscrita
      en el registro público de la propiedad y del comercio. acta de asamblea debidamente protocolizada ante notario
      público, con copia simple para su cotejo. poder notariado, en que se falte al promovente para realizar el
      trámite referido.'
    - Acta constitutiva debidamente protocolizada ante notario público, con copia simple para su cotejo, e inscrita
      en el registro público de la propiedad y del comercio.
    - Autorización de constitución como institución de asistencia social privada emitido por la secretaría de bienestar
      de baja california, en los términos que disponga la ley de asistencia social para el estado de baja california
      y demás ordenamientos aplicables. Fundamento artículo 15 fracción iii de la liaspnna.
    - Presentar copia de la licencia de uso de suelo de sus instalaciones. Fundamento artículo 15 fracción iv de
      la liaspnna.
    - Presentar sus programas de promoción para la integración familiar, formación, educación, recreación, cultura
      y deporte de las niñas, niños y adolescentes. Fundamento artículo 15 fracción v de la liaspnna.
    - Presentar esquema de financiamiento y programa de allegamiento de recursos que permitan una atención adecuada
      a las niñas, niños y adolescentes. Fundamento artículo 15 fracción vii de la liaspnna.
    - Presentar el padrón y expediente personal de cada uno del personal directivo, administrativo y voluntario
      que prestara sus servicios en la institución de asistencia social privada. Fundamento artículo 15 fracción
      viii de la liaspnna.
    - Acreditar satisfactoriamente la visita de supervisión que realice la procuraduría de protección. Fundamento
      artículo 15 fracción vi de la liaspnna.
  notes: Recopilación de documentos para la licencia de operación para instituciones de asistencia social privada
legal_basis:
