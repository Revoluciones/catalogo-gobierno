id: mx-bcn-retys-405-solicitud-de-licencias-de-operacion-a-casas-hogar
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Solicitud de Licencias de Operación a Casas Hogar
summary: Que las instituciones de asistencia social privada en el estado interesadas en brindar acogimiento residencial
  a niñas, niños y adolescentes sin cuidados parentales, cuenten con licencia de operación expedida por la Procuraduría
  de protección de niñas, niños y adolescentes para el estado de Baja California, para su operación y legal funcionamiento
  como institución de asistencia social privada.
authority:
  name: Sistema para el Desarrollo Integral de la Familia
