title: COFEPRIS-05-002-G Solicitud de modificación a la licencia sanitaria de establecimiento de insumo para la
  salud droguería o farmacia homeopática (con preparación de medicamentos homeopáticos)
summary: Cuando el ciudadano requiera realizar modificaciones técnicas (ampliar o eliminar líneas de comercialización
  o preparación de medicamentos magistrales u oficinales) o administrativas (cambio de propietario, razón social,
  así como de los cambios administrativos por cambio en el nombre de la calle, colonia, código postal, etc.) a la
  licencia sanitaria previamente expedida.
