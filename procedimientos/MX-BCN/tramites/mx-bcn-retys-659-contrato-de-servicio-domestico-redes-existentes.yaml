scenarios:
- name: Propietario
  requirements:
  - text: Inspección de factibilidad de servicios positiva emitida por la CESPT, la cual se puede tramitar llamando
      al teléfono 073.
    cites:
    - source: retys
  - text: 'Documento que compruebe la propiedad, posesión o titularidad del predio, puede ser UNO de los siguientes:
      Carta de inscripción del Registro Público (máx. 1 año), Constancia de posesión, Carta de residencia, Juicio
      de prescripción (máx. 1 año), Recibo del impuesto predial (máx. 1 año)'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio, puede ser UNA de las siguientes:
      Credencial del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: 'Si la vialidad es de asfalto o concreto: Permiso de Ruptura de Pavimento, VIGENTE, del Ayuntamiento correspondiente'
    cites:
    - source: retys
  - text: 'Documento para localización del predio, EN CASO DE QUE EL DOCUMENTO PARA COMPROBAR PROPIEDAD NO LO INDIQUE
      CLARAMENTE: Asignación de Número Oficial expedido por el Ayuntamiento correspondiente.'
    cites:
    - source: retys
  - text: Pago de derechos
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en original y copia, la cual debe ser LEGIBLE y contener el DOCUMENTO
      COMPLETO
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acuda a cualquier Centro de Atención al Público (CAP) de CESPT y solicite un turno
    - Espere su turno en el área de Módulos de Atención Personalizada (MAP)
    - La persona del MAP revisará que se cumpla con todos los requisitos, si no están completos, le informará que
      no es posible realizar el trámite hasta que éstos se completen, indicándole que es lo que falta.
    - Con lo requisitos completos, la persona del MAP elaborará el Presupuesto de Obra que corresponda al servicio
      solicitado
    - La persona del MAP le explicará las opciones y términos de pago disponibles
    - Seleccione la forma de pago que se ajuste a sus posibilidades
    - Una vez seleccionada la forma de pago, la persona del MAP le entregará el Presupuesto y el Contrato Administrativo
      para que los firme
    - Firme los documentos
    - Pase a pagar a cajas
    - 'La persona de cajas le entregará: Comprobante de pago y Convenio de liquidación de obra'
  notes: Propietario
- name: Representante legal
  requirements:
  - text: Inspección de factibilidad de servicios positiva emitida por la CESPT, la cual se puede tramitar llamando
      al teléfono 073.
    cites:
    - source: retys
  - text: 'Documento que compruebe la propiedad, posesión o titularidad del predio, puede ser UNO de los siguientes:
      Carta de inscripción del Registro Público (máx. 1 año), Constancia de posesión, Carta de residencia, Juicio
      de prescripción (máx. 1 año), Recibo del impuesto predial (máx. 1 año)'
    cites:
    - source: retys
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el propietario del predio,
      puede ser UNO de los siguientes: Poder Notarial, Carta poder ante Notario Público, Corredor Público o Fedatario
      público, Carta Poder simple firmada por el propietario del predio y por dos testigos, que incluya copia de
      las identificaciones oficiales de los testigos, cuya antigüedad no exceda los seis meses'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial del INE,
      Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: 'Si la vialidad es de asfalto o concreto: Permiso de Ruptura de Pavimento, VIGENTE, del Ayuntamiento correspondiente'
    cites:
    - source: retys
  - text: 'Documento para localización del predio, EN CASO DE QUE EL DOCUMENTO PARA COMPROBAR PROPIEDAD NO LO INDIQUE
      CLARAMENTE: Asignación de Número Oficial expedido por el Ayuntamiento correspondiente.'
    cites:
    - source: retys
  - text: Pago de derechos
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en original y copia, la cual debe ser LEGIBLE y contener el DOCUMENTO
      COMPLETO
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acuda a cualquier Centro de Atención al Público (CAP) de CESPT y solicite un turno
    - Espere su turno en el área de Módulos de Atención Personalizada (MAP)
    - Cuando sea su turno, la persona del MAP revisará que se cumpla con todos los requisitos, si no están completos,
      le informará que no es posible realizar el trámite hasta que éstos se completen, indicándole que es lo que
      falta.
    - Con lo requisitos completos, la persona del MAP elaborará el Presupuesto de Obra que corresponda al servicio
      solicitado
    - La persona del MAP le explicará las opciones y términos de pago disponibles
    - Seleccione la forma de pago que se ajuste a sus posibilidades
    - Una vez seleccionada la forma de pago, la persona del MAP le entregará el Presupuesto y el Contrato Administrativo
      para que los firme
    - Firme los documentos
    - Pase a pagar a cajas
    - 'La persona de cajas le entregará: Comprobante de pago y Convenio de liquidación de obra'
