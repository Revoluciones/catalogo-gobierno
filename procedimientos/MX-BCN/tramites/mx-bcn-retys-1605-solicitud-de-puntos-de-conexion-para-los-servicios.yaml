title: Solicitud de Puntos de Conexión para los Servicios de Agua Potable y/o Alcantarillado Sanitario
summary: Expedición de oficio indicando la ubicación de los puntos de conexión para la obtención de los servicios
  de agua potable y alcantarillado sanitario.
authority:
  name: Comisión Estatal de Servicios Públicos de Tijuana
