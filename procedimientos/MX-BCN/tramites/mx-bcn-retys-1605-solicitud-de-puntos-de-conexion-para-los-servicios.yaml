channels:
- presencial
offices:
- municipality: Tijuana
  name: CAP Oficinas Centrales
  address: 'Blvd. Federico Benítez #4057, Col. 20 de Noviembre, Tijuana, 22430'
scenarios:
- name: General
  requirements:
  - text: Copia de Opinión Técnica positiva actual para agua potable y alcantarillado, emitida por el Organismo.
    cites:
    - source: retys
  - text: 'Documento que otorgue poder para realizar el trámite, en caso de que la persona que gestiona el servicio
      sea el proyectista o el representante legal del propietario del predio, que puede ser uno de los siguientes
      documentos: Carta Poder otorgada por el propietario ante Notario Público o Corredor Público, en caso de que
      el que gestione el servicio sea representante legal, Carta Poder simple otorgada por el propietario, cuya
      fecha de expedición no exceda los seis meses de antigüedad, en caso de que el que gestione el servicio sea
      el proyectista.'
    cites:
    - source: retys
  - text: Original y copia del Formato de Solicitud de Puntos de Conexión (FRM-006) llenado, haciendo referencia
      al Oficio de la Opinión Técnica positiva vigente otorgada para el predio con clave catastral y superficie
      de ubicación
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11477
  - text: Las copias deben ser legibles y contener el documento completo
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público (CAP) de Oficinas Centrales
    - Pasar al área de Archivo y entregar la Solicitud de puntos de conexión (FRM-006) y los requisitos
    - La persona del área de Archivo revisará que cumpla con toda la Documentación Requerida, si no está completa,
      informará que no es posible realizar el trámite hasta que ésta se complete
    - Con los requisitos completos, la persona de Archivo imprime certificación de recibido en el formato (FRM-006),
      proporcionando al usuario un plazo de atención para la respuesta
    - Una vez realizado el estudio técnico para definir los puntos de conexión, la Coordinación de Proyectos de
      Obra, se comunica vía telefónica con la persona solicitante para informarle que puede pasar por el documento
    - La persona solicitante deberá presentarse a la Coordinación de Proyectos de Obra a recoger el Oficio de Puntos
      de Conexión acompañado de los respectivos anexos
  notes: General
