title: Contrato de Servicios para el Sector Comercial e Industrial
summary: Contratar los servicios del suministro de agua potable, así como el servicio de alcantarillado sanitario
  el cual contempla la recolección, conducción, alejamiento, tratamiento y disposición final de las aguas residuales,
  para usuarios del sector comercial e industrial.
