scenarios:
- name: LOCAL INDIVIDUAL, BODEGA O NAVE INDUSTRIAL
  requirements:
  - text: Todos los documentos deben presentarse en original y copia, la cual debe ser legible y contener el documento
      completo..
    cites:
    - source: retys
  - text: Inspección de Factibilidad positiva emitida por la CESPT, la cual se puede tramitar llamando al teléfono
      073.
    cites:
    - source: retys
  - text: Hacer el pago del depósito en garantía correspondiente al importe de los derechos de tres meses de consumo
      real o estimado.
    cites:
    - source: retys
  - text: 'Carta del Centro Comercial o Parque Industrial, si aplica, que incluya: a) clave catastral, b) nombre
      del centro, c) domicilio, d) nombre del propietario o arrendatario, e) número del local, bodega o nave industrial.'
    cites:
    - source: retys
  - text: Contrato de arrendamiento, si aplica.
    cites:
    - source: retys
  - text: 'Documento para comprobar propiedad del local, bodega o nave industrial si es el caso, puede ser UNO de
      los siguientes: Carta de inscripción del Registro Público de la Propiedad y de Comercio (escrituras) con fecha
      de registro no mayor a un año de antigüedad, Juicio de prescripción positiva inscrito en el Registro Público
      de la Propiedad y de Comercio con fecha de registro no mayor a un año de antigüedad, Recibo del impuesto predial,
      con fecha de emisión no mayor a un año de antigüedad'
    cites:
    - source: retys
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el propietario del predio,
      si la persona que realiza el trámite no es el propietario, puede ser uno de los siguientes: Poder Notarial;
      Carta Poder ante notario público, corredor público o fedatario público; Carta Poder simple firmada por el
      propietario del predio y por dos testigos, que incluya copia de las identificaciones oficiales de los testigos,
      cuya antigüedad no exceda los seis meses; Acta constitutiva en la que se acredite la personalidad de quien
      gestiona el servicio.'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial del INE,
      Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Hacer el pago correspondiente
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a cualquier Centro de Atención al Público (CAP) de CESPT
    - Pasar al área de Módulos de Atención Personalizada (MAP) y esperar su turno
    - Cuando llegue su turno, la persona del MAP revisará que se cumpla con todos los requisitos, si no están completos
      informa al ciudadano que no es posible realizar el trámite hasta que estos se completen, indicando que es
      lo que falta
    - Con los requisitos completos, la persona del MAP elaborará el Presupuesto de Obra que corresponda al servicio
      solicitado
    - La persona del MAP le explicará las diferentes alternativas y términos de pago disponibles
    - Seleccione la forma de pago que se ajuste a sus posibilidades.
    - La persona del MAP le hará entrega del Contrato Administrativo y el Presupuesto de Obra para que los revise
      y los firme.
    - 'Una vez firmados los documentos deberá pasar a cajas a realizar el pago correspondiente, en donde le entregarán
      dos documentos: 1) Comprobante de pago y 2) Convenio de liquidación de obra.'
  notes: LOCAL INDIVIDUAL, BODEGA O NAVE INDUSTRIAL donde el agua no es parte del proceso de producción.
- name: DESARROLLO COMERCIAL O INDUSTRIAL
  requirements:
  - text: Todos los documentos deben presentarse en original y copia, la cual debe ser legible y contener el documento
      completo.
    cites:
    - source: retys
  - text: Inspección de factibilidad positiva expedida por CESPT, la cual se puede tramitar llamando al teléfono
      073.
    cites:
    - source: retys
  - text: Pago del depósito en garantía correspondiente al importe de los derechos de tres meses de consumo real
      o estimado.
    cites:
    - source: retys
  - text: 'En caso de que el análisis de la inspección de factibilidad indique que la infraestructura existente
      no cubrirá la demanda del usuario, se requerirá: a) Oficio de Opinión Técnica positiva vigente, expedido por
      CESPT; b) Oficio de Puntos de Conexión en caso de que no existan redes frente al predio, expedido por CESPT;
      c) Oficio de Revisión y aprobación del proyecto de agua potable y alcantarillado sanitario, expedido por CESPT.'
    cites:
    - source: retys
  - text: 'Documento para verificar uso de suelo y densidad de población permitida, emitido por el Ayuntamiento
      correspondiente, puede ser UNO de los siguientes: Opinión Técnica de uso de suelo favorable vigente, Constancia
      de zonificación y uso de suelo favorable vigente, Dictamen de Uso de Suelo favorable vigente.'
    cites:
    - source: retys
  - text: Licencia de construcción vigente emitida por el Ayuntamiento correspondiente.
    cites:
    - source: retys
  - text: 'Documentos para facturación con datos fiscales: Copia de Acta Constitutiva, si el propietario es una
      persona moral; copia de Alta ante la Secretaría de Hacienda y Crédito Público.'
    cites:
    - source: retys
  - text: 'Documento para comprobar la propiedad, posesión o titularidad del predio, que puede ser UNO de los siguientes:
      Carta de Inscripción del Registro Público de la Propiedad y de Comercio del predio, con fecha de registro
      no mayor a un año de antigüedad; Recibo del impuesto predial vigente, con fecha de emisión no mayor a un año
      de antigüedad.'
    cites:
    - source: retys
  - text: 'Documento para localización del predio, EN CASO DE QUE EL DOCUMENTO PARA COMPROBAR PROPIEDAD NO LO INDIQUE
      CLARAMENTE: Asignación de Número Oficial expedido por el Ayuntamiento correspondiente.'
    cites:
    - source: retys
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el propietario del predio,
      puede ser UNO de los siguientes: Poder Notarial; Carta Poder ante notario público, corredor público o fedatario
      público; Carta Poder simple firmada por el propietario del predio y por dos testigos, que incluya copia de
      las identificaciones oficiales de los testigos, cuya antigüedad no exceda los seis meses, si la persona que
      gestiona no es el propietario'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial del INE,
      Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: 'Si la vialidad es de ASFALTO O CONCRETO, se deberá presentar: Permiso de Ruptura de Pavimento vigente
      expedido por el Ayuntamiento correspondiente'
    cites:
    - source: retys
  - text: Fianza de garantía vigente para los casos de convenio de pagos.
    cites:
    - source: retys
  - text: Pago correspondiente
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la Coordinación de Desarrolladores y Gobierno en Oficinas Centrales de CESPT
    - La persona de la Coordinación de Desarrolladores y Gobierno revisará que se cumpla con todos los requisitos,
      si no están completos informa al ciudadano que no es posible realizar el trámite hasta que estos se completen,
      indicando lo que falta
    - Con los requisitos completos, la persona de la Coordinación de Desarrolladores y Gobierno elaborará el Presupuesto
      de Obra que corresponda al servicio solicitado
    - La persona de la Coordinación de Desarrolladores y Gobierno le explicará al ciudadano las diferentes alternativas
      y términos de pago disponibles
    - Elegir la forma de pago que se ajuste a sus posibilidades.
    - La persona de la Coordinación de Desarrolladores y Gobierno le entregará el Contrato Administrativo y el Presupuesto
      de Obra para que los revise y los firme.
    - Firme los documentos que le entregó la persona del MAP
    - 'Pase a cajas a hacer el pago correspondiente, en donde le entregarán dos documentos: 1) Comprobante de pago
      y 2) Convenio de liquidación de obra.'
  notes: DESARROLLO COMERCIAL O INDUSTRIAL
