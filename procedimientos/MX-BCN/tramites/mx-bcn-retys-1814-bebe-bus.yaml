branch: ejecutivo
kind: tramite
title: Bebé Bus
summary: Proyecto de atención itinerante a primera infancia enfocado en la población en contexto de migración y
  vulnerabilidad. Brinda sesiones de juego no estructuradas para niñas y niños de 0 a 3 años a fin de promover la
  estimulación temprana, así mismo se imparten platicas con enfoque en crianza respetuosa y apego seguro a los cuidadores.
authority:
  name: Sistema para el Desarrollo Integral de la Familia
