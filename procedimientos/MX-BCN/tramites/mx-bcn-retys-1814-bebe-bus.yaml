requires_inspection: false
channels:
- presencial
offices:
- municipality: Mexicali
  name: Departamento de Desarrollo de Habilidades Socioemocionales Mexicali
  address: 'Calzada Cuahtémoc #384, Las Fuentes, Mexicali, 21230'
scenarios:
- name: Requisitos
  requirements:
  - text: Presentar menor de edad de 0 a 3 años con 11 meses de edad, acompañado de padre, madre o cuidador.
    cites:
    - source: retys
  - text: Fungir como persona cuyas condiciones sociales, económicas o familiares los colocan en situación de vulnerabilidad,
      riesgo o desventaja social.
    cites:
    - source: retys
  - text: Llenar ficha de inscripción para recibir el servicio.
    cites:
    - source: retys
  - text: Firmar la lista de asistencia, concluida la plática.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Presentarse en la dependencia ó comunicarse vía telefónica a solicitar la atención.
    - Proponer fecha de interés para recibir el servicio.
    - Cotejar agenda comprometida con la fecha solicitada.
    - Confirmar o descartar la fecha solicitada.
    - Identificar que el lugar cuente con el espacio adecuado para estacionar el autobús
    - Presentarse el día y hora acordada para brindar el servicio, con un minimo de dos infancias acompañadas de
      su padre, madre y/o cuidador.
    - Llenar ficha de inscripción.
    - Brindar el servicio.
    - Firmar y sellar lista de asistencia
    - En caso de tratarse de una institución, solicitar firma y el sello en la lista de asistencia.
  notes: 'El servicio no requiere requisitos documentales, sin embargo, es necesario cumplir con lo siguiente:'
