title: Departamento de atención psicológica
summary: El Departamento de Psicológica brindar atención psicológica a mujeres víctimas de violencia, con el objetivo
  de proporcionarles herramientas que les permita afrontar crisis emocionales, fortalecer su bienestar psicológico
  y favorecer la identificación y ruptura del ciclo de violencia en el que se encuentran inmersas. Como parte de
  los servicios de atención integral, el Departamento cuenta tambíen con el Programa de Área Lúdica, el cual brinda
  atención y cuidado a las hijas e hijos de las mujeres víctimas de violencia con base en la perspectiva de género,
  igualdad y respeto.
