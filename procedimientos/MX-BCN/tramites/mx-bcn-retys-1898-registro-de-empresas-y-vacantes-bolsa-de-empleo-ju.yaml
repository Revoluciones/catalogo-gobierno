title: Registro de Empresas y Vacantes (Bolsa de Empleo Juvenil)
summary: Conecta a tu empresa con el talento de las juventudes de Baja California. Inscribe tu negocio para publicar
  tus ofertas de trabajo sin costo y recibir perfiles de jóvenes acordes a tus necesidades.
authority:
  name: Instituto de la Juventud del Estado de Baja California
