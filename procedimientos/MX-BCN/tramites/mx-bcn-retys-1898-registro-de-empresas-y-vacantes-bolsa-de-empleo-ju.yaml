  type: gratuito
  amount_mxn: null
  text: SIN COSTO
  as_of: '2026-11-06'
  cites:
  - source: retys
deadlines:
- what: para_prevenir
  text: 'Tiempo que tiene el organismo para prevenir: 5 Días Hábiles'
  cites:
  - source: retys
positive_silence: false
requires_inspection: false
channels:
- en_linea
offices:
- municipality: Mexicali
  name: Oficina Mexicali
  address: 'BLVD. Adolfo López Mateos y Calzada Milton Castellanos #S/N, Fraccionamiento Caliss, Mexicali, 21010'
scenarios:
- name: Ofrezco Empleo (Para empresas)
  requirements:
  - text: 'CUENTA ACTIVA DE LLAVE BC: Necesaria para acceder a la Ventanilla Digital y completar el formulario de
      registro de tu empresa.'
    cites:
    - source: retys
  - text: 'CONSTANCIA DE SITUACIÓN FISCAL: Documento en formato PDF, con una antigüedad de expedición no mayor a
      3 meses, para validar la formalidad y el estatus activo de tu empresa. Esto nos ayuda a garantizar un entorno
      laboral seguro para las juventudes de Baja California.'
    cites:
    - source: retys
  - text: 'INFORMACIÓN DE LA VACANTE: Tener a la mano los datos del puesto que ofreces (título, sueldo, horario,
      ubicación y descripción del perfil buscado) para llenar tu formulario en línea.'
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - 'INICIA SESIÓN Y COMPLETA EL REGISTRO: Ingresa a la Ventanilla Digital utilizando tu cuenta de Llave BC y
      llena el formulario con los datos de contacto de tu empresa y la información detallada de la vacante que ofreces.'
    - 'SUBE TUS DOCUMENTOS: Adjunta en la plataforma tu Constancia de Situación Fiscal vigente (en formato PDF y
      con una antigüedad no mayor a 3 meses) para validar el estatus activo y la formalidad de tu negocio.'
    - 'ESPERA LA VALIDACIÓN Y PUBLICACIÓN: El personal del INJUVEN revisará tu información y constancia fiscal.
      Una vez aprobadas, tu oferta de empleo será integrada y publicada en el Catálogo Quincenal de Vacantes para
      conectarte con el talento joven del estado.'
  notes: Para empleadores/as que desean publicar vacantes y encontrar talento joven. Registra los datos de tu empresa
    y las características del puesto que ofreces.
