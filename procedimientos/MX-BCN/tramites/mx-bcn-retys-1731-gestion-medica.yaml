scenarios:
- name: Gestión inmediata
  requirements:
  - text: Identificación oficial
    cites:
    - source: retys
  - text: Poder legal en caso de representación.
    cites:
    - source: retys
  - text: Documentos relativa a la atención demorada puede incluir tarjeta de seguro social, numero de afiliacion,
      hojas de referencia.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a oficina con identificación.
    - Exponer motivo de queja
    - Establecer claramente la solicitud que hace para así obtener un resultado especifico.
    - Se elabora documento de solicitud a institución involucrada.
    - Espera de aproximadamente 3 dias habiles para obtener respuesta de la institución involucrada.
  notes: Se realiza en aquellos casos de demora o negativa de servicios médicos y cuando el estado de salud del
    paciente requiere atención pronta para evitar riesgos adicionales.
