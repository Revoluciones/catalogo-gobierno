scenarios:
- name: Ciudadania en general
  requirements:
  - text: Clave única de registro de población (CURP)
    cites:
    - source: retys
  - text: INE (Copia)
    cites:
    - source: retys
  - text: Comprobante de ingresos (Copia)
    cites:
    - source: retys
  - text: Menor de edad CURP menor y del tutor (copia)
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Presentarse en la dependencia o comunicarse vía telefónica a solicitar la atención
    - Se presenta el ciudadano a cita para realizar estudio socioeconómico y entrega de documentacion.
    - Se recibe y revisa documentación para la integración de expediente
    - Se entrega expediente administrativo a Supervisión Municipal del Centro Psicológico
    - Se asigna expediente administrativo a psicoterapeuta.
    - Agenda cita para inicio de servicio psicoterapéutico.
    - Al presentarse el usuario se imparte el servicio psicoterapéutico, éste se agenda una vez a la semana durante
      8 sesiones con una duración de 50 minutos cada una de ellas.
  notes: Recopilación de documentos
