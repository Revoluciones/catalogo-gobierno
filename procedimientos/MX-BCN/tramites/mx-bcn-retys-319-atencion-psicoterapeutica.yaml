  type: variable
  amount_mxn: 150.0
  text: 'COSTO VARIABLE: El costo de la sesion de atención psicoterapeutica individual y familiar, para padres adoptivos,
    asi como individual y familiar extramuros, sera de $150.00 pesos por sesión. Cuando el interesado manifieste
    una imposibilidad para cubrir el pago, se realizara estudio socieconómico.'
