  modes:
  - name: Presencial
    steps:
    - El usuario por si propio o por un responsable técnico, debe recabar los datos para sustentar la solicitud
      de la prorroga
    - Realizar el pago y presentar copia a la hora de presentar la solicitud de la prorroga.
    - Presentar la solicitud en ONCA agregando el sustento técnico suficiente para la prórroga.
    - ONCA recibirá y revisara el documento en caso de ser necesario solicitara información adicional y/o en su
      caso programara una visita confirmativa de datos.
    - Una vez que ONCA evalué la información y en su caso verifique los datos técnicos emitirá su dictamen y/o la
      prórroga.
    - Se le comunicara al usuario para que pase por su prórroga.
  notes: Carta poder notariada
