scenarios:
- name: Cambio de Plantel
  requirements:
  - text: Contar con matrícula
    cites:
    - source: retys
  - text: Contar con aviso de baja del plantel anterior
    cites:
    - source: retys
  - text: Realizar pago por concepto de la movilidad
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Solicitar baja en el plantel anterior
    - Acudir al Plantel donde desean ingresar
    - Entregar aviso de baja del plantel anterior en el plantel que desea ingresar
    - Se revisa su cardex y se procede a realizar recibo de pago
    - Recibo de Pago por concepto de movilidad
  notes: El alumno que cuenta con matrícula en COBACH BC. El cambio de plantel está sujeto a la disponibilidad en
    el plantel al que desee ingresar.
- name: Reingreso
  requirements:
  - text: Contar con matrícula
    cites:
    - source: retys
  - text: Realizar el pago por concepto de la movilidad
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Plantel donde desean ingresar
    - Se revisa su cardex y se procede a realizar recibo de pago
    - Recibo de Pago por concepto de movilidad
  notes: El alumno cuenta con matrícula en COBACH BC y desea continuar sus estudios. El reingreso está sujeto a
    la disponibilidad en el plantel al que desee.
- name: Convalidación por Cambio de Plan de Estudios
  requirements:
  - text: Contar con matrícula
    cites:
    - source: retys
  - text: Realizar el pago por concepto de la movilidad
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Plantel donde desean ingresar
    - Se revisa su cardex y se procede a realizar recibo de pago
    - Recibo de Pago por concepto de movilidad
  notes: El alumno que cuenta con matrícula en COBACH BC y quiera continuar sus estudios pero el plan de estudios
    vigente es diferente al último que cursó. La convalidación está sujeta a la disponibilidad en el plantel al
    que desee ingresar.
