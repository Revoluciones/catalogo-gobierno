scenarios:
- name: Modalidad padrón
  requirements:
  - text: Formato Único
    cites:
    - source: retys
  - text: Copia de la identificación oficial vigente con domicilio en Baja California (credencial para votar, pasaporte
      mexicano, licencia de conducir emitida en el estado de baja california, vigente y que señale domicilio)
    cites:
    - source: retys
  - text: Copia del comprobante de domicilio no mayor a 3 meses (agua, energía eléctrica, predial o carta de residencia
      emitida por autoridad municipal)
