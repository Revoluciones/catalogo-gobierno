  - text: Comprobante de domicilio (Copia)
    cites:
    - source: retys
  - text: Comprobante de ingresos de todas las personas del hogar que laboren.
    cites:
    - source: retys
  - text: Solicitud (original)
    cites:
    - source: retys
  - text: Fotografía infantil del menor (original)
    cites:
    - source: retys
  - text: Certificado médico (original)
    cites:
    - source: retys
  - text: Clave Única de Registro de Población (CURP)
    cites:
    - source: retys
  - text: Registro Federal de Contribuyentes (RFC)
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El ciudadano podrá realizar una cita para solicitar informes del programa y entrega de documentos.
    - Acudir a las oficinas de DIF estatal para entregar los requisitos
    - Personal de DIFBC revisará que los documentos se encuentren completos y en orden, y se le entregará formato
      de solicitud de apoyo.
    - El ciudadano deberá llenar la solicitud en oficinas de DIF estatal
    - Dar respuesta a estudio socioeconómico, el cual será aplicado por personal de DIFBC
    - Personal de DIFBC evaluará conforme a las Reglas de Operación del programa la documentación entregada, la
      solicitud y el estudio socioeconómico y el espacio disponible en el Centro de Atención Infantil solicitado
    - Si es aprobado personal de DIFBC dará de alta en el sistema y entregará formatos para firma del ciudadano
      y se le proporcionará copia
    - Personal de DIFBC le indicará la forma adecuada del llenado de las listas de asistencia del niño/niña
    - El ciudadano presentará dicho comprobante al Centro de Atención Infantil indicado
    - El ciudadano presentará al niño/niña en el Centro de Atención Infantil donde firmará las listas de asistencia
      diariamente
  notes: Recopilación de documentos para el servicio
