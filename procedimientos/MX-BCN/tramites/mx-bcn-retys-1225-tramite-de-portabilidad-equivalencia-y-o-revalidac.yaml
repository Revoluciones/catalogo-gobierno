summary: Trámite donde se reconocen los estudios realizados en otros Subsistemas de Educación Media Superior o en
  el extranjero, y desea ingresar a continuar sus estudios en COBACH BC. Las fechas establecidas para dicho trámite
  se publican en http://www.cobachbc.edu.mx/ (Enero y Julio).
