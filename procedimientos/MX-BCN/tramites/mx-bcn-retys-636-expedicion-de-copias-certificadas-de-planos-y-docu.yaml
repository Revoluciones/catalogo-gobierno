title: Expedición de Copias Certificadas de Planos y Documentos
summary: Cuando el usuario requiere planos de predios certificados para usos legales o que deba de dar fe que los
  planos son auténticos, puede solicitar copia de planos de predios en papel bond, certificados por la secretaría
  que son copia fiel de los originales que se archivan en las oficinas de SIDURT.
