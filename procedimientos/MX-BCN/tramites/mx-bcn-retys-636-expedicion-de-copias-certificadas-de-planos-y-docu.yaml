  modes:
  - name: Presencial
    steps:
    - Entregar solicitud dirigida al director de reordenación territorial
    - La dirección emitira un oficio de notificación de pago dirigido al solicitante con la cantidad a pagar y el
      tiempo de entrega del trabajo
    - El solicitante pasará a cubrir la cantidad a pagar en recaudación de rentas del estado
    - El solicitante entregará copia del recibo de pago a la dirección de reordenación territorial
    - La dirección de reordenación territorial, entrega las copias solicitadas en el tiempo establecido
  notes: Cualquier persona que requiera o necesite el servicio o trámite
