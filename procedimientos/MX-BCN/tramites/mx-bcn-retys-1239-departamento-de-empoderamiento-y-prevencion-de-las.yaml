title: Departamento de Empoderamiento y Prevención de las Violencias
summary: De manera integral contribuir a través de acciones de sensibilización, capacitación y profesionalización
  en materia de prevención de la violencia, promoción de los derechos humanos, y la incorporación de la perspectiva
  de género, orientado a prevenir, atender y erradicar todas las formas de violencia y discriminación. Fortaleciendo
  las capacidades individuales, comunitarias e institucionales para fomentar espacios seguros, equitativos y libres
  de violencia en todos los ámbitos
