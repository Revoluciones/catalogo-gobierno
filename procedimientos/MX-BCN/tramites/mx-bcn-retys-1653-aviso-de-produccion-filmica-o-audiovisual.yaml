scenarios:
- name: Registro de producción como Persona Física
  requirements:
  - text: Formato de registro de producción
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/9476
  - text: Sinopsis del proyecto(Maximo 1 cuartilla)
    cites:
    - source: retys
  - text: Identificación oficial vigente (Instituto Nacional Electoral, pasaporte mexicano, cédula profesional con
      fotografía, credencial del Instituto Nacional de las Personas Adultas Mayores, licencia de conducir del estado
      de Baja California). Tratándose de personas extranjeras, documento migratorio vigente, emitido por la autoridad
      competente
    cites:
    - source: retys
  - text: Comprobante de domicilio, no mayor a 2 meses
    cites:
    - source: retys
  - text: póliza de seguro (responsabilidad civil)
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Integrar documentación requerida
    - Da click en iniciar trámite y presenta la documentación requerida
    - Revisión de documentación
    - Emisión de resolutivo, Nota. Dicha resolución puede archivarse como ¨spam¨ en el correo del ciudadano
  - name: Presencial
    steps:
    - Integrar documentación requerida
    - Presentar documentación en ventanilla
    - Revisión de documentación
    - Emisión de resolutivo
  notes: Proceso y requisitos para obtener el aviso de producción en Baja California
- name: Registro de producción como Persona Moral
  requirements:
  - text: Formato de registro de producción firmado por el representante legal
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/9481
  - text: Sinopsis del proyecto(Maximo 1 cuartilla)
    cites:
    - source: retys
  - text: Acta constitutiva
    cites:
    - source: retys
  - text: Identificación oficial vigente del representante legal (credencial de elector, pasaporte mexicano, cédula
      profesional, credencial del Instituto Nacional de las Personas Mayores o licencia de conducir del estado de
      Baja California), copia del instrumento notarial que lo acredita como tal y copia del acta constitutiva
    cites:
    - source: retys
  - text: Comprobante de domicilio, no mayor a 2 meses
    cites:
    - source: retys
  - text: Póliza de seguro (responsabilidad civil) - opcional
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Integrar documentación requerida
    - Da click en iniciar trámite y presenta la documentación requerida
    - Revisión de documentación
    - Emisión de resolutivo
  - name: Presencial
    steps:
    - Integrar documentación requerida
    - Presentar documentación en ventanilla
    - Revisión de documentación
    - Emisión de resolutivo
  notes: Proceso y requisitos para obtener el aviso de producción en Baja California
