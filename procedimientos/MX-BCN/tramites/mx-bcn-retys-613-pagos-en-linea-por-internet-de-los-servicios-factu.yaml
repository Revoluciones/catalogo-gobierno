scenarios:
- name: Ciudadano
  requirements:
  - text: El usuario debe estar dado de alta en el sistema.
    cites:
    - source: retys
  - text: Factura y dirección de correo electrónico.
    cites:
    - source: retys
  - text: Tener a la mano su tarjeta con la cual realizará el pago
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Dale click al botón iniciar tramite. Regístrate si aún no tienes usuario y contraseña.
    - Proporciona nombre de usuario, contraseña, nombre del contacto, teléfono y correo electrónico.
    - Captura la fecha de vencimiento, número de cuenta y número de factura (debe ser de este mes o el anterior).
    - Usa el botón "Agregar cuenta" para registrar múltiples cuentas.
    - Presiona "Ingresar a servicios en línea" para acceder a tu información.
    - Selecciona "Pago por Internet" o "Consulta de factura" y procede a pagar. Puedes usar tarjetas Visa, Mastercard
      o American Express.
    - Introduce los datos de tu tarjeta y confirma el pago. Imprime el comprobante si lo deseas.
  notes: Realiza el pago
