title: Asistencia y representación legal en proceso penal
summary: La Asistencia y representación legal en proceso penal es el servicio que puede solicitar una persona cuando
  enfrenta una investigación o un juicio por un delito y necesita apoyo de un abogado que la oriente y la defienda
  ante las autoridades. Se solicita cuando alguien requiere conocer sus derechos, preparar su defensa y contar con
  acompañamiento legal durante todas las etapas del proceso penal, únicamente si no dispone de un abogado particular.
