scenarios:
- name: Conflicto Laboral
  requirements:
  - text: Informacion personal básica (nombre completo, dirección, edad, contacto)
    cites:
    - source: retys
  - text: 'Datos sobre el empleo: salario, horas laboradas, fecha de incio de labores, fecha en que se termina la
      relacion laboral (si es el caso)'
    cites:
    - source: retys
  - text: 'Información básica de empleador: nombre y/o razón social, domicilio completo y correcto'
    cites:
    - source: retys
  - text: Seleccionar objeto de solicitud
    cites:
    - source: retys
  - text: Identificación oficial vigente
    cites:
    - source: retys
  - text: Confirmar solicitud presencialmente
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Elegir Personalidad Empledo/empleador
    - Seleccionar el conflicto que se busca resolver
    - Reproducir video de orientacion (recomendado a quienes usan el servicio por primera vez)
    - Aceptar aviso de privacidad
    - Elegir "ninguna de las anteriores" en apartado de actividad del patron
    - Seleccionar fecha de conflicto
    - Seleccionar objeto de solicitud
    - Seleccionar boton de "agregar solicitante"
    - Llenar informacion solicitada por el sistema
    - Validar información
    - Seleccionar botón "Agregar citado"
    - Validar información
    - Describir brevemente el conflicto
    - Enviar solicitud
    - Descargar acuse
    - Seleccionar botón "Finalizar"
    - Para confirmar solicitud acudir personalmente al Centro de Conciliación con una identificación oficial vigente
  - name: Presencial
    steps:
    - Acudir al Centro de Conciliación
    - Registrar visita en área de recepción
    - Llenar formato fisico proporcionado por el personal del centro
    - Entregar formato fisico al funcionario orientador
    - Leer y cerciorarse de que la información sea correcta antes de firmar cualquier documento
    - Esperar fecha de audiencia
  notes: Cualquier conflicto que vulnere derechos laborales.
