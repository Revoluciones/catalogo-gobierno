  - text: Pago en banco, pago en efectivo en el lugar, o transferencia, según sea el caso
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Persona interesada pregunta acerca de la disponibilidad y costos de un espacio físico del Instituto para arrendar
    - Se elabora oficio de solicitud de arrendamiento
    - El Instituto otorga respuesta a solicitud con fecha disponible, costo y modalidad de pago
    - La persona interesada realiza el pago correspondiente
    - Se elabora el contrato de arrendamiento, firman la persona interesada y funcionarios del ISCBC
    - La persona interesada y el Instituto preparan evento
    - La persona interesada realiza su evento
  notes: Cuando la persona interesada desee arrendar un espacio del Instituto de Cultura
