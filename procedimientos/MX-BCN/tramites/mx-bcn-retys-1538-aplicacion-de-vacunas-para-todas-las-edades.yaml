scenarios:
- name: Aplicación de vacunas
  requirements:
  - text: Cartilla nacional de vacunación preferentemente.
    cites:
    - source: retys
  - text: Cumplir con las edades y no tener contraindicaciones para la aplicación de vacuna.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la unidad de salud, solicitar el servicio, entregar la cartilla nacional de salud preferentemente
      y esperar su turno.
    - Personal de salud aplicará la vacuna, sellará cartilla nacional de salud y registrará la fecha en que se aplicará
      la próxima dosis.
    - Usuario(a) recibirá su cartilla nacional de salud con el registro de la aplicación y las recomendaciones para
      cada vacuna aplicada y fecha de la próxima cita
  notes: Aplicación de vacunas para todas las edades
