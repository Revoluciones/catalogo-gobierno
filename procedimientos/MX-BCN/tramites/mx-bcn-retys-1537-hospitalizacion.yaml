scenarios:
- name: Internamiento a Pacientes
  requirements:
  - text: La mayoría de las hospitalizaciones son a través del servicio de urgencias, en donde el médico tratante
      realizará las gestiones técnicas y administrativas para el ingreso del paciente al servicio de hospitalización
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Médico de consulta externa o urgencias realizará interrogatorio, exploración física del paciente y determinará
      si requiere hospitalización, iniciará gestiones administrativas para realizar referencia al área de hospitalización
      como son entrega de expediente clínico y solicitud de hospitalización.
    - En el área de hospitalización se continuará la atención del paciente hasta que las condiciones clínicas del
      paciente determinen su egreso, traslado a otro hospital o defunción.
  notes: Es el servicio destinado al internamiento de pacientes que requieren atención médica continua para establecer
    un diagnóstico, recibir tratamiento y dar seguimiento a su padecimiento.
