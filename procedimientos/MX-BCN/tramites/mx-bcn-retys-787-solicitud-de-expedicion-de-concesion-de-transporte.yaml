- name: Requisitos concesión de transporte de pasajeros en la modalidad de "masivo"
  requirements:
  - text: Solicitud de concesión, debidamente llenada y firmada
    cites:
    - source: retys
  - text: Acta constitutiva de la persona moral titular de la concesión y constancia de inscripción en el Registro
      Público de la Propiedad y Comercio
    cites:
    - source: retys
  - text: Poder de representante legal
    cites:
    - source: retys
  - text: Identificación oficial del representante legal
    cites:
    - source: retys
  - text: Cédula de identificación fiscal (RFC)
    cites:
    - source: retys
  - text: Opinión de cumplimiento de obligaciones fiscales en sentido positivo
    cites:
    - source: retys
  - text: Rutas e itinerarios (Formato "KMZ")
    cites:
    - source: retys
  - text: Información del parque vehicular
    cites:
    - source: retys
  - text: Croquis y ubicación del parque de encierro
    cites:
    - source: retys
  - text: Pólizas de responsabilidad civil vigentes
    cites:
    - source: retys
  - text: Inventario de las instalaciones de terminales
    cites:
    - source: retys
  - text: Certificado de libertad de gravámenes (no adeudos por concepto de transporte público)
    cites:
    - source: retys
  - text: Señalar correo electrónico, domicilio para oír y recibir notificaciones y números telefónicos de contacto
    cites:
    - source: retys
  - text: Proporcionar toda la información y documentos señalados en formato digital a los correos electrónicos
      que para tal efecto señale el Instituto
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas del Instituto de Movilidad Sustentable y presentar la documentación requerida
  notes: Requisitos concesión de transporte de pasajeros en la modalidad de "masivo"
- name: Requisitos concesión de transporte de pasajeros en la modalidad de "personal"
  requirements:
  - text: Solicitud de concesión, debidamente llenada y firmada, dónde se describan los motivos que generan la necesidad
      del servicio de transporte y la capacidad con la que cuenta la empresa para prestarlo
    cites:
    - source: retys
  - text: Presentar los estudios técnicos relativos ante el Instituto. Estos deberán ser realizados por profesionales
      en la materia autorizados por el Instituto, o bien. Solicitar, previo pago de derechos, que estos sean llevados
      a cabo por el Instituto
    cites:
    - source: retys
  - text: Acta constitutiva de la persona moral titular de la concesión y la inscripción en el Registro Público
      de la Propiedad y Comercio
    cites:
    - source: retys
  - text: Poder del representante legal
    cites:
    - source: retys
  - text: Identificación oficial del representante legal
    cites:
    - source: retys
  - text: Cédula de identificación fiscal (RFC)
    cites:
    - source: retys
  - text: Opinión de cumplimiento de obligaciones fiscales en sentido positivo
    cites:
    - source: retys
  - text: Itinerarios (Formato EXCEL)
    cites:
    - source: retys
  - text: Recorridos (Formato "KMZ")
    cites:
    - source: retys
  - text: Inventario del parque vehicular (Formato EXCEL)
    cites:
    - source: retys
  - text: Padrón de operadores (Formato EXCEL)
    cites:
    - source: retys
  - text: Croquis y domicilio de parques de encierro
    cites:
    - source: retys
  - text: Póliza, constancia o carta cobertura de responsabilidad civil global (Formato EXCEL y PDF)
    cites:
    - source: retys
  - text: Contratos o convenios celebrados con terceros, relacionados con la prestación del servicio público de
      transporte
    cites:
    - source: retys
  - text: Señalar correo electrónico, domicilio para oír y recibir notificaciones y números telefónicos de contacto
    cites:
    - source: retys
  - text: Presentar toda la información y documentos señalados en formato digital. deberán ser enviados a los correos
      electrónicos que para tal efecto señale el Instituto
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - ACUDIR A LAS OFICINAS DEL INSTITUTO DE MOVILIDAD SUSTENTABLE Y PRESENTAR LA DOCUMENTACIÓN REQUERIDA
