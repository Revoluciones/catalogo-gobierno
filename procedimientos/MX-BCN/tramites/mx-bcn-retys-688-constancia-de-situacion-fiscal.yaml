scenarios:
- name: Ciudadanía en General
  requirements:
  - text: Copia de identificación oficial con fotografía vigente (INE, pasaporte mexicano vigente, cédula profesional,
      matrícula consular, cartilla militar y/o licencia de conducir) del contribuyente, persona física interesada
      o del representante legal, según sea el caso.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El ciudadano deberá acudir físicamente a la oficina de recaudación de rentas del estado más cercana a su domicilio
      fiscal.
    - Solicitar al asesor de la recaudación de manera verbal la constancia de situación fiscal.
    - El servidor en turno solicitará al contribuyente o Representante Legal los requisitos para procesar el trámite.
    - Una vez recibidos los documentos el servidor envía a contribuyente o representante legal a realizar el pago
      correspondiente a cajas y regresar con recibo pagado.
    - Una vez realizado el pago, se le recoge la copia del recibo pagado y se indica al contribuyente que su constancia
      le será entregada en un tiempo de un día hábil, a efecto de procesar la información y certificar dicho documento
      mediante la firma del recaudador titular de dicha oficina.
    - Finalmente, se le indica regresar al día siguiente (hábil) y para la entrega la Constancia correspondiente.
  notes: La expedición de un documento que haga constar que el contribuyente se encuentra activo en el padrón estatal
    de causantes, con cierto domicilio fiscal y un correcto cumplimiento de todas sus obligaciones fiscales ante
    el estado, considerando la posible existencia de créditos fiscales vigentes y previamente formalizados (Certificación
    de no adeudo)
