summary: La expedición de un documento que haga constar que el contribuyente se encuentra activo en el Padrón Estatal
  de Causantes, con cierto domicilio fiscal y un correcto cumplimiento de todas sus obligaciones fiscales ante el
  Estado, considerando la posible existencia de créditos fiscales vigentes y previamente formalizados.
