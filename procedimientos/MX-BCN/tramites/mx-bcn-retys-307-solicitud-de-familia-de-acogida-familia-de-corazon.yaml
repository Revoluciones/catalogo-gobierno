scenarios:
- name: Ciudadania en general
  requirements:
  - text: Solicitud de familia de acogida, debidamente firmada por las partes interesadas;
    cites:
    - source: retys
  - text: Escrito libre dirigido a la procuraduría de protección, debidamente firmado por el solicitante.
    cites:
    - source: retys
  - text: Cédula única de registro de población del solicitante y de cada uno de los integrantes de la familia
    cites:
    - source: retys
  - text: Identificación oficial con fotografía del solicitante expedida por la autoridad oficial;
    cites:
    - source: retys
  - text: Comprobante de domicilio de no mayor a tres meses anteriores a la solicitud.
    cites:
    - source: retys
  - text: Original y copia de título de propiedad del o los inmuebles señalados como domicilio familiar en donde
      se pretenda acoger a la niña, niño o adolescente.
    cites:
    - source: retys
  - text: Copia certificada del acta de nacimiento del solicitante de quien o quienes soliciten la certificación
      y de cada uno de los integrantes de la familia;
    cites:
    - source: retys
  - text: En su caso, copia certificada del acta de matrimonio de los solicitantes, o acta, constancia o certificado
      de concubinato emitido por autoridad judicial;
    cites:
    - source: retys
  - text: Comprobante de ingresos el cual podrá ser recibo de nómina de los tres últimos meses expedido por la empresa
      o institución donde labora.
    cites:
    - source: retys
  - text: Constancia de trabajo expedida por la empresa o institución donde labora el solicitante.
    cites:
    - source: retys
  - text: Carta de no antecedentes penales de cada solicitante, expedida por la autoridad de la entidad federativa
      que corresponda a su domicilio o residencia habitual;
    cites:
    - source: retys
  - text: Carta compromiso del solicitante de quien o quienes soliciten la certificación se obligan a presentar
      en tiempo y forma los documentos que se le requieran.
    cites:
    - source: retys
  - text: Carta compromiso del solicitante se obligan, a aceptar las evaluaciones psicológicas y de estudios socioeconómicos
      periódicas.
    cites:
    - source: retys
  - text: Dos cartas de recomendación, signadas por personas no familiares del solicitante que conozcan su intención
      de formar parte del programa de familias de acogida;
    cites:
    - source: retys
  - text: Carta de aceptación de los familiares mayores de edad que vivan en el mismo domicilio del solicitante,
      para constituirse como familias de acogida
    cites:
    - source: retys
  - text: Fotografías del inmueble en el que habita el solicitante, deberán ser como mínimo diez fotografías.
    cites:
    - source: retys
  - text: Fotografías de convivencias familiares que deberán ser mínimo cinco;
    cites:
    - source: retys
  - text: Certificado médico de buena salud del solicitante y de cada uno de los miembros de la familia, practicado
      por institución pública de salud.
    cites:
    - source: retys
  - text: Exámenes toxicológicos que incluyan los elementos siguiente, con una expedición máxima de dos meses anteriores
      a la fecha de solicitud;
    cites:
    - source: retys
  - text: Ser mayor de 25 años
    cites:
    - source: retys
  - text: Acudir a platica de Inducción
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - 'Proporcionar los siguientes datos por teléfono o en persona: nombre, edad, estado civil, teléfono, correo
      electrónico, informar si cuenta con hijos y edad de los mismos, en caso de estar casado o concubinato, nombre
      y edad de la pareja.'
    - Se le notificará a las personas registradas el día y hora para la plática de inducción que se realizan en
      los diferentes municipios.
    - Asistir el día y hora acordada para recibir la plática de inducción.
    - El servidor público brinda la platica de inducción
    - Terminando la platica de Inducción, el servidor público proporciona los formatos a las familias solicitantes
    - Presentar la documentación solicitada
    - Se notificará la fecha para valoraciones psicológicas y sociales, así como para la capacitación de familias
      de corazón
    - Una vez acreditada la capacitación se podrá proseguir con la familia de acogida
  notes: Para iniciar el trámite para la certificación de familias de corazón
