title: Solicitud de Familia de Acogida (Familia de Corazón)
summary: Brindar cuidado temporal a niñas, niños y adolescentes carentes de cuidados parentales, a través de familias
  distintas a su familia de origen, en tanto se resuelva su situación jurídica.
