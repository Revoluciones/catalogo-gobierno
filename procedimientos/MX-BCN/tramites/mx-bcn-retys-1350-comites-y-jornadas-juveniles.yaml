title: Comités y Jornadas Juveniles
summary: Conformar grupos de líderes jóvenes en las comunidades para la creación de comités para promover la participación
  social dentro de su comunidad así como promocionar los programas del Instituto de la Juventud y llevar a cabo
  jornadas para el mejoramiento de espacios vulnerables dentro de su comunidad.
