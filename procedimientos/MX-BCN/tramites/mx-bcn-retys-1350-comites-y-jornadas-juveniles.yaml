scenarios:
- name: Jóvenes
  requirements:
  - text: Identificación oficial de cada uno de los representantes del comité (presidente, secretario, tesorero
      y vocal)
    cites:
    - source: retys
  - text: La persona que se seleccione como Presidente deberá presentar un comprobante de domicilio
    cites:
    - source: retys
  - text: Formato de peticiones por parte del Cómite (Formato libre)
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - La información se solicita de dos maneras, de manera presencial en las instalaciones del Instituto y por llamada
      telefónica al 6865684009 ext. 105 para la conformación del comité juvenil del Instituto de la Juventud del
      Estado de Baja California
    - Se notifica por medio de llamada al solicitante que la conformación del comité es de 10 jóvenes de los cuales
      4 tienen que ser mayores de edad.
    - Por llamada se agenda el día, la hora y el lugar ya confirmado previamente con el solicitante para la firma
      del Acta.
    - Por parte del Instituto de la Juventud del Estado de Baja California, se proporcionará el Acta de Registro
      del comité para llenarlo de manera presencial con el grupo de jóvenes a realizar el comité de la comunidad.
    - El seguimiento del comité es responsabilidad del presidente una vez que se haya firmado el Acta.
  notes: Jóvenes
