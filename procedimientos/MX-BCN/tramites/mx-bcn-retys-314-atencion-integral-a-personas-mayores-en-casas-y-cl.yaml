    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11298
  modes:
  - name: Presencial
    steps:
    - Acudir a las instalaciones de las casas de día.
    - Solicitar información sobre los días y horarios en que se imparten talleres, cursos, pláticas psicoeducativas
      y atenciones especializadas en salud.
    - Se proporciona información sobre los días y horarios que se imparten los servicios solicitados.
    - Entrega documentación solicitada para inscribirse al servicio requerido, con el promotor de la casa de día
      al taller o curso de su elección, así como para integrarse al padrón de beneficiarios para la consulta gratuita
      de especialidad.
    - Recibe y revisa los documentos solicitados para la inscripción.
    - Se imparte curso, taller, plática o atención especailizada solicitada.
  notes: 'Recopilación de documentos para el servicio:'
