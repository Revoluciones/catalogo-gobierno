    cites:
    - source: retys
  - text: Recibo de pago
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Entrega oficio u documento oficial de solicitud de peritaje remitido por alguna autoridad administrativa,
      educativa o judicial competente.
    - Realiza pago correspondiente.
    - Revisa y valida documentación y recibo de pago.
    - Informa sobre la entrega del informe. En algunos casos especiales, se entregará a la autoridad judicial solicitante
      para integración del expediente judicial que corresponda.
    - Acude por entrega del informe solicitado en un lapso no mayor a 30 días hábiles.
