title: Buzón Institucional en Línea
summary: Medio por el cual el usuario puede enviar comentarios, dudas, quejas y sugerencias a CECyTE BC.
authority:
  name: Colegio de Estudios Científicos y Tecnológicos del Estado de Baja California
