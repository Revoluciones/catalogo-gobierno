positive_silence: false
requires_inspection: false
channels:
- en_linea
offices:
- municipality: Mexicali
  name: Departamento de Organización y Fortalecimiento Institucional
  address: 'Panamá  #199, Cuauhtémoc Sur, Mexicali, 21200'
scenarios:
- name: Ciudadania en general
  requirements:
  - text: No se requiere
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Usuario envía comentario o sugerencia a través de buzón web haciendo clic en el botón "iniciar trámite" ubicado
      en la parte inferior derecha, vía teléfono o presencial en Dirección General
    - Proporciona la información detallada sobre el tema que desea que se le brinde atención o respuesta
    - Proporciona información de contacto vigente para que se le envíe una respuesta
    - Se recibe, verifica y canaliza la información recibida al departamento que corresponda según el tema
    - Se brinda seguimiento con el departamento que recibió la información asegurándose que sea en un periodo no
      mayor a 48 horas
    - Se asegura que el departamento haya atendido al usuario y envie respuesta por el medio indicado
    - Se envía respuesta y/o atención al usuario antes de las 48 horas
    - Se da por concluida la atención al usuario
  notes: Persona que ha realizado algún trámite o solicitado un servicio de los que se ofrecen en CECyTE BC
legal_basis:
