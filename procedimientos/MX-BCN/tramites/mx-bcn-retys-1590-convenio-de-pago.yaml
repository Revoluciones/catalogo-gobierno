scenarios:
- name: Usuarios Residenciales
  requirements:
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el propietario del predio,
      puede ser UNO de los siguientes: Poder Notarial; Carta Poder ante notario público, corredor público o fedatario
      público; Carta Poder simple firmada por el propietario del predio y por dos testigos, que incluya copia de
      las identificaciones oficiales de los testigos, cuya antigüedad no exceda los seis meses, si la persona que
      gestiona no es el propietario'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial del INE,
      Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Hacer el pago inicial del convenio
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en ORIGINAL Y COPIA, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  - text: En aquellos casos en los que no sea posible obtener carta poder e identificación del propietario, se podrá
      hacer Convenio como obligado solidario, siempre y cuando la identificación oficial de éste tenga el mismo
      domicilio que el registrado en la cuenta sobre la que se hará el convenio.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a cualquier Centro de Atención al Público (CAP) de CESPT
    - Pasar al área de Módulos de Atención Personalizada (MAP) y esperar su turno
    - Cuando llegue su turno, la persona del MAP revisará que se cumplan todos los requisitos, si no están completos,
      le informará que no es posible realizar el trámite hasta que éstos se completen, indicando lo que falta
    - La persona del MAP verifica la información de la cuenta en el sistema y le informa, la opciones del importe
      de pago inicial y las mensualidades
    - Seleccione la opción de pago inicial y mensualidades que mejor se ajusten a sus posibilidades
    - La persona del MAP elabora el Convenio de pago y lo entrega al ciudadano para que pase a pagar a cajas
    - Pase a cajas a realizar el pago inicial del convenio
    - 'La persona de cajas le entregará dos documentos: 1) convenio y 2) recibo de pago'
  notes: Todos los documentos deben presentarse en original y copia, la cual debe ser legible y contener el documento
    completo
