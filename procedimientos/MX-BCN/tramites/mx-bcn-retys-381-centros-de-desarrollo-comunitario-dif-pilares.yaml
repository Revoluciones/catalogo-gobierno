  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Desarrollo Comunitario DIF PILARES más cercano.
    - Solicitar información sobre los días y horario en que se imparten los cursos.
    - Asistir en el horario y días indicados.
    - Se explica al ciudadano los cursos con los que cuenta el Centro de Desarrollo Comunitario DIF PILARES.
    - Se inscribe al ciudadano en el curso que solicite
    - El ciudadano realiza el pago correspondiente (en caso de requerirse).
    - Se entrega constancia de finalización del curso.
  notes: Recopilación de documentos
