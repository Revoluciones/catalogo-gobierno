title: Centros de Desarrollo Comunitario DIF PILARES.
summary: 'Brindar talleres, cursos y servicios en los distintos centros comunitarios con el objetivo de impulsar
  una política educativa, comunitaria e integral para regenerar el tejido social a través de 5 Ejes principales:
  Educación, Deporte, Economía, Salud, Cultura y Paz, los cuales abordan aspectos fundamentales para el Desarrollo
  Integral de la Comunidad y la Familia.'
