scenarios:
- name: Ciudadano
  requirements:
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial con fotografía
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Ingresar al sitio haciendo clic en el botón "iniciar trámite" ubicado en la parte inferior derecha.
    - Registrarse como candidato en búsqueda de empleo
    - Llenar su solicitud electrónica
    - Buscar opciones laborales
    - Actualizar su información personal y profesional
    - En caso de no encontrar vacantes puedes agendar una cita en la OSNE más cercana
  - name: Presencial
    steps:
    - Presentarse en oficinas con CURP e identificación oficial
    - Esperar turno para pasar con el servidor público encargado del registro
    - Brindar información real y confiable de su perfil laboral
    - Atención por un consejero de emepleo para búsqueda de opciones
    - Acudir a las opciones de centros de trabajo que le fueron brindadas y actualizar su información
  notes: Solicitante de vacantes de empleo
