scenarios:
- name: Registro Inicial - Personas Morales
  requirements:
  - text: Sección 1.- I. Original y copia de la Solicitud de Exención de Permiso de Descarga de Aguas Residuales
      (FRM-022), debidamente llenado y firmado por el propietario o el representante legal de la empresa
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12064
  - text: Sección 1.- II. Copia certificada del Acta Constitutiva de la empresa.
    cites:
    - source: retys
  - text: Sección 1.- III. Copia certificada del Poder Legal para actos de administración, vigente, que acredite
      la personalidad del representante legal, en caso de NO ESTAR ESTABLECIDO en el Acta Constitutiva.
    cites:
    - source: retys
  - text: 'Sección 1.- IV. Copia de identificación oficial con fotografía, VIGENTE, del representante legal, del
      responsable de la información y de la persona autorizada para recibir y oir notificaciones, puede ser UNO
      de los siguientes: Credencial del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Sección 1.- V. Copia de Constancia de Situación Fiscal de la empresa.
    cites:
    - source: retys
  - text: Sección 1.- VI. Copia del Predial.
    cites:
    - source: retys
  - text: Sección 1.- VII. Copia de croquis de ubicación de la empresa
    cites:
    - source: retys
  - text: Sección 2.- Descripción general de su actividad. Descripción general de su actividad de la empresa, en
      el caso que utilice agua deberá detallar el papel que desempeña el agua en el proceso, especificando claramente
      si se generan aguas residuales.
    cites:
    - source: retys
  - text: Sección 3.- Fotografias del interior de la empresa Fotografias a color de las áreas del interior de la
      empresa, con el objetivo de sustentar su petición y demostrar que no genera descargas de aguas residuales
      de proceso.
    cites:
    - source: retys
  - text: Sección 4.- Documentales de no generación de descargas de aguas residules de proceso. Documentales de
      no generación de descargas de aguas residuales de proceso (manifiestos de disposición de residios peligosos,
      facturas los últimos 6 meses del lavado de ropa de cama, toallas y batas de waffle), mismas que pueden ser
      enunciativas más no limitativas, que el promovente considere necesarias para sustentar su petición.
    cites:
    - source: retys
  - text: Hacer el pago correspondiente.
    cites:
    - source: retys
  - text: Las copias deben ser LEGIBLES y contener el DOCUMENTO COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la Coordinación de Control de Calidad, ubicada en el edificio que se encuentra en la parte posterior
      izquierda de oficinas centrales de CESPT y presentar la carpeta con los requisitos.
    - La persona de la Coordinación de Control de Calidad revisa que se cumpla con todos los requisitos, si no están
      completos, informa a la persona solicitante que no es posible realizar el trámite hasta que éstos se completen,
      indicándole que es lo que falta.
    - Con los requisitos completos, la persona de la Coordinación de Control de Calidad pone sello de revisado al
      original y copia de la Solicitud de Exención de Permiso de Descarga de Aguas Residuales (FRM-022).
    - Acudir a la Coordinación de Servicios de Saneamiento para la elaboración e impresión de la ficha de pago.
    - Acudir al área de cajas con la ficha de pago y realizar el pago de derechos correspondiente, la persona de
      cajas le entregará un recibo de pago.
    - Pasar al área de archivo, presentar el recibo de pago y entregar original y copia de la solicitud de Exención
      de Permiso de Descarga de Aguas Residuales (FRM-022) y entregar la carpeta.
    - La persona del Área de Archivo certifica de recibido original y copia de la Solicitud de Exención de Permiso
      de Descarga de Aguas Residuales (FRM-022) y le entrega al solicitante la copia.
    - Posteriormente, la persona de la Coordinación de Control de Calidad contactará a la persona solicitante para
      que acuda a las oficinas y hacerle entrega de su Exención de Permiso de Descarga de Aguas Residuales.
  notes: Presentar carpeta con los requisitos, clasificados en 4 secciones.
