title: Registro o Revalidación de Exención de Permiso de Descarga de Aguas Residuales para Comercios y Empresas
  de Servicios
summary: Solicitar la exención del trámite de permiso de descargas, debido a que no se generan aguas residuales
  de procesos de producción de bienes o servicios.
