title: Jubilación o Pensión
summary: 'Brindar a los trabajadores asegurados la prestación que le corresponde una vez que se han complicado con
  el tiempo mínimo de servicio, cotización y edad, requerida para disfrutar de la pensión o jubilación, en su caso;
  una vez que se generan los siguientes documentos: A).- Histórico de cotizaciones ante el ISSSTECALI que emite
  el departamento histórico de cotizaciones. B).- Dictamen que propone a la junta directiva conceder, negar, modificar
  o revocar la pensión o jubilación y, que emite la dirección de pensiones y jubilaciones del ISSSTECALI'
