title: Acceso a los Servicios de la Sala Braille
summary: Que la persona cuya debilidad visual, ceguera o discapacidad física les dificulta leer material impreso
  haga uso del acervo y equipo en la sala braille la cual cuenta con capacidad para 15 personas, 1 computadora,
  1 impresora de braille, 1 máquina de escribir braille y 1 magnificador de texto.
