scenarios:
- name: Registro para Servicios en Línea
  requirements:
  - text: Credencial de Afiliación
    cites:
    - source: retys
  - text: Correo electrónico del interesado(a)
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - hacer click en el Sistema Integral de Servicios a afiliados (SISA)
    - Ingresar a la opción regístrate.
    - Ingresa el número de afiliación, el número de serie impreso en el reverso de tu credencial de afiliación,
      tu número de teléfono y tu dirección de correo electrónico. Asegúrate de confirmar tu correo electrónico en
      el campo correspondiente.
    - Leer el aviso de privacidad integral y simplificado, y marca las casillas correspondientes para indicar que
      has leído y aceptado estos avisos.
    - Leer los términos y condiciones de uso del servicio y marca las casillas para aceptar dichos términos.
    - Otorgar el consentimiento para la agrupación de información de agenda médica y recetas por núcleo familiar.
    - Presionar el botón de registrarte para proceder con el registro.
    - Ingresar a cuenta de correo electrónico indicado y del mensaje de confirmación recibido hacer click en el
      enlace de validación de cuenta.
    - Recibir en cuenta de correo electrónico indicado un nuevo mensaje con la contraseña temporal generada automáticamente
      por el servicio.
  notes: Usuario y Contraseña
