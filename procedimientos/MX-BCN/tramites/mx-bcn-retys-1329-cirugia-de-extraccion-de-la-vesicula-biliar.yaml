scenarios:
- name: Derechohabientes del IMSS-BIENESTAR
  requirements:
  - text: Hoja de derivación debidamente requisitada y sellada, que le proporcionan en el centro de salud y/u Hospital
      General.
    cites:
    - source: retys
  - text: Identificación oficial (credencial de elector, pasaporte, licencia de manejo).
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Historia clínica, exámenes de laboratorio, reporte de la valoración cardiopulmonar cuando proceda y demás
      estudios de gabinete que procedan de acuerdo a la intervención quirúrgica, que le entregan en el centro de
      salud.
    cites:
    - source: retys
  - text: Carta de consentimiento informado para cirugía y anestesia que se le entrega en UNEME previo a la cirugía
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la consulta médica del establecimiento que le corresponda.
    - Se le miden los signos vitales, se realiza una entrevista médica y exploración física. Se deriva a UNEME de
      ser necesario
    - Contactar al ciudadano, indicando fecha, hora y cuidados necesarios previos a la cirugía
    - Acudir a UNEME con un acompañante, identificarse y entregar los requisitos
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la cirugía (incluyendo vendaje y suero), trasladar al quirófano y, después del procedimiento,
      dar instrucciones para el cuidado y alta.
  notes: Derechohabientes de los Servicios de Salud del Instituto Mexicano del Seguro Social para el Bienestar
- name: Derechohabientes IMSS, ISSSTE e ISSSTECALI
  requirements:
  - text: Hoja de derivación debidamente requisitada y sellada, que le proporcionan en IMSS, ISSSTE o ISSSTECALI
      en su caso.
    cites:
    - source: retys
  - text: Nota médica de referencia de la unidad de origen que incluya resultados de laboratorio o los exámenes
      de laboratorio de respaldo
    cites:
    - source: retys
  - text: Carta de consentimiento informado para cirugía y anestesia. Se le entrega en UNEME, previo a la cirugía
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial (INE, pasaporte, licencia de conducir).
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la consulta médica del establecimiento IMSS, ISSSTE o ISSSTECALI que le corresponda.
    - Se le miden los signos vitales, se realiza una entrevista médica y exploración física
    - Si se presentan los síntomas digestivos específicos, se realiza una hoja de derivación para su atención en
      UNEME
    - El personal de UNEME le contacta por vía telefónica, indicando fecha, hora y cuidados necesarios previos a
      la cirugía
    - Acudir a UNEME en la fecha y hora programados, con 1 persona acompañante, identificarse en el área de recepción,
      entregar los requisitos y firmar la carta de consentimiento informado.
    - Pasar al área que le indique el personal de UNEME para el cambio de ropa por una bata hospitalaria
    - Pasar a la persona usuaria al área de preparación previa para el vendaje de los extremidades inferiores y
      colocación de suero intravenoso
    - Pasar a la persona usuaria al quirófano cuando el personal médico lo indique
    - Al estar en el área de recuperación posterior a la cirugía, el médico le dará las indicaciones para seguir
      con los cuidados necesarios y le dará de alta.
  notes: Derechohabientes del Instituto Mexicano del Seguro Social, del Instituto de Seguridad y Servicios Sociales
    de los Trabajadores del Estado y del Instituto de Seguridad y Servicios Sociales de los Trabajadores del Gobierno
    y Municipios del Estado de Baja California
