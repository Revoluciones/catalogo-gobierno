summary: Servicio ferroviario de carga en la vía corta Tijuana-Tecate. Traslado de la mercancía proveniente de estados
  unidos por la frontera ferroviaria de Tijuana-San Ysidro, contando con cobertura entre las ciudades de Tijuana
  y Tecate.
