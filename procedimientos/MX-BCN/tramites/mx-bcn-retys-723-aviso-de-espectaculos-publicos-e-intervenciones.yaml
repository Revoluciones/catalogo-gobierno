scenarios:
- name: Ciudadanía en general
  requirements:
  - text: Solicitud firmada por representante de la Institución que solicita el permiso.
    cites:
    - source: retys
  - text: Presentar original y copia identificación oficial con fotografía vigente (INE, pasaporte mexicano vigente,
      cédula profesional, matrícula consular, cartilla militar y/o licencia de conducir) y nombramiento o documento
      con validez legal que le expida la institución respectiva
    cites:
    - source: retys
  - text: Escrito dirigido al recaudador de rentas solicitando el sellado y en su caso la exención de impuestos
      o la tasa mínima.
    cites:
    - source: retys
  - text: Presentar original y copia contrato celebrado con el artista.
    cites:
    - source: retys
  - text: Los boletos deben especificar el nombre del evento, fecha, hora, lugar, costo, número de folio (en el
      talón y boleto) si es de pre-venta o taquilla o cortesía y cantidad de puertas de acceso al evento.
    cites:
    - source: retys
  - text: Presentar en original y copia contrato celebrado por la institución o promotor con el representante legal
      del artista.
    cites:
    - source: retys
  - text: Presentar en original y copia a el acta notarial donde demuestre que el representante tiene todos los
      derechos de representación (es necesario que dicho contrato estipule el porcentaje que es para la institución).
    cites:
    - source: retys
  - text: 'En los casos en que utilicen para la venta del boletaje sistemas electrónicos de datos, además de los
      requisitos establecidos se deberán cumplir con los siguientes: 1. Escrito libre, en el que como mínimo deberá
      señalar: • Nombre o denominación de la persona física o moral sujeta del impuesto sobre diversiones y espectáculos
      públicos. • Nombre y domicilio de la empresa con la que se realiza la contratación para la distribución y
      venta de boletos, según aplique. • Día, fecha y hora del espectáculo público. • Número estimado de boletos
      a la venta de acuerdo a la capacidad del lugar. 2.Copia del contrato de prestación de servicios para la distribución
      y venta de boletos 3. Copia del registro.'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Se recibe del contribuyente en original y copia aviso del espectáculo público a realizar, misma que deberá
      describir el nombre del promotor, RFC del promotor, copia de identificación del promotor (INE) nombre del
      evento o espectáculo, fecha del evento, lugar donde se llevará a cabo el evento, número de puertas que se
      abrirán para el ingreso de los espectadores, número de espectadores que se pretende recibir, y solicitud de
      resello de boletos.
    - Una vez presentado el aviso, la oficina de Recaudación de Rentas del Estado, entregará copia con sello de
      recibido al contribuyente y explicará el proceso a seguir y fecha en que deberá regresar a Recaudación de
      Rentas para concluir el trámite.
  notes: Recaudar el cobro del impuesto sobre espectáculos públicos mediante la intervención del evento
