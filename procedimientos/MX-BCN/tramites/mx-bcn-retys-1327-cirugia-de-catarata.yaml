branch: ejecutivo
kind: tramite
title: Cirugía de Catarata
summary: Es una cirugía para retirar catarata del ojo, el procedimiento incluye la colocación de un lente intraocular.
authority:
  name: Unidad de Especialidades Médicas de Baja California
