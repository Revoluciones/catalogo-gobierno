  homoclave: BC-UNEME-003
who_can:
- Interesado
when: Cuando haya visión borrosa acentuada
result: Atención médica especializada en oftalmología
cost:
  type: gratuito
  amount_mxn: null
  text: SIN COSTO
  as_of: '2026-11-06'
  cites:
  - source: retys
deadlines:
- what: respuesta_autoridad
  text: 'Tiempo que tiene el organismo para resolver: 14 Días Hábiles'
  cites:
  - source: retys
positive_silence: false
requires_inspection: false
channels:
- presencial
offices:
- municipality: Mexicali
  name: Dirección de Unidad Quirúrgica
  address: 'Avenida Olimpus #S/N, Plutarco Elías Calles, Mexicali, 21376'
- municipality: Ensenada
  name: Dirección de Unidad Quirúrgica
  address: 'Avenida Gastelum #1340, Zona Centro, Ensenada, 22800'
scenarios:
- name: Derechohabientes del IMSS-BIENESTAR
  requirements:
  - text: Hoja de derivación debidamente llenada y sellada, que le proporciona el centro de salud y/u Hospital General.
    cites:
    - source: retys
  - text: Identificación oficial (credencial de elector, pasaporte, licencia de manejo).
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Historia clínica, exámenes de laboratorio, reporte de la valoración cardiopulmonar cuando proceda y demás
      estudios de gabinete que procedan de acuerdo a la intervención quirúrgica, que le proporcionan en el centro
      de salud y/u Hospital General
    cites:
    - source: retys
  - text: Carta de consentimiento informado, que se le entrega en UNEME antes de la cirugía
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la consulta médica del establecimiento que le corresponda.
    - Se le miden los signos vitales, se realiza una entrevista médica y exploración física. Se deriva con un oftalmólogo
      si es necesario
    - Acudir a la consulta con el especialista
    - Se le miden los signos vitales, se realiza una entrevista médica, exploración física y examen de agudeza visual.
      Se deriva a UNEME si es necesario
    - Contactar al ciudadano, indicando fecha, hora y cuidados necesarios previos a la cirugía
    - Acudir a UNEME con un acompañante, identificarse y entregar los requisitos
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la cirugía, trasladar al quirófano y, después del procedimiento, dar instrucciones
      para el cuidado y alta.
  notes: Derechohabientes de los Servicios de Salud del Instituto Mexicano del Seguro Social para el Bienestar
- name: Derechohabientes IMSS, ISSSTE e ISSSTECALI
  requirements:
  - text: Hoja de derivación debidamente llenada y sellada, que le proporciona el IMSS, ISSSTE o ISSSTECALI, según
      corresponda.
    cites:
    - source: retys
  - text: Nota médica de referencia de la unidad de origen que incluya resultados de laboratorio o los exámenes
      de laboratorio de respaldo
    cites:
    - source: retys
  - text: Carta de consentimiento informado, que se le entrega en UNEME antes de la cirugía
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial (INE, pasaporte, licencia de conducir).
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la consulta médica del establecimiento que le corresponda.
    - Se le miden los signos vitales, se realiza una entrevista médica y exploración física. Se deriva con un oftalmólogo
      si es necesario
    - Acudir a la consulta con el especialista
    - Se le miden los signos vitales, se realiza una entrevista médica, exploración física y examen de agudeza visual.
      Se deriva a UNEME si es necesario
    - Contactar al ciudadano, indicando fecha, hora y cuidados necesarios previos a la cirugía
    - Acudir a UNEME con un acompañante, identificarse y entregar los requisitos
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la cirugía, trasladar al quirófano y, después del procedimiento, dar instrucciones
      para el cuidado y alta.
  notes: Derechohabientes del Instituto Mexicano del Seguro Social, del Instituto de Seguridad y Servicios Sociales
    de los Trabajadores del Estado y del Instituto de Seguridad y Servicios Sociales de los Trabajadores del Gobierno
    y Municipios del Estado de Baja California
- name: Gestión y apoyo ciudadano, Bienestar/DIF
  requirements:
  - text: Hoja de derivación debidamente requisitada y sellada, emitida por la Secretaría de Bienestar del Gobierno
      del Estado
    cites:
    - source: retys
  - text: Valoración médica de oftalmología y medicina interna, emitida por los especialistas de la UNEME
    cites:
    - source: retys
  - text: Análisis de laboratorio
    cites:
    - source: retys
  - text: Carta de consentimiento informado, que se le entrega en UNEME antes de la cirugía
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir las oficinas del Desarrollo Integral de la Familia (DIF) para solicitar el apoyo
    - Si procede, acudir a las oficinas de la Secretaría de Bienestar, presentando los requisitos que le indiquen
      en DIF
    - Contactar al ciudadano para indicar fecha y hora para una consulta de oftalmología
    - Acudir a la UNEME para la consulta de oftalmología
    - Se le miden signos vitales, se realiza una entrevista médica, exploración física y examen de agudeza visual.
      Se programa para valoración por un médico internista si es necesario y le indica al ciudadano los estudios
      de laboratorios a realizar
    - Acudir a la consulta de medicina interna con los resultados de laboratorio
    - Si la persona usuaria es candidato a cirugía, contactar al ciudadano, indicarle fecha y hora de la cirugía
      y cuidados previos
    - Acudir a la UNEME con un acompañante. Identificarse y firmar la carta de consentimiento informado.
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la cirugía, trasladar al quirófano y, después del procedimiento, dar instrucciones
      para el cuidado y alta.
  notes: Convenio de cirugía de cataratas con la Secretaría de Bienestar y el DIF Estatal
