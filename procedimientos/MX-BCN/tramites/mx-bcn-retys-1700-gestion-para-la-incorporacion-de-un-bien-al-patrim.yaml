positive_silence: false
requires_inspection: false
channels:
- presencial
offices:
- municipality: Mexicali
  name: Dirección de Patrimonio Cultural y Culturas Populares
  address: 'Álvaro Obregón #1209, Nueva, Mexicali, 21100'
scenarios:
- name: Ciudadanía en general
  requirements:
  - text: Solicitud de declaratoria (carta de formato libre donde se manifieste y fundamente la intención de llegar
      a una declaratoria)
    cites:
    - source: retys
  - text: Expediente técnico de acuerdo a lo establecido en la guía para la elaboración de expedientes, que contiene
      la información mínima indispensable, que los miembros del consejo de patrimonio requieren para evaluar su
      pertinencia
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Elabore y entrege de forma impresa la solicitud de declaratoria de un bien tangible o intangible al patrimonio
      cultural de Baja California, adjuntando el expediente técnico de acuerdo a lo establecido en la guía para
      la elaboración de expedientes
    - Personal de la Secretaría de Cultura, revisa y validada la solicitud y el expediente
    - Personal de la Secretaría turna al Consejo de Patrimonio para su estudio
    - Consejo de Patrimonio analiza, sesiona y emite votación
    - Publicación de la declaratoria
  notes: Toda persona que desee incorporar un bien tangible o intangible al Patrimonio Cultural de Baja California.
