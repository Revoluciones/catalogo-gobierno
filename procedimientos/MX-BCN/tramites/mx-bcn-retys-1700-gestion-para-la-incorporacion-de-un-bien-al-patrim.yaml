  retys_id: 1700
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/1700
  homoclave: BC-SC-011
who_can:
- Representante Legal
- Interesado
when: Cuando se desee incorporar un bien tangible intangible como patrimonio cultural
result: El decreto de la declaratoria del bien cultural o histórico.
