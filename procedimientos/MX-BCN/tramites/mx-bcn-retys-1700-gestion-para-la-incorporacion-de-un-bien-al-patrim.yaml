level: estatal
branch: ejecutivo
kind: tramite
title: Gestión para la incorporación de un bien al Patrimonio Cultural de Baja California
summary: Atender las solicitudes para la promoción declaratoria de bienes y valores culturales al patrimonio cultural
  del estado de acuerdo al procedimiento indicado en la Ley de Preservación del Patrimonio Cultural del Estado de
  Baja California.
