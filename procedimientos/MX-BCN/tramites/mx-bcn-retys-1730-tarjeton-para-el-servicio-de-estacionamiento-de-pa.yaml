  name: Departamento de Mantenimiento y Servicios Generales.
  address: 'Carretera Libre Tijuana-Tecate. #Km.10, Fraccionamiento El Refugio., Tijuana, 22253'
scenarios:
- name: Estudiantes
  requirements:
  - text: Firmar las Normas de Estacionamiento UTT
    cites:
    - source: retys
  - text: Matrícula de estudiante
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - 'Acudir personalmente al Departamento de Mantenimiento y Servicios Generales en el Edificio de Rectoría para
      solicitar tarjetón de estacionamiento o enviar solicitud al correo electrónico estacionamientoutt@uttijuana.edu.mx
      o a la liga https://boton.uttijuana.edu.mx/cliente con la siguiente información: 1. Nombre completo iniciado
      por apellidos. 2. Matricula de estudiante (en dado caso de que a matricula empiece con el numero 0 debe ser
      tomada en cuenta y ser anexado junto al número de matrícula). 3. Teléfono de contacto. 4. Turno de interés
      (Matutino o Vespertino)'
    - Esperar el tiempo de respuesta, en el cual se informa la disponibilidad vía correo electrónico
    - Una vez que se haya asignado una cita, es necesario presentarse en el Departamento de Mantenimiento y Servicios
      Generales en la fecha y hora indicadas, las cuales se indicaran mediante correo electrónico
    - Llenar y firmar el formato Normas de Estacionamiento
    - Pagar el costo del trámite en caja de Contabilidad
    - Recibir Tarjetón en el Departamento de Mantenimiento
  notes: Estudiantes que requieran el servicio de estacionamiento en las instalaciones de UTT
