title: Tarjetón para el servicio de estacionamiento de paga UTT
summary: Solicitud de tarjetón de acceso al estacionamiento para el turno asignado, de acuerdo con la lista de espera.
  Este tarjetón permite a los usuarios acceder y utilizar el estacionamiento de manera segura y ordenada dentro
  de las instalaciones.
