positive_silence: false
requires_inspection: false
channels:
- en_linea
- presencial
scenarios:
- name: Alumno
  requirements:
  - text: Contar con matrícula en Colegio de Bachilleres del Estado de Baja California
    cites:
    - source: retys
  - text: Haber estado reinscrito en el periodo anterior al que se pretende reinscribir
    cites:
    - source: retys
  - text: Cumplir con los criterios establecidos para la reinscripción
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Ingresar a http://alumnos.cobachbc.edu.mx/reinscripcion/ o da click al botón de Iniciar trámite
    - Seleccionar el municipio donde radica
    - Leer las instrucciones del proceso
    - Tener a la mano la matrícula y su fecha de nacimiento para ingresar al trámite
    - Revisa, modifica y actualiza la información de tus datos personales, de tu padre o tutor sin dejar en blanco
      los campos requeridos para poder reinscribirte.
    - Llenar el cuestionario de contexto.
    - Verifica que estén correctos plantel, semestre y asignaturas a cursar, antes de presionar el botón Registrar.
      En caso de error acude a tu plantel.
    - Imprime o genera PDF de tu comprobante de reinscripción
  notes: Reinscripción en línea
