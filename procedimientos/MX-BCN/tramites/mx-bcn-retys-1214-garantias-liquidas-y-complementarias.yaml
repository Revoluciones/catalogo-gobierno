title: Garantías Líquidas y Complementarias
summary: Los productores del sector primario, reciben garantías líquidas y complementarias por el monto de hasta
  el 30% del proyecto autorizado por la institución bancaria o institución auxiliar del crédito de acuerdo a la
  viabilidad y rentabilidad del proyecto autorizado por la misma, siempre y cuando el proyecto cumpla con los requisitos
  exigidos por las fuentes de financiamiento y el comité técnico del fideicomiso
