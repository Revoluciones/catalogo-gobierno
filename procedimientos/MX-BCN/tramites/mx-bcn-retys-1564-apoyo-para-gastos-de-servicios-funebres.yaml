scenarios:
- name: Servicios fúnebres dentro del Estado
  requirements:
  - text: Copia de la identificación oficial vigente con fotografía (credencial para votar, pasaporte mexicano,
      licencia de conducir emitida en el Estado de Baja California, vigente y que señale domicilio).
    cites:
    - source: retys
  - text: Copia de comprobante de domicilio con antigüedad no mayor a 3 meses (agua, energía eléctrica, predial
      u otros) o carta de residencia emitida por autoridad municipal.
    cites:
    - source: retys
  - text: Copia de certificado o acta de defunción.
    cites:
    - source: retys
  - text: Presupuesto dirigido al Gobierno del Estado de Baja California que expide el velatorio de DIF.
    cites:
    - source: retys
  - text: Copia de la Clave Única de Registro de Población (CURP).
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las instalaciones de la Secretaría de Bienestar.
    - Realizar entrevista, revisión de documentación y llenado de formato único.
    - Evaluación de la solicitud por parte del personal.
    - Notificación al usuario del estatus de su trámite.
  notes: Requisitos para solicitar apoyo para Servicios Fúnebres dentro del Estado de Baja California
