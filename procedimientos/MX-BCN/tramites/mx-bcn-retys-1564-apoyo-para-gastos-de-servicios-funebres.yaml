    - source: retys
  - text: Copia del comprobante de domicilio con antigüedad no mayor a 3 meses (agua, energía eléctrica, predial
      u otros) o carta de residencia emitida por autoridad municipal.
    cites:
    - source: retys
  - text: Copia de certificado o acta de defunción.
    cites:
    - source: retys
  - text: Presupuesto dirigido al Gobierno del Estado de Baja California que expide el velatorio de DIF.
    cites:
    - source: retys
  - text: Documento oficial que acredite que la persona fallecida residía en el Estado de Baja California antes
      de su deceso y que es mexicano de nacimiento, acreditar con acta de nacimiento del beneficiado que el solicitante
