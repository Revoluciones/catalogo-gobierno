title: COFEPRIS-05-049 Aviso de Modificación o Baja al Aviso de Funcionamiento y/o Responsable Sanitario del Establecimiento
  de Salud Ambiental
summary: Cuando el ciudadano requiera obtener el aviso de modificación o la baja del aviso de funcionamiento y responsable
  sanitario de un establecimiento de salud ambiental, (que no opera con licencia sanitaria) éste debe ser ingresado
  cuando se modifiquen datos o se suspendan actividades.
