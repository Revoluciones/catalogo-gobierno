id: mx-bcn-retys-1333-intervencion-de-endoscopia
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Intervención de Endoscopia
summary: Es un procedimiento que permite que la o el médico vea el interior de la vía digestiva, por medio de un
  instrumento llamado endoscopio, que tiene una cámara diminuta unida a un tubo largo y delgado.
authority:
  name: Unidad de Especialidades Médicas de Baja California
official_ids:
  retys_id: 1333
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/1333
  homoclave: BC-UNEME-006
who_can:
- Interesado
when: Cuando la o el especialista lo recomiende
result: Atención médica especializada en cirugía general y tratamiento de vías digestivas
cost:
  type: gratuito
  amount_mxn: null
  text: SIN COSTO
  as_of: '2026-11-06'
  cites:
  - source: retys
