  text: 'Tiempo que tiene el organismo para resolver: 5 Días Hábiles'
  cites:
  - source: retys
positive_silence: false
requires_inspection: false
channels:
- presencial
offices:
- municipality: Mexicali
  name: Dirección de Unidad Quirúrgica
  address: 'Avenida Olimpus #S/N, Plutarco Elías Calles, Mexicali, 21376'
- municipality: Ensenada
  name: Dirección de Unidad Quirúrgica
  address: 'Avenida Gastelum #1340, Zona Centro, Ensenada, 22800'
scenarios:
- name: Derechohabientes IMSS-BIENESTAR
  requirements:
  - text: Hoja de derivación debidamente requisitada y sellada, proporcionada por el centro de salud y/u Hospital
      General.
    cites:
    - source: retys
  - text: Identificación oficial (credencial INE, pasaporte mexicano, licencia de conducir)
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Historia clínica, exámenes de laboratorio, reporte de la valoración cardiopulmonar cuando proceda y demás
      estudios de gabinete que procedan de acuerdo a la intervención quirúrgica, proporcionados por el centro de
      salud y/u Hospital General.
    cites:
    - source: retys
  - text: Carta de consentimiento informado para cirugía y anestesia, que se le entrega en UNEME antes de la cirugía.
      Firma el paciente o su familiar responsable.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la consulta en el establecimiento correspondiente
    - Se miden los signos vitales, se realiza entrevista médica y exploración física. De ser necesario, se deriva
      a la UNEME
    - Contactar al ciudadano, indicándole fecha, hora y cuidados previos a la endoscopía
    - Acudir a UNEME con un acompañante, identificarse y entregar los requisitos
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la intervención (incluyendo vendaje y suero), trasladar al quirófano y, después
      del procedimiento, dar instrucciones para el cuidado y alta.
  notes: Derechohabientes de los Servicios de Salud del Instituto Mexicano del Seguro Social para el Bienestar
- name: Derechohabientes IMSS, ISSSTE e ISSSTECALI
  requirements:
  - text: Nota médica de referencia de la unidad de origen que incluya resultados de laboratorio o los exámenes
      de laboratorio de respaldo
    cites:
    - source: retys
  - text: Hoja de derivación debidamente llenada y sellada, que le proporciona el IMSS, ISSSTE o ISSSTECALI, según
      corresponda.
    cites:
    - source: retys
  - text: Carta de consentimiento informado, que se le entrega en UNEME antes de la endoscopía
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial (INE, pasaporte o licencia de manejo).
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la consulta en el establecimiento correspondiente
    - Se miden los signos vitales, se realiza entrevista médica y exploración física. De ser necesario, se deriva
      a la UNEME
    - Contactar al ciudadano, indicándole fecha, hora y cuidados previos a la endoscopía
    - Acudir a UNEME con un acompañante, identificarse y entregar los requisitos
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la intervención (incluyendo vendaje y suero), trasladar al quirófano y, después
      del procedimiento, dar instrucciones para el cuidado y alta.
  notes: Derechohabientes del Instituto Mexicano del Seguro Social, del Instituto de Seguridad y Servicios Sociales
    de los Trabajadores del Estado y del Instituto de Seguridad y Servicios Sociales de los Trabajadores del Gobierno
    y Municipios del Estado de Baja California
