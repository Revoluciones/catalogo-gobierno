scenarios:
- name: Alumnado
  requirements:
  - text: Registrarse en el programa activo con disponibilidad
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - Ingresar al enlace de herramientas alumnos haciendo clic en el botón "Iniciar Trámite" ubicado en la parte
      inferior derecha.
    - Ingresar al módulo de servicio social y prácticas profesionales para elegir el programa con disponibilidad
      para registrarse.
    - Completar formato para asignación, imprimir y firmar.
    - Acudir al plantel al área de servicios educativos para entrega del formato de asignación.
    - Verifica formato y realiza el alta de la asignación.
    - Realiza el servicio social y posterior a los 3 meses elaborará el formato trimestral de reporte de actividades.
    - Completa el formato trimestral, imprime y acude al plantel para la entrega del formato.
    - Posterior a los 3 meses vuelve a completar el formato trimestral, imprime , firma y acude al plantel.
    - Verifica que haya concluido el servicio social el alumno con la entrega de los reportes y genera la constancia
      de acreditación de servicio social.
    - Solicita copia de constancia de acreditación de servicio social .
  notes: alumnado podrá realizar a partir de 1 er semestre servicio social.
