summary: ¿Te gusta leer? ¿Quieres participar en actividades relacionadas con los libros y la lectura? Este servicio
  te da acceso a salas de lectura en Baja California, disfrutar de una colección de libros para leer en el lugar,
  unirte a actividades que promueven la lectura y pedir libros prestados para leerlos en tu hogar
