- municipality: Mexicali
  name: Seguridad Privada (Edificio Museo del Agua)
  address: 'Av. Álvaro Obregón #514, Sección Primera, Mexicali, 21100'
scenarios:
- name: Prestadores independientes de servicios de seguridad privada
  requirements:
  - text: Solicitud de autorización
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/7024
  - text: acta de nacimiento, CURP o carta de naturalización (personas físicas) en donde se acredite su nacionalidad
      mexicana
    cites:
    - source: retys
  - text: La cédula del Registro Federal de Contribuyentes expedida por la Secretaría de Hacienda y Crédito Público
    cites:
    - source: retys
  - text: La constancia de empadronamiento o inscripción del Registro Federal de Contribuyentes ante la Secretaría
      de Planeación y Finanzas del Estado de Baja California
    cites:
    - source: retys
  - text: 'Autorización para operar equipo de radio: expedido por la autoridad reguladora o por una empresa de telecomunicaciones
      autorizada.'
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/7009
  - text: Listado detallado del equipo de radiocomunicación
    cites:
    - source: retys
  - text: El manual de operaciones especifico por cada modalidad de las previstas en el artículo 4 del Reglamento
      que se solicite
    cites:
    - source: retys
  - text: Documento que señale la delimitación geográfica del servicio
    cites:
    - source: retys
  - text: Documentación que acredite el domicilio legal de matriz y sucursales para recibir notificaciones dentro
      del estado, las sucursales para oír y recibir notificaciones dentro del estado, así como plano de ubicación
      de ambos.
    cites:
    - source: retys
  - text: La relación del propietario, cuando se trate de persona fisíca y de los socios y representante o apoderado
      legal de la negociación cuando se trate de personas morales, que contenga su nombre, domicilio, lugar y fecha
      de nacimiento, así como el nombre de sus padres, agregando copia de las actas de nacimiento o cartas de naturalización
      e Identificación oficial vigente con fotografía
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/7014
  - text: La relación del equipo de protección personal como marca, modelo, y numero de serie
    cites:
    - source: retys
  - text: Descripción de la flota vehicular, especificando marca, modelo y documentación vigente, póliza contra
      daños a terceros e imágenes a colores, logotipos o emblemas en las que se aprecien sus insignias
    cites:
    - source: retys
  - text: Documentacion que acredite la legal posesión y portación de las armas de fuego utilizadas en el servicio
      de seguridad privada
    cites:
    - source: retys
  - text: Imagenes a color de las insignias y aditamentos de seguridad privada.
    cites:
    - source: retys
  - text: imagen a color frontal, trasera lateral izquierda y lateral derecha, de cuerpo entero del uniforme y sus
      accesorios.
    cites:
    - source: retys
  - text: Programa de capacitación que cumpla con lo establecido en el articulo 4 del reglamento y los lineamientos
      del instituto de Estudios de prevención y formación interdisciplinaria . Este plan debe especificar las materias,
      duración, calendario y responsables de cada curso.
    cites:
    - source: retys
  - text: Permiso de uso de suelo para local comercial expedido por la autoridad competente donde se encuentre,
      matriz y/o sucursales.
    cites:
    - source: retys
  - text: Constancia de no antecedentes penales del propietario, así como no estar sujetos a proceso penal alguno
    cites:
    - source: retys
  - text: Modelo de gafete o credencial de identificación que expedirán para uso obligatorio del personal operativo
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/7023
  modes:
  - name: Presencial
    steps:
    - El ciudadano acreditará los requisitos para su modalidad o modalidades
    - El ciudadano presentará una carpeta con los requisitos en la dirección de seguridad privada
    - El servidor público revisará que cumpla con la totalidad de los requisitos
    - El servidor público informará al ciudadano si su carpeta cumple o no con los requisitos y que es necesario
      solventar
    - Cuando la carpeta este completa, se realizará una visita al ciudadano, para verificar que cumpla con los requisitos
      del establecimiento
    - Una vez realizada la visita y cumplidos todos los requisitos, se realizará un oficio de pago por la autorización
    - El ciudadano realizará el pago de la autorización y entregará su comprobante en la dirección de seguridad
      privada
    - El servidor público hará entrega del permiso al ciudadano y explicará las obligaciones con las que debe cumplir
  notes: Las personas físicas que presten servicios de seguridad privada directa y personalmente en el Estado de
    Baja California, siempre y cuando no tengan personal operativo a su cargo
