branch: ejecutivo
kind: tramite
title: Autorización para personas independientes que brindan Seguridad Privada
summary: Trámite en el cual personas físicas de manera particular, exhiben los requisitos necesarios para la validación
  de la prestación del servicio de seguridad privada de manera privada, es decir, un particular que trabaja sin
  pertenecer a alguna empresa de seguridad privada.
