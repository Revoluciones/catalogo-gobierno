  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas de las Subprocuradurías para la Defensa de los Menores y la Familia, en cualquiera de
      los municipios del Estado, a solicitar el servicio y/o trámite.
    - Se realiza la Comparecencia entre los Solicitantes y el Agente Procurador
    - Los Solicitantes recaban y entregan la documentación que solicita el Agente Procurador
    - El Agente Procurador recibe la documentación solicitada
    - El Agente Procurador lleva a cabo las diligencias correspondientes a la representación
  notes: Recopilación de documentos para el servicio.
