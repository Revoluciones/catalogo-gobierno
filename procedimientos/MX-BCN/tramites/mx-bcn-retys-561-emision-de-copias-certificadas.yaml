scenarios:
- name: Personas físicas
  requirements:
  - text: Llenar el formulario con los datos que se le solicite (partida vieja o nueva, municipio, número de partida,
      nombre a las cuales se expide el recibo de pago para la presentación del servicio
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Ingresar al portal del registro público a la pagina https://rppcweb.ebajacalifornia.gob.mx/portalbc/produccion/portalapp/index.html
      o dar clic en "iniciar tramite" de la parte inferior derecha
    - Seleccionar la opción emisión de copias certificadas
    - Realizar el pago en línea
  - name: Presencial
    steps:
    - Acudir a la oficina registral
    - Llenar debidamente el Formato FMO-8.5.1-02 y seleccionar la opción de copias certificadas de título, contrato,
      escritura, inscripción, apéndice/anotaciones
    - Pagar los derechos correspondientes
  notes: Para la certificación de documentos
