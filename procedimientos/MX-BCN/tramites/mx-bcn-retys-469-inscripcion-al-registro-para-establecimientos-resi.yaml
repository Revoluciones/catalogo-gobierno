  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas para presentar la solicitud
    - Entrega documentos para el registro de inscripción.
    - Revisión y validación de la documentación del Establecimiento
    - Visita de inspección. Si acredita con más del 85% cumple con el trámite para registro en el padrón. En caso
      de no contar con el porcentaje, se entregará un diagnóstico situacional de las áreas de oportunidad para ser
      solventadas.
    - Entrega de reconocimiento.
  notes: Son los Establecimiento Especializado en el Tratamiento de las Adicciones (EETA´S)
