scenarios:
- name: Vacunación antirrábica canina y felina
  requirements:
  - text: La mascota sea mayor de 3 meses
    cites:
    - source: retys
  - text: La mascota no debe estar gestando ni en periodo de lactancia
    cites:
    - source: retys
  - text: La mascota se encuentre sana y no en tratamiento
    cites:
    - source: retys
  - text: Presentar a la mascota con correa y bozal de preferencia.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Presentarse al puesto de vacunación con la mascota sana para solicitar la vacuna antirrábica canina/felina
    - Realiza aplicación de la vacuna y expide comprobante de vacunación
    - Coloca placa de identificación de mascota vacunada vigente
    - Acudir a la aplicación de la vacuna cada año.
  notes: Aplicación de vacuna a perros y gatos para la protección de la rabia.
