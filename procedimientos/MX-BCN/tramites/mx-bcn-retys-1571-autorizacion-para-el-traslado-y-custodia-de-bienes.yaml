title: Autorización para el Traslado y Custodia de Bienes o Valores
summary: Trámite en el cual se valida y autoriza la prestación del servicio de seguridad privada especializado en
  traslado y custodia de bienes o valores (transporte y recolección de bienes monetarios en camiones blindados y
  seguridad en instituciones de crédito y financieras).
