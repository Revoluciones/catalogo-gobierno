scenarios:
- name: Traslado y custodia de bienes y valores persona moral
  requirements:
  - text: Solicitud de autorización
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12055
  - text: El acta constitutiva cuyo objeto social esté relacionado con la prestación de servicios de seguridad privada
    cites:
    - source: retys
  - text: La cédula de Registro Federal de Contribuyente expedida por la SHCP
    cites:
    - source: retys
  - text: La constancia de empadronamiento o inscripción del Registro Federal de Contribuyentes ante la Secretaría
      de Planeación y finanzas del Estado de Baja California.
    cites:
    - source: retys
  - text: 'Autorización para operar equipo de radio: Expedida por la autoridad reguladora o por una empresa de telecomunicaciones
      autorizada'
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/6854
  - text: Listado detallado del equipo de radio comunicación
    cites:
    - source: retys
  - text: El documento en el que señale la circunscripción territorial para la cuál se solicita la autorización
    cites:
    - source: retys
  - text: Manuales de operaciones específicos para cada modalidad previstas en el artículo 4 del reglamento de seguridad
    cites:
    - source: retys
  - text: Documentación que acredite el domicilio legal de matriz y sucursales para recibir notificaciones dentro
      del Estado, así como planos de ubicación de ambos
    cites:
    - source: retys
  - text: Relación del propietario, socios y personal operativo con nombre, domicilio, lugar y fecha de nacimiento
      y nombre de sus padres, agregando copia de actas de nacimiento o carta de naturalización e identificación
      oficial vigente
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/6859
  - text: Comprobante de cumplimiento del artículo 74 para personal operativo
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/6860
  - text: Relación detallada del equipo de protección personal como marca, modelo y número de serie
    cites:
    - source: retys
  - text: Descripción de la flota vehicular, especificando marca, modelo y documentación vigente, póliza contra
      daños a terceros e imágenes colores, logotipos o emblemas en las que se aprecien sus insignias Documentación
      vigente que acredite la legal posesión y portación de las armas de fuego utilizadas en el servicio de seguridad
      privada
    cites:
    - source: retys
  - text: Una imagen a color de insignias y aditamentos de seguridad a utilizar Una imagen a color frontal, trasera,
      lateral izquierda y lateral derecha, a color, de cuerpo entero del uniforme y sus accesorios (cumplir con
      las condiciones del Artículo 85 del Reglamento
    cites:
    - source: retys
  - text: Nombre del jefe de operaciones anexado los requisitos del artículo 74 del reglamento
    cites:
    - source: retys
  - text: Plan detallado de capacitación continua para todo el personal operativo, incluyendo al jefe de operaciones,
      que cumpla con lo establecido en el artículo 4 del reglamento y los lineamientos del Instituto. Este plan
      debe especificar las materias, duración, calendario y entidades responsables de cada curso
    cites:
    - source: retys
  - text: Permiso de uso de suelo para local comercial expedido por la autoridad competente donde se encuentre matriz
      y/o sucursales
    cites:
    - source: retys
  - text: Constancia vigente de no antecedentes penales vigente del propietario y/o socios, representantes o apoderados
      legales
    cites:
    - source: retys
  - text: Propietario y/o socios, representantes o apoderados legales no estar sujeto a proceso penal o haber sido
      condenados por delitos dolosos
    cites:
    - source: retys
  - text: Modelo del gafete o credencial de identificación para el personal operativo
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12118
  - text: Instalar puertas esclusas para el acceso del público en general hacia el mostrador.
    cites:
    - source: retys
  - text: Contar con vidrio blindado en ventanillas del mostrador
    cites:
    - source: retys
  - text: Contar con bóveda separada de la estructura principal del establecimiento y mecanismo de retardo para
      su acceso
    cites:
    - source: retys
  - text: Tener circuito cerrado de video 24/7 los 365 días del año Tener sistema de alarma conectados a una central
      de monitoreo
    cites:
    - source: retys
  - text: Mínimo tener tres personas por unidad para transporte de valores.
    cites:
    - source: retys
  - text: Tener vehículos blindados y constancia expedida por el proveedor de servicio de blindaje que acredite
      que nivel de protección cuenta conforme la Norma Oficial Mexicana aplicable.
    cites:
    - source: retys
  - text: Licencia particular colectiva vigente para uso de armas de fuego y contrato de prestación de servicio
      el traslado de valores. Si son instituciones de policía en el Estado presentar el recibo oficial del pago
      del servicio contratado.
    cites:
    - source: retys
  - text: Sistema y procedimiento de control de seguridad adecuados para el acceso del personal y del público en
      general.
    cites:
    - source: retys
  - text: Efectuar recepción y envío de efectivo y valores en áreas de acceso restringido.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El ciudadano acreditará los requisitos para su modalidad o modalidades
    - El ciudadano presentará una carpeta con los requisitos en la dirección de seguridad privada
    - El servidor público revisará que cumpla con la totalidad de los requisitos
    - El servidor público informará al ciudadano si su carpeta cumple o no con los requisitos y que es necesario
      solventar
    - Cuando la carpeta este completa, se realizará una visita al ciudadano, para verificar que cumpla con los requisitos
      del establecimiento
    - Una vez realizada la visita y cumplidos todos los requisitos, se realizará un oficio de pago por la autorización
    - El ciudadano realizará el pago de la autorización y entregará su comprobante en la dirección de seguridad
      privada
    - El servidor público hará entrega del permiso al ciudadano y explicará las obligaciones con las que debe cumplir
  notes: Consistirán en vigilar, proteger y en su caso, trasladar hasta su destino, los bienes o valores que les
    sean encomendados por los prestatarios de dicho servicio
