  - text: Recibos de pago del servicio, pago por la visita de verificación y por la expedición del pe la constancia.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El usuario o su responsable técnico debe llenar el formato del permiso de descarga de aguas disponible en
      la página de CESPM, pagar la tarifa correspondiente y adjuntar los resultados del análisis de las aguas residuales
      procedentes de procesos productivos.
    - El usuario o su representante envía el formulario completo, el comprobante de pago y los resultados del análisis
      a la Oficina de Normatividad y Control Ambiental (ONCA).
    - ONCA recibirá y revisará el documento en caso de ser necesario solicitará información adicional y/o en su
      caso programara una visita confirmativa de datos.
    - Una vez que ONCA evalué la información y en su caso verifique los datos técnicos emitirá el permiso de descarga
    - Se le comunicará al usuario para que pase por su permiso.
