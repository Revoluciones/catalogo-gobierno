title: Registro de descarga de aguas potencialmente contaminantes
summary: Revisar los volúmenes de agua, equipos, procesos, materias primas y contaminantes en contacto con el agua,
  así como las condiciones operativas de la planta de tratamiento, para asegurar el cumplimiento normativo antes
  de la descarga al alcantarillado
