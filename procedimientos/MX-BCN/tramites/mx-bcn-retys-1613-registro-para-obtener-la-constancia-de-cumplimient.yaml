      y realiza la Visita Adicional de Verificación: SE CUMPLE con lo indicado en el oficio de Dimensionamiento
      de dispositivo(s): Ir al siguiente paso. NO SE CUMPLE con lo indicado en el oficio de Dimensionamiento de
      dispositivo(s): La persona Analista de la Coordinación de Control de Calidad le hará saber lo que incumple
      y le indicará que debe solicitar una Visita Adicional de Verificación, cuando haya cumplido.'
