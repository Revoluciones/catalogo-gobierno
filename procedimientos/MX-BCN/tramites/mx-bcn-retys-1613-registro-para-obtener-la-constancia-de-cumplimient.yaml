scenarios:
- name: Registro inicial - Persona Moral
  requirements:
  - text: Original y copia del Formulario para el Registro al Programa Atrapa La Grasa y Sólidos (FRM-009), debidamente
      llenado y firmado.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11727
  - text: 'Copia de documento para cotejar clave catastral con la registrada en la cuenta en CESPT: Recibo del impuesto
      predial del predio en el que se encuentra ubicada la empresa o establecimiento, con fecha de emisión no mayor
      a un año de antigüedad.'
    cites:
    - source: retys
  - text: Copia del documento de Alta ante la Secretaría de Hacienda.
    cites:
    - source: retys
  - text: Copia del Acta Constitutiva de la empresa.
    cites:
    - source: retys
  - text: Copia del Poder General notariado para actos de administración vigente, que acredite la personalidad del
      representante legal, en caso de NO ESTAR ESTABLECIDO en el Acta Constitutiva.
    cites:
    - source: retys
  - text: 'Copia de identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a
      quien éste le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial
      del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Copia de un croquis de ubicación de la empresa.
    cites:
    - source: retys
  - text: Pago correspondiente
    cites:
    - source: retys
  - text: Las copias deben ser LEGIBLES y contener el DOCUMENTO COMPLETO-
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - INCLUYE 2 INSPECCIONES, siempre y cuando se cumpla con los plazos establecidos en el Oficio de dimensionamiento
      de dispositivo(s).
    - Acudir a la Coordinación de Control de Calidad, ubicada en el edificio que se encuentra en la parte posterior
      izquierda de Oficinas Centrales de CESPT y presentar los requisitos.
    - Personal de la Coordinación de Control de Calidad, revisa que los requisitos estén completos, de no ser así,
      informa a la persona solicitante que no es posible realizar el trámite hasta que se completen.
    - Con los requisitos completos, personal de la Coordinación de Control de Calidad le proporciona una Ficha de
      Pago y el original y copia del Formulario para el Registro al Programa Atrapa la Grasa y Sólidos.
    - Con la Ficha de pago pasar al área de Cajas y hacer el pago correspondiente.
    - Una vez realizado el pago, pasar al área de Archivo, presentar el Recibo de Pago y entregar el original y
      copia del Formulario para el Registro al Programa Atrapa la Grasa y Sólidos.
    - El personal de Archivo imprime la certificación de recibido al original y copia del Formulario para el Registro
      al Programa Atrapa la Grasa y Sólidos, en donde se indica la fecha de respuesta, y entrega la copia a la persona
      solicitante.
    - En fecha posterior, una persona Analista de la Coordinación de Control de Calidad realiza la inspección inicial.
    - Con el resultado de la inspección inicial, personal de la Coordinación de Control de Calidad elabora oficio
      de Dimensionamiento de dispositivo(s), en el que se indicarán las adecuaciones y sistemas de pretratamiento
      que debe realizar y el plazo para realizarlas.
    - Personal de la Coordinación de Control de Calidad se comunica con la persona solicitante para que pase por
      el oficio de Dimensionamiento de dispositivo(s).
    - Realizar lo indicado en el oficio de Dimensionamiento de dispositivo(s), dentro del plazo establecido.
    - 'Una vez que se cumpla con lo indicado en el oficio de Dimensionamiento de dispositivo(s), SI ESTÁ EN EL PLAZO
      ESTABLECIDO: Solicitar la visita de verificación, utilizando el formulario Solicitud de visita de verificación
      al Programa Atrapa la Grasa y Sólidos (FRM-014), a la Coordinación de Control de Calidad y continuar en el
      siguiente paso. Si NO ESTÁ DENTRO DEL PLAZO ESTABLECIDO: Solicitar una Visita Adicional de Verificación (ver
      requisitos y procedimiento en este mismo documento) a la Coordinación de Control de Calidad.'
    - 'Una persona Analista de la Coordinación de Control de Calidad acude al domicilio de la empresa o establecimiento
      y realiza la visita de verificación, SE CUMPLE CON LO INDICADO en el oficio de Dimensionamiento de dispositivo(s):
      Ir al siguiente paso. NO SE CUMPLE con lo requerido por el Programa: La persona Analista de la Coordinación
      de Control de Calidad le hará saber lo que incumple y le indicará que debe solicitar una Visita Adicional
      de Verificación (ver requisitos y procedimiento en este mismo documento), cuando haya cumplido.'
    - CESPT emite la Constancia de Cumplimiento al Programa Atrapa la Grasa y Sólidos, y contacta a la persona solicitante
      para que pase a recoger el documento.
    - Acudir a CESPT por la Constancia de Cumplimiento al Programa Atrapa la Grasa y Sólidos.
  notes: Registro inicial - Persona Moral
