summary: Proporcionar la exención de pago a personas en situación de pobreza mayores de 60 años, personas viudas
  en situación de pobreza mayores de 50 años, discapacitados, jubilados y pensionados, siempre que éstos no obtengan
  ingresos mayores al equivalente a cinco veces a la unidad de medida y actualización ejercicio 2026
