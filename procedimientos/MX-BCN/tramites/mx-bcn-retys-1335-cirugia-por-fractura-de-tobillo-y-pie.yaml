id: mx-bcn-retys-1335-cirugia-por-fractura-de-tobillo-y-pie
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Cirugia por Fractura de Tobillo y Pie
summary: Procedimiento quirúrgico para alienar una fractura en la zona del tobillo para permitir una adecuada consolidación
  y recuperación completa.
authority:
  name: Unidad de Especialidades Médicas de Baja California
official_ids:
  retys_id: 1335
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/1335
  homoclave: BC-UNEME-008
who_can:
- Interesado
when: Cuando la o el especialista diagnostique la fractura a través de una radiografía
result: Atención médica especializada en traumatologia y ortopedia
cost:
  type: gratuito
  amount_mxn: null
  text: SIN COSTO
  as_of: '2026-11-06'
  cites:
  - source: retys
deadlines:
- what: respuesta_autoridad
  text: 'Tiempo que tiene el organismo para resolver: 5 Días Hábiles'
  cites:
  - source: retys
positive_silence: false
requires_inspection: false
channels:
- presencial
offices:
- municipality: Mexicali
  name: Dirección de Unidad Quirúrgica
  address: 'Avenida Olimpus #S/N, Plutarco Elías Calles, Mexicali, 21376'
- municipality: Ensenada
  name: Dirección de Unidad Quirúrgica
  address: 'Avenida Gastelum #1340, Zona Centro, Ensenada, 22800'
scenarios:
- name: Derechohabientes del IMSS-BIENESTAR
  requirements:
  - text: Hoja de derivación debidamente requisitada y sellada, que le entregan en el centro de salud y/u Hospital
      General.
    cites:
    - source: retys
  - text: Identificación oficial (credencial de elector, pasaporte, licencia de manejo).
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Historia clínica, exámenes de laboratorio, reporte de la valoración cardiopulmonar cuando, proporcionados
      en el centro de salud.
    cites:
    - source: retys
  - text: Carta de consentimiento informado para cirugía y anestesia. Se le entrega en UNEME, previo a la cirugía
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la consulta médica del establecimiento que le corresponda.
    - Se le miden los signos vitales, se realiza una entrevista médica y exploración física. Se deriva con un ortopedista
      si es necesario
    - Acudir a la consulta de ortopedia
    - Se le miden signos vitales. El especialista realiza entrevista médica y exploración física. Se deriva UNEME
      si es necesario
    - Contactar al ciudadano, indicando fecha, hora y cuidados necesarios previos a la cirugía
    - Acudir a UNEME con un acompañante, identificarse y entregar los requisitos
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la cirugía, trasladar al quirófano y, después del procedimiento, dar instrucciones
      para el cuidado y alta.
  notes: Derechohabientes de los Servicios de Salud del Instituto Mexicano del Seguro Social para el Bienestar
- name: Derechohabientes IMSS, ISSSTE e ISSSTECALI
  requirements:
  - text: Hoja de derivación debidamente requisitada y sellada, se proporciona por el IMSS, ISSSTE o ISSSTECALI
      en su caso
    cites:
    - source: retys
  - text: Nota médica de referencia de la unidad de origen que incluya resultados de laboratorio o los exámenes
      de laboratorio de respaldo.
    cites:
    - source: retys
  - text: Firmar la carta de consentimiento informado para cirugía y anestesia.
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial (INE, pasaporte, licencia de conducir).
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la consulta médica del establecimiento que le corresponda.
    - Se le miden los signos vitales, se realiza una entrevista médica y exploración física. Se deriva con un ortopedista
      si es necesario
    - Acudir a la consulta de ortopedia
    - Se le miden signos vitales. El especialista realiza entrevista médica y exploración física. Se deriva UNEME
      si es necesario
    - Contactar al ciudadano, indicando fecha, hora y cuidados necesarios previos a la cirugía
    - Acudir a UNEME con un acompañante, identificarse y entregar los requisitos
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la cirugía, trasladar al quirófano y, después del procedimiento, dar instrucciones
      para el cuidado y alta.
  notes: Derechohabientes del Instituto Mexicano del Seguro Social, del Instituto de Seguridad y Servicios Sociales
    de los Trabajadores del Estado y del Instituto de Seguridad y Servicios Sociales de los Trabajadores del Gobierno
    y Municipios del Estado de Baja California
