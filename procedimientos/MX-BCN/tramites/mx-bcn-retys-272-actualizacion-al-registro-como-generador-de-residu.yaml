summary: Instrumento que presentan los generadores de residuos de manejo especial para captura de datos cuyo fin
  es contar con información normalizada, homogénea y sistemática sobre la generación y manejo de residuos originados
  por las diferentes actividades productivas y sectoriales del estado, impulsando la valorización y el buen manejo
  de estos residuos
