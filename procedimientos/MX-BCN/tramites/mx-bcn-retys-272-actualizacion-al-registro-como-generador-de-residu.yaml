  - text: Documentales (contrato de servicios, facturas, manifiestos de entrega, transporte y recepción de residuos
      de manejo especial) expedido por prestador de servicio autorizado por la Secretaría de Medio Ambiente, que
      acrediten el manejo integral de los residuos generados por el establecimiento
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Ingresar al portal mediante el botón "Iniciar trámite" ubicado en la parte inferior derecha.
    - Seleccionar el tipo de persona (física o moral) y capturar los campos requeridos.
    - Realizar el pago de derechos.
    - Subir los documentos solicitados.
    - Se le va a indicar que el documento correspondiente se encuentra disponible para su entrega y deberá acudir
      a la oficina correspondiente para recogerlo.
  - name: Presencial
    steps:
    - Consultar el trámite en RETYS y revisar los requisitos, formatos y costo aplicable.
    - Llenar el formato de solicitud con la información actualizada.
    - Integrar la documentación requerida conforme a los requisitos establecidos para el trámite.
    - Realizar el pago de derechos y obtener el comprobante correspondiente.
    - Presentar la solicitud en las oficinas de la Secretaría de Medio Ambiente y Desarrollo Sustentable, anexando
      el formato, la documentación y el comprobante de pago.
    - Dar seguimiento al trámite consultando periódicamente el listado de resoluciones publicadas en el enlace disponible
      en la página oficial de la SMADS.
    - Recoger la notificación de resolución una vez que el trámite aparezca como disponible en el listado. La notificación
      deberá ser recibida por el representante legal o apoderado legal, quien deberá acreditar su personalidad jurídica
      conforme a la normatividad aplicable.
  notes: Generador de residuos de manejor especial
