title: Departamento de asesoría jurídica
summary: Brindar orientación, asesoría, y acompañamiento jurídico especializado, gratuito e integral a las mujeres
  usuarias del centro de justicia para las mujeres que se encuentren en situación de violencia, a fin de garantizar
  el acceso efectivo a la justicia, la protección de sus derechos humanos y el ejercicio de sus derechos legales,
  mediante la atención, orientación, intervención y seguimiento de asuntos en materia penal, familiar y demás materias
  relacionadas con su situación jurídica, de conformidad con el marco normativo aplicable y bajo los principios
  de perspectiva de género, debida diligencia, confidencialidad, no discriminación y atención centrada en las necesidades
  de las usuarias.
