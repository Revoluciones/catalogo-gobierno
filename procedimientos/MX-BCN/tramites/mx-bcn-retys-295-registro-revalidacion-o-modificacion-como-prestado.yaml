title: Registro, revalidación o modificación como Prestador de Servicios de Manejo Integral de Residuos de Manejo
  Especial
summary: Documento que acredita las actividades como prestador de servicios para el manejo integral de residuos
  de manejo especial.
authority:
  name: Secretaría de Medio Ambiente y Desarrollo Sustentable de Baja California
official_ids:
  retys_id: 295
