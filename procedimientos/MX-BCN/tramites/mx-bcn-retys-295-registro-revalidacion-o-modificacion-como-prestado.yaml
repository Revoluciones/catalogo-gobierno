scenarios:
- name: Registro persona física
  requirements:
  - text: 'Presentar le Formato para la obtención de la Licencia como prestador de servicios para el manejo integral
      de RME, debidamente requisitado, de conformidad con el instructivo de llenado, y entregarlo con la firma autógrafa.
      Mismo que deberá ir acompañado de lo siguiente:'
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/13870
  - text: '--- Presentar plano o croquis de las instalaciones donde se pretende desarrollar la actividad, en el
      cual se pueda apreciar cada una de las áreas que la componen.'
    cites:
    - source: retys
  - text: '--- Tabla con las coordenadas geográficas (latitud, longitud) o en UTM (X, Y), Datum WGS 84, del polígono
      del predio.'
    cites:
    - source: retys
  - text: '--- Anexar copia simple de todas y cada una de las autorizaciones en materia ambiental, emitidas por
      otras dependencias, en relación a la actividad principal la empresa.'
    cites:
    - source: retys
  - text: '--- Desarrollar el Anexo I, en caso de que la persona solicitante pretenda prestar el servicio de recolección
      y transporte de residuos de manejo especial, y presentar la información solicitada en el mismo. Acompañado
      de lo siguiente:'
    cites:
    - source: retys
  - text: '---* Listado de las empresas a las que presta el servicio.'
    cites:
    - source: retys
  - text: '---* Copias simples y legibles de los documentos que acrediten la procedencia y destino de los residuos
      de manejo especial.'
    cites:
    - source: retys
  - text: '---* Listado con el nombre de las empresas que recepcionarán los residuos de manejo especial.'
    cites:
    - source: retys
  - text: '---* Copias simples y legibles de las Licencias para prestar el servicio de manejo integral de residuos
      de manejo especial de los sitios a donde son enviados los residuos para su acopio, co-procesamiento, reciclaje,
      valorización o disposición final.'
    cites:
    - source: retys
  - text: '---* Copias simples y legibles de los documentos que acrediten la legal posesión de los automóviles utilizados
      para el desarrollo de la actividad.'
    cites:
    - source: retys
  - text: '---* Copia simple y legible de tarjeta de circulación de los vehículos, vigentes, emitidos por la autoridad
      estatal'
    cites:
    - source: retys
  - text: '--- Desarrollar el Anexo II, en caso de que la empresa solicitante pretenda prestar el servicio a terceros
      consistente en el acopio y valorización de residuos de manejo especial. Deberá acompañarlo con la siguiente
      información:'
    cites:
    - source: retys
  - text: '---* Detallar el sistema de acopio: altura de las estibas y la maquinaria y equipo utilizados para la
      manipulación de los residuos de manejo especial.'
    cites:
    - source: retys
  - text: '---* En caso de comercializar los residuos, deberá presentar copia simple y legible de los documentos
      que lo acrediten (facturas de compra-venta, contratos y/o convenios, pedimentos de exportación, etc.).'
    cites:
    - source: retys
  - text: '--- Desarrollar el Anexo III, en caso de que la empresa solicitante pretenda prestar el servicio a terceros
      consistente en la reutilización, reciclaje y/o co-procesamiento de residuos de manejo especial. Deberá acompañarlo
      de lo siguiente:'
    cites:
    - source: retys
  - text: '---* Describir cada fase del proceso de reutilización, reciclaje y/o co-procesamiento al que se someten
      los residuos de manejo especial.'
    cites:
    - source: retys
  - text: '---* Presentar un diagrama de flujo o esquematizar por pasos la descripción del proceso.'
    cites:
    - source: retys
  - text: '--- Presentar copia simple de los documentos que acrediten la correcta disposición de los residuos generados
      durante el desarrollo de la actividad.'
    cites:
    - source: retys
  - text: Recibo de pago de derechos correspondiente.
    cites:
    - source: retys
  - text: Copia simple de la identificación oficial de la persona interesada, legible y con vigencia activa.
    cites:
    - source: retys
  - text: En caso de que se actúe a través de persona apoderada o representante legal, presentar copia simple de
      la documental idónea vigente, completa y legible, mediante la cual se acredite dicha personalidad.
    cites:
    - source: retys
  - text: Presentar copia simple, legible y vigente, de la identificación oficial de la persona apoderada o representante
      legal.
    cites:
    - source: retys
  - text: 'Presentar copia simple del documento que acredite la legal utilización del predio. Los documentos que
      puede presentar son: contrato de compra-venta, escritura pública, contrato de arrendamiento, concesión, expropiación,
      etc.'
    cites:
    - source: retys
  - text: Entregar una memoria fotográfica de las instalaciones del sitio, en la que se pueda apreciar cada una
      de las áreas del manejo integral, maquinaria y equipos utilizados (incluir los vehículos rotulados con el
      nombre, domicilio y teléfono de la empresa, así como del residuo que se transporta en cada vehículo).
    cites:
    - source: retys
  - text: Presentar un programa de prevención y atención a contingencias ambientales, adecuado a las posibles situaciones
      que pudiesen surgir dentro de cada fase del manejo integral de los residuos de manejo especial, el cual contendrá
      la descripción de las acciones, medidas, obras, equipos, instrumentos o materiales con que se cuenta para
      controlar dichas situaciones, tanto para prevenirlas como para mitigarlas, desglosando cada suceso en sus
      diferentes fases indicando los efectos que espera anular, la cantidad del personal que participa en las brigadas,
      como actuarán, que recursos se necesitan y de cuáles se dispone, incluyendo las adecuaciones del equipo de
      seguridad utilizado.
    cites:
    - source: retys
  - text: Anexar el programa de capacitación y adiestramiento al personal involucrado en el manejo de los residuos
      de manejo especial (incendios, inundaciones, derrames, fugas, robo de material, pepena, generación de fauna
      nociva, etc.), incluyendo copias de las constancias de las capacitaciones tomadas.
    cites:
    - source: retys
  - text: Entregar USB que contenga la totalidad de la información presentada en la Licencia.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas de la Secretaría para presentar el trámite.
    - Recepción y evaluación de la solicitud.
    - Publicación de la resolución o prevención.
    - Recolectar el oficio y cumplir con las condicionantes o recolectar el oficio y solventar los requerimientos
      de la prevención.
  notes: Persona física que pretenda obtener el registro como prestador de servicios para el manejo integral de
    residuos de manejo especial.
