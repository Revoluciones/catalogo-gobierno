  homoclave: BC-SMADS-057
who_can:
- Representante Legal
- Interesado
when: Cuando se pretenda prestar el servicio del manejo integral de residuos de manejo especial.
result: Registro, revalidación o modificación en el padrón estatal
cost:
  type: variable
  amount_mxn: null
  text: 'COSTO VARIABLE: Registro: $16,445.72 M.N. Revalidación: $9,561.45 M.N. Modificación: $2,262.51 M.N. Costo
    actualizado para el mes de noviembre de 2026'
  as_of: '2026-11-06'
  cites:
  - source: retys
