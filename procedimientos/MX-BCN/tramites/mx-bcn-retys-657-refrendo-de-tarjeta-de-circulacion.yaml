    - source: retys
  - text: Certificado de no adeudo municipal
    cites:
    - source: retys
  - text: Seguro de responsabilidad civil vigente ( monto mínimo de cobertura de responsabilidad civil $472,279.50)
    cites:
    - source: retys
  - text: Presentar INE e identifcación que acredite ser pensionado, jubilado, adulto mayor o persona con discapacidad
    cites:
    - source: retys
  - text: Realizar el pago correspondiente
    cites:
    - source: retys
  modes:
