scenarios:
- name: Ciudadanos en general
  requirements:
  - text: Entregar las placas de circulación en caso de reemplacamiento.
    cites:
    - source: retys
  - text: Tratándose de personas físicas, presentar licencia de conducir vigente del Estado de Baja California
    cites:
    - source: retys
  - text: Certificado de no adeudo municipal
    cites:
    - source: retys
  - text: Seguro de responsabilidad civil vigente ( monto mínimo de cobertura de responsabilidad civil $472,279.50)
    cites:
    - source: retys
  - text: Realizar el pago correspondiente
    cites:
    - source: retys
  - text: 'Tratándose de personas morales: Presentar comprobante de domicilio ( con antigüedad no mayor a 6 meses),
      acta constitutiva, copia de la cédula de identificación fiscal del RFC, identificación oficial con fotografía
      vigente del representante legal y documentación en la que conste la personalidad de quién comparece.'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Haz tu cita dando click en el botón iniciar tramite
    - Acudir a la oficina de Recaudación de Rentas del Estado más cercano a su domicilio
    - Entregar requisitos para trámite en ventanilla
    - Una vez que se valida la documentación, se procede a la captura de la información del vehículo en el sistema
      de control vehicular
    - 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito (excepto
      tarjetas American Express )'
    - Procesa e imprime la tarjeta de circulación del presente año y comprobante de pago y lo entrega al contribuyente
  notes: Requisitos para obtener el refrendo de la tarjeta de circulación de vehículos
- name: Pensionados, Jubilados, personas con discapacidad y adultos mayores
  requirements:
