- municipality: Ensenada
  name: Dirección de Unidad Quirúrgica
  address: 'Avenida Gastelum #1340, Zona Centro, Ensenada, 22800'
scenarios:
- name: Derechohabientes del IMSS-BIENESTAR
  requirements:
  - text: Hoja de derivación debidamente requisitada y sellada, que le proporciona el centro de salud y/u Hospital
      General.
    cites:
    - source: retys
  - text: Historia clínica, exámenes de laboratorio, reporte de la valoración cardiopulmonar cuando proceda y demás
      estudios de gabinete que procedan de acuerdo a la intervención quirúrgica, proporcionados por el centro de
      salud y/u Hospital General.
    cites:
    - source: retys
  - text: Identificación oficial (INE, pasaporte o licencia de manejo).
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Carta de consentimiento informado, que se le entrega en UNEME antes de la cirugía
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la consulta médica del establecimiento que le corresponda.
    - Se le miden signos vitales, se realiza entrevista médica y exploración física. Se deriva con un especialista
      si es necesario.
    - Acudir a la consulta de especialidad
    - El especialista realiza una entrevista y exploración física. De ser necesario, se deriva a UNEME
    - Contactar al ciudadano para indicar fecha y hora de la cirugía, además de los cuidados previos.
    - Acudir a UNEME con un acompañante, identificarse y entregar los requisitos
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la cirugía (incluyendo vendaje y suero), trasladar al quirófano y, después del procedimiento,
      dar instrucciones para el cuidado y alta.
  notes: Derechohabientes de los Servicios de Salud del Instituto Mexicano del Seguro Social para el Bienestar
- name: Derechohabientes IMSS, ISSSTE e ISSSTECALI
  requirements:
  - text: Nota médica de referencia de la unidad de origen que incluya resultados de laboratorio o los exámenes
      de laboratorio de respaldo
    cites:
    - source: retys
  - text: Identificación oficial (INE, pasaporte, licencia de conducir).
    cites:
    - source: retys
  - text: Hoja de derivación debidamente llenada y sellada, que le proporciona el IMSS, ISSSTE o ISSSTECALI, según
      corresponda.
    cites:
    - source: retys
  - text: Carta de consentimiento informado, que se le entrega en UNEME antes de la cirugía
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la consulta médica del establecimiento que le corresponda.
    - Se le miden signos vitales, se realiza entrevista médica y exploración física. Se deriva con un especialista
      si es necesario.
    - Acudir a la consulta de especialidad
    - El especialista realiza una entrevista y exploración física. De ser necesario, se deriva a UNEME
    - Contactar al ciudadano para indicar fecha y hora de la cirugía, además de los cuidados previos.
    - Acudir a UNEME con un acompañante, identificarse y entregar los requisitos
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la cirugía (incluyendo vendaje y suero), trasladar al quirófano y, después del procedimiento,
