scenarios:
- name: Persona Física
  requirements:
  - text: Formato para presentar el Estudio de Riesgo debidamente requisitado, de conformidad con su Instructivo
      de llenado.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/13088
  - text: El Formato debe contener la firma autógrafa de la persona interesada o de su apoderado o representante
      legal y del técnico que lo elaboró.
    cites:
    - source: retys
  - text: Recibo de pago de derechos.
    cites:
    - source: retys
  - text: Resumen ejecutivo.
    cites:
    - source: retys
  - text: Copia simple de la identificación oficial de la persona interesada, legible y con vigencia activa.
    cites:
    - source: retys
  - text: En caso de que se actúe a través de apoderado o representante legal, presentar documental idónea, completa
      y nítida, mediante la cual se acredite como tal, vigente.
    cites:
    - source: retys
  - text: En caso de que se actúe a través de apoderado o representante legal, presentar copia simple de la identificación
      oficial de este, nítida y con vigencia activa.
    cites:
    - source: retys
  - text: Copia simple del Registro Federal de Contribuyentes de la persona interesada.
    cites:
    - source: retys
  - text: CD o USB que contenga la totalidad de la información presentada en el Estudio de Riesgo.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas de la Secretaría para presentar el trámite.
    - Recepción y evaluación de la solicitud.
    - Publicación de la resolución o solicitud de información adicional.
    - Recolectar el oficio y, en su caso, solventar los requerimientos de información adicional.
  notes: Persona que pretende realizar una obra o actividad considerada como riesgosa.
- name: Persona Moral
  requirements:
  - text: Formato para presentar el Estudio de Riesgo debidamente requisitado, de conformidad con su Instructivo
      de llenado.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/13097
  - text: El Formato debe contener la firma autógrafa de la persona apoderada o representante legal y del técnico
      que lo elaboró.
    cites:
    - source: retys
  - text: Resumen ejecutivo.
    cites:
    - source: retys
  - text: Recibo de pago de derechos.
    cites:
    - source: retys
  - text: Acta Constitutiva, completa y legible.
    cites:
    - source: retys
  - text: Documental idónea, completa y nítida, mediante la cual se acredite al apoderado o representante legal
      como tal, vigente.
    cites:
    - source: retys
  - text: Copia simple de la identificación oficial de apoderado o representante legal, legible y con vigencia activa.
    cites:
    - source: retys
  - text: Copia simple del Registro Federal de Contribuyentes de la persona moral.
    cites:
    - source: retys
  - text: CD o USB que contenga la totalidad de la información presentada en el Estudio de Riesgo.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas de la Secretaría para presentar el trámite.
    - Recepción y evaluación de la solicitud.
    - Publicación de la resolución o solicitud de información adicional.
    - Recolectar el oficio y, en su caso, solventar los requerimientos de información adicional.
  notes: Sociedad civil o mercantil, organismo gubernamental, ejido y todo ente creado por el derecho que pretende
    realizar una obra o actividad considerada como riesgosa.
