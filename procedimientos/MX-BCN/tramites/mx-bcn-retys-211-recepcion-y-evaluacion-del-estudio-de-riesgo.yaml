id: mx-bcn-retys-211-recepcion-y-evaluacion-del-estudio-de-riesgo
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Recepción y Evaluación del Estudio de Riesgo
summary: Documento mediante el cual se dan a conocer los riesgos por la ejecución de una obra o actividad, para
  los ecosistemas o la salud pública. Cuando se trate de obras y actividades consideradas riesgosas, se deberá incluir
  el estudio de riesgo en la manifestación de impacto ambiental, modalidad general.
