scenarios:
- name: Propietario
  requirements:
  - text: Presentar solicitud firmada por el propietario del terreno solicitando la contratación del nuevo medidor
      en derivación.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11838
  - text: Deberá estar libre de adeudo la cuenta en donde se realizará la derivación.
    cites:
    - source: retys
  - text: Escrituras del predio o certificado de inscripción ante el registro público de la propiedad y del comercio,
      expedido por el gobierno del estado, no mayor a seis meses de antigüedad.
    cites:
    - source: retys
  - text: En caso de solicitar el servicio una persona distinta al propietario, deberá exhibir adicionalmente carta
      poder para actos de dominio notariada.
    cites:
    - source: retys
  - text: 'Presentar una identificación oficial: ine, licencia de conducir, matricula consular, cédula profesional
      o pasaporte mexicano (vigentes).'
    cites:
    - source: retys
  - text: Cubrir el total del costo del servicio o pagar mínimo el 30% en servicio doméstico y 50% en servicio no
      doméstico, para acceder a convenir el resto.
    cites:
    - source: retys
  - text: Presentar copia de los requisitos y original para cotejar.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al área de atención a usuarios de la zona comercial correspondiente.
    - Presentar su solicitud de servicios con los documentos requeridos.
    - Recibir el presupuesto.
    - Cubrir el total o convenir el importe del servicio.
    - Realizar su contrato de servicio de agua potable.
    - Recibir su orden de instalación.
  notes: Acreditar la propiedad
- name: Posesionario
  requirements:
  - text: Presentar solicitud firmada por el propietario del terreno solicitando la contratación del nuevo medidor
      en derivación.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11840
  - text: Posesión expedida por el comisario ejidal o residencia expedida por el delegado municipal o concesión
      expedida ante conagua, la secretaria de reforma agraria o el registro agrario nacional.
    cites:
    - source: retys
  - text: Deberá estar libre de adeudo la cuenta en donde se realizará la derivación.
    cites:
    - source: retys
  - text: Croquis de localización
    cites:
    - source: retys
  - text: 'Presentar una identificación oficial: INE, licencia de conducir, matricula consular, cédula profesional
      o pasaporte mexicano (vigentes).'
    cites:
    - source: retys
  - text: Cubrir el total del costo del servicio o pagar mínimo el 30% en servicio doméstico y 50% en servicio no
      doméstico, para acceder a convenir el resto.
    cites:
    - source: retys
  modes:
