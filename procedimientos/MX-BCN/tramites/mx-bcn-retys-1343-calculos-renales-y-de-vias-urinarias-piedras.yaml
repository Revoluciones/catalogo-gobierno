id: mx-bcn-retys-1343-calculos-renales-y-de-vias-urinarias-piedras
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Cálculos renales y de vías urinarias (piedras)
summary: Es un procedimiento que se utiliza para extraer los cálculos o piedras de riñón cuando no se pueden eliminar
  por sí solos.
authority:
  name: Unidad de Especialidades Médicas de Baja California
official_ids:
  retys_id: 1343
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/1343
  homoclave: BC-UNEME-011
who_can:
- Interesado
when: Cuando tenga un estudio que evidencie la presencia de piedras en vías urinarias
result: La extracción de piedras en vías urinarias
cost:
  type: gratuito
  amount_mxn: null
  text: SIN COSTO
  as_of: '2026-11-06'
  cites:
  - source: retys
deadlines:
- what: respuesta_autoridad
  text: 'Tiempo que tiene el organismo para resolver: 5 Días Hábiles'
  cites:
  - source: retys
positive_silence: false
requires_inspection: false
channels:
- presencial
offices:
- municipality: Mexicali
  name: Dirección de Unidad Quirúrgica
  address: 'Avenida Olimpus #S/N, Plutarco Elías Calles, Mexicali, 21376'
- municipality: Ensenada
  name: Dirección de Unidad Quirúrgica
  address: 'Avenida Gastelum #1340, Zona Centro, Ensenada, 22800'
scenarios:
- name: Derechohabientes del IMSS-BIENESTAR
  requirements:
  - text: Hoja de derivación debidamente requisitada y sellada, que le proporciona el centro de salud y/u Hospital
      General.
    cites:
    - source: retys
  - text: Identificación oficial (credencial de elector, pasaporte, licencia de manejo).
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Historia clínica, exámenes de laboratorio, reporte de la valoración cardiopulmonar cuando proceda y demás
      estudios de gabinete que procedan de acuerdo a la intervención quirúrgica, que le proporcionan en el centro
      de salud.
    cites:
    - source: retys
  - text: Carta de consentimiento informado para cirugía y anestesia. Se le entrega en UNEME, previo a la cirugía
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a consulta médica en el establecimiento que le corresponda
    - Se miden signos vitales. Se realiza exploración física y entrevista médica. De ser necesario, se deriva con
      un especialista
    - Acudir a la consulta con el especialista
    - Se le miden signos vitales. El especialista realiza entrevista médica y exploración física. Si es necesario,
      se deriva a UNEME
    - Contactar al ciudadano, indicando fecha, hora y cuidados necesarios previos a la cirugía
    - Acudir a UNEME, con un acompañante, identificarse y entregar los requisitos
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la cirugía (incluyendo vendaje y suero), trasladar al quirófano y, después del procedimiento,
      dar instrucciones para el cuidado y alta.
  notes: Derechohabientes de los Servicios de Salud del Instituto Mexicano del Seguro Social para el Bienestar
- name: Derechohabientes IMSS, ISSSTE e ISSSTECALI
  requirements:
  - text: Hoja de derivación debidamente requisitada y sellada, que le proporciona el IMSS, ISSSTE o ISSSTECALI
      en su caso.
    cites:
    - source: retys
  - text: Nota médica de referencia de la unidad de origen que incluya resultados de laboratorio o los exámenes
      de laboratorio de respaldo.
    cites:
    - source: retys
  - text: Carta de consentimiento informado para cirugía y anestesia, que se le entrega en UNEME previo a la cirugía
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial (INE, pasaporte o licencia de manejo).
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a consulta médica en el establecimiento que le corresponda
    - Se miden signos vitales. Se realiza exploración física y entrevista médica. De ser necesario, se deriva con
      un especialista
    - Acudir a la consulta con el especialista
    - Se le miden signos vitales. El especialista realiza entrevista médica y exploración física. Si es necesario,
      se deriva a UNEME
    - Contactar al ciudadano, indicando fecha, hora y cuidados necesarios previos a la cirugía
    - Acudir a UNEME, con un acompañante, identificarse y entregar los requisitos
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la cirugía (incluyendo vendaje y suero), trasladar al quirófano y, después del procedimiento,
      dar instrucciones para el cuidado y alta.
  notes: Derechohabientes del Instituto Mexicano del Seguro Social, del Instituto de Seguridad y Servicios Sociales
    de los Trabajadores del Estado y del Instituto de Seguridad y Servicios Sociales de los Trabajadores del Gobierno
    y Municipios del Estado de Baja California
