id: mx-bcn-retys-788-revalidacion-de-concesion-de-transporte-publico-ma
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Revalidación de concesión de transporte público masivo, de personal o turístico
summary: Consiste en solicitar la revalidación de la concesión de transporte público masivo, de personal o turístico
  con la que se cuenta.
authority:
  name: Instituto de Movilidad Sustentable del Estado de Baja California
official_ids:
  retys_id: 788
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/788
  homoclave: BC-IMOS-038
who_can:
- Representante Legal
when: Cuando la persona interesada se encuentre en el término legal para solicitar la revalidación.
result: Revalidación de concesión de transporte.
cost:
  type: fijo
  amount_mxn: null
  text: 'COSTO: Por 1 a 15 años por unidad autorizada: 110 UMAS Por 15 a 30 años por unidad autorizada: 220 UMAS'
  as_of: '2026-11-06'
  cites:
  - source: retys
deadlines:
- what: respuesta_autoridad
  text: 'Tiempo que tiene el organismo para resolver: 10 Meses'
  cites:
  - source: retys
positive_silence: false
requires_inspection: false
channels:
- presencial
offices:
- municipality: Mexicali
  name: Delegación Mexicali
  address: 'José María Morelos #411, Primera, Mexicali, 21100'
- municipality: Tijuana
  name: Zona Metropolitana (Tijuana, Tecate Y Playas De Rosarito)
  address: 'Carretera Libre Tijuana Tecate Kilometro 26.5 Esquina Boulevard Nogales #S/N, El Florido , Tijuana,
    22253'
- municipality: Ensenada
  name: Delegación Ensenada
  address: 'Huerta #136, Rincón del Mar, Ensenada, 22896'
- municipality: San Quintín
  name: Subdelegación San Quintín
  address: 'Carretera Transpeninsular #Km 1, Santa Fe De Braulio Maldonado, San Quintín, 22925'
- municipality: San Felipe
  name: Subdelegación San Felipe
  address: 'Av. Mar Caribe Norte Y Santa Rosalía #S/N, Segunda Sección, San Felipe, 21850'
scenarios:
- name: Empresas con concesión en la modalidad de "personal"
  requirements:
  - text: Solicitud de revalidación de concesión, dónde se describan los motivos que generan la necesidad de revalidar
      la concesión en cuestión
    cites:
    - source: retys
  - text: Presentar los estudios técnicos relativos ante el instituto. estos deberán ser realizados por profesionales
      en la materia, previamente autorizados por el Instituto, o bien, podrán ser solicitados al Instituto
    cites:
    - source: retys
  - text: Acta constitutiva de la persona moral titular de la concesión y la inscripción en el registro público
      de la propiedad y comercio
    cites:
    - source: retys
  - text: Poder de representante legal
    cites:
    - source: retys
  - text: Identificación oficial del representante legal
    cites:
    - source: retys
  - text: Cédula de identificación fiscal (RFC)
    cites:
    - source: retys
  - text: Opinión de cumplimiento de obligaciones fiscales en sentido positivo
    cites:
    - source: retys
  - text: Itinerarios (Formato EXCEL)
    cites:
    - source: retys
  - text: Recorridos (Formato "KMZ")
    cites:
    - source: retys
  - text: Inventario de parque vehicular (Formato EXCEL)
    cites:
    - source: retys
  - text: Padrón de operadores (Formato EXCEL)
    cites:
    - source: retys
  - text: Croquis y domicilio de parques de encierro
    cites:
    - source: retys
  - text: Póliza, constancia o carta cobertura de responsabilidad civil global (Formato EXCEL y PDF)
    cites:
    - source: retys
  - text: Contratos o convenios celebrados con terceros, relacionados con la prestación del servicio público de
      transporte
    cites:
    - source: retys
  - text: Señalar correo electrónico, domicilio para oír y recibir notificaciones y número telefónicos de contacto
    cites:
    - source: retys
  - text: Presentar toda la información y documentos señalados en formato digital. deberán ser enviados a los correos
      electrónicos que para tal efecto señale el Instituto
    cites:
    - source: retys
  - text: Pago de Derechos
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas del Instituto de Movilidad Sustentable y presentar la documentación requerida
  notes: Requisitos para revalidación de concesión en la modalidad de "personal"
- name: Empresas con concesión en la modalidad de "masivo"
  requirements:
  - text: Escrito libre donde se solicite la revalidación de la concesión, dónde se describan los motivos que generan
      la necesidad de revalidar la concesión en cuestión.
    cites:
    - source: retys
  - text: Acta constitutiva de la persona moral titular de la concesión y constancia de inscripción en el Registro
      Público de la Propiedad y Comercio
    cites:
    - source: retys
  - text: Poder de representante legal
    cites:
    - source: retys
  - text: Identificación oficial de representante legal
    cites:
    - source: retys
  - text: Cédula de identificación fiscal (RFC)
    cites:
    - source: retys
  - text: Opinión de cumplimiento de obligaciones fiscales en sentido positivo
    cites:
    - source: retys
  - text: Rutas e itinerarios (Formatos "KMZ")
    cites:
    - source: retys
  - text: Información del parque vehicular
    cites:
    - source: retys
  - text: Croquis y ubicación de parques de encierro
    cites:
    - source: retys
  - text: Pólizas de responsabilidad civil vigentes
    cites:
    - source: retys
  - text: Inventario de las instalaciones de terminales
    cites:
    - source: retys
  - text: Certificado de libertad de gravámenes (no adeudos por concepto de transporte público)
    cites:
    - source: retys
  - text: Señalar correo electrónico, domicilio para oír y recibir notificaciones y números telefónicos de contacto
    cites:
    - source: retys
  - text: Proporcionar toda la información y documentos referidos en formato digital. La misma deberá ser enviada
      a los correos electrónicos que para tal efecto señale el Instituto
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas del Instituto de Movilidad Sustentable y presentar la documentación requerida
  notes: Requisitos para la revalidación de concesión en la modalidad de "masivo"
