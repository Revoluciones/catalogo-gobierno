scenarios:
- name: Expedir registros ganaderos
  requirements:
  - text: Patente original
    cites:
    - source: retys
  - text: Revalidar registro ganadero acreditar legal propiedad o usufructo en favor del solicitante del uso del
      terreno donde se desarrolla la actividad ganadera
    cites:
    - source: retys
  - text: Acta constitutiva y nombramiento del representante legal (vigente)
    cites:
    - source: retys
  - text: Acreditar nacionalidad mexicana (identificación oficial con fotografía, ife, ine, pasaporte mexicano)
    cites:
    - source: retys
  - text: Acto de verificación
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Comprobar legal propiedad del ganado (remisión y/o factura)
    cites:
    - source: retys
  - text: R.F.C.
    cites:
    - source: retys
  - text: Formato de solicitud de trámite ganadero de marca de herrar y señal de sangre
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/1985
  modes:
  - name: Presencial
    steps:
    - La Unión Ganadera Regional envía oficio petitorio, dirigido al titular de la Dirección de Ganadería de la
      SADER
    - Se revisa que la documentación esté completa y consulta el sistema de trámites y servicios ganaderos con la
      finalidad de comprobar que no exista registro previo del mismo solicitante para su captura
    - Se diseña la marca de herrar y señal de sangre
    - Genera el certificado de registro y la patente para firma del titular de la Dirección de Ganadería
    - Se elabora oficio de acreditación para entrega al solicitante
  notes: Expedir registros ganaderos, marca de herrar, señal de sangre y patente ganadera
- name: Revalidar registros ganaderos, marca de herrar, señal de sangre y patente ganadera
  requirements:
  - text: Patente original
    cites:
    - source: retys
  - text: Solicitud de registro debidamente requisitada (datos del solicitante y su predio)
    cites:
    - source: retys
  - text: Credencial ganadera (vigente y patente ganadera actualizado)
    cites:
    - source: retys
  - text: Formato de solicitud de trámite ganadero de marca de herrar y señal de sangre
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/1986
  modes:
  - name: Presencial
    steps:
    - La unión ganadera regional envía oficio petitorio, dirigido al titular de ganadería de la sader
    - Se revisa que la documentación esté completa y consulta el sistema de trámites y servicios ganaderos con la
      finalidad de comprobar que no exista registro previo del mismo solicitante para su captura
    - Se diseña la marca de herrar y señal de sangre
    - Genera el certificado de registro y la patente para firma del director
    - Se elabora oficio de acreditación para entrega al solicitante
  notes: Revalidar registros ganaderos, marca de herrar, señal de sangre y patente ganadera
