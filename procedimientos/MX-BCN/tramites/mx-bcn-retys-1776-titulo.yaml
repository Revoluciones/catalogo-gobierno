title: Titulo
summary: Trámite dirigido a estudiantes egresados de nivel licenciatura y posgrado de la Universidad Intercultural
  de Baja California, que hayan cumplido con los requisitos académicos, administrativos y normativos para la obtención
  de su título profesional. El proceso incluye la validación documental, emisión de actas de examen, generación
  del título electrónico y su entrega conforme a los lineamientos establecidos por la Dirección General de Profesiones.
