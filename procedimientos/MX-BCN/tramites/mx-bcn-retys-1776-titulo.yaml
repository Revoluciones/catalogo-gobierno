scenarios:
- name: Revisión y aprobación de titulo
  requirements:
  - text: Tener su certificado profesional.
    cites:
    - source: retys
  - text: Haber concluido su servicio social (Licenciatura).
    cites:
    - source: retys
  - text: No tener adeudos con la institución.
    cites:
    - source: retys
  - text: Entregar la documentación solicitada a Control Escolar y Servicio Estudiantil.
    cites:
    - source: retys
  - text: Acta de examen profesional o grado
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Recibir oficio del Departamento de Control Escolar y Servicio Estudiantil con la relación de títulos electrónicos
      a revisar
    - Verificar que se incluya la documentación correspondiente (CURP, certificados, actas, archivos XML, títulos
      en PDF y .zip)
    - Revisar que los datos contenidos en los archivos XML coincidan con los expedientes físicos y digitales de
      los estudiantes
    - Validar técnicamente cada XML. Si procede, autorizar su incorporación al sistema y archivar electrónicamente
      la documentación
    - Informar por correo electrónico al Departamento de Control Escolar y Servicio Estudiantil sobre la aprobación
      de los títulos electrónicos
  notes: Revisión técnica y validación de los archivos digitales del título profesional por parte del Analista de
    Control Escolar, verificando que la información contenida en los XML coincida con los expedientes completos
    del estudiante. Una vez validado, se autoriza su incorporación en el Sistema de Certificados Electrónicos y
    se remite oficialmente al Departamento de Control Escolar y Servicio Estudiantil.
