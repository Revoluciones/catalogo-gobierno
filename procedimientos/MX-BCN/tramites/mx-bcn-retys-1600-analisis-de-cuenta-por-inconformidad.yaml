scenarios:
- name: Propietario
  requirements:
  - text: Formulario para Trámites en Archivo, (lo proporciona CESPT o lo puede obtener en la página de Internet
      FRM-005), debidamente llenado y firmado por el titular de la cuenta.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11376
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio, puede ser UNO de los siguientes:
      Credencial del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en ORIGINAL Y COPIA, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público (CAP) de Oficinas Centrales o al CAP Rosarito Floresta del Mar.
    - Pasar al área de Archivo y explicar a la persona encargada que solicita un análisis de cuenta y entregar los
      requisitos.
    - La persona de Archivo revisará que los requisitos estén completos, de no ser así, le informará que no es posible
      realizar el trámite hasta que éstos se completen, indicándole lo que falta.
    - Con los requisitos completos, la persona de Archivo certifica la copia de la solicitud proporcionando el plazo
      de atención para su respuesta.
    - En caso de ser necesario se realiza una inspección en el domicilio del que se solicitó el trámite.
    - En caso de que se detecte algún error o inconsistencia en los registros, se realiza ajuste correspondiente
      en los consumos y elabora ficha de pago u oficio de respuesta al usuario.
    - En caso de que se determine que no error o inconsistencia alguna, la Coordinación de Análisis y Ajustes de
      Facturación, realiza oficio de contestación al usuario explicándole los motivos.
    - Cuando se cumpla el tiempo de atención, regresar por su respuesta.
  notes: Propietario
- name: Representante legal
  requirements:
  - text: Formulario para Trámites en Archivo, (lo proporciona CESPT o lo puede obtener en la página de Internet
      FRM-005), debidamente llenado y firmado por el titular de la cuenta.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12517
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el propietario del predio,
      puede ser UNO de los siguientes: Poder Notarial; Carta poder ante notario público, corredor público o fedatario
      público; Carta Poder simple firmada por el propietario del predio y por dos testigos, que incluya copia de
      las identificaciones oficiales de los testigos, cuya antigüedad no exceda los seis meses.'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial del INE,
      Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en ORIGINAL Y COPIA, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
