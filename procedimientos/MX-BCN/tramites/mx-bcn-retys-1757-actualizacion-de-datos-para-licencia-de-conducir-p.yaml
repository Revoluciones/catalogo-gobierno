scenarios:
- name: Presencial
  requirements:
  - text: Cita
    cites:
    - source: retys
  - text: Presentar en original y copia de indentificación oficial con fotografía vigente (INE, pasaporte mexicano
      vigente, cédula profesional, matrícula consular, cartilla militar)
    cites:
    - source: retys
  - text: Presentar en original y copia comprobante de domicilio no mayor a tres meses de antigüedad (solo en caso
      de hacer actualización de domicilio)
    cites:
    - source: retys
  - text: Presentar Licencia Permanente
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Haz tu cita en https://citas.ebajacalifornia.gob.mx/, seleciona tu municipio de residencia y llena la información
      requerida.
    - Acudir a las oficinas de Recaudación de Rentas del Estado
    - Toma de datos (huellas digitales y fotografía)
    - 'Realizar el pago correspondiente. (Opciones de pago: efectivo, cheque certificado, tarjeta debito/crédito
      (excepto tarjetas American Express )'
    - Recoger licencia de conducir
  notes: Requisitos para actualizar licencia de conducir
