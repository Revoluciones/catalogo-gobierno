scenarios:
- name: Persona física con Actividad Empresarial/Persona Moral
  requirements:
  - text: Escrito libre, en el que manifieste contar con un proyecto de inversión real y concreto a desarrollar
      en el Estado.
    cites:
    - source: retys
  - text: Cédula de Solicitud de Estímulos Fiscales.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/13815
  - text: Plan de Negocios o Proyecto de Inversión.
    cites:
    - source: retys
  - text: Solicitud de Estímulo Fiscal.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/15133
  - text: Anexo I. Formato de Compromisos.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/13829
  - text: En su caso, copia simple del Acta constitutiva, y Poder vigente del representante legal.
    cites:
    - source: retys
  - text: Identificación oficial del solicitante o representante legal.
    cites:
    - source: retys
  - text: Constancia de Situación Fiscal vigente.
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - El interesado descarga la Solicitud de Estímulos Fiscal, la Cédula de Solicitud de Estímulos Fiscales y el
      Anexo I “Compromisos.
    - El interesado recaba la información y documentación.
    - 'El interesado remite la información (a través de ventanilla única o correo electrónico: igdiaz@baja.gob.mx).'
    - La SEI tiene 5 días hábiles para realizar alguna observación o emitir la validación y la opinión técnica.
    - La SEI remite opinión técnica a la Procuraduría Fiscal.
    - La Procuraduría Fiscal revisa y analiza el expediente y tiene 20 días hábiles para emitir resolución.
  notes: Documentación necesaria para iniciar el trámite.
