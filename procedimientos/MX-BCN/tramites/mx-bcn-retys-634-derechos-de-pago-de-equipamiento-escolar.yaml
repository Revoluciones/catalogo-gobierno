  retys_id: 634
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/634
  homoclave: BC-SIDURT-007
who_can:
- Representante Legal
- Interesado
when: Cuando el trámite es requerido por el usuario
result: Constancia de pago.
cost:
  type: variable
  amount_mxn: null
  text: 'COSTO VARIABLE: Capítulo VIII Artículo 19. III.- Por Equipamiento Escolar. La cuota correspondiente se
    causa por cada lote resultante del fraccionamiento, división de copropiedad, relotificación O subdivisión de
    predios dedicados a uso habitacional, así como por cada departamento, casa o vivienda resultante de la constitución
    del régimen de propiedad en condominio de inmuebles habitacionales, de acuerdo con la clasificación establecida
    en esta ley y en el reglamento de fraccionamientos .....'
  as_of: '2026-11-06'
  cites:
  - source: retys
