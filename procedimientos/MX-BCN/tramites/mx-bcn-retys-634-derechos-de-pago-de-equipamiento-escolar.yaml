scenarios:
- name: Ciudadano
  requirements:
  - text: Comprobante de pago
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El solicitante se presenta en el ayuntamiento para pedir la solicitud de pago de equipamiento escolar
    - El ayuntamiento elaborará y enviará con el particular la solicitud de pago de equipamiento escolar dirigida
      a la SIDURT y/o director de desarrollo urbano, vivienda y espacios públicos
    - El solicitante acude a la SIDURT con la solicitud
    - La dirección emitirá un oficio de notificación de pago, dirigido al solicitante informando la cantidad a pagar
    - El solicitante deberá pasar a cubrir el pago de recaudación de rentas del estado
    - El solictante entregará una copia del recibo pagado expedido por recaudación de rentas del estado a la dirección
      de desarrollo urbano, vivienda y espacios públicos
  notes: Cualquier persona que requiera o necesite el servicio o trámite
