id: mx-bcn-retys-634-derechos-de-pago-de-equipamiento-escolar
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Derechos de Pago de Equipamiento Escolar
summary: Cuando se requiere subdividir un predio en uno o más partes, es necesario que el usuario realice un pago
  por derechos de equipamiento escolar que depende de la ubicación del predio y la cantidad de lotes que resulten
  de la división a realizar.
authority:
  name: Secretaría de Infraestructura, Desarrollo Urbano y Reordenación Territorial de Baja California
