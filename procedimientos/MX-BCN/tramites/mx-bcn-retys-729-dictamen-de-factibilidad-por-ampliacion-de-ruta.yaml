  requirements:
  - text: Escrito libre que contenga la solicitud de ampliación de ruta, debiendo contener nombre completo de la
      moral, direccion de correo electronico y número de teléfono del solicitante y el medio por el cual estara
      disponible para recibir notificaciones
    cites:
    - source: retys
  - text: Copia del Título de concesión y adendas en caso de haberlas.
    cites:
    - source: retys
  - text: Acta constitutiva de la persona moral
    cites:
    - source: retys
  - text: Instrumento notarial de donde se desprendan las facultades de su representante legal.
    cites:
    - source: retys
  - text: Copia de identificación oficial vigente del representante legal (INE y/o pasaporte)
    cites:
    - source: retys
  - text: Constancia de situación fiscal del SAT, con vigencia del año fiscal en curso
    cites:
    - source: retys
  - text: Opinión de cumplimiento de obligaciones fiscales, en sentido positivo, del año fiscal en curso
    cites:
    - source: retys
  - text: Presentar escrito libre que contenga la descripción del recorrido de modificación y/o ampliación de ruta
      (en sentido ida y regreso)
    cites:
    - source: retys
  - text: Presentar escrito libre qUe contenga la relación y cantidad de unidades consideradas
    cites:
    - source: retys
  - text: Presentar en archivo digital trazo de recorrido en formato KMZ
    cites:
    - source: retys
  - text: Original y copia del comprobante de pago de derechos por el trámite solicitado
    cites:
    - source: retys
