title: Análisis de Factibilidad y Congruencia en Base Ley de Ingresos
summary: Se realiza cuando el usuario solicita al municipio una autorización o permiso para llevar a cabo acciones
  de urbanización que no estén definidas en los planes y programas de desarrollo urbano y/o dichas acciones se ubican
  fuera de los límites de los centros de población, casos señalados en los artículos 150 y 200 de la Ley de Desarrollo
  Urbano del Estado y artículos 60 y 61 de la Ley de Edificaciones del Estado.
