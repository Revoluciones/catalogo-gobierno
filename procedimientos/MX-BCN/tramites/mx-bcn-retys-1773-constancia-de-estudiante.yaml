when: En cualquier momento del ciclo escolar, siempre que el estudiante se encuentre inscrito y activo en el sistema
  escolar de la UIBC.
result: Constancia oficial que acredita la calidad de estudiante activo en un programa educativo de la Universidad
  Intercultural de Baja California.
