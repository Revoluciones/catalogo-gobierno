kind: tramite
title: Constancia de estudiante
summary: Emitir un documento oficial que acredite que la persona solicitante se encuentra inscrita como estudiante
  activo en alguno de los programas educativos de la Universidad Intercultural de Baja California. Esta constancia
  puede ser solicitada para diversos fines, tales como trámites institucionales, apoyos económicos, transporte,
  residencias escolares, prácticas profesionales, entre otros.
