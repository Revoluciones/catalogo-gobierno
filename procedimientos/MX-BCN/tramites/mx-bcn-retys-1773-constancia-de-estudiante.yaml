scenarios:
- name: Tramite de Constancia
  requirements:
  - text: Estar inscrito en el periodo escolar vigente.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El estudiante realiza la solicitud de constancia en ventanilla del Departamento de Control Escolar.
    - El Departamento de Control Escolar verifica que el solicitante esté inscrito en el periodo escolar vigente.
    - En caso de estar debidamente inscrito, se genera la constancia oficial con los datos académicos correspondientes.
    - La constancia se entrega de manera física al estudiante.
  notes: Proceso mediante el cual el estudiante solicita formalmente la emisión de una constancia que acredite su
    situación escolar actual, ya sea como alumno regular, inscripción vigente, carga académica o cualquier otro
    aspecto relacionado con su trayectoria educativa.
