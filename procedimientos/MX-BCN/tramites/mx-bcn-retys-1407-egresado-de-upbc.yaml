scenarios:
- name: Obtención de constancia de terminación de estudios
  requirements:
  - text: El egresado deberá haber concluido toda la carrera satisfactoriamente, para solicitar su constancia de
      estudios
    cites:
    - source: retys
  - text: Obtener el recibo de pago y realizar el pago en línea o en ventanilla bancaria
    cites:
    - source: retys
  - text: una vez realizado el pago debera presentarse al depto. de gestion escolar para solicitar previamente.
    cites:
    - source: retys
  - text: se presenta al depto. de gestion escolar para solicitar su constancia de terminacion de estudios, mostrando
      credencial oficial de identificación.
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Estudiante egresado con numero de matricula
    - Ingresar a la página web de la UPBC haciendo clic en el botón "iniciar trámite" ubicado en la parte inferior
      derecha
    - Obtener recibo de pago de la constancia en línea, efectuar el pago en línea o imprimir para pago en ventanilla
      bancaria
    - Subir al sistema Siaax, el recibo de pago en formato pdf, para su validación, aprobación y obtención del documento
    - Descargar el archivo de la constancia de estudios, y una vez hecho tendrá un plazo de 24 horas para imprimir
      o archivar el documento
  notes: Facilitar a los estudiantes egresados de la UPBC, para que puedan obtener su constancia de terminación
    de estudios
