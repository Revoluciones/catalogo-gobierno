scenarios:
- name: Indemnización global
  requirements:
  - text: Solicitud llena, proporcionada por el instituto.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/10976
  - text: Identificación oficial del trabajador(a) (original y copia).
    cites:
    - source: retys
  - text: Hoja de servicio o constancia de baja expedida por el organismo patrón (deberá contar con sello del organismo
      patrón, firma, fecha y motivo de baja).
    cites:
    - source: retys
  - text: CURP del trabajador(a).
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Llenar el formato de solicitud.
    - Solicitar en ventanilla el servicio.
    - El servidor público revisa los documentos recibidos y entrega al ciudadano una copia sellada del trámite
    - El Servidor Publico captura el trámite en el sistema, realiza el seguimiento a la solicitud y notifica al
      beneficiario la fecha de pago. Pago sujeto a flujo y disponibilidad de presupuesto
    - Acudir a cobrar el pago.
  notes: Asegurado que haya cotizado al fondo de pensiones de issstecali y actualmente este dado de baja
