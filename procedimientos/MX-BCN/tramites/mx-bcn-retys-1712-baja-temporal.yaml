scenarios:
- name: Baja temporal
  requirements:
  - text: pagina de SIAA formato de baja temporal
    cites:
    - source: retys
  - text: sello del departamento de finanzas y direccion de programa academico que corresponde
    cites:
    - source: retys
  - text: depto. de gestion escolar, archiva en expediente de estudiante la baja temporal para cuando la/el estudiante
      desee ingresar nuevamente
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - estudiante ingresa al sistema SIAA para solicitar baja, del cual se genera una hoja de no adeudo
    - estudiante imprime documento de baja para recabar sellos de no adeudos, por parte del depto. de finanzas y
      direccion de programa academico correspondiente
    - depto de finanzas recibe solicitud de baja y revisa en el sistema que no cuente con algún adeudo, si no cuenta
      procede a sellar documento.
    - depto. de finanzas, si estudiante cuenta con adeudo se le notifica para que proceda a pagarlo y proceder a
      sellar
    - estudiante, se presenta en la direccion de programa academico para lo sello correspondiente de talleres y
      laboratorio
    - estudiante procede a presentar hoja al depto. de gestión escolar para su baja y entrega de documento.
  notes: 'Alumno solicita baja temporal, y debera presentar ante el depto de control escolar su formqato de no adeudo
    con los sellos correspondientes, recursos financieros, laboratorios y talleres, cadi. se dara la baja temporal
    bajo los siguientes casos: Si no se concluye el trámite de reinscripción dentro del periodo establecido en el
    calendario escolar, 2) Cuando no se entregue en el plazo concedido para ello, los documentos que se requieren
    presentar en el trámite de inscripción de la carrera; 3) Por decisión propia, 4) previstas en el presente reglamento
    de alumnos'
