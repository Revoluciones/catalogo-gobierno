scenarios:
- name: Personas físicas
  requirements:
  - text: Llenar el Formulario con los datos que se le solicite (partida vieja o nueva, municipio, número de partida,
      nombre a las cuales se expide el recibo de pago para la presentación del servicio
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/1960
  - text: Cubrir los derechos correspondientes
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Ingresar a la página https://rppcweb.ebajacalifornia.gob.mx/PORTALBC/PRODUCCION/PORTALAPP/INDEX.HTML o dar
      clic en "iniciar tramite" en la parte inferior derecha
    - Seleccionar emisión de copias simples
    - Pago de derechos cubiertos
    - Recibe el usuario por correo electrónico las copias
  - name: Presencial
    steps:
    - Acudir a la oficina registral
    - Llenar el formato FMO-8.5.1-01 de información registral
    - Tomar turno para entregar a la ventanilla asignada el pago y el formato de información
    - Pago de derechos cubiertos
    - El usuario recibe su trámite de acuerdo a la fecha que se asigne a su volante
  notes: Para el servicio de emisión de copias simples
