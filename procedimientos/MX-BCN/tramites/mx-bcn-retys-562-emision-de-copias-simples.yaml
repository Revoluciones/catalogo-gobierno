summary: Servicio de emisión de copias simples de instrumentos públicos, contratos privados y todo aquel documento
  que obra en los archivos registrales de la dependencia, desde la comodidad de su hogar u oficina mediante el servicio
  de emisión de copias simples a través del portal de servicios sin la necesidad de trasladarse a la oficina registral.
