title: Quejas a Petición de Parte por Presunta Violación a Normas Laborales
summary: Atender las solicitudes de trabajadores, cuando en un caso concreto se considera que existen violaciones
  a la Ley Federal del Trabajo, tales como, no contar con imss, infonavit, fonacot, que no se le pague ptu(pago
  de utilidades), horas extras, aguinaldo,asi como que no se le otorguen las vacaciones, dias de descanso obligatorios,
  ni contar con contratos de trabajo.
