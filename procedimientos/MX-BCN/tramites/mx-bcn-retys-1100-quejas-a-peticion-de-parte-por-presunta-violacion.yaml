  - text: Presentar dirección de la empresa
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - Llama para solicitar orientación a los números disponibles en las oficinas.
    - Se registra la queja y se pide información sobre la empresa, como su dirección, razón social y el puesto,
      además de los datos personales del quejoso.
    - Se genera la inspección para investigar el problema reportado.
    - Se coordina el envío de inspectores para que revisen la situación.
  notes: Cualquier ciudadano que sean vulnerados sus derechos laborales
