scenarios:
- name: Ciudadanos en general
  requirements:
  - text: Cita
    cites:
    - source: retys
  - text: Presentar en original y copia de identificación oficial vigente ( INE, pasaporte mexicano, cartilla del
      servicio militar nacional ó matrícula consular)
    cites:
    - source: retys
  - text: Tratándose de robo o extravío, presentar el reporte respectivo ante el ministerio público que corresponda.
      La Secretaría podrá determinar los supuestos de extravío en los cuales no se requerirá el citado reporte,
      señalando el documento que lo suplirá (original y copia)
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/10945
  modes:
  - name: Presencial
    steps:
    - Haz tu cita en https://citas.ebajacalifornia.gob.mx/
    - Acudir a la Recaudación de Rentas del Estado
    - Solicitar el trámite correspondiente
    - Presentar documentos
    - Revisión de documentos y toma de las 10 huellas digitales y fotografía
    - 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito (excepto
      tarjetas American Express )'
    - Pasar a ventanilla para la entrega de su licencia de conducir
  notes: Requisitos para obtener la reposición de licencia de conducir
