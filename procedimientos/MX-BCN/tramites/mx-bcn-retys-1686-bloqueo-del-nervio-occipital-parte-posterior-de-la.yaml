inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Bloqueo del nervio occipital (parte posterior de la cabeza/región cervical)
summary: Es un procedimiento en el cual, la o el médico especialista realiza una punción para aplicación de analgésico,
  mediante la cual bloquea el nervio afectado
authority:
  name: Unidad de Especialidades Médicas de Baja California
official_ids:
  retys_id: 1686
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/1686
  homoclave: BC-UNEME-018
who_can:
- Interesado
when: Cuando presente dolor crónico o de larga duración.
result: Atención médica especializada en analgesia.
cost:
  type: gratuito
  amount_mxn: null
  text: SIN COSTO
  as_of: '2026-11-06'
  cites:
  - source: retys
deadlines:
- what: respuesta_autoridad
  text: 'Tiempo que tiene el organismo para resolver: 5 Días Hábiles'
  cites:
  - source: retys
positive_silence: false
requires_inspection: false
channels:
- presencial
offices:
- municipality: Ensenada
  name: Dirección de Unidad Quirúrgica
  address: 'Avenida Gastelum #1340, Zona Centro, Ensenada, 22800'
scenarios:
- name: Derechohabientes del IMSS-BIENESTAR
  requirements:
  - text: Hoja de derivación debidamente llenada y sellada, que le proporciona el centro de salud y/u Hospital General.
    cites:
    - source: retys
  - text: Historia clínica y diagnóstico de dolor crónico expedidos por el centro de salud y/u Hospital General.
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial (INE, pasaporte o licencia de manejo).
    cites:
    - source: retys
  - text: Carta de consentimiento informado que se le entrega en UNEME, previo a la intervención.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a consulta médica en el establecimiento que le corresponda
    - Se le miden signos vitales, se realiza entrevista médica y exploración física. Se deriva a la UNEME si es
      necesario.
    - Contactar al ciudadano, indicando fecha y hora para una consulta de valoración por un especialista
    - Acudir a la cita con el especialista en UNEME. Identificarse y entregar los requisitos.
    - Se le miden signos vitales. Se realiza una entrevista médica y exploración física. Se programa para la intervención
      si es necesario
    - Contactar al ciudadano para indicar fecha y hora de la intervención, además de los cuidados previos.
    - Acudir a UNEME con un acompañante, identificarse y firmar la carta de consentimiento informado.
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la intervención, trasladar al quirófano y, después del procedimiento, dar instrucciones
      para el cuidado y alta.
  notes: Derechohabientes de los Servicios de Salud del Instituto Mexicano del Seguro Social para el Bienestar
- name: Derechohabientes IMSS, ISSSTE e ISSSTECALI
  requirements:
  - text: Hoja de derivación debidamente llenada y sellada, que le proporciona el IMSS, ISSSTE o ISSSTECALI, según
      corresponda.
    cites:
    - source: retys
  - text: Historia clínica y diagnóstico de dolor crónico expedidos por IMSS, ISSSTE o ISSSTECALI, en su caso.
    cites:
    - source: retys
  - text: Carta de consentimiento informado para el procedimiento de bloqueo del dolor, que se le entrega en UNEME
      antes de la intervención.
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial (INE, pasaporte, licencia de conducir).
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a consulta médica en el establecimiento IMSS, ISSSTE o ISSSTECALI que le corresponda
    - Se le miden signos vitales, se realiza entrevista médica y exploración física. Se deriva a la UNEME si es
      necesario.
    - El personal de UNEME le contacta por vía telefónica, indicando fecha y hora para una consulta de valoración
      por un especialista
    - Acudir a la cita con el especialista en UNEME. Identificarse en el área de recepción y entregar los requisitos.
    - Se le miden signos vitales. Se realiza una entrevista médica y exploración física. Se programa para la intervención
      si es necesario
    - El personal de UNEME le indica fecha y hora de la intervención, además de los cuidados previos.
    - Acudir a UNEME en la fecha y hora programados, con 1 persona acompañante, identificarse en el área de recepción
      y firmar la carta de consentimiento informado.
    - Pasar al área que le indique el personal de UNEME para el cambio de ropa por una bata hospitalaria
    - Preparar al paciente para la intervención, trasladar al quirófano y, después del procedimiento, dar instrucciones
      para el cuidado y alta.
  notes: Derechohabientes del Instituto Mexicano del Seguro Social, del Instituto de Seguridad y Servicios Sociales
    de los Trabajadores del Estado y del Instituto de Seguridad y Servicios Sociales de los Trabajadores del Gobierno
    y Municipios del Estado de Baja California
