title: COFEPRIS-05-036 Aviso de Funcionamiento y de Responsable Sanitario del Establecimiento de Servicios de salud
summary: 'Cuando el ciudadano requiera obtener el aviso de funcionamiento, siempre y cuando tu empresa con establecimiento
  de atención médica no practiqué actos quirúrgicos u obstétricos, como son: consultorios médicos, consultorios
  y clínicas dentales, laboratorios de análisis clínicos sin rayos x, ambulancias y servicios de asistencia social.'
