scenarios:
- name: Seguridad pública y privada
  requirements:
  - text: Presentarse en la Dirección de Registros de Seguridad Pública con identificación oficial con fotografía
      vigente
    cites:
    - source: retys
  - text: Presentarse con oficio de autorización personalizado perteneciente a la empresa o corporación (Privada
      y Pública) el oficio debe estar vigente.
    cites:
    - source: retys
  - text: Comprobante original de domicilio (No mayor a 2 meses)
    cites:
    - source: retys
  - text: Señalar la fecha de ingreso a la empresa o corporación, con copia de autorización no mayor a 3 meses
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: 3 Referencias (de un familiar, un pariente y personal) debiendo contener nombre completo, teléfono y domicilio
      con código postal. (DESCARGA EL FORMATO DE REFERENCIAS PERSONALES)
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/13674
  - text: Señalar 3 dependientes económicos (en caso de tener) debiendo indicar nombre completo, fecha de nacimiento
      y parentesco
    cites:
    - source: retys
  - text: 'Mujeres: Deberán presentarse sin maquillaje, cabello recogido, no pestañas postizas y vestimenta formal
      (no tirantes o strapless). En caso de ser servidor público deberá portar su vestimenta formal o el uniforme
      de su corporación.'
    cites:
    - source: retys
  - text: 'Hombres: Deberán presentarse sin barba y con bigote recortado (en caso de usar deberán traer el cuello
      y las comisuras de la boca completamente visibles). En caso de ser servidor público deberá portar su vestimenta
      formal o el uniforme de su corporación.'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Descargar el formato de referencias personales y llenarlo
    - Acudir a las oficinas de la Dirección de Registros de Seguridad Pública.
    - Presentar el formato de referencias personales llenado y los documentos que sean requeridos
    - Seguir las instrucciones que le sean indicadas por parte del personal para la continuación del trámite
    - Si el interesado cumplió con todos los requisitos se le entregará fisicamente una constancia la cual deberá
      entregar en su corporación o dependencia.
  notes: Requisitos para el debido registro del personal activo y autorizado ante la Dirección de Registros de Seguridad
    Pública
