scenarios:
- name: Fase I - Solicitud de elaboración de Presupuesto
  requirements:
  - text: Inspección de Factibilidad positiva, emitida por CESPT, se puede tramitar llamando al 073
    cites:
    - source: retys
  - text: 'Documento para comprobar la propiedad, posesión o titularidad del predio en el que se instalarán los
      servicios, puede ser uno de los siguientes: Carta de inscripción del Registro Público de la Propiedad y de
      Comercio (Escrituras) con fecha de registro no mayor a un año de antigüedad; Constancia de posesión expedida
      por el Comisariado Ejidal; Carta de residencia vigente expedida por el Ayuntamiento, si se trata de posesionarios;
      Juicio de prescripción positiva inscrito en el Registro Público de la Propiedad y de Comercio con fecha de
      registro no mayor a un año de antigüedad; Recibo del impuesto predial vigente (con fecha de emisión no mayor
      a un año de antigüedad).'
    cites:
    - source: retys
  - text: Nomenclatura oficial del domicilio expedida por el Ayuntamiento correspondiente.
    cites:
    - source: retys
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el propietario del predio,
      puede ser UNO de los siguientes: Poder Notarial; Carta poder ante notario público, corredor público o fedatario
      público; Carta Poder simple firmada por el propietario del predio y por dos testigos, que incluya copia de
      las identificaciones oficiales de los testigos, cuya antigüedad no exceda los seis meses.'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial del INE,
      Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Permiso de Ruptura de Pavimento vigente expedido por el Ayuntamiento correspondiente, de acuerdo a los
      metros que se le indiquen en documento de Inspección de Factibilidad de Servicios. (Este será necesario solo
      en caso de que el usuario esté de acuerdo en que se realice la obra especial)
    cites:
    - source: retys
  - text: Hacer el pago correspondiente
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en original y copia, la cual debe ser LEGIBLE Y CONTENER EL DOCUMENTO
      COMPLETO
    cites:
    - source: retys
  - text: Este servicio siempre se paga de contado.
    cites:
    - source: retys
  - text: Al momento de realizar la contratación deberán estar PAGADOS O CONVENIDOS LOS DERECHOS DE CONEXIÓN.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público correspondiente.
    - Pasar al área de Módulos de Atención Personalizada (MAP) y esperar su turno
    - Cuando llegue su turno, la persona del MAP revisará que se cumpla con todos los requisitos, si no están completos
      informa al ciudadano que no es posible realizar el trámite y le indica que es lo que le hace falta
    - La persona del MAP solicita al Departamento de Obras de la Subdirección Técnica, la elaboración del Presupuesto
      de la Obra Especial de acuerdo a los metros excedentes y le indicará al ciudadano la fecha en que tiene que
      regresar a contratar
  notes: Fase I - Solicitud de elaboración de Presupuesto
- name: Fase II - Contratación de los servicios
  requirements:
  - text: Los indicados en la Fase I
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - En la fecha señalada por la persona del MAP, acudir nuevamente al Centro de Atención al Público con los requisitos,
      para realizar la contratación correspondiente
    - La persona del MAP elaborará el Contrato Administrativo correspondiente en el cual se incluirá un 8% adicional
      por gastos administrativos de ingeniería, y le hará entrega de éste y del Presupuesto de Obra para que los
      revise y los firme
    - La persona solicitante debe firmar de conformidad los documentos que le entrega la persona del MAP
    - 'Una vez firmados los documentos deberá pasar a cajas a realizar el pago (de contado), en donde le entregarán
      dos documentos: 1) Comprobante de pago y 2) Convenio de liquidación de obra'
  notes: Fase II - Contratación de los servicios
