scenarios:
- name: De Residencial a Comercial e Industrial
  requirements:
  - text: El saldo a pagar de la cuenta sobre la que se va a solicitar el cambio de tarifa debe estar en ceros.
    cites:
    - source: retys
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el titular de la cuenta,
      si la persona que realiza el trámite no es el titular, puede ser uno de los siguientes: Poder Notarial; Carta
      poder ante notario público, corredor público o fedatario público; Carta Poder simple firmada por el titular
      de la cuenta y por dos testigos, que incluya copia de las identificaciones oficiales de los testigos, cuya
      antigüedad no exceda los seis meses.'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía vigente del propietario del predio; y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio si es el caso, puede ser UNO de los siguientes: Credencial
      del INE; Pasaporte mexicano; Licencia de conducir; Matrícula consular.'
    cites:
    - source: retys
  - text: Documento de alta ante la Secretaría de Hacienda y Crédito Público para efectos de facturación
    cites:
    - source: retys
  - text: Todos los documentos se deben entregar en original y copia, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a cualquier Centro de Atención al Público (CAP) de CESPT
    - Pasar al Módulo de Atención Personalizada (MAP) y esperar su turno
    - Cuando llegue su turno, la persona del MAP revisará que se cumpla con todos los requisitos, si no están completos,
      le informará que no es posible realizar el trámite hasta que éstos se completen, indicando que es lo que falta
    - Con los requisitos completos la persona del MAP procede a realizar el cambio solicitado, informando al usuario
      que éste se reflejará en su próximo recibo
  notes: De Residencial a Comercial e Industrial
- name: De Comercial e Industrial a Residencial
  requirements:
  - text: El saldo a pagar de la cuenta sobre la que se va a solicitar el cambio de tarifa debe estar en ceros
    cites:
    - source: retys
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el titular de la cuenta,
      si la persona que realiza el trámite no es el titular, puede ser uno de los siguientes: Poder Notarial; Carta
      poder ante notario público, corredor público o fedatario público; Carta Poder simple firmada por el titular
      de la cuenta y por dos testigos, que incluya copia de las identificaciones oficiales de los testigos, cuya
      antigüedad no exceda los seis meses.'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía vigente del propietario del predio; y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio si es el caso, puede ser UNO de los siguientes: Credencial
      del INE; Pasaporte mexicano; Licencia de conducir; Matrícula consular.'
    cites:
    - source: retys
  - text: Inspección general para verificar el uso de suelo, la puede tramitar llamando al teléfono 073.
    cites:
    - source: retys
  - text: Documento de baja ante Secretaría de Hacienda y Crédito Público
    cites:
    - source: retys
  - text: Todos los documentos se deben entregar original y copia, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a cualquier Centro de Atención al Público (CAP) de CESPT
    - Pasar al Módulo de Atención Personalizada (MAP) y esperar su turno
    - Cuando llegue su turno, la persona del MAP revisará que se cumpla con todos los requisitos, si no están completos,
      le informará no es posible realizar el trámite hasta que éstos se completen, indicando que es lo que falta
    - Si el resultado de la inspección es NEGATIVO, se le informa al usuario que no es posible realizar el cambio
      solicitado.
    - Con el resultado de la inspección POSITIVO, la persona del MAP procede a realizar el cambio solicitado, informando
      al usuario que éste se reflejará en su próximo recibo
  notes: De Comercial e Industrial a Residencial
