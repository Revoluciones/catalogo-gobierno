scenarios:
- name: CERTIFICADO PARCIAL
  requirements:
  - text: Formato de baja definitiva el cual debera presentarse (previamente con sellos recabado al depto. de control
      escolar)
    cites:
    - source: retys
  - text: debera presentarse al departamento de control escolar para solicitar el certificado parcial
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - estudiante realiza el pago de certificado e imprime recibos de no adeudos.
    - estudiante se presenta al departamento de finanzas para recabar sello de no adeudo.
    - depto. de finanzas en el caso de que tenga estudiante adeudo le notifica para que proceda a cubrirlo.
    - estudiante cuenta con sello de finanzas y se presenta en la direccion del programa academico
    - director de programa academico, veifica que estudiante no cuente con adeudos en talleres y laboratorios, para
      el sello correspondiente
    - estudiante presenta su recibo y formato de no adeudo al depto. de gestio escolar para que emitan certificado
  notes: Realizar baja definitiva, para que le puedan proporcional el certificado parcial de estudios.
