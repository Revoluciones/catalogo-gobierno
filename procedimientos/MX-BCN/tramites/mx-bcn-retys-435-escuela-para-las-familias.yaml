title: Escuela para las Familias
summary: Fortalecer las dinámicas familiares mediante la impartición de pláticas dirigidas a madres, padres, tutores,
  responsables de crianza y/o cuidado de menores de edad, autoridades educativas, servidores (as) públicos y comunidad
  como una medida de protección de los derechos de niñas, niños y adolescentes.
