- presencial
offices:
- municipality: Tijuana
  name: CAP Oficinas Centrales
  address: 'Blvd. Federico Benítez #4057, Col. 20 de Noviembre, Tijuana, 22430'
- municipality: Playas de Rosarito
  name: CAP Rosarito Floresta del Mar
  address: 'Blvd. Benito Juárez #385, Fracc. Hacienda Floresta del Mar, Playas de Rosarito, 22703'
scenarios:
- name: General
  requirements:
  - text: 'Original de Petición por escrito, que debe incluir: a. Clave catastral, b. Superficie, c. Domicilio en
      donde se instalarán los servicios, d. Plano o croquis de localización, e. Tipo de servicio que se solicita,
      f. Datos de facturación, g. Datos del contacto'
    cites:
    - source: retys
  - text: Inspección de factibilidad positiva emitida por CESPT, la puede solicitar llamando al 073.
    cites:
    - source: retys
  - text: 'Copia de documento para comprobar la propiedad, posesión o titularidad del predio en el que se instalarán
      los servicios, puede ser UNO de los siguientes: Carta de inscripción del Registro Público de la Propiedad
      y de Comercio (Escrituras) con fecha de registro no mayor a un año de antigüedad; Juicio de prescripción positiva
      inscrito en el Registro Público de la Propiedad y de Comercio con fecha de registro no mayor a un año de antigüedad;
      Recibo del impuesto predial vigente (con fecha de emisión no mayor a un año de antigüedad).'
    cites:
    - source: retys
  - text: 'Copia de documento que otorgue poder para realizar el servicio, puede ser uno de los siguientes: Carta
      Poder simple otorgada por la dependencia, cuya fecha no exceda los seis meses de antigüedad.'
    cites:
    - source: retys
  - text: 'Original y copia de Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la
      persona a quien éste le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes:
      Credencial del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Hacer el pago correspondiente
    cites:
    - source: retys
  - text: Las copias deben ser LEGIBLES Y CONTENER EL DOCUMENTO COMPLETO.
    cites:
    - source: retys
  - text: Al momento de realizar la contratación deberán estar PAGADOS O CONVENIDOS LOS DERECHOS DE CONEXIÓN.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público (CAP) de Oficinas Centrales o al CAP Rosarito Floresta del Mar
    - Pasar al área de Archivo y entregar la petición por escrito
    - La persona de archivo entregará la copia del documento, al cual le imprime la certificación de recibido, que
      contiene el número de folio para su seguimiento y la fecha de respuesta
    - En la fecha de respuesta indicada, CESPT remite oficio de respuesta a la dependencia que solicita el servicio,
      anexando al mismo el costo del servicio e indicando que en la próxima factura se reflejará el cobro de éste
  notes: General
