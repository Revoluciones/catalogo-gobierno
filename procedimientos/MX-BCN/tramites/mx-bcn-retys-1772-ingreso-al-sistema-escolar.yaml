scenarios:
- name: Nuevo ingreso
  requirements:
  - text: Realizar el Examen de Conocimientos Generales en la hora y día indicada (aplica únicamente a nivel licenciatura).
    cites:
    - source: retys
  - text: Acta de nacimiento actualizada. Original y 2 copias.
    cites:
    - source: retys
  - text: Credencial de elector, o Credencial de preparatoria (en caso de ser menores de edad) 2 copias
    cites:
    - source: retys
  - text: Clave Única de Registro de Población (CURP). Original y 2 copias.
    cites:
    - source: retys
  - text: Certificado de Bachillerato. Original y 2 copias. (En caso de no contar con el certificado, entregar una
      Constancia de Terminación de Estudios nivel Bachillerato -solo te avala por 6 meses-).
    cites:
    - source: retys
  - text: 4 fotografías tamaño infantil blanco y negro. No instantáneas.
    cites:
    - source: retys
  - text: Comprobante de domicilio. Original y 2 copias.
    cites:
    - source: retys
  - text: Firma de carta de compromiso (formato que se le proporciona al inscribirse).
    cites:
    - source: retys
  - text: Titulo de licenciatura (aplica para posgrado).
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Consultar la convocatoria vigente publicada por la UIBC.
    - Llenar el formulario de solicitud de ingreso en línea o presencialmente, según se indique.
    - Entregar la documentación requerida en tiempo y forma.
    - Presentarse a examen diagnostico, en su caso.
    - Esperar la publicación de resultados y confirmación de inscripción.
    - Formalizar el proceso de inscripción con la entrega de documentos originales y firma de expediente escolar.
  notes: Estudiante que solicita por primera vez su incorporación a las ofertas educativas de la Universidad Intercultural
    de Baja California, en el nivel de licenciatura o posgrado.
- name: Reinscripción
  requirements:
  - text: Haber concluido satisfactoriamente el semestre anterior.
    cites:
    - source: retys
  - text: Realizar el pago de reinscripción al siguiente semestre.
    cites:
    - source: retys
  - text: Llenar el formato de reinscripción con datos personales.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/13707
  modes:
  - name: Presencial
    steps:
    - Concluir satisfactoriamente el semestre anterior, cumpliendo con los requisitos académicos establecidos.
    - Realizar el pago correspondiente a la reinscripción, mediante deposito bancario.
    - Reunir y conservar el comprobante de pago como evidencia para el trámite.
    - Llenar el formato de reinscripción con sus datos personales y académicos.
    - Solicitar formalmente la reinscripción al semestre actual mediante presentación directa en control escolar.
    - Departamento de Control registra su reingreso al nuevo ciclo escolar.
  notes: Proceso mediante el cual un estudiante activo de la Universidad Intercultural de Baja California formaliza
    su continuidad académica en el siguiente periodo escolar, cumpliendo con los requisitos administrativos y académicos
    establecidos por la institución.
