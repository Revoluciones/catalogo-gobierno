branch: ejecutivo
kind: tramite
title: Ingreso al Sistema Escolar
summary: Llevar a cabo el proceso de registro administrativo y académico de estudiantes de nuevo ingreso que hayan
  sido admitidos a alguno de los programas educativos de la Universidad Intercultural de Baja California. Este trámite
  permite la incorporación formal al sistema escolar institucional mediante la integración del expediente estudiantil,
  la asignación de matrícula, la carga académica inicial y el otorgamiento de los derechos y servicios escolares
  correspondientes. La inscripción deberá realizarse dentro de los plazos establecidos en la convocatoria oficial
  y requiere el cumplimiento de requisitos académicos, administrativos y documentales.
