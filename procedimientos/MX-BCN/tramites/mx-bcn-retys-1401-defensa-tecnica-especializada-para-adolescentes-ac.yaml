title: Defensa técnica especializada para adolescentes acusados
summary: Proporcionar asesoría y representación legal a personas que tengan entre 12 años cumplidos y menos de 18
  años de edad que se les atribuya la realización de conductas tipificadas como delitos en el código penal de baja
  california y no cuenten con defensor particular, cuando ellos o el juez respectivo los designe para tal fin. De
  igual manera, se brinda asesoría jurídica a sus padres o tutor en su caso.
