scenarios:
- name: Adolescente
  requirements:
  - text: En caso de haber contado con abogado particular; presentar escrito de revocación del abogado particular.
    cites:
    - source: retys
  - text: En su caso, notificación que ejerce el juez solicitando la defensa pública.
    cites:
    - source: retys
  - text: En su caso, solicitud de ministerio público para solicitar defensor público.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir A la defensoría pública cada 10 días o cuando se lo indique el defensor público asignado
    - Aportar los elementos para defenderlo en la averiguación previa que se integra.
    - Dar seguimiento al desarrollo de la averiguación previa.
  notes: De 12 A 17 años de edad
