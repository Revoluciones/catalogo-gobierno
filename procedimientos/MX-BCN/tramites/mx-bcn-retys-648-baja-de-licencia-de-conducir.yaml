scenarios:
- name: Ciudadanía en General
  requirements:
  - text: Original y copia de identificación oficial vigente ( INE, pasaporte mexicano, cartilla del servicio militar
      nacional o matrícula consular)
    cites:
    - source: retys
  - text: Licencia de conducir en original y copia, en caso de robo o extravío presentar presentar el reporte respectivo
      ante el Ministerio Público que corresponde, o llenar formato de extravío.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14100
  modes:
  - name: Presencial
    steps:
    - El contribuyente debe acudir a Recaudación de Rentas con los documentos
    - Solicita el servicio en el módulo de orientación y entrega su licencia de conducir
    - Pasa al módulo de captura de información
    - 'Realizar pago de derechos e impuestos correspondientes al trámite, opciones de pago: efectivo,cheque certificado,
      tarjeta debito/crédito (excepto tarjetas American Express )'
    - Recibe constancia de baja de la licencia de conducir
  notes: Garantizar y hacer con calidad el servicio de baja de una licencia para conducir vehículos, por solicitud
    expresa del usuario, de los registros oficiales del Gobierno del Estado de Baja california
