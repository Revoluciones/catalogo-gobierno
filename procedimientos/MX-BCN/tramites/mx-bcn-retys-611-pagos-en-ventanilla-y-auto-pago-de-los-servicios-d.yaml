title: Pagos en ventanilla y auto pago de los servicios de agua potable.
summary: Atender al usuario de manera expedita, con el fin de que efectúe los pagos por derechos de consumo de agua,
  de obras de alcantarillado sanitario y agua potable, ó abonos a convenio con el organismo y otros servicios; independientemente
  de la zona comercial a que corresponda.
