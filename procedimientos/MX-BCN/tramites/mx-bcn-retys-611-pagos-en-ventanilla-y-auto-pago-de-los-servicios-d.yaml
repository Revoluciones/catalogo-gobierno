scenarios:
- name: Ciudadano
  requirements:
  - text: Acudir con su factura
    cites:
    - source: retys
  - text: Tener el monto del adeudo completo y/o el medio por el cual realizará el pago
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la zona comercial más cercana al área de cajas o auto pago y esperar su turno.
    - Entregar la factura con el pago a la persona que esta en ventanilla
    - Pago en efectivo en todos los casos, solo moneda nacional.
    - Pago con cheques si la cuenta a pagar es de un servicio comercial ó en doméstico si el pago es mayor a 500
      pesos.
    - El cheque debe estar a nombre de comisión estatal de servicios públicos de Mexicali y por la cantidad exacta
      a pagar
    - Opción de pago con tarjeta de crédito o debito acompañado de su identificación.
    - Se le entrega su comprobante de pago
  notes: Realizar el pago
