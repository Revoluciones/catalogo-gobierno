scenarios:
- name: Porcentaje de atención a la demanda educativa en educación superior por parte de la UPBC
  requirements:
  - text: Recibo de pago de reinscripción
    cites:
    - source: retys
  - text: Pago en linea o en ventanilla
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Entrar a la página del sistema Siaax haciendo clic en el botón "iniciar trámite" ubicado en la parte inferior
      derecha
    - Ingresar con su número de matrícula y contraseña
    - Seleccionar tipo de trámite
    - Generar recibo de pago, para realizar el pago en línea o imprimir para pago en ventanilla
    - Subir el recibo de pago en formato pdf, para que sea validado por el área de recursos financieros
    - Una vez validado por el área de recursos financieros, se le indica a gestión escolar por medio del Siaax que
      se reinscribió el estudiante
  notes: Subir de manera digital el recibo de pago en portal para su reinscripción
