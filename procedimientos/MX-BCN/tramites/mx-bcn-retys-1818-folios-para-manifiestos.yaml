- Representante Legal
when: Cada vez que sus Manifiestos de Entrega, Transporte y Recepción de Residuos de Manejo Especial estén por agotarse
  y durante la vigencia de su registro
result: Oficio donde se le otorgan, o no, los números de folio solicitados.
