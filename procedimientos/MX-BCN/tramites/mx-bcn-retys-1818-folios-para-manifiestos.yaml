branch: ejecutivo
kind: tramite
title: Folios para manifiestos
summary: Solicitud que realiza la persona prestadora de servicios de números de folios para los Manifiestos de Entrega,
  Transporte y Recepción de Residuos de Manejo Especial, que expedirá al generador de residuos de manejo especial
  y que tiene como objetivo registrar el trayecto que sigue un residuo de manejo especial durante su manejo integral.
authority:
  name: Secretaría de Medio Ambiente y Desarrollo Sustentable de Baja California
