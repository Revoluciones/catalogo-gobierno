  modes:
  - name: Mixto
    steps:
    - Solicitar capacitación por medio de llamada o correo electrónico que podrá encontrar dirigiéndose a la pestaña
      de oficinas, seleccionando la oficina de su interés de acuerdo a su municipio y haciendo clic en el botón
      de "ver información"
    - Se realizará una previa revisión de agenda y se hará un registro calendario de capacitación
    - Buscar transporte para instructor para las fechas calendarizadas
    - Impartir capacitación
    - Elaboración de constancias de participación
    - Entrega de comprobante de recepción de constancias
  notes: Representante de la empresa que desea capacitación
