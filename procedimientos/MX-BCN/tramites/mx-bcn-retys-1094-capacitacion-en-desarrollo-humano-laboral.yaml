title: Capacitación en Desarrollo Humano Laboral
summary: Servicio que se ofrece a las empresas y organizaciones para capacitar en una forma efectiva a sus trabajadores
  en desarrollo humano laboral, mejorando y fortaleciendo su desempeño y competitividad, para construir y generar
  un cambio de actitud al desarrollo de su potencial como personas y así contribuir en la productividad de la empresa.
