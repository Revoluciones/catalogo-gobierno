id: mx-bcn-retys-1332-intervencion-de-colonoscopia
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Intervención de Colonoscopia
summary: Es un examen en el que se visualiza el interior del colon (intestino grueso) y el recto, mediante un instrumento
  llamado colonoscopio.
authority:
  name: Unidad de Especialidades Médicas de Baja California
official_ids:
  retys_id: 1332
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/1332
  homoclave: BC-UNEME-005
who_can:
- Interesado
when: Cuando la o el especialista lo recomiende
result: Atención médica especializada en cirugía general y tratamiento de vias digestivas bajas
cost:
  type: gratuito
  amount_mxn: null
  text: SIN COSTO
  as_of: '2026-11-06'
  cites:
  - source: retys
