  - name: En línea
    steps:
    - Ingresar a https://www.gob.mx/ActaNacimiento/
    - Llenar formulario con datos personales
    - Pago de derechos
    - Descarga e impresión de acta de nacimiento
  notes: 'Puedes realizar la búsqueda del acta de nacimiento por cualquiera de estos métodos: Con la Clave Única
