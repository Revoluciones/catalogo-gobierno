    cites:
    - source: retys
  - text: Constancia de Situación Fiscal. (Actualizada, no mayor a tres meses de antigüedad).
    cites:
    - source: retys
  - text: Permiso o concesión vigente o en trámite de renovación (CONAPESCA). *Obligatorio para quienes realizan
      acuacultura en Aguas de Jurisdicción Federal.
    cites:
    - source: retys
  - text: Comprobante con Datos Bancarios de la Persona Solicitante o del proveedor (Estado de cuenta emitido por
      el banco).
    cites:
    - source: retys
  - text: 'Constancia de situación crediticia (FOGABAC): Documento que acredite el estatus de "No Adeudo" (Aplica
      solo para solicitantes con créditos activos en el Fideicomiso).'
    cites:
    - source: retys
  - text: Acreditar la propiedad o legal posesión del predio (En caso de que aplique).
    cites:
    - source: retys
  - text: Presentar el Registro Nacional Pesquero y Acuícola.
    cites:
    - source: retys
  - text: Último aviso de siembra y cosecha, omitir en el caso de ser un Proyecto Nuevo (Adjuntar en PDF ambos Avisos).
    cites:
    - source: retys
  - text: Presentar la constancia de cumplimiento de pagos emitida por CESAIBC. (Aplica únicamente en caso de estar
      adscrito al Programa Mexicano de Sanidad de Moluscos Bivalvos y realizar el pago a través de este Comité).
    cites:
    - source: retys
  - text: En caso de no contar con la expedición de certificados emitidos por la autoridad federal competente en
      materia de sanidad o inocuidad, presentar el documento probatorio de ingreso de la solicitud para obtener
      la certificación del año en curso.
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Registro de Solicitud en Línea
    - Carga de Documentos de Requisitos
    - Validación de Expediente para Asignación de Folio Estatal del Programa
    - Dictaminación de Expediente
    - Integración de Comprobación de aplicación del Recurso de Apoyo y Finiquito de Expediente
  notes: 'El Apoyo podrá utilizarse para impulsar la certificación de personas físicas o morales dedicadas a la
    actividad acuícola, de acuerdo con lo siguiente: a) Pago de análisis requeridos para la certificación de buenas
    prácticas de unidades de producción acuícola y plantas de procesamiento primario. b) Pago de trámite del certificado.
    c) Pago del tercero autorizado que emitirá el dictamen.'
