- Representante Legal
- Interesado
when: 'Para año actual el periodo de Recepción de Solicitud a Cerrado, para más información consultar en: https://www.bajacalifornia.gob.mx/sepesca/Servicios'
result: Apoyo subsidiario a la inversión en bienes de capital estratégico para equipamiento y ordenamiento.
