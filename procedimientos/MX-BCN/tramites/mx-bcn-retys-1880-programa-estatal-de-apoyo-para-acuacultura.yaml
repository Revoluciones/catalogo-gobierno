  - source: retys
positive_silence: false
requires_inspection: false
channels:
- presencial
offices:
- municipality: Ensenada
  name: Departamento de Fomento Acuícola
  address: 'Carretera Transpeninsular Ensenada - La Paz #6500, Ex-Ejido Chapultepec, Ensenada, 22785'
scenarios:
- name: Subcomponente Desarrollo Tecnológico Acuícola
  requirements:
  - text: Solicitud de Apoyo con datos técnicos y socioeconómicos del SOLICITANTE debidamente llenada y firmada.
    cites:
    - source: retys
  - text: Identificación oficial vigente (INE, Pasaporte, Cartilla Militar).
    cites:
    - source: retys
  - text: Comprobante de domicilio (persona física, apoderado o representante legal) con una vigencia no mayor a
      3 meses.
    cites:
    - source: retys
  - text: Acta Constitutiva. (aplica solo para las personas morales).
    cites:
    - source: retys
  - text: Última Acta de Asamblea donde se establece quienes ostentan actualmente los poderes y representación de
      la persona moral. (aplica solo para las personas morales).
    cites:
    - source: retys
  - text: Escrito libre con fecha y firma, mediante el cual se manifieste bajo protesta de decir verdad que quien
      llevará a cabo los trámites y procesos del Programa ante la Dependencia, cuenta actualmente con los poderes
      necesarios. (Consultar y descargar en la página electrónica).
    cites:
    - source: retys
  - text: Constancia de Situación Fiscal (Actualizada, no mayor a tres meses de antigüedad).
    cites:
    - source: retys
  - text: Permiso o concesión vigente o en trámite de renovación (CONAPESCA). *Obligatorio para quienes realizan
      acuacultura en Aguas de Jurisdicción Federal.
    cites:
    - source: retys
  - text: Comprobante con Datos bancarios de la PERSONA BENEFICIARIA o del proveedor (Estado de cuenta emitido por
      el banco).
    cites:
    - source: retys
  - text: 'Constancia de situación crediticia (FOGABAC): Documento que acredite el estatus de "No Adeudo" (Aplica
      solo para solicitantes con créditos activos en el Fideicomiso).'
    cites:
    - source: retys
  - text: Acreditar la propiedad o legal posesión del predio (En caso de que aplique).
    cites:
    - source: retys
  - text: Presentar el Registro Nacional Pesquero y Acuícola.
    cites:
    - source: retys
  - text: Último aviso de siembra y cosecha, omitir en el caso de ser un Proyecto Nuevo (Adjuntar en PDF ambos Avisos).
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Registro de Solicitud en Línea
    - Carga de Documentos de Requisitos
    - Validación de Expediente para Asignación de Folio Estatal del Programa
    - Dictaminación de Expediente
    - Integración de Comprobación de aplicación del Recurso de Apoyo y Finiquito de Expediente
  notes: El Apoyo podrá destinarse a maquinaria, equipo, insumos, infraestructura y energías alternativas para la
    producción acuícola.
