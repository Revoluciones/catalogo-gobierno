id: mx-bcn-retys-1880-programa-estatal-de-apoyo-para-acuacultura
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Programa Estatal de Apoyo para ACUACULTURA
summary: Trámite para la Recepción de Solicitudes para aplicar a los beneficios del Programa Estatal de Apoyo para
  el Sector de Pesca y Acuacultura, enfocado en la ACUACULTURA a través del apoyo subsidiario a la inversión en
  bienes de capital estratégico para equipamiento, mantenimiento, ordenamiento, sanidad y particularmente para eficientizar
  la operación con énfasis en el incremento o mejora de la producción, servicios y/o su comercialización.
authority:
  name: Secretaría de Pesca y Acuacultura de Baja California
