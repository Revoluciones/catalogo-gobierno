scenarios:
- name: Propietario
  requirements:
  - text: Escrituras del predio o certificado de inscripción ante el registro público de la propiedad y del comercio
      expedido por el gobierno del estado no mayor a seis meses de antigüedad.
    cites:
    - source: retys
  - text: 'Presentar una identificación oficial: INE, licencia de conducir, matricula consular, cédula profesional
      o pasaporte mexicano (vigentes).'
    cites:
    - source: retys
  - text: En caso de reposición de medidor por robo, se deberá presentar el acta de robo correspondiente expedida
      por la agencia del ministerio público
    cites:
    - source: retys
  - text: En la primera reposición no tendrá costo alguno, pero en las ocasiones subsecuentes, tendrá que presentar
      recibo de pago del total del costo del servicio o pagar mínimo el 30% a servicio doméstico y 50% a servicio
      no doméstico como anticipo, para acceder a convenir el resto
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al área de atención a usuarios de la zona comercial correspondiente
    - Presentar su solicitud de servicios con los documentos requeridos.
    - Entrega del presupuesto.
    - Cubrir el total o convenir el importe de su presupuesto.
    - Entrega de la orden de instalación.
  notes: Acreditar la propiedad
- name: Posesionario
  requirements:
  - text: Posesión expedida por el comisario ejidal o residencia expedida por el delegado municipal o concesión
      expedida ante conagua, la secretaria de reforma agraria o el registro agrario nacional.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - acudir al área de atención a usuarios de la zona comercial correspondiente
    - Presentar su solicitud de servicios con los documentos requeridos.
    - Entrega del presupuesto.
    - Cubrir el total o convenir el importe de su presupuesto.
    - Entrega de la orden de instalación.
  notes: Acreditar la propiedad
