level: estatal
branch: ejecutivo
kind: tramite
title: Programa Pescando con el Corazón
summary: Trámite para la Recepción de Solicitudes para aplicar a los beneficios del Programa de Apoyos Economicos
  Directos, denominado “PESCANDO CON EL CORAZÓN”, con el objetivo de contribuir al bienestar de las y los trabajadores
  del sector pesquero y acuícola, ligados a personas permisionarias pesqueras, acuícolas a través del otorgamiento
  de un apoyo económico directo, en especial a quienes no reciban un ingresos en temporadas de veda de sus especies
  de aprovechamiento o pérdidas de cosecha de especies de cultivo por eventos extraordinarios.
