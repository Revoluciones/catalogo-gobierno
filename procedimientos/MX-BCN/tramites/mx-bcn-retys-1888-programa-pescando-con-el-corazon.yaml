scenarios:
- name: Registro de Empresa Empleadora de Personas Trabajadoras del Sector Pesquero y Acuícola
  requirements:
  - text: Solicitud de Apoyo con datos técnicos y socioeconómicos del SOLICITANTE debidamente llenada y firmada
      (Registro de Empresa Empleadora del Sector Pesquero y Acuícola.). Archivo PDF para firma que emite el Sistema
      de Ventanilla Digital B.C. para la captura de solicitudes de apoyo en línea.
    cites:
    - source: retys
  - text: Formato PDF debidamente llenado y firmado para Seguimiento y Relación de Trabajadores Activos para Empresa
      cuando se trate de Empresa de tipo Persona Física.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14781
  - text: Formato PDF debidamente llenado y firmado para Seguimiento y Relación de Trabajadores Activos para Empresa
      cuando se trate de Empresa de tipo Persona Moral.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14782
  - text: Identificación Oficial con fotografía vigente (para Persona Física y para Persona Moral la del Representante
      Legal)
    cites:
    - source: retys
  - text: Comprobante de Domicilio con antigüedad no mayor a 03 (tres) meses, carta de residencia emitida por autoridad
      municipal, recibos de servicios públicos (agua, energía eléctrica, predial u otros), permisos o concesión
      de pesca comercial y/o acuacultura.
    cites:
    - source: retys
  - text: Constancia de Situación Fiscal SAT vigente de un periodo no mayor a 3 (tres) meses al momento del ingreso
      de Solicitud
    cites:
    - source: retys
  - text: Permiso o concesión de Pesca Comercial y/o Fomento, Autorización de Aprovechamiento expedido por SEMARNAT
      del año en curso, permiso de fomento Acuícola o Concesión de Acuacultura, vigente.
    cites:
    - source: retys
  - text: 'Avisos de arribo y/o cosecha 2025 de CONAPESCA, y/o 2026 facturas de producto vendido de permisos de
      SEMARNAT. Nota: Integrar todo en un solo Documento PDF (avisos y facturas).'
    cites:
    - source: retys
  - text: Acta Constitutiva en formato digital, y original para cotejo. (Solo cuando se trate de Personas Morales)
    cites:
    - source: retys
  - text: Última Acta de Asamblea donde se establece quienes ostentan actualmente los poderes y representación en
      formato Digital y original para cotejo. (Solo cuando se trate de Personas Morales)
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Solicitud de Apoyo con datos técnicos y socioeconómicos del SOLICITANTE debidamente llenada y firmada.
    - Carga de Documentos de Requisitos
    - Validación de Expediente para Asignación de Folio Estatal del Programa
    - Dictaminación de Expediente
    - Integración de Comprobación de aplicación del Recurso de Apoyo y Finiquito de Expediente
  notes: 'Registro de Empresas de PESCA COMERCIAL o ACUÍCOLA del Estado de Baja California, que son PERSONAS FÍSICAS
    o MORALES y buscan beneficiar a sus Personas Trabajadoras, tales como personas pescadoras, cosechadoras acuícolas,
    buceadoras, tripulantes y/o ayudantes en activo, que trabajan de manera particular o colectiva, en el territorio
    y litoral del Estado de Baja California. Para este efecto, se le dará prioridad a: Personas pertenecientes a
    Zona Prioritaria en San Quintín, Personas pertenecientes a los pueblos originarios, Mujeres, Personas con discapacidad
    y Personas adultas mayores.'
- name: Registro de Persona Trabajadora del Sector Pesquero y Acuícola
  requirements:
  - text: Solicitud de Apoyo con datos técnicos y socioeconómicos del SOLICITANTE debidamente llenada y firmada.
    cites:
    - source: retys
  - text: Identificación Oficial con fotografía vigente con domicilio en el Estado de Baja California, como de Credencial
      para Votar INE, Pasaporte o Licencia de Conducir.
    cites:
    - source: retys
  - text: Estado de cuenta Bancario o captura de la aplicación digital o contrato, donde se aprecie el nombre completo
      del beneficiario y el número de la cuenta CLABE.
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Solicitud de Apoyo con datos técnicos y socioeconómicos del SOLICITANTE debidamente llenada y firmada.
    - Carga de Documentos de Requisitos
    - Revisión, Validación de Documentos de Requisitos e Integración de Expediente de Empresas Empleadoras donde
      se Dictaminan los Expedientes.
  notes: 'Registro de Personas Trabajadoras en Empresas de PESCA COMERCIAL o ACUÍCOLA del Estado de Baja California,
    tales como personas pescadoras, cosechadoras acuícolas, buceadoras, tripulantes y/o ayudantes en activo, que
    trabajan de manera particular o colectiva, en el territorio y litoral del Estado de Baja California. Para este
    efecto, se le dará prioridad a: Personas pertenecientes a Zona Prioritaria en San Quintín, Personas pertenecientes
    a los pueblos originarios, Mujeres, Personas con discapacidad y Personas adultas mayores.'
- name: Encuesta Socioeconómica a Personas Solicitantes del Programa "Pescando con el Corazón"
  requirements:
  - text: No requiere presentar documentos tipo requisitos, solo el llenado de la encuesta.
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Llenado de Encuesta de datos Socioeconómicos de la Persona Solicitante del Programa Estatal de Apoyo Pescando
      con el Corazón.
    - Integración de Expediente de Empresas Empleadoras donde se Dictaminan los Expedientes de las Personas Solicitantes
      del Beneficio.
  notes: Registro de información socioeconómica de las personas solicitantes del Programa Estatal de Apoyo Pescando
    con el Corazón, debe ser llenado una sola vez por cada Persona Trabajadora, tales como personas pescadoras,
    cosechadoras acuícolas, buceadoras, tripulantes y/o ayudantes en activo, que trabajan de manera particular o
    colectiva, en el territorio y litoral del Estado de Baja California.
