scenarios:
- name: Conciliación Médica
  requirements:
  - text: Poder legal en caso de actuar por un tercero
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - 'Ve a la reunión: Asiste a la audiencia de conciliación en la fecha y hora programadas.'
    - 'Explicación inicial: Al comenzar la reunión, el conciliador les explicará a ambas partes sus derechos, resumirá
      la queja y los puntos en común y en desacuerdo, y les pedirá que busquen un acuerdo sincero.'
    - 'Falta de asistencia o documentos: Si el prestador de servicios de salud no se presenta o no lleva la documentación,
      se pedirá ayuda a asociaciones profesionales.'
    - 'Si tú no vas a la reunión: Si no asistes y no das una razón válida dentro de los 5 días, se considerará que
      has retirado la queja y el caso se cierra; no se puede volver a presentar en la comisión.'
    - 'Acuerdo logrado: Si llegan a un acuerdo, se registrará y el caso se cerrará como resuelto.'
    - 'No hay acuerdo: Si no llegan a un acuerdo, el conciliador puede sugerir que la Comisión actúe como árbitro
      para resolver el problema.'
    - 'Aceptar el arbitraje: Si aceptan el arbitraje, se firmará un compromiso y se enviará el caso para que continúe
      el proceso.'
    - 'Rechazar el arbitraje: Si no aceptan el arbitraje, el caso se cierra y ambos pueden buscar resolverlo con
      otra autoridad.'
  notes: Intervención de la Comisión como mediador entre la persona que se queja y la persona prestadora de servicio
    de salud público o privado
