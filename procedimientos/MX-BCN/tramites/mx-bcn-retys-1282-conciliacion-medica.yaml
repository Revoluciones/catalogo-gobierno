- Representante Legal
- Interesado
when: En cualquier momento que ambos estén dispuestos a resolver su conflicto de manera amigable y sin necesidad
  de ir a juicio.
result: Depende del acuerdo al que lleguen las partes y de por solucionado el conflicto.
