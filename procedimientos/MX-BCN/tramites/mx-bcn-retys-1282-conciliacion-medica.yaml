branch: ejecutivo
kind: tramite
title: Conciliación Médica
summary: Es un proceso donde la persona que se queja y la persona prestadora de servicio de salud buscan resolver
  su conflicto de manera amigable y sin necesidad de ir a un juicio. Durante ella las partes se reúnen para discutir
  su problema con la ayuda de un mediador neutral que les facilita la comunicación y ayuda a encontrar una solución
  aceptable para ambos.
authority:
  name: Comisión de Arbitraje Medico del Estado de Baja California
