scenarios:
- name: Inscripción al Directorio Estatal
  requirements:
  - text: TENER 18 AÑOS CUMPLIDOS.
    cites:
    - source: retys
  - text: 'CUENTA ACTIVA DE LLAVE BC: Indispensable para iniciar sesión en la Ventanilla Digital y autenticar tu
      identidad.'
    cites:
    - source: retys
  - text: 'IDENTIFICACIÓN OFICIAL CON FOTOGRAFÍA: Documento vigente (como INE o pasaporte) escaneado en formato
      PDF o imagen.'
    cites:
    - source: retys
  - text: 'CONSTANCIA O CERTIFICACIÓN DEL DOMINIO DE LA LENGUA (PREFERENTEMENTE): Si cuentas con él, documento en
      formato PDF que avale tus conocimientos o certificación oficial como persona intérprete de Lengua Indígena
      (por ejemplo, acreditación de INALI).'
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - 'INICIA SESIÓN Y COMPLETA EL FORMULARIO: Ingresa a la Ventanilla Digital utilizando tu cuenta de Llave BC
      y llena la solicitud.'
    - 'SUBE TUS DOCUMENTOS: Adjunta en la plataforma tu identificación oficial y, de contar con él, el documento
      o constancia que avale tu experiencia.'
    - 'ACEPTA LOS TÉRMINOS Y EL AVISO DE PRIVACIDAD: Lee y acepta los términos del manejo de tus datos personales
      y firma digitalmente tu manifiesto de consentimiento para pertenecer al Directorio de la Secretaría de Inclusión
      Social.'
    - 'ESPERA LA VALIDACIÓN Y PUBLICACIÓN: La Secretaría revisará tu información. Una vez validada, tu perfil será
      integrado y publicado en la próxima actualización semestral del Directorio Estatal.'
  notes: Utiliza esta opción si eres persona hablante, intérprete o traductora de una Lengua Indígena y deseas registrar
    tus datos para prestar tus servicios.
