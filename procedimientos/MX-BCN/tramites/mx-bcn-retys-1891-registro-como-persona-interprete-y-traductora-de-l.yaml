title: Registro como Persona Intérprete y Traductora de Lenguas Indígenas (LI)
summary: Dirigido a personas hablantes de Lenguas Indígenas, intérpretes y traductoras en Baja California. A través
  de este trámite puedes inscribirte en el Directorio Estatal para prestar tus servicios, y permitir que la Secretaría
  de Inclusión Social te vincule con instituciones públicas o ciudadanía que requiera tu apoyo.
