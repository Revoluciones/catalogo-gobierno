scenarios:
- name: Persona física
  requirements:
  - text: Lista de Requisitos.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14701
  - text: Solicitud de Crédito Tu idea, Tu negocio 2026
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14013
  - text: Copia de identificación oficial vigente con fotografía, por ambos lados.
    cites:
    - source: retys
  - text: Constancia de Situación Fiscal, con antigüedad mayor a 6 meses, con una fecha de emisión no mayor a 30
      días.
    cites:
    - source: retys
  - text: 'Certificado de No Deudor Alimentario, no mayor a 30 días de la solicitud. Ingresa aquí (copia y pega
      en otra pestaña): (https://rnoa.dif.gob.mx/)'
    cites:
    - source: retys
  - text: Opinión de cumplimiento de obligaciones fiscales positiva, no mayor a 30 días de emisión.
    cites:
    - source: retys
  - text: Estados de cuenta bancarios de los últimos 4 meses.
    cites:
    - source: retys
  - text: 'Reporte de Buró de Crédito especial del solicitante, no mayor a 30 días de la solicitud. Ingresa aquí
      (copia y pega en otra pestaña): (www.burodecredito.com.mx)'
    cites:
    - source: retys
  - text: Fotografías del interior, exterior y equipamiento del negocio (a color, fotos claras).
    cites:
    - source: retys
  - text: Cotización de acuerdo a los conceptos elegibles, no mayor a 2 meses de emisión, con datos fiscales del
      proveedor, dirigida al solicitante.
    cites:
    - source: retys
  - text: Copia del comprobante de domicilio particular, no mayor a 2 meses de emisión.
    cites:
    - source: retys
  - text: Aval con capacidad financiera demostrable y activa.
    cites:
    - source: retys
  - text: Copia por ambos lados de la identificación oficial vigente del aval.
    cites:
    - source: retys
  - text: Copia del comprobante de domicilio del aval, no mayor a 2 meses de emisión.
    cites:
    - source: retys
  - text: Aviso de Privacidad para uso de datos personales.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14015
  modes:
  - name: Mixto
    steps:
    - Llenar el pre registro en línea haciendo clic en el botón "iniciar trámite" y enviar los requisitos por ese
      medio.
    - Se programa visita domiciliaria por parte del ejecutivo de financiamiento.
    - Revisión y en su defecto autorización de la solicitud por parte del “COMITÉ”.
    - De ser aprobada la solicitud, participar obligatoriamente en el curso de capacitación impartido por la “SEI”
      y obtener la constancia de acreditación.
    - Firma del contrato y formalización del crédito del beneficiario junto al aval en las oficinas de “FONDOS BC”.
    - Transferencia del monto solicitado para crédito a la cuenta bancaria especificada.
    - Una vez concluido el crédito solicitado, él beneficiario recibirá el pagaré original y estado de cuenta que
      demuestre la totalidad del pago.
  notes: Dueños de negocios establecidos en el estado de Baja California formalmente constituidas ante el SAT con
    una antigüedad mayor a 6 meses.
