title: Solicitud de Persona Intérprete de Lenguas Indígenas (LI)
summary: Conecta a personas que necesitan comunicarse dentro de alguna institución publica en alguna Lengua Indígena
  (LI) con personas intérpretes y traductoras de Baja California. Podrás consultar el Directorio Estatal disponible
  o solicitar apoyo institucional a la Secretaría de Inclusión Social (SIS) para contactar a una persona intérprete
  y traductora.
