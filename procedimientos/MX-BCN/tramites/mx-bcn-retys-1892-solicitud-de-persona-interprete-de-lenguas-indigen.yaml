scenarios:
- name: Solicitud de Vinculación
  requirements:
  - text: 'CUENTA ACTIVA DE LLAVE BC: Indispensable para iniciar sesión en la Ventanilla Digital, autenticar tu
      identidad y poder llenar tu formulario de solicitud.'
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - 'INICIA SESIÓN: Ingresa a la Ventanilla Digital utilizando tu cuenta de Llave BC.'
    - 'COMPLETA TU SOLICITUD: Llena el breve formulario indicando la Lengua Indígena requerida y el tipo de apoyo
      que necesitas.'
    - 'ESPERA LA VINCULACIÓN: El personal de la Secretaría de Inclusión Social recibirá tu solicitud y se pondrá
      en contacto contigo para canalizarte con el perfil adecuado.'
  notes: Utiliza esta opción si necesitas el acompañamiento de la Secretaría de Inclusión Social para buscar y contactar
    a una persona intérprete de Lengua Indígena.
