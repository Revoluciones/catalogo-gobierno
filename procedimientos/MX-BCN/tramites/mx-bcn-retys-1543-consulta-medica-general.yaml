scenarios:
- name: Consulta Médica General
  requirements:
  - text: Cualquier ciudadano puede solicitar el servicio de consulta médica general, sin requerir algún tipo de
      documento de requisito
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Solicitar programación de cita en el área de recepción, recibirá carnet de cita con la fecha y hora registrada.
    - Presentarse en consultorio el día de su cita y esperar su turno.
    - Recibir la consulta por parte del médico, para que este determine si el paciente se refiera a un servicio
      de la unidad médica, o a atención de segundo nivel (hospital), o en su caso, puede disponer para retirarse
      de la consulta dependiendo del diagnóstico, pudiendo o no generarse receta médica
  notes: Proporcionar atención médica orientada a la prevención, detección, diagnóstico y tratamiento de enfermedades
