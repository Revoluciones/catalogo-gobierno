  - text: Comprobante de domicilio
    cites:
    - source: retys
  - text: Identificación oficial
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Identificar datos de alarma durante el embarazo
    - Acudir al servicio de urgencias en caso de presentar algún dato de alarma
  notes: Brindar atención médica de urgencia a la mujer embarazada
