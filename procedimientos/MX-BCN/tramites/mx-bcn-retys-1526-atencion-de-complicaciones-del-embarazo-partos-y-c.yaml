scenarios:
- name: Complicaciones del embarazo, partos y cesáreas
  requirements:
  - text: Identificación oficial o en caso de ser menor de edad, presentar certificado de estudios
    cites:
    - source: retys
  - text: CURP.
    cites:
    - source: retys
  - text: Comprobante de domicilio
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a control prenatal en su centro de salud, donde se valorará y en caso de tener un riesgo se referiría
      a la unidad hospitalaria para la consulta de especialidad.
    - Acudir a la unidad hospitalaria para programar cita
    - Presentarse el día de la cita a la consulta externa de especialidad donde el médico realizará la valoración
      y atención médica correspondiente, así como el seguimiento necesario y canalización al módulo correspondiente.
  notes: Brindar atención médica a la mujer embarazada con complicaciones durante el embarazo, trabajo de parto
    o en su caso cesárea
- name: Urgencia obstétrica
  requirements:
  - text: CURP.
    cites:
