title: Evaluación en materia de impacto ambiental por modificaciones a proyectos autorizados
summary: Solicitud para la evaluación de modificaciones o ampliaciones a proyectos autorizados en materia de impacto
  ambiental, a fin de determinar si afecta o no el contenido de la autorización otorgada.
authority:
  name: Secretaría de Medio Ambiente y Desarrollo Sustentable de Baja California
