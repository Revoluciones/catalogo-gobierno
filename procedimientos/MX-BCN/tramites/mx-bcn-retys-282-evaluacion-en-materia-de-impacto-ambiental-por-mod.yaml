  retys_id: 282
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/282
  homoclave: BC-SMADS-049
who_can:
- Representante Legal
when: Previo a la realización de cualquier modificación o ampliación de una obra o actividad ya autorizada.
result: Acuerdo Administrativo con la autorización de la modificación o ampliación, o con el requerimiento de presentación
  de un IP o una MIA.
cost:
  type: variable
  amount_mxn: 4548.98
  text: 'COSTO VARIABLE: $4,548.98 M.N. Costo actualizado para el mes de noviembre del 2026.'
