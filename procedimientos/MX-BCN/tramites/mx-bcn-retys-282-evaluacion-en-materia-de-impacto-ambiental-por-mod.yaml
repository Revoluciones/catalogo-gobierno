scenarios:
- name: Persona física
  requirements:
  - text: Escrito de solicitud que contenga la firma autógrafa de la persona apoderada o representante legal.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14830
  - text: Pago de derechos correspondiente.
    cites:
    - source: retys
  - text: Copia simple de la identificación oficial de la persona interesada, legible y con vigencia activa.
    cites:
    - source: retys
  - text: En su caso, los planos y/o croquis con los cambios pretendidos.
    cites:
    - source: retys
  - text: Documentos técnicos que considere necesario para amparar su solicitud y sus manifestaciones.
    cites:
    - source: retys
  - text: En caso de que se actúe a través de apoderado o representante legal, presentar copia simple de la identificación
      oficial de este, nítida y con vigencia activa.
    cites:
    - source: retys
  - text: En caso de que se actúe a través de apoderado o representante legal, presentar documental vigente, completo
      y nítido que lo se acredite como tal
    cites:
    - source: retys
  - text: USB con la totalidad de la información presentada.
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Ingresar al portal, dando clic al botón "iniciar trámite", ubicado en la parte inferior derecha.
    - Seleccionar el tipo de persona (física o moral) y capturar la información solicitada.
    - Realizar el pago de derechos y obtener el comprobante correspondiente.
    - Subir los documentos solicitados vigentes.
    - Recepción y evaluación de la solicitud recibida por parte de la Secretaría.
    - Publicación de Resolución Administrativa en la página oficial de la Secretaría.
    - Acudir a las oficinas de la Secretaría de Medio Ambiente y Desarrollo Sustentable para la entrega y debida
      notificación de la Resolución Administrativa emitida por esta Autoridad. La notificación deberá ser recibida
      por el representante legal o apoderado legal quien deberá acreditar su personalidad jurídica conforme a la
      normatividad aplicable.
  - name: Presencial
    steps:
    - Consultar el trámite en RETyS, revisar los requisitos y costo aplicable.
    - Integrar la documentación requerida conforme a los requisitos establecidos para el trámite.
    - Acudir a las oficinas de la Secretaría de Medio Ambiente y Desarrollo Sustentable, presentar en original y
      copia la solicitud del trámite, anexando la documentación y comprobante de pago correspondiente.
    - Recepción y evaluación de la solicitud recibida por parte de la Secretaría.
    - Publicación de Resolución Administrativa en la página oficial de la Secretaría.
    - Recoger la notificación de resolución administrativa, una vez que la razón social aparezca disponible en el
      listado. La notificación deberá ser recibida por el representante legal o apoderado legal quien deberá acreditar
      su personalidad jurídica conforme a la normatividad aplicable.
  notes: Persona titular de una autorización, que pretende realizar una modificación a la misma.
- name: Persona Moral
  requirements:
