scenarios:
- name: Ciudadanía en general
  requirements:
  - text: Presentar en original y copia de Licencia de conducir vigente del Estado de Baja California
    cites:
    - source: retys
  - text: Tratándose de deterioro o daño, presentar el elemento de identificación vehicular que se haya deteriorado
      o dañado
    cites:
    - source: retys
  - text: Tratándose de robo o extravío de placas de circulación, presentar el reporte respectivo ante el Ministerio
      Público que corresponda. La Recaudación de Rentas del Estado podrá determinar los supuestos de extravío en
      los cuales no se requerirá el citado reporte, señalando el documento que lo suplirá
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/10973
  - text: 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito
      (excepto tarjetas American Express )'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas de Recaudación de Rentas del Estado
    - Realizar el pago de derechos e impuestos correspondiente
