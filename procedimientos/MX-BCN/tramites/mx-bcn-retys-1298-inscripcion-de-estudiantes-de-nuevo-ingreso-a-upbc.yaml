scenarios:
- name: Alumnos de nuevo ingreso
  requirements:
  - text: Pago de inscripción validado
    cites:
    - source: retys
  - text: Certificado original de preparatoria
    cites:
    - source: retys
  - text: Acta de nacimiento original
    cites:
    - source: retys
  - text: CURP certificada por el registro civil
    cites:
    - source: retys
  - text: Comprobante de domicilio
    cites:
    - source: retys
  - text: Constancia de vigencia de derechos del IMSS
    cites:
    - source: retys
  - text: Foto infantil reciente
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - El alumno deberá realizar el examen de admisión y acreditarlo para su inscripción
    - Una vez que haya aprobado el examen deberá solicitar su recibo de pago en la página web
    - Una vez que haya realizado el pago para la inscripción, lo deberá subir al portal para su validación
    - El alumno de nuevo ingreso deberá presentarse ante el área de gestión escolar con los documentos en original,
      que subió en la obtención de pre ficha o en la ficha
    - Gestión escolar recibe al alumno inscrito con documentos para cotejo de información y posterior a ello archiva
      los documentos
    - Alumno se presenta a curso de inducción de acuerdo a las fechas que se le indiquen
    - Puedes acceder a la página web de la UPBC haciendo clic en el botón "iniciar trámite" ubicado en la parte
      inferior derecha
  notes: Proporcionar un espacio a estudiantes egresados de media superior para continuar con sus estudios
