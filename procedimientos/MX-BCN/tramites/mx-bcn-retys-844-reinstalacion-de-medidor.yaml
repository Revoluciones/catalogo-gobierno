branch: ejecutivo
kind: tramite
title: Reinstalación de Medidor
summary: La CESPE proporciona este servicio para los usuarios que dieron de baja un medidor por distintas razones
  y que quieren volver a contar con el servicio de agua, deberán de haber transcurrido treinta días de la fecha
  de la baja para solicitar la reinstalación.
