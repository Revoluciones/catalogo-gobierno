scenarios:
- name: Propietario
  requirements:
  - text: Escrituras del predio o certificado de inscripción ante el registro público de la propiedad y del comercio
      expedido por el gobierno del estado no mayor a seis meses de antigüedad.
    cites:
    - source: retys
  - text: Deslinde catastral expedido por el ayuntamiento.
    cites:
    - source: retys
  - text: Nomenclatura oficial del predio expedida por el ayuntamiento.
    cites:
    - source: retys
  - text: En caso de vialidad con pavimento o concreto, presentar permiso expedido por el ayuntamiento para romperlo.
    cites:
    - source: retys
  - text: En caso de solicitar el servicio una persona distinta al propietario deberá exhibir adicionalmente carta
      poder para actos de dominio notariada
    cites:
    - source: retys
  - text: 'Identificación oficial cualquiera de las siguientes: credencial INE, licencia de conducir, matricula
      consular, cédula profesional, pasaporte mexicano. (documentos deben estar vigentes)'
    cites:
    - source: retys
  - text: Cubrir el total del presupuesto.
    cites:
    - source: retys
  - text: Presentar copia de los requisitos y original para cotejo.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la subdirección comercial.
    - Presentar su solicitud por escrito con los requisitos necesarios para la elaboración del contrato.
    - Recibir el presupuesto de instalación.
    - Cubrir el total del importe de su presupuesto
    - Realizar su contrato de agua residual tratada o sin tratar en planta.
  notes: Acreditar la propiedad
- name: Posesionario
  requirements:
  - text: Posesión expedida por el comisario ejidal o residencia expedida por el delegado municipal o concesión
      expedida ante CONAGUA, La Secretaría de Reforma Agraria o el Registro Agrario Nacional.
    cites:
    - source: retys
  - text: Croquis de localización.
    cites:
    - source: retys
  - text: 'Identificación oficial cualquiera de las siguientes: credencial federal electoral, licencia de conducir,
