- what: para_prevenir
  text: 'Tiempo que tiene el organismo para prevenir: 30 Días Hábiles'
  cites:
  - source: retys
positive_silence: false
requires_inspection: true
channels:
- presencial
offices:
- municipality: Tijuana
  name: CAP Oficinas Centrales
  address: 'Blvd. Federico Benítez #4057, Col. 20 de Noviembre, Tijuana, 22430'
scenarios:
- name: GENERAL
  requirements:
  - text: Original y copia de Solicitud de inspección y evaluación de redimensionamiento (FRM-017), debidamente
      llenado y firmado por el titular de la cuenta, lo proporciona CESPT o lo puede obtener en la página de Internet
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11985
  - text: Hacer el pago correspondiente
    cites:
    - source: retys
  - text: Las copias deben ser LEGIBLES y contener el DOCUMENTO COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la coordinación de control de calidad, ubicada en el edificio que se encuentra en la parte posterior
      izquierda de oficinas centrales de CESPT y presentar los requisitos.
    - Personal de la coordinación de Control de Calidad, revisa que los requisitos estén completos, de no ser así,
      informa a la persona solicitante que no es posible realizar el trámite hasta que se completen.
    - Con los requisitos completos, personal de la coordinación de Control de Calidad le proporciona una ficha de
      pago y el original y copia del solicitud de inspección y evaluación de redimensionamiento.
    - Con la ficha de pago pasar al área de cajas y hacer el pago correspondiente, la persona de cajas le entregará
      un recibo de pago.
    - Pasar al área de archivo, presentar el Recibo de Pago y entregar la Solicitud de inspección y evaluación de
      redimensionamiento.
    - La persona de archivo imprime una certificación de recibido, en donde se indica la fecha de respuesta, al
      original y copia de la solicitud de inspección y evaluación de redimensionamiento, y entrega la copia al usuario.
    - Una persona analista de la coordinación de Control de Calidad acude a la empresa o establecimiento realiza
      la inspección y evaluación de redimensionamiento.
    - Si en la inspección se detecta que se requiere una capacidad diferente, cespt emitirá un oficio de redimensionamiento
      de dispositivo(s), en el que se describirán de forma puntual las nuevas adecuaciones y sistemas de pretratamiento
      necesarias para el redimensionamiento; de lo contrario se deberán hacer las adecuaciones indicadas en el oficio
      con el que ya cuenta la empresa o establecimiento.
  notes: GENERAL
