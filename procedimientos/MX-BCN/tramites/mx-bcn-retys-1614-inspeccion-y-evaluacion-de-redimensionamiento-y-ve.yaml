level: estatal
branch: ejecutivo
kind: tramite
title: Inspección y Evaluación de Redimensionamiento y Verificación, para el Programa de Atrapa la Grasa y Sólidos
summary: Inspección para determinar si es posible el redimensionamiento de las instalaciones indicadas en el oficio
  de dimensionamiento de dispositivo(s), resultado de la inspección inicial, para obtener la constancia de cumplimiento
  al programa atrapa la grasa y sólidos.
authority:
  name: Comisión Estatal de Servicios Públicos de Tijuana
