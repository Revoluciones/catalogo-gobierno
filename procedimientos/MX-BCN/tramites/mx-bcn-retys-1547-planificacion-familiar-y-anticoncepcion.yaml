title: Planificación Familiar y Anticoncepción
summary: Proporcionar información, consejería, prescripción y aplicación de métodos anticonceptivos temporales y
  permanentes, con el propósito de que individuos o parejas disfruten de una vida sexual y reproductiva satisfactoria,
  saludable y sin riesgo, con absoluto respeto A sus derechos y A su libre decisión. Mujeres en edad fértil de 15
  a 49 años de edad y hombres de 20 a 64 años de edad.
