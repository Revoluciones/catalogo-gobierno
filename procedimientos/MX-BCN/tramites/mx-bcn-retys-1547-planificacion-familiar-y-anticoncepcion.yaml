scenarios:
- name: Métodos Anticonceptivos Permanentes
  requirements:
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la unidad de salud en el día y horario de atención indicado.
    - Recibir la atención para orientación-consejería por el médico del servicio de planificación familiar.
    - Integración del expediente clínico, orden de exámenes preoperatorios, elaboración de hoja de referencia y
      contrareferencia y programación de cirugía.
  notes: Brindar orientación y consejería a mujeres en edad fértil de los 15 A los 49 años y hombres de 20 a 64
    años de edad, que tengan paternidad satisfecha y solicitan un método definitivo ya sea la vasectomía sin bisturí
    o la oclusión tubaria bilateral.
- name: Métodos Anticonceptivos Temporales
  requirements:
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - Acudir a la unidad de salud en el día y horario de atención indicado o solicitar vía telefónica, redes sociales
      información sobre métodos anticonceptivos.
    - Recibir la atención para orientación-consejería por el médico del servicio de planificación familiar.
    - Integración del expediente clínico y recibir el método anticonceptivo de acuerdo a criterios médicos de elegibilidad.
    - Seguimiento de usuarios
  notes: Brindar orientación y consejería A mujeres en edad fértil de los 15 aq los 49 años y hombres de 20 a 64
    años de edad.
