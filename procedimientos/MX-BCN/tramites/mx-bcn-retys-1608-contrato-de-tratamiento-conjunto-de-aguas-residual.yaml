title: Contrato de Tratamiento Conjunto de Aguas Residuales y/o Reevaluación del Contrato
summary: Documento en el que se establecen las condiciones de tratamiento conjunto de aguas residuales por excedentes
  de la demanda bioquímica de oxígeno (DBO5), sólidos suspendidos totales (SST) y demanda química de oxígeno (DQO)
