  cites:
  - source: retys
- what: vigencia
  text: 1 año
  cites:
  - source: retys
positive_silence: false
requires_inspection: false
channels:
- presencial
offices:
- municipality: Tijuana
  name: CAP Oficinas Centrales
  address: 'Blvd. Federico Benítez #4057, Col. 20 de Noviembre, Tijuana, 22430'
scenarios:
- name: Primera vez - persona moral
  requirements:
  - text: 'Presentar carpeta con los requisitos, clasificados 8 secciones:'
    cites:
    - source: retys
  - text: Sección 1 .- Documentos de la empresa.
    cites:
    - source: retys
  - text: Original y copia del Solicitud de Contrato de Tratamiento Conjunto de aguas residuales para actividades
      industriales, comerciales y de servicios (FRM-007), debidamente llenado y firmado por el propietario o representante
      legal de la empresa
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11547
  - text: Copia certificada del Acta constitutiva de la empresa
    cites:
    - source: retys
  - text: Copia certificada del Poder legal para actos de administración, vigente, que acredite la personalidad
      del representante legal, en caso de no estar establecido en el Acta Constitutiva
    cites:
    - source: retys
  - text: 'Copia de identificación oficial con fotografía del representante legal: credencial INE , pasaporte mexicano,
      licencia de conducir o matrícula consular'
    cites:
    - source: retys
  - text: Copia de Cédula de Inscripción en el Registro Federal de Contribuyentes de la empresa
    cites:
    - source: retys
  - text: 'Los requisitos de las Secciones 2 a la 8 de la carpeta, los puede consultar en el documento: Tratamiento
      conjunto - Requisitos Personas Morales'
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11556
  - text: Pago de derechos correspondiente
    cites:
    - source: retys
  - text: Los muestreos y análisis deberán ser realizados por laboratorios acreditados ante la Entidad Mexicana
      de Acreditación, A.C.
    cites:
    - source: retys
  - text: Los informes de laboratorio deberán de haber sido expedidos en una fecha que no exceda los 6 meses previos
      del ingreso del trámite de Contrato de Tratamiento Conjunto de Aguas Residuales.
    cites:
    - source: retys
  - text: En caso de que haya cambiado el Representante Legal o cualquier otro dato registrado, anotar los datos
      actualizados en los campos correspondientes del Formulario para Solicitud de Contrato de Tratamiento Conjunto
      de Aguas Residuales y anexar copia de la identificación oficial con fotografía del nuevo representante legal,
      así como del poder legal certificado correspondiente.
    cites:
    - source: retys
  - text: Las copias deben ser legibles y contener el documento completo.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudda a la Coordinación de Servicios de Saneamiento, ubicada en el edificio que se encuentra en la parte
      posterior izquierda de Oficinas Centrales de CESPT y presentar la carpeta con los requisitos.
    - La persona de la Coordinación de Servicios de Saneamiento revisa que se cumpla con todos los requisitos, si
      no están completos, informa a la persona solicitante que no es posible realizar el trámite hasta que éstos
      se completen, indicándole que es lo que falta.
    - Con los requisitos completos, la persona de la Coordinación de Servicios de Saneamiento pone sello de revisado
      al original y copia del formulario Solicitud de Contrato de Tratamiento Conjunto de aguas residuales para
      actividades industriales, comerciales y de servicios (FRM-007) y los entrega al usuario junto con una Ficha
      de pago.
    - Acuda al área de Cajas con la Ficha de Pago y realizar el pago de derechos correspondiente, la persona de
      Cajas le entregará un Recibo de Pago.
    - Pasar al área de Archivo, presentar el Recibo de Pago y entregar original y copia del formulario Solicitud
      de Contrato de Tratamiento Conjunto de aguas residuales para actividades industriales, comerciales y de servicios
      (FRM-007)
    - La persona del área de Archivo certifica de recibido original y copia del formulario Solicitud de Contrato
      de Tratamiento Conjunto de aguas residuales para actividades industriales, comerciales y de servicios (FRM-007)
      y le entrega al solicitante la copia.
    - Posteriormente, la persona de la Coordinación de Servicios de Saneamiento contactará a la persona solicitante
      para que acuda a las oficinas a firmar el contrato y hacerle entrega del mismo.
  notes: Primera vez - persona moral
