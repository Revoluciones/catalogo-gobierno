  modes:
  - name: Presencial
    steps:
    - Ve a la Coordinación de Servicios de Saneamiento y presenta tus requisitos.
    - El personal revisará tus requisitos. Si falta algo, te dirán qué necesitas completar.
    - Si todo está en orden, te sellarán el original y la copia del formulario FRM-007 como revisado y te darán
      una ficha de pago.
    - Ve al área de Cajas con la ficha de pago y realiza el pago; te darán un recibo.
    - En el área de Archivo, entrega el recibo y presenta el formulario original y la copia del FRM-007; el personal
      certificará el formulario y te entregará una copia.
    - La Coordinación te contactará para que vayas a firmar el contrato y te hará la entrega del mismo.
  notes: Las copias deben ser legibles y contener el documento completo
