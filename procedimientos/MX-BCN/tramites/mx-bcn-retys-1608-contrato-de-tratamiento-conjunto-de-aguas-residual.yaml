who_can:
- Representante Legal
- Interesado
when: Cuándo requiera del servicio de tratamiento conjunto de aguas residuales
result: Contrato de Tratamiento Conjunto de Aguas Residuales
cost:
  type: variable
  amount_mxn: null
  text: 'COSTO VARIABLE: Recepción y evaluación de la documentación relativa a la firma del contrato de tratamiento
    conjunto de aguas residuales: $8,266.95 pesos Reevaluación anual de contrato de tratamiento conjunto de aguas
