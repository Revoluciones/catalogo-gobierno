summary: Que los gestores culturales, personal docente, creadores, técnicos, y público en general, reciban la capacitación
  para reflexionar, formular y desarrollar proyectos de gestión que conduzcan un impacto positivo en el campo cultural
  en sus distintos ámbitos y manifestaciones.
