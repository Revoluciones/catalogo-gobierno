scenarios:
- name: Ciudadanía en general
  requirements:
  - text: En caso de no pertenecer a los programas, se debe hacer una solicitud vía oficio a la jefatura de desarrollo
      nutricional del servicio orientación y educación alimentaria de las escuelas y/o dependencias que no forman
      parte del padrón de beneficiarios.
    cites:
    - source: retys
  - text: Cuando el beneficiario y/o usuario lo requiera, debe formar parte de los programas de asistencia social
      alimentario y desayunos escolares. de lo contrario, se evaluará para aplicar el servicio.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Brindar capacitaciones y/o sesiones de orientación y educación alimentaria a beneficiarios de los Programas
      de Atención Alimentaria durante entrega de apoyos
    - Si el beneficiario requiere una capacitación de orientación y educación alimentaria de un tema específico
      no brindado durante la entrega de los apoyos alimentarios, deberá realizar una solicitud.
    - Si el solicitante requiere una capacitación de orientación y educación alimentaria, no pertenece al padrón
      de beneficiarios, el servidor público analizará su petición y se dará prioridad a los beneficiarios de los
      Programas de Atención Alimentaria.
    - El servidor público se coordina con el beneficiario y/o solicitante para agendar la capacitación de orientación
      y educación alimentaria
    - El servidor público asiste y proporciona capacitación al beneficiario y/o solicitante del tema solicitado
      de orientación y educación alimentaria
    - El beneficiario y/o solicitante recibe la capacitación por parte del servidor público del tema solicitado
      de orientación y educación alimentaria
  notes: Recopilación de documentos para el servicio.
