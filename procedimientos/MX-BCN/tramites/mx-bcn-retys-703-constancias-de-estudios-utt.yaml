scenarios:
- name: Estudiantes
  requirements:
  - text: Proporcionar la matrícula de estudiante en caja de contabilidad
    cites:
    - source: retys
  - text: Realizar solicitud con recibo de pago en la Ventanilla de la Coordinación Operativa de Servicios Escolares
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - 'Accede al Botón de pago UTT: en https://boton.uttijuana.edu.mx/cliente'
    - Dar clic a Otros trámites y seleccionar el tipo de trámite (Constancia de estudios).
    - Ingresar los demás datos requeridos.
    - Realizar el pago en línea con tarjeta de débito.
    - Presentarse en las oficinas de atención de la UTT con el comprobante y la constancia de estudios para colocar
      el sello oficial de la institución.
  - name: Presencial
    steps:
    - Realizar el pago en la Caja de Pagos en Edificio de Rectoría con tarjeta de débito o de crédito.
    - Presentarse en las oficinas de atención de la UTT, según el plantel al que pertenece, para obtener la constancia
      de estudios.
