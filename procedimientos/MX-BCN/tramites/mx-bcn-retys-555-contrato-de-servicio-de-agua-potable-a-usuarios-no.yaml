scenarios:
- name: Propietario
  requirements:
  - text: Solicitud de servicio
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11835
  - text: Escrituras del predio o certificado de inscripción ante el registro público de la propiedad y del comercio,
      expedido por el gobierno del estado, no mayor a seis meses de antigüedad.
    cites:
    - source: retys
  - text: Deslinde catastral expedido por el ayuntamiento.
    cites:
    - source: retys
  - text: Nomenclatura oficial del predio expedida por el ayuntamiento.
    cites:
    - source: retys
  - text: En caso de vialidad con pavimento o concreto, presentar permiso expedido por el ayuntamiento para romperlo.
    cites:
    - source: retys
  - text: Dependiendo del giro mercantil o industrial para cuyo funcionamiento se requiera licencia oficial, deberá
      exhibirse ésta o una constancia de la oficina facultada para expedirla de que no hay inconveniente en que
      se proporcione el servicio de agua potable.
    cites:
    - source: retys
  - text: Necesidad de abasto del servicio de agua potable del comercio o empresa solicitante en m3 por mes.
    cites:
    - source: retys
  - text: Deberán garantizar por medio de depósito y antes de la instalación de la toma de agua, el importe del
      aparato medidor y de las cuotas por servicio de agua correspondientes a tres meses, para cuyo efecto se aplicará
      la tarifa que establece la ley de ingresos del estado vigente.
    cites:
    - source: retys
  - text: En caso de solicitar el servicio una persona distinta al propietario, deberá exhibir carta poder para
      actos de dominio notariada o acta constitutiva.
    cites:
    - source: retys
  - text: 'Presentar una identificación oficial: INE, licencia de conducir, matricula consular, cédula profesional
      o pasaporte mexicano (vigentes).'
    cites:
    - source: retys
  - text: Cubrir el total del costo del servicio o pagar mínimo el 50% como anticipo, para acceder a convenir el
      resto.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al área de atención a usuarios de la zona comercial correspondiente
    - Presentar los documentos requeridos y copias para cotejar
    - Presentar su solicitud de servicios con los requisitos necesarios.
    - Recibir el presupuesto de instalación
    - Cubrir el total o convenir el importe de su presupuesto.
    - Realizar su contrato de servicio de agua potable
    - Recibir su orden de instalación.
  notes: Acreditar la propiedad
- name: Posesionario
  requirements:
  - text: Solicitud de servicio
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11843
  - text: Posesión expedida por el comisario ejidal o residencia expedida por el delegado municipal o concesión
      expedida ante CONAGUA, La Secretaría de Reforma Agraria o el Registro Agrario Nacional.
    cites:
    - source: retys
  - text: Croquis de localización.
    cites:
    - source: retys
  - text: En caso de vialidad con pavimento o concreto, presentar permiso expedido por el ayuntamiento para romperlo.
    cites:
    - source: retys
  - text: Dependiendo del giro mercantil o industrial para cuyo funcionamiento se requiera licencia oficial, deberá
      exhibirse ésta o una constancia de la oficina facultada para expedirla de que no hay inconveniente en que
      se proporcione el servicio de agua.
    cites:
    - source: retys
  - text: 'Presentar una identificación oficial: credencial federal electoral, licencia de conducir, matricula consular,
      cédula profesional o pasaporte mexicano (vigentes).'
    cites:
    - source: retys
  - text: Necesidad de abasto del servicio de agua potable de la empresa solicitante.
    cites:
    - source: retys
  - text: Deberán garantizar por medio de depósito y antes de la instalación de la toma de agua, el importe del
      aparato medidor y de las cuotas por servicio de agua correspondientes a tres meses, para cuyo efecto se aplicará
      la tarifa que establece la ley de ingresos del estado.
    cites:
    - source: retys
  - text: Cubrir el total del costo del servicio o pagar mínimo el 50% como anticipo, para acceder a convenir el
      resto.
    cites:
    - source: retys
  - text: Copia de los requisitos y original para cotejar.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al área de atención a usuarios de la zona comercial correspondiente
    - Presentar su solicitud de servicios con copias de los requisitos y originales para cotejar.
    - Recibir el presupuesto de instalación
    - Cubrir el total o convenir el importe de su presupuesto.
    - Realizar su contrato de servicio de agua potable
    - Recibir su orden de instalación
