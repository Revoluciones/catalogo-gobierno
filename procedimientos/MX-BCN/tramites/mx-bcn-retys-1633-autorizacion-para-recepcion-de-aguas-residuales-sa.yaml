scenarios:
- name: Primera vez - Personas Morales
  requirements:
  - text: Original y copia del formulario Solicitud de recepción de aguas residuales sanitarias domésticas y no
      domésticas (FRM-020), debidamente llenado y firmado por el propietario o representante legal de la empresa.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12022
  - text: Copia certificada del Acta constitutiva de la empresa
    cites:
    - source: retys
  - text: Copia certificada del Poder legal para actos de administración, vigente, que acredite la personalidad
      del representante legal, en caso de NO ESTAR ESTABLECIDO en el Acta Constitutiva
    cites:
    - source: retys
  - text: 'Copia de identificación oficial con fotografía, VIGENTE, del representante legal, puede ser UNO de los
      siguientes: Credencial del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Copia de Cédula de Inscripción en el Registro Federal de Contribuyentes de la empresa
    cites:
    - source: retys
  - text: Hacer el pago correspondiente
    cites:
    - source: retys
  - text: Las copias deben ser LEGIBLES y contener el DOCUMENTO COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la Coordinación de Servicios de Saneamiento, ubicada en el edificio que se encuentra en la parte
      posterior izquierda de Oficinas Centrales de CESPT y presentar los requisitos.
    - Personal de la Coordinación de Servicios de Saneamiento revisa que se cumpla con todos los requisitos, si
      no están completos, informa al ciudadano que no es posible realizar el trámite hasta que éstos se completen,
      indicándole que es lo que falta.
    - Con los requisitos completos, personal de la Coordinación de Servicios de Saneamiento, sellará y firmará de
      validación el original y copia del formulario Solicitud de recepción de aguas residuales sanitarias domésticas
      y no domésticas (FRM-020), la cual entregará al solicitante.
    - Personal de la Coordinación de Servicios de Saneamiento, elaborará la Ficha de pago, la cual entregará al
      solicitante para que realice el pago correspondiente en cajas.
    - Acudir al área de cajas con la Ficha de pago y hacer el pago correspondiente, la persona de Cajas le entregará
      un Recibo de Pago.
    - Pasar al área de Archivo, presentar el Recibo de pago y entregar original y copia del formulario Solicitud
      de recepción de aguas residuales sanitarias domésticas y no domésticas (FRM-020).
    - La persona del área de Archivo certifica de recibido original y copia del Solicitud de recepción de aguas
      residuales sanitarias domésticas y no domésticas (FRM-020), y le entrega al solicitante la copia.
    - Posteriormente, la persona de la Coordinación de Servicios de Saneamiento contactará a la persona solicitante
      para que acuda a las oficinas a firmar el contrato y hacerle entrega del mismo.
  notes: Primera vez - Personas Morales
- name: Primera vez - Personas Físicas
  requirements:
