scenarios:
- name: Persona Física
  requirements:
  - text: Escrito libre, con firma autógrafa de la persona interesada o de su apoderado o representante legal y
      del técnico que elaboró la Manifestación de Impacto Ambiental, Modalidad Planes y Programas, en el que se
      señale claramente el trámite solicitado, debiendo indicar domicilio, teléfono y correo electrónico para oír
      y recibir notificaciones.
    cites:
    - source: retys
  - text: Deberá presentar la información señalada en la Guía para presentar la Manifestación de Impacto Ambiental,
      Modalidad Planes y Programas.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/13054
  - text: Recibo de pago de derechos.
    cites:
    - source: retys
  - text: Resumen ejecutivo.
    cites:
    - source: retys
  - text: Copia simple de la identificación oficial de la persona interesada, legible y con vigencia activa.
    cites:
    - source: retys
  - text: En caso de que se actúe a través de apoderado o representante legal, presentar documental idónea, completa
      y nítida, mediante la cual se acredite como tal, vigente.
    cites:
    - source: retys
  - text: En caso de que se actúe a través de apoderado o representante legal, presentar copia simple de la identificación
      oficial de este, nítida y con vigencia activa.
    cites:
    - source: retys
  - text: Copia simple del Registro Federal de Contribuyentes de la persona interesada.
    cites:
    - source: retys
  - text: CD o USB que contenga la totalidad de la información presentada en la Manifestación de Impacto Ambiental,
      Modalidad Planes y Programas.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas de la Secretaría para presentar el trámite.
    - Recepción y evaluación de la solicitud.
    - Publicación de la resolución o solicitud de información adicional.
    - Recolectar el oficio y, en su caso, solventar los requerimientos de información.
  notes: Persona que pretende realizar un plan o programa que requiere ser evaluado en materia de impacto ambiental.
