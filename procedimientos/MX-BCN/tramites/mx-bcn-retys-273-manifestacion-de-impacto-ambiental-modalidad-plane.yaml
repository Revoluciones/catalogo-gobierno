kind: tramite
title: Manifestación de Impacto Ambiental, Modalidad Planes y Programas
summary: Documento mediante el cual se evalúa la viabilidad ambiental de los planes y programas regionales, estatales
  y municipales, en materia de desarrollo urbano, turístico, de vivienda, agropecuarios, sectoriales de industria,
  de centros de población, así como aquellos que en general promueven las actividades económicas o prevean el aprovechamiento
  masivo de los recursos naturales del Estado, asegurando el cumplimiento de la normativa vigente.
