scenarios:
- name: Ciudadanos en general
  requirements:
  - text: Cita
    cites:
    - source: retys
  - text: Presentar en original y copia la licencia vencida o por vencer (90 días antes), y en caso de extravío
      una identificación oficial con fotografía vigente (INE, pasaporte mexicano vigente, cédula profesional, matrícula
      consular, cartilla militar ).
    cites:
    - source: retys
  - text: En caso de cambio de domicilio, presentar en original y copia comprobante de domicilio actual.
    cites:
    - source: retys
  - text: Presentar en original y copia certificado médico, expedido por institución pública o privada de salud
      (aplica para personas de 60 años en adelante).
    cites:
    - source: retys
  - text: 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito
      (excepto tarjetas American Express )'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Haz tu cita en https://citas.ebajacalifornia.gob.mx/
    - Acudir a las oficinas de Recaudación de Rentas del Estado con previa cita (agendar cita en el portal)
    - Pasa a módulo de captura de datos
    - Captura y confirma datos
    - Pasa a cajas para realizar el pago correspondiente
    - Pasa al módulo de entrega de licencias a recoger su licencia de conducir
    - Revisa y confirma que los datos son correctos, firmar el documento una vez que válida los datos
  notes: Requisitos para obtener la revalidación de licencia de conducir
- name: Licencias de conducir para choferes.
  requirements:
  - text: Cita
    cites:
    - source: retys
  - text: Presentar en original y copia la licencia vencida o por vencer (90 días antes), y en caso de extravío
      una identificación oficial con fotografía vigente (INE, pasaporte mexicano vigente, cédula profesional, matrícula
      consular, cartilla militar ).
    cites:
    - source: retys
  - text: En caso de cambio de domicilio, presentar en original y copia comprobante (no mayor a tres meses de antigúedad)
      de domicilio actual
    cites:
    - source: retys
  - text: Presentar en original y copia certificado médico, expedido por institución pública o privada de salud.
    cites:
    - source: retys
  - text: Acreditar no haber sido condenado por sentencia ejecutoriada por manejar vehículo de motor en estado de
      ebriedad o bajo el influjo de drogas o enervantes en los últimos cinco años
    cites:
    - source: retys
  - text: Presentar examen antidoping
    cites:
    - source: retys
  - text: 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito
      (excepto tarjetas American Express )'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Haz tu cita en https://citas.ebajacalifornia.gob.mx/
    - Acudir a las oficinas de Recaudación de Rentas del Estado con previa cita (agendar cita en el portal)
    - Pasa a módulo de captura de datos
    - Captura y confirma datos
    - Pasa a cajas para realizar el pago correspondiente
    - Pasa al módulo de entrega de licencias a recoger su licencia de conducir
    - Revisa y confirma que los datos son correctos, firmar el documento una vez que válida los datos
  notes: Revalidación de licencias de conducir para choferes.
