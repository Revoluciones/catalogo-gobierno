scenarios:
- name: Atención a la violación sexual
  requirements:
  - text: Identificación oficial
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El usuario o usaría deberá acudir a la unidad hospitalaria más cercana.
    - Administración de medicamentos para evitar infecciones de transmisión sexual, vih/sida o un embarazo no deseado.
    - Seguimiento Médico y Psicológico
  notes: Brindar atención médica de profilaxis ante una violación sexual con acompañamiento psicológico
- name: Servicio de interrupción voluntario del embarazo por violación sexual
  requirements:
  - text: Identificación oficial
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El o la usuaria deberá acudir a la unidad hospitalaria más cercana.
    - Administración de medicamentos para evitar infecciones de transmisión sexual, VIH/Sida o un embarazo no deseado
    - Seguimiento Médico y Psicológico
  notes: Brindar servicio médico de aborto legal
