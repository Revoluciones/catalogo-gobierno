title: Prevención y Atención de la Violencia Familiar y de Género
summary: Atender los casos de violencia en mujeres, niños y niñas, de manera oportuna, proporcionando atención médica
  y psicológica independientemente de su complejidad con la finalidad de reducir la prevalencia y severidad de los
  daños a la salud por esta causa.
