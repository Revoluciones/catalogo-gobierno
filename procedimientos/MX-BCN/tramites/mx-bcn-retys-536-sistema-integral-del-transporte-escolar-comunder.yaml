title: Sistema Integral del Transporte Escolar (COMUNDER)
summary: Se beneficia a las y los jóvenes estudiantes de nivel Media Superior y Superior que residan en zonas alejadas,
  brindándole un servicio de trasporte escolar, el cuál garantiza movilidad digna, gratuita y segura a sus diferentes
  centros educativos en el estado dando las herramientas necesarias para que las juventudes continúen con sus estudios.
  .
