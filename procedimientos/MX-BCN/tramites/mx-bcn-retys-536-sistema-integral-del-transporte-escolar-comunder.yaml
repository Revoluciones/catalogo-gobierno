scenarios:
- name: Jóvenes
  requirements:
  - text: Copia de Comprobante de domicilio de residencia no mayor a 3 meses
    cites:
    - source: retys
  - text: 'Imprimir comprobante de estudios vigente puede ser lo siguiente: constancia, credencial de estudiante,
      comprobante de pago o inscripción, boleta de calificaciones)'
    cites:
    - source: retys
  - text: 'Copia legible de la Identificación oficial con fotografía vigente puede ser cualquiera de los siguientes
      documentos: credencial de elector INE, pasaporte mexicano o licencia de conducir (de padre, madre o tutor
      en caso de ser menor de edad)'
    cites:
    - source: retys
  - text: Copia legible del CURP
    cites:
    - source: retys
  - text: En caso de ser menor de edad imprimir carta de exoneración/en caso de ser mayor de edad carta de exoneracion
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12719
  - text: Imprimir formato de aviso de privacidad (se optiene en la página de registro y/o de la página RETyS)
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12720
  - text: Imprimir formato de estudio socioeconómico (se obtiene en la pagina del registro y/o de la pagina RETyS)
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12723
  - text: Imprimir carta de obligaciones (se obtiene en la página del registro y/o de la pagina RETyS)
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12725
  - text: Imprimir solicitud de inscripción al programa (se obtiene en la página del registro y/o de la página RETyS)
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12726
  modes:
  - name: Mixto
    steps:
    - Atender la inscripción en línea
    - Llenar y entregar documentación requerida en oficina central del INJUVE y oficinas del SITE
    - El calendario de visita se les notificará a través de las redes sociales y la página de juventudbc
    - Acudir a las jornadas de recepción de documentos en los centros educativos o acudir a las oficinas de INJUVE
      del departamento correspondiente cuando se establezca el calendario de visita
    - Al momento de quedar seleccionado se otorga una credencial electrónica
  notes: Jóvenes
