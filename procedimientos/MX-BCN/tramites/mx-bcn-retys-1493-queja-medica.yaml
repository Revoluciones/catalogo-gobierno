scenarios:
- name: Queja Médica
  requirements:
  - text: Identificación oficial, si el asunto lo amerita poder simple para representación.
    cites:
    - source: retys
  - text: Escrito describiendo los hechos de los cuales se queja, así como la pretensión. Se adjunta la información
      que debe de contener el escrito.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11847
  - text: Mostrar pruebas de la relación médico paciente a través de los documentos que se posee, presentar en original
      y copia
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Recibida la queja se registrará y se le asignará un numero de expediente.
    - La admisión de la queja se decidirá dentro de los tres días siguientes.
    - Si la queja está incompleta, imprecisa, confusa o ambigua la Comisión pedirá por escrito a la persona quejosa
      que la complete en un plazo de no mayor de 10 dias desde la notificación.
    - Recibida la aclaración solicitada, la Comisión tendrá por admitida la queja y procederá a la notificación
      a la persona quejosa y la persona prestadora de servicio de salud.
    - Si el quejoso no desahogara la aclaración en los términos del párrafo anterior se tendrá por concluido el
      asunto, mandándose el expediente al archivo general.
    - Una vez admitida la queja dentro de un plazo no mayor a 5 días la Comisión notificará a la persona prestadora
      de servicio de salud el nombre del quejoso y el resumen del motivo de la queja.
    - Se celebra audiencia de conciliación en fecha y hora programada.
  notes: Reclamo formal que la persona presenta cuando no está satisfecha con la atención médica recibida.
