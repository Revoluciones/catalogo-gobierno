title: Queja Médica
summary: Solicitud formal que la persona presenta cuando considera que ha recibido una atención médica inadecuada
  o ha sufrido una irregularidad en la prestación de un servicio de salud.
authority:
  name: Comisión de Arbitraje Medico del Estado de Baja California
