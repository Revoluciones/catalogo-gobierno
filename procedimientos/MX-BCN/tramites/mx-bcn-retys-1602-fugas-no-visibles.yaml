  text: 'Tiempo que tiene el organismo para prevenir: 2 Días Hábiles'
  cites:
  - source: retys
positive_silence: false
requires_inspection: true
channels:
- presencial
offices:
- municipality: Tijuana
  name: CAP Oficinas Centrales
  address: 'Blvd. Federico Benítez #4057, Col. 20 de Noviembre, Tijuana, 22430'
- municipality: Playas de Rosarito
  name: CAP Rosarito Floresta del Mar
  address: 'Blvd. Benito Juárez #385, Fracc. Hacienda Floresta del Mar, Playas de Rosarito, 22703'
scenarios:
- name: Propietario
  requirements:
  - text: Solicitud de Servicio de Inspección de Fugas No Visibles, la cual es generada en el Módulo de Atención
      Personalizada
    cites:
    - source: retys
  - text: Formulario para Trámites en Archivo (FRM-005), debidamente llenado y firmado por el titular de la cuenta.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11405
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio, UNO de los siguientes: Credencial
      del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Pago de derechos correspondiente
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en ORIGINAL Y COPIA, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público (CAP) de Oficinas Centrales o al CAP Rosarito Floresta del Mar.
    - Pasar al Módulo de Atención Personalizada (MAP) y esperar su turno.
    - Cuando sea su turno, la persona del MAP revisará que se cumpla con todos los requisitos, si no están completos,
      informa al ciudadano que no es posible realizar el trámite hasta que éstos se completen, indicándole que es
      lo que falta.
    - Con los requisitos completos, la persona del MAP generará una Solicitud de Servicios para Inspección de Fuga
      No Visible y le proporcionará el número de folio con un plazo de atención para la ejecución del servicio.
    - Pasar a las cajas a realizar el pago del servicio, de no ser así éste se cargará en su siguiente factura.
    - Una vez realizado el pago pasar al Área de Archivo General y solicitar el Formulario para Trámites en Archivo
      para Inspección de Fuga No Visible y llenarlo.
    - Una vez llenado el Formulario para Trámites en Archivo, entregarlo a la persona de Archivo y anexar la Solicitud
      de Servicios para Inspección de Fuga No Visible generada anteriormente por el Módulo de Atención Personalizada.
    - La persona de Archivo recibe la documentación y le regresa copia del Formulario para Trámites en Archivo con
      sello de certificación.
    - De acuerdo a la fecha programada en el plazo de atención, una brigada de CESPT acudirá al domicilio indicado,
      para verificar si existe una fuga no visible.
    - Para la respuesta de la inspección el usuario deberá marcar al 073 y proporcionar el número de solicitud para
      que le informen el dictamen final.
  notes: Propietario
- name: Representante
  requirements:
  - text: Solicitud de Servicio de Inspección de Fugas No Visibles, la cual es generada en el Módulo de Atención
      Personalizada.
    cites:
    - source: retys
  - text: Formulario para Trámites en Archivo, (lo proporciona CESPT o lo puede obtener en la página de Internet
      FRM-005), debidamente llenado y firmado por el titular de la cuenta o por la persona a quien éste le haya
      otorgado el poder para realizar el trámite.
    cites:
    - source: retys
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el propietario del predio,
      puede ser UNO de los siguientes: Poder Notarial; Carta poder ante notario público, corredor público o fedatario
      público; Carta Poder simple firmada por el propietario del predio y por dos testigos, que incluya copia de
      las identificaciones oficiales de los testigos, cuya antigüedad no exceda los seis meses.'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial del INE,
      Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Pago de derechos correspondiente
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en ORIGINAL Y COPIA, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
