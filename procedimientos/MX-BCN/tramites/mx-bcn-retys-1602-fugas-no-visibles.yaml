  type: variable
  amount_mxn: null
  text: 'COSTO VARIABLE: Residencial y comercial $1,293.23 pesos Fraccionamientos, solicitadas por desarrolladores
    de vivienda $1,780.34 pesos, más $2.00 pesos por metro lineal inspeccionado. Hoteles, solicitados por los usuarios
    de dicho servicio $4,897.83 pesos Noviembre 2026'
  as_of: '2026-11-06'
  cites:
  - source: retys
