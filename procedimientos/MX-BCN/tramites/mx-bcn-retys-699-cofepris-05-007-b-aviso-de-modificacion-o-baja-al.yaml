title: COFEPRIS-05-007-B Aviso de Modificación o Baja al Aviso de Funcionamiento y/o Responsable Sanitario del Establecimiento
  de Insumos para la Salud. Modalidad B.- Almacén de Depósito y/o Distribución de Dispositivos Médicos o Remedios
  Herbolarios o Medicamentos No Controlados o Materia Prima para Medicamentos No Controlados
summary: Cuando el ciudadano haya realizado algún cambio en el establecimiento dedicado al almacenamiento y/o distribución
  de dispositivos médicos o remedios herbolarios o medicamentos no controlados o materia prima para medicamentos
  no controlados.
authority:
  name: Comisión Estatal para la Protección contra Riesgos Sanitarios
