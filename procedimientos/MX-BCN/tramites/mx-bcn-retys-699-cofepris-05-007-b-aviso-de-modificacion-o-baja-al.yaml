who_can:
- Representante Legal
- Interesado
- Otro
when: Se encuentra en proceso de apertura operación o proceso modificacion o de cierre
result: Aviso de modificacion o baja y/o responsable sanitario
cost:
  type: gratuito
  amount_mxn: null
  text: SIN COSTO
  as_of: '2026-11-06'
  cites:
  - source: retys
