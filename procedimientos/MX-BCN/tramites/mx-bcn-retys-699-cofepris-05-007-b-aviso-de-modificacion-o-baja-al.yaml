- what: respuesta_autoridad
  text: 'Tiempo que tiene el organismo para resolver: 1 Días Hábiles'
  cites:
  - source: retys
positive_silence: false
requires_inspection: false
channels:
- en_linea
offices:
- municipality: Mexicali
  name: Centro Integral de Servicios
  address: 'Calzada milton castellanos #1499, Conjunto urbano caliss, Mexicali, 22010'
scenarios:
- name: Ciudadania en general
  requirements:
  - text: Original y copia simple legible del formato “Aviso de funcionamiento, de responsable sanitario y de modificación
      o baja”, debidamente requisitado
    cites:
    - source: retys
  - text: Copia legible de identificación oficial del propietario (credencial del instituto nacional electoral (INE)
      o pasaporte vigente o cartilla del servicio militar nacional o licencia de manejo)
    cites:
    - source: retys
  - text: 'Para cambio de persona autorizada: copia legible de identificación oficial con fotografía de la(s) persona(s)
      autorizada(s) (credencial del instituto nacional electoral (INE) o pasaporte vigente o cartilla del servicio
      militar nacional o licencia de manejo)'
    cites:
    - source: retys
  - text: 'En caso de persona moral: original y copia legible del acta constitutiva y/o poder otorgado ante notario
      o corredor público de (los) representante (s) legal (es) (artículo 15, ley federal de procedimiento administrativo),
      copia legible de identificación oficial del representante legal. (credencial del instituto nacional electoral
      (ine) o pasaporte vigente o cartilla del servicio militar nacional o licencia de manejo)'
    cites:
    - source: retys
  - text: 'Para cambio de responsable sanitario: no se requiere documentación anexa'
    cites:
    - source: retys
  - text: 'Para baja de responsable sanitario: aviso de responsable original'
    cites:
    - source: retys
  - text: 'Para suspensión de actividades, reinicio de actividades y baja definitiva del establecimiento: no se
      requiere documentación anexa'
    cites:
    - source: retys
  - text: Copia legible de identificación oficial de personas autorizadas (credencial del instituto nacional electoral
      (INE) o pasaporte vigente o cartilla del servicio militar nacional o licencia de manejo)
    cites:
    - source: retys
  - text: 'Para el caso de instituciones públicas adjuntar la documentación conforme a lo siguiente: documento que
      acredite la personalidad juridica del representante legal de la institución (que indique sus atribuciones
      y facultades)'
    cites:
    - source: retys
  - text: 'Para el caso de instituciones públicas adjuntar la documentación conforme a lo siguiente: copia legible
      del nombramiento o gaceta o reglamento interno de la institución que representa'
    cites:
    - source: retys
  - text: 'Para el caso de instituciones públicas adjuntar la documentación conforme a lo siguiente: copia legible
      de identificación oficial del representante legal (credencial del instituto nacional electoral (INE) o pasaporte
      vigente o cartilla del servicio militar nacional o licencia de manejo)'
    cites:
    - source: retys
  - text: 'Para el caso de instituciones públicas adjuntar la documentación conforme a lo siguiente: copia legible
      de identificación oficial de personas autorizadas (credencial del instituto nacional electoral (INE) o pasaporte
      vigente o cartilla del servicio militar nacional o licencia de manejo)'
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Ingresar a la liga de la plataforma de DIGIPRIS haciendo clic en el botón "Iniciar Trámite" ubicado en la
      parte inferior derecha
    - Elegir la modalidad del trámite de interés
    - Llenar formato requerido
    - Firmar resolución de trámite enviado vía correo
  notes: Establecimientos sujetos a regulación sanitaria
