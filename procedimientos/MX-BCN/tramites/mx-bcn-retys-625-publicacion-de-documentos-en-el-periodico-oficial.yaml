title: Publicación de Documentos en el Periódico Oficial del Estado
summary: Publicar en el Periódico Oficial del Estado los documentos de carácter oficial que remiten las dependencias,
  entidades paraestatales u organismos de los distintos ámbitos de gobierno, así como de los particulares que lo
  soliciten.
