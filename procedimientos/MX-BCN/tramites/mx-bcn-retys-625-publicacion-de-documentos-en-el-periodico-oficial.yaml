scenarios:
- name: Ciudadano
  requirements:
  - text: Solicitud de publicación y documento a publicar, en original
    cites:
    - source: retys
  - text: Recibo de pago de la oficina de Recaudación de Rentas del Estado en copia
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la coordinación del Periódico Oficial del Estado en Mexicali y/o encargado en delegación, con solicitud
      de publicación para revisión de documentación a publicar y entrega de pre-recibo de pago por parte de la coordinación
      del Periódico Oficial del Estado en Mexicali y/o encargado en delegación. (Sector público en sus diferentes
      ámbitos - Federal, Estatal o Municipal y Particulares)
    - Realizar el pago correspondiente en la oficina de Recaudación de Rentas del Estado. (Sector público en sus
      diferentes ámbitos – Federal, Estatal o Municipal y Particulares)
    - Enviar oficio a la Secretaría General de Gobierno, para autorización de publicación, acompañado de solicitud
      y documento a publicar, ambos en original y copia. (Sector público en sus diferentes ámbitos - Federal, Estatal
      o Municipal y Particulares)
  notes: Ciudadano
