summary: La persona interesada podrá solicitar, por sí mismo o a través de su representante, de manera directa o
  por medios electrónicos, solicitud de acceso a la información pública y/o derecho de Acceso, Rectificación, Cancelación
  u Oposición (ARCO) de sus datos personales, que se encuentren en posesión de este Instituto de Movilidad Sustentable.
