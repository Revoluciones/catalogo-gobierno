scenarios:
- name: Arbitraje Médico
  requirements:
  - text: Presentar identificación oficial
    cites:
    - source: retys
  - text: Carta de aceptación firmada por la persona quejosa y la persona prestadora de servicio de salud.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a audiencia de conciliación sin que se logre acuerdo, con identificación oficial
    - Aceptar el arbitraje y firmar el compromiso arbitral
    - Esperar a que la persona Titular de la Comisión apruebe el arbitraje
    - Después de que se acepta comienza un periodo en el que se pueden presentar mas pruebas y se pueden dar mas
      argumentos
    - Hay que esperar un tiempo para que los peritos expertos den su opinión o dictamen
    - Una vez que se recibe la opinión de los expertos, un consejo ciudadano vota si hay responsabilidad o no.
    - Finalmente la persona Comisionada emite la decisión final (laudo) que resuelve la queja
  notes: Es un proceso para resolver problemas entre pacientes y proveedores de servicios de salud de manera justa
    y rápida sin tener que ir a los juzgados
