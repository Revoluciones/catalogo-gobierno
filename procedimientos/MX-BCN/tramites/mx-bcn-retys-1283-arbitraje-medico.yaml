title: Arbitraje Médico
summary: Es un proceso donde una persona que ha tenido un problema con la atención médica que recibió puede resolver
  su conflicto sin tener que ir a juicio. Este proceso inicia después de no haberse logrado la conciliación, en
  el, un árbitro neutral escucha a la persona quejosa y a la persona prestadora de servicio de salud y toma una
  decisión basada en la evidencia presentada.
