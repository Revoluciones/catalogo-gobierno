scenarios:
- name: Ciudadanía en general
  requirements:
  - text: Formato “Servicios de Salud”, debidamente requisitado y en caso de requerir acuse deberá presentar copia
      simple legible del mismo
    cites:
    - source: retys
  - text: 'Para actualización o cambio de representante legal Para Persona moral: » Original y copia legible del
      acta constitutiva o poder notarial que acredite al representante legal » Copia legible de identificación oficial
      del representante legal (Credencial del Instituto Nacional Electoral (INE) o pasaporte vigente o cartilla
      del servicio militar nacional o licencia de manejo) Para Persona física: » Copia legible de identificación
      oficial del representante legal (INE, pasaporte vigente o licencia de manejo) Para el caso de Instituciones
      públicas adjuntar la documentación conforme a lo siguiente: » Documento que acredite la personalidad jurídica
      del Representante Legal de la institución (que'
    cites:
    - source: retys
  - text: Para actualización o cambio de personas autorizadas » Copia legible de identificación oficial de personas
      autorizadas (Credencial del Instituto Nacional Electoral (INE) o pasaporte vigente o cartilla del servicio
      militar nacional o licencia de manejo)
    cites:
    - source: retys
  - text: Para cambio de domicilio del propietario (domicilio fiscal) » Documentación que avale el cambio de domicilio
    cites:
    - source: retys
  - text: Para baja » Original de la licencia sanitaria o en su caso Acta Ministerial original del robo o extravío
      de la misma.
    cites:
    - source: retys
