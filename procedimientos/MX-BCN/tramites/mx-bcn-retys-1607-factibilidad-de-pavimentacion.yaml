inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Factibilidad de Pavimentación
summary: Solicitud de dictamen técnico, mediante el cual se describe el estado físico de las redes de agua potable
  y alcantarillado sanitario, así como la ubicación de líneas de agua, pozos de visita, registros y tapas de válvulas,
  con el fin de proceder a la pavimentación de la calle correspondiente.
