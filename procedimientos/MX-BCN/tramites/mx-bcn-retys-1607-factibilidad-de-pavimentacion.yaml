- municipality: Playas de Rosarito
  name: CAP Rosarito Floresta del Mar
  address: 'Blvd. Benito Juárez #385, Fracc. Hacienda Floresta del Mar, Playas de Rosarito, 22703'
scenarios:
- name: General
  requirements:
  - text: Original y copia de escrito dirigido al director general de CESPT, debidamente firmado por Dependencias
      o Delegaciones, en el cual solicita se dictamine de la factibilidad de pavimentación para una vialidad o un
      conjunto de vialidades.
    cites:
    - source: retys
  - text: Croquis de localización en el cual indique las vialidades o los tramos de ellas que se pretende pavimentar,
      así como la colonia correspondiente de cada una de ellas
    cites:
    - source: retys
  - text: Las copias deben ser legibles y contener el documento completo
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público (CAP) de Oficinas Centrales o al CAP Rosarito Floresta del Mar
    - Pasar al área de Archivo y explicar a la persona encargada el trámite que quiere realizar y entregar los requisitos
    - La persona de Archivo revisa que los requisitos estén completos, de no ser así, informa a la persona solicitante
      que no es posible realizar el trámite hasta que éstos se completen
    - Con los requisitos completos, la persona de Archivo certifica original y copia de la petición, en el que se
      indica el plazo de atención para la respuesta a su trámite
    - Cumplido el plazo de atención la persona solicitante debe acudir nuevamente al área de Archivo por el documento
      de Factibilidad de Pavimentación resultante
  notes: General
