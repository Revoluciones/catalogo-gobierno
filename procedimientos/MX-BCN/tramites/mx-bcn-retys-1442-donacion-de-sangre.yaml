scenarios:
- name: Donación Voluntaria
  requirements:
  - text: Que sea mayor de edad.
    cites:
    - source: retys
  - text: Identificación oficial.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Se presenta el donador con el servidor público con identificación oficial, refiriendo que es donador altruista.
    - Una vez identificado que es donador altruista, se entrega el formato para su ficha de identificación.
    - La persona pasa a toma de signos vitales por el servidor público.
    - Pasa a entrevista médica.
    - Pasa a toma de muestras de laboratorio.
    - Si la entrevista, los signos vitales y resultados de laboratorio son aceptables, pasa al área de sangrado
      a realizar la donación.
    - Proporciona al ciudadano alimentos y líquido, se le extiende comprobante de donación, así como instrucciones
      para pasar por resultados de laboratorio y se le invita a realizar donación de sangre nuevamente en dos meses.
  notes: Al donador altruista o voluntario se le da prioridad en atención con respecto al donador familiar o de
    reposición, con base a que el donador altruista o voluntario pone a disposición su sangre para cualquier paciente
    que la requiera.
