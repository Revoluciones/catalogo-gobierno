scenarios:
- name: Permisionarios y concesionarios del servicio público
  requirements:
  - text: Formato de solicitud original, debidamente firmado por el permisionario, completando todos los campos
      que sean requeridos.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14760
  - text: Copia de permiso vigente para prestar el servicio público de alquiler en la modalidad correspondiente
      del solicitante del sitio
    cites:
    - source: retys
  - text: Copia de identificación oficial vigente del solicitante
    cites:
    - source: retys
  - text: En caso de ser persona fisica el solicitante, debera presentar anuencia de conformidad de cada uno de
      los permisionarios integrantes del padrón vehicular ( se anexa formato a la solicitud )
    cites:
    - source: retys
  - text: Acta constitutiva de la persona moral acreditando su personalidad con poder notarial y presentar copia
      de identificación oficial del representante legal (para base de radio taxi)
    cites:
    - source: retys
  - text: Acta constitutiva de la persona moral acreditando su personalidad con poder notarial y presentar copia
      de identificación oficial del representante legal (para personas morales)
    cites:
    - source: retys
  - text: Croquis de localización legible, si el sitio esta ubicado en via publica deberá indicar la dirección completa
      y calles colindantes, si se ubica en propiedad privada deberá indicar ubicación de cajones asignados
    cites:
    - source: retys
  - text: Padrón vehicular ( se anexa formato a la solicitud ); el cual deberá contener toda la información solicitada
    cites:
    - source: retys
  - text: Copia del tarjetón de digitalización emitido por el instituto de movilidad sustentable de todas las unidades
      que integran el padrón vehicular
    cites:
    - source: retys
  - text: Anuencia por escrito donde se manifieste la autorizacion para el uso de los servicios sanitarios, si el
      sitio esta ubicado en via publica deberá presentar la anuencia por parte de un giro comercial colindante a
      la ubicacion solicitada, si el sitio se ubica en propiedad privada deberá presentar la anuencia por parte
      del propietario del predio o encargado del inmueble, anexando identificacion
    cites:
    - source: retys
  - text: Pago de derechos
    cites:
    - source: retys
