title: Análisis de solicitud de prórroga
summary: Aplazamiento para presentar la información adicional de un trámite en evaluación o para dar cumplimiento
  a condicionantes de una autorización o licencia, en materia de impacto ambiental, de riesgo, de emisiones a la
  atmósfera y/o de residuos de manejo especial, para esta última solo aplica la prórroga para dar cumplimiento a
  condicionantes.
