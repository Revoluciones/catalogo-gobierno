summary: Documento reconocido por las instituciones educativas, que permiten el tránsito de los alumnos entre los
  diferentes subsistemas de educación superior. El documento contiene la información relativa a los módulos cursados
  que fueron aprobados y no aprobados, se encuentra avalado con el sello y firma autógrafa del director del plantel,
  jefe de servicios escolares del plantel y jefe de servicios escolares de la Dirección Estatal.
