country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Cirugía Pterigion
summary: El cirujano extirpa una pequeña carnosidad del ojo y coloca una pequeña parte de la propia conjuntiva de
  la o el paciente con puntos de sutura para que no vuelva a crecer la carnosidad.
authority:
  name: Unidad de Especialidades Médicas de Baja California
official_ids:
  retys_id: 1347
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/1347
  homoclave: BC-UNEME-013
who_can:
- Interesado
when: Cuando tenga un crecieminto anormal tejido y presente un abultamiento en la parte blanca del ojo
result: Atención médica especializada en oftalmología
cost:
  type: gratuito
  amount_mxn: null
  text: SIN COSTO
  as_of: '2026-11-06'
  cites:
  - source: retys
deadlines:
