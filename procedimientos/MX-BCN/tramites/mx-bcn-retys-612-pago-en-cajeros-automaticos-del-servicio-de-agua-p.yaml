  modes:
  - name: Presencial
    steps:
    - Acudir a cualquiera de las tres ubicaciones de los cajeros automáticos.
    - Deslizar el código de barras de factura por el lector o registrar en pantalla los datos solicitados por el
      cajero automático
    - Seleccionar el trámite a realizar (pago semestral, pago anual, pago de factura o estado de cuenta).
    - Realizar el pago correspondiente; introduciendo los billetes o monedas como se indica en pantalla.
    - Tomar su comprobante de pago emitido por el cajero automático.
  notes: Cualquiera que realice el pago
