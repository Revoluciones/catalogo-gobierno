scenarios:
- name: Persona Física
  requirements:
  - text: Solicitud de Apoyo (Anexo 1).
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/15137
  - text: Copia de identificación oficial vigente (credencial para votar, pasaporte o cédula profesional vigente;
      en caso de ser extranjero, documento migratorio o visa permanente).
    cites:
    - source: retys
  - text: Copia del comprobante de domicilio, con una antigüedad no mayor a 2 meses (recibo de luz o agua).
    cites:
    - source: retys
  - text: Constancia de Situación Fiscal, con una antigüedad no mayor a 3 meses.
    cites:
    - source: retys
  - text: Proyecto Creativo (Formato Libre).
    cites:
    - source: retys
  - text: Cotización de acuerdo a los conceptos elegibles, con datos fiscales del proveedor, dirigida al solicitante.
    cites:
    - source: retys
  - text: Manifiesto bajo protesta de decir verdad que el trámite es gratuito.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/15144
  - text: Manifiesto no ser funcionario.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/15145
  - text: 'En caso de personas menores de edad, la solicitud deberá presentarse por medio de una persona representante
      y, además de los requisitos aplicables, deberá presentar: Copia del acta de nacimiento de la persona menor
      de edad.'
    cites:
    - source: retys
  - text: Documento que acredite la representación legal.
    cites:
    - source: retys
  - text: Carta Compromiso (Anexo V).
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/15149
  - text: Carta Poder (Anexo VI).
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/15150
  - text: Documentación adicional que, en su caso, requiera la SEI para integrar el expediente o salvaguardar el
      interés superior de la persona menor de edad.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El interesado consulta la convocatoria y descarga los formatos y anexos correspondientes.
    - El interesado recaba la información y documentación requerida.
    - El interesado presenta el expediente completo en las oficinas de la Dirección de Fortalecimiento al Sector
      Creativo (DSFC).
    - El Comité revisa y evalúa los proyectos recibidos.
    - La DSFC notifica al interesado el resultado de la dictaminación y, en caso de aprobación, realiza el proceso
      administrativo para la entrega del apoyo.
    - El beneficiario recibe el apoyo y presenta las evidencias del proyecto dentro de los 15 días hábiles siguientes,
      incluyendo el informe y la documentación que acredite el uso del recurso.
  notes: Documentación necesaria para iniciar el trámite.
