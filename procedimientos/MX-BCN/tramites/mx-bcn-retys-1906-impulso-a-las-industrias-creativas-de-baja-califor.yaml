id: mx-bcn-retys-1906-impulso-a-las-industrias-creativas-de-baja-califor
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Impulso a las Industrias Creativas de Baja California 2026
summary: Programa dirigido a personas físicas residentes en el Estado de Baja California que desarrollen proyectos
  vinculados con las industrias creativas, para solicitar apoyo en su profesionalización, capacitación, formación,
  desarrollo y consolidación, a fin de fortalecer su talento creativo y competitividad.
authority:
  name: Secretaría de Economía e Innovación de Baja California
official_ids:
  retys_id: 1906
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/1906
  homoclave: BC-SEI-018
who_can:
- Representante Legal
- Interesado
when: Cuando se pretenda desarrollar un proyecto vinculado con las industrias creativas.
result: Apoyo económico por única ocasión de $10,000.00 (diez mil pesos 00/100 M.N.) hasta $100,000.00 (cien mil
  pesos 00/100 M.N.)
