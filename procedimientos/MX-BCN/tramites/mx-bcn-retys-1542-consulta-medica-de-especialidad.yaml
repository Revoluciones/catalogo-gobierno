scenarios:
- name: Consulta médica de especialidad
  requirements:
  - text: Identificación oficial con fotografía.
    cites:
    - source: retys
  - text: Hoja de referencia expedida por el médico del centro de salud.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Solicitar en línea o de manera presencial al establecimiento a donde se enviará el paciente, la cita para
      que se presente el paciente y reciba la atención con la fecha y hora registrada
    - El especialista proporcionará la consulta solicitada y llenará el formato de contrarreferencia en donde indicará
      el manejo y las medidas pertinentes, incluyendo próxima consulta o el alta del paciente.
  notes: Atención médica en alguna de las ramas de la medicina cirugía, ginecología y obstetricia, pediatría, medicina
    interna, entre otras
