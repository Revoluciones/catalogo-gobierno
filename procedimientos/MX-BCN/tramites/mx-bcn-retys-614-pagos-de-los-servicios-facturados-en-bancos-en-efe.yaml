scenarios:
- name: Cuidadano
  requirements:
  - text: El pago en una institución, ya sea bancaria o comercial distinta a la zona comercial, sólo se recibirá
      3 días antes de su vencimiento y que no cuente con mensualidades vencidas.
    cites:
    - source: retys
  - text: Pago domiciliado te ofrece la oportunidad de pagar tu recibo de agua descontándolo automáticamente de
      tu cuenta de débito o cuenta de cheques.
    cites:
    - source: retys
  - text: 'Acudir a cualquier sucursal BBVA Bancomer, Santander o Banamex. presenta los siguientes documentos:'
    cites:
    - source: retys
  - text: Tu último estado de cuenta.
    cites:
    - source: retys
  - text: Identificación oficial vigente
    cites:
    - source: retys
  - text: Recibo de agua.
    cites:
    - source: retys
  - text: Firma del formato de autorización.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la sucursal más cercana del banco o tienda de autoservicio al área de cajas y esperar su turno.
    - La cajera le recibe su factura y le cobra el importe de la factura, sella y le hace entrega de la misma.
    - Para pago domiciliado acudir a cualquier sucursal BBVA Bancomer, Santander o Banamex y presentar documentos
  notes: Realiza el pago
