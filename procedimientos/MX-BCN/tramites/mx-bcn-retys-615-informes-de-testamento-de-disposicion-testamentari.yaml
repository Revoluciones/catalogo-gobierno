scenarios:
- name: Ciudadania en General
  requirements:
  - text: Acta de defunción
    cites:
    - source: retys
  - text: Identificación oficial del solicitante
    cites:
    - source: retys
  - text: 'Para acreditar parentesco:'
    cites:
    - source: retys
  - text: '----- En caso de ser hijo (a), hermano (a), papá/mamá: acta de nacimiento'
    cites:
    - source: retys
  - text: '----- En caso de ser esposo (a): acta de matrimonio'
    cites:
    - source: retys
  - text: Original traducción y apostilla si fallece en el extranjero del acta de defunción o nacimiento en su caso
    cites:
    - source: retys
  - text: Formato
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/2083
  modes:
  - name: En línea
    steps:
    - Identifícate con Llave BC. Ingresa a la Ventanilla Digital de Baja California con tu cuenta de Llave BC para
      iniciar la solicitud.
    - 'Selecciona el tipo de búsqueda. Elige la modalidad que corresponda a tu solicitud: búsqueda general o búsqueda
      de testamento posterior o diverso.'
    - Adjunta los documentos requeridos. Carga los documentos solicitados en la plataforma para acreditar el parentesco
      y cumplir con los requisitos del servicio.
    - Espera la revisión de tus documentos. Un analista revisará la documentación que proporcionaste y verificará
      que cumpla con los requisitos establecidos, incluida la acreditación del parentesco.
    - Realiza el pago correspondiente. Una vez aprobados los documentos, efectúa el pago de acuerdo con las opciones
      disponibles en la plataforma.
    - Descarga tu informe. Espera la notificación que te indicará que tu Informe de Disposición Testamentaria está
      listo. Después, ingresa a la Ventanilla Digital de Baja California para descargarlo.
  - name: Presencial
    steps:
    - Acudir a las oficinas de la Dirección , entregar requisitos
    - Pago de derechos correspondiente
    - Si lo solicita un Juzgado o una Notaría presentar oficio o escrito
    - Esperar un estimado de 3 a 5 días
    - Pasar a oficina de la dirección por informe de disposición testamentaria
  notes: Entregar original
