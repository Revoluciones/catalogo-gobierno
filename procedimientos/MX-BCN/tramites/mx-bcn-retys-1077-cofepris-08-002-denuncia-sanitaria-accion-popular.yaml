scenarios:
- name: Ciudadanía en general
  requirements:
  - text: 'Para Modo de Ingreso Presencial (previa cita): Formato “Denuncia Sanitaria (Acción Popular)” debidamente
      requisitado. Copia simple de identificación oficial vigente. Adjuntar información relacionada con la denuncia
      (ticket de compra, muestra de producto, medio publicitario, etiqueta de producto, etc.)'
    cites:
    - source: retys
  - text: 'Para Modo de Ingreso Telefónico, comuníquese al 800-033-5050 y deberá contar con: Información relacionada
      con la denuncia (ticket de compra, muestra de producto, medio publicitario, etiqueta de producto, domicilio
      completo del establecimiento, etc.) Información del denunciante.'
    cites:
    - source: retys
  - text: 'Para el Modo de Ingreso Electrónico, deberá ingresar a: https://www.gob.mx/cofepris/acciones-y-programas/denuncias-sanitarias
      y capturar la información siguiente: Información relacionada con la denuncia (ticket de compra, muestra de
      producto, medio publicitario, etiqueta de producto, domicilio completo del establecimiento, etc.) Información
      del denunciante.'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Presentarse en las oficinas de COEPRIS
    - Entregar denuncia debidamente llenada
    - El personal verificador realiza la visita de verificación a fin de atender la denuncia y se da el seguimiento
      hasta finalizar el proceso
  notes: Presentación denuncia sanitaria
