scenarios:
- name: PRIMERA ETAPA - Solicitud de Servicios
  requirements:
  - text: Petición por escrito para la introducción del o los servicios, la cual deberá estar firmada por las personas
      que serán beneficiadas.
    cites:
    - source: retys
  - text: Plano Lotificado para realizar la proyección.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público de Oficinas Centrales de CESPT.
    - Pasar al área de Archivo e ingresar los requisitos
    - La persona de archivo le entregará la copia del documento de Petición por Escrito de Obra por las personas
      que serán beneficiadas, al cual le imprime la certificación de recibido que contiene el número de folio para
      su seguimiento y la fecha de respuesta.
    - CESPT envía a un promotor a las casas de los beneficiados, para realizar un censo.
    - Una vez realizado el censo CESPT elabora la derrama de obra y se determina el costo por m² con en base a la
      superficie beneficiada.
    - Si los ciudadanos están de acuerdo con la obra y su costo, se entregan Notificaciones de Obra a todos los
      beneficiados para que pasen a la CESPT a solicitar la contratación del servicio.
  notes: PRIMERA ETAPA - Solicitud de Servicios
- name: SEGUNDA ETAPA - Contratación
  requirements:
  - text: Notificación de obra de la CESPT.
    cites:
    - source: retys
  - text: 'Documento que compruebe la propiedad, posesión o titularidad del predio, UNO de los siguientes: Carta
      de inscripción del Registro Público (máx. 1 año), Constancia de posesión, Carta de residencia, Juicio de prescripción
      (máx. 1 año), Recibo del impuesto predial (máx. 1 año)'
    cites:
    - source: retys
  - text: En caso de NO CONTAR CON DOCUMENTOS OFICIALES DE PROPIEDAD, llenar formulario de Carta compromiso para
      la solicitud de contratación de servicios, la cual debe estar firmada por posesionario del predio, la proporciona
      CESPT.
    cites:
    - source: retys
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el propietario del predio,
      puede ser UNO de los siguientes: Poder Notarial, Carta poder ante Notario Público, Corredor Público o Fedatario
      público, Carta Poder simple firmada por el propietario del predio y por dos testigos, que incluya copia de
      las identificaciones oficiales de los testigos, cuya antigüedad no exceda los seis meses, si quien gestiona
      no es el propietario.'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial del INE,
      Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Permiso de ruptura de pavimento, vigente, otorgado por el Ayuntamiento que corresponda, SI LA CALLE ES
      DE ASFALTO O CONCRETO.
    cites:
    - source: retys
  - text: Hacer el pago correspondiente
    cites:
    - source: retys
  - text: Se requiere que por lo menos que el 80% de las personas que se beneficiarán con la obra contraten y cubran
      por lo menos el 50% del costo total de la obra para empezar a ejecutarla, si se cumplen estas dos condiciones
      se ejecuta la obra y se instalan los servicios.
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en original y copia, la cual debe ser LEGIBLE y contener el DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a cualquier Centro de Atención al Público de CESPT.
    - Dirigirse al área de Módulos de Atención Personalizada (MAP) y esperar su turno.
    - Cuando sea su turno, la persona del MAP revisará que se cumpla con todos los requisitos, si no están completos,
      le informará que no es posible realizar el trámite hasta que éstos se completen, indicándole que es lo que
      falta.
    - Con los requisitos completos, la persona del MAP elaborará el Presupuesto de Obra que corresponda al servicio
      solicitado.
    - La persona del MAP le explicará las diferentes alternativas y términos de pago disponibles.
    - Elegir la opción de pago que se ajuste a sus posibilidades
    - La persona del MAP elaborará el Contrato Administrativo correspondiente, y le hará entrega de éste y del Presupuesto
      de Obra para que los revise y los firme.
    - Firme de conformidad los documentos que le entregó la persona del MAP
    - 'Una vez firmados los documentos deberá pasar a cajas a realizar el pago correspondiente, en donde le entregarán
      dos documentos: Comprobante de pago y Convenio de liquidación de obra.'
  notes: SEGUNDA ETAPA - Contratación
