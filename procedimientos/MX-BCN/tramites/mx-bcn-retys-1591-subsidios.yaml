summary: Exención de parte del pago de agua para personas mayores de 60 años de escasos recursos; personas viudas
  mayores de 50 años en situación de pobreza, personas discapacitadas, jubiladas y/o pensionadas que no obtengan
  ingresos mayores a 5 veces la unidad de medida y actualización (UMAS).
