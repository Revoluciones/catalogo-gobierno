scenarios:
- name: Personas mayores de 60 años en situación de pobreza
  requirements:
  - text: Número de cuenta de la que se va a solicitar subsidio, el cual puede obtener de la factura que recibe
      mensualmente.
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE con el mismo domicilio que el registrado en la cuenta,
      del propietario del predio, UNO de los siguientes: Credencial del INE, Pasaporte mexicano, Licencia de conducir,
      Matrícula consular.'
    cites:
    - source: retys
  - text: Formato de Solicitud de Subsidio proporcionado por CESPT, firmado.
    cites:
    - source: retys
  - text: Credencial del INAPAM (antes INSEN)
    cites:
    - source: retys
  - text: Estudio socioeconómico, el cual realizará un inspector de CESPT
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en ORIGINAL Y COPIA, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  - text: Para que se aplique el subsidio es necesario que el saldo de la cuenta de agua esté en ceros
    cites:
    - source: retys
  - text: El subsidio se otorgará siempre y cuando la persona que solicita No tenga ingresos mayores al equivalente
      de cinco veces la Unidad de Medida y Actualización.
    cites:
    - source: retys
  - text: El beneficio solo se aplica a un domicilio, que será el establecido como lugar de residencia de la persona
      a la que se otorga el subsidio.
    cites:
    - source: retys
  - text: No se aplicará el subsidio si el predio además de vivienda se utiliza para actividades comerciales.
    cites:
    - source: retys
  - text: No se aplicará subsidio a predios en los que el medidor de agua suministre a más de una vivienda.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a cualquier Centro de Atención al Público (CAP) de CESPT.
    - Pasar al Módulo Atención Personalizada (MAP) y esperar su turno
    - Cuando llegue su turno, la persona del MAP revisará que se cumpla con todos los requisitos, si no están completos,
      le informará que no es posible realizar el trámite, indicándole que es lo que falta
    - Con los requisitos completos, la persona del MAP llena en el sistema la Solicitud de Subsidio
    - La persona del MAP entrega al ciudadano la Solicitud de Subsidio para que la revise y la firme
    - Revise y firme la solicitud
    - La persona del MAP entrega al ciudadano una copia de la Solicitud de Subsidio para que en la fecha indicada
      de atención, marque al teléfono 073 donde se le informará sobre el dictamen de su solicitud.
    - Si es factible la aplicación del subsidio el ciudadano deberá recibir su factura del agua con el descuento
      de acuerdo al consumo mensual.
  notes: Subsidio
