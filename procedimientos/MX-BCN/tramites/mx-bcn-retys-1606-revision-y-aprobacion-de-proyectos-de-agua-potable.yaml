scenarios:
- name: GENERAL
  requirements:
  - text: 'PRIMERA ETAPA - REVISIÓN:'
    cites:
    - source: retys
  - text: Presentar solicitud firmada por el propietario del terreno o representante legal en donde se especifique
      quien será el proyectista que dará seguimiento al trámite
    cites:
    - source: retys
  - text: Opinión técnica de agua potable y/o alcantarillado sanitario, vigente y Puntos de Conexión
    cites:
    - source: retys
  - text: Carpeta que contenga memoria descriptiva, memoria de cálculo de agua potable y alcantarillado sanitario
      y sus respectivos catálogos de conceptos
    cites:
    - source: retys
  - text: Planos en papel bond de los proyectos de las redes de agua potable y alcantarillado sanitario
    cites:
    - source: retys
  - text: 'SEGUNDA ETAPA - APROBACIÓN:'
    cites:
    - source: retys
  - text: Dos juegos de planos autorizados en papel plástico o herculene
    cites:
    - source: retys
  - text: CD con archivos digitalizados de los planos elaborados en el programa AutoCAD
    cites:
    - source: retys
  - text: Recibo de pago por la aprobación de proyectos según la Ley de Ingresos para el Estado de Baja California
      vigente
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público (CAP) de Oficinas Centrales.
    - Pasar al área de Archivo a solicitar la revisión de proyectos de agua potable o alcantarillado sanitario y
      presentar los requisitos solicitados
    - Archivo realiza una orden foliada y la entrega al solicitante
    - Posteriormente se realizan las revisiones correspondientes a los proyectos para saber si cumple técnicamente
      conforme a la normatividad (SIDURT)
    - Si no cumple con la Normatividad, la Coordinación de Proyectos de Obra emite un escrito con las observaciones
      y le notifica a la persona solicitante vía telefónica para que pase por su proyecto.
    - La persona solicitante deberá realizar las correcciones indicadas y reingresar el proyecto a la Coordinación
      de Proyectos de Obra para una nueva revisión.
    - Si cumple con la normatividad, la Coordinación de Proyectos de Obra emite Orden de Pago por los derechos de
      revisión, conforme a la Ley de Ingresos del Estado de Baja California vigente y le notifica a la persona solicitante
      vía telefónica que pase por la Orden de Pago.
    - La persona solicitante debe acudir por la orden de pago y pasar a las cajas a realizar el pago del trámite.
    - Una vez realizado el pago, la persona solicitante debe acudir a la Coordinación de Proyectos de Obra a entregar
      copia del recibo de pago, dos juegos de planos en plástico para la obtención de firmas y CD con archivos digitales
      (dwg)
    - La Coordinación de Proyectos de Obra elabora el oficio de respuesta y se comunica nuevamente con la persona
      solicitante para que pase a recoger los documentos
    - La persona solicitante debe acudir al Departamento de Obras a recoger el oficio de aprobación y los planos
      firmados.
  notes: 'El tramite consiste en dos etapas; la primera es de revisión y la segunda de aprobación. En cada una se
    requiere los siguientes requisitos:'
legal_basis:
