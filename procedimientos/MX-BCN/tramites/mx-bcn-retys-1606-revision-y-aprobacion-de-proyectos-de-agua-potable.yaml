kind: tramite
title: Revisión y Aprobación de Proyectos de Agua Potable y/o Alcantarillado Sanitario
summary: Revisión técnica de los proyectos de agua potable, alcantarillado sanitario y obras complementarias (líneas
  de conducción, tanques, bombeos, acueductos, colectores etc.), elaborados por particulares y/u otros Organismos
  para autorización de su construcción. Este trámite consta de 2 etapas, la primera es la revisión del proyecto
  que consiste en analizar el mismo las veces que sean necesarias hasta que el proyecto no presente errores técnicos
  para posteriormente pasar a la segunda etapa de la aprobación.
