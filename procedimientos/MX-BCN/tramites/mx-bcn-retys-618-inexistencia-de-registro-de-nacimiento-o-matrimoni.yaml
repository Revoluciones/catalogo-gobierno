scenarios:
- name: Inexistencia de matrimonio
  requirements:
  - text: Llenar formato de solicitud de Inexistencia de registro de matrimonio
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11014
  - text: Pago de los derechos correspondientes.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al área de atención al público
    - Llenar formato de solicitud
    - Realizar pago de derechos ante la recaudación de rentas del Estado
  notes: La solicitud debe de estar firmada por el interesado. En caso de existir divorcio o defunción del cónyuge
    anexar copia legible del documento que lo acredite.
- name: Inexistencia de nacimiento
  requirements:
  - text: Llenar formato de solicitud de Inexistencia de registro de nacimiento
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11018
  - text: Pago de derechos
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al área de atención al público
    - Llenar formato de solicitud
    - Realizar pago de derechos ante la recaudación de rentas del Estado
  notes: La solicitud debe de estar firmada por el interesado. En caso de menores de edad puede hacerlo el padre
    o madre. Para los casos de nacimiento en el extranjero agregar copia de nacimiento.
