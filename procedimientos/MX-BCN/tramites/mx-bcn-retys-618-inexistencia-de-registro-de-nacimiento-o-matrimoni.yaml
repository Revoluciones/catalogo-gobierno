id: mx-bcn-retys-618-inexistencia-de-registro-de-nacimiento-o-matrimoni
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Inexistencia de Registro de Nacimiento o Matrimonio
summary: Extender a los interesados un documento certificado que haga constar la inexistencia para hacer del conocimiento
  de terceros que no han sido registrados en el estado o que no han celebrado en el estado el acto civil del matrimonio,
  o que habiendo celebrado alguno este haya sido disuelto.
