scenarios:
- name: Jóvenes
  requirements:
  - text: Copia de la INE vigente y actualizada con la dirección del comprobante de domicilio
    cites:
    - source: retys
  - text: Cotización original con antigüedad no mayor a un mes (a nombre de GOBIERNO DEL ESTADO DE BAJA CALIFORNIA,
      el proveedor debe de aceptar cheque y la cotización debe de estar firmada en tinta azul y sellada)
    cites:
    - source: retys
  - text: Copia de comprobante de domicilio con antigüedad no mayor a 3 meses (en caso de estar a nombre de los
      padres, copia del acta de nacimiento, en caso de estar a nombre de otra persona se requiere una carta en hoja
      blanca escrita a mano en tinta azul en donde la persona le de autorización al solicitante de emprender su
      negocio en su domicilio; especificando el domicilio y copia de la INE de la persona cuyo nombre aparece en
      el comprobante)
    cites:
    - source: retys
  - text: Copia del CURP
    cites:
    - source: retys
  - text: Constancia de Situación Fiscal del Proveedor (no se acepta el Régimen Simplificado de Confianza)
    cites:
    - source: retys
  - text: NO estar registrado en HACIENDA
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas de INJUVE
    - Llenar y entregar documentación requerida
    - Se le agenda una cita al beneficiario para la entrega de su equipo, indicando fecha, hora y lugar de entrega
  notes: Jóvenes
