- name: Representante legal
  requirements:
  - text: Presentar solicitud escrita y/o electrónica informando nombre, domicilio, RFC, giro o actividad de la
      empresa (copia de poder notarial, solo si es diferente al que lo solicito inicialmente)
    cites:
    - source: retys
  - text: Nombre de la persona o representante legal a quien saldrá el permiso
    cites:
    - source: retys
  - text: No. de cuenta de agua potable.
    cites:
    - source: retys
  - text: No. de empleados
    cites:
    - source: retys
  - text: Cantidad que producción diaria o mensual (anotar si es por temporadas).
    cites:
    - source: retys
  - text: Recibo de pago del servicio. pago por la visita de verificación y por la expedición de la revaluación
      dación del permiso
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El usuario por si propio o por un responsable técnico, debe recabar los datos del formato para el permiso
      de descarga de aguas que están en página de CESPM agregando el pago correspondiente así como los resultados
      de análisis de la descarga de aguas residuales procedentes de proceso productivos, (si es el mismo representante
      legal no presentar poder notarial) .
    - Una vez que integren todos los datos, el usuario por si solo o por medio del representante legal, y el responsable
      técnico enviará los datos con la solicitud del permiso, en la oficina de normatividad, y control ambiental)
      (onca).
    - ONCA recibirá y revisará el documento en caso de ser necesario solicitará información adicional y/o en su
      caso programara una visita confirmativa de datos.
    - Una vez que ONCA evalué la información y en su caso verifique los datos técnico emitirá el permiso de descarga
    - Se le comunicará al usuario para que pase por su permiso.
  notes: Carta poder notariada
