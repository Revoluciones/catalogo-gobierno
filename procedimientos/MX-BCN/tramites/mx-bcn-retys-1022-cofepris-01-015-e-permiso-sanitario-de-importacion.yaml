  - text: Copia del permiso de responsable de operación y funcionamiento del equipo de rayos X
    cites:
    - source: retys
  - text: Factura certificada ante Fedatario Público (notario o corredor público) que indique que el equipo es usado
    cites:
    - source: retys
  - text: Fe de hechos ante notario o corredor público o su equivalente en el extranjero, de las garantías de efectividad
      y pruebas del correcto funcionamiento del equipo usado y que es apto para su uso
    cites:
    - source: retys
  - text: Para el caso de aparatos de Rayos X usado, deberá presentar original de los documentos probatorios que
      certifiquen el cumplimiento de la NOM-229-SSA1-2002, salud ambiental. Requisitos técnicos para las instalaciones,
      responsabilidades sanitarias, especificaciones técnicas para los equipos y protección radiológica en establecimientos
      de diagnóstico médico con rayos x, elaborados por el fabricante o el asesor especializado en seguridad radiológica,
      autorizado por la Comisión Federal, firmados conjuntamente con el importador bajo protesta de decir verdad
    cites:
    - source: retys
