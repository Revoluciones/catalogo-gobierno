title: Cursos de Capacitación para el Trabajo
summary: En el Instituto de Capacitación en Alta Tecnología te preparamos para los retos del futuro. Ofrecemos cursos
  de capacitación especializados en los sectores estratégicos más demandados en el Estado; están diseñados para
  obtener las habilidades prácticas y necesarias que las empresas buscan. Estamos autorizados para emitir constancia
  con validez oficial por la Secretaría de Educación Pública.
