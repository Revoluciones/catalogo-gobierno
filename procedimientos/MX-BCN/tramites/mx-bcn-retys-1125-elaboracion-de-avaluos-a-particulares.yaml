  homoclave: BC-SHFP-001
who_can:
- Representante Legal
- Interesado
when: Cuando el solicitante requiera documento en el que conste el proceso de estimar el valor de un bien.
result: Avalúo
cost:
  type: variable
  amount_mxn: null
  text: 'COSTO VARIABLE: Dentro del centro de población $930.06 pesos (como anticipo) más el 3.00 al millar sobre
    el valor del bien (al término del trámite) y fuera del centro de población $1,163.56 pesos (como anticipo) más
    el 3.00 al millar sobre el valor del bien (al término del trámite)'
  as_of: '2026-11-06'
  cites:
  - source: retys
deadlines:
- what: respuesta_autoridad
  text: 'Tiempo que tiene el organismo para resolver: 3 Meses'
  cites:
  - source: retys
- what: vigencia
  text: 1 AÑO
  cites:
  - source: retys
positive_silence: false
requires_inspection: true
channels:
- presencial
offices:
- municipality: Mexicali
  name: Comisión Estatal de Avalúos
  address: 'Av. Álvaro Obregón y Calle México #599, Sección Primera , Mexicali, 21100'
- municipality: Tijuana
  name: Comisión Estatal de Avalúos
  address: 'Blvd. Aguacaliente #21939, Fracc. El Paraíso, Tijuana, 22160'
- municipality: Ensenada
  name: Comisión Estatal de Avalúos
