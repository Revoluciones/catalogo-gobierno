id: mx-bcn-retys-1125-elaboracion-de-avaluos-a-particulares
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Elaboración de Avalúos a Particulares.
summary: Emitir documento en el que consta el proceso de estimar el valor específico de un bien o derecho determinado
  y debidamente identificado, para un fin específico, A una fecha dada en moneda de curso legal y cuando el bien
  a valuar sea materia de una operación donde intervenga el gobierno del estado, dependencia de la administración
  pública.
authority:
  name: Secretaría Anticorrupción y Buen Gobierno
