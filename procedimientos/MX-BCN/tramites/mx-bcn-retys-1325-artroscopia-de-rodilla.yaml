branch: ejecutivo
kind: tramite
title: Artroscopia de Rodilla
summary: Es la cirugía de mínima invasión en la que por medio de un artroscopía se diagnostican y resuelven enfermedades
  de las rodillas.
authority:
  name: Unidad de Especialidades Médicas de Baja California
