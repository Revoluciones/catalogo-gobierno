title: Asignación de defensor público a personas detenidas, sujetas a investigación o en proceso.
summary: La Asignación de defensor público a personas detenidas, sujetas a investigación o en proceso penal es el
  trámite mediante el cual una persona que ha sido detenida, investigada o acusada de un delito puede solicitar
  que se le designe un abogado de la Defensoría Pública para que la asesore y la represente legalmente. Se utiliza
  cuando alguien no cuenta con un abogado particular y necesita defensa jurídica para proteger sus derechos y recibir
  acompañamiento durante todo el procedimiento ante las autoridades.
