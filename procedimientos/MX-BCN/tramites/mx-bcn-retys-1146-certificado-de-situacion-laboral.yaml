  modes:
  - name: En línea
    steps:
    - Acceder a la liga (trámite en internet)
    - Habilitar la opción de permitir ventas emergentes (pop ups)
    - Llenar los campos de la solicitud
    - Realizar pago en línea con tarjeta bancaria o por referencia bancaria
    - Recibir certificado en línea
  - name: Presencial
    steps:
    - Realizar el pago correspondiente en la oficina de recaudación de rentas del estado
    - Con el comprobante de pago acudir al área de credencialización para solicitar el certificado
    - Proporcionar RFC con homoclave para búsqueda en el sistema correspondiente
    - Proporcionar el nombre de la institución que requiere el certificado
    - Recibir el certificado
  notes: Persona interesada
