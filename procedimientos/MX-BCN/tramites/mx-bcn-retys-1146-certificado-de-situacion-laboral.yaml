summary: Entregar a las personas que se incorporan a prestar sus servicios a la Coordinación de Gabinete, a las
  dependencias de la administración pública centralizada o a las entidades paraestatales, un documento de carácter
  oficial que demuestre si actualmente presta o prestó sus servicios en alguna de las mencionadas.
