  modes:
  - name: En línea
    steps:
    - Ingresar a la pagina oficial https://rppcweb.ebajacalifornia.gob.mx/portalbc/produccion/portalapp/index.html
      o dar clic en "iniciar trámite"
    - Seleccionar pago de acceso remoto, vaciar la información solicitada y hacer el pago correspondiente
    - El acceso llegara vía correo electrónico
  - name: Presencial
    steps:
    - Acudir a la oficina registral y llenar el formato correspondiente FIN-8.5.1-06
    - Pagar los derechos correspondientes en la oficina recaudadora
    - Acudir a oficialía de partes para entregar la solicitud de trámite solicitado
    - El acceso es enviado vía correo electrónico al usuario con las claves de acceso
  notes: Para acceder de forma remota a las bases de datos
