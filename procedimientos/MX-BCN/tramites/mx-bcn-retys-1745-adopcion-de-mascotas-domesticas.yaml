title: Adopción de mascotas domésticas
summary: Solicitud para la adopción de perros y gatos, derivados de denuncias de maltrato animal y/o en situación
  de abandono.
authority:
  name: Secretaría de Medio Ambiente y Desarrollo Sustentable de Baja California
official_ids:
  retys_id: 1745
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/1745
  homoclave: BC-SMADS-066
who_can:
- Interesado
when: Cuando se requiera adoptar un perro o gato.
result: La mascota y su documentación correspondiente.
cost:
  type: gratuito
  amount_mxn: null
  text: SIN COSTO
  as_of: '2026-11-06'
  cites:
  - source: retys
deadlines:
- what: respuesta_autoridad
  text: 'Tiempo que tiene el organismo para resolver: 15 Días Hábiles'
  cites:
  - source: retys
positive_silence: false
requires_inspection: true
channels:
- en_linea
- presencial
offices:
- municipality: Mexicali
  name: Santuario Animal Mily
  address: 'Av. de las Gracias,  #1373,  Colonia Granjas el Encanto II, Mexicali, 21703'
scenarios:
- name: Ciudadanía en general
  requirements:
  - text: Formato de Adopción
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12668
  - text: Original y copia de la identificación oficial vigente
    cites:
    - source: retys
  - text: Fotográfia del lugar donde estará la mascota adoptada
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - 'Conoce a los animalitos listos para adopción dando click en el botón "iniciar trámite" o ingresando a la
      siguiente liga: https://www.santuariomily.bajacalifornia.gob.mx/conocelos'
    - Selecciona el perro o gatito que sea de tu interés
    - Llena el formato y carga los requisitos
    - Envió de correo con la fecha de inspección al hogar donde estará la mascota
    - Notificación de aceptación/rechazo de la solicitud
    - Entrega de la mascota doméstica
  - name: Presencial
    steps:
    - Llenar el formato de adopción de forma completa y lo más clara posible.
    - Comunicarse a Santuario Mily (686 591 6897) y solicitar una cita para acudir a las instalaciones y conocer
      a los perros y gatos que se encuentran en el santuario.
    - Agenda y confirmación de cita para la visita del ciudadano al Santuario Mily.
    - Selección de la mascota doméstica a adoptar
    - Entrega de informe fotográfico del espacio y las condiciones donde se encontrará el perro o gato que se pretende
      adoptar.
    - Entrega de documentos
    - Notificación de aceptación/rechazo de la solicitud
    - Entrega de la mascota doméstica
  notes: Toda persona que vaya a realizar el tramite de adopción deberá ser persona mayor de edad, debidamente acreditada
    mediante copia simple de identificación oficial, legible y con vigencia activa.
