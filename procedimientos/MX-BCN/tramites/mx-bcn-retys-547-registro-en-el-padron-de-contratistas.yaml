level: estatal
branch: ejecutivo
kind: tramite
title: Registro en el Padrón de Contratistas
summary: Registro en el padrón de contratistas para personas físicas o morales interesadas en la convocatoria y
  contratación de la obra pública y de sus servicios relacionados con la misma, del Estado o Municipios de Baja
  California y Nacionales con domicilio fiscal en el Estado de Baja California.
authority:
  name: Secretaría de Infraestructura, Desarrollo Urbano y Reordenación Territorial de Baja California
official_ids:
  retys_id: 547
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/547
  homoclave: BC-SIDURT-001
who_can:
- Representante Legal
- Interesado
when: Cuando se requiere el registro como contratista
result: Registro
cost:
  type: variable
  amount_mxn: null
  text: 'COSTO VARIABLE: Capítulo VIII Artículo 19. Vi.- por el alta en el padrón de contratistas y proveedores
    con vigencia anual, a quien lo solicité: A). - por el alta o su renovación anual.'
  as_of: '2026-11-06'
  cites:
  - source: retys
deadlines:
- what: respuesta_autoridad
  text: 'Tiempo que tiene el organismo para resolver: 15 Días Hábiles'
  cites:
  - source: retys
- what: vigencia
  text: ÚNICO
  cites:
  - source: retys
positive_silence: false
requires_inspection: false
channels:
- presencial
offices:
- municipality: Mexicali
  name: Dirección Inversión Sectorial, Programación Presupuestal Y Administración De Obras
  address: 'Calle G #510, Segunda Seccion, Mexicali, 21100'
scenarios:
- name: Contratista
  requirements:
  - text: Solicitud escrita de registro.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/5693
  - text: Llenado de formato, PADR2, PADR3, PADR4, PADR5, Y PADR6
    cites:
    - source: retys
  - text: Datos generales de la interesada;
    cites:
    - source: retys
  - text: Documentos que acrediten la capacidad legal de la solicitante
    cites:
    - source: retys
  - text: Las personas morales copia certificada del testimonio de la escritura constitutiva y modificaciones. Las
      personas físicas copia certificada del acta de nacimiento
    cites:
    - source: retys
  - text: Documentos que acrediten su experiencia y especialidad
    cites:
    - source: retys
  - text: Documentos que acrediten su capacidad técnica, económica y financiera
    cites:
    - source: retys
  - text: Relación de la maquinaria y equipo propio
    cites:
    - source: retys
  - text: Copia de la última declaración anual de impuesto federales correspondiente al año anterior; y/o alta en
      el SAT (si es de nueva creación)
    cites:
    - source: retys
  - text: Constancia de inscripción en el registro federal de contribuyentes y en el registro estatal de causantes
      de la Secretaría de Hacienda del Estado de Baja California
    cites:
    - source: retys
  - text: Copia de la constancia de la situación fiscal expedida por la secretaría de hacienda del estado de baja
      california, con una antigüedad máxima de 15 días naturales antes de la fecha de la solicitud de registro
    cites:
    - source: retys
  - text: Copia de la cédula profesional del responsable técnico
    cites:
    - source: retys
  - text: Copia de la tarjeta de identificación patronal ante el instituto mexicano del seguro social cuando proceda
    cites:
    - source: retys
  - text: Los demás documentos que el propio interesado considere pertinentes
    cites:
    - source: retys
  - text: Pago por concepto de registro (según la Ley de Ingresos del Estado vigente).
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - Entregar a la dirección de inversión sectorial, programación presupuestal y administración de obras de SIDURT
      los requisitos solicitados
    - Revisión técnica de la documentación (plazo de 1 a 15 días hábiles)
    - Si la resolución no es favorable se le comunica al usuario
    - Si la resolución es favorable se entrega el documento para efectuar el pago del registro en recaudación de
      rentas del estado
    - Con la copia del pago se entrega su registro
  notes: Solamente podrán ser registrados en el padrón de contratistas, las personas físicas o morales que cuentan
    con domicilio fiscal establecido en el Estado de Baja California
legal_basis:
