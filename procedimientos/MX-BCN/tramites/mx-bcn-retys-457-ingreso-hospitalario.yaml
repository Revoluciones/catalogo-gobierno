  modes:
  - name: Presencial
    steps:
    - Acude al área de urgencias para solicitar valoración médica y/o diagnostico.
    - Brinda valoración y diagnostico medico psiquiatrico; donde determina la necesidad de internamiento. Se deberá
      especificar el tipo de ingreso (voluntario, involuntario o por orden judicial)
    - Ingresa al servicio de hospitalización. (El egreso del paciente es determinado por el médico tratante)
  notes: Público en General
