  modes:
  - name: Presencial
    steps:
    - Acudir a alguno de los centros de rehabilitación integral a solicitar el servicio.
    - Recibir consulta de prevaloración para determinar si es apto para su atención en el centro de rehabilitación
      integral.
    - En caso de ser apto para brindarle las terapias el ciudadano agenda cita para consulta con especialista.
    - Deberá de seguir el plan de tratamiento asignado por el médico especialista.
    - Se realizará estudio socioeconómico por parte de la institución.
  notes: Recopilación de documentos para el servicio.
