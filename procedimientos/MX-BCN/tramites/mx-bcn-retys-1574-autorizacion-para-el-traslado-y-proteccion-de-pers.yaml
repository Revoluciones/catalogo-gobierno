kind: tramite
title: Autorización para el Traslado y Protección de Personas y/o Escoltas a Personas
summary: Trámite en el cual se solicitan los requisitos necesarios para la autorización de la prestación del servicio
  de seguridad privada en traslado y protección de personas, es decir, en custodia de personas (servicio de guardaespaldas
  y/o escoltas)
