scenarios:
- name: Denuncia sanitaria
  requirements:
  - text: Solamente el interesado podrá presentar la denuncia, no se requiere algún documento adicional
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Ingresar a la pagina web de ventanilla digital bc, y en el apartado de ´búsqueda´ teclear ´Denuncias Sanitarias´
    - 'Se habilitarán dos opciones: denuncia a establecimiento o denuncia a producto, se eligirá la opción según
      sea el caso'
    - Llenar la plantilla con información solicitada (nombre del denunciante, dirección, teléfono, correo electrónico,
      nombre y dirección del establecimiento a fin de poder identificarlo al momento de realizar la visita, entre
      otros)
    - Una vez llenada la plantilla con la información solicitada, se deberá ingresar debidamente llenado el motivo
      de la denuncia sanitaria
    - En caso de contar con alguna foto digital o video de evidencia, puede subirlo a la plataforma (no es requisito)
    - Una vez otorgada toda la información requerida, podrá imprimir una copia de su denuncia para contar con evidencia
      de que se realizó
    - El personal de la Unidad Regional que corresponda según sea el caso, recibirá la denuncia sanitaria y agendará
      visita de verificación según su logística
    - Se notificara al denunciante por medio de plataforma si su denuncia ya fue atendida
  - name: Mixto
    steps:
    - El ciudadano identifica un riesgo a la salud pública y acude a la Unidad Regional que corresponda y solicita
      hacer la denuncia sanitaria
    - El servidor público le ofrece un equipo de cómputo con las facilidades para realizar la denuncia en línea,
      o en su caso, se le ofrecerá un formato de Denuncia Sanitaria Estatal, mismo que contiene la misma información
      que la plantilla en línea
    - Llena debidamente el formato con la información requerida
    - Entrega al ciudadano una copia en físico de su denuncia
  notes: Proceso para interponer denuncia sanitaria a establecimientos o productos que presentan riesgos a la salud
    pública
