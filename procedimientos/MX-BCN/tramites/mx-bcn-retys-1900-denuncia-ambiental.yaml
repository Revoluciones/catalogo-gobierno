scenarios:
- name: Ciudadanía en General
  requirements:
  - text: Formato de denuncia ambiental
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/15117
  modes:
  - name: En línea
    steps:
    - Se presenta la denuncia ambiental a través del portal de la SMADS
    - Se revisa la denuncia y se turna a la autoridad
    - Se emite una resolución para atender la denuncia ambiental
  - name: Presencial
    steps:
    - Se presenta la denuncia ambiental en persona en las oficinas de la SMADS
    - Se analiza la información y se turna a la autoridad correspondiente
    - Se emite una resolución para la atención de la denuncia ambiental
  notes: Promover la denuncia ciudadana de cualquier acto o delito contra el medio ambiente
