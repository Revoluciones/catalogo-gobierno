title: Autorización para prestar servicio de seguridad privada en Protección y Vigilancia de Bienes
summary: Trámite para la validación de la prestación del servicio de seguridad privada en protección y vigilancia
  de bienes por parte de empresas de seguridad privada con giro comercial especializado en dicho ramo
