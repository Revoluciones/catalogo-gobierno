- municipality: Mexicali
  name: Seguridad Privada (Edificio Museo del Agua)
  address: 'Av. Álvaro Obregón #514, Sección Primera, Mexicali, 21100'
scenarios:
- name: Autorización para Protección y vigilancia de bienes Persona Moral y Física
  requirements:
  - text: Solicitud de autorización por escrito para prestar los servicios de seguridad privada en el Estado
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/6821
  - text: Acta Constitutiva ( cuyo objeto social esté relacionado con la prestación de servicios de seguridad privada),
      Acta de Nacimiento, CURP o Carta de Naturalización
    cites:
    - source: retys
  - text: Constancia de empadronamiento del RFC al Registro Estatal de Causantes
    cites:
    - source: retys
  - text: Permiso para la instalación y uso del equipo de radiocomunicación y/o telecomunicaciones
    cites:
    - source: retys
  - text: Relación del equipo de radiocomunicación y/o telecomunicaciones con características específicas
    cites:
    - source: retys
  - text: El manual de operaciones del personal operativo, por cada modalidad de las previstas en el artículo 4
      del reglamento que se solicite
    cites:
    - source: retys
  - text: Documentación que acredite su domicilio legal, sucursales y planos de ubicación
    cites:
    - source: retys
  - text: 'Relación del propietario cuando se trate de persona física y de los socios y representante o apoderado
      (s) legal (es) de la negociación cuando se trate de persona moral. (Anexos de cada uno: Acta de nacimiento,
      identificación oficial con fotografía vigente, domicilio)'
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/6808
  - text: Relación del equipo de protección personal con características. (Marca, Tipo, Modelo y Serie)
    cites:
    - source: retys
  - text: Relación de vehículos y anexos (fotografías legibles 4 lados, tarjeta de circulación vigente y seguro
      vehícular)
    cites:
    - source: retys
  - text: Licencia vigente para la portación y registro de cada una de las armas de fuego
    cites:
    - source: retys
  - text: Fotografía a color de las insignias y cualquier aditamento que se utilice o pretenda utilizar
    cites:
    - source: retys
  - text: Una fotografía frontal, trasera lateral izquierda y lateral derecha, a color, de cuerpo entero del uniforme
      que utilizará el personal operativo con accesorios y la leyenda "SEGURIDAD PRIVADA" visible conforme al artículo
      85 del Reglamento de Seguridad Privada (Legibles y tamaño carta)
    cites:
    - source: retys
  - text: Programa permanente de capacitación por cada modalidad solicitada, (artículo 4 Reglamento Seguridad Privada)
      y dictamen satisfactorio
    cites:
    - source: retys
  - text: Permiso de uso de suelo para local comercial, específicamente del domicilio legal de la empresa
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/6803
  - text: Constancia de No Antecedentes Penales del propietario, socios, representantes o apoderados legales
    cites:
    - source: retys
  - text: Modelo de gafete o credencial de identificación que expedirán para uso obligatorio del personal operativo
      (Requisitos artículo 77 del Reglamento de Seguridad Privada)
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/6820
  modes:
  - name: Presencial
    steps:
    - El ciudadano acreditará los requisitos para su modalidad o modalidades
    - El ciudadano presentará una carpeta con los requisitos en la dirección de seguridad privada
    - El servidor público revisará que cumpla con la totalidad de los requisitos
    - El servidor público informará al ciudadano si su carpeta cumple o no con los requisitos y que es necesario
      solventar
    - Cuando la carpeta este completa, se realizará una visita al ciudadano, para verificar que cumpla con los requisitos
      del establecimiento
    - Una vez realizada la visita y cumplidos todos los requisitos, se realizará un oficio de pago por la autorización
    - El ciudadano realizará el pago de la autorización y entregará su comprobante en la dirección de seguridad
      privada
    - El servidor público hará entrega del permiso al ciudadano y explicará las obligaciones con las que debe cumplir
  notes: Aquellas actividades realizadas por los prestadores, dirigidas primordialmente a la salvaguarda y protección
    de los bienes muebles e inmuebles dados en custodia por parte de los prestatarios. Original y dos copias de
    los siguientes documentos
