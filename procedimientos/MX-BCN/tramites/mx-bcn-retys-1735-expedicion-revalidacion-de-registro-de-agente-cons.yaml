title: Expedición / Revalidación de Registro de Agente Consultor Capacitador.
summary: Se reciben y revisan los documentos conforme a los requisitos establecidos y en el caso de revalidación
  haber cumplido requerimientos establecidos en la normatividad vigente. Si cumple se le otorga un número de registro.
  El presente registro es mediante convocatoria en el mes de junio.
