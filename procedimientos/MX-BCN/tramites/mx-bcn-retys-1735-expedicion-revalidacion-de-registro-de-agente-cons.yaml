scenarios:
- name: Registro de Agente Consultor Capacitador en Protección Civil
  requirements:
  - text: Solicitud por medio de escrito libre, anexando el formato autorizado y publicado en la página electrónica
      oficial de la Coordinación Estatal, donde se incluyan los datos generales de la persona física solicitante.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11574
  - text: Copia del pago de derechos del registro y presentar recibo original para cotejo.
    cites:
    - source: retys
  - text: Original y una copia simple una identificación oficial.
    cites:
    - source: retys
  - text: Currículum vitae en un máximo de 2 cuartillas
    cites:
    - source: retys
  - text: Copia de Registro Federal de Contribuyentes.
    cites:
    - source: retys
  - text: Original y una copia de comprobante de domicilio con una antigüedad de 90 días naturales, anteriores a
      la solicitud y/o original y copia de contrato de arrendamiento vigente que indiquen que el solicitante reside
      en el Estado.
    cites:
    - source: retys
  - text: Original y copia del certificado de curso formación de instructores (as) expedido por una institución
      reconocida u originales y copias de documentos que comprueben una experiencia mínima de tres años como docente
      en una institución educativa de nivel medio superior, técnico o superior; u original y copia de la constancia
      del Consejo Nacional de Normalización y Certificación de Competencias Laborales del curso Formación de Capital
      Humano.
    cites:
    - source: retys
  - text: 'Original y copia de alguno de los documentos siguientes: - Constancia o certificado vigente de la Escuela
      Nacional de Protección Civil (ENAPROC) del curso Técnico Básico en Gestión Integral de Riesgo (TBGIR), o similar
      equivalente. - Certificado de acreditación en la materia emitido por una institución educativa de nivel superior
      o por el organismo nacional de normalización de competencia laboral en materia de protección civil. - Constancia
      del Diplomado en Protección Civil emitido por una Universidad reconocida por la Coordinación Estatal.'
    cites:
    - source: retys
  - text: Carta descriptiva de los cursos a impartir, incluyendo desglose de temas, duración y método para la evaluación
      del aprovechamiento.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11531
  modes:
  - name: Presencial
    steps:
    - Acudir a las instalaciones de la Coordinación Estatal de Protección Civil cuando la convocatoria lo indique.
    - Presentar originales y copia de los requisitos establecidos.
    - Realizar pago de derechos.
    - Recoger respuesta entre los siguientes 5 a 10 días hábiles.
  notes: Particulares que quieran ejercer actividades de asesoría, capacitación, así como elaboración de programas
    internos de protección civil, estudios de vulnerabilidad y riesgos en materia de protección civil.
