scenarios:
- name: Persona interesada
  requirements:
  - text: Que el valor del inmueble objeto del contrato no exceda de las 10,000 veces el valor de UMA vigente
    cites:
    - source: retys
  - text: Anexar los documentos, fotocopia de las identificaciones oficiales con fotografía de cada una de las partes
      que intervienen en el contrato
    cites:
    - source: retys
  - text: Si alguna de estas personas es apoderado legal, exhibirá el testimonio notarial original con el cual se
      acredite su personalidad
    cites:
    - source: retys
  - text: Ingresar en la ventanilla correspondiente los documentos para su análisis, el contrato a ratificar deberá
      presentarse en ( 3 originales) que deberán acompañarse por los documentos establecidos en el artículo 38 de
      la Ley del Registro Público de la Propiedad y del Comercio
    cites:
    - source: retys
  - text: Pagar los derechos correspondientes y posteriormente comparecer en compañía de los testigos de las partes
      contratantes, el día asignado para tal efecto
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la oficina registral
    - Tomar turno para la emisión del recibo y generar el volante
    - Presentar la documentación a inscribir junto con los lineamientos para ratificación
    - Realizar el pago correspondiente en la oficina recaudadora
    - Tomar turno para ingresar el contrato con los requisitos establecidos de acuerdo a los lineamientos emitidos
      por la DRPPC
  notes: Cualquier persona física
