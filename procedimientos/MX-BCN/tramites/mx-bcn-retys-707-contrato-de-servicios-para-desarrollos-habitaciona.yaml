scenarios:
- name: Contratación Individual
  requirements:
  - text: 'Documento para comprobar la propiedad, posesión o titularidad del predio en el que se instalarán los
      servicios, puede ser UNO de los siguientes: Escrituras y carta de asignación de vivienda otorgada por el fraccionamiento
      que indique: clave catastral individual, domicilio que incluya número de la vivienda, número de cuenta del
      medidor control del desarrollo; Carta de asignación de vivienda otorgada por el INFONAVIT en la que se indique:
      clave catastral individual, domicilio que incluya número de la vivienda; Recibo del impuesto predial vigente
      (con fecha de emisión no mayor a un año de antigüedad).'
    cites:
    - source: retys
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el propietario del predio,
      puede ser UNO de los siguientes: Poder Notarial, Carta poder ante Notario Público, Corredor Público o Fedatario
      público, Carta Poder simple firmada por el propietario del predio y por dos testigos, que incluya copia de
      las identificaciones oficiales de los testigos, cuya antigüedad no exceda los seis meses.'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía del propietario del predio; y de la persona a quien éste le haya
      otorgado el poder para gestionar el servicio si es el caso, puede ser uno de los siguientes: Credencial para
      votar vigente expedida por el Instituto Nacional Electoral. Pasaporte mexicano vigente. Licencia de conducir
      vigente. Matrícula consular vigente.'
    cites:
    - source: retys
  - text: 'Pago correspondiente: Derechos de conexión pagados o convenidos.'
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en original y copia, la cual debe ser LEGIBLE y contener el DOCUMENTO
      COMPLETO
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a cualquier Centro de Atención al Público (CAP) de CESPT.
    - Pasar al área de Módulos de Atención Personalizada (MAP) y esperar su turno.
    - Cuando sea tu turno, la persona del MAP revisará que se cumpla con todos los requisitos, si no están completos,
      le informará no es posible realizar el trámite hasta que éstos se completen, indicándole que es lo que falta.
    - Con los requisitos completos, la persona del MAP elaborará el Presupuesto de Obra que corresponda al servicio
      solicitado.
    - La persona del MAP le explicará las diferentes alternativas y términos de pago disponibles
    - Elegir la opción de pago que se ajuste a sus posibilidades.
    - La persona del MAP elaborará el Contrato Administrativo correspondiente, y le hará entrega de éste y del Presupuesto
      de Obra para que los revise y los firme.
    - Firmar de conformidad los documentos que le entrega la persona del MAP.
    - 'Una vez firmados los documentos deberá pasar a cajas a realizar el pago correspondiente, en donde le entregarán
      dos documentos: Comprobante de pago y Convenio de liquidación de obra.'
  notes: Contratación Individual
- name: Contratación en paquete
  requirements:
  - text: Información de todas las viviendas que desea contrataren capturada en el FORMATO DIGITAL PARA LA CAPTURA
      DE CONTRATOS (lo puede obtener en la Coordinación de Desarrolladores y Gobierno en Oficinas Centrales de CESPT)
      , de acuerdo a lo que se indica en el mismo.
    cites:
    - source: retys
  - text: 'Documento (original y dos copias) emitido por el desarrollador de la vivienda en donde solicita la contratación
      en paquete, en el cual se debe indicar: a) cantidad de viviendas, b) número del medidor control del desarrollo
      y c) el número del DOCUMENTO DE OBRA con el que se hizo el pago de derechos de conexión. Anexo a este documento
      debe entregarse la información capturada en el FORMATO DIGITAL PARA DE CAPTURA DE CONTRATOS, de forma impresa
      y digital.'
    cites:
    - source: retys
  - text: Bitácora de obra liberada con fecha no mayor a tres meses de antigüedad.
    cites:
    - source: retys
  - text: Convenios de liquidación de obra emitidos por medio de FORMATO DIGITAL PARA DE CAPTURA DE CONTRATOS, firmados
      por cada uno de los propietarios de las viviendas a contratar.
    cites:
    - source: retys
  - text: Contratos Administrativos emitidos por medio del FORMATO DIGITAL PARA DE CAPTURA DE CONTRATOS, firmados
      por cada uno de los propietarios de las viviendas a contratar.
    cites:
    - source: retys
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el propietario del predio,
      si la persona que realiza el trámite no es el propietario, puede ser UNO de los siguientes: Poder Notarial;
      Carta poder ante Notario Público, Corredor Público o Fedatario público; Carta Poder simple firmada por el
      propietario del predio y por dos testigos, que incluya copia de las identificaciones oficiales de los testigos,
      cuya antigüedad no exceda los seis meses; Acta constitutiva en la que se acredite la personalidad de quien
      gestiona el servicio.'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio; y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio si es el caso, puede ser uno de los siguientes: Credencial
      de INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: La cuenta del medidor control del desarrollador, al corriente en sus pagos de consumo de agua.
    cites:
    - source: retys
  - text: Hacer el pago correspondiente
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la Coordinación de Desarrolladores y Gobierno en Oficinas Centrales de CESPT y entregar los requisitos
      para su revisión.
    - El ejecutivo de la Coordinación de Desarrolladores y Gobierno revisa que los requisitos estén completos, en
      caso de no ser así, informa al ciudadano que no es posible realizar el trámite hasta que éstos se completen.
    - Con todos los requisitos completos, el ejecutivo de la Coordinación de Desarrolladores y Gobierno, firmará
      el documento original mediante el cual se solicita la contratación por paquete y se lo entregará al usuario,
      así como copia del mismo.
    - Acudir al área de Archivo e ingresar el documento en original y copia mediante el cual se solicita la contratación
      por paquete.
    - La persona del área de Archivo le entrega la copia del documento mediante el cual solicita la contratación
      por paquete, a la cual le imprime la certificación de recibido que contiene el no. de folio para su seguimiento.
  notes: Contratación en paquete
