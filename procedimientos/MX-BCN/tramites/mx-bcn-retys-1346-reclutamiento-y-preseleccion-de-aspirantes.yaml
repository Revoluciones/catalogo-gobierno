scenarios:
- name: Convocatoria para ingresar a la Fuerza Estatal de Seguridad Ciudadana
  requirements:
  - text: Ser ciudadano mexicano en pleno ejercicio de sus derechos políticos y civiles
    cites:
    - source: retys
  - text: Tener una edad mínima de 21 años y máxima de 40 años
    cites:
    - source: retys
  - text: Tener una estatura mínima de 1.60 metros en hombres y 1.55 metros en mujeres, a excepción de las determinaciones
      que, previa autorización de la Secretaría de Seguridad Ciudadana del Estado, se determinen para casos particulares;
    cites:
    - source: retys
  - text: Contar con peso adecuado a la altura, con un índice de masa corporal (IMC) maximo de 34 kg/m2.
    cites:
    - source: retys
  - text: Contar con estudios mínimos de educación media superior o equivalente
    cites:
    - source: retys
  - text: En su caso, tener acreditado el Servicio Militar Nacional, y presentar baja voluntaria del ejército cuando
      así aplique;
    cites:
    - source: retys
  - text: Ser de notoria buena conducta, no haber sido condenado por sentencia irrevocable por delito doloso relacionado
      con las funciones a desempeñar;
    cites:
    - source: retys
  - text: No tener antecedentes penales por delito doloso en el país o por aquellos que se consideren como tales
      en el extranjero, ni estar sujeto a proceso penal por delito doloso;
    cites:
    - source: retys
  - text: No estar sujeto a investigación penal, bajo averiguación previa y/o carpeta de investigación;
    cites:
    - source: retys
  - text: No tener sentencia firme por la comisión intencional de delitos contra la vida y la integridad corporal;
      contra la libertad y seguridad sexuales, el normal desarrollo piscosexual; por violencia familiar, violencia
      familiar equiparada o doméstica, violación a la intimidad sexual; por violencia política contra las mujeres
      en razón de género, en cualquiera de sus modalidades y tipos;
    cites:
    - source: retys
  - text: No haber participado, favorecido o encubierto, de ninguna forma, la comisión de violaciones graves a los
      derechos humanos, no contar con historial o antecedentes de ningun tipo como victimario de violencia contra
      las mujeres, niñas, niños, adolescentes, o personas adultas mayores, ni haber cometido abuso o maltrato animal;
    cites:
    - source: retys
  - text: No estar declarada persona deudora alimentaria morosa;
    cites:
    - source: retys
  - text: No contar con Enfermedades Cronico Degenerativas (ECD), discapacidad, padecimiento o impedimento físico
      o piscológico que limite o ponga en riesgo su propia integridad física durante el desarrollo de la función
      policial;
    cites:
    - source: retys
  - text: Abstenerse de consumir sustancias psicotrópicas, estupefacientes, ú otras que produzcan efectos similares;
    cites:
    - source: retys
  - text: No contar con tatuajes antisociales en ninguna parte del cuerpo;
    cites:
    - source: retys
  - text: No utilizar accesorios en perforaciones cutáneas visibles portando el uniforme;
    cites:
    - source: retys
  - text: No estar suspendido o inhabilitado, ni haber sido destituido por resolución firme como servidor público;
    cites:
    - source: retys
  - text: No haber sido inhabilitado, separado o removido del cargo de la misma u otra institución policial;
    cites:
    - source: retys
  - text: Someterse a exámenes para comprobar la ausencia de abuso de sustancias que alteren el estado físico y
      mental, como el alcohol, sustancias psicotrópicas, estupefacientes u otras que produzcan efectos similares,
      y aprobar los procesos de Evaluaciones de Control de Confianza.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Revisar se cumpla con todos los requisitos
    - Imprimir y llenar la solicitud de trámite con tinta azul
    - 'Acudir al Departamento de Reclutamiento con los siguientes documentos en original y dos copias por ambos
      lados: Acta de nacimiento certificada (código QR), Cartilla militar liberada (varones), certificado de preparatoria,
      currículum vitae, carta de exposición de motivos, licencia de manejo tipo C (en caso de no contar con ella,
      se le entregará carta compromiso siempre y cuando sepa conducir), constancia de situación fiscal, carta de
      no inhabilitación, comprobante de domicilio vigente, 2 fotografías tamaño infantil, INE vigente, CURP, ex
      militares la carta de baja del ejército'
    - Seguir instrucciones por parte del personal de reclutamiento que le indicarán todos los pasos y tiempos de
      reclutamiento para el seguimiento del proceso
  notes: Dirigida a todas aquellas personas que deseen ingresar a la Fuerza Estatal de Seguridad Ciudadana
