title: Reclutamiento y Preseleccion de Aspirantes
summary: 'Reclutamiento y preselección de aspirantes a las siguientes modalidades: a) Fuerza Estatal de Seguridad
  Ciudadana y Escuadrón Violeta. b) Policia Municipal Preventivo. c) Agente Estatal de Investigación. d) Fuerza
  Estatal de Seguridad y Custodia Penitenciaria.'
