- name: Ciudadanía en general
  requirements:
  - text: Formato “Servicios de Salud”, debidamente requisitado
    cites:
    - source: retys
  - text: Comprobante del pago de derechos en original y dos copias simples legibles
    cites:
    - source: retys
  - text: Original y copia para cotejo del acta constitutiva o poder notarial que acredite al representante legal
    cites:
    - source: retys
  - text: Copia de la Identificación del Representante Legal o Propietario
    cites:
    - source: retys
  - text: Copia legible simple del título de médico cirujano
    cites:
    - source: retys
  - text: Copia legible simple del diploma de especialidad en radiología expedido por una institución de salud o
      académica reconocida o cédula profesional de especialidad en radiología e imagen
    cites:
    - source: retys
  - text: Copia legible simple del certificado o re-certificación vigente de especialidad, expedido por el Consejo
      Mexicano de Radiología e Imagen, A. C.
    cites:
    - source: retys
  - text: Tener permanencia mínima en el establecimiento del 25% del horario de atención al público. En caso de
      unidades médicas con turnos continuos deberá cubrir el turno con mayor carga de trabajo o bien se puede designar
      a varios responsables de la operación y funcionamiento
    cites:
    - source: retys
  - text: Dos fotografías recientes tamaño infantil (con nombre al reverso)
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Si cumple con los requisitos solicitados, se autoriza Solicitud de Permiso de Responsable de la Operación
      y Funcionamiento del Establecimiento que Utiliza Fuentes de Radiación para Fines Médicos o de Diagnóstico
  - name: Presencial
    steps:
    - Presentarse en las oficinas de la COEPRIS
    - Entregar requisitos documentales en el centro integral de servicios
    - Esperar resolución dentro de los primeros 60 dias habiles
    - Resolución definitiva
  notes: Establecimientos sujetos a regulación sanitaria
