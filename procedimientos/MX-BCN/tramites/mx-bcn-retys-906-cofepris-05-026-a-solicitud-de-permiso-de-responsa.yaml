title: COFEPRIS-05-026-A Solicitud de Permiso de Responsable de la Operación y Funcionamiento del Establecimiento
  que Utiliza Fuentes de Radiación para Fines Médicos o de Diagnóstico Modalidad A.- Rayos X
summary: Cuando se trate del ciudadano responsable del funcionamiento de equipos y establecimientos de diagnóstico
  médico que utilicen equipos generadores de radiación ionizante (rayos x) en unidades fijas o móviles para su aplicación
  en seres humanos, quedando incluidos los estudios panorámicos dentales y excluidas las aplicaciones odontológicas
  convencionales y densitometría ósea.
