- name: Representante legal
  requirements:
  - text: Presentar identificación oficial del representante legal o registro del sat.
    cites:
    - source: retys
  - text: Plantilla de personal.
    cites:
    - source: retys
  - text: Cantidad que se produce de acuerdo al giro.
    cites:
    - source: retys
  - text: Visita al usuario del servicio ya sea a través de una carta amistosa o visita de inspección.
    cites:
    - source: retys
  - text: Recibo de pago del servicio.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Se solicita factibilidad de convenio a CESPM
    - CESPM solicita información para emitir dictamen
    - Se emite dictamen a usuario
    - Si el dictamen en aprobatorio, se formaliza convenio de tratamiento conjunto.
    - Se da seguimiento mensual a las condiciones de la descarga a través de muestreos del laboratorio de CESPM.
    - Se calcula cobro por contaminantes excedidos considerando el análisis de laboratorio previos y los costos
      fijados en la ley de ingresos vigente
  notes: Carta poder notariada
