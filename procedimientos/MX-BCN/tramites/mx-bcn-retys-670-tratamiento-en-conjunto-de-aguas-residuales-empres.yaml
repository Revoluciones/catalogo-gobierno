title: Tratamiento en conjunto de aguas residuales (empresas-CESPM).
summary: Tratar las aguas residuales para que el usuario cumpla con la normatividad en los parámetros que descarga
  en forma excedida a los límites establecidos por la NOM-002-SEMARNAT-1996, en sus descargas de agua residual
