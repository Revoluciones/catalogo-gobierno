scenarios:
- name: Solicitud de Prestación de Funerales
  requirements:
  - text: Solicitud llena
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/10977
  - text: Acta de defunción del asegurado(a) (original y copia).
    cites:
    - source: retys
  - text: Certificado de designación de beneficiario(a) ante ISSSTECALI (original y copia).
    cites:
    - source: retys
  - text: Acta de nacimiento del beneficiario (a). este deberá estar en el certificado de designación de beneficiarios
      ante ISSTECALI.(original y copia).
    cites:
    - source: retys
  - text: Acta de matrimonio si el beneficiario es esposo (a). (original y copia).
    cites:
    - source: retys
  - text: Identificación Oficial del Beneficiario (a) incluidos en el certificado de designación ante ISSSTECALI
      (original y copia).
    cites:
    - source: retys
  - text: CURP de beneficiario(a).
    cites:
    - source: retys
  - text: Último talón del cheque del asegurado(a) (original y copia), solo jubilados y pensionados.
    cites:
    - source: retys
  - text: Factura de la funeraria (original y copia).
    cites:
    - source: retys
  - text: En caso de que el nombre no coincida entre el certificado y acta de nacimiento se necesitará testimonial
      de nombre ante notario público (original y copia). Y se podrán requerir documentos adicionales según el caso.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a Oficinas de Atención.
    - Solicitar en ventanilla el servicio de Solicitud de Prestación de Funerales y entregar documentación.
    - Recibir copia sellada de la documentación.
    - La información será capturada en el sistema y se realizará seguimiento a la solicitud.
    - Se comunica al ciudadano la fecha de pago en caso de proceder la solicitud. Pago de prestación sujeto a flujo
      y disponibilidad presupuestal
    - Acudir a cobrar el pago.
  notes: Beneficiario(a) designado(a) por el asegurado(a) que haya fallecido como trabajador(a). Pensionado o jubilado
    y que haya cotizado al menos 6 meses al fondo de pensiones de ISSSTECALI
