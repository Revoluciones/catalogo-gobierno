id: mx-bcn-retys-1599-devolucion-de-saldo-a-favor
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Devolución de Saldo a Favor
summary: Devolución de saldo a favor que pudiera tener un usuario por haber hecho un pago más alto a lo adeudado,
  o por diferencia en el pago de la factura anual o semestral.
authority:
  name: Comisión Estatal de Servicios Públicos de Tijuana
official_ids:
  retys_id: 1599
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/1599
  homoclave: BC-CESPT-021
who_can:
- Representante Legal
- Interesado
when: Cuando requiera del servicio.
result: Comprobante de devolución
cost:
  type: gratuito
  amount_mxn: null
  text: SIN COSTO
  as_of: '2026-11-06'
  cites:
  - source: retys
deadlines:
- what: para_prevenir
  text: 'Tiempo que tiene el organismo para prevenir: 10 Días Hábiles'
  cites:
  - source: retys
positive_silence: false
requires_inspection: false
channels:
- presencial
offices:
- municipality: Tijuana
  name: CAP Oficinas Centrales
  address: 'Blvd. Federico Benítez #4057, Col. 20 de Noviembre, Tijuana, 22430'
- municipality: Playas de Rosarito
  name: CAP Rosarito Floresta del Mar
  address: 'Blvd. Benito Juárez #385, Fracc. Hacienda Floresta del Mar, Playas de Rosarito, 22703'
scenarios:
- name: Propietario
  requirements:
  - text: Formulario para Trámites en Archivo, (lo proporciona CESPT o lo puede obtener en la página de Internet
      FRM-005), debidamente llenado y firmado por el titular de la cuenta o por la persona a quien éste le haya
      otorgado el poder para realizar el trámite.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11361
  - text: Recibo de CESPT con el cual se compruebe el pago efectuado
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio, UNO de los siguientes: Credencial
      del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en ORIGINAL Y COPIA, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público (CAP) de Oficinas Centrales o al CAP Rosarito Floresta del Mar
    - Pasar al Área de Archivo
    - Explicar a la persona de ventanilla de Archivo, que solicita una devolución de saldo y entregar los requisitos
    - La persona de Archivo revisará que los requisitos estén completos, de no ser así, le informará que no es posible
      realizar el trámite hasta que éstos se completen
    - La persona de Archivo imprime certificación de recibido a la solicitud (FRM-005) y proporciona a la persona
      solicitante el plazo de atención para recoger su cheque
    - Cuando se cumpla el plazo de atención, la persona solicitante debe acudir al área de Recepción y Pago de Facturas
      a recoger su cheque por el importe que solicitó
  notes: Propietario
- name: Representante
  requirements:
  - text: Formulario para Trámites en Archivo, (lo proporciona CESPT o lo puede obtener en la página de Internet
      FRM-005), debidamente llenado y firmado por el titular de la cuenta o por la persona a quien éste le haya
      otorgado el poder para realizar el trámite.
    cites:
    - source: retys
  - text: Recibo de CESPT con el cual se compruebe el pago efectuado
    cites:
    - source: retys
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el propietario del predio,
      puede ser UNO de los siguientes: Poder Notarial; Carta poder ante notario público, corredor público o fedatario
      público; Carta Poder simple firmada por el propietario del predio y por dos testigos, que incluya copia de
      las identificaciones oficiales de los testigos, cuya antigüedad no exceda los seis meses.'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial del INE,
      Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en ORIGINAL Y COPIA, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público (CAP) de Oficinas Centrales o al CAP Rosarito Floresta del Mar
    - Pasar al Área de Archivo
    - Explicar a la persona de ventanilla de Archivo, que solicita una devolución de saldo y entregar los requisitos
    - La persona de Archivo revisará que los requisitos estén completos, de no ser así, le informará que no es posible
      realizar el trámite hasta que éstos se completen
    - La persona de Archivo imprime certificación de recibido a la solicitud (FRM-005) y proporciona a la persona
      solicitante el plazo de atención para recoger su cheque
    - Cuando se cumpla el plazo de atención, la persona solicitante debe acudir al área de Recepción y Pago de Facturas
      a recoger su cheque por el importe que solicitó
  notes: Representante
