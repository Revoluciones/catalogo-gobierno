title: Solicitud de Presentación de la Banda de Música del Estado
summary: Que la población disfrute de las presentaciones didácticas y formales de la Banda de Música del Estado
  en eventos cívicos y culturales para su recreación.
authority:
  name: Instituto de Servicios Culturales de Baja California
