offices:
- municipality: Mexicali
  name: Coordinación Operativa de la Escuela de Música Auka
  address: 'Calzada de los Presidentes y Ciudad Victoria #s/n, Zona Río Nuevo, Mexicali, 21120'
scenarios:
- name: Ciudadania en General
  requirements:
  - text: En caso de presentaciones fuera de Mexicali, se solicitarán viáticos, traslado y hospedaje de ser necesario
    cites:
    - source: retys
  - text: Solicitud por escrito (2 semanas antes del evento mínimo)
    cites:
    - source: retys
  - text: Fotografías y cantidad de público atendido
    cites:
    - source: retys
  - text: 25 sillas, agua, sonido de acuerdo al lugar y sombra para los músicos
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Dar clic en el botón iniciar trámite.
    - Registrar datos en LlaveBC y dar continuar
    - Aparecerá formulario para solicitar la presentación de la Banda, confirmar datos de contacto
    - Adjuntar solicitud por escrito (al menos 2 semanas antes del evento)
    - El Instituto recibe y otorga respuesta
    - Banda de música se presenta al evento
    - Reporta información de público atendido y fotografías
  notes: Cuando la persona interesada desee acceder a las presentaciones didácticas de la banda
