  - text: Constancia de Situación Fiscal de la persona moral, con una fecha de emisión no mayor a 30 días de la
      solicitud.
    cites:
    - source: retys
  - text: 'Certificado de No Deudor Alimentario, no mayor a 30 días de la solicitud. Ingresa aquí (copia y pega
      en otra pestaña): (https://rnoa.dif.gob.mx/)'
    cites:
    - source: retys
  - text: Opinión de cumplimiento de obligaciones fiscales positiva (no mayor a 30 días a la entrega de la solicitud).
    cites:
    - source: retys
  - text: Estados de cuenta bancarios, mínimo 6 meses continuos, los más recientes.
    cites:
    - source: retys
  - text: 'Reporte de Buró de Crédito especial de la persona moral, no mayor a 30 días de la solicitud. Ingresa
      aquí (copia y pega en otra pestaña): (www.burodecredito.com.mx)'
    cites:
    - source: retys
  - text: Foto a color del interior, exterior y equipamiento del negocio.
    cites:
    - source: retys
  - text: Declaración anual de impuestos inmediata anterior y la última declaración de pagos provisionales o definitivos.
    cites:
    - source: retys
  - text: Estados financieros acumulados al mes anterior.
    cites:
    - source: retys
  - text: Acta constitutiva.
    cites:
    - source: retys
  - text: Copia del instrumento notarial que acredita al Representante Legal.
    cites:
    - source: retys
  - text: Cotización de acuerdo a los conceptos elegibles, no mayor a 2 meses de antigüedad, con datos fiscales
      del proveedor, dirigida al solicitante.
    cites:
    - source: retys
  - text: Copia del comprobante de domicilio particular del representante legal, no mayor a 2 meses de emisión.
    cites:
    - source: retys
  - text: Documento que acredite el uso de la propiedad (Predial, en caso de ser domicilio propio) y/o Contrato
      de Arrendamiento y/o Contrato Comodato del domicilio fiscal, entre otros)
    cites:
    - source: retys
  - text: Constancia de Situación Fiscal del representante legal, con una fecha de emisión no mayor a 30 días de
      la solicitud.
    cites:
    - source: retys
  - text: 'Reporte de Buró de Crédito especial del representante legal, no mayor a 30 días de la solicitud. Ingresa
      aquí (copia y pega en otra pestaña): (www.burodecredito.com.mx)'
    cites:
    - source: retys
  - text: Aviso de Privacidad para uso de datos personales
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14041
  - text: Aval con capacidad financiera demostrable y activa.
    cites:
    - source: retys
  - text: Copia por ambos lados de la identificación oficial vigente del aval.
    cites:
    - source: retys
  - text: 'Reporte de Buró de Crédito especial del Aval, no mayor a 30 días de la solicitud. Ingresa aquí (copia
      y pega en otra pestaña): (www.burodecredito.com.mx)'
    cites:
    - source: retys
  - text: Comprobante de ingresos del aval, de los últimos 2 meses.
    cites:
    - source: retys
  - text: Copia del comprobante de domicilio del aval, no mayor a 2 meses de emisión.
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - Llenar el pre registro en línea haciendo clic en el botón "iniciar trámite" y enviar los requisitos por ese
      medio.
    - Se programa visita domiciliaria por parte del ejecutivo de financiamiento.
    - Revisión y en su caso, autorización de la solicitud por parte del “COMITÉ”.
    - De ser aprobada la solicitud, participar en el curso informativo impartido por la “SEI” y obtener la constancia
      de acreditación.
    - Firma del contrato y formalización del crédito del beneficiario junto al aval en las oficinas de “FONDOS BC”.
    - Entrega del financiamiento en la cuenta bancaria especificada por el solicitante.
    - Una vez concluido el crédito solicitado, entrega del pagaré original y estado de cuenta para comprobar la
      totalidad del pago.
  notes: Personas morales con actividad económica, formalmente constituidas e inscritas en el “SAT” con antigüedad
    mayor a 12 meses.
