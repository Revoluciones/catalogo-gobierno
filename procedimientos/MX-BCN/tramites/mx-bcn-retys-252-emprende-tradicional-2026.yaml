id: mx-bcn-retys-252-emprende-tradicional-2026
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Emprende Tradicional 2026
summary: Programa dirigido a empresas con al menos 12 meses inscritos en la Secretaría de Hacienda y Crédito Público,
  que requieran de un financiamiento a través de un proyecto con viabilidad técnica, financiera y comercial para
  el crecimiento e impulso de su actividad empresarial.
authority:
  name: Secretaría de Economía e Innovación de Baja California
official_ids:
  retys_id: 252
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/252
  homoclave: BC-SEI-004
who_can:
- Representante Legal
- Interesado
when: Al momento que el interesado requiera acceder a un financiamiento para impulsar y consolidar la MIPYME.
result: Financiamiento de hasta $200,000.00 pesos (doscientos mil 00/100 M.N.).
cost:
  type: gratuito
  amount_mxn: null
  text: SIN COSTO
  as_of: '2026-11-06'
  cites:
