  name: CAP Rosarito Floresta del Mar
  address: 'Blvd. Benito Juárez #385, Fracc. Hacienda Floresta del Mar, Playas de Rosarito, 22703'
scenarios:
- name: Propietario
  requirements:
  - text: Formulario para Trámites en Archivo (FRM-005), debidamente llenado y firmado por el titular de la cuenta
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11300
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio, UNO de los siguientes: Credencial
      del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Hacer el pago correspondiente
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en ORIGINAL Y COPIA, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público (CAP) de Oficinas Centrales o al CAP Rosarito Floresta del Mar
    - Pasar a Cajas a realizar el pago correspondiente
    - Con el recibo de pago, ingresar a la ventanilla de Archivo los requisitos
    - La persona de Archivo revisará que se cumpla con todos los requisitos, si no están completos, le informará
      que no es posible realizar el trámite hasta que éstos se completen, indicándole que es lo que falta
    - Con los requisitos completos la persona de archivo, imprime certificación de recibido a la copia del formato
      de solicitud, en donde se indica la fecha de respuesta
    - En la fecha indicada el ciudadano debe regresar al área de Archivo a recoger la Copia Certificada que solicitó
  notes: Propietario
- name: Representante
  requirements:
  - text: Formulario para Trámites en Archivo (FRM-005), debidamente llenado y firmado por el titular de la cuenta
    cites:
    - source: retys
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el propietario del predio,
      puede ser UNO de los siguientes: Poder Notarial; Carta Poder ante notario público, corredor público o fedatario
      público; Carta Poder simple firmada por el propietario del predio y por dos testigos, que incluya copia de
      las identificaciones oficiales de los testigos, cuya antigüedad no exceda los seis meses, si la persona que
      gestiona no es el propietario'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial del INE,
      Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Hacer el pago correspondiente
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en ORIGINAL Y COPIA, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público (CAP) de Oficinas Centrales o al CAP Rosarito Floresta del Mar
    - Pasar a Cajas a realizar el pago correspondiente
    - Con el recibo de pago, ingresar a la ventanilla de Archivo los requisitos
    - La persona de Archivo revisará que se cumpla con todos los requisitos, si no están completos, le informará
