    - Con los requisitos completos la persona de archivo, imprime certificación de recibido a la copia del formato
      de solicitud, en donde se indica la fecha de respuesta
    - En la fecha indicada el ciudadano debe regresar al área de Archivo a recoger la Copia Certificada que solicitó
  notes: Representante
