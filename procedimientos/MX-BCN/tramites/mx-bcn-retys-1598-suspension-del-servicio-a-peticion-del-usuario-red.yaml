- municipality: Playas de Rosarito
  name: CAP Rosarito Floresta del Mar
  address: 'Blvd. Benito Juárez #385, Fracc. Hacienda Floresta del Mar, Playas de Rosarito, 22703'
scenarios:
- name: GENERAL
  requirements:
  - text: Formulario para trámites en archivo (FRM-005), debidamente llenado y firmado por el propietario del predio.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11352
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio, UNO de los siguientes: Credencial
      del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en original y copia, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  - text: Em propietario del predio es el único que podrá realizar la petición.
    cites:
    - source: retys
  - text: 'La instalación de reductor solo procederá cuando: La cuenta registre adeudo mayor a $300 pesos y tenga
      más de 1 mes vencido en consumo o en obra y/o 3 meses vencidos en consumo de agua.'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al Centro de Atención al Público (CAP) de Oficinas Centrales o al CAP Rosarito Floresta del Mar.
    - Pasar al Área de Archivo.
    - Ingresar en la ventanilla de Archivo los requisitos para la petición de corte.
    - La persona de Archivo revisará que los requisitos estén completos, de no ser así, le informará que no es posible
      realizar el trámite hasta que éstos se completen.
    - Si la información procede y está correcta, la persona de Archivo imprime certificación de recibido en el Formulario
      para Trámites en Archivo, proporcionando al usuario un plazo de atención.
    - Una vez cumplido el plazo de atención, el usuario deberá marcar al 073 y proporcionar la cuenta para que le
      indiquen el número de folio con el cual se realizará la instalación de reductor y/o suspensión de servicio
      según sea el caso.
  notes: General
