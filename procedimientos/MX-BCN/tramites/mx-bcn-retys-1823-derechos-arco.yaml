title: Derechos ARCO
summary: Este servicio tiene como finalidad brindar acompañamiento y guía a la comunidad universitaria y al público
  en general, para que conozcan los procedimientos, requisitos y plazos establecidos por la legislación aplicable,
  así como para resolver dudas relacionadas con el uso, resguardo y tratamiento de los datos personales en posesión
  de la institución.
