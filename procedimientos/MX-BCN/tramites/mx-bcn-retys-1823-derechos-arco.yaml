    cites:
    - source: retys
  - text: Los datos personales sobre los que se solicita acción
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - TENER USUARIO PARA INICIAR SESION EN LA PAGINA DE TRANSPARENCIA
    - INGRESAR CON EL USUARIO
    - SELECCIONAR EL APARTADO DE SOLICITUD DE DATOS PERSONALES PARA EJERCER EL DERECHO DE RECTIFICACION, CANCELACION,
      OPOSICION Y PORTABILIDAD
    - SELECCIONA LA INSTITUCION DE LA QUE SE REQUIERE INFORNACION, EN ESTE CASO LA UNIVERSIDAD INTERCULTURAL DE
      BAJA CALIFORNIA(UIBC)
    - REDACTAR LA SOLICITUD DE INFORMACION PARA POSTERIORMENTE ENVIARLA Y UNA VEZ FINALIZADO RECIBIRA UN ACUSE DE
      LA SOLICITUD FORMULADA
  notes: La Universidad, a través de su Unidad de Transparencia, ofrece el servicio de orientación y asesoría a
    las personas interesadas en conocer y ejercer sus derechos ARCO (Acceso, Rectificación, Cancelación y Oposición)
    en materia de protección de datos personales.
