scenarios:
- name: Certificado Parcial
  requirements:
  - text: Ser estudiante con estatus de baja
    cites:
    - source: retys
  - text: No contar con adeudo de ningún tipo con el plantel
    cites:
    - source: retys
  - text: Contar con plan de estudios incompleto
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir al plantel de adscripción a solicitar certificado parcial de estudios.
    - Plantel verificará que alumno se encuentre en estatus de baja y con su plan de estudios incompleto para emitir
      el certificado parcial.
    - Plantel indicará la fecha en que tendrá disponible el certificado parcial solicitado.
    - Acudir al plantel en la fecha y hora indicados para obtener certificado.
  notes: Certificado oficial que avala la estancia parcial de los estudiantes conforme a sus periodos o semestres
    cursados con calificaciones finales.
- name: Certificado de Terminación
  requirements:
  - text: Tener estatus de egresada y/o egresado.
    cites:
    - source: retys
  - text: Tener su plan de estudios completo.
    cites:
    - source: retys
  - text: No tener adeudo alguno con el plantel.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Realizar la solicitud del certificado en Control Escolar en el plantel donde se encontraba adscripto.
    - Acudir al plantel en el tiempo señalado para obtener el certificado de terminación.
  notes: Documento oficial que avala el total de las materias que la o el alumno haya cursado conforme a sus periodos.
