scenarios:
- name: Propietario
  requirements:
  - text: 'Tener listas las preparaciones para la instalación de los medidores adicionales de acuerdo a las especificaciones,
      según sea el caso, señaladas en: Instructivo de Preparación para la instalación de UN medidor adicional (INS-001),
      Instructivo de Preparación para la instalación de TRES o MÁS medidores (INS-002).'
    cites:
    - source: retys
  - text: Inspección de factibilidad positiva emitida por CESPT, la puede tramitar llamando al teléfono 073.
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio, puede ser UNO de los siguientes:
      Credencial del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: 'Si la vialidad es de ASFALTO O CONCRETO, se deberá presentar: Permiso de Ruptura de Pavimento vigente
      expedido por el Ayuntamiento correspondiente'
    cites:
    - source: retys
  - text: En caso de ser comercio o industria, presentar Alta ante la SHCP para efectos de la facturación.
    cites:
    - source: retys
  - text: Hacer el pago de derechos correspondiente.
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en ORIGINAL Y COPIA, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  - text: En caso de cambio de tarifa el usuario debe CUBRIR LA DIFERENCIA DE DERECHOS DE CONEXIÓN.
    cites:
    - source: retys
  - text: No tener adeudos con la CESPT
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Reúna los documentos requeridos. Los instructivos los puede encontrar en la sección de Documentos Informativos.
    - Contrate un plomero, que siga las indicaciones de CESPT, para hacer las preparaciones necesarias para la instalación
      del medidor o medidores.
    - Ya que se hayan realizado las preparaciones, llame al 073 para solicitar la inspección de factibilidad.
    - Si la inspección es positiva, acuda a un Centro de Atención al Público de CESPT (CAP), solicite un turno y
      espere a ser atendido en el Módulo de Atención Personalizada (MAP).
    - Cuando sea su turno la persona del MAP revisará los requisitos, si no están completos, le informará que no
      es posible realizar el trámite hasta que éstos se completen, indicándole que es lo que falta.
    - Con los requisitos completos, la persona del MAP elaborará el Presupuesto de Obra que corresponda al servicio
      solicitado.
    - La persona del MAP le explicará las diferentes alternativas y términos de pago disponibles.
    - Seleccione la forma de pago que se ajuste a sus posibilidades.
    - La persona del MAP elaborará el Contrato Administrativo correspondiente, y le hará entrega de éste y del Presupuesto
      de Obra para que los revise y los firme.
    - Firme los documentos que le entregó la persona del MAP
    - 'Una vez firmados los documentos deberá pasar a cajas a realizar el pago correspondiente, en donde le entregarán
      dos documentos: 1) Comprobante de pago y 2) Convenio de liquidación de obra.'
  notes: Todos los documentos deben presentarse en original y copia, la cual debe ser legible y contener el documento
    completo.
- name: Representante legal
  requirements:
  - text: 'Tener listas las preparaciones para la instalación de los medidores adicionales de acuerdo a las especificaciones,
      según sea el caso, señaladas en: Instructivo de Preparación para la instalación de UN medidor adicional (INS-001),
      Instructivo de Preparación para la instalación de TRES o MÁS medidores (INS-002).'
    cites:
    - source: retys
  - text: Inspección de factibilidad positiva emitida por CESPT, la puede tramitar llamando al teléfono 073.
    cites:
    - source: retys
  - text: 'Documento que confiera poder y facultades para realizar el trámite, otorgado por el propietario del predio,
      puede ser UNO de los siguientes: Poder Notarial; Carta poder ante notario público, corredor público o fedatario
      público; Carta Poder simple firmada por el propietario del predio y por dos testigos, que incluya copia de
      las identificaciones oficiales de los testigos, cuya antigüedad no exceda los seis meses.'
    cites:
    - source: retys
  - text: 'Identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a quien éste
      le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial del INE,
      Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: 'Si la vialidad es de ASFALTO O CONCRETO, se deberá presentar: Permiso de Ruptura de Pavimento vigente
      expedido por el Ayuntamiento correspondiente'
    cites:
    - source: retys
  - text: 'En caso de ser comercio o industria, presentar: Alta ante la SHCP para efectos de la facturación.'
    cites:
    - source: retys
  - text: Pago de derechos correspondiente.
    cites:
    - source: retys
  - text: Todos los documentos deben presentarse en ORIGINAL Y COPIA, la cual debe ser LEGIBLE y CONTENER EL DOCUMENTO
      COMPLETO.
    cites:
    - source: retys
  - text: En caso de cambio de tarifa el usuario debe CUBRIR LA DIFERENCIA DE DERECHOS DE CONEXIÓN.
    cites:
    - source: retys
  - text: No tener adeudos con la CESPT
    cites:
    - source: retys
