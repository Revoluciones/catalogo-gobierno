  - text: Constancia de estudios actual, credencial vigente (2026), recibo de pago del periodo actual (copia)
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Atender la inscripción en línea
    - Llenar y subir documentación requerida en el portal
    - Esperar publicación con los listados de beneficiados en las redes sociales de JUVENTUD BC para revisar si
      fuiste seleccionado
    - Estar atento a los medios de contacto que proporcionaste en tu solicitud
    - Si eres beneficiado, asiste a la entrega de apoyos el dia y la hora que el personal del Instituto te indique
  - name: Presencial
    steps:
    - Acudir con los requisitos a la oficina que les corresponda de los diferentes Municipios
    - Llenar los formatos requeridos
    - Esperar la publicación de los jóvenes seleccionados
    - Acudir por el apoyo a los eventos que se programen
  notes: Para jovenes mayores de edad de 18 a 29
