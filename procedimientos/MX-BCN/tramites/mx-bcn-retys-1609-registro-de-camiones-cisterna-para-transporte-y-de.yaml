scenarios:
- name: Registro por primera vez
  requirements:
  - text: Original y copia del formulario Solicitud de registro de camiones cisterna para transporte y descarga
      de aguas residuales sanitarias de fosa séptica (FRM-019) debidamente llenado y firmado por el propietario
      o representante legal de la empresa
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11611
  - text: Copia del Acta Constitutiva.
    cites:
    - source: retys
  - text: Copia certificada del Poder legal para actos de administración, vigente, que acredite la personalidad
      del representante legal, en caso de NO ESTAR ESTABLECIDO en el Acta Constitutiva.
    cites:
    - source: retys
  - text: 'Copia de identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a
      quien éste le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial
      del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Copia de alta ante la Secretaría de Hacienda y Crédito Público.
    cites:
    - source: retys
  - text: Copia de Tarjeta de circulación vigente del camión-cisterna que se utilizará.
    cites:
    - source: retys
  - text: Copia de Póliza de aseguranza vigente del camión-cisterna que se utilizará.
    cites:
    - source: retys
  - text: Copia de Licencia de manejo vigente de chofer que operará el camión-cisterna.
    cites:
    - source: retys
  - text: Presentar el camión cisterna para reconocimiento.
    cites:
    - source: retys
  - text: Pago de derechos correspondientes.
    cites:
    - source: retys
  - text: Las copias deben ser LEGIBLES y contener el DOCUMENTO COMPLETO.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la Coordinación de Servicios de Saneamiento, ubicada en el edificio que se encuentra en la parte
      posterior izquierda de Oficinas Centrales de CESPT, presentar los requisitos y el camión-cisterna que se utilizará
    - La persona de la Coordinación de Servicios de Saneamiento revisa que se cumpla con todos los requisitos, si
      no están completos, informa a la persona solicitante que no es posible realizar el trámite hasta que éstos
      se completen, indicándole que es lo que falta.
    - La persona de la Coordinación de Servicios de Saneamiento, hará una inspección del camión cisterna para registrar
      la capacidad de almacenamiento del mismo.
    - Con los requisitos completos, la persona de la Coordinación de Servicios de Saneamiento sellará y firmará
      de validación el original y copia del formulario Solicitud de registro de camiones cisterna para transporte
      y descarga de aguas residuales sanitarias de fosa séptica (FRM-019), los cuales entregará al solicitante,
      así como los requisitos presentados.
    - La persona encargada de la Coordinación de Servicios de Saneamiento, elaborará una Ficha de pago, y la entregará
      al solicitante para que realice el pago de derechos correspondiente.
    - Acudir al área de cajas con la Ficha de pago y hacer el pago correspondiente, la persona de cajas le entregará
      un Recibo de Pago.
    - Una vez realizado el pago, pasar al área de Archivo, presentar el Recibo de Pago y entregar todos los requisitos.
    - La persona del área de Archivo entregará al solicitante la copia del formulario Solicitud de registro de camiones
      cisterna para transporte y descarga de aguas residuales sanitarias de fosa séptica (FRM-019) con la certificación
      de recibido.
    - Posteriormente, la persona de la Coordinación de Servicios de Saneamiento contactará a la persona solicitante
      para que acuda a las oficinas a firmar el contrato y hacerle entrega del mismo.
  notes: Registro por primera vez
