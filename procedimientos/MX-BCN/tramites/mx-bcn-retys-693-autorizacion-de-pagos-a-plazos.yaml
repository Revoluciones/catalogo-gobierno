scenarios:
- name: Personas Fisicas
  requirements:
  - text: Presentar en original y copia Identificación oficial vigente.
    cites:
    - source: retys
  - text: Escrito libre ante la oficina de la Recaudación de Rentas (contribuciones Estatales que no derivan de
      actos de fiscalización) o ante la Dirección Jurídica y de Cobranza (Contribuciones Federales y Estatales que
      derivan de actos de fiscalización)
    cites:
    - source: retys
  - text: Declaraciones normales y/o complementaria
    cites:
    - source: retys
  - text: Garantía del interés fiscal
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la oficina recaudadora o dirección de recaudación, según corresponda, presentando los requisitos.
    - Efectuar el pago inicial (pagar cuando menos el 20% del monto total del crédito fiscal (persona física y persona
      moral)
    - Firmar el acta de autorización de pago a plazos.
    - Firmar el acta de garantía del interés fiscal.
  notes: Cuando el contribuyente desea pagar el adeudo en plazos debido a que no cuenta con el capital para hacerlo
    en una sola exhibición
- name: Personas Morales
  requirements:
  - text: Presentar en original y copia Identificación oficial vigente del representante legal
    cites:
    - source: retys
  - text: Escrito libre ante la oficina de la Recaudación de Rentas (Contribuciones Estatales que no derivan de
      actos de fiscalización) o ante la Dirección Jurídica y de Cobranza (Contribuciones Federales y Estatales que
      derivan de actos de fiscalización)
    cites:
    - source: retys
  - text: Declaraciones normales y/o complementaria
    cites:
    - source: retys
  - text: Garantía del interés fiscal
    cites:
    - source: retys
  - text: Presentar orginal y copia de Acta Constitutiva y/o Acta de Asamblea extraordinaria en donde se acredite
      la personalidad del representante legal
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Firmar el acta de garantía del interés fiscal.
    - Efectuar el pago inicial (pagar cuando menos el 20% del monto total del crédito fiscal (persona física y persona
      moral)
    - Acudir a la oficina recaudadora o dirección de recaudación, según corresponda, presentando los requisitos.
    - Acudir a la oficina recaudadora o dirección de recaudación, según corresponda, presentando los requisitos.
    - Firmar el acta de autorización de pago a plazos.
  notes: Cuando el contribuyente desea pagar el adeudo en plazos debido a que no cuenta con el capital para hacerlo
    en una sola exhibición
