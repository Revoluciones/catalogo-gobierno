title: Jóvenes con Corazón
summary: Se busca promover una formación integral en los jóvenes del estado a través de talleres, conferencias y
  módulos de atención en escuelas y otras instalaciones educativas ya sean públicas o privadas, fomentando su desarrollo
  y concientización sobre temas de interés.
