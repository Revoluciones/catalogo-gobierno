scenarios:
- name: Jóvenes
  requirements:
  - text: Una solicitud dirigida a la persona titular de la Director General del Instituto firmada por el Director
      del plantel, centro educativo u organismo.
    cites:
    - source: retys
  - text: La solicitud puede ser por medio de oficio, a través de correo electrónico (instituto.integral.delajuventudebc@gmail.com)
      o llamada telefónica (686 568 4009 ext 105).
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - La solicitud se entrega mediante oficio de manera presencial y también a través de correo electronico (jovenesconelcorazon.juventudbc@gmail.com)
      al Instituto de la Juventud del Estado de Baja California.
    - Se notifica por llamada telefónica a la escuela solicitante para confirmar dicha solicitud y se le proporciona
      el catálogo de pláticas preventivas que maneja el Instituto.
    - Se agenda el día, la hora, el lugar y el tema seleccionado por parte de la escuela para confirmar asistencia
      en la misma llamada o por correo electrónico.
    - El Instituto de la Juventud del Estado de Baja California proporciona las listas de asistencia para los alumnos
      y la ficha de impacto de los jóvenes participantes en la escuela en el mismo día de la plática.
    - Por parte del Instituto de la Juventud del Estado de Baja California, se proporcionará el apoyo del programa,
      que son las plâticas preventivas.
  notes: Jóvenes
