scenarios:
- name: Citas en Línea
  requirements:
  - text: Número de afiliación
    cites:
    - source: retys
  - text: Contraseña registrada
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Ingresar al portal web del Sistema Integral de servicios a afiliados (SISA) o a la aplicacion móvil " Mi ISSSTECALI"
    - Introducir número de afiliación y contraseña obtenida mediante el registro de servicio en línea
    - 'En portal web: Abrir el menú de Servicios Médicos y hacer click en tus citas. En aplicación móvil, seleccionar
      la opción Citas.'
    - Seleccionar el miembro del núcleo familiar que requiere agendar consulta.
    - Elegir la opción "Solicitar Cita", seleccionar servicio médico, fecha de cita, médico disponible y horario
      disponible
    - Utilizar la opción agendar cita para confirmar la información y proceder a registrar la cita agendada.
  notes: Asegurado
