title: Citas en Línea
summary: 'Programar una cita médica de consulta de medicina general u odontológica en su unidad médica de adscripción,
  desde la plataforma web o la aplicación móvil. Para soporte técnico: Si tiene problemas de acceso para la aplicación,
  favor de comunicarse al teléfono mostrado en la ficha de este trámite. Nota: En caso de falta de disponibilidad
  de citas, será necesario acudir a su unidad de adscripción para realizar la cita en forma presencial.'
