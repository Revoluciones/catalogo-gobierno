  modes:
  - name: Mixto
    steps:
    - 'Accede al Botón de pago UTT: en https://boton.uttijuana.edu.mx/cliente'
    - Dar clic en Inscripciones y seleccionar el tipo de trámite a realizar.
    - Ingresar datos requeridos.
    - Generar referencia de pago.
    - Realizar el pago en línea con tarjeta de débito o en la Caja de Pagos en Edificio de Rectoría con tarjeta
      de débito o de crédito.
    - Presentarse en las oficinas de atención en la UTT, según el plantel al que desea pertenecer, para entrega
      de documentación.
    - Llenar formatos de inscripción de Nuevo Ingreso.
  notes: Aspirante de nuevo ingreso que salio seleccionado para ingresar a la UTT
