scenarios:
- name: Operadores del servicio de transporte público y privado; operadores de ERT
  requirements:
  - text: Tarjeta de circulación vigente
    cites:
    - source: retys
  - text: Licencia de conducir vigente con domicilio en Baja California (correspondiente al tipo de vehículo y modalidad)
    cites:
    - source: retys
  - text: Carta de no antecedentes penales (antigüedad menor a seis meses)
    cites:
    - source: retys
  - text: Identificación oficial vigente
    cites:
    - source: retys
  - text: Examen toxicologico sin reactivos positivos (realizado en laboratorios autorizados por el Instituto, con
      antigüedad no mayor a seis meses)
    cites:
    - source: retys
  - text: Documento firmado por permisionario donde se designa como chofer sustituto. (Requisito para choferes de
      taxi libre, metropolitano, escolar, turístico y carga persona física)
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/14821
  - text: Los conductores afiliados a empresas de Redes de Transporte deberán tener cuenta de plataforma.(Uber/DiDi)
    cites:
    - source: retys
  - text: Conductores de Taxis de sitio y ruta, deberán estar dados de alta por su agrupación.
    cites:
    - source: retys
  - text: Conductores de empresas de carga (Pública y privada) deberán estar dados de alta en el padrón de su empresa.
    cites:
    - source: retys
  - text: Pago de derechos
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas del Instituto de Movilidad Sustentable y presentar la documentación requerida
  notes: Requisitos para expedición de identificación de operador
