scenarios:
- name: Consulta Dental
  requirements:
  - text: Identificación Oficial.
    cites:
    - source: retys
  - text: CURP.
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - Presentarse en el centro de salud para programar la consulta o vía telefónica.
    - Para la atención, acudir A la fecha de la cita 15 minutos antes de la hora al área de información.
    - El odontólogo otorga consulta preventiva y curativa asistencial, dependiendo de la necesidad que requiera
      el paciente
    - Dependiendo del diagnóstico y tratamiento se darán consultas a corto y/o largo plazo.
  notes: Consulta Dental
