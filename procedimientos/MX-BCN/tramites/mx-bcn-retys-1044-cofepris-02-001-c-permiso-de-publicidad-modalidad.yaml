  - text: Original y dos copias simples legibles del comprobante del pago de derechos
    cites:
    - source: retys
  - text: Medición de audiencia en la que se acredite que no existe una audiencia superior al 35% de personas entre
      4 y 12 años de edad en el programa en el cual se publicitará el producto, realizada por una entidad que no
      esté sujeta a influencia directa o indirecta del anunciante o del medio de difusión en el que se anunciará
      el producto. Esta medición deberá realizarse a través de una encuesta con representatividad nacional
    cites:
    - source: retys
  - text: El proyecto de publicidad, en dos tantos (preferentemente a color)
    cites:
    - source: retys
  - text: La documentación que dé sustento a las afirmaciones hechas en la publicidad
    cites:
    - source: retys
  - text: El número de la licencia sanitaria o del aviso de funcionamiento, en su caso (preferentemente copia de
      la licencia o del aviso)
    cites:
    - source: retys
