scenarios:
- name: Solicitud de constancia de 70% de créditos cursados
  requirements:
  - text: Estar inscrito como estudiante activo en la UIBC.
    cites:
    - source: retys
  - text: Haber cumplido con el 70% de los créditos del plan de estudios.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Estudiante solicita constancia de 70% de los créditos cursados al Departamento de Control Escolar y Servicios
      Estudiantiles
    - Presentación de padrón de unidades receptoras para que el estudiantado elija en donde realizar el Servicio
      Social
    - Elección de unidad receptora.
    - Aspirante a Servicio Social acuerda o propone las actividades a realizar en la unidad receptora con el responsable
      de la misma
    - Aspirante a Servicio Social elabora el proyecto acordado con la Unidad Receptora.
    - Presentación de la/el estudiante de la UIBC ante la Unidad Receptora
  notes: Este escenario contempla el procedimiento mediante el cual el estudiante solicita, a través del Departamento
    de Control Escolar y Servicios Estudiantiles, la constancia que acredita haber cursado al menos el 70% de los
    créditos de su plan de estudios, requisito indispensable para iniciar el proceso de servicio social.
- name: Entrega de reportes
  requirements:
  - text: Aceptación de la/el estudiante de la UIBC por la Unidad Receptora
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El estudiante entrega el reporte bimestral aprobado por la persona responsable en la Unidad Receptora al Departamento
      de Control Escolar y Servicios Estudiantiles.
    - El Departamento de Control Escolar y Servicios Estudiantiles revisa y valida el reporte bimestral entregado
      por el estudiante.
    - Al concluir las 480 horas, el estudiante entrega el reporte final con firma de validación de la Unidad Receptora.
    - El Departamento de Control Escolar y Servicios Estudiantiles revisa el reporte final y lo archiva en el expediente
      del estudiante.
  notes: La/el estudiante entrega los reportes bimestrales y final previamente aprobados por la persona responsable
    en la Unidad Receptora
- name: Constancia de Liberación
  requirements:
  - text: Haber concluido las 480 horas de Servicio Social
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El estudiante solicita la Constancia de Liberación al Departamento de Control Escolar y Servicios Estudiantiles.
    - El Departamento verifica que el estudiante haya cumplido las 480 horas de Servicio Social y los requisitos
      establecidos
    - Se expide y entrega la Constancia de Liberación al estudiante.
  notes: El Departamento de Control Escolar y Servicios Estudiantiles expide la Constancia de Liberación a la/el
    estudiante que concluyó las 480 horas de Servicio Social
