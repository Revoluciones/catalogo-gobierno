title: Servicio social
summary: Proceso mediante el cual el estudiante, que ha cumplido con el 70% de los créditos de su programa educativo,
  puede registrar y llevar a cabo su servicio social en una dependencia, institución u organización autorizada,
  con el acompañamiento del Departamento de Control Escolar y Servicios Estudiantiles. El trámite contempla la inscripción,
  seguimiento y liberación del servicio social conforme a los lineamientos institucionales y normativos vigentes.
