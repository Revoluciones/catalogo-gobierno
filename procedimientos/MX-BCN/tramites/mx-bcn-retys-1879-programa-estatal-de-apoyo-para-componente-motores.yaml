title: Programa Estatal de Apoyo para COMPONENTE MOTORES
summary: Trámite para la Recepción de Solicitudes para aplicar a los beneficios del Programa Estatal de Apoyo para
  el Sector de Pesca y Acuacultura, enfocado permisionarios del Sector para la SUSTITUCIÓN DE MOTORES DE BORDA a
  través de apoyo subsidiario en apoyo a equipamiento, mantenimiento, ordenamiento, sanidad y particularmente para
  eficientizar la operación con énfasis en el incremento o mejora de la producción, servicios y/o su comercialización.
