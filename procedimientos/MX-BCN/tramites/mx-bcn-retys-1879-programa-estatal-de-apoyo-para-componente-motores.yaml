scenarios:
- name: Subcomponente Sustitución de Motores Fuera de Borda
  requirements:
  - text: 'Escrito libre con fecha y firma mediante el cual se manifieste bajo protesta de decir verdad que quien
      llevará a cabo los trámites y procesos del PROGRAMA ante la Dependencia, cuenta actualmente con los poderes
      legales necesarios. Liga para descarga del formato correspondiente en Portal Oficial: https://www.bajacalifornia.gob.mx/sepesca/Servicios/ProgApoyo'
    cites:
    - source: retys
  - text: Solicitud de Apoyo con datos técnicos y socioeconómicos del SOLICITANTE debidamente llenada y firmada.
    cites:
    - source: retys
  - text: Identificación oficial vigente (INE, Pasaporte, Cartilla Militar).
    cites:
    - source: retys
  - text: Comprobante de domicilio (persona física, apoderado legal o representante legal) con una vigencia no mayor
      a 3 meses.
    cites:
    - source: retys
  - text: Acta Constitutiva. (aplica solo para las personas morales).
    cites:
    - source: retys
  - text: Última Acta de Asamblea donde se establece quienes ostentan actualmente los poderes y representación de
      la persona moral. (aplica solo para las personas morales).
    cites:
    - source: retys
  - text: Constancia de Situación Fiscal (Actualizada, no mayor a tres meses de antigüedad).
    cites:
    - source: retys
  - text: Cotización vigente a nombre del o la SOLICITANTE, emitida por el proveedor en donde se señalen las características
      del bien o servicio solicitado.
    cites:
    - source: retys
  - text: Permiso o concesión vigente o en trámite de renovación (SAP CONAPESCA) o Permiso de aprovechamiento extractivo
      (SEMARNAT).
    cites:
    - source: retys
  - text: Comprobante con Datos bancarios de la PERSONA BENEFICIARIA o del proveedor (Estado de cuenta emitido por
      el banco).
    cites:
    - source: retys
  - text: 'Carta compromiso del proveedor donde se compromete a surtir el equipo dentro del ejercicio fiscal vigente.
      Liga para descarga del formato correspondiente en Portal Oficial: https://www.bajacalifornia.gob.mx/sepesca/Servicios/ProgApoyo'
    cites:
    - source: retys
  - text: 'Firma de Formato de Carta de Adhesión del representante legal o persona física al PROGRAMA y Modalidad
      MOTORES FUERA DE BORDA. Liga para descarga del formato correspondiente en Portal Oficial: https://www.bajacalifornia.gob.mx/sepesca/Servicios/ProgApoyo'
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Registro de Solicitud en Línea
    - Cargar Documentos Requisitos
    - Validación de Expediente para Asignación de Folio Estatal del Programa
    - Dictaminación de Expediente
    - Integración de Comprobación de aplicación del Recurso de Apoyo y Finiquito de Expediente
  notes: Sustitución de Motores Fuera de Borda El Apoyo podrá utilizarse para destinarse a la adquisición de motor
    fuera de borda, nuevo, con Potencia Nominal de hasta 115 HP, en sustitución de un motor que se encuentre en
    uso actualmente. El Motor a adquirir deberá ser nuevo, de 4 tiempos, coincidir con el caballaje autorizado en
    el permiso presentado y con la solicitud presentada. No se aceptará aumento en caballaje, con la única excepción
    que alguna marca específica descontinuó la potencia; en este caso, podrá revisarse si se autoriza el caballaje
    inmediato superior, esto será a Consideración del Comité Técnico del Programa.
