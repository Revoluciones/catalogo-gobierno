id: mx-bcn-retys-1682-cirugia-de-estrabismo
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Cirugía de Estrabismo
summary: Se realiza un pequeña incisión para alargar o recortar los músculos que mueven el globo ocular.
authority:
  name: Unidad de Especialidades Médicas de Baja California
official_ids:
  retys_id: 1682
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/1682
  homoclave: BC-UNEME-014
who_can:
- Interesado
when: Cuando se confirme el diagnóstico de estrabismo por la o el médico tratante.
result: Atención médica especializada en oftalmología
cost:
  type: gratuito
  amount_mxn: null
  text: SIN COSTO
  as_of: '2026-11-06'
  cites:
  - source: retys
deadlines:
- what: respuesta_autoridad
  text: 'Tiempo que tiene el organismo para resolver: 5 Días Hábiles'
  cites:
  - source: retys
positive_silence: false
requires_inspection: false
channels:
- presencial
offices:
- municipality: Mexicali
  name: Dirección de Unidad Quirúrgica
  address: 'Avenida Olimpus #S/N, Plutarco Elías Calles, Mexicali, 21376'
- municipality: Ensenada
  name: Dirección de Unidad Quirúrgica
  address: 'Avenida Gastelum #1340, Zona Centro, Ensenada, 22800'
scenarios:
- name: Derechohabientes del IMSS-BIENESTAR
  requirements:
  - text: Hoja de derivación debidamente llenada y sellada, que le proporciona el centro de salud y/u Hospital General.
    cites:
    - source: retys
  - text: Historia clínica, exámenes de laboratorio, reporte de la valoración cardiopulmonar cuando proceda y demás
      estudios de gabinete que procedan de acuerdo a la intervención quirúrgica, que le proporcionan en el centro
      de salud y/u Hospital General
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial (INE, pasaporte o licencia de manejo).
    cites:
    - source: retys
  - text: Carta de consentimiento informado para cirugía y anestesia, que se le entrega en UNEME antes de la cirugía.
      Firma el paciente o su familiar responsable.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la consulta en el establecimiento que le corresponda
    - Se le miden signos vitales, se realiza entrevista médica y exploración física. Se deriva a consulta de oftalmología
      si es necesario.
    - Acudir a la consulta con el especialista
    - El especialista realizará una entrevista, exploración física y examen de agudeza visual. Se deriva a UNEME
      si es necesario
    - Contactar al ciudadano, indicándole fecha, hora y cuidados previos a la cirugía
    - Acudir a UNEME con un acompañante, identificarse y entregar los requisitos
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la cirugía, trasladar al quirófano y, después del procedimiento, dar instrucciones
      para el cuidado y alta.
  notes: Derechohabientes de los Servicios de Salud del Instituto Mexicano del Seguro Social para el Bienestar
- name: Derechohabientes IMSS, ISSSTE e ISSSTECALI
  requirements:
  - text: Nota médica de referencia de la unidad IMSS, ISSSTE o ISSSTECALI, según sea el caso, que incluya resultados
      de laboratorio de respaldo
    cites:
    - source: retys
  - text: Hoja de derivación debidamente llenada y sellada, que le proporciona el IMSS, ISSSTE o ISSSTECALI, según
      corresponda.
    cites:
    - source: retys
  - text: Carta de consentimiento informado para anestesia y cirugía, que se le entrega en UNEME el día de la cirugía
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial (INE, pasaporte o licencia de conducir).
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la consulta en el establecimiento que le corresponda
    - Se le miden signos vitales, se realiza entrevista médica y exploración física. Se deriva a consulta de oftalmología
      si es necesario.
    - Acudir a la consulta con el especialista
    - El especialista realizará una entrevista, exploración física y examen de agudeza visual. Se deriva a UNEME
      si es necesario
    - Contactar al ciudadano, indicándole fecha, hora y cuidados previos a la cirugía
    - Acudir a UNEME con un acompañante, identificarse y entregar los requisitos
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la cirugía, trasladar al quirófano y, después del procedimiento, dar instrucciones
      para el cuidado y alta.
  notes: Derechohabientes del Instituto Mexicano del Seguro Social, del Instituto de Seguridad y Servicios Sociales
    de los Trabajadores del Estado y del Instituto de Seguridad y Servicios Sociales de los Trabajadores del Gobierno
    y Municipios del Estado de Baja California
- name: Gestión y apoyo ciudadano, Bienestar/DIF
  requirements:
  - text: Oficio de autorización del apoyo ciudadano, proporcionado por la Secretaría de Bienestar del Gobierno
      del Estado.
    cites:
    - source: retys
  - text: Valoración médica de oftalmología y medicina interna emitida por los especialistas de la UNEME.
    cites:
    - source: retys
  - text: Análisis de laboratorio
    cites:
    - source: retys
  - text: Carta de consentimiento informado, que se le entrega en UNEME antes de la cirugía
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir las oficinas del Desarrollo Integral de la Familia (DIF) para solicitar el apoyo
    - Si procede, acudir a las oficinas de la Secretaría de Bienestar, presentando los requisitos que le indiquen
      en DIF
    - Si procede, contactar al ciudadano por teléfono para indicar fecha y hora para una consulta de oftalmología
    - Acudir a consulta de oftalmología en la UNEME
    - Si se confirma el diagnóstico, se le indica al ciudadano los estudios de laboratorio a realizar y se programa
      cita para valoración por medicina interna
    - Acudir a consulta de medicina interna con los resultados de los análisis de laboratorio
    - Si el ciudadano es candidato a cirugía, se programa en la agenda quirúrgica
    - Contactar al ciudadano, indicándole fecha, hora y cuidados previos a la cirugía
    - Acudir a UNEME, con un acompañante, identificarse y firmar la carta de consentimiento informado.
    - Cambiarse a bata hospitalaria
    - Preparar al paciente para la cirugía, trasladar al quirófano y, después del procedimiento, dar instrucciones
      para el cuidado y alta.
  notes: Convenio Bienestar/DIF-UNEME para apoyo a personas sin seguridad social
