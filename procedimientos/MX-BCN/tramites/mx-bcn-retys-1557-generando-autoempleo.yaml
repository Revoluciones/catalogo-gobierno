scenarios:
- name: Ciudadania en general
  requirements:
  - text: Copia de identificación oficial con fotografía. (credencial para votar, pasaporte mexicano, licencia de
      conducir emitida en el estado de baja california, vigente y que señale domicilio).
    cites:
    - source: retys
  - text: Copia de comprobante de domicilio con antigüedad no mayor a 3 meses (agua, energía eléctrica, predial
      u otros) o carta de residencia emitida por autoridad municipal.
    cites:
    - source: retys
  - text: 'Cotización vigente o factura del proveedor dirigida al Gobierno del Estado de Baja California. deberá
      contener como mínimo: razón social, nombre comercial, RFC, domicilio fiscal, así como el presupuesto detallado
      de los bienes o productos cotizados (cantidad, descripción, precio unitario, importe, subtotal, IVA (si aplica)
      y total).'
    cites:
    - source: retys
  - text: Fotografía de la actividad que desempeñe
    cites:
    - source: retys
  - text: Copia de la Clave Única de Registro de Población (CURP)
    cites:
    - source: retys
  - text: Cédula de situación fiscal del proveedor.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
