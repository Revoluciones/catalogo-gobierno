scenarios:
- name: Orientación sobre servicios de la Comisión de Arbitraje Médico
  requirements:
  - text: Identificación oficial
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Ingresar a la página oficial de la comisión.
    - Seleccionar la opción de solicitar una orientación.
    - Completar información solicitada.
    - Seleccionar enviar.
    - Esperar respuesta de la Comisión.
  - name: Presencial
    steps:
    - Acudir a oficina con identificación oficial.
    - Exponer su asunto a persona que atiende.
    - Recibe información o pasa con Médico Conciliador.
  notes: Dirigido a ciudadanía en general cuando tiene necesidad de recibir orientación sobre las funciones y atribuciones
    de la Comisión de Arbitraje Médico del Estado y/o sobre la entidad pública o privada a la cual corresponda su
    inconformidad, atención inmediata, el servicio se puede brindar de manera telefónica, en línea o de manera presencial,
    sin costo alguno
