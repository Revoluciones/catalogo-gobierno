scenarios:
- name: Persona física con Actividad Empresarial/Persona Moral
  requirements:
  - text: Solicitud de Estímulo del Agua.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/13835
  - text: Cédula de Solicitud de Estímulo del Agua.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/13836
  - text: Copia simple del Acta Constitutiva, y Poder vigente del representante legal.
    cites:
    - source: retys
  - text: Documento que acredite la personalidad del solicitante, cuando tramite en representación de otra persona
      y, en todos los casos, cuando se trate de persona moral.
    cites:
    - source: retys
  - text: Comprobante del último pago efectuado por concepto de suministro de agua.
    cites:
    - source: retys
  - text: Cédula de Identificación Fiscal vigente.
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - El interesado descarga la Solicitud de Estímulo del Agua y la Cédula de Solicitud.
    - El interesado recaba la información y documentación.
    - 'El interesado remite la información (a través de ventanilla única o correo electrónico: igdiaz@baja.gob.mx).'
    - La SEI tiene 5 días hábiles para realizar alguna observación o validar los documentos.
    - La SEI remite documentos a la CESP correspondiente.
    - La CESP correspondiente tiene 15 días hábiles para emitir un dictamen técnico.
    - La CESP correspondiente remite a la SEI el dictamen técnico.
    - La SEI tiene 5 días hábiles para emitir opinión técnica.
    - La SEI remite opinión técnica a la Procuraduría Fiscal.
    - La Procuraduría Fiscal tiene 20 días hábiles para emitir la resolución.
  notes: Documentación necesaria para iniciar el trámite.
