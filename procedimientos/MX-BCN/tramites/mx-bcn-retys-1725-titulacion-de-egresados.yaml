- municipality: Ensenada
  name: Unidad Académica Ensenada
  address: 'Avenida de las Flores s/n Carretera 1 a La Bufadora #s/n, Maneadero, Ensenada, 22790'
scenarios:
- name: Egresados de TSU, Licenciatura e Ingeniería
  requirements:
  - text: Acta de nacimiento original
    cites:
    - source: retys
  - text: Certificado de Bachillerato o su equivalente
    cites:
    - source: retys
  - text: Copia de la Clave Única de Registro de Población (CURP)
    cites:
    - source: retys
  - text: 4 fotografías tamaño título y 5 fotos tamaño infantil con enfoques de 2 pulgadas de acercamiento a la
      cámara, usar ropa clara (blusa o camisa lisa, sin lentes, sin barba) papel mate
    cites:
    - source: retys
  - text: Pago por concepto de trámite de titulación y derechos federales
    cites:
    - source: retys
  - text: Liberación de memoria de Estadía
    cites:
    - source: retys
  - text: Copia del formato de recibo de documento recepcional
    cites:
    - source: retys
  - text: 'Constancias de no adeudo de: Administración, Biblioteca, Vinculación y Coordinación Operativa de Servicios
      Escolares'
    cites:
    - source: retys
  - text: Toma de protesta firmada
    cites:
    - source: retys
  - text: Para Carreras de Técnico Superior Universitario en Modalidad BIS deberán acreditar el Certificado ITEP
      de acuerdo al nivel requerido
    cites:
    - source: retys
  - text: Contar con firma electrónica del Sistema de Administración Tributaria (e. Firma)
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - 'Accede al Botón de pago UTT: en https://boton.uttijuana.edu.mx/cliente'
    - Dar clic a Titulaciones y seleccionar el tipo de trámite.
    - Ingresar datos requeridos.
    - Realizar el pago en línea (https://boton.uttijuana.edu.mx/cliente) y/o en la Caja de Pagos en Edificio de
      Rectoría con tarjeta de débito o de crédito.
    - Elaborar recibo de trabajo recepcional.
    - Obtener los sellos correspondientes en el recibo de trabajo recepcional.
    - Entregar el recibo de trabajo recepcional y a las oficinas de atención.
    - Presentarse en las oficinas de atención de la UTT para entrega de documentación.
  notes: Egresados de TSU, Licenciatura e Ingeniería que quieren titularse
