title: 'COFEPRIS-01-007-C Solicitud de certificado para apoyo a la exportación Modalidad C: Solicitud de certificado
  para exportación de conformidad de buenas prácticas sanitarias - [EXCEPTO SUPLEMENTOS ALIMENTICIOS, FÓRMULAS PARA
  LACTANTES, DE CONTINUACIÓN Y PARA NECESIDADES ESPECIALES DE NUTRICIÓN, BEBIDAS TONIFICANTES (AQUELLAS QUE CONTIENEN
  TAURINA Y/O GLUCURONOLACTONA Y/O CAFEÍNA).'
summary: Cuando el ciudadano requiera realizar una exportación que se encuentre domiciliada en territorio nacional
  y solicite que esta comisión federal para la protección contra riesgos sanitarios certifique que su empresa elabore
  sus productos siguiendo los lineamientos de las buenas prácticas sanitarias.
