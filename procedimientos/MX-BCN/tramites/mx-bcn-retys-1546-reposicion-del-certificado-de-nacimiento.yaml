scenarios:
- name: Por daño o extravío hasta los seis meses del nacimiento
  requirements:
  - text: Identificación oficial del padre o tutor
    cites:
    - source: retys
  - text: Denuncia de hechos por daño o extravío ante el ministerio público.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Presentar los documentos requeridos en la Unidad Hospitalaria del lugar de nacimiento
    - Personal de la Unidad Hospitalaria realizara la entrega de certificado de nacimiento
  notes: Reposición de certificado de nacimiento por daño o extravío hasta los seis meses del nacimiento
