title: Reposición del Certificado de Nacimiento
summary: Obtener una copia del documento que hace constar el nacimiento de un producto vivo y las circunstancias
  que acompañaron el hecho, en caso de extravío o robo del certificado de nacimiento original. Asistir A la clínica
  o servicios de salud a solicitar la copia del certificado de nacimiento.
