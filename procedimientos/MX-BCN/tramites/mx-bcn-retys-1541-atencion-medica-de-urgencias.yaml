scenarios:
- name: Consulta de urgencias
  requirements:
  - text: Identificación oficial con fotografía
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - En caso de requerir consulta de urgencias un familiar del enfermo o lesionado deberá acudir a la ventanilla
      del área de urgencias a solicitar el servicio.
    - Personal de salud en el área de triage, determinará el grado de riesgo de acuerdo al clasificador de prioridades
      de atención y dará acceso al enfermo o lesionado al área de observación, a efecto de que el médico proporcione
      atención inmediata.
    - Dependiendo de la clasificación que se haya determinado en el área de triage el paciente ingresará al área
      de urgencias para recibir atención inmediata por el personal médico.
  notes: Atención médica inmediata al usuario o usuaria con enfermedades crónicas que requieran estabilización,
    así como enfermedades o lesiones en estado grave con riesgo de comprometer la vida.
