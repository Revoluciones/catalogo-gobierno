scenarios:
- name: CONSTANCIA DE ESTUDIOS
  requirements:
  - text: pagina del SIAA alumnos con su numero de matricula
    cites:
    - source: retys
  - text: pago de la constancia de estudios
    cites:
    - source: retys
  - text: obtener en el mismo momento y una vez que se descargue debera imprimir y/o guardarla,ya que cuenta cn
      24 horas despues deabrir el documento.,
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Podrá solicitar la constancia en el horario que se requiera
    - Deberá contar con tarjeta bancaria para realizar el trámite
    - En el caso de que no cuente con tarjeta bancaria deberá imprimir recibo de pago para presentarse en ventanilla
      del banco y proceder al pago
    - Deberá subir el recibo de pago para continuar con el trámite de obtención de constancia
    - Si en el caso de que presente un problema para obtener la constancia, presentarse en el área de recursos financieros
      de la UPBC
    - Una vez que haya abierto el archivo de la constancia de estudios, tendrá 24 horas para grabar o archivar el
      documento
  notes: CONSTANCIA DE ESTUDIOS PARA ESTUDIANTES QUE LO SOLICITEN, EL CUAL LO PUEDEN OBTENER DE LA PAGINA DE SIAA
    ALUMNOS, TIENEN UN PLAZO DE 24 HRS. PARA SU IMPRESION Y UNA VEZ ABIERTO DEBERAN DESCARGARLO
