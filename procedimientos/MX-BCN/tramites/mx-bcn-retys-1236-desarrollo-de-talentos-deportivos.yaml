title: Desarrollo de Talentos Deportivos
summary: Proporcionar a las niñas, niños y jóvenes de 7 a 17 años de edad, detectados como talentos deportivos,
  los métodos y medios necesarios para la práctica deportiva de forma sistemática y con seguimiento técnico-metodológico
  con el apoyo de entrenadores, médicos y especialistas en las ciencias aplicadas al deporte, psicólogos deportivos
  y preparadores físicos.
