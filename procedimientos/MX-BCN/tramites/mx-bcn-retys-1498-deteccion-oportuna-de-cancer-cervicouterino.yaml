scenarios:
- name: Detección Oportuna Cáncer Cervicouterino
  requirements:
  - text: Prueba de Papanicolau (para mujeres con vida sexual activa o antecedentes de haber tenido vida sexual
      entre 25 y 34 años).
    cites:
    - source: retys
  - text: Pruebas de virus de papiloma humano para las mujeres de 35 a 64 entran en el esquema de detección.
    cites:
    - source: retys
  - text: No estar menstruando el día de su cita.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Solicitar cita para consulta médica directamente en la unidad de salud a la que se vaya a acudir.
    - Acudir A la fecha y hora programada.
    - Se le informará a usuaria asistir al lugar, fecha y hora aproximada de entrega de resultados.
    - Deberá regresar para entrega de resultados y/o tratamiento en su caso.
  notes: Proceso para la Detección de Cáncer Cervicouterino
