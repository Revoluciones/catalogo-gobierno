id: mx-bcn-retys-1498-deteccion-oportuna-de-cancer-cervicouterino
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Detección Oportuna de Cáncer Cervicouterino
summary: Proporcionar atención con enfoque preventivo para la aplicación de las pruebas de tamizaje necesarias para
  el diagnóstico temprano, tratamiento efectivo y seguimiento adecuado de las mujeres afectadas para cáncer de cuello
  uterino, con la cual podamos disminuir el porcentaje de población enferma y el porcentaje de mortalidad por la
  causa de esta enfermedad. Para ello se recomienda que las mujeres entre 25 y 34 años se realicen la prueba de
  papanicolau (citología cervical). Para las mujeres de 35 A 64 años entran en el esquema de detección con prueba
  de virus papiloma humano.
authority:
  name: Instituto de Servicios de Salud Pública del Estado de Baja California
