who_can:
- Interesado
when: El papanicolau o citología cervical, se realiza anualmente y después de dos exámenes normales consecutivos,
  se debe realizar cada tres años.
result: Prueba de VPH se tendrá un periodo de espera de resultados de 4 semanas, aproximadamente.
