title: ESR X la Juventud
summary: Es una herramienta que le facilita a los jovenes a conseguir sus propios patrocinios con empresas y el
  Instituto de la Juventud se hace responsable de hacer la factura de deducible, así como la entrega del apoyo al
  joven.
