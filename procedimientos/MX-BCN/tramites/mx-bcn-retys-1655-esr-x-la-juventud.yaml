  address: 'BLVD. Adolfo López Mateos y Calzada Milton Castellanos #S/N, Fraccionamiento Caliss, Mexicali, 21010'
scenarios:
- name: Jovenes
  requirements:
  - text: Tener de 12 a 29 años de edad
    cites:
    - source: retys
  - text: Solicitud de apoyo en formato libre, a menos que se especifique lo contrario de parte de la Dirección
    cites:
    - source: retys
  - text: Copia de identificación
    cites:
    - source: retys
  - text: CURP
    cites:
    - source: retys
  - text: Comprobante de domicilio con antigüedad no mayor a 3 meses (recibo de luz)
    cites:
    - source: retys
  - text: Comprobante de la actividad que se estå realizando para la cual el joven solicita el donativo (invitación,
      constancia,carta de aceptación,etc.)
    cites:
    - source: retys
  - text: Presupuesto, cotización y en su caso lo que se le solicite, en un cuadro sencillo que es realizado por
      el joven con el costo de las cosas que solicita
    cites:
    - source: retys
  - text: Formato ESR-EM-01
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12778
  - text: Formato ESR-JO-01
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/12782
  modes:
  - name: Presencial
    steps:
    - Acudir a las Oficinas del Instituto de la Juventud
    - Llenar y entregar documentación en el momento.
    - Una vez presentada la solicitud cada joven se hace responsable de buscar sus propios patrocinadores
    - Una vez que el joven tenga al patrocinador (es), enviar a la empresa los formatos ESR-EM-01 y ESR-JO-01, su
      constancia de situación fiscal y el comprobante de depósito el INJUVE hace la factura deducible para la empresa
      y la trasferencia bancaria para el joven solicitante
    - 'Nota: el formato ESR-EM-01 y ESR-JO-01 se envían a través de correo electrónico o en el momento que viene
      a solicitar el apoyo.'
  notes: Facilitar donativos económicos a las juventudes de Baja California en coordinación con el sector privado
