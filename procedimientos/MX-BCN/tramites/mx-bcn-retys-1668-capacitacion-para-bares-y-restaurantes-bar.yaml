  modes:
  - name: Presencial
    steps:
    - Presentar solicitud requisitada
    - Se revisa la solicitud y documentación; posteriores a 3 días hábiles se da respuesta para seguimiento
    - Se entrega oficio y ficha de pago
    - Entregar recibo de pago
    - Se inscribe al interesado para tomar el curso (aprobación de curso 90% asistencia y acreditar exámenes)
    - Una vez terminado el curso se expide constancia acreditación
  notes: El establecimiento presenta solicitud de inscripción del empleado que tomará el curso, acompañado de acta
    de nacimiento, identificación oficial con fotografía y curp.
