scenarios:
- name: Primera vez
  requirements:
  - text: Original y copia del formulario Solicitud del servicio de dotación de agua residual tratada (FRM-008)
      debidamente llenado y firmado por el propietario o el representante legal, lo proporciona CESPT o lo puede
      obtener en la página de Internet de CESPT en Solicitud del servicio de dotación de agua residual tratada (FRM-008),
      las instrucciones para el llenado del formulario las puede obtener en la página de Internet de CESPT en INS-003.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11646
  - text: Copia del Acta Constitutiva
    cites:
    - source: retys
  - text: 3. Copia certificada del Poder legal para actos de administración, vigente, que acredite la personalidad
      del representante legal, en caso de NO ESTAR ESTABLECODO en el Acta Constitutiva.
    cites:
    - source: retys
  - text: 'Copia de identificación oficial con fotografía, VIGENTE, del propietario del predio y de la persona a
      quien éste le haya otorgado el poder para gestionar el servicio, puede ser UNO de los siguientes: Credencial
      del INE, Pasaporte mexicano, Licencia de conducir, Matrícula consular.'
    cites:
    - source: retys
  - text: Copia de alta ante la Secretaría de Hacienda y Crédito Público
    cites:
    - source: retys
  - text: Croquis de localización con descripción de colindancias hacia los cuatro puntos cardinales
    cites:
    - source: retys
  - text: Pagar los derechos correspondientes
    cites:
    - source: retys
  - text: Las copias deben ser LEGIBLES y contener el DOCUMENTO COMPLETO
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la Coordinación de Servicios de Saneamiento, ubicada en el edificio que se encuentra en la parte
      posterior izquierda de Oficinas Centrales de CESPT y presentar los requisitos.
    - La persona de la Coordinación de Servicios de Saneamiento revisa que se cumpla con todos los requisitos, si
      no están completos, informa a la persona solicitante que no es posible realizar el trámite hasta que éstos
      se completen, indicándole que es lo que falta.
    - Con los requisitos completos, la persona de la Coordinación de Servicios de Saneamiento sellará y firmará
      de validación el original y copia del formulario Solicitud del servicio de dotación de agua residual tratada
      (FRM-008), la cual entregará al solicitante junto con todos los requisitos.
    - La persona de la Coordinación de Servicios de Saneamiento, elaborará la Ficha de pago, la cual entregará al
      solicitante para que realice el pago de derechos correspondiente en cajas.
    - Acudir al área de Cajas con la Ficha de pago y realizar el pago correspondiente, la persona de Cajas le entregará
      un Recibo de Pago.
    - Pasar al área de Archivo, presentar el Recibo de pago y entregar todos los requisitos.
    - La persona del área de Archivo entregará al solicitante la copia del formulario Solicitud del servicio de
      dotación de agua residual tratada (FRM-008) con la certificación de recibido.
    - Posteriormente, la persona de la Coordinación de Servicios de Saneamiento contactará a la persona solicitante
      para que acuda a las oficinas a firmar el contrato y hacerle entrega del mismo.
  notes: Primera vez
