title: Preinscripción al Sistema Estatal de Música
summary: Que niñas, niños y jóvenes con aptitudes e interés en el desarrollo de las artes musicales aprovechen la
  oportunidad de iniciación de calidad dentro de las orquestas infantiles y juveniles del Sistema Estatal de Música
  del Instituto de Servicios Culturales de Baja California.
