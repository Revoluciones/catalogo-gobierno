  address: 'Calzada Cuahtémoc #384, Las Fuentes, Mexicali, 21230'
scenarios:
- name: Requisitos
  requirements:
  - text: Ser niña, niño o adolescente.
    cites:
    - source: retys
  - text: Firmar la lista de asistencia, concluida la sesión de fomento a la lectura.
    cites:
    - source: retys
  - text: Llenar registro de préstamo en caso de ser necesario.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Presentarse en la dependencia ó comunicarse vía telefónica a solicitar la atención.
    - Proponer fecha de interés para recibir el servicio.
    - Cotejar agenda comprometida con la fecha solicitada.
    - Confirmar o descartar la fecha solicitada.
    - Presentarse el día y hora pactados para brindar el servicio.
    - Identificar que el lugar cuente con el espacio adecuado para estacionar el autobús.
    - Brindar el servicio.
    - Firmar y sellar lista de asistencia.
    - En caso de solicitar préstamo de libro deberá llenar registro de préstamo.
  notes: 'El servicio no requiere requisitos documentales, sin embargo, es necesario cumplir con lo siguiente:'
