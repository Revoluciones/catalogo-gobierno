kind: tramite
title: Libro Bus
summary: Promover el gusto por la lectura entre niñas, niños, adolescentes y juventudes, mediante una biblioteca
  móvil que acerca libros y actividades recreativas a los espacios escolares y comunitarios, con la finalidad de
  contribuir al desarrollo educativo, emocional y creativo de las y los beneficiarios.
