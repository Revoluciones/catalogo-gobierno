title: Talleres de Huertos Escolares y Comunitarios
summary: Implementar huertos escolares y comunitarios para la producción de alimentos (verdura fresca) como parte
  de un abordaje integral de la alimentación correcta y fortalecimiento de las acciones de orientación alimentaria
  de los programas alimentarios. con la finalidad de fomentar una cultura de hábitos alimentarios saludables y sustentable
  a los grupos de desarrollo y escolares.
