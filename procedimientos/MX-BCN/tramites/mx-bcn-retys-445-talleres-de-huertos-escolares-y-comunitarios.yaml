scenarios:
- name: Ciudadania en general
  requirements:
  - text: Pertenecer alguno de los programas de asistencia social alimentaria y desayunos escolares
    cites:
    - source: retys
  - text: En caso de no pertenecer a los programas, se debe hacer una solicitud vía oficio a la jefatura de desarrollo
      nutricional del servicio orientación y educación alimentaria de las escuelas y/o dependencias que no forman
      parte del padrón de beneficiarios
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Solicitar que se les proporcione el servicio a traves de un oficio dirigido a la Titular del DIF BC.
    - El departamento de Apoyos Alimentarios y Desarrollo Nutricional, evalua la solicitud.
    - En caso de autorizar la solicitud, se agenda el servicio.
    - Se confirma la asistencia con el solicitante del servicio.
    - Se brinda la capacitación de orientación y educación alimentaria, en la fecha acordada.
  notes: Recopilación de documentos para el servicio
