scenarios:
- name: Ciudadanía en general
  requirements:
  - text: Llenar lista de asistencia (cuando se reciba el servicio)
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Presentarse en la dependencia o comunicarse via telefónica para solicitar la atención
    - Dar conocer los temas del catálogo de Pláticas de Frente por medio de visita presencial, llamadas telefónicas
      o vía correo electrónico.
    - En caso de mostrar interés sugiere fecha y hora probable para recibir el servicio.
    - Coteja con la agenda comprometida para verificar disponibilidad.
    - Una vez confirmada disponibilidad en agenda se pacta fecha y hora de inicio y se establece cronograma de atención
      de acuerdo con la cantidad de sesiones y asistentes.
    - Se acuerda el espacio donde se brindará el servicio, mismo que deberá contar preferentemente con corriente
      eléctrica que permita conectar cañón y equipo de cómputo, así mismo mobiliario adecuado a fin de que los adolescentes
      y jóvenes permanezcan sentados.
    - Brinda el servicio en la fecha y horarios acordados.
    - Terminada la platica lleva a cabo la firma y sello de documentos probatorios de haber recibido el servicio.
    - Concluido el servicio, se retira del lugar
  notes: Recopilación de documentos para el servicio
