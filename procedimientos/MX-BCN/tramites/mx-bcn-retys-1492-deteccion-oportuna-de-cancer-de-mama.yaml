scenarios:
- name: Exploración clínica de mamas
  requirements:
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Solicitar cita para consulta médica directamente en la unidad de salud y acudir a la hora y fecha programada
    - Médico realiza técnica de la exploración clínica de mamas e indica al ciudadano el seguimiento correspondiente
  notes: Atención con enfoque preventivo para la aplicación de las pruebas de tamizaje necesarias para la detección
    y diagnóstico temprano
- name: Mastografía
  requirements:
  - text: CURP
    cites:
    - source: retys
  - text: Identificación Oficial
    cites:
    - source: retys
  - text: Asistir A su cita con aseo normal de la región axilar y mamaria
    cites:
    - source: retys
  - text: No utilizar desodorante, talco en polvo, crema o loción debajo de los brazos o en las mamas el día del
      examen
    cites:
    - source: retys
  - text: De preferencia y para su comodidad, use ropa de dos piezas ya que se le pedirá que se quite la ropa de
      la cintura para arriba
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Solicitar Cita Previa a Los Teléfonos del Programa en Mexicali (686) 554-31-38 y 554-51-44, al Whats App (686)
      164-22-74 , Tijuana 664) 688 -38 -04 Ext 2149, 2150, 2133, Ensenada (646) 178.67.30, Vicente Guerrero (616)
      166.39.56 Ext. 6107
    - Presentarse a su cita en la fecha y hora programada
    - Médico radiólogo le explicará y realizará el procedimiento de la toma de la mastografía
    - Al finalizar el procedimiento, el personal de salud le informará cuánto tiempo tardará su resultado, y en
      donde lo recibirá
    - De los 40 a los 69 años, las mujeres deben realizar su mastografía bianual, solicitala en tu unidad de salud,
      hospital más cercano o directamente al programa.
  notes: Es el estudio radiográfico mediante el uso de equipo especializado llamado mastógrafo, se utiliza para
    buscar anormalidades en la mama, ayuda A detectar el cáncer en sus etapas iniciales, cuando aún no es palpable
    por el personal médico o por usted misma
