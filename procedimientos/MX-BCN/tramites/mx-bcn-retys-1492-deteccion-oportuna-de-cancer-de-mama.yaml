title: Detección Oportuna de Cáncer de Mama
summary: Proporcionar atención con enfoque preventivo para la aplicación de las pruebas de tamizaje necesarias para
  el diagnóstico temprano, tratamiento efectivo y seguimiento adecuado de las mujeres afectadas para cáncer de mama,
  con la cual podamos disminuir el porcentaje de población enferma y el porcentaje de mortalidad por la causa de
  esta enfermedad.
