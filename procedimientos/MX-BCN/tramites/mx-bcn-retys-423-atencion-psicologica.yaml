summary: Brindar atención Psicológica a las y los Jóvenes de 12 a 29 años, logrando de esta forma que pongan en
  práctica habilidades adaptativas y eficientes que le ayuden a solucionar, enfrentar, manejar, superar o prevenir
  posibles atenuantes en contra de su salud mental.
