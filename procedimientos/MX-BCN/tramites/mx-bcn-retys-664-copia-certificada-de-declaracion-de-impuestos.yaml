title: Copia Certificada de declaración de impuestos
summary: La expedición de copia certificada de algún documento que obre en los archivos de las recaudaciones de
  rentas del estado, propio del contribuyente, siempre y cuando el motivo que declare justifique razonablemente
  el hecho de no contar con el original del mismo.
