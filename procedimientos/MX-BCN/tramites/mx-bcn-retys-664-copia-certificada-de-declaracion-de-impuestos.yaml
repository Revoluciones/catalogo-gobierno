scenarios:
- name: Copias certificadas de declaraciones de pago de Impuestos
  requirements:
  - text: Copia de comprobante de domicilio fiscal, no mayor a 3 meses de antigüedad
    cites:
    - source: retys
  - text: Original y copia de IDENTIFICACIÓN OFICIAL con fotografía vigente (INE, pasaporte mexicano vigente, cédula
      profesional, matrícula consular, cartilla militar y/o licencia de conducir) del contribuyente (persona física/moral).
    cites:
    - source: retys
  - text: Copia del Registro Federal de Contribuyentes (RFC)
    cites:
    - source: retys
  - text: Fecha del impuesto declarado y periodo
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - El contribuyente deberá acudir a la Recaudación de Rentas y dirigirse al área de cajas o ventanilla única.
    - El servidor público de la recaudación atenderá al contribuyente que solicita obtener una(s) copia certificada.
    - El servidor público solicitará al contribuyente la información para iniciar el trámite.
    - El servidor público deberá informar al contribuyente que la entrega del documento solicitado se realizará
      de 3 a 5 días hábiles.
    - El servidor público solicitará al contribuyente el pago correspondiente del trámite solicitado
    - Una vez procesado el cobro y certificado el documento solicitado mediante firma del recaudador titular de
      dicha oficina, el servidor público entregará el original del documento al contribuyente en el tiempo estipulado.
    - Terminado lo anterior el contribuyente se retira de la Recaudación de Rentas.
  notes: Proporcionar a todo contribuyente que lo solicite, copia certificada de sus declaraciones que obran en
    los archivos de la Recaudación de Rentas del Estado, siempre que correspondan al contribuyente.
