  address: 'Boulevard Benito Juárez y L. Montejano #1, Esteban Cantú, Mexicali, 21260'
- municipality: Tijuana
  name: Impacto Ambiental
  address: 'Dos Oriente #16, Parque Ciudad Industrial, Tijuana, 22444'
- municipality: Ensenada
  name: Impacto Ambiental
  address: 'Carretera Transpeninsular Ensenada-La Paz #6500, Ex-Ejido Chapultepec, Ensenada, 22785'
scenarios:
- name: Persona física
  requirements:
  - text: Formato para presentar el informe preventivo debidamente requisitado conforme a su instructivo.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/4371
  - text: Resumen ejecutivo.
    cites:
    - source: retys
  - text: Copia simple de la identificación oficial de la persona interesada, legible y con vigencia activa.
    cites:
    - source: retys
  - text: Copia simple del Registro Federal de Contribuyentes de la persona interesada.
    cites:
    - source: retys
  - text: Original y copia del comprobante de pago de los derechos a nombre de la persona interesada.
    cites:
    - source: retys
  - text: En caso de que se actúe a través de apoderado o representante legal, presentar documental completa y nítida
      de la representación legal y copia de su identificación oficial vigente
    cites:
    - source: retys
  - text: CD o USB que contenga la totalidad de la información presentada en el informe preventivo.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas de la Secretaría para presentar el trámite.
    - Recepción y evaluación de la solicitud.
    - Publicación de la resolución o solicitud de información adicional
    - Recolectar el oficio o solventar los requerimientos de información adicional
  notes: Persona interesada que pretende realizar una obra o actividad que requiere ser evaluada en materia de impacto
    ambiental.
- name: Persona moral
  requirements:
  - text: Formato para presentar el Informe Preventivo debidamente requisitado y firmado.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/11081
  - text: Resumen ejecutivo.
    cites:
    - source: retys
  - text: Acta Constitutiva, completa y legible.
    cites:
    - source: retys
  - text: Copia simple del Registro Federal de Contribuyentes
    cites:
    - source: retys
  - text: Original y copia del comprobante de pago de los derechos a nombre de la moral.
    cites:
    - source: retys
  - text: Documental idónea, completa y nítida, mediante la cual se acredite al apoderado o representante legal
      como tal, vigente.
    cites:
    - source: retys
  - text: Copia simple de la identificación oficial de apoderado o representante legal, legible y con vigencia activa.
    cites:
    - source: retys
  - text: CD o USB que contenga la totalidad de la información presentada en el informe preventivo.
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las oficinas de la Secretaría para presentar el trámite.
    - Recepción y evaluación de la solicitud.
    - Publicación de la resolución o solicitud de información adicional.
    - Recolectar el oficio o solventar los requerimientos de información adicional.
  notes: Sociedad civil o mercantil, organismo gubernamental, ejido y todo ente creado por el derecho que pretenda
    realizar una obra o actividad que requiere ser evaluada en materia de impacto ambiental.
