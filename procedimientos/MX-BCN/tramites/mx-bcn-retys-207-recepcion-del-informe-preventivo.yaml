country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Recepción del Informe Preventivo
summary: Evaluación del documento denominado Informe Preventivo, a fin de obtener una autorización en materia de
  impacto ambiental, para el desarrollo de una obra o actividad regulada por el estado.
authority:
  name: Secretaría de Medio Ambiente y Desarrollo Sustentable de Baja California
official_ids:
  retys_id: 207
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/207
  homoclave: BC-SMADS-031
who_can:
- Representante Legal
when: Cuando se requiera evaluar el impacto ambiental de una obra o actividad.
result: Resolución Administrativa en materia de Impacto Ambiental.
cost:
  type: variable
  amount_mxn: 9804.24
  text: 'COSTO VARIABLE: $9,804.24 Moneda Nacional. Costo actualizado para el mes de noviembre 2026'
  as_of: '2026-11-06'
  cites:
  - source: retys
