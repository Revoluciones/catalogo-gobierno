- what: respuesta_autoridad
  text: 'Tiempo que tiene el organismo para resolver: 45 Días Hábiles'
  cites:
  - source: retys
- what: otro
  text: 'Tiempo que tiene el usuario para responder prevención: 5 Días Hábiles'
  cites:
  - source: retys
- what: para_prevenir
  text: 'Tiempo que tiene el organismo para prevenir: 45 Días Hábiles'
  cites:
  - source: retys
- what: vigencia
  text: Regularmente es indefinida.
  cites:
  - source: retys
positive_silence: false
