scenarios:
- name: Expedición de licencias de conducir
  requirements:
  - text: Cita
    cites:
    - source: retys
  - text: Solicitud del trámite (formato de manifiesto que se captura en la Recaudación de Rentas)
    cites:
    - source: retys
  - text: 'Presentar en original y copia identificación oficial con fotografía vigente : INE, pasaporte mexicano
      vigente, cédula profesional, matrícula consular, cartilla militar. (Si el INE presentado cuenta con domicilio
      actual, no se requiere presentar comprobante de domicilio)'
    cites:
    - source: retys
  - text: Presentar en original y copia comprobante de domicilio a nombre del interesado, no mayor a tres meses
      de antigüedad
    cites:
    - source: retys
  - text: Presentar en original y copia certificado médico, expedido por institución pública o privada de salud,
    cites:
    - source: retys
  - text: Presentar y aprobar exámenes teórico y práctico de manejo, con un vehículo apropiado a la licencia solicitada
      que cuente con tarjeta de circulación vigente (original y copia)
    cites:
    - source: retys
  - text: 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito
      (excepto tarjetas American Express )'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Para agendar una cita accede a https://citas.ebajacalifornia.gob.mx/, selecciona tu municipio de residencia
      y llena la información requerida, descarga el comprobante de cita para que conozcas el día, la hora y el lugar
      para realizar el trámite
    - Acudir a las oficinas de Recaudación de Rentas del Estado que corresponda con el municipio de su domicilio
    - Solicitar trámite presentando documentos en ventanilla
    - Toma de datos, las 10 huellas digitales y fotografía
    - Pasar a área médica en caso de no traer certificado médico
    - Presentar exámenes teórico y práctico de manejo, con un vehículo apropiado a la licencia solicitada que cuente
      con tarjeta de circulación vigente (original y copia).
    - 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito (excepto
      tarjetas American Express )'
    - Recoger licencia de conducir
  notes: Colaborar con el ciudadano para cumplir con los requisitos establecidos para que obtenga su licencia de
    conducir, con la certeza de que se trata de un documento obtenido legalmente y buscando la seguridad en el manejo
    de vehículos automotor, con la protección individual como de terceros.
- name: Expedición de licencias para menores de edad.
  requirements:
  - text: Cita
    cites:
    - source: retys
  - text: Solicitud del trámite (formato de manifiesto que se captura en la recaudación de rentas)
    cites:
    - source: retys
  - text: 'Acreditar identidad (presentado en original y copia de alguno de los siguientes documentos: constancia
      de estudios, pasaporte mexicano vigente, matrícula consular o en caso de ser extranjero forma expedida por
      el Instituto Nacional de Migración.'
    cites:
    - source: retys
  - text: Acreditar edad (haber cumplido 16 o 17 años de edad con los siguientes documentos acta de nacimiento,
      pasaporte mexicano vigente, curp, matrícula consular o en caso de ser extranjero forma expedida por el Instituto
      Nacional de Migración.
    cites:
    - source: retys
  - text: Presentar copia de comprobante de domicilio no mayor a tres meses de antigüedad
    cites:
    - source: retys
  - text: Certificado médico, expedido por institución pública o privada de salud, que acredite que es apto para
      conducir vehículos (original y copia)
    cites:
    - source: retys
  - text: El padre, madre o tutor debe acompañar al menor de edad y presentar carta responsiva por escrito (original
      y copia).
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/10904
  - text: Presentar y aprobar exámenes teórico y práctico de manejo, con un vehículo apropiado a la licencia solicitada
      y que cuente con tarjeta de circulación vigente (original y copia).
    cites:
    - source: retys
  - text: 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito
      (excepto tarjetas American Express )'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Para agendar una cita accede https://citas.ebajacalifornia.gob.mx/, selecciona tu municipio de residencia
      y llena la información requerida, descarga el comprobante de cita para que conozcas el día, la hora y el lugar
      para realizar el trámite
    - Acudir a las oficinas de Recaudación de Rentas del Estado que corresponda con el municipio de su domicilio
    - Solicitar trámite presentando documentos en ventanilla
    - Toma de datos, las 10 huellas digitales, lectura del iris de ojos y fotografía
    - Pasar a área médica en caso de no traer certificado médico
    - Presentar exámenes teórico y práctico de manejo, con un vehículo apropiado a la licencia solicitada que cuente
      con tarjeta de circulación vigente (original y copia).
    - 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito (excepto
      tarjetas American Express )'
    - Recoger licencia de conducir
  notes: Expedición de licencias para ciudadanos de 16 a 17 años.
- name: Expedición de licencias de conducir para choferes.
  requirements:
  - text: Cita
    cites:
    - source: retys
  - text: Solicitud del trámite (formato de manifiesto que se captura en la Recaudación de Rentas)
    cites:
    - source: retys
  - text: Presentar en original y copia identificación oficial con fotografía vigente (INE, pasaporte mexicano vigente,
      cédula profesional, matrícula consular, cartilla militar. (ORIGINAL Y COPIA)
    cites:
    - source: retys
  - text: Presentar en original y copia comprobante de domicilio no mayor a tres meses de antigüedad
    cites:
    - source: retys
  - text: Certificado médico, expedido por institución pública o privada de salud, (original y copia)
    cites:
    - source: retys
  - text: Acreditar no haber sido condenado por sentencia ejecutoriada por manejar vehículo de motor en estado de
      ebriedad o bajo el influjo de drogas o enervantes en los últimos cinco años (carta de no antecedentes penales)
    cites:
    - source: retys
  - text: Presentar examen antidoping
    cites:
    - source: retys
  - text: Certificado de estudios con fotografía (mínimo contar con certificado de primaria), este requisito solo
      aplica para licencias tipo B y D
    cites:
    - source: retys
  - text: Presentar y aprobar exámenes teórico y práctico de manejo, con un vehículo apropiado a la licencia solicitada
