scenarios:
- name: Personas Fisicas
  requirements:
  - text: Contar con cita ( solo aplica si el trámite es en Recaudación de Rentas del Estado en Tijuana Vía Rápida,IMOS,Cerro
      Colorado y Mexicali)
    cites:
    - source: retys
  - text: Presentar el vehículo de que se trate para su verificación
    cites:
    - source: retys
  - text: Presentar en original y copias pedimento en el que conste la legal importación del vehículo cuando el
      mismo es de procedencia extranjera
    cites:
    - source: retys
  - text: Presentar en original y copia factura de empresas comerciales dedicadas a la compra y venta de vehículos
      usados en la que se identifique el vehículo en su individualidad.
    cites:
    - source: retys
  - text: Presentar en original y copia licencia de conducir vigente del Estado. En caso de que se cuente con alguna
      discapacidad o impedimento para conducir presentar la licencia de conducir vigente de la persona que autorice
      para conducir.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/10627
  - text: Presentar en original y copia seguro de responsabilidad civil vigente.
    cites:
    - source: retys
  - text: Acreditar la propiedad del vehículo
    cites:
    - source: retys
  - text: Presentar copia de la identificación oficial vigente del enajenante (INE, pasaporte mexicano, cartilla
      del servicio militar nacional o matrícula consular)
    cites:
    - source: retys
  - text: 'Realizar el pago. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito (excepto tarjetas
      American Express )'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la dependencia con el vehículo para verificar número de serie
    - Pasar a módulo de altas y cambios de propietario para revisión de documentos
    - Se procede a revisión de documentos
    - 'Hacer el pago de los derechos e impuestos correspondientes y recoger opciones de pago: efectivo, cheque certificado,
      tarjeta debito/crédito (excepto tarjetas american express)'
    - Una vez concluido el pago le entregan su tarjeta de circulación y debe dirigirse a ventanilla de entrega de
      placas y solicitar sus nuevas placas.
  notes: Registrar en el padrón vehicular los cambios de propiedad solicitados por los nuevos propietarios de vehículos
    con domicilio en Baja California
- name: Personas Morales
  requirements:
  - text: Contar con cita (solo aplica si el trámite es en Recaudación de Rentas del Estado en Tijuana Vía Rápida,IMOS,Cerro
      Colorado y Mexicali)
    cites:
    - source: retys
  - text: Presentar en original y copias pedimento en el que conste la legal importación del vehículo cuando el
      mismo es de procedencia extranjera
    cites:
    - source: retys
  - text: Presentar en original y copia factura de empresas comerciales dedicadas a la compra y venta de vehículos
      usados en la que se identifique el vehículo en su individualidad.
    cites:
    - source: retys
  - text: Presentar en original y copia licencia de conducir vigente del Estado. En caso de que se cuente con alguna
      discapacidad o impedimento para conducir presentar la licencia de conducir vigente de la persona que autorice
      para conducir.
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/10641
  - text: Presentar en original y copia comprobante de domicilio no mayor a tres meses de antigüedad.
    cites:
    - source: retys
  - text: Presentar en original y copia identificación oficial del representante (vigente (INE, pasaporte mexicano,
      cartilla del servicio militar nacional o matrícula consular) y documentación en la que conste la personalidad
      de quien comparece
    cites:
    - source: retys
  - text: 'Presentar en original y copia: escritura constitutiva y cédula de identificación fiscal del registro
      federal de contribuyentes.'
    cites:
    - source: retys
  - text: Presentar en original y copia seguro de responsabilidad civil vigente.
    cites:
    - source: retys
  - text: Acreditar la propiedad del vehículo
    cites:
    - source: retys
  - text: Presentar copia de la identificación oficial vigente del enajenante (INE, pasaporte mexicano, cartilla
      del servicio militar nacional o matrícula consular)
    cites:
    - source: retys
  - text: 'Realizar el pago correspondiente. Opciones de pago: efectivo,cheque certificado, tarjeta debito/crédito
      (excepto tarjetas American Express )'
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la dependencia con el vehículo para verificar número de serie
    - Pasar a módulo de altas y cambios de propietario para revisión de documentos
    - Se procede a revisión de documentos
    - 'Hacer el pago de los derechos e impuestos correspondientes y recoger opciones de pago: efectivo, cheque certificado,
      tarjeta debito/crédito (excepto tarjetas american express)'
    - Una vez concluido el pago le entregan su tarjeta de circulación y debe dirigirse a ventanilla de entrega de
      placas y solicitar sus nuevas placas.
  notes: Registrar en el padrón vehicular los cambios de propiedad solicitados por los nuevos propietarios de vehículos
    con domicilio en Baja California
