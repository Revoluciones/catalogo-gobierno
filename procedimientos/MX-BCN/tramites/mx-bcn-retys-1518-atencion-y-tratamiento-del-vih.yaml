  modes:
  - name: Presencial
    steps:
    - Acudir al CAPASITS a solicitar cita o por medio de vía telefónica
    - Para la atención, acudir 15 minutos antes de la hora de la cita, con sus documentos.
    - Inicia consulta, consejería y tratamiento integral
    - Realiza surtimiento de receta médica
  notes: Citas subsecuentes a los pacientes que ya son tratados con CAPASITS
