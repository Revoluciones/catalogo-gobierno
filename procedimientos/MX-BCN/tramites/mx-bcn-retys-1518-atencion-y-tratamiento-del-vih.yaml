scenarios:
- name: Aplicación de prueba rápida para la detección del virus de inmunodeficiencia humana (VIH)
  requirements:
  - text: CURP
    cites:
    - source: retys
  - text: Identificación oficial
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a solicitar el servicio de aplicación de prueba rápida
    - Se otorga consejería con psicólogo o trabajador social
    - Se aplica la prueba
    - Otorga resultados de prueba en el tiempo indicado e indica el seguimiento y tratamiento integral correspondiente
      de ser necesario
  notes: Proporcionar el servicio para la detección, prevención y atención especializada de pacientes con virus
    de inmunodeficiencia humana (VIH)
- name: Seguimiento a los pacientes
  requirements:
  - text: CURP.
