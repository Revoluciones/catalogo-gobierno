summary: Aplicar la prueba rápida para la detección del virus de inmunodeficiencia humana (VIH), con el propósito
  de realizar el diagnóstico confirmatorio oportuno de la enfermedad, proporcionar el tratamiento efectivo y supervisión
  médica que le permita tener una mejor calidad de vida, así como la consejería pre y post aplicación de prueba
  rápida. Atención de PrEP y PEP
