    steps:
    - Atiende los requerimientos de la convocatoria
    - Llene la ficha de inscripción (disponible en el apartado de documento informativo)
    - Adjunta copia de acta de nacimiento o identificación oficial a la ficha de inscripción. (Lo que mencione la
      convocatoria)
    - Adjunta copia de partitura a ficha de inscripción
    - Se realiza el evento
    - Jurado dictamina y entrega al Instituto de Cultura lista de ganadores
    - Se anuncia a los ganadores
