    - source: retys
  - text: Copia de la Clave Única de Registro de Población (CURP)
    cites:
    - source: retys
  - text: Copia de comprobante de domicilio no mayor a 3 meses de antigüedad
    cites:
    - source: retys
  - text: Cotización a nombre de gobierno del estado de Baja California, del material, equipo, herramientas o insumos.
