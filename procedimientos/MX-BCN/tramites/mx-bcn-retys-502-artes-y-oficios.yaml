      de los cursos o talleres
    cites:
    - source: retys
  - text: Copia de constancia de situación fiscal del proveedor
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a las instalaciones de la Secretaria de Bienestar o a los espacios asignados para el registro con la
      documentación solicitada
    - Realizar entrevista y llenado de formato único junto con personal de la Secretaría del Bienestar
    - Evaluación de la solicitud por parte del personal
    - Notificación por teléfono al solicitante que se le brindará el apoyo
  notes: Requisitos para el apoyo
- name: Beneficiarias del programa tarjeta violeta
