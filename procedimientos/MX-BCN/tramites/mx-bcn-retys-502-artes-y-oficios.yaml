    cites:
    - source: retys
  - text: Llenado de formato único de la representante del grupo
    cites:
    - source: retys
  - text: Copia de la identificación oficial vigente con domicilio en Baja California (INE)
    cites:
    - source: retys
  - text: Copia de comprobante de domicilio con antigüedad no mayor a 3 meses
    cites:
    - source: retys
  - text: Copia de Clave Única de Registro de Población (CURP)
    cites:
    - source: retys
  - text: Listado de beneficiarias de la tarjeta violeta inscritas en el curso o taller, la cual deberá estar firmada
      por las beneficiarias y el personal a cargo de la Tarjeta Violeta
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
