scenarios:
- name: estudiante solicita baja en el sistema SIAA
  requirements:
  - text: formato de baja, generado por el SIAA
    cites:
    - source: retys
  - text: recabar sellos de no adeudos por las areas de finanzas y directores de cada programa academico
    cites:
    - source: retys
  - text: entregar formato al depto. de gestión escolar para su baja y entrega de documento.
    cites:
    - source: retys
  modes:
  - name: Mixto
    steps:
    - estudiante ingresa al sistema SIAA para solicitar baja, del cual se genera una hoja de no adeudo
    - estudiante imprime documento de baja para recabar sellos de no adeudos, por parte del depto. de finanzas y
      drectores de area academico que corresponde
    - depto de finanzas recibe solicitud de baja y revisa en el sistema que no cuente con algún adeudo, si no cuenta
      procede a sellar documento
    - depto. de finanzas, si estudiante cuenta con adeudo se le notifica para que proceda a pagarlo y proceder a
      sellar.
    - estudiante, se presenta con el director de su programa academico para el sello correspondiente de talleres
      y laboratorio
    - estudiante procede a presentar hoja al depto. de gestión escolar para su baja y entrega de documento.
  notes: estudiante solicita su baja ante el sistema SIAA, pero deberá reunir requisitos
