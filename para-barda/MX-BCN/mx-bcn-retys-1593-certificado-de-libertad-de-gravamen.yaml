scenarios:
- name: GENERAL
  requirements:
  - text: Documento de Certificado de Libertad de Gravamen expedido por el H. Ayuntamiento correspondiente.
    cites:
    - source: retys
  - text: Si el predio tiene servicio contratado, presentar comprobante de pago de derechos y/o, obra o ambos acreditando
      que se encuentra al corriente
    cites:
    - source: retys
  - text: 'Documento para ubicación del predio, que puede ser uno de los siguientes: - Levantamiento topográfico,
      - Deslinde catastral, - Croquis de ubicación.'
    cites:
    - source: retys
  - text: Comprobante de pago
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acuda al Centro de Atención al Público (CAP) en las Oficinas Centrales de CESPT o al CDP CANACO.
    - Pase al área de Cajas, a pagar el trámite.
    - La persona de cajas entregará su comprobante de pago.
    - Pasar a la ventanilla de Certificados de Libertad de Gravamen y entregar los requisitos.
    - La persona de ventanilla revisa que los requisitos estén completos, en caso de no ser así, informa al ciudadano
      que no es posible realizar el trámite hasta que éstos se completen, indicando lo que falta.
    - Con los requisitos completos, la persona de ventanilla sella de recibido el comprobante de Pago.
    - Regresar a la ventanilla de Certificados de Libertad de Gravamen a los 5 u 8 días hábiles según corresponda.
  notes: GENERAL
