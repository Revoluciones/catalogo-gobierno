scenarios:
- name: Personas físicas
  requirements:
  - text: Realizar el pago de derechos correspondientes
    cites:
    - source: retys
  - text: Llenar el formato FMO-8.5.1-02 con la Información correspondiente
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Ingresar a la página https://rppcweb.ebajacalifornia.gob.mx/portalbc/produccion/portalapp/index.html o dar
      clic en "iniciar trámite" en la parte inferior derecha
    - Seleccionar la opción de copias certificadas
    - Pagar los derechos correspondientes
    - El usuario recibe sus copias certificadas por correo electrónico
  - name: Presencial
    steps:
    - Acudir a la oficina registral
    - Tomar turno para la elaboración del recibo
    - Llenar la solicitud debidamente en el formato FMO-8.5.1-02
    - Realizar el pago en cajas de recaudación de rentas
    - Tomar turno para ingresar la solicitud
    - Recoger el trámite en el tiempo en que se asigne el volante
  notes: Para la certificación de algún documento del archivo registral
