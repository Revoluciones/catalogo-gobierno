id: mx-bcn-retys-542-inscripcion-de-gravamen
country: MX
jurisdiction: MX-BCN
inegi_code: '02'
level: estatal
branch: ejecutivo
kind: tramite
title: Inscripción de Gravamen
summary: Acto mediante el cual se inscribe el gravamen sobre el predio, departamento o local, garantizando el adeudo
  al acreedor para que conste en los archivos registrales ante terceros.
authority:
  name: Dirección del Registro Público de la Propiedad y del Comercio
official_ids:
  retys_id: 542
  retys_url: https://retys.bajacalifornia.gob.mx/Portal/TyS/542
