who_can:
- Representante Legal
- Interesado
- Tutor
- Otro
when: Cuando el o los inmuebles cuentan con un gravamen de carácter hipotecario
result: Inscripción o anotación de gravamen
cost:
  type: variable
  amount_mxn: null
  text: 'COSTO VARIABLE: EL costo del servicio es de acuerdo al valor del gravamen que puede ser (embargo civil
    o mercantil).'
  as_of: '2026-11-06'
  cites:
  - source: retys
