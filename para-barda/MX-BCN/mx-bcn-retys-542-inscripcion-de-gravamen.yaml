- municipality: Playas de Rosarito
  name: Registral
  address: 'Av. Jose Haros Aguilar #2004, Fraccionamiento Villa Turística, Playas de Rosarito, 22707'
scenarios:
- name: Personas físicas
  requirements:
  - text: Presentar el título o documento en el que consta el gravamen, el cual deberá contener el nombre del acreedor
      y deudor, datos de inscripción, número de manzana, lote, local, departamento, colonia, fraccionamiento o poblado
      donde se ubique y monto gravable
    cites:
    - source: retys
  - text: Cubrir previamente los derechos correspondientes en la caja recaudadora
    cites:
    - source: retys
  - text: El tramite es entregado de acuerdo a la fecha que se asigna al volante
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la oficina registral
    - Tomar turno para entregar a la ventanilla asignada el pago y el formato de información
    - Presentar la documentación a inscribir de acuerdo a los lineamientos establecidos por la DRPPC
    - Realizar el pago correspondiente en la oficina recaudadora
    - Tomar turno para ingresar la solicitud
    - Entrega del trámite de acuerdo a la fecha asignada al volante
  notes: Para la inscripción o anotación de gravámen
