summary: La Alerta Registral del Registro Público de la Propiedad y de Comercio de Baja California es un servicio
  de monitoreo que permite a los propietarios recibir notificaciones cuando existe algún movimiento o trámite relacionado
  con un inmueble registrado a su nombre.
