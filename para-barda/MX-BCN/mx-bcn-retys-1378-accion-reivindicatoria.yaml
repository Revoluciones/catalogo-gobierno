title: Acción Reivindicatoria
summary: La Acción Reivindicatoria es un trámite que puede realizar una persona cuando es dueña de una casa, terreno
  u otro inmueble, pero otra persona lo ocupa sin tener un permiso o derecho legal para hacerlo. Este trámite se
  utiliza cuando el propietario necesita recuperar su bien y demostrar que es el dueño legítimo, para que la autoridad
  ordene la devolución del inmueble.
