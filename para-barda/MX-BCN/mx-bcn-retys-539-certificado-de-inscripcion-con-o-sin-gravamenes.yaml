scenarios:
- name: Persona físicas
  requirements:
  - text: Llenar formato de solicitud de certificaciones correctamente FMO-8.5.1-02
    cites:
    - source: retys
    form_url: https://retys.bajacalifornia.gob.mx/Portal/DescargarFormato/1942
  - text: Cubrir previamente los derechos
    cites:
    - source: retys
  modes:
  - name: En línea
    steps:
    - Ingresar a la página haciendo clic en el botón "iniciar trámite" ubicado en la parte inferior derecha
    - Seleccionar la opción certificado de libertad de gravámenes
    - Seleccionar el tipo de consulta
    - Generar recibo para pago en línea, se coloca el correo electrónico
    - En un plazo de 5 días el trámite llegara vía correo electrónico
  - name: Presencial
    steps:
    - Acudir a la oficina registral
    - Llenar el formato FM0-8.5.1-02
    - Solicitar el volante de pago
    - Acudir a las oficinas de recaudación para realizar el pago del servicio solicitado
    - Presentarse con el volante pagado el día que el servidor público haya señalado como fecha de entrega
  notes: Para la obtención del Certificado de Inscripción con o sin gravamenes
