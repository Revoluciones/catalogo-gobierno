title: Certificado de Inscripción con o sin Gravámenes
summary: Documento en donde consta la descripción de un predio, departamento o local que se encuentra inscrito en
  los archivos registrales, en el que se detalla si este se encuentra libre o con gravamen (embargos, hipotecas,
  crédito. etc.)
