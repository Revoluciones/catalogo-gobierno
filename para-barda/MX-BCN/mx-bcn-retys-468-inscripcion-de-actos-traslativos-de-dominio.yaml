scenarios:
- name: Personas físicas
  requirements:
  - text: Acudir a nuestras oficinas con el contrato, título o escritura a inscribir y con los requisitos que marcan
      los lineamientos para su inscripción
    cites:
    - source: retys
  - text: Realizar el pago de derechos
    cites:
    - source: retys
  modes:
  - name: Presencial
    steps:
    - Acudir a la oficina registral o acudir con el notario que el usuario desee
    - Tomar turno para entregar a la ventanilla asignada el pago y el formato de información
    - Proporcionar en la ventanilla asignada todos los documentos que integran el expediente del acto traslativo
      a inscribir
    - Pagar los derechos correspondientes
    - El trámite se entrega de acuerdo a la fecha que se asigne al volante
  notes: Para dar publicidad frente a terceros de los actos celebrados entre el contratante ( compraventa, donaciones,
    cesiones )
