title: Inscripción de Actos Traslativos de Dominio
summary: Acto mediante el cual un documento que cumple con las formalidades legales y que conste el derecho real
  personal, se incorpora en el libro o archivo electrónico correspondiente del Registro público dejando constancia
  de su existencia.
