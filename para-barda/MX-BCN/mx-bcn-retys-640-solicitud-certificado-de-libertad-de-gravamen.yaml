  modes:
  - name: Presencial
    steps:
    - Presentar el certificado de libertad de gravamen fiscal en nuestra oficina del municipio correspondiente para
      su debido sello
    - En caso de tener algún gravamen es necesario regularizar dicho gravamen para poder continuar con su trámite.
      En caso de no tener adeudo, continua con el siguiente paso
    - Cubrir el importe de derechos
    - Se expide la certificación libre de gravamen
  notes: Se presenta el ciudadano en ventanilla, paga el importe de derechos correspondiente y se expide la certificación
    libre de gravamen
