result: Licencia
requirements:
- text: Solicitud firmada por el propietario (en caso de existir representante legal presentar documentación oficial
    que lo acredite como tal), por el director responsable de obra y corresponsable.
  cites:
  - source: remutys
  original_or_copy: original
- text: Recibo de pago de derechos.
  cites:
  - source: remutys
  original_or_copy: original
- text: Recibo de impuesto predial vigente.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Documento que acredite la propiedad.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Contrato de asociación en participación, cuando el condominio se conforme por lotes de diferentes propietarios
    o cuando las personas se unan con mismo fin (uno aporta tierra y otro dinero).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Memoria descriptiva.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Factibilidad de servicios (CESPT Y CFE) o contrato de servicios (recibos).
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Copia de INE del propietario
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Anuencia de vecinos colindantes.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
