title: Revisión y Aprobación del Programa Específico de Construcción (PEC)
summary: 'El objetivo de este trámite es validar que las edificaciones en proceso de construcción, remodelación
  o demolición cuenten con personal capacitado, así como con sus Subprogramas: de Prevención, de Auxilio y de Recuperación.
  Esto con la visión de salvaguardar la vida de las personas, así como proteger los bienes, la infraestructura y
  el medio ambiente.'
