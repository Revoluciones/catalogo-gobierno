  homoclave: TJ-SGM-0355
who_can:
- Interesado
when: Este trámite se realiza cuando el solicitante desea obtener la aprobación de su Programa Especifico de Construcción
  (PEC) por esta Dirección, el cual consiste en realizar una inspección documental de la carpeta, así como una inspección
  física en las instalaciones del solicitante, para validar que lo plasmado en su PEC coincida con lo inspeccionado
  en las instalaciones.
