- Interesado
when: Cuando se busca dividir legalmente un inmueble en unidades privadas y áreas comunes
result: Autorización.
requirements:
- text: Solicitud firmada por el (la) propietario (a), o su representante legal debidamente acreditado, así como
    las firmas del Director Responsable de Obra y del corresponsable
  cites:
  - source: remutys
  original_or_copy: original
- text: Recibo de pago de derechos
  cites:
  - source: remutys
  original_or_copy: original
- text: Certificado de libertad de gravamen fiscal con vigencia no mayor a 1 año (con sello de tesorería y junta
    de urbanización)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Certificado de libertad de gravamen hipotecario con antigüedad no mayor a 6 meses
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Avaluó certificado por Tesorería Municipal no mayor de un 1 año
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Memoria descriptiva del condómino
  cites:
  - source: remutys
  original_or_copy: original
- text: Licencia de construcción u oficio de conversión al régimen de propiedad en condominio.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Constancia de pago de equipamiento escolar
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Escrito en el que se compromete a presentar las fianzas que en derecho corresponden al momento de tramitar
    la traslación de dominio de las unidades resultantes (firmado por el propietario)
  cites:
  - source: remutys
  original_or_copy: original
- text: Sembrado autorizado C-2
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
