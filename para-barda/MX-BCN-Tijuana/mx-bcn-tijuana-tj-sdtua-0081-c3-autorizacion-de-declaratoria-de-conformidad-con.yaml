title: C3 Autorización de Declaratoria de Conformidad Constitución Régimen Propiedad en Condominio
summary: Autorización de declaratoria de conformidad constitución régimen propiedad en condominio derivado de una
  licencia autorizada, generando como resultado la constitución del régimen y su memoria descriptiva.
authority:
  name: Secretaría de Desarrollo Territorial y Urbano (Ayuntamiento de Tijuana)
  unit: Dirección de Administración Urbana
