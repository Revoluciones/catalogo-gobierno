cost:
  type: variable
  amount_mxn: null
  text: 'Dictamen de uso de suelo: Para desarrollos habitacionales, industriales, comerciales y de servicios, de
    acuerdo con la superficie total del predio, por dictamen, se pagara: Sobre predios de hasta 10,000.00 M² de
    superficie, mayores de 10,000.00 M² y de hasta 100,000.00 M² de superficie y mayores de 100,000.00 M² de superficie:
    53.17 UMA ($6,237.37) · Dictamen de uso de suelo: Por análisis y emisión de dictamen de uso de suelo; para factibilidad
    de uso y destino en predios habitacionales previo a la iniciación, se pagará por dictamen sobre predios: Análisis
    y dictamen de uso de suelo; para factibilidad de uso y destino habitacional hasta 120.00 m², mayor de 120.01
    m² y hasta 200.00 m², mayor de 200.01 m² y hasta 500.00 m² y mayor de 5,000.01 m²: 7.15 UMA ($838.77) · Dictamen
    de uso de suelo: Para factibilidad de predios, de uso industrial se pagará por predio, previo a la iniciación
    de trámites, por dictamen: Análisis y dictamen de uso de suelo; y destino industrial (Microindustria) hasta
    500.00 m², destino industrial hasta 500.01 m² hasta 1,000.00 m², 1,000.01 m² hasta 5,000.00 m² y mayor de 5,000.01
    m²: 27.89 UMA ($3,271.78) · Dictamen de uso de suelo: Por análisis y dictamen de uso de suelo para factibilidad
    de usos y destinos de predios comercial o servicios se pagará previo a la iniciación de trámites por dictamen
    sobre predios con superficie hasta 100.00 m², mayor de 100.01 m2 hasta 500.00 M², mayor de 500.01 m2 hasta 5,000.00
    m² y mayor de 5,000.01 m²: 17.88 UMA ($2,097.50) · Dictamen de uso de suelo: Por análisis y emisión de dictamen
    de uso de suelo para factibilidad y destinos de predios de ocupación de uso especial, se pagará previo a la
    iniciación de trámites, por dictamen con superficie menor a 200.00 m², ayor a 200.01 m² y destino especial para
    infraestructura en instalaciones subterráneas (líneas de gas) por metro lineal: 0.33 UMA ($38.71) · Dictamen
    de uso de suelo: Por análisis y emisión de dictamen de cambio de uso de suelo en predios de uso habitacional,
    industrial, comercial, especial o de servicios, debiendo presentar Opinión Técnica Favorable emitida por el
    Instituto Metropolitano de Planeación, previo a la iniciación de trámites, se pagará por dictamen: 52 UMA ($6,100.12)
    · Dictamen de uso de suelo: Por análisis y emisión de dictamen de uso de suelo para factibilidad de usos y destinos
    de predios para centros de apuestas, apuestas remotas, salas de sorteos de números y/o casinos, libro foráneo
    y similares con Hasta 3,000.00 M² de superficie y con superficie de 3,001.00 M² de terreno en adelante: 650
    UMA ($76,251.50) · Por concepto de dictamen de uso de suelo mixto, se modificará el costo 1.50 veces más, que
    un Dictamen de Uso de Suelo: $0.00. UMA 2026 = $117.31.'
