  para resolver: Se realizan visitas de campo para verificar, mediante inspección ocular, que las obras cuenten
  con el proyecto autorizado. Durante la revisión, constatan que los planos o licencias estén disponibles en el
  sitio y que las características físicas de la obra coincidan con la documentación presentada.'
