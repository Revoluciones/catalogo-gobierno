title: F5 Entrega - Recepción de Fraccionamientos
summary: Permite al urbanizador solicitar la entrega-recepción de las obras de urbanización concluidas, conforme
  a los proyectos aprobados, ya sea de forma parcial o total.
authority:
  name: Secretaría de Desarrollo Territorial y Urbano (Ayuntamiento de Tijuana)
  unit: Dirección de Administración Urbana
official_ids:
  homoclave: TJ-SDTUA-0107
who_can:
- Interesado
when: Al concluir parcial o totalmente las obras de urbanización conforme a los proyectos aprobados.
result: Acta
requirements:
- text: Llenar y firmar solicitud de la dirección de administración urbana (propietario o representante legal).
  cites:
  - source: remutys
  original_or_copy: original
- text: Recibo de pago de derechos
  cites:
  - source: remutys
  original_or_copy: original
- text: Copia de los contratos de donaciones inscritos en el registro público de la propiedad y comercio.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Reporte fotográfico del estado actual de la urbanización.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Relación de compra – venta realizada de la lotificación resultante.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Garantía por vicios ocultos de las obras de urbanización.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Expediente integrado, será enviado a DOIUM y DSPM (2 juegos copias de acuerdo publicado, planos de obra
    terminada y planos autorizados, planos digitalizados en archivos DWG AutoCAD.)
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Archivo digital de la información antes mencionada.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
