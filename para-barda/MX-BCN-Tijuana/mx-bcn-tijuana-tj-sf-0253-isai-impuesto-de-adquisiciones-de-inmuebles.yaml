notes: 'Copiado de REMUTyS (registro municipal de Tijuana). El registro no publica pasos; los requisitos sí. Para
  empezar: https://pagos.tijuana.gob.mx/ Criterio para resolver: El impuesto se calcula con base en el valor más
  alto entre: valor catastral, valor del avalúo y precio pactado en la operación (actualizado, en su caso). Los
  valores para el pago a realizar pueden ser consultados en otro formato disponible, el cual puede tomarse en cuenta
  como referencia por los valores ya establecidos en La Ley de Ingresos, para llevar acabo la realización de dicho
  impuesto.'
