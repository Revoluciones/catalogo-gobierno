title: ISAI (Impuesto de Adquisiciones de Inmuebles)
summary: Este impuesto se aplica a personas físicas y morales que adquieren bienes inmuebles ya sea el terreno o
  el terreno con construcciones adheridas o derechos reales sobre ellos, ubicados en el municipio. Es obligatorio
  para cualquier acto de compra de propiedad o derecho posesorio.
