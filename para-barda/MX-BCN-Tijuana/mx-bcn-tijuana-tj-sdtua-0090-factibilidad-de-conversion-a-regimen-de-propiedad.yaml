inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Negocios y trabajo, Infraestructura y vivienda
title: Factibilidad de Conversión a Régimen de Propiedad en Condominio con Licencia de Construcción
summary: Evaluar la viabilidad técnica, jurídica y urbanística para la conversión de inmuebles ya construidos al
  régimen de propiedad en condominio
authority:
  name: Secretaría de Desarrollo Territorial y Urbano (Ayuntamiento de Tijuana)
  unit: Dirección de Administración Urbana
official_ids:
  homoclave: TJ-SDTUA-0090
who_can:
- Interesado
when: Convertir inmuebles construidos al régimen de propiedad en condominio, regularizar su situación legal, garantizar
  el cumplimiento normativo y permitir la división o venta de unidades con derechos y obligaciones individuales.
result: Licencia
requirements:
- text: Solicitud firmada por el propietario. En caso de existir un representante legal, deberá presentar la documentación
    oficial que lo acredite como tal, así como la firma del director responsable de obra y el corresponsable
  cites:
  - source: remutys
  original_or_copy: original
- text: Contrato de asociación en participación, en los casos en que el condominio se conforme por lotes de diferentes
    propietarios o cuando las personas se unan con un mismo fin, donde uno aporte tierra y otro dinero.
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Recibo de pago de derechos.
  cites:
  - source: remutys
  original_or_copy: original
- text: Planta de conjunto que especifique las áreas privativas y comunes, incluyendo la lotificación y el sembrado
  cites:
  - source: remutys
  original_or_copy: original
- text: Plantas arquitectónicas y fachadas
  cites:
  - source: remutys
  original_or_copy: original
- text: Solicitud asignado nombre al condominio
  cites:
  - source: remutys
  original_or_copy: original
- text: Licencia de construcción
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Proyecto ejecutivo autorizado
  cites:
  - source: remutys
  original_or_copy: original
- text: Recibo de impuesto predial vigente
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Documentos que acrediten la propiedad o posesion del inmueble
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Dictamen de uso de suelo factible, únicamente en caso de licencias otorgadas en delegación
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
cost:
  type: variable
  amount_mxn: null
  text: 'En conjuntos de hasta diez unidades: 31.46 UMA ($3,690.57) · Por cada unidad que exceda de las diez primeras:
