title: Deslindes y/o Levantamiento
summary: El trámite de Deslinde y/o Levantamiento Catastral tiene como objetivo certificar las medidas y colindancias
  de los predios. El Deslinde requiere medición física del predio, mientras que el Levantamiento Topográfico se
  realiza utilizando documentación y planos de archivo. Certificación de deslindes y levantamientos urgentes pagarán
  adicionalmente sobre el costo del importe normal, un 200% más.
