id: mx-bcn-tijuana-tj-sdtua-0082-c4-autorizacion-traslacion-de-dominios
country: MX
jurisdiction: MX-BCN-Tijuana
inegi_code: '02004'
level: municipal
branch: ejecutivo
kind: tramite
category: Infraestructura y vivienda
title: C4 Autorización Traslación de Dominios
summary: Proceso legal y administrativo mediante el cual se transfiere la propiedad de un bien inmueble para la
  autorización de traslación de Dominios, para lo cual indispensable obtener la aprobación de la división de condominios
  con las fianzas correspondientes, que cubran tanto los posibles vicios ocultos como la correcta terminación de
  la obra.
authority:
  name: Secretaría de Desarrollo Territorial y Urbano (Ayuntamiento de Tijuana)
  unit: Dirección de Administración Urbana
official_ids:
  homoclave: TJ-SDTUA-0082
who_can:
- Interesado
when: Cuando se requiera transferir la propiedad de un inmueble para poder finalizar el proceso de venta de las
  viviendas
result: Autorización.
requirements:
- text: Solicitud firmada por el (la) propietario (a), o su representante legal debidamente acreditado, así como
    las firmas del Director Responsable de Obra y del corresponsable
  cites:
  - source: remutys
  original_or_copy: original
- text: Recibo de pago de derechos
  cites:
  - source: remutys
  original_or_copy: original
- text: Copia de la de la declaratoria de la constitución del condominio C-3
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Terminación de obra o presupuesto de obra faltante firmado por el perito director responsable de obra
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Constancia de cumplimiento F-4
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
- text: Fianza garantizando la terminación de obras faltantes, si las viviendas solicitadas no tienes terminación
    de obra
  cites:
  - source: remutys
  original_or_copy: original
- text: Fianza garantizando la buena calidad de las obras ejecutadas y la reparación de vicios ocultos y/o defectos
    en la construcción de áreas privativas y comunes
  cites:
  - source: remutys
  original_or_copy: original
- text: En caso de presentar parcialidades presentar planta de conjunto tamaño doble carta indicándolas unidades
    a solicitar
  cites:
  - source: remutys
  original_or_copy: 1 copia(s)
