# Cada término se explica una vez, en palabras de todos los días. Los procedimientos lo enlazan por su clave.
abuso-de-autoridad: 'Delito de un servidor público que usa su cargo para dañar a alguien: por ejemplo golpearlo, insultarlo o detenerlo sin causa, o negarse a atenderlo.'
acuerdo-reparatorio: Un trato entre la víctima y quien cometió el delito para pagar o reparar el daño. Si lo aprueba el Ministerio Público o un juez y se cumple, el caso penal se cierra.
afirmativa-ficta: Si la autoridad no te contesta en el plazo que marca la ley, su silencio cuenta como un sí.
ajustador: La persona que manda la aseguradora al lugar del choque para revisar qué pasó y abrir el trámite de pago.
amparo: Un juicio ante un juez federal para que una autoridad deje de violar tus derechos o haga lo que la ley le obliga a hacer.
archivo-temporal: 'Cuando el Ministerio Público guarda un caso porque no hay pistas para seguir investigando. No es definitivo: se reabre si aparecen datos nuevos.'
asesor-juridico: El abogado de la víctima en un caso penal. Si no puedes pagar uno, el Estado te lo da gratis.
asuntos-internos: La oficina de una policía o institución que investiga las quejas contra su propio personal y pide que lo sancionen.
bonificacion: Un descuento o saldo a favor que la empresa aplica en tu siguiente recibo.
calificacion: La decisión de la autoridad investigadora sobre si una falta es grave o no grave. De eso depende quién la juzga.
camara-de-origen: La Cámara (de Diputados o de Senadores) donde se presentó primero una propuesta de ley.
camara-revisora: La otra Cámara, que revisa lo que aprobó la primera.
carpeta-de-investigacion: 'El expediente donde la Fiscalía junta todo lo de tu caso: tu denuncia, las pruebas y lo que investiga. Como víctima puedes verla y pedir copia.'
caso-fortuito-o-fuerza-mayor: Algo que nadie pudo prever ni evitar, como un huracán o un terremoto. Si un daño viene de ahí, la empresa no tiene que pagarlo.
cohecho: Delito de pedir o aceptar dinero o favores para hacer o dejar de hacer algo del trabajo de gobierno. También comete cohecho quien ofrece el dinero.
comision: Grupo pequeño de legisladores que estudia un tema antes de que vote toda la Cámara.
conciliacion: Un arreglo entre quien se queja y la autoridad, con ayuda de la comisión de derechos humanos, para resolver el problema rápido sin llegar a una recomendación.
copia-certificada: Copia oficial de un documento, firmada y sellada por la autoridad, que vale como el original.
criterio-de-oportunidad: Cuando el Ministerio Público decide no perseguir un delito menor aunque pueda haberlo, por ejemplo porque ya se reparó el daño.
cuenta-publica: El informe anual del gobierno sobre cuánto dinero cobró, cuánto gastó y cuánto debe.
deducible: La parte del costo de un choque que pagas tú antes de que la aseguradora pague el resto.
denuncia: Avisar a la autoridad de un delito para que lo investigue. Cualquier persona que sepa del delito puede hacerlo.
derechos: En un trámite, el pago que cobra el gobierno por un servicio (no es un impuesto general).
dias-habiles: Días de trabajo de la oficina; no cuentan sábados, domingos ni días festivos.
dias-multa: 'La forma en que se calculan las multas penales: cada día multa equivale a lo que la persona gana en un día, dentro de los límites de la ley.'
dictamen-tecnico: El informe escrito de un técnico que revisa qué pasó y por qué. En una reclamación a CFE dice si el daño lo causó la red eléctrica.
dictamen: La opinión por escrito de una comisión sobre una propuesta de ley; recomienda aprobarla, cambiarla o rechazarla.
dof: Diario Oficial de la Federación, el periódico del gobierno donde se publican las leyes. Una ley no vale hasta que sale ahí.
entidad-fiscalizada: La dependencia, gobierno u organismo cuyo gasto se está revisando.
falta-administrativa: Cuando un servidor público no cumple sus obligaciones de trabajo, por ejemplo usar mal dinero público o pedir dinero por un trámite. Se sanciona con multas, suspensión o despido, no con cárcel.
fiscalizar: Revisar en qué se gastó el dinero público y si se gastó como dice la ley.
fuero-militar: Los tribunales del Ejército y la Marina. Solo juzgan faltas a la disciplina militar; cuando la víctima es una persona civil, el caso va a la justicia ordinaria.
homoclave: La clave única de un trámite en el registro oficial (por ejemplo BC-SGG-010). Sirve para citarlo sin confusión.
iniciativa: Una propuesta de ley o de cambio a una ley, presentada por escrito.
juez-de-control: 'El juez que vigila la investigación penal: autoriza ciertos actos y revisa si el Ministerio Público decidió bien al archivar o cerrar un caso.'
ley-de-ingresos: La ley anual que dice cuánto dinero va a cobrar el gobierno y de dónde.
mayoria-calificada: Una votación que necesita más que la mitad; en el Congreso casi siempre 2 de cada 3 votos.
medidas-de-proteccion: Órdenes para proteger a la víctima, por ejemplo prohibir que el agresor se acerque o se comunique con ella.
ministerio-publico: 'El fiscal: la persona de la Fiscalía que recibe denuncias, dirige la investigación y acusa ante el juez.'
minuta: El proyecto de ley que una Cámara aprobó y manda a la otra.
no-ejercicio-de-la-accion-penal: La decisión del Ministerio Público de cerrar un caso sin llevarlo ante un juez. Puedes pedir a un juez que la revise.
organo-interno-de-control: La oficina dentro de cada dependencia que vigila a su propio personal y recibe denuncias.
partida-secreta: Dinero del presupuesto sin decir en qué se gasta. La Constitución lo prohíbe.
perito: Especialista (médico, mecánico, ingeniero) que revisa algo y da su opinión técnica por escrito dentro de un caso.
pleno: La reunión de todos los integrantes de una Cámara, donde se vota.
presupuesto-de-egresos: El plan anual que dice en qué se va a gastar el dinero público.
queja-de-derechos-humanos: Pedir a una comisión de derechos humanos que revise si una autoridad te trató de forma injusta o violó tus derechos. No castiga, pero puede emitir una recomendación pública.
querella: Una denuncia que solo puede presentar la víctima, para delitos que la Fiscalía investiga únicamente si la víctima lo pide, como los daños en un choque sin alcohol.
ratificar: Confirmar en persona o con tu firma que lo que presentaste antes (una denuncia o una queja) es tuyo y es cierto.
recomendacion: El documento público con el que una comisión de derechos humanos dice qué violó una autoridad y qué debe hacer para repararlo. No obliga, pero si la autoridad no la acepta tiene que explicar por qué.
recurso-de-inconformidad: El escrito con el que quien denunció pide que se revise la decisión de considerar una falta como no grave, o de no sancionar.
registro-civil: La oficina que registra nacimientos, matrimonios, divorcios y defunciones y entrega sus actas.
servidor-publico: Cualquier persona que trabaja para el gobierno, desde una ventanilla hasta un secretario de Estado.
sindicatura: La oficina del ayuntamiento que vigila al gobierno municipal y a sus empleados, incluidos los policías, y recibe denuncias contra ellos.
uvie: Unidad de Verificación de Instalaciones Eléctricas, un especialista privado, aprobado por el gobierno, que revisa instalaciones eléctricas y puede dar una segunda opinión.
veto: Cuando el Ejecutivo regresa una ley al Congreso con objeciones en lugar de publicarla.
votacion-nominal: Votación en la que se registra el nombre de cada persona y cómo votó.
