# Cada término se explica una vez, en palabras de todos los días. Los procedimientos lo enlazan por su clave.
afirmativa-ficta: Si la autoridad no te contesta en el plazo que marca la ley, su silencio cuenta como un sí.
calificacion: La decisión de la autoridad investigadora sobre si una falta es grave o no grave. De eso depende quién la juzga.
camara-de-origen: La Cámara (de Diputados o de Senadores) donde se presentó primero una propuesta de ley.
camara-revisora: La otra Cámara, que revisa lo que aprobó la primera.
comision: Grupo pequeño de legisladores que estudia un tema antes de que vote toda la Cámara.
copia-certificada: Copia oficial de un documento, firmada y sellada por la autoridad, que vale como el original.
cuenta-publica: El informe anual del gobierno sobre cuánto dinero cobró, cuánto gastó y cuánto debe.
derechos: En un trámite, el pago que cobra el gobierno por un servicio (no es un impuesto general).
dias-habiles: Días de trabajo de la oficina; no cuentan sábados, domingos ni días festivos.
dictamen: La opinión por escrito de una comisión sobre una propuesta de ley; recomienda aprobarla, cambiarla o rechazarla.
dof: Diario Oficial de la Federación, el periódico del gobierno donde se publican las leyes. Una ley no vale hasta que sale ahí.
entidad-fiscalizada: La dependencia, gobierno u organismo cuyo gasto se está revisando.
falta-administrativa: Cuando un servidor público no cumple sus obligaciones de trabajo, por ejemplo usar mal dinero público o pedir dinero por un trámite. Se sanciona con multas, suspensión o despido, no con cárcel.
fiscalizar: Revisar en qué se gastó el dinero público y si se gastó como dice la ley.
homoclave: La clave única de un trámite en el registro oficial (por ejemplo BC-SGG-010). Sirve para citarlo sin confusión.
iniciativa: Una propuesta de ley o de cambio a una ley, presentada por escrito.
ley-de-ingresos: La ley anual que dice cuánto dinero va a cobrar el gobierno y de dónde.
mayoria-calificada: Una votación que necesita más que la mitad; en el Congreso casi siempre 2 de cada 3 votos.
minuta: El proyecto de ley que una Cámara aprobó y manda a la otra.
organo-interno-de-control: La oficina dentro de cada dependencia que vigila a su propio personal y recibe denuncias.
partida-secreta: Dinero del presupuesto sin decir en qué se gasta. La Constitución lo prohíbe.
pleno: La reunión de todos los integrantes de una Cámara, donde se vota.
presupuesto-de-egresos: El plan anual que dice en qué se va a gastar el dinero público.
recurso-de-inconformidad: El escrito con el que quien denunció pide que se revise la decisión de considerar una falta como no grave, o de no sancionar.
registro-civil: La oficina que registra nacimientos, matrimonios, divorcios y defunciones y entrega sus actas.
servidor-publico: Cualquier persona que trabaja para el gobierno, desde una ventanilla hasta un secretario de Estado.
veto: Cuando el Ejecutivo regresa una ley al Congreso con objeciones en lugar de publicarla.
votacion-nominal: Votación en la que se registra el nombre de cada persona y cómo votó.
