# Avisa en tareas en curso sin movimiento y las libera si nadie responde.
name: vencidos
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  vencidos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const DAY = 86400000, now = Date.now();
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', labels: 'en-curso' });
            for (const i of issues) {
              if (i.pull_request) continue;
              const idle = (now - new Date(i.updated_at)) / DAY;
              const warned = i.labels.some(l => l.name === 'aviso-vencido');
              const who = i.assignees.map(a => '@' + a.login).join(', ');
              if (!warned && idle >= 14) {
                await github.rest.issues.addLabels({ ...context.repo, issue_number: i.number, labels: ['aviso-vencido'] });
                await github.rest.issues.createComment({ ...context.repo, issue_number: i.number,
                  body: `${who} ¿sigues con esta tarea? Comenta cualquier avance para conservarla. Si en 7 días no hay respuesta, vuelve a quedar disponible.` });
              } else if (warned && idle >= 7) {
                await github.rest.issues.removeAssignees({ ...context.repo, issue_number: i.number, assignees: i.assignees.map(a => a.login) });
                for (const name of ['en-curso', 'aviso-vencido'])
                  await github.rest.issues.removeLabel({ ...context.repo, issue_number: i.number, name }).catch(() => {});
                await github.rest.issues.addLabels({ ...context.repo, issue_number: i.number, labels: ['disponible'] });
                await github.rest.issues.createComment({ ...context.repo, issue_number: i.number,
                  body: `Esta tarea vuelve a estar disponible. ${who}, gracias; si quieres retomarla, comenta /tomar.` });
              }
            }
